# Trivy Security Scanning Template for GitLab CI
# Include this in your .gitlab-ci.yml with:
# include:
#   - local: '/templates/gitlab-ci-trivy.yml'

variables:
  TRIVY_VERSION: "0.49.0"
  TRIVY_SEVERITY: "CRITICAL,HIGH"
  TRIVY_EXIT_CODE: "1"
  TRIVY_NO_PROGRESS: "true"

.trivy-base:
  image: docker:24-dind
  services:
    - docker:24-dind
  before_script:
    - apk add --no-cache curl
    - curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v${TRIVY_VERSION}

trivy-scan-image:
  extends: .trivy-base
  stage: security
  script:
    - trivy image --exit-code ${TRIVY_EXIT_CODE} --severity ${TRIVY_SEVERITY} --ignore-unfixed ${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHA}
  allow_failure: false
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

trivy-scan-filesystem:
  extends: .trivy-base
  stage: security
  script:
    - trivy fs --exit-code ${TRIVY_EXIT_CODE} --severity ${TRIVY_SEVERITY} --ignore-unfixed .
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

trivy-scan-config:
  extends: .trivy-base
  stage: security
  script:
    - trivy config --exit-code 0 --severity ${TRIVY_SEVERITY} .
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

trivy-sbom:
  extends: .trivy-base
  stage: security
  script:
    - trivy image --format cyclonedx --output sbom.json ${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHA}
  artifacts:
    paths:
      - sbom.json
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
