# Trivy Security Scanning Template for GitLab CI
# Include this in your .gitlab-ci.yml with:
# include:
#   - local: '/templates/gitlab-ci-trivy.yml'

variables:
  TRIVY_SEVERITY: "CRITICAL,HIGH"
  TRIVY_EXIT_CODE: "1"
  TRIVY_NO_PROGRESS: "true"

.trivy-base:
  image:
    name: aquasec/trivy:0.49.0
    entrypoint: [""]
  variables:
    TRIVY_USERNAME: "$CI_REGISTRY_USER"
    TRIVY_PASSWORD: "$CI_REGISTRY_PASSWORD"

trivy-scan-image:
  extends: .trivy-base
  stage: security
  script:
    - trivy image --exit-code ${TRIVY_EXIT_CODE} --severity ${TRIVY_SEVERITY} --ignore-unfixed ${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHA}
  allow_failure: false
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

trivy-scan-filesystem:
  extends: .trivy-base
  stage: security
  script:
    - trivy fs --exit-code ${TRIVY_EXIT_CODE} --severity ${TRIVY_SEVERITY} --ignore-unfixed .
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

trivy-scan-config:
  extends: .trivy-base
  stage: security
  script:
    - trivy config --exit-code 0 --severity ${TRIVY_SEVERITY} .
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

trivy-sbom:
  extends: .trivy-base
  stage: security
  script:
    - trivy image --format cyclonedx --output sbom.json ${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHA}
  artifacts:
    paths:
      - sbom.json
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
