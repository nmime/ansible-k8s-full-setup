- name: Set Elasticsearch variables
  set_fact:
    es_ns: '{{ es_namespace }}'
    es_ver: '{{ es_version }}'
    es_img: '{{ es_image }}:{{ es_version }}'
    kb_img: '{{ kibana_image }}:{{ kibana_version }}'
    es_cluster: '{{ es_cluster_name }}'
    es_password: '{{ es_superuser_password }}'
    es_master_storage_class_resolved: '{{ es_master_storage_class | default(storage_class | default("hcloud-volumes")) }}'
    es_data_storage_class_resolved: '{{ es_data_storage_class | default(storage_class | default("hcloud-volumes")) }}'
  no_log: true
- name: Create Elasticsearch namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: '{{ es_ns }}'
        labels:
          pod-security.kubernetes.io/enforce: baseline
          pod-security.kubernetes.io/enforce-version: latest
          pod-security.kubernetes.io/audit: restricted
          pod-security.kubernetes.io/audit-version: latest
          pod-security.kubernetes.io/warn: restricted
          pod-security.kubernetes.io/warn-version: latest
  register: _r_es_ns
  retries: 3
  delay: 10
  until: _r_es_ns is not failed
- name: Check if ES TLS secret exists
  no_log: true
  kubernetes.core.k8s_info:
    kind: Secret
    namespace: '{{ es_ns }}'
    name: es-tls-certs
  register: es_tls_check
- name: Create temp directory for ES TLS generation
  ansible.builtin.tempfile:
    state: directory
    prefix: es-tls-
  register: es_tls_tmpdir
  delegate_to: localhost
  when: es_tls_check.resources | length == 0
- name: Generate ES CA and node TLS certificates
  ansible.builtin.shell: |
    cd {{ es_tls_tmpdir.path }}
    openssl genrsa -out ca.key 4096
    openssl req -x509 -new -nodes -key ca.key -sha256 -days 3650 \
      -out ca.crt -subj "/CN=es-ca"
    openssl genrsa -out tls.key 2048
    cat > san.cnf <<'SANEOF'
    [req]
    req_extensions = v3_req
    distinguished_name = dn
    [dn]
    [v3_req]
    subjectAltName = DNS:*.es-master-headless.{{ es_ns }}.svc.cluster.local,DNS:*.es-data-headless.{{ es_ns }}.svc.cluster.local,DNS:es-master.{{ es_ns }}.svc.cluster.local,DNS:es-data.{{ es_ns }}.svc.cluster.local,DNS:elasticsearch.{{ es_ns }}.svc.cluster.local,DNS:localhost,IP:127.0.0.1
    SANEOF
    openssl req -new -key tls.key -out tls.csr -subj "/CN=elasticsearch" -config san.cnf
    openssl x509 -req -in tls.csr -CA ca.crt -CAkey ca.key -CAcreateserial \
      -out tls.crt -days 3650 -sha256 -extensions v3_req -extfile san.cnf
  delegate_to: localhost
  when: es_tls_check.resources | length == 0
- name: Read generated TLS files
  ansible.builtin.slurp:
    src: '{{ es_tls_tmpdir.path }}/{{ item }}'
  register: es_tls_files
  loop:
  - ca.crt
  - tls.crt
  - tls.key
  delegate_to: localhost
  when: es_tls_check.resources | length == 0
- name: Create ES TLS Secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: es-tls-certs
        namespace: '{{ es_ns }}'
      type: Opaque
      data:
        ca.crt: '{{ es_tls_files.results[0].content }}'
        tls.crt: '{{ es_tls_files.results[1].content }}'
        tls.key: '{{ es_tls_files.results[2].content }}'
        transport.crt: '{{ es_tls_files.results[1].content }}'
        transport.key: '{{ es_tls_files.results[2].content }}'
  when: es_tls_check.resources | length == 0
  no_log: true
  register: _r_tls_secret
  retries: 3
  delay: 10
  until: _r_tls_secret is not failed
- name: Clean up TLS temp directory
  ansible.builtin.file:
    path: '{{ es_tls_tmpdir.path }}'
    state: absent
  delegate_to: localhost
  when: es_tls_check.resources | length == 0
- name: Read the current Elasticsearch credentials before rotation
  no_log: true
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    namespace: '{{ es_ns }}'
    name: es-credentials
  register: _es_current_credentials
- name: Resolve the current Elasticsearch password before rotation
  no_log: true
  ansible.builtin.set_fact:
    _es_current_password: >-
      {{ (_es_current_credentials.resources[0].data.ELASTIC_PASSWORD | b64decode)
         if _es_current_credentials.resources | length > 0 else '' }}
- name: Detect an existing Elasticsearch master before password rotation
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: StatefulSet
    namespace: '{{ es_ns }}'
    name: es-master
  register: _es_master_before_password_rotation
- name: Wait for the existing Elasticsearch master before password rotation
  no_log: true
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: '{{ es_ns }}'
    name: es-master-0
  register: _es_master_pod_before_password_rotation
  until: >-
    (_es_master_pod_before_password_rotation.resources | default([])) | length > 0 and
    (_es_master_pod_before_password_rotation.resources[0].status.phase | default('')) == 'Running' and
    (_es_master_pod_before_password_rotation.resources[0].status.containerStatuses | default([])
      | selectattr('ready', 'equalto', true) | list | length) > 0
  retries: 60
  delay: 10
  when:
    - _es_current_password | length > 0
    - _es_current_password != es_password
    - _es_master_before_password_rotation.resources | length > 0
- name: Rotate the Elasticsearch elastic user before updating its Secret
  no_log: true
  ansible.builtin.shell: |
    set -euo pipefail
    payload=$(jq -cn --arg password "$ES_DESIRED_PASSWORD" '{password: $password}')
    printf '%s' "$payload" | kubectl exec -i -n "{{ es_ns }}" es-master-0 -c elasticsearch -- \
      sh -ec '
        payload=$(cat)
        if curl -fsk -u "elastic:${ELASTIC_PASSWORD}" \
          -H "Content-Type: application/json" -X POST \
          https://localhost:9200/_security/user/elastic/_password -d "$payload"; then
          exit 0
        fi
        desired=$(printf "%s" "$payload" | sed -n "s/.*\"password\":\"\([^\"]*\)\".*/\1/p")
        curl -fsk -u "elastic:${desired}" \
          https://localhost:9200/_security/_authenticate >/dev/null
      '
  args:
    executable: /bin/bash
  environment:
    ES_DESIRED_PASSWORD: '{{ es_password }}'
  changed_when: true
  when:
    - _es_current_password | length > 0
    - _es_current_password != es_password
    - _es_master_before_password_rotation.resources | length > 0
- name: Create ES credentials secret
  no_log: true
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: es-credentials
        namespace: '{{ es_ns }}'
      type: Opaque
      stringData:
        ELASTIC_PASSWORD: '{{ es_password }}'
        username: elastic
        password: '{{ es_password }}'
  register: _r_es_creds
  retries: 3
  delay: 10
  until: _r_es_creds is not failed
- name: Create ES master headless service
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: es-master-headless
        namespace: '{{ es_ns }}'
        labels:
          app: elasticsearch
          role: master
      spec:
        clusterIP: None
        publishNotReadyAddresses: true
        selector:
          app: elasticsearch
          role: master
        ports:
        - name: transport
          port: 9300
        - name: http
          port: 9200
  register: _r_master_svc
  retries: 3
  delay: 10
  until: _r_master_svc is not failed
- name: Create ES data headless service
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: es-data-headless
        namespace: '{{ es_ns }}'
        labels:
          app: elasticsearch
          role: data
      spec:
        clusterIP: None
        publishNotReadyAddresses: true
        selector:
          app: elasticsearch
          role: data
        ports:
        - name: transport
          port: 9300
        - name: http
          port: 9200
  register: _r_data_svc
  retries: 3
  delay: 10
  until: _r_data_svc is not failed
- name: Create ES client service (load-balanced)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: elasticsearch
        namespace: '{{ es_ns }}'
        labels:
          app: elasticsearch
      spec:
        type: ClusterIP
        selector:
          app: elasticsearch
        ports:
        - name: http
          port: 9200
          targetPort: 9200
        - name: transport
          port: 9300
          targetPort: 9300
  register: _r_client_svc
  retries: 3
  delay: 10
  until: _r_client_svc is not failed
- name: Build seed hosts list
  set_fact:
    es_seed_hosts: '{% set hosts = [] %}{% for i in range(0, es_master_replicas | int) %}{% if hosts.append("es-master-" ~ i ~ ".es-master-headless." ~ es_ns ~ ".svc.cluster.local") %}{% endif %}{% endfor %}{{ hosts | join(",") }}'
    es_initial_master_nodes: '{% set nodes = [] %}{% for i in range(0, es_master_replicas | int) %}{% if nodes.append("es-master-" ~ i) %}{% endif %}{% endfor %}{{ nodes | join(",") }}'
- name: Detect whether the Elasticsearch cluster has persistent master data
  kubernetes.core.k8s_info:
    api_version: v1
    kind: PersistentVolumeClaim
    namespace: '{{ es_ns }}'
    name: data-es-master-0
  register: _es_master_data_pvc
- name: Read the current Elasticsearch master StatefulSet storage contract
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: StatefulSet
    namespace: '{{ es_ns }}'
    name: es-master
  register: _es_existing_master_sts
- name: Resolve the current Elasticsearch master claim-template size
  ansible.builtin.set_fact:
    _es_existing_master_storage: >-
      {{
        _es_existing_master_sts.resources[0].spec.volumeClaimTemplates[0].spec.resources.requests.storage
        if _es_existing_master_sts.resources | length > 0 else ''
      }}
- name: Reject Elasticsearch master storage shrink attempts
  ansible.builtin.assert:
    that:
      - _es_existing_master_storage is match('^[1-9][0-9]*Gi$')
      - es_master_storage is match('^[1-9][0-9]*Gi$')
      - (es_master_storage | regex_replace('Gi$', '') | int) >= (_es_existing_master_storage | regex_replace('Gi$', '') | int)
    fail_msg: >-
      Refusing to shrink Elasticsearch master storage from
      {{ _es_existing_master_storage }} to {{ es_master_storage }}.
  when: _es_existing_master_storage | length > 0
- name: Expand existing Elasticsearch master claims before template reconciliation
  kubernetes.core.k8s:
    state: patched
    definition:
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: 'data-es-master-{{ item }}'
        namespace: '{{ es_ns }}'
      spec:
        resources:
          requests:
            storage: '{{ es_master_storage }}'
  loop: >-
    {{ range(0, _es_existing_master_sts.resources[0].spec.replicas | int) | list
       if _es_existing_master_sts.resources | length > 0 else [] }}
  when:
    - _es_existing_master_storage | length > 0
    - (es_master_storage | regex_replace('Gi$', '') | int) > (_es_existing_master_storage | regex_replace('Gi$', '') | int)
- name: Orphan Elasticsearch master pods and claims for immutable template growth
  kubernetes.core.k8s:
    state: absent
    api_version: apps/v1
    kind: StatefulSet
    namespace: '{{ es_ns }}'
    name: es-master
    delete_options:
      propagationPolicy: Orphan
    wait: true
  when:
    - _es_existing_master_storage | length > 0
    - _es_existing_master_storage != es_master_storage
- name: Deploy ES master StatefulSet
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: es-master
        namespace: '{{ es_ns }}'
        labels:
          app: elasticsearch
          role: master
      spec:
        serviceName: es-master-headless
        replicas: '{{ es_master_replicas | int }}'
        podManagementPolicy: Parallel
        updateStrategy:
          type: RollingUpdate
        selector:
          matchLabels:
            app: elasticsearch
            role: master
        template:
          metadata:
            annotations:
              platform.example.com/elasticsearch-credentials-hash: '{{ es_password | hash("sha256") }}'
            labels:
              app: elasticsearch
              role: master
          spec:
            # Production keeps the control plane tainted for general workloads,
            # but critical stateful replicas may use its reserved capacity when
            # a worker is drained or exhausts the CSI attachment limit.
            tolerations: '{{ [{"key": "node-role.kubernetes.io/control-plane", "operator": "Exists", "effect": "NoSchedule"}] if tier == "production" else [] }}'
            affinity:
              podAntiAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  - labelSelector:
                      matchLabels:
                        app: elasticsearch
                        role: master
                    topologyKey: kubernetes.io/hostname
            securityContext:
              fsGroup: 1000
              runAsUser: 1000
              runAsNonRoot: true
              seccompProfile:
                type: RuntimeDefault
            # Explicitly clear the legacy privileged sysctl init container;
            # vm.max_map_count is persisted on every node by Kubespray.
            initContainers: []
            containers:
            - name: elasticsearch
              image: '{{ es_img }}'
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                  - ALL
              ports:
              - containerPort: 9200
                name: http
              - containerPort: 9300
                name: transport
              env:
              - name: node.name
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.name
              - name: cluster.name
                value: '{{ es_cluster }}'
              - name: node.roles
                value: master
              - name: discovery.seed_hosts
                value: '{{ es_seed_hosts }}'
              - name: ELASTIC_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: es-credentials
                    key: ELASTIC_PASSWORD
              - name: xpack.security.enabled
                value: 'true'
              - name: xpack.security.http.ssl.enabled
                value: 'true'
              - name: xpack.security.http.ssl.certificate
                value: /usr/share/elasticsearch/config/certs/tls.crt
              - name: xpack.security.http.ssl.key
                value: /usr/share/elasticsearch/config/certs/tls.key
              - name: xpack.security.http.ssl.certificate_authorities
                value: /usr/share/elasticsearch/config/certs/ca.crt
              - name: xpack.security.transport.ssl.enabled
                value: 'true'
              - name: xpack.security.transport.ssl.verification_mode
                value: certificate
              - name: xpack.security.transport.ssl.certificate
                value: /usr/share/elasticsearch/config/certs/transport.crt
              - name: xpack.security.transport.ssl.key
                value: /usr/share/elasticsearch/config/certs/transport.key
              - name: xpack.security.transport.ssl.certificate_authorities
                value: /usr/share/elasticsearch/config/certs/ca.crt
              - name: xpack.license.self_generated.type
                value: 'basic'
              - name: ES_JAVA_OPTS
                value: -Xms{{ es_master_heap }} -Xmx{{ es_master_heap }}
              - name: bootstrap.memory_lock
                value: 'false'
              resources:
                requests:
                  cpu: '{{ es_master_cpu_req }}'
                  memory: '{{ es_master_memory_req }}'
                limits:
                  cpu: '{{ es_master_cpu_lim }}'
                  memory: '{{ es_master_memory_lim }}'
              volumeMounts:
              - name: data
                mountPath: /usr/share/elasticsearch/data
              - name: certs
                mountPath: /usr/share/elasticsearch/config/certs
                readOnly: true
              readinessProbe:
                exec:
                  command:
                  - bash
                  - -c
                  - |
                    curl -fsSk -u "elastic:$ELASTIC_PASSWORD" https://localhost:9200/_cluster/health?local=true
                initialDelaySeconds: 30
                periodSeconds: 10
                timeoutSeconds: 5
              startupProbe:
                exec:
                  command:
                  - bash
                  - -c
                  - |
                    curl -fsSk -u "elastic:$ELASTIC_PASSWORD" https://localhost:9200/_cluster/health?local=true
                periodSeconds: 15
                timeoutSeconds: 10
                failureThreshold: 40
              livenessProbe:
                exec:
                  command:
                  - bash
                  - -c
                  - |
                    curl -fsSk -u "elastic:$ELASTIC_PASSWORD" https://localhost:9200/_cluster/health?local=true
                periodSeconds: 30
                timeoutSeconds: 10
            volumes:
            - name: certs
              secret:
                secretName: es-tls-certs
        volumeClaimTemplates:
        - metadata:
            name: data
          spec:
            accessModes:
            - ReadWriteOnce
            storageClassName: '{{ es_master_storage_class_resolved }}'
            resources:
              requests:
                storage: '{{ es_master_storage }}'
  register: _r_master_sts
  retries: 3
  delay: 15
  until: _r_master_sts is not failed
- name: Add the one-time Elasticsearch bootstrap node list for a new cluster
  ansible.builtin.command:
    argv:
      - kubectl
      - set
      - env
      - statefulset/es-master
      - -n
      - '{{ es_ns }}'
      - cluster.initial_master_nodes={{ es_initial_master_nodes }}
  when: _es_master_data_pvc.resources | length == 0
  register: _r_add_es_bootstrap_nodes
  changed_when: true
- name: Read the current Elasticsearch data StatefulSet storage contract
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: StatefulSet
    namespace: '{{ es_ns }}'
    name: es-data
  register: _es_existing_data_sts
- name: Resolve the current Elasticsearch data claim-template size
  ansible.builtin.set_fact:
    _es_existing_data_storage: >-
      {{
        _es_existing_data_sts.resources[0].spec.volumeClaimTemplates[0].spec.resources.requests.storage
        if _es_existing_data_sts.resources | length > 0 else ''
      }}
- name: Reject Elasticsearch data storage shrink attempts
  ansible.builtin.assert:
    that:
      - _es_existing_data_storage is match('^[1-9][0-9]*Gi$')
      - es_data_storage is match('^[1-9][0-9]*Gi$')
      - (es_data_storage | regex_replace('Gi$', '') | int) >= (_es_existing_data_storage | regex_replace('Gi$', '') | int)
    fail_msg: >-
      Refusing to shrink Elasticsearch data storage from
      {{ _es_existing_data_storage }} to {{ es_data_storage }}.
  when: _es_existing_data_storage | length > 0
- name: Expand existing Elasticsearch data claims before template reconciliation
  kubernetes.core.k8s:
    state: patched
    definition:
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: 'data-es-data-{{ item }}'
        namespace: '{{ es_ns }}'
      spec:
        resources:
          requests:
            storage: '{{ es_data_storage }}'
  loop: >-
    {{ range(0, _es_existing_data_sts.resources[0].spec.replicas | int) | list
       if _es_existing_data_sts.resources | length > 0 else [] }}
  when:
    - _es_existing_data_storage | length > 0
    - (es_data_storage | regex_replace('Gi$', '') | int) > (_es_existing_data_storage | regex_replace('Gi$', '') | int)
- name: Orphan Elasticsearch data pods and claims for immutable template growth
  kubernetes.core.k8s:
    state: absent
    api_version: apps/v1
    kind: StatefulSet
    namespace: '{{ es_ns }}'
    name: es-data
    delete_options:
      propagationPolicy: Orphan
    wait: true
  when:
    - _es_existing_data_storage | length > 0
    - _es_existing_data_storage != es_data_storage
- name: Deploy ES data StatefulSet
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: es-data
        namespace: '{{ es_ns }}'
        labels:
          app: elasticsearch
          role: data
      spec:
        serviceName: es-data-headless
        replicas: '{{ es_data_replicas | int }}'
        podManagementPolicy: Parallel
