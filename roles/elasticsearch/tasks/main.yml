                  - -c
                  - |
                    curl -fsSk -u "elastic:$ELASTIC_PASSWORD" https://localhost:9200/_cluster/health?local=true
                periodSeconds: 30
                timeoutSeconds: 10
            volumes:
            - name: certs
              secret:
                secretName: es-tls-certs
        volumeClaimTemplates:
        - metadata:
            name: data
          spec:
            accessModes:
            - ReadWriteOnce
            storageClassName: '{{ es_data_storage_class_resolved }}'
            resources:
              requests:
                storage: '{{ es_data_storage }}'
  register: _r_data_sts
  retries: 3
  delay: 15
  until: _r_data_sts is not failed
- name: Remove unsupported Basic-license audit settings from existing Elasticsearch pods
  ansible.builtin.shell: |
    set -euo pipefail
    changed=false
    for sts in es-master es-data; do
      if kubectl get statefulset "$sts" -n {{ es_ns | quote }} -o json \
        | jq -e '.spec.template.spec.containers[0].env // [] | any(.name == "xpack.security.audit.enabled" or .name == "xpack.security.audit.logfile.events.include")' \
        >/dev/null; then
        kubectl set env statefulset/"$sts" -n {{ es_ns | quote }} \
          xpack.security.audit.enabled- xpack.security.audit.logfile.events.include- >/dev/null
        changed=true
      fi
    done
    echo "changed=$changed"
  args:
    executable: /bin/bash
  register: es_audit_setting_cleanup
  changed_when: "'changed=true' in es_audit_setting_cleanup.stdout"
- name: Wait for ES master pods to be ready
  kubernetes.core.k8s_info:
    kind: StatefulSet
    namespace: '{{ es_ns }}'
    name: es-master
  register: es_master_sts
  until: >-
    (es_master_sts.resources | default([])) | length > 0 and (es_master_sts.resources[0].status.readyReplicas | default(0) | int) >= (es_master_replicas | int)
  retries: 60
  delay: 15
- name: Detect the Elasticsearch bootstrap setting after cluster formation
  ansible.builtin.set_fact:
    _es_bootstrap_setting_present: >-
      {{
        es_master_sts.resources[0].spec.template.spec.containers[0].env
        | selectattr('name', 'equalto', 'cluster.initial_master_nodes')
        | list | length > 0
      }}
- name: Remove the one-time Elasticsearch bootstrap node list
  ansible.builtin.command:
    argv:
      - kubectl
      - set
      - env
      - statefulset/es-master
      - -n
      - '{{ es_ns }}'
      - cluster.initial_master_nodes-
  when: _es_bootstrap_setting_present | bool
  register: _r_remove_es_bootstrap_nodes
  changed_when: true
- name: Wait for ES masters after removing the bootstrap setting
  kubernetes.core.k8s_info:
    kind: StatefulSet
    namespace: '{{ es_ns }}'
    name: es-master
  register: _es_master_post_bootstrap_cleanup
  until: >-
    (_es_master_post_bootstrap_cleanup.resources | default([])) | length > 0 and
    (_es_master_post_bootstrap_cleanup.resources[0].status.readyReplicas | default(0) | int) >= (es_master_replicas | int) and
    (_es_master_post_bootstrap_cleanup.resources[0].status.updatedReplicas | default(0) | int) >= (es_master_replicas | int)
  retries: 60
  delay: 15
  when: _es_bootstrap_setting_present | bool
- name: Wait for ES data pods to be ready
  kubernetes.core.k8s_info:
    kind: StatefulSet
    namespace: '{{ es_ns }}'
    name: es-data
  register: es_data_sts
  until: >-
    (es_data_sts.resources | default([])) | length > 0 and (es_data_sts.resources[0].status.readyReplicas | default(0) | int) >= (es_data_replicas | int)
  retries: 60
  delay: 15
- name: Require green Elasticsearch cluster health after data-node reconciliation
  no_log: true
  ansible.builtin.command:
    argv:
      - kubectl
      - exec
      - -n
      - '{{ es_ns }}'
      - es-master-0
      - -c
      - elasticsearch
      - --
      - sh
      - -ec
      - >-
        curl -fsk -u "elastic:${ELASTIC_PASSWORD}"
        "https://localhost:9200/_cluster/health?wait_for_status=green&timeout=30s"
  register: _r_es_green_health
  changed_when: false
  retries: 12
  delay: 10
  until:
    - (_r_es_green_health.stdout | from_json).status == 'green'
    - not ((_r_es_green_health.stdout | from_json).timed_out | bool)
    - (_r_es_green_health.stdout | from_json).unassigned_shards | int == 0
- name: Reconcile the least-privilege logging ingest role and user
  no_log: true
  ansible.builtin.shell: |
    set -euo pipefail
    role_payload=$(jq -cn '{
      cluster: ["monitor", "manage_ilm", "manage_index_templates"],
      indices: [{
        names: ["filebeat-*", "fluentd-*"],
        privileges: ["auto_configure", "create_doc", "create_index", "manage", "view_index_metadata"]
      }]
    }')
    user_payload=$(jq -cn --arg password "$LOGGING_INGEST_PASSWORD" '{
      password: $password,
      roles: ["platform_logging_ingest"],
      full_name: "Platform logging ingest"
    }')
    printf '%s' "$role_payload" | kubectl exec -i -n "{{ es_ns }}" es-master-0 -c elasticsearch -- \
      sh -ec 'curl -fsk -u "elastic:${ELASTIC_PASSWORD}" -H "Content-Type: application/json" \
        -X PUT https://localhost:9200/_security/role/platform_logging_ingest --data-binary @- >/dev/null'
    printf '%s' "$user_payload" | kubectl exec -i -n "{{ es_ns }}" es-master-0 -c elasticsearch -- \
      sh -ec 'curl -fsk -u "elastic:${ELASTIC_PASSWORD}" -H "Content-Type: application/json" \
        -X PUT https://localhost:9200/_security/user/platform_logging_ingest --data-binary @- >/dev/null'
  args:
    executable: /bin/bash
  environment:
    LOGGING_INGEST_PASSWORD: '{{ es_logging_ingest_password }}'
  register: _r_logging_ingest_principal
  retries: 6
  delay: 10
  until: _r_logging_ingest_principal is not failed
  when: log_stack | default('elk') in ['elk', 'efk']
- name: Persist dedicated logging ingest credentials
  no_log: true
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: logging-ingest-credentials
        namespace: '{{ es_ns }}'
      type: Opaque
      stringData:
        username: platform_logging_ingest
        password: '{{ es_logging_ingest_password }}'
  when: log_stack | default('elk') in ['elk', 'efk']
- name: Remove the logging ingest principal when Elasticsearch logging is deselected
  no_log: true
  ansible.builtin.shell: |
    set -euo pipefail
    for endpoint in \
      _security/user/platform_logging_ingest \
      _security/role/platform_logging_ingest; do
      status=$(kubectl exec -n "{{ es_ns }}" es-master-0 -c elasticsearch -- \
        sh -ec 'curl -sk -o /dev/null -w "%{http_code}" -u "elastic:${ELASTIC_PASSWORD}" \
          -X DELETE "https://localhost:9200/$1"' -- "$endpoint")
      case "$status" in
        200|404) ;;
        *) printf 'unexpected Elasticsearch delete status %s for %s\n' "$status" "$endpoint" >&2; exit 1 ;;
      esac
    done
  args:
    executable: /bin/bash
  register: _r_remove_logging_ingest_principal
  retries: 6
  delay: 10
  until: _r_remove_logging_ingest_principal is not failed
  when: log_stack | default('elk') not in ['elk', 'efk']
- name: Remove stored logging ingest credentials when Elasticsearch logging is deselected
  no_log: true
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Secret
    namespace: '{{ es_ns }}'
    name: logging-ingest-credentials
  when: log_stack | default('elk') not in ['elk', 'efk']
- name: Read the Kibana service-account token secret
  no_log: true
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    namespace: '{{ es_ns }}'
    name: kibana-service-token
  register: _kibana_service_token_secret

- name: Remove an orphaned Kibana service-account token
  ansible.builtin.command:
    argv:
      - kubectl
      - exec
      - -n
      - '{{ es_ns }}'
      - es-master-0
      - -c
      - elasticsearch
      - --
      - bash
      - -ec
      - >-
        curl -sk -u "elastic:$ELASTIC_PASSWORD" -X DELETE
        https://localhost:9200/_security/service/elastic/kibana/credential/token/platform
        >/dev/null || true
  no_log: true
  register: _kibana_service_token_delete
  retries: 6
  delay: 10
  until: _kibana_service_token_delete is not failed
  when: _kibana_service_token_secret.resources | length == 0

- name: Create the Kibana service-account token
  ansible.builtin.command:
    argv:
      - kubectl
      - exec
      - -n
      - '{{ es_ns }}'
      - es-master-0
      - -c
      - elasticsearch
      - --
      - bash
      - -ec
      - >-
        curl -fsk -u "elastic:$ELASTIC_PASSWORD" -X POST
        https://localhost:9200/_security/service/elastic/kibana/credential/token/platform
  register: _kibana_service_token_create
  no_log: true
  retries: 6
  delay: 10
  until: _kibana_service_token_create is not failed
  when: _kibana_service_token_secret.resources | length == 0

- name: Persist the Kibana service-account token
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: kibana-service-token
        namespace: '{{ es_ns }}'
      type: Opaque
      stringData:
        token: '{{ (_kibana_service_token_create.stdout | from_json).token.value }}'
  no_log: true
  when: _kibana_service_token_secret.resources | length == 0

- name: Read the Kibana encryption-key secret
  no_log: true
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    namespace: '{{ es_ns }}'
    name: kibana-encryption-keys
  register: _kibana_encryption_keys

- name: Create stable Kibana encryption keys
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: kibana-encryption-keys
        namespace: '{{ es_ns }}'
      type: Opaque
      stringData:
        security: '{{ lookup("password", "/dev/null length=64 chars=ascii_letters,digits") }}'
        saved-objects: '{{ lookup("password", "/dev/null length=64 chars=ascii_letters,digits") }}'
        reporting: '{{ lookup("password", "/dev/null length=64 chars=ascii_letters,digits") }}'
  no_log: true
  when: _kibana_encryption_keys.resources | length == 0

- name: Read the existing Kibana Deployment
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    namespace: '{{ es_ns }}'
    name: kibana
  register: _existing_kibana_deployment

- name: Remove legacy Kibana superuser environment variables
  ansible.builtin.command:
    argv:
      - kubectl
      - set
      - env
      - deployment/kibana
      - -n
      - '{{ es_ns }}'
      - ELASTICSEARCH_USERNAME-
      - ELASTICSEARCH_PASSWORD-
  register: _remove_kibana_superuser_env
  changed_when: "'env updated' in _remove_kibana_superuser_env.stdout"
  when: _existing_kibana_deployment.resources | length > 0

- name: Atomically switch Kibana from RollingUpdate to Recreate
  ansible.builtin.command:
    argv:
      - kubectl
      - patch
      - deployment/kibana
      - -n
      - '{{ es_ns }}'
      - --type=json
      - -p
      - '[{"op":"remove","path":"/spec/strategy/rollingUpdate"},{"op":"replace","path":"/spec/strategy/type","value":"Recreate"}]'
  when:
    - _existing_kibana_deployment.resources | length > 0
    - _existing_kibana_deployment.resources[0].spec.strategy.rollingUpdate is defined

- name: Deploy Kibana
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: kibana
        namespace: '{{ es_ns }}'
        labels:
          app: kibana
      spec:
        replicas: '{{ kibana_replicas | int }}'
        strategy:
          type: Recreate
        progressDeadlineSeconds: 1800
        selector:
          matchLabels:
            app: kibana
        template:
          metadata:
            labels:
              app: kibana
          spec:
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
              fsGroup: 1000
              seccompProfile:
                type: RuntimeDefault
            containers:
            - name: kibana
              image: '{{ kb_img }}'
              ports:
              - containerPort: 5601
                name: http
              env:
              - name: ELASTICSEARCH_HOSTS
                value: https://elasticsearch.{{ es_ns }}.svc.cluster.local:9200
              - name: ELASTICSEARCH_SERVICEACCOUNTTOKEN
                valueFrom:
                  secretKeyRef:
                    name: kibana-service-token
                    key: token
              - name: XPACK_SECURITY_ENCRYPTIONKEY
                valueFrom:
                  secretKeyRef:
                    name: kibana-encryption-keys
                    key: security
              - name: XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY
                valueFrom:
                  secretKeyRef:
                    name: kibana-encryption-keys
                    key: saved-objects
              - name: XPACK_REPORTING_ENCRYPTIONKEY
                valueFrom:
                  secretKeyRef:
                    name: kibana-encryption-keys
                    key: reporting
              - name: XPACK_SECURITY_SECURECOOKIES
                value: 'true'
              - name: ELASTICSEARCH_SSL_CERTIFICATEAUTHORITIES
                value: /usr/share/kibana/config/certs/ca.crt
              - name: SERVER_HOST
                value: 0.0.0.0
              - name: SERVER_PUBLICBASEURL
                value: https://{{ es_kibana_domain }}
              resources:
                requests:
                  cpu: '{{ kibana_cpu_req }}'
                  memory: '{{ kibana_memory_req }}'
                limits:
                  cpu: '{{ kibana_cpu_lim }}'
                  memory: '{{ kibana_memory_lim }}'
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
              volumeMounts:
              - name: certs
                mountPath: /usr/share/kibana/config/certs
                readOnly: true
              readinessProbe:
                httpGet:
                  path: /api/status
                  port: 5601
                initialDelaySeconds: 30
                periodSeconds: 10
              startupProbe:
                httpGet:
                  path: /api/status
                  port: 5601
                periodSeconds: 15
                timeoutSeconds: 10
                failureThreshold: 80
              livenessProbe:
                httpGet:
                  path: /api/status
                  port: 5601
                periodSeconds: 30
            volumes:
            - name: certs
              secret:
                secretName: es-tls-certs
                items:
                - key: ca.crt
                  path: ca.crt
  register: _r_kibana
  retries: 3
  delay: 15
  until: _r_kibana is not failed
- name: Create Kibana service
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: kibana
        namespace: '{{ es_ns }}'
      spec:
        type: ClusterIP
        selector:
          app: kibana
        ports:
        - name: http
          port: 5601
          targetPort: 5601
  register: _r_kibana_svc
  retries: 3
  delay: 10
  until: _r_kibana_svc is not failed
- name: Create Kibana HTTPRoute (VPN-only via admin-gateway)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: kibana
        namespace: '{{ es_ns }}'
      spec:
        parentRefs:
        - name: admin-gateway
          namespace: cilium-system
          sectionName: https
        hostnames:
        - '{{ es_kibana_domain }}'
        rules:
        - matches:
          - path:
              type: PathPrefix
              value: /
          backendRefs:
          - name: kibana
            port: 5601
  register: _r_kibana_httproute
  retries: 3
  delay: 10
  until: _r_kibana_httproute is not failed
- name: Create PDB for ES masters
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata:
        name: es-master-pdb
        namespace: '{{ es_ns }}'
      spec:
        maxUnavailable: 1
        selector:
          matchLabels:
            app: elasticsearch
            role: master
  when: es_master_replicas | int > 1
  register: _r_master_pdb
  retries: 3
  delay: 10
  until: _r_master_pdb is not failed
- name: Create PDB for ES data nodes
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata:
        name: es-data-pdb
        namespace: '{{ es_ns }}'
      spec:
        maxUnavailable: 1
        selector:
          matchLabels:
            app: elasticsearch
            role: data
  when: es_data_replicas | int > 1
  register: _r_data_pdb
  retries: 3
  delay: 10
  until: _r_data_pdb is not failed
- name: Create ES NetworkPolicy
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: es-allow-internal
        namespace: '{{ es_ns }}'
      spec:
        podSelector:
          matchLabels:
            app: elasticsearch
        policyTypes:
        - Ingress
        ingress:
        - from:
          - podSelector:
              matchLabels:
                app: elasticsearch
          ports:
          - port: 9300
            protocol: TCP
        - from:
          - podSelector:
              matchLabels:
                app: kibana
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: temporal
          ports:
          - port: 9200
            protocol: TCP
  register: _r_es_netpol
  retries: 3
  delay: 10
  until: _r_es_netpol is not failed
- name: Display Elasticsearch deployment summary
  debug:
    msg:
    - "=========================================="
    - "  Elasticsearch {{ es_ver }} Deployed (Basic License)"
    - "=========================================="
    - "  Cluster: {{ es_cluster }}"
    - "  Masters: {{ es_master_replicas }}"
    - "  Data nodes: {{ es_data_replicas }}"
    - "  License: {{ es_license_type }}"
    - "  Endpoint: https://elasticsearch.{{ es_ns }}.svc.cluster.local:9200"
    - "  Kibana: https://{{ es_kibana_domain }}"
    - "  Kibana auth: elastic/kibana service account token"
    - "  Elasticsearch admin: elastic / (from es-credentials secret)"
    - "=========================================="
- name: Remove legacy Filebeat-only Elasticsearch ingress policy
  kubernetes.core.k8s:
    state: absent
    definition:
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: allow-filebeat-to-es
        namespace: '{{ es_ns }}'
- name: Remove logging-agent Elasticsearch ingress when Elasticsearch logging is deselected
  kubernetes.core.k8s:
    state: absent
    definition:
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: allow-logging-agents-to-es
        namespace: '{{ es_ns }}'
  when: log_stack | default('elk') not in ['elk', 'efk']
- name: Create CiliumNetworkPolicy for logging agents to Elasticsearch
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: allow-logging-agents-to-es
        namespace: '{{ es_ns }}'
      spec:
        description: Allow the selected node logging agent to push logs to Elasticsearch
        endpointSelector:
          matchLabels:
            app: elasticsearch
        ingress:
        - fromEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: logging-agents
          toPorts:
          - ports:
            - port: '9200'
              protocol: TCP
  when: log_stack | default('elk') in ['elk', 'efk']
  register: _r_create_filebeat_cnp
  retries: 3
  delay: 10
  until: _r_create_filebeat_cnp is not failed
