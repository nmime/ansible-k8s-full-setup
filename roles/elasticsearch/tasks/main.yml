            affinity:
              podAntiAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  - labelSelector:
                      matchLabels:
                        app: elasticsearch
                        role: data
                    topologyKey: kubernetes.io/hostname
            securityContext:
              fsGroup: 1000
