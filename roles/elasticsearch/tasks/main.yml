---
# Elasticsearch 9.x with X-Pack Platinum Crack (ELKrack method)
# Architecture: StatefulSet master + data nodes, init container builds cracked JAR
# TLS inter-node + HTTPS, Kibana with Ingress

- name: Set Elasticsearch variables
  set_fact:
    es_ns: "{{ es_namespace }}"
    es_ver: "{{ es_version }}"
    es_img: "{{ es_image }}:{{ es_version }}"
    kb_img: "{{ kibana_image }}:{{ kibana_version }}"
    es_cluster: "{{ es_cluster_name }}"
    es_password: "{{ saved_secrets.es_superuser_password | default(lookup('ansible.builtin.password', '/dev/null length=24 chars=ascii_letters,digits')) }}"
    storage_class: "{{ storage_class | default('hcloud-volumes') }}"

- name: Create Elasticsearch namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ es_ns }}"
        labels:
          pod-security.kubernetes.io/enforce: baseline
          pod-security.kubernetes.io/warn: restricted
  register: _r_es_ns
  retries: 3
  delay: 10
  until: _r_es_ns is not failed

# ============================================
# TLS certificates for inter-node + HTTPS
# ============================================

- name: Generate ES TLS certificates
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: es-tls-setup
        namespace: "{{ es_ns }}"
      spec:
        ttlSecondsAfterFinished: 300
        template:
          spec:
            restartPolicy: Never
            containers:
              - name: cert-gen
                image: "{{ es_img }}"
                command:
                  - bash
                  - -c
                  - |
                    if [ -f /certs/transport.p12 ]; then
                      echo "Certs already exist, skipping"
                      exit 0
                    fi
                    cd /tmp
                    elasticsearch-certutil ca --silent --pem --out /tmp/ca.zip
                    unzip /tmp/ca.zip
                    elasticsearch-certutil cert --silent --pem \
                      --ca-cert /tmp/ca/ca.crt --ca-key /tmp/ca/ca.key \
                      --dns "*.es-master-headless.{{ es_ns }}.svc.cluster.local,*.es-data-headless.{{ es_ns }}.svc.cluster.local,es-master.{{ es_ns }}.svc.cluster.local,es-data.{{ es_ns }}.svc.cluster.local,localhost" \
                      --ip "127.0.0.1" \
                      --out /tmp/certs.zip
                    unzip /tmp/certs.zip
                    cp /tmp/ca/ca.crt /certs/ca.crt
                    cp /tmp/instance/instance.crt /certs/tls.crt
                    cp /tmp/instance/instance.key /certs/tls.key
                    elasticsearch-certutil cert --silent --pass "" --pem \
                      --ca-cert /tmp/ca/ca.crt --ca-key /tmp/ca/ca.key \
                      --dns "*.es-master-headless.{{ es_ns }}.svc.cluster.local,*.es-data-headless.{{ es_ns }}.svc.cluster.local" \
                      --out /tmp/transport.zip
                    unzip /tmp/transport.zip -d /tmp/transport
                    cp /tmp/transport/instance/instance.crt /certs/transport.crt
                    cp /tmp/transport/instance/instance.key /certs/transport.key
                    echo "TLS certs generated successfully"
                volumeMounts:
                  - name: certs
                    mountPath: /certs
                securityContext:
                  runAsUser: 1000
            volumes:
              - name: certs
                persistentVolumeClaim:
                  claimName: es-tls-certs
  register: _r_tls_job
  retries: 3
  delay: 10
  until: _r_tls_job is not failed

- name: Create TLS certs PVC
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: es-tls-certs
        namespace: "{{ es_ns }}"
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: "{{ storage_class }}"
        resources:
          requests:
            storage: 1Gi
  register: _r_tls_pvc
  retries: 3
  delay: 10
  until: _r_tls_pvc is not failed

- name: Wait for TLS job to complete
  kubernetes.core.k8s_info:
    kind: Job
    namespace: "{{ es_ns }}"
    name: es-tls-setup
  register: tls_job_status
  until: >
    tls_job_status.resources | length > 0 and
    (tls_job_status.resources[0].status.succeeded | default(0) | int) >= 1
  retries: 60
  delay: 10

# ============================================
# Crack script ConfigMap + License
# ============================================

- name: Create crack build script ConfigMap
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: es-crack-script
        namespace: "{{ es_ns }}"
      data:
        build_crack_jar.sh: |
          #!/bin/bash
          set -e
          VERSION="{{ es_ver }}"
          v=( ${VERSION//./ } )
          branch="${v[0]}.${v[1]}"

          JAVAC="/usr/share/elasticsearch/jdk/bin/javac"
          JAR="/usr/share/elasticsearch/jdk/bin/jar"

          if [ -f /crack-output/x-pack-core-$VERSION.jar ]; then
            echo "Crack JAR already exists, skipping build"
            exit 0
          fi

          mkdir -p /tmp/crack && cd /tmp/crack

          curl -fsSL -o License.java \
            "https://raw.githubusercontent.com/elastic/elasticsearch/$branch/x-pack/plugin/core/src/main/java/org/elasticsearch/license/License.java"
          curl -fsSL -o LicenseVerifier.java \
            "https://raw.githubusercontent.com/elastic/elasticsearch/$branch/x-pack/plugin/core/src/main/java/org/elasticsearch/license/LicenseVerifier.java"
          curl -fsSL -o TransportXPackInfoAction.java \
            "https://raw.githubusercontent.com/elastic/elasticsearch/refs/heads/$branch/x-pack/plugin/core/src/main/java/org/elasticsearch/xpack/core/action/TransportXPackInfoAction.java"

          sed -i '/void validate()/{h;s/validate/validate2/;x;G}' License.java
          sed -i '/void validate()/ s/$/}/' License.java
          sed -i '/boolean verifyLicense(/{h;s/verifyLicense/verifyLicense2/;x;G}' LicenseVerifier.java
          sed -i '/boolean verifyLicense(/ s/$/return true;}/' LicenseVerifier.java
          sed -E -i 's|^([[:space:]]*)buildInfo = new XPackInfoResponse\.BuildInfo\(.*|\1buildInfo = new XPackInfoResponse.BuildInfo("Unknown", "Unknown");|' TransportXPackInfoAction.java

          "$JAVAC" -cp "/usr/share/elasticsearch/lib/*:/usr/share/elasticsearch/modules/x-pack-core/*" LicenseVerifier.java 2>/dev/null
          "$JAVAC" -cp "/usr/share/elasticsearch/lib/*:/usr/share/elasticsearch/modules/x-pack-core/*" TransportXPackInfoAction.java 2>/dev/null
          "$JAVAC" -cp "/usr/share/elasticsearch/lib/*:/usr/share/elasticsearch/modules/x-pack-core/*" License.java 2>/dev/null

          cp /usr/share/elasticsearch/modules/x-pack-core/x-pack-core-$VERSION.jar .
          mkdir x-pack-core && cd x-pack-core
          "$JAR" -xf ../x-pack-core-$VERSION.jar
          cp /tmp/crack/LicenseVerifier.class org/elasticsearch/license/
          cp /tmp/crack/License.class org/elasticsearch/license/
          cp /tmp/crack/TransportXPackInfoAction.class org/elasticsearch/xpack/core/action/
          "$JAR" -cf /crack-output/x-pack-core-$VERSION.jar .
          echo "Crack JAR built: /crack-output/x-pack-core-$VERSION.jar"
  register: _r_crack_cm
  retries: 3
  delay: 10
  until: _r_crack_cm is not failed

- name: Create Platinum license secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: es-platinum-license
        namespace: "{{ es_ns }}"
      type: Opaque
      stringData:
        license.json: '{{ lookup("file", "platinum_license.json") }}'
  register: _r_license_secret
  retries: 3
  delay: 10
  until: _r_license_secret is not failed

- name: Create ES credentials secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: es-credentials
        namespace: "{{ es_ns }}"
      type: Opaque
      stringData:
        ELASTIC_PASSWORD: "{{ es_password }}"
        username: elastic
        password: "{{ es_password }}"
  no_log: true
  register: _r_es_creds
  retries: 3
  delay: 10
  until: _r_es_creds is not failed

# ============================================
# Crack JAR builder PVC (shared by init containers)
# ============================================

- name: Create crack JAR PVC
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: es-crack-jar
        namespace: "{{ es_ns }}"
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: "{{ storage_class }}"
        resources:
          requests:
            storage: 1Gi
  register: _r_crack_pvc
  retries: 3
  delay: 10
  until: _r_crack_pvc is not failed

# ============================================
# Build crack JAR once via Job
# ============================================

- name: Run crack JAR builder Job
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: "es-crack-builder-{{ es_ver | replace('.', '-') }}"
        namespace: "{{ es_ns }}"
      spec:
        ttlSecondsAfterFinished: 600
        backoffLimit: 3
        template:
          spec:
            restartPolicy: Never
            containers:
              - name: builder
                image: "{{ es_img }}"
                command: ["bash", "/scripts/build_crack_jar.sh"]
                volumeMounts:
                  - name: crack-script
                    mountPath: /scripts
                  - name: crack-output
                    mountPath: /crack-output
                securityContext:
                  runAsUser: 1000
            volumes:
              - name: crack-script
                configMap:
                  name: es-crack-script
                  defaultMode: 0755
              - name: crack-output
                persistentVolumeClaim:
                  claimName: es-crack-jar
  register: _r_crack_job
  retries: 3
  delay: 10
  until: _r_crack_job is not failed

- name: Wait for crack JAR build to complete
  kubernetes.core.k8s_info:
    kind: Job
    namespace: "{{ es_ns }}"
    name: "es-crack-builder-{{ es_ver | replace('.', '-') }}"
  register: crack_job_status
  until: >
    crack_job_status.resources | length > 0 and
    (crack_job_status.resources[0].status.succeeded | default(0) | int) >= 1
  retries: 60
  delay: 10

# ============================================
# Headless services for StatefulSets
# ============================================

- name: Create ES master headless service
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: es-master-headless
        namespace: "{{ es_ns }}"
        labels:
          app: elasticsearch
          role: master
      spec:
        clusterIP: None
        publishNotReadyAddresses: true
        selector:
          app: elasticsearch
          role: master
        ports:
          - name: transport
            port: 9300
          - name: http
            port: 9200
  register: _r_master_svc
  retries: 3
  delay: 10
  until: _r_master_svc is not failed

- name: Create ES data headless service
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: es-data-headless
        namespace: "{{ es_ns }}"
        labels:
          app: elasticsearch
          role: data
      spec:
        clusterIP: None
        publishNotReadyAddresses: true
        selector:
          app: elasticsearch
          role: data
        ports:
          - name: transport
            port: 9300
          - name: http
            port: 9200
  register: _r_data_svc
  retries: 3
  delay: 10
  until: _r_data_svc is not failed

- name: Create ES client service (load-balanced)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: elasticsearch
        namespace: "{{ es_ns }}"
        labels:
          app: elasticsearch
      spec:
        type: ClusterIP
        selector:
          app: elasticsearch
        ports:
          - name: http
            port: 9200
            targetPort: 9200
          - name: transport
            port: 9300
            targetPort: 9300
  register: _r_client_svc
  retries: 3
  delay: 10
  until: _r_client_svc is not failed

# ============================================
# Master node StatefulSet
# ============================================

- name: Build seed hosts list
  set_fact:
    es_seed_hosts: >-
      {{ range(0, es_master_replicas | int) | map('regex_replace', '^(.*)$', 'es-master-\1.es-master-headless.' + es_ns + '.svc.cluster.local') | list | join(',') }}
    es_initial_master_nodes: >-
      {{ range(0, es_master_replicas | int) | map('regex_replace', '^(.*)$', 'es-master-\1') | list | join(',') }}

- name: Deploy ES master StatefulSet
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: es-master
        namespace: "{{ es_ns }}"
        labels:
          app: elasticsearch
          role: master
      spec:
        serviceName: es-master-headless
        replicas: "{{ es_master_replicas | int }}"
        podManagementPolicy: Parallel
        updateStrategy:
          type: RollingUpdate
        selector:
          matchLabels:
            app: elasticsearch
            role: master
        template:
          metadata:
            labels:
              app: elasticsearch
              role: master
          spec:
            securityContext:
              fsGroup: 1000
              runAsUser: 1000
              runAsNonRoot: true
            initContainers:
              - name: apply-crack
                image: "{{ es_img }}"
                command:
                  - bash
                  - -c
                  - |
                    JAR="/crack-jar/x-pack-core-{{ es_ver }}.jar"
                    DEST="/crack-ready/x-pack-core-{{ es_ver }}.jar"
                    for i in $(seq 1 30); do
                      if [ -f "$JAR" ]; then
                        cp "$JAR" "$DEST"
                        echo "Crack JAR copied to $DEST"
                        exit 0
                      fi
                      echo "Waiting for crack JAR... ($i/30)"
                      sleep 5
                    done
                    echo "ERROR: Crack JAR not found"
                    exit 1
                volumeMounts:
                  - name: crack-jar
                    mountPath: /crack-jar
                    readOnly: true
                  - name: crack-ready
                    mountPath: /crack-ready
                securityContext:
                  runAsUser: 1000
              - name: sysctl
                image: busybox:1.37
                command: ["sh", "-c", "sysctl -w vm.max_map_count=262144 || true"]
                securityContext:
                  privileged: true
                  runAsUser: 0
            containers:
              - name: elasticsearch
                image: "{{ es_img }}"
                command:
                  - bash
                  - -c
                  - |
                    cp /crack-ready/x-pack-core-{{ es_ver }}.jar /usr/share/elasticsearch/modules/x-pack-core/x-pack-core-{{ es_ver }}.jar
                    exec /usr/local/bin/docker-entrypoint.sh
                ports:
                  - containerPort: 9200
                    name: http
                  - containerPort: 9300
                    name: transport
                env:
                  - name: node.name
                    valueFrom:
                      fieldRef:
                        fieldPath: metadata.name
                  - name: cluster.name
                    value: "{{ es_cluster }}"
                  - name: node.roles
                    value: "master"
                  - name: discovery.seed_hosts
                    value: "{{ es_seed_hosts }}"
                  - name: cluster.initial_master_nodes
                    value: "{{ es_initial_master_nodes }}"
                  - name: ELASTIC_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: es-credentials
                        key: ELASTIC_PASSWORD
                  - name: xpack.security.enabled
                    value: "true"
                  - name: xpack.security.http.ssl.enabled
                    value: "true"
                  - name: xpack.security.http.ssl.certificate
                    value: /usr/share/elasticsearch/config/certs/tls.crt
                  - name: xpack.security.http.ssl.key
                    value: /usr/share/elasticsearch/config/certs/tls.key
                  - name: xpack.security.http.ssl.certificate_authorities
                    value: /usr/share/elasticsearch/config/certs/ca.crt
                  - name: xpack.security.transport.ssl.enabled
                    value: "true"
                  - name: xpack.security.transport.ssl.verification_mode
                    value: certificate
                  - name: xpack.security.transport.ssl.certificate
                    value: /usr/share/elasticsearch/config/certs/transport.crt
                  - name: xpack.security.transport.ssl.key
                    value: /usr/share/elasticsearch/config/certs/transport.key
                  - name: xpack.security.transport.ssl.certificate_authorities
                    value: /usr/share/elasticsearch/config/certs/ca.crt
                  - name: ES_JAVA_OPTS
                    value: "-Xms{{ es_master_heap }} -Xmx{{ es_master_heap }}"
                  - name: bootstrap.memory_lock
                    value: "false"
                resources:
                  requests:
                    cpu: "{{ es_master_cpu_req }}"
                    memory: "{{ es_master_memory_req }}"
                  limits:
                    cpu: "{{ es_master_cpu_lim }}"
                    memory: "{{ es_master_memory_lim }}"
                volumeMounts:
                  - name: data
                    mountPath: /usr/share/elasticsearch/data
                  - name: certs
                    mountPath: /usr/share/elasticsearch/config/certs
                    readOnly: true
                  - name: crack-ready
                    mountPath: /crack-ready
                    readOnly: true
                readinessProbe:
                  exec:
                    command:
                      - bash
                      - -c
                      - |
                        curl -fsSk -u "elastic:$ELASTIC_PASSWORD" https://localhost:9200/_cluster/health?local=true
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
                livenessProbe:
                  exec:
                    command:
                      - bash
                      - -c
                      - |
                        curl -fsSk -u "elastic:$ELASTIC_PASSWORD" https://localhost:9200/_cluster/health?local=true
                  initialDelaySeconds: 90
                  periodSeconds: 30
                  timeoutSeconds: 10
            volumes:
              - name: certs
                persistentVolumeClaim:
                  claimName: es-tls-certs
              - name: crack-jar
                persistentVolumeClaim:
                  claimName: es-crack-jar
              - name: crack-ready
                emptyDir: {}
        volumeClaimTemplates:
          - metadata:
              name: data
            spec:
              accessModes: [ReadWriteOnce]
              storageClassName: "{{ storage_class }}"
              resources:
                requests:
                  storage: "{{ es_master_storage }}"
  register: _r_master_sts
  retries: 3
  delay: 15
  until: _r_master_sts is not failed

# ============================================
# Data node StatefulSet
# ============================================

- name: Deploy ES data StatefulSet
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: es-data
        namespace: "{{ es_ns }}"
        labels:
          app: elasticsearch
          role: data
      spec:
        serviceName: es-data-headless
        replicas: "{{ es_data_replicas | int }}"
        podManagementPolicy: Parallel
        updateStrategy:
          type: RollingUpdate
        selector:
          matchLabels:
            app: elasticsearch
            role: data
        template:
          metadata:
            labels:
              app: elasticsearch
              role: data
          spec:
            securityContext:
              fsGroup: 1000
              runAsUser: 1000
              runAsNonRoot: true
            initContainers:
              - name: apply-crack
                image: "{{ es_img }}"
                command:
                  - bash
                  - -c
                  - |
                    JAR="/crack-jar/x-pack-core-{{ es_ver }}.jar"
                    DEST="/crack-ready/x-pack-core-{{ es_ver }}.jar"
                    for i in $(seq 1 30); do
                      if [ -f "$JAR" ]; then
                        cp "$JAR" "$DEST"
                        echo "Crack JAR copied"
                        exit 0
                      fi
                      echo "Waiting for crack JAR... ($i/30)"
                      sleep 5
                    done
                    exit 1
                volumeMounts:
                  - name: crack-jar
                    mountPath: /crack-jar
                    readOnly: true
                  - name: crack-ready
                    mountPath: /crack-ready
                securityContext:
                  runAsUser: 1000
              - name: sysctl
                image: busybox:1.37
                command: ["sh", "-c", "sysctl -w vm.max_map_count=262144 || true"]
                securityContext:
                  privileged: true
                  runAsUser: 0
            containers:
              - name: elasticsearch
                image: "{{ es_img }}"
                command:
                  - bash
                  - -c
                  - |
                    cp /crack-ready/x-pack-core-{{ es_ver }}.jar /usr/share/elasticsearch/modules/x-pack-core/x-pack-core-{{ es_ver }}.jar
                    exec /usr/local/bin/docker-entrypoint.sh
                ports:
                  - containerPort: 9200
                    name: http
                  - containerPort: 9300
                    name: transport
                env:
                  - name: node.name
                    valueFrom:
                      fieldRef:
                        fieldPath: metadata.name
                  - name: cluster.name
                    value: "{{ es_cluster }}"
                  - name: node.roles
                    value: "data,ingest"
                  - name: discovery.seed_hosts
                    value: "{{ es_seed_hosts }}"
                  - name: ELASTIC_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: es-credentials
                        key: ELASTIC_PASSWORD
                  - name: xpack.security.enabled
                    value: "true"
                  - name: xpack.security.http.ssl.enabled
                    value: "true"
                  - name: xpack.security.http.ssl.certificate
                    value: /usr/share/elasticsearch/config/certs/tls.crt
                  - name: xpack.security.http.ssl.key
                    value: /usr/share/elasticsearch/config/certs/tls.key
                  - name: xpack.security.http.ssl.certificate_authorities
                    value: /usr/share/elasticsearch/config/certs/ca.crt
                  - name: xpack.security.transport.ssl.enabled
                    value: "true"
                  - name: xpack.security.transport.ssl.verification_mode
                    value: certificate
                  - name: xpack.security.transport.ssl.certificate
                    value: /usr/share/elasticsearch/config/certs/transport.crt
                  - name: xpack.security.transport.ssl.key
                    value: /usr/share/elasticsearch/config/certs/transport.key
                  - name: xpack.security.transport.ssl.certificate_authorities
                    value: /usr/share/elasticsearch/config/certs/ca.crt
                  - name: ES_JAVA_OPTS
                    value: "-Xms{{ es_data_heap }} -Xmx{{ es_data_heap }}"
                  - name: bootstrap.memory_lock
                    value: "false"
                resources:
                  requests:
                    cpu: "{{ es_data_cpu_req }}"
                    memory: "{{ es_data_memory_req }}"
                  limits:
                    cpu: "{{ es_data_cpu_lim }}"
                    memory: "{{ es_data_memory_lim }}"
                volumeMounts:
                  - name: data
                    mountPath: /usr/share/elasticsearch/data
                  - name: certs
                    mountPath: /usr/share/elasticsearch/config/certs
                    readOnly: true
                  - name: crack-ready
                    mountPath: /crack-ready
                    readOnly: true
                readinessProbe:
                  exec:
                    command:
                      - bash
                      - -c
                      - |
                        curl -fsSk -u "elastic:$ELASTIC_PASSWORD" https://localhost:9200/_cluster/health?local=true
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
                livenessProbe:
                  exec:
                    command:
                      - bash
                      - -c
                      - |
                        curl -fsSk -u "elastic:$ELASTIC_PASSWORD" https://localhost:9200/_cluster/health?local=true
                  initialDelaySeconds: 90
                  periodSeconds: 30
                  timeoutSeconds: 10
            volumes:
              - name: certs
                persistentVolumeClaim:
                  claimName: es-tls-certs
              - name: crack-jar
                persistentVolumeClaim:
                  claimName: es-crack-jar
              - name: crack-ready
                emptyDir: {}
        volumeClaimTemplates:
          - metadata:
              name: data
            spec:
              accessModes: [ReadWriteOnce]
              storageClassName: "{{ storage_class }}"
              resources:
                requests:
                  storage: "{{ es_data_storage }}"
  register: _r_data_sts
  retries: 3
  delay: 15
  until: _r_data_sts is not failed

# ============================================
# Wait for ES cluster + apply license
# ============================================

- name: Wait for ES master pods to be ready
  kubernetes.core.k8s_info:
    kind: StatefulSet
    namespace: "{{ es_ns }}"
    name: es-master
  register: es_master_sts
  until: >
    es_master_sts.resources | length > 0 and
    (es_master_sts.resources[0].status.readyReplicas | default(0) | int) >= (es_master_replicas | int)
  retries: 60
  delay: 15
  failed_when: false

- name: Wait for ES data pods to be ready
  kubernetes.core.k8s_info:
    kind: StatefulSet
    namespace: "{{ es_ns }}"
    name: es-data
  register: es_data_sts
  until: >
    es_data_sts.resources | length > 0 and
    (es_data_sts.resources[0].status.readyReplicas | default(0) | int) >= (es_data_replicas | int)
  retries: 60
  delay: 15
  failed_when: false

- name: Apply Platinum license via Job
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: "es-apply-license-{{ es_ver | replace('.', '-') }}"
        namespace: "{{ es_ns }}"
      spec:
        ttlSecondsAfterFinished: 600
        backoffLimit: 5
        template:
          spec:
            restartPolicy: Never
            containers:
              - name: apply-license
                image: curlimages/curl:8.12.1
                command:
                  - sh
                  - -c
                  - |
                    echo "Waiting for ES..." 
                    for i in $(seq 1 60); do
                      if curl -fsSk -u "elastic:$ELASTIC_PASSWORD" "https://es-master-0.es-master-headless.{{ es_ns }}.svc.cluster.local:9200/_cluster/health" >/dev/null 2>&1; then
                        echo "ES ready"
                        break
                      fi
                      sleep 5
                    done
                    ES="https://es-master-0.es-master-headless.{{ es_ns }}.svc.cluster.local:9200"
                    CURRENT=$(curl -fsSk -u "elastic:$ELASTIC_PASSWORD" "$ES/_license" 2>/dev/null | grep -o '"type":"[^"]*"' | head -1)
                    echo "Current license: $CURRENT"
                    if echo "$CURRENT" | grep -q "{{ es_license_type }}"; then
                      echo "Already {{ es_license_type }}, done"
                      exit 0
                    fi
                    curl -fsSk -u "elastic:$ELASTIC_PASSWORD" -XPUT "$ES/_license?acknowledge=true" \
                      -H 'Content-Type: application/json' -d @/license/license.json
                    echo ""
                    curl -fsSk -u "elastic:$ELASTIC_PASSWORD" "$ES/_license"
                env:
                  - name: ELASTIC_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: es-credentials
                        key: ELASTIC_PASSWORD
                volumeMounts:
                  - name: license
                    mountPath: /license
                    readOnly: true
            volumes:
              - name: license
                secret:
                  secretName: es-platinum-license
  register: _r_license_job
  retries: 3
  delay: 10
  until: _r_license_job is not failed

- name: Wait for license application
  kubernetes.core.k8s_info:
    kind: Job
    namespace: "{{ es_ns }}"
    name: "es-apply-license-{{ es_ver | replace('.', '-') }}"
  register: license_job
  until: >
    license_job.resources | length > 0 and
    (license_job.resources[0].status.succeeded | default(0) | int) >= 1
  retries: 30
  delay: 10
  failed_when: false

# ============================================
# Kibana
# ============================================

- name: Deploy Kibana
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: kibana
        namespace: "{{ es_ns }}"
        labels:
          app: kibana
      spec:
        replicas: "{{ kibana_replicas | int }}"
        selector:
          matchLabels:
            app: kibana
        template:
          metadata:
            labels:
              app: kibana
          spec:
            securityContext:
              runAsUser: 1000
              runAsNonRoot: true
            containers:
              - name: kibana
                image: "{{ kb_img }}"
                ports:
                  - containerPort: 5601
                    name: http
                env:
                  - name: ELASTICSEARCH_HOSTS
                    value: "https://elasticsearch.{{ es_ns }}.svc.cluster.local:9200"
                  - name: ELASTICSEARCH_USERNAME
                    value: "elastic"
                  - name: ELASTICSEARCH_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: es-credentials
                        key: ELASTIC_PASSWORD
                  - name: ELASTICSEARCH_SSL_VERIFICATIONMODE
                    value: "none"
                  - name: SERVER_HOST
                    value: "0.0.0.0"
                  - name: SERVER_NAME
                    value: "{{ es_kibana_domain }}"
                  - name: XPACK_SECURITY_ENCRYPTIONKEY
                    value: "{{ es_password | hash('sha256') | truncate(32, True, '') }}"
                  - name: XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY
                    value: "{{ es_password | hash('sha256') | truncate(32, True, '') }}"
                  - name: XPACK_REPORTING_ENCRYPTIONKEY
                    value: "{{ es_password | hash('sha256') | truncate(32, True, '') }}"
                resources:
                  requests:
                    cpu: "{{ kibana_cpu_req }}"
                    memory: "{{ kibana_memory_req }}"
                  limits:
                    cpu: "{{ kibana_cpu_lim }}"
                    memory: "{{ kibana_memory_lim }}"
                readinessProbe:
                  httpGet:
                    path: /api/status
                    port: 5601
                  initialDelaySeconds: 30
                  periodSeconds: 10
                livenessProbe:
                  httpGet:
                    path: /api/status
                    port: 5601
                  initialDelaySeconds: 60
                  periodSeconds: 30
  register: _r_kibana
  retries: 3
  delay: 15
  until: _r_kibana is not failed

- name: Create Kibana service
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: kibana
        namespace: "{{ es_ns }}"
        labels:
          app: kibana
      spec:
        type: ClusterIP
        selector:
          app: kibana
        ports:
          - name: http
            port: 5601
            targetPort: 5601
  register: _r_kibana_svc
  retries: 3
  delay: 10
  until: _r_kibana_svc is not failed

# ============================================
# PodDisruptionBudgets
# ============================================

- name: Create PDB for ES masters
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata:
        name: es-master-pdb
        namespace: "{{ es_ns }}"
      spec:
        maxUnavailable: 1
        selector:
          matchLabels:
            app: elasticsearch
            role: master
  when: es_master_replicas | int > 1
  register: _r_master_pdb
  retries: 3
  delay: 10
  until: _r_master_pdb is not failed

- name: Create PDB for ES data nodes
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata:
        name: es-data-pdb
        namespace: "{{ es_ns }}"
      spec:
        maxUnavailable: 1
        selector:
          matchLabels:
            app: elasticsearch
            role: data
  when: es_data_replicas | int > 1
  register: _r_data_pdb
  retries: 3
  delay: 10
  until: _r_data_pdb is not failed

# ============================================
# NetworkPolicy
# ============================================

- name: Create ES NetworkPolicy
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: es-allow-internal
        namespace: "{{ es_ns }}"
      spec:
        podSelector:
          matchLabels:
            app: elasticsearch
        policyTypes:
          - Ingress
        ingress:
          - from:
              - podSelector:
                  matchLabels:
                    app: elasticsearch
            ports:
              - port: 9300
                protocol: TCP
          - from:
              - podSelector:
                  matchLabels:
                    app: kibana
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: temporal
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: opwerf
            ports:
              - port: 9200
                protocol: TCP
  register: _r_es_netpol
  retries: 3
  delay: 10
  until: _r_es_netpol is not failed

- name: Display Elasticsearch deployment summary
  debug:
    msg:
      - "=========================================="
      - "  Elasticsearch {{ es_ver }} Deployed (Platinum)"
      - "=========================================="
      - "  Cluster: {{ es_cluster }}"
      - "  Masters: {{ es_master_replicas }}"
      - "  Data nodes: {{ es_data_replicas }}"
      - "  License: {{ es_license_type }}"
      - "  Endpoint: https://elasticsearch.{{ es_ns }}.svc.cluster.local:9200"
      - "  Kibana: https://{{ es_kibana_domain }}"
      - "  User: elastic / (from es-credentials secret)"
      - "=========================================="
