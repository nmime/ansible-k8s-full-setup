- name: Set Temporal tier-specific variables
  set_fact:
    temporal_ns: temporal
    temporal_chart_ver: 1.2.0
    temporal_server_ver: 1.31.0
    temporal_ui_ver: 2.49.1
    temporal_admin_tools_ver: 1.31.0
    temporal_domain: temporal.{{ domain }}
    temporal_num_history_shards: '{{ temporal.history_shards | default(512) }}'
    temporal_replicas: '{{ temporal.replicas | default(2 if resource_tier == ''production'' else 1) }}'
    temporal_history_replicas: '{{ temporal.history_replicas | default(2 if resource_tier == ''production'' else 1) }}'
    temporal_matching_replicas: '{{ temporal.matching_replicas | default(2 if resource_tier == ''production'' else 1) }}'
    temporal_frontend_replicas: '{{ temporal.frontend_replicas | default(2 if resource_tier == ''production'' else 1) }}'
    temporal_worker_replicas: '{{ temporal.worker_replicas | default(1) }}'
    temporal_frontend_cpu_req: '{{ temporal.frontend_cpu_request | default(''100m'' if resource_tier in [''minimal'', ''small''] else ''200m'') }}'
    temporal_frontend_mem_req: '{{ temporal.frontend_memory_request | default(''256Mi'' if resource_tier in [''minimal'', ''small''] else ''768Mi'') }}'
    temporal_frontend_cpu_lim: '{{ temporal.frontend_cpu_limit | default(''250m'' if resource_tier in [''minimal'', ''small''] else ''500m'') }}'
    temporal_frontend_mem_lim: '{{ temporal.frontend_memory_limit | default(''256Mi'' if resource_tier in [''minimal'', ''small''] else ''1Gi'') }}'
    temporal_history_cpu_req: '{{ temporal.history_cpu_request | default(''100m'' if resource_tier in [''minimal'', ''small''] else ''300m'') }}'
    temporal_history_mem_req: '{{ temporal.history_memory_request | default(''512Mi'' if resource_tier in [''minimal'', ''small''] else ''768Mi'') }}'
    temporal_history_cpu_lim: '{{ temporal.history_cpu_limit | default(''500m'' if resource_tier in [''minimal'', ''small''] else ''1'') }}'
    temporal_history_mem_lim: '{{ temporal.history_memory_limit | default(''512Mi'' if resource_tier in [''minimal'', ''small''] else ''2Gi'') }}'
    temporal_matching_cpu_req: '{{ temporal.matching_cpu_request | default(''100m'' if resource_tier in [''minimal'', ''small''] else ''200m'') }}'
    temporal_matching_mem_req: '{{ temporal.matching_memory_request | default(''256Mi'' if resource_tier in [''minimal'', ''small''] else ''512Mi'') }}'
    temporal_matching_cpu_lim: '{{ temporal.matching_cpu_limit | default(''250m'' if resource_tier in [''minimal'', ''small''] else ''500m'') }}'
    temporal_matching_mem_lim: '{{ temporal.matching_memory_limit | default(''256Mi'' if resource_tier in [''minimal'', ''small''] else ''1Gi'') }}'
    temporal_worker_cpu_req: '{{ temporal.worker_cpu_request | default(''100m'' if resource_tier in [''minimal'', ''small''] else ''200m'') }}'
    temporal_worker_mem_req: '{{ temporal.worker_memory_request | default(''128Mi'' if resource_tier in [''minimal'', ''small''] else ''512Mi'') }}'
    temporal_worker_cpu_lim: '{{ temporal.worker_cpu_limit | default(''250m'' if resource_tier in [''minimal'', ''small''] else ''500m'') }}'
    temporal_worker_mem_lim: '{{ temporal.worker_memory_limit | default(''256Mi'' if resource_tier in [''minimal'', ''small''] else ''1Gi'') }}'
    temporal_web_replicas: '{{ temporal.web_replicas | default(1) }}'
    temporal_sql_max_conns: '{{ temporal.sql_max_connections | default(5 if resource_tier in [''minimal'', ''small''] else 10) }}'
    temporal_sql_max_idle_conns: '{{ temporal.sql_max_idle_connections | default(2 if resource_tier in [''minimal'', ''small''] else 5) }}'
    db_ns: databases
    pg_host: '{{ project_name | default(''k8s'') }}-pg-pgbouncer.databases.svc.cluster.local'
    pg_host_direct: '{{ project_name | default(''k8s'') }}-pg-primary.databases.svc.cluster.local'
- name: Create Temporal namespace with Pod Security Standards
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: '{{ temporal_ns }}'
        labels:
          pod-security.kubernetes.io/enforce: baseline
          pod-security.kubernetes.io/enforce-version: latest
          pod-security.kubernetes.io/warn: restricted
          pod-security.kubernetes.io/warn-version: latest
          pod-security.kubernetes.io/audit: restricted
          pod-security.kubernetes.io/audit-version: latest
  register: _r_create_temporal_namespace
  retries: 3
  delay: 10
  until: _r_create_temporal_namespace is not failed
- name: Retrieve Percona-generated Temporal PG password
  no_log: true
  kubernetes.core.k8s_info:
    kind: Secret
    namespace: '{{ db_ns }}'
    name: '{{ project_name | default(''k8s'') }}-pg-pguser-temporal'
  register: temporal_pg_secret
  until: (temporal_pg_secret.resources | default([])) | length > 0
  retries: 90
  delay: 10
  failed_when: false
- name: Set Temporal PG password fact
  set_fact:
    temporal_pg_password: '{{ (temporal_pg_secret.resources[0].data.password | b64decode) if temporal_pg_secret.resources | length > 0 else '''' }}'
  no_log: true
- name: Fail if Temporal PG user not found
  fail:
    msg: Temporal PG user secret not found. Ensure 'temporal' user is defined in the PerconaPGCluster spec (k8s-databases role).
  when: temporal_pg_password | length == 0
- name: Create Temporal DB credentials secret in temporal namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: temporal-db-credentials
        namespace: '{{ temporal_ns }}'
      type: Opaque
      stringData:
        password: '{{ temporal_pg_password }}'
  register: _r_create_temporal_db_credentials_secret
  retries: 3
  delay: 10
  until: _r_create_temporal_db_credentials_secret is not failed
  no_log: true
- name: Get PG primary pod for CREATEDB grant
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: '{{ db_ns }}'
    label_selectors:
    - postgres-operator.crunchydata.com/cluster={{ project_name | default('k8s') }}-pg
    - postgres-operator.crunchydata.com/role=primary
  register: pg_primary_pods
- name: Grant CREATEDB to Temporal PG user for schema init
  kubernetes.core.k8s_exec:
    namespace: '{{ db_ns }}'
    pod: '{{ pg_primary_pods.resources[0].metadata.name }}'
    container: database
    command: psql -U postgres -c "ALTER USER temporal CREATEDB;"
  register: _r_grant_createdb
  retries: 3
  delay: 10
  until: _r_grant_createdb is not failed
  when: pg_primary_pods.resources | length > 0
- name: Add Temporal Helm repository
  kubernetes.core.helm_repository:
    name: temporal
    repo_url: https://go.temporal.io/helm-charts
  register: _r_add_temporal_helm_repository
  retries: 3
  delay: 10
  until: _r_add_temporal_helm_repository is not failed
- name: Install Temporal server via Helm
  kubernetes.core.helm:
    name: temporal
    chart_ref: temporal/temporal
    chart_version: '{{ temporal_chart_ver }}'
    release_namespace: '{{ temporal_ns }}'
    create_namespace: false
    release_state: present
    wait: true
    timeout: 15m0s
    values:
      server:
        enabled: true
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          seccompProfile:
            type: RuntimeDefault
        image:
          repository: temporalio/server
          tag: '{{ temporal_server_ver }}'
          pullPolicy: IfNotPresent
        config:
          logLevel: info
          persistence:
            defaultStore: default
            visibilityStore: visibility
            numHistoryShards: '{{ temporal_num_history_shards | int }}'
            datastores:
              default:
                sql:
                  createDatabase: true
                  manageSchema: true
                  pluginName: postgres12
                  driverName: postgres12
                  databaseName: temporal
                  connectAddr: '{{ pg_host_direct }}:5432'
                  connectProtocol: tcp
                  user: temporal
                  existingSecret: temporal-db-credentials
                  secretKey: password
                  maxConns: '{{ temporal_sql_max_conns | int }}'
                  maxIdleConns: '{{ temporal_sql_max_idle_conns | int }}'
                  maxConnLifetime: 1h
                  tls:
                    enabled: true
                    enableHostVerification: false
              visibility:
                sql:
                  createDatabase: true
                  manageSchema: true
                  pluginName: postgres12
                  driverName: postgres12
                  databaseName: temporal_visibility
                  connectAddr: '{{ pg_host_direct }}:5432'
                  connectProtocol: tcp
                  user: temporal
                  existingSecret: temporal-db-credentials
                  secretKey: password
                  maxConns: '{{ temporal_sql_max_conns | int }}'
                  maxIdleConns: '{{ temporal_sql_max_idle_conns | int }}'
                  maxConnLifetime: 1h
                  tls:
                    enabled: true
                    enableHostVerification: false
          namespaces:
            create: true
            namespace:
            - name: default
              retention: 3d
        frontend:
          replicaCount: '{{ temporal_frontend_replicas | int }}'
          service:
            type: ClusterIP
            port: 7233
          resources:
            requests:
              cpu: '{{ temporal_frontend_cpu_req }}'
              memory: '{{ temporal_frontend_mem_req }}'
            limits:
              cpu: '{{ temporal_frontend_cpu_lim }}'
              memory: '{{ temporal_frontend_mem_lim }}'
          containerSecurityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
        history:
          replicaCount: '{{ temporal_history_replicas | int }}'
          service:
            port: 7234
          resources:
            requests:
              cpu: '{{ temporal_history_cpu_req }}'
              memory: '{{ temporal_history_mem_req }}'
            limits:
              cpu: '{{ temporal_history_cpu_lim }}'
              memory: '{{ temporal_history_mem_lim }}'
          containerSecurityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
        matching:
          replicaCount: '{{ temporal_matching_replicas | int }}'
          service:
            port: 7235
          resources:
            requests:
              cpu: '{{ temporal_matching_cpu_req }}'
              memory: '{{ temporal_matching_mem_req }}'
            limits:
              cpu: '{{ temporal_matching_cpu_lim }}'
              memory: '{{ temporal_matching_mem_lim }}'
          containerSecurityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
        worker:
          replicaCount: '{{ temporal_worker_replicas | int }}'
          service:
            port: 7239
          resources:
            requests:
              cpu: '{{ temporal_worker_cpu_req }}'
              memory: '{{ temporal_worker_mem_req }}'
            limits:
              cpu: '{{ temporal_worker_cpu_lim }}'
              memory: '{{ temporal_worker_mem_lim }}'
          containerSecurityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
        metrics:
          annotations:
            enabled: true
          serviceMonitor:
            enabled: false
      schema:
        useHelmHooks: true
        backoffLimit: 100
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          seccompProfile:
            type: RuntimeDefault
        containerSecurityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
      shims:
        dockerize: false
        elasticsearchTool: false
      admintools:
        enabled: true
        image:
          repository: temporalio/admin-tools
          tag: '{{ temporal_admin_tools_ver }}'
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            cpu: 300m
            memory: 512Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          seccompProfile:
            type: RuntimeDefault
        containerSecurityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
      web:
        enabled: true
        replicaCount: '{{ temporal_web_replicas | int }}'
        image:
          repository: temporalio/ui
          tag: '{{ temporal_ui_ver }}'
        service:
          type: ClusterIP
          port: 8080
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            cpu: 300m
            memory: 512Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          seccompProfile:
            type: RuntimeDefault
        containerSecurityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
  register: _r_install_temporal_server_via_helm
  retries: 3
  delay: 10
  until: _r_install_temporal_server_via_helm is not failed
  no_log: true
- name: Wait for Temporal frontend to be ready
  kubernetes.core.k8s_info:
    kind: Deployment
    namespace: '{{ temporal_ns }}'
    name: temporal-frontend
  register: temporal_frontend_status
  until: '(temporal_frontend_status.resources | default([])) | length > 0 and (temporal_frontend_status.resources[0].status.readyReplicas | default(0) | int) >= 1

    '
  retries: 40
  delay: 15
  failed_when: false
- name: Wait for Temporal history to be ready
  kubernetes.core.k8s_info:
    kind: Deployment
    namespace: '{{ temporal_ns }}'
    name: temporal-history
  register: temporal_history_status
  until: '(temporal_history_status.resources | default([])) | length > 0 and (temporal_history_status.resources[0].status.readyReplicas | default(0) | int) >= 1

    '
  retries: 40
  delay: 15
  failed_when: false
- name: Wait for Temporal web UI to be ready
  kubernetes.core.k8s_info:
    kind: Deployment
    namespace: '{{ temporal_ns }}'
    name: temporal-web
  register: temporal_web_status
  until: '(temporal_web_status.resources | default([])) | length > 0 and (temporal_web_status.resources[0].status.readyReplicas | default(0) | int) >= 1

    '
  retries: 40
  delay: 15
  failed_when: false
- name: Create Temporal Web UI HTTPRoute (VPN-only via admin-gateway)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: temporal-web
        namespace: '{{ temporal_ns }}'
      spec:
        parentRefs:
        - name: admin-gateway
          namespace: cilium-system
          sectionName: https
        hostnames:
        - '{{ temporal_domain }}'
        rules:
        - matches:
          - path:
              type: PathPrefix
              value: /
          backendRefs:
          - name: temporal-web
            port: 8080
  register: _r_create_temporal_web_ui_httproute
  retries: 3
  delay: 10
  until: _r_create_temporal_web_ui_httproute is not failed
- name: Create TLS Certificate for Temporal domain
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cert-manager.io/v1
      kind: Certificate
      metadata:
        name: temporal-tls
        namespace: '{{ temporal_ns }}'
      spec:
        secretName: temporal-tls
        issuerRef:
          name: '{{ cert_manager_cluster_issuer }}'
          kind: ClusterIssuer
        dnsNames:
        - '{{ temporal_domain }}'
  register: _r_create_temporal_tls_certificate
  retries: 3
  delay: 10
  until: _r_create_temporal_tls_certificate is not failed
- name: Display Temporal deployment summary
  debug:
    msg:
    - ==========================================
    - '  Temporal Workflow Engine Deployed'
    - ==========================================
    - '  Chart: {{ temporal_chart_ver }}'
    - '  Server: {{ temporal_server_ver }}'
    - '  Web UI: {{ temporal_ui_ver }}'
    - '  Namespace: {{ temporal_ns }}'
    - '  Frontend replicas: {{ temporal_frontend_replicas }}'
    - '  History replicas: {{ temporal_history_replicas }}'
    - '  History shards: {{ temporal_num_history_shards }}'
    - '  Database: PostgreSQL (Percona PG Operator)'
    - '  Web UI: https://{{ temporal_domain }} (VPN-only)'
    - '  gRPC endpoint: temporal-frontend.{{ temporal_ns }}.svc.cluster.local:7233'
    - ==========================================
- name: Remove legacy invalid Cilium default-deny for Temporal namespace
  kubernetes.core.k8s:
    state: absent
    definition:
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: default-deny
        namespace: '{{ temporal_ns }}'
- name: Create default-deny NetworkPolicy for Temporal namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: default-deny
        namespace: '{{ temporal_ns }}'
      spec:
        podSelector: {}
        policyTypes:
        - Ingress
        - Egress
        ingress: []
        egress: []
- name: Allow Temporal ingress from cluster (workers/apps connect)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: allow-temporal-ingress
        namespace: '{{ temporal_ns }}'
      spec:
        endpointSelector:
          matchLabels:
            app.kubernetes.io/name: temporal
        ingress:
        - fromEntities:
          - cluster
          toPorts:
          - ports:
            - port: '7233'
              protocol: TCP
            - port: '7234'
              protocol: TCP
            - port: '7235'
              protocol: TCP
            - port: '8080'
              protocol: TCP
- name: Allow Temporal egress to PostgreSQL
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: allow-temporal-to-postgres
        namespace: '{{ temporal_ns }}'
      spec:
        endpointSelector: {}
        egress:
        - toEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: databases
          toPorts:
          - ports:
            - port: '5432'
              protocol: TCP
        - toEntities:
          - kube-apiserver
- name: Create Temporal VMServiceScrape
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: operator.victoriametrics.com/v1beta1
      kind: VMServiceScrape
      metadata:
        name: temporal
        namespace: '{{ temporal_ns }}'
        labels:
          release: prometheus
      spec:
        selector:
          matchLabels:
            app.kubernetes.io/name: temporal
        endpoints:
        - port: metrics
          interval: 30s
  when: platform_observability_enabled | default(false) | bool
