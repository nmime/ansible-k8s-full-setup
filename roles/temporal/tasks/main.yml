- name: Set Temporal tier-specific variables
  set_fact:
    temporal_ns: temporal
    temporal_chart_ver: 0.73.2
    temporal_server_ver: 1.29.1
    temporal_ui_ver: 2.44.0
    temporal_admin_tools_ver: 1.29.1-tctl-1.18.4-cli-1.5.0
    temporal_domain: temporal.{{ domain }}
    temporal_num_history_shards: 512
    temporal_replicas: '{{ 2 if tier == ''production'' else (1 if tier in [''minimal'', ''small''] else 1) }}'
    temporal_history_replicas: '{{ 2 if tier == ''production'' else (1 if tier in [''minimal'', ''small''] else 1) }}'
    temporal_matching_replicas: '{{ 2 if tier == ''production'' else (1 if tier in [''minimal'', ''small''] else 1) }}'
    temporal_frontend_replicas: '{{ 2 if tier == ''production'' else (1 if tier in [''minimal'', ''small''] else 1) }}'
    temporal_worker_replicas: 1
    temporal_frontend_cpu_req: '{{ ''50m'' if tier in [''minimal'', ''small''] else ''100m'' }}'
    temporal_frontend_mem_req: '{{ ''128Mi'' if tier in [''minimal'', ''small''] else ''512Mi'' }}'
    temporal_frontend_cpu_lim: '{{ ''250m'' if tier in [''minimal'', ''small''] else ''500m'' }}'
    temporal_frontend_mem_lim: '{{ ''256Mi'' if tier in [''minimal'', ''small''] else ''1Gi'' }}'
    temporal_history_cpu_req: '{{ ''50m'' if tier in [''minimal'', ''small''] else ''200m'' }}'
    temporal_history_mem_req: '{{ ''256Mi'' if tier in [''minimal'', ''small''] else ''512Mi'' }}'
    temporal_history_cpu_lim: '{{ ''500m'' if tier in [''minimal'', ''small''] else ''1'' }}'
    temporal_history_mem_lim: '{{ ''512Mi'' if tier in [''minimal'', ''small''] else ''2Gi'' }}'
    temporal_matching_cpu_req: '{{ ''50m'' if tier in [''minimal'', ''small''] else ''100m'' }}'
    temporal_matching_mem_req: '{{ ''128Mi'' if tier in [''minimal'', ''small''] else ''256Mi'' }}'
    temporal_matching_cpu_lim: '{{ ''250m'' if tier in [''minimal'', ''small''] else ''500m'' }}'
    temporal_matching_mem_lim: '{{ ''256Mi'' if tier in [''minimal'', ''small''] else ''1Gi'' }}'
    temporal_worker_cpu_req: '{{ ''50m'' if tier in [''minimal'', ''small''] else ''100m'' }}'
    temporal_worker_mem_req: '{{ ''64Mi'' if tier in [''minimal'', ''small''] else ''256Mi'' }}'
    temporal_worker_cpu_lim: '{{ ''250m'' if tier in [''minimal'', ''small''] else ''500m'' }}'
    temporal_worker_mem_lim: '{{ ''256Mi'' if tier in [''minimal'', ''small''] else ''1Gi'' }}'
    temporal_web_replicas: 1
    db_ns: databases
    pg_host: '{{ project_name | default(''k8s'') }}-pg-pgbouncer.databases.svc.cluster.local'
    pg_host_direct: '{{ project_name | default(''k8s'') }}-pg-primary.databases.svc.cluster.local'
- name: Create Temporal namespace with Pod Security Standards
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: '{{ temporal_ns }}'
        labels:
          pod-security.kubernetes.io/enforce: baseline
          pod-security.kubernetes.io/enforce-version: latest
          pod-security.kubernetes.io/warn: restricted
          pod-security.kubernetes.io/warn-version: latest
          pod-security.kubernetes.io/audit: restricted
          pod-security.kubernetes.io/audit-version: latest
  register: _r_create_temporal_namespace
  retries: 3
  delay: 10
  until: _r_create_temporal_namespace is not failed
- name: Retrieve Percona-generated Temporal PG password
  kubernetes.core.k8s_info:
    kind: Secret
    namespace: '{{ db_ns }}'
    name: '{{ project_name | default(''k8s'') }}-pg-pguser-temporal'
  register: temporal_pg_secret
  until: temporal_pg_secret.resources | length > 0
  retries: 90
  delay: 10
  failed_when: false
- name: Set Temporal PG password fact
  set_fact:
    temporal_pg_password: '{{ (temporal_pg_secret.resources[0].data.password | b64decode) if temporal_pg_secret.resources | length > 0 else '''' }}'
  no_log: true
- name: Fail if Temporal PG user not found
  fail:
    msg: Temporal PG user secret not found. Ensure 'temporal' user is defined in the PerconaPGCluster spec (k8s-databases role).
  when: temporal_pg_password | length == 0
- name: Create Temporal DB credentials secret in temporal namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: temporal-db-credentials
        namespace: '{{ temporal_ns }}'
      type: Opaque
      stringData:
        password: '{{ temporal_pg_password }}'
  register: _r_create_temporal_db_credentials_secret
  retries: 3
  delay: 10
  until: _r_create_temporal_db_credentials_secret is not failed
  no_log: true
- name: Create Temporal ES credentials secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: temporal-es-credentials
        namespace: '{{ temporal_ns }}'
      type: Opaque
      stringData:
        password: '{{ es_superuser_password | default('''') }}'
  no_log: true
  register: _r_create_temporal_es_credentials
  retries: 3
  delay: 10
  until: _r_create_temporal_es_credentials is not failed
- name: Get PG primary pod for CREATEDB grant
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: '{{ db_ns }}'
    label_selectors:
    - postgres-operator.crunchydata.com/cluster={{ project_name | default('k8s') }}-pg
    - postgres-operator.crunchydata.com/role=primary
  register: pg_primary_pods
- name: Grant CREATEDB to Temporal PG user for schema init
  kubernetes.core.k8s_exec:
    namespace: '{{ db_ns }}'
    pod: '{{ pg_primary_pods.resources[0].metadata.name }}'
    container: database
    command: psql -U postgres -c "ALTER USER temporal CREATEDB;"
  register: _r_grant_createdb
  retries: 3
  delay: 10
  until: _r_grant_createdb is not failed
  when: pg_primary_pods.resources | length > 0
- name: Add Temporal Helm repository
  kubernetes.core.helm_repository:
    name: temporal
    repo_url: https://go.temporal.io/helm-charts
  register: _r_add_temporal_helm_repository
  retries: 3
  delay: 10
  until: _r_add_temporal_helm_repository is not failed
- name: Install Temporal server via Helm
  kubernetes.core.helm:
    name: temporal
    chart_ref: temporal/temporal
    chart_version: '{{ temporal_chart_ver }}'
    release_namespace: '{{ temporal_ns }}'
    create_namespace: false
    release_state: present
    wait: true
    timeout: 15m0s
    values:
      cassandra:
        enabled: false
      elasticsearch:
        enabled: false
      prometheus:
        enabled: false
      grafana:
        enabled: false
      mysql:
        enabled: false
      server:
        enabled: true
        image:
          repository: temporalio/server
          tag: '{{ temporal_server_ver }}'
          pullPolicy: IfNotPresent
        config:
          logLevel: info
          numHistoryShards: '{{ temporal_num_history_shards | int }}'
          persistence:
            defaultStore: default
            additionalStores:
              es-visibility:
                elasticsearch:
                  version: v7
                  logLevel: info
                  url:
                    scheme: https
                    host: elasticsearch.elasticsearch.svc.cluster.local:9200
                  username: elastic
                  password: will-be-overridden
                  existingSecret: temporal-es-credentials
                  indices:
                    visibility: temporal_visibility_v1
                  tls:
                    enabled: true
                    enableHostVerification: false
            default:
              driver: sql
              sql:
                driver: postgres12
                host: '{{ pg_host_direct }}'
                port: 5432
                database: temporal
                user: temporal
                password: will-be-overridden
                existingSecret: temporal-db-credentials
                maxConns: 20
                maxIdleConns: 20
                maxConnLifetime: 1h
                tls:
                  enabled: true
                  enableHostVerification: false
            visibility:
              driver: sql
              sql:
                driver: postgres12
                host: '{{ pg_host_direct }}'
                port: 5432
                database: temporal_visibility
                user: temporal
                password: will-be-overridden
                existingSecret: temporal-db-credentials
                maxConns: 20
                maxIdleConns: 20
                maxConnLifetime: 1h
                tls:
                  enabled: true
                  enableHostVerification: false
            visibilityStore: visibility
          namespaces:
            create: true
            namespace:
            - name: default
              retention: 3d
        frontend:
          replicaCount: '{{ temporal_frontend_replicas | int }}'
          service:
            type: ClusterIP
            port: 7233
          resources:
            requests:
              cpu: '{{ temporal_frontend_cpu_req }}'
              memory: '{{ temporal_frontend_mem_req }}'
            limits:
              cpu: '{{ temporal_frontend_cpu_lim }}'
              memory: '{{ temporal_frontend_mem_lim }}'
          podSecurityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containerSecurityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
        history:
          replicaCount: '{{ temporal_history_replicas | int }}'
          service:
            port: 7234
          resources:
            requests:
              cpu: '{{ temporal_history_cpu_req }}'
              memory: '{{ temporal_history_mem_req }}'
            limits:
              cpu: '{{ temporal_history_cpu_lim }}'
              memory: '{{ temporal_history_mem_lim }}'
          podSecurityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containerSecurityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
        matching:
          replicaCount: '{{ temporal_matching_replicas | int }}'
          service:
            port: 7235
          resources:
            requests:
              cpu: '{{ temporal_matching_cpu_req }}'
              memory: '{{ temporal_matching_mem_req }}'
            limits:
              cpu: '{{ temporal_matching_cpu_lim }}'
              memory: '{{ temporal_matching_mem_lim }}'
          podSecurityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containerSecurityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
        worker:
          replicaCount: '{{ temporal_worker_replicas | int }}'
          service:
            port: 7239
          resources:
            requests:
              cpu: '{{ temporal_worker_cpu_req }}'
              memory: '{{ temporal_worker_mem_req }}'
            limits:
              cpu: '{{ temporal_worker_cpu_lim }}'
              memory: '{{ temporal_worker_mem_lim }}'
          podSecurityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containerSecurityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
        metrics:
          annotations:
            enabled: true
          serviceMonitor:
            enabled: false
      schema:
        createDatabase:
          enabled: true
        setup:
          enabled: true
          backoffLimit: 100
        update:
          enabled: true
          backoffLimit: 100
      admintools:
        enabled: true
        image:
          repository: temporalio/admin-tools
          tag: '{{ temporal_admin_tools_ver }}'
        resources:
          requests:
            cpu: 25m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
      web:
        enabled: true
        replicaCount: '{{ temporal_web_replicas | int }}'
        image:
          repository: temporalio/ui
          tag: '{{ temporal_ui_ver }}'
        service:
          type: ClusterIP
          port: 8080
        resources:
          requests:
            cpu: 25m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
  register: _r_install_temporal_server_via_helm
  retries: 3
  delay: 10
  until: _r_install_temporal_server_via_helm is not failed
  no_log: true
- name: Wait for Temporal frontend to be ready
  kubernetes.core.k8s_info:
    kind: Deployment
    namespace: '{{ temporal_ns }}'
    name: temporal-frontend
  register: temporal_frontend_status
  until: 'temporal_frontend_status.resources | length > 0 and (temporal_frontend_status.resources[0].status.readyReplicas | default(0) | int) >= 1

    '
  retries: 40
  delay: 15
  failed_when: false
- name: Wait for Temporal history to be ready
  kubernetes.core.k8s_info:
    kind: Deployment
    namespace: '{{ temporal_ns }}'
    name: temporal-history
  register: temporal_history_status
  until: 'temporal_history_status.resources | length > 0 and (temporal_history_status.resources[0].status.readyReplicas | default(0) | int) >= 1

    '
  retries: 40
  delay: 15
  failed_when: false
- name: Wait for Temporal web UI to be ready
  kubernetes.core.k8s_info:
    kind: Deployment
    namespace: '{{ temporal_ns }}'
    name: temporal-web
  register: temporal_web_status
  until: 'temporal_web_status.resources | length > 0 and (temporal_web_status.resources[0].status.readyReplicas | default(0) | int) >= 1

    '
  retries: 40
  delay: 15
  failed_when: false
- name: Create Temporal Web UI HTTPRoute (VPN-only via admin-gateway)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: temporal-web
        namespace: '{{ temporal_ns }}'
      spec:
        parentRefs:
        - name: admin-gateway
          namespace: cilium-system
          sectionName: https
        hostnames:
        - '{{ temporal_domain }}'
        rules:
        - matches:
          - path:
              type: PathPrefix
              value: /
          backendRefs:
          - name: temporal-web
            port: 8080
  register: _r_create_temporal_web_ui_httproute
  retries: 3
  delay: 10
  until: _r_create_temporal_web_ui_httproute is not failed
- name: Create TLS Certificate for Temporal domain
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cert-manager.io/v1
      kind: Certificate
      metadata:
        name: temporal-tls
        namespace: '{{ temporal_ns }}'
      spec:
        secretName: temporal-tls
        issuerRef:
          name: letsencrypt-prod
          kind: ClusterIssuer
        dnsNames:
        - '{{ temporal_domain }}'
  register: _r_create_temporal_tls_certificate
  retries: 3
  delay: 10
  until: _r_create_temporal_tls_certificate is not failed
- name: Display Temporal deployment summary
  debug:
    msg:
    - ==========================================
    - '  Temporal Workflow Engine Deployed'
    - ==========================================
    - '  Chart: {{ temporal_chart_ver }}'
    - '  Server: {{ temporal_server_ver }}'
    - '  Web UI: {{ temporal_ui_ver }}'
    - '  Namespace: {{ temporal_ns }}'
    - '  Frontend replicas: {{ temporal_frontend_replicas }}'
    - '  History replicas: {{ temporal_history_replicas }}'
    - '  History shards: {{ temporal_num_history_shards }}'
    - '  Database: PostgreSQL (Percona PG Operator)'
    - '  Web UI: https://{{ temporal_domain }} (VPN-only)'
    - '  gRPC endpoint: temporal-frontend.{{ temporal_ns }}.svc.cluster.local:7233'
    - ==========================================
- name: Create default-deny NetworkPolicy for Temporal namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: default-deny
        namespace: '{{ temporal_namespace }}'
      spec:
        endpointSelector: {}
- name: Allow Temporal ingress from cluster (workers/apps connect)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: allow-temporal-ingress
        namespace: '{{ temporal_namespace }}'
      spec:
        endpointSelector:
          matchLabels:
            app.kubernetes.io/name: temporal
        ingress:
        - fromEntities:
          - cluster
          toPorts:
          - ports:
            - port: '7233'
              protocol: TCP
            - port: '7234'
              protocol: TCP
            - port: '7235'
              protocol: TCP
- name: Allow Temporal egress to PostgreSQL
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: allow-temporal-to-postgres
        namespace: '{{ temporal_namespace }}'
      spec:
        endpointSelector: {}
        egress:
        - toEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: databases
          toPorts:
          - ports:
            - port: '5432'
              protocol: TCP
        - toEntities:
          - kube-apiserver
