---
- name: Set blackbox facts
  set_fact:
    bb_ns: "{{ blackbox_namespace }}"

- name: Add prometheus-community Helm repository
  kubernetes.core.helm_repository:
    name: prometheus-community
    repo_url: https://prometheus-community.github.io/helm-charts
  register: _r_bb_repo
  retries: 3
  delay: 10
  until: _r_bb_repo is not failed

- name: Install blackbox-exporter via Helm
  kubernetes.core.helm:
    name: blackbox-exporter
    chart_ref: prometheus-community/prometheus-blackbox-exporter
    chart_version: "{{ blackbox_chart_version }}"
    release_namespace: "{{ bb_ns }}"
    create_namespace: true
    wait: true
    timeout: 5m
    values:
      replicas: "{{ blackbox_replicas | int }}"
      image:
        registry: "{{ blackbox_image_registry }}"
        repository: "{{ blackbox_image }}"
      resources:
        requests:
          cpu: "{{ blackbox_cpu_req }}"
          memory: "{{ blackbox_memory_req }}"
        limits:
          cpu: "{{ blackbox_cpu_lim }}"
          memory: "{{ blackbox_memory_lim }}"
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
        seccompProfile:
          type: RuntimeDefault
      serviceMonitor:
        enabled: false
      config:
        modules:
          http_2xx:
            prober: http
            timeout: "{{ blackbox_probe_timeout }}"
            http:
              preferred_ip_protocol: ip4
              valid_status_codes: [200, 301, 302, 401, 403]
              follow_redirects: true
              fail_if_ssl: false
              fail_if_not_ssl: true
              tls_config:
                insecure_skip_verify: false
          tcp_connect:
            prober: tcp
            timeout: "{{ blackbox_probe_timeout }}"
  register: _r_bb_install
  retries: 3
  delay: 15
  until: _r_bb_install is not failed

- name: Build list of public probe targets
  set_fact:
    bb_public_targets: >-
      {{
        ([ 'https://grafana.' + domain ]) +
        ([ 'https://kibana.' + domain ] if platform_elasticsearch_enabled | default(false) | bool else []) +
        ([ 'https://gitlab.'  + domain ] if platform_gitlab_enabled | default(false) | bool else []) +
        ([ 'https://argocd.'  + domain ] if platform_gitops_enabled | default(false) | bool else []) +
        ([ 'https://mail.'    + domain ] if platform_postal_enabled | default(false) | bool else []) +
        ([ 'https://temporal.' + domain ] if platform_temporal_enabled | default(false) | bool else []) +
        ([ 'https://glitchtip.' + domain ] if deploy_glitchtip | default(false) | bool else []) +
        ([ blackbox_daytona_target ] if deploy_daytona | default(false) | bool else [])
      }}

- name: Build list of internal TCP probe targets
  set_fact:
    bb_internal_targets: >-
      {{
        ([ (project_name | default('k8s')) + '-pg-pgbouncer.databases.svc.cluster.local:5432' ] if platform_postgresql_enabled | default(false) | bool else []) +
        ([ 'elasticsearch.elasticsearch.svc.cluster.local:9200' ] if platform_elasticsearch_enabled | default(false) | bool else []) +
        ([ 'dragonfly.dragonfly.svc.cluster.local:6379' ] if platform_dragonfly_enabled | default(false) | bool else []) +
        ([ object_storage_endpoint_hostport | default('seaweedfs-filer.storage.svc.cluster.local:8333') ] if platform_object_storage_enabled | default(false) | bool else [])
      }}

- name: Create VMProbe for HTTP endpoints
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: operator.victoriametrics.com/v1beta1
      kind: VMProbe
      metadata:
        name: blackbox-public-https
        namespace: "{{ bb_ns }}"
      spec:
        module: http_2xx
        interval: "{{ blackbox_probe_interval }}"
        scrapeTimeout: "{{ blackbox_probe_timeout }}"
        vmProberSpec:
          url: "blackbox-exporter-prometheus-blackbox-exporter.{{ bb_ns }}.svc.cluster.local:9115"
          scheme: http
          path: /probe
        targets:
          staticConfig:
            targets: "{{ bb_public_targets }}"
            labels:
              probe: public-https
  register: _r_bb_probe
  retries: 3
  delay: 10
  until: _r_bb_probe is not failed

- name: Create VMProbe for internal TCP health (PG, ES, Redis, object storage)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: operator.victoriametrics.com/v1beta1
      kind: VMProbe
      metadata:
        name: blackbox-internal-tcp
        namespace: "{{ bb_ns }}"
      spec:
        module: tcp_connect
        interval: "{{ blackbox_probe_interval }}"
        scrapeTimeout: "{{ blackbox_probe_timeout }}"
        vmProberSpec:
          url: "blackbox-exporter-prometheus-blackbox-exporter.{{ bb_ns }}.svc.cluster.local:9115"
          scheme: http
          path: /probe
        targets:
          staticConfig:
            targets: "{{ bb_internal_targets }}"
            labels:
              probe: internal-tcp
  register: _r_bb_probe_tcp
  retries: 3
  delay: 10
  until: _r_bb_probe_tcp is not failed
  when: bb_internal_targets | length > 0

- name: Print Blackbox info
  debug:
    msg:
      - "Blackbox exporter installed in {{ bb_ns }} namespace"
      - "Probing {{ bb_public_targets | length }} public endpoints every {{ blackbox_probe_interval }}"
      - "Metrics: probe_success, probe_http_status_code, probe_ssl_earliest_cert_expiry"
