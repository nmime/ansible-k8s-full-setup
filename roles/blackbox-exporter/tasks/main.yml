---
- name: Set blackbox facts
  set_fact:
    bb_ns: '{{ blackbox_namespace }}'

- name: Add prometheus-community Helm repository
  kubernetes.core.helm_repository:
    name: prometheus-community
    repo_url: https://prometheus-community.github.io/helm-charts
  register: _r_bb_repo
  retries: 3
  delay: 10
  until: _r_bb_repo is not failed

- name: Install blackbox-exporter via Helm
  kubernetes.core.helm:
    name: blackbox-exporter
    chart_ref: prometheus-community/prometheus-blackbox-exporter
    chart_version: '{{ blackbox_chart_version }}'
    release_namespace: '{{ bb_ns }}'
    create_namespace: true
    wait: true
    timeout: 5m
    values:
      replicas: '{{ blackbox_replicas | int }}'
      image:
        repository: '{{ blackbox_image }}'
      resources:
        requests:
          cpu: '{{ blackbox_cpu_req }}'
          memory: '{{ blackbox_memory_req }}'
        limits:
          cpu: '{{ blackbox_cpu_lim }}'
          memory: '{{ blackbox_memory_lim }}'
      serviceMonitor:
        enabled: false  # We use VMProbe instead (VM operator native)
      config:
        modules:
          http_2xx:
            prober: http
            timeout: '{{ blackbox_probe_timeout }}'
            http:
              preferred_ip_protocol: ip4
              valid_status_codes: [200, 301, 302, 401, 403]
              follow_redirects: true
              fail_if_ssl: false
              fail_if_not_ssl: true
              tls_config:
                insecure_skip_verify: false
          http_2xx_insecure:
            prober: http
            timeout: '{{ blackbox_probe_timeout }}'
            http:
              preferred_ip_protocol: ip4
              valid_status_codes: [200, 301, 302, 401, 403]
              follow_redirects: true
              tls_config:
                insecure_skip_verify: true
          tcp_connect:
            prober: tcp
            timeout: '{{ blackbox_probe_timeout }}'
          dns_udp:
            prober: dns
            timeout: '{{ blackbox_probe_timeout }}'
            dns:
              query_name: '{{ domain }}'
              query_type: A
              preferred_ip_protocol: ip4
  register: _r_bb_install
  retries: 3
  delay: 15
  until: _r_bb_install is not failed

- name: Build list of public probe targets
  set_fact:
    bb_public_targets: >-
      {{
        ([ 'https://grafana.' + domain ]) +
        ([ 'https://kibana.' + domain ]) +
        ([ 'https://gitlab.'  + domain ] if gitlab_enabled | default(true) | bool else []) +
        ([ 'https://argocd.'  + domain ] if gitops_enabled | default(true) | bool else []) +
        ([ 'https://mail.'    + domain ] if postal_enabled | default(true) | bool else []) +
        ([ 'https://temporal.' + domain ] if temporal_enabled | default(true) | bool else []) +
        ([ 'https://glitchtip.' + domain ] if deploy_glitchtip | default(false) | bool else []) +
        ([ 'https://app.' + domain, 'https://api.' + domain ] if deploy_opwerf | default(false) | bool else []) +
        ([ 'https://e2b-api.' + domain, 'https://sandbox.' + domain ] if deploy_e2b | default(false) | bool else [])
      }}

- name: Create VMProbe for HTTP endpoints
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: operator.victoriametrics.com/v1beta1
      kind: VMProbe
      metadata:
        name: blackbox-public-https
        namespace: '{{ bb_ns }}'
      spec:
        module: http_2xx
        interval: '{{ blackbox_probe_interval }}'
        scrapeTimeout: '{{ blackbox_probe_timeout }}'
        vmProberSpec:
          url: 'blackbox-exporter-prometheus-blackbox-exporter.{{ bb_ns }}.svc.cluster.local:9115'
          scheme: http
          path: /probe
        targets:
          staticConfig:
            targets: '{{ bb_public_targets }}'
            labels:
              probe: public-https
  register: _r_bb_probe
  retries: 3
  delay: 10
  until: _r_bb_probe is not failed

- name: Create VMProbe for internal TCP health (PG, ES, Redis, MinIO)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: operator.victoriametrics.com/v1beta1
      kind: VMProbe
      metadata:
        name: blackbox-internal-tcp
        namespace: '{{ bb_ns }}'
      spec:
        module: tcp_connect
        interval: '{{ blackbox_probe_interval }}'
        scrapeTimeout: '{{ blackbox_probe_timeout }}'
        vmProberSpec:
          url: 'blackbox-exporter-prometheus-blackbox-exporter.{{ bb_ns }}.svc.cluster.local:9115'
          scheme: http
          path: /probe
        targets:
          staticConfig:
            targets:
              - 'platform-pg-haproxy.platform-pg:5432'
              - 'elasticsearch.elasticsearch:9200'
              - 'dragonfly.dragonfly:6379'
              - 'minio.minio-storage:9000'
            labels:
              probe: internal-tcp
  register: _r_bb_probe_tcp
  retries: 3
  delay: 10
  until: _r_bb_probe_tcp is not failed

- name: Print Blackbox info
  debug:
    msg:
      - "Blackbox exporter installed in {{ bb_ns }} namespace"
      - "Probing {{ bb_public_targets | length }} public endpoints every {{ blackbox_probe_interval }}"
      - "Metrics: probe_success, probe_http_status_code, probe_ssl_earliest_cert_expiry"
