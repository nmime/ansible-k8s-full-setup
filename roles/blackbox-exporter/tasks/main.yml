---
- name: Set blackbox facts
  set_fact:
    bb_ns: "{{ blackbox_namespace }}"

- name: Add prometheus-community Helm repository
  kubernetes.core.helm_repository:
    name: prometheus-community
    repo_url: https://prometheus-community.github.io/helm-charts
  register: _r_bb_repo
  retries: 3
  delay: 10
  until: _r_bb_repo is not failed

- name: Install blackbox-exporter via Helm
  kubernetes.core.helm:
    name: blackbox-exporter
    chart_ref: prometheus-community/prometheus-blackbox-exporter
    chart_version: "{{ blackbox_chart_version }}"
    release_namespace: "{{ bb_ns }}"
    create_namespace: true
    wait: true
    timeout: 5m
    values:
      replicas: "{{ blackbox_replicas | int }}"
      image:
        registry: "{{ blackbox_image_registry }}"
        repository: "{{ blackbox_image }}"
      resources:
        requests:
          cpu: "{{ blackbox_cpu_req }}"
          memory: "{{ blackbox_memory_req }}"
        limits:
          cpu: "{{ blackbox_cpu_lim }}"
          memory: "{{ blackbox_memory_lim }}"
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
        seccompProfile:
          type: RuntimeDefault
      serviceMonitor:
        enabled: false
      config:
        modules:
          http_2xx:
            prober: http
            timeout: "{{ blackbox_probe_timeout }}"
            http:
              preferred_ip_protocol: ip4
              valid_status_codes: [200, 301, 302, 401, 403]
              follow_redirects: true
              fail_if_ssl: false
              fail_if_not_ssl: true
              tls_config:
                insecure_skip_verify: false
          tcp_connect:
            prober: tcp
            timeout: "{{ blackbox_probe_timeout }}"
          tcp_tls_verified:
            prober: tcp
            timeout: "{{ blackbox_probe_timeout }}"
            tcp:
              preferred_ip_protocol: ip4
              tls: true
              tls_config:
                ca_file: /etc/blackbox/datastore-ca/ca.crt
                insecure_skip_verify: false
                server_name: "{{ dragonfly_tls_service | default('dragonfly-tls.dragonfly.svc.cluster.local') }}"
      # Project the datastore client CA so tcp_tls_verified can verify TLS datastores
      # (Dragonfly TLS-only east-west). Mounted read-only at /etc/blackbox/datastore-ca.
      extraVolumes:
        - name: datastore-client-ca
          secret:
            defaultMode: '0444'
            secretName: datastore-client-ca
      extraVolumeMounts:
        - name: datastore-client-ca
          mountPath: /etc/blackbox/datastore-ca
          readOnly: true
  register: _r_bb_install
  retries: 3
  delay: 15
  until: _r_bb_install is not failed

- name: Build list of public probe targets
  # Only PUBLIC (main-gateway) endpoints are probed. VPN-only admin-gateway
  # endpoints (grafana, mail, vault, storage console, temporal UI) return
  # 403/404 to in-cluster probes by design and are verified by tailnet health
  # checks instead; probing them would perpetually fire BlackboxProbeFailed.
  set_fact:
    bb_public_targets: >-
      {{
        ([ 'https://gitlab.'  + domain ] if platform_gitlab_enabled | default(false) | bool else []) +
        ([ 'https://argocd.'  + domain ] if platform_gitops_enabled | default(false) | bool else []) +
        ([ 'https://git.' + domain ] if platform_gitlab_enabled | default(false) | bool else []) +
        ([ 'https://track.' + domain ] if platform_postal_enabled | default(false) | bool else []) +
        ([ blackbox_daytona_target ] if deploy_daytona | default(false) | bool else [])
      }}

- name: Build list of internal TCP probe targets
  set_fact:
    bb_internal_targets: >-
      {{
        ([
          (
            (databases.postgresql.service_alias ~ '.databases.svc.cluster.local')
            if (databases.postgresql.service_alias | default('') | length > 0)
            else
            ((project_name | default('k8s')) ~ '-pg-pgbouncer.databases.svc.cluster.local')
          ) ~ ':5432'
        ] if platform_postgresql_enabled | default(false) | bool else []) +
        ([ 'elasticsearch.elasticsearch.svc.cluster.local:9200' ] if platform_elasticsearch_enabled | default(false) | bool else []) +
        ([ object_storage_endpoint_hostport | default('seaweedfs-filer.storage.svc.cluster.local:8333') ] if platform_object_storage_enabled | default(false) | bool else [])
      }}

# TLS-verified datastore targets are probed separately via the tcp_tls_verified
# module (which validates the datastore TLS chain against the client CA).
# Plaintext Dragonfly (6379) was removed by the TLS-only east-west migration;
# the TLS endpoint (6380) is probed here instead.
- name: Build list of internal TLS datastore probe targets
  set_fact:
    bb_internal_tls_targets: >-
      {{
        ([ (dragonfly_tls_service | default('dragonfly-tls.dragonfly.svc.cluster.local')) ~ ':6380' ]
         if platform_dragonfly_enabled | default(false) | bool else [])
      }}

- name: Create VMProbe for HTTP endpoints
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: operator.victoriametrics.com/v1beta1
      kind: VMProbe
      metadata:
        name: blackbox-public-https
        namespace: "{{ bb_ns }}"
      spec:
        module: http_2xx
        interval: "{{ blackbox_probe_interval }}"
        scrapeTimeout: "{{ blackbox_probe_timeout }}"
        vmProberSpec:
          url: "blackbox-exporter-prometheus-blackbox-exporter.{{ bb_ns }}.svc.cluster.local:9115"
          scheme: http
          path: /probe
        targets:
          staticConfig:
            targets: "{{ bb_public_targets }}"
            labels:
              probe: public-https
  register: _r_bb_probe
  retries: 3
  delay: 10
  until: _r_bb_probe is not failed

- name: Create VMProbe for internal TCP health (PG, ES, Redis, object storage)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: operator.victoriametrics.com/v1beta1
      kind: VMProbe
      metadata:
        name: blackbox-internal-tcp
        namespace: "{{ bb_ns }}"
      spec:
        module: tcp_connect
        interval: "{{ blackbox_probe_interval }}"
        scrapeTimeout: "{{ blackbox_probe_timeout }}"
        vmProberSpec:
          url: "blackbox-exporter-prometheus-blackbox-exporter.{{ bb_ns }}.svc.cluster.local:9115"
          scheme: http
          path: /probe
        targets:
          staticConfig:
            targets: "{{ bb_internal_targets }}"
            labels:
              probe: internal-tcp
  register: _r_bb_probe_tcp
  retries: 3
  delay: 10
  until: _r_bb_probe_tcp is not failed
  when: bb_internal_targets | length > 0

- name: Create VMProbe for internal TLS datastore health (Dragonfly TLS)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: operator.victoriametrics.com/v1beta1
      kind: VMProbe
      metadata:
        name: blackbox-internal-tls
        namespace: "{{ bb_ns }}"
      spec:
        module: tcp_tls_verified
        interval: "{{ blackbox_probe_interval }}"
        scrapeTimeout: "{{ blackbox_probe_timeout }}"
        vmProberSpec:
          url: "blackbox-exporter-prometheus-blackbox-exporter.{{ bb_ns }}.svc.cluster.local:9115"
          scheme: http
          path: /probe
        targets:
          staticConfig:
            targets: "{{ bb_internal_tls_targets }}"
            labels:
              probe: internal-tls
  register: _r_bb_probe_tls
  retries: 3
  delay: 10
  until: _r_bb_probe_tls is not failed
  when: bb_internal_tls_targets | length > 0

# Private-gateway (VPN-only) probes are intentionally NOT created here:
# endpoints behind the admin-gateway (grafana, mail, argocd) return 403/404 to
# in-cluster probes by design, so probing them for a 307/404 would always alert.
# Public services are probed above; VPN-gated services are verified by tailnet
# health checks instead. Remove any legacy private-gateway probes from earlier
# deployments so the repo is the single source of truth and stale probes cannot
# fire BlackboxProbeFailed forever.
- name: Remove legacy private-gateway VMProbes (VPN-only endpoints)
  kubernetes.core.k8s:
    state: absent
    api_version: operator.victoriametrics.com/v1beta1
    kind: VMProbe
    name: "{{ item }}"
    namespace: "{{ bb_ns }}"
  loop:
    - blackbox-private-gateway
    - blackbox-private-gateway-redirect
  when: platform_gitops_enabled | default(false) | bool

- name: Print Blackbox info
  debug:
    msg:
      - "Blackbox exporter installed in {{ bb_ns }} namespace"
      - "Probing {{ bb_public_targets | length }} public endpoints every {{ blackbox_probe_interval }}"
      - "Metrics: probe_success, probe_http_status_code, probe_ssl_earliest_cert_expiry"
