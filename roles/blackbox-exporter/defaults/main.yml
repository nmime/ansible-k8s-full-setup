---
blackbox_namespace: monitoring
blackbox_chart_version: "11.15.1"   # prometheus-community/prometheus-blackbox-exporter
blackbox_image: "prom/blackbox-exporter"
blackbox_replicas: 1

blackbox_memory_req: "64Mi"
blackbox_memory_lim: "256Mi"
blackbox_cpu_req: "50m"
blackbox_cpu_lim: "300m"

blackbox_probe_interval: "60s"
blackbox_probe_timeout: "15s"

# Optional Daytona probe target, included only when deploy_daytona=true.
blackbox_daytona_target: "https://{{ daytona_base_domain | default('daytona.' + domain) }}"
