---
# Hetzner Infrastructure Defaults
# Override any of these in group_vars, host_vars, or extra-vars.

# Server type overrides — set these to pick exact Hetzner server types.
# Leave empty to auto-select the cheapest available type per tier.
# Current examples: cpx22, cpx32, cpx42, ccx13, and ccx23.
# Intermittent CX and planning-only CAX types remain valid explicit catalog names.
hetzner_bastion_type: '{{ network.bastion.server_type | default("") }}'
hetzner_cp_type: '{{ infrastructure.control_plane.type | default("") }}'
hetzner_worker_type: '{{ infrastructure.workers.type | default("") }}'

# Optional short provider-side server prefix. Kubernetes node names and the
# project label intentionally remain based on project_name so an operator can
# make the Hetzner console readable without forcing a destructive node rejoin.
hetzner_server_name_prefix: >-
  {{ infrastructure.server_name_prefix
     | default(project_name | default('k8s'), true) }}

# Deprecated compatibility input. The role now always fails closed on server
# deletion and type drift; scripts/migrate-profile.sh owns safe, one-node-at-a-
# time convergence with Kubernetes and etcd gates.
hetzner_allow_destructive_reconcile: false

# Hetzner can throttle bursty multi-cluster reconciles. Discovery is retried,
# but creation is permitted only after an explicit "not found" response. This
# prevents a transient API failure from being interpreted as resource absence.
hcloud_read_retries: 12
hcloud_read_delay: 10
hcloud_write_retries: 12
hcloud_write_delay: 10

# Minimum resource requirements per tier (used for auto-selection).
# Auto-select picks the cheapest x86 server type meeting these minimums.
hetzner_tier_specs:
  minimal:
    cp_count: 1
    cp_min_cores: 4
    cp_min_memory: 8
    cp_schedulable: true
    worker_count: 1
    worker_min_cores: 4
    worker_min_memory: 8
    lb_enabled: false
  small:
    cp_count: 1
    cp_min_cores: 2
    cp_min_memory: 4
    cp_schedulable: true
    worker_count: 2
    worker_min_cores: 4
    worker_min_memory: 8
    lb_enabled: true
  medium:
    cp_count: 3
    cp_min_cores: 4
    cp_min_memory: 16
    cp_schedulable: true
    worker_count: 2
    worker_min_cores: 4
    worker_min_memory: 16
    lb_enabled: true
  production:
    cp_count: 3
    cp_min_cores: 4
    cp_min_memory: 16
    cp_schedulable: false
    worker_count: 3
    worker_min_cores: 4
    worker_min_memory: 16
    lb_enabled: true
