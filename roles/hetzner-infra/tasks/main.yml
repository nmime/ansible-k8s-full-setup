        + (['--placement-group', project + '-spread']
           if infra_tier in ['medium', 'production'] else [])
      }}
  loop: "{{ range(1, (worker_count | int) + 1) | list }}"
  register: worker_create
  changed_when: worker_create.rc == 0
  retries: "{{ hcloud_write_retries }}"
  delay: "{{ hcloud_write_delay }}"
  until: >-
    worker_create.rc == 0 or
    'already' in (worker_create.stderr | default('') | lower) or
    'exists' in (worker_create.stderr | default('') | lower)
  failed_when: >-
    worker_create.rc != 0 and
    'already' not in (worker_create.stderr | default('') | lower) and
    'exists' not in (worker_create.stderr | default('') | lower)
  when: worker_check.results[item - 1].rc != 0

- name: List project servers for convergence verification
  ansible.builtin.command:
    cmd: hcloud server list --selector project={{ project }} -o json
  register: project_servers_raw
  changed_when: false
  retries: "{{ hcloud_read_retries }}"
  delay: "{{ hcloud_read_delay }}"
  until: project_servers_raw.rc == 0

- name: Build desired server inventory
  ansible.builtin.set_fact:
    desired_server_names: >-
      {%- set ns = namespace(names=[server_name_prefix + '-bastion']) -%}
      {%- for index in range(1, (cp_count | int) + 1) -%}
      {%- set _ = ns.names.append(server_name_prefix + '-master-' + (index | string)) -%}
      {%- endfor -%}
      {%- for index in range(1, (worker_count | int) + 1) -%}
      {%- set _ = ns.names.append(server_name_prefix + '-worker-' + (index | string)) -%}
      {%- endfor -%}
      {{ ns.names }}

- name: Detect server count and type drift
  ansible.builtin.set_fact:
    extra_server_names: >-
      {{ (project_servers_raw.stdout | from_json | map(attribute='name') | list)
         | difference(desired_server_names) }}
    mismatched_servers: >-
      {%- set ns = namespace(items=[]) -%}
      {%- for server in project_servers_raw.stdout | from_json -%}
      {%- set role = server.labels.role | default('') -%}
      {%- set index = server.labels.index | default('') | string -%}
      {%- set node_name = project + '-' +
          ('master' if role == 'master' else 'worker') + '-' + index -%}
      {%- set role_type = bastion_type if role == 'bastion'
          else cp_type if role == 'master'
          else worker_type if role in ['worker', 'ci-build-worker', 'ci-docker-worker']
          else '' -%}
      {%- set desired_type = node_type_overrides.get(
            node_name, node_type_overrides.get(server.name, role_type)) -%}
      {%- if desired_type and server.server_type.name != desired_type -%}
      {%- set _ = ns.items.append({'name': server.name, 'current': server.server_type.name, 'desired': desired_type}) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ ns.items }}

- name: Refuse unsafe server deletion or bulk type convergence
  ansible.builtin.assert:
    that:
      - extra_server_names | length == 0
      - mismatched_servers | length == 0
    fail_msg: >-
      Infrastructure drift detected. Extra servers={{ extra_server_names }};
      type changes={{ mismatched_servers }}. The infrastructure role never
      deletes Kubernetes nodes or resizes multiple members because doing so can
      bypass drain, PDB, CSI, and etcd quorum gates. Use migrate-profile.sh for
      profile changes; it removes and resizes nodes one at a time.

# ============================================
# Discover actual private IPs from Hetzner API
# ============================================

- name: Get control plane server private IPs
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      hcloud server describe {{ server_name_prefix }}-master-{{ item }} -o json |
      python3 -c "import sys,json; d=json.load(sys.stdin); print(d['private_net'][0]['ip'])"
    executable: /bin/bash
  loop: "{{ range(1, (cp_count | int) + 1) | list }}"
  register: master_ip_results
  changed_when: false
  retries: "{{ hcloud_read_retries }}"
  delay: "{{ hcloud_read_delay }}"
  until: master_ip_results.rc == 0

- name: Get worker server private IPs
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      hcloud server describe {{ server_name_prefix }}-worker-{{ item }} -o json |
      python3 -c "import sys,json; d=json.load(sys.stdin); print(d['private_net'][0]['ip'])"
    executable: /bin/bash
  loop: "{{ range(1, (worker_count | int) + 1) | list }}"
  register: worker_ip_results
  changed_when: false
  retries: "{{ hcloud_read_retries }}"
  delay: "{{ hcloud_read_delay }}"
  until: worker_ip_results.rc == 0

- name: Reset discovered node IP maps before rebuilding them
  set_fact:
    master_ips: {}
    worker_ips: {}

- name: Build master IP map
  set_fact:
    master_ips: "{{ master_ips | default({}) | combine({ project + '-master-' + (item.item | string): item.stdout | trim }) }}"
  loop: "{{ master_ip_results.results }}"
  loop_control:
    label: "{{ project }}-master-{{ item.item }}"

- name: Build worker IP map
  set_fact:
    worker_ips: "{{ worker_ips | default({}) | combine({ project + '-worker-' + (item.item | string): item.stdout | trim }) }}"
  loop: "{{ worker_ip_results.results }}"
  loop_control:
    label: "{{ project }}-worker-{{ item.item }}"

- name: Record private IPs allocated to servers created in this run
  ansible.builtin.set_fact:
    newly_created_node_ips: >-
      {%- set ns = namespace(ips=[]) -%}
      {%- for check in master_check.results | default([]) -%}
      {%- if (check.rc | default(0)) != 0 -%}
      {%- set _ = ns.ips.append(master_ips[project + '-master-' + (check.item | string)]) -%}
      {%- endif -%}
      {%- endfor -%}
      {%- for check in worker_check.results | default([]) -%}
      {%- if (check.rc | default(0)) != 0 -%}
      {%- set _ = ns.ips.append(worker_ips[project + '-worker-' + (check.item | string)]) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ ns.ips }}

- name: Set first master IP for kubeconfig
  set_fact:
    first_master_ip: "{{ master_ips[project + '-master-1'] }}"

- name: Display discovered node IPs
  debug:
    msg:
      - "Master IPs: {{ master_ips }}"
      - "Worker IPs: {{ worker_ips }}"
      - "First master: {{ first_master_ip }}"

# ============================================
# Load Balancer
# ============================================

- name: Check if load balancer already exists
  ansible.builtin.command:
    cmd: hcloud load-balancer describe {{ load_balancer_name }} -o json
  register: lb_check
  changed_when: false
  retries: "{{ hcloud_read_retries }}"
  delay: "{{ hcloud_read_delay }}"
  until: >-
    lb_check.rc == 0 or
    'not found' in (lb_check.stderr | default('') | lower)
  failed_when: >-
    lb_check.rc != 0 and
    'not found' not in (lb_check.stderr | default('') | lower)

- name: Remove load balancer when disabled by the profile
  ansible.builtin.command:
    cmd: hcloud load-balancer delete {{ load_balancer_name }}
  when:
    - not (lb_enabled | bool)
    - lb_check.rc == 0

- name: Create load balancer
  ansible.builtin.command:
    cmd: >
      hcloud load-balancer create
      --name {{ load_balancer_name }}
      --type {{ load_balancer_type }}
      --location {{ region }}
      --label project={{ project }}
  register: lb_create
  changed_when: lb_create.rc == 0
  retries: "{{ hcloud_write_retries }}"
  delay: "{{ hcloud_write_delay }}"
  until: >-
    lb_create.rc == 0 or
    'already' in (lb_create.stderr | default('') | lower) or
    'exists' in (lb_create.stderr | default('') | lower)
  failed_when: >-
    lb_create.rc != 0 and
    'already' not in (lb_create.stderr | default('') | lower) and
    'exists' not in (lb_create.stderr | default('') | lower)
  when: lb_enabled | bool and lb_check.rc != 0

- name: Attach LB to private network
  ansible.builtin.command:
    cmd: >
      hcloud load-balancer attach-to-network {{ load_balancer_name }}
      --network {{ project }}-network
  register: lb_network
  changed_when: lb_network.rc == 0
  retries: "{{ hcloud_write_retries }}"
  delay: "{{ hcloud_write_delay }}"
  until: >-
    lb_network.rc == 0 or
    'already' in (lb_network.stderr | default('') | lower) or
    'attached' in (lb_network.stderr | default('') | lower)
  failed_when: lb_network.rc != 0 and 'already' not in (lb_network.stderr | default('')) and 'attached' not in (lb_network.stderr | default(''))
  when: lb_enabled | bool

- name: Read load balancer configuration for convergence
  ansible.builtin.command:
    cmd: hcloud load-balancer describe {{ load_balancer_name }} -o json
  register: lb_config
  changed_when: false
  retries: "{{ hcloud_read_retries }}"
  delay: "{{ hcloud_read_delay }}"
  until: lb_config.rc == 0
  when: lb_enabled | bool

- name: Index current load balancer services
  ansible.builtin.set_fact:
    lb_current_services: '{{ (lb_config.stdout | from_json).services | default([]) }}'
    lb_https_service: >-
      {{ ((lb_config.stdout | from_json).services | default([])
          | selectattr('listen_port', 'equalto', 443) | list | first) | default({}) }}
    lb_http_service: >-
      {{ ((lb_config.stdout | from_json).services | default([])
          | selectattr('listen_port', 'equalto', 80) | list | first) | default({}) }}
  when: lb_enabled | bool

- name: Remove load balancer services outside the declared policy
  ansible.builtin.command:
    argv:
      - hcloud
      - load-balancer
      - delete-service
      - --listen-port
      - '{{ item.listen_port | string }}'
      - '{{ load_balancer_name }}'
  loop: '{{ lb_current_services | rejectattr("listen_port", "in", [80, 443]) | list }}'
  when: lb_enabled | bool

- name: Add missing bootstrap LB service for HTTPS
  ansible.builtin.command:
    cmd: >-
      hcloud load-balancer add-service {{ load_balancer_name }}
      --protocol tcp --listen-port 443 --destination-port 30443
      --health-check-protocol tcp --health-check-port 30443
  register: lb_https_create
  retries: "{{ hcloud_write_retries }}"
  delay: "{{ hcloud_write_delay }}"
  until: >-
    lb_https_create.rc == 0 or
    'already' in (lb_https_create.stderr | default('') | lower) or
    'exists' in (lb_https_create.stderr | default('') | lower)
  failed_when: >-
    lb_https_create.rc != 0 and
    'already' not in (lb_https_create.stderr | default('') | lower) and
    'exists' not in (lb_https_create.stderr | default('') | lower)
  when:
    - lb_enabled | bool
    - lb_https_service | length == 0

- name: Add missing bootstrap LB service for HTTP
  ansible.builtin.command:
    cmd: >-
      hcloud load-balancer add-service {{ load_balancer_name }}
      --protocol tcp --listen-port 80 --destination-port 30080
      --health-check-protocol tcp --health-check-port 30080
  register: lb_http_create
  retries: "{{ hcloud_write_retries }}"
  delay: "{{ hcloud_write_delay }}"
  until: >-
    lb_http_create.rc == 0 or
    'already' in (lb_http_create.stderr | default('') | lower) or
    'exists' in (lb_http_create.stderr | default('') | lower)
  failed_when: >-
    lb_http_create.rc != 0 and
    'already' not in (lb_http_create.stderr | default('') | lower) and
    'exists' not in (lb_http_create.stderr | default('') | lower)
  when:
    - lb_enabled | bool
    - lb_http_service | length == 0

- name: Add worker servers as LB targets
  ansible.builtin.command:
    cmd: >
      hcloud load-balancer add-target {{ load_balancer_name }}
      --server {{ server_name_prefix }}-worker-{{ item }}
      --use-private-ip
  loop: >-
    {{ range(1, (worker_count | int) + 1)
       | difference(dedicated_ci_worker_indices)
       | list | sort }}
  register: lb_target
  changed_when: lb_target.rc == 0
  retries: "{{ hcloud_write_retries }}"
  delay: "{{ hcloud_write_delay }}"
  until: >-
    lb_target.rc == 0 or
    'already' in (lb_target.stderr | default('') | lower) or
    'target' in (lb_target.stderr | default('') | lower)
  failed_when: lb_target.rc != 0 and 'already' not in (lb_target.stderr | default('')) and 'target' not in (lb_target.stderr | default(''))
  when: lb_enabled | bool

- name: Ensure dedicated CI workers are not LB targets
  ansible.builtin.command:
    cmd: >
      hcloud load-balancer remove-target {{ load_balancer_name }}
      --server {{ server_name_prefix }}-worker-{{ item }}
  loop: "{{ dedicated_ci_worker_indices }}"
  register: ci_lb_target_removal
  changed_when: ci_lb_target_removal.rc == 0
  retries: "{{ hcloud_write_retries }}"
  delay: "{{ hcloud_write_delay }}"
  until: >-
    ci_lb_target_removal.rc == 0 or
    'not' in (ci_lb_target_removal.stderr | default('') | lower) or
    'target' in (ci_lb_target_removal.stderr | default('') | lower)
  failed_when: >-
    ci_lb_target_removal.rc != 0 and
    'not' not in (ci_lb_target_removal.stderr | default('') | lower) and
    'target' not in (ci_lb_target_removal.stderr | default('') | lower)
  when:
    - lb_enabled | bool
    - dedicated_ci_worker_indices | length > 0

- name: Get load balancer public IP
  ansible.builtin.command:
    cmd: >
      hcloud load-balancer describe {{ load_balancer_name }} -o json
  register: lb_info
  changed_when: false
  retries: "{{ hcloud_read_retries }}"
  delay: "{{ hcloud_read_delay }}"
  until: lb_info.rc == 0
  when: lb_enabled | bool

- name: Compute desired and current load balancer targets
  ansible.builtin.set_fact:
    desired_lb_server_target_ids: >-
      {%- set ns = namespace(ids=[]) -%}
      {%- for server in project_servers_raw.stdout | from_json -%}
      {%- if server.name in worker_ips.keys() | list
          and (server.labels.role | default('worker')) == 'worker' -%}
      {%- set _ = ns.ids.append(server.id) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ ns.ids }}
    current_lb_server_target_ids: >-
      {%- set ns = namespace(ids=[]) -%}
      {%- for target in (lb_info.stdout | from_json).targets | default([]) -%}
      {%- if target.type == 'server' -%}
      {%- set _ = ns.ids.append(target.server.id) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ ns.ids }}
    unmanaged_lb_ip_targets: >-
      {%- set ns = namespace(items=[]) -%}
      {%- for target in (lb_info.stdout | from_json).targets | default([]) -%}
      {%- if target.type == 'ip' -%}
      {%- set _ = ns.items.append(target.ip.ip) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ ns.items }}
    unmanaged_lb_label_targets: >-
      {%- set ns = namespace(items=[]) -%}
      {%- for target in (lb_info.stdout | from_json).targets | default([]) -%}
      {%- if target.type == 'label_selector' -%}
      {%- set _ = ns.items.append(target.label_selector.selector) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ ns.items }}
  when: lb_enabled | bool

- name: Remove undeclared server targets from load balancer
  ansible.builtin.command:
    argv: [hcloud, load-balancer, remove-target, --server, '{{ item | string }}', '{{ load_balancer_name }}']
  loop: '{{ current_lb_server_target_ids | difference(desired_lb_server_target_ids) }}'
  when: lb_enabled | bool

- name: Remove undeclared IP targets from load balancer
  ansible.builtin.command:
    argv: [hcloud, load-balancer, remove-target, --ip, '{{ item }}', '{{ load_balancer_name }}']
  loop: '{{ unmanaged_lb_ip_targets }}'
  when: lb_enabled | bool

- name: Remove undeclared label-selector targets from load balancer
  ansible.builtin.command:
    argv: [hcloud, load-balancer, remove-target, --label-selector, '{{ item }}', '{{ load_balancer_name }}']
  loop: '{{ unmanaged_lb_label_targets }}'
  when: lb_enabled | bool

- name: Set LB IP fact
  set_fact:
    lb_public_ip: "{{ (lb_info.stdout | from_json).public_net.ipv4.ip }}"
  when: lb_enabled | bool and lb_info.stdout is defined

- name: Set public IP to bastion when no LB
  set_fact:
    lb_public_ip: "{{ bastion_public_ip }}"
  when: not (lb_enabled | bool)

# ============================================
# DNS Setup (Hetzner Cloud unified DNS via hcloud CLI)
# Since hcloud v1.53.0, DNS is part of the Cloud API.
# Uses HCLOUD_TOKEN (same token as servers/networks).
# Commands: hcloud zone create, hcloud zone rrset create
# Idempotent: checks existing before creating.
# ============================================

- name: Normalize the managed Hetzner DNS zone
  ansible.builtin.set_fact:
    dns_managed_domain: "{{ domain | lower | regex_replace('\\.$', '') }}"
    dns_managed_zone: >-
      {{ hetzner_dns_zone | default(domain, true) | lower | regex_replace('\\.$', '') }}
  when: hetzner_manage_dns | default(true) | bool

- name: Validate that the domain belongs to the managed DNS zone
  ansible.builtin.assert:
    that:
      - dns_managed_zone | length > 0
      - >-
        dns_managed_domain == dns_managed_zone
        or dns_managed_domain.endswith('.' + dns_managed_zone)
    fail_msg: >-
      domain={{ domain }} must equal or be a subdomain of
      hetzner_dns_zone={{ dns_managed_zone }}.
  when: hetzner_manage_dns | default(true) | bool

- name: Calculate parent-zone-relative DNS record names
  ansible.builtin.set_fact:
    dns_root_record: >-
      {{ '@' if dns_managed_domain == dns_managed_zone
         else dns_managed_domain[0:-(dns_managed_zone | length + 1)] }}
    dns_wildcard_record: >-
      {{ '*' if dns_managed_domain == dns_managed_zone
         else '*.' + dns_managed_domain[0:-(dns_managed_zone | length + 1)] }}
    dns_vpn_record: >-
      {{ 'vpn' if dns_managed_domain == dns_managed_zone
         else 'vpn.' + dns_managed_domain[0:-(dns_managed_zone | length + 1)] }}
  when: hetzner_manage_dns | default(true) | bool

- name: Check if DNS zone already exists
  ansible.builtin.command:
    argv: [hcloud, zone, describe, "{{ dns_managed_zone }}", -o, json]
  register: dns_zone_check
  when: hetzner_manage_dns | default(true) | bool
  changed_when: false
  retries: "{{ hcloud_read_retries }}"
  delay: "{{ hcloud_read_delay }}"
  until: >-
    dns_zone_check.rc == 0 or
    'not found' in (dns_zone_check.stderr | default('') | lower)
  failed_when: >-
    dns_zone_check.rc != 0 and
    'not found' not in (dns_zone_check.stderr | default('') | lower)

- name: Create DNS zone
  ansible.builtin.command:
    cmd: >
      hcloud zone create
      --name {{ dns_managed_zone }}
      --mode primary
  register: dns_zone_create
  when:
    - hetzner_manage_dns | default(true) | bool
    - dns_zone_check.rc != 0
  changed_when: dns_zone_create.rc == 0
  retries: "{{ hcloud_write_retries }}"
  delay: "{{ hcloud_write_delay }}"
  until: >-
    dns_zone_create.rc == 0 or
    'already' in (dns_zone_create.stderr | default('') | lower) or
    'exists' in (dns_zone_create.stderr | default('') | lower)
  failed_when: >-
    dns_zone_create.rc != 0 and
    'already' not in (dns_zone_create.stderr | default('') | lower) and
    'exists' not in (dns_zone_create.stderr | default('') | lower)

- name: Verify managed DNS zone exists after convergence
  ansible.builtin.command:
    argv: [hcloud, zone, describe, "{{ dns_managed_zone }}", -o, json]
  register: dns_zone_converged
  changed_when: false
  retries: "{{ hcloud_read_retries }}"
  delay: "{{ hcloud_read_delay }}"
  until: dns_zone_converged.rc == 0
  when: hetzner_manage_dns | default(true) | bool

- name: Set DNS zone available flag
  set_fact:
    dns_zone_available: "{{ hetzner_manage_dns | default(true) | bool and (dns_zone_converged.rc | default(1) == 0) }}"

- name: Create DNS wildcard A record (*.domain -> LB)
  ansible.builtin.command:
    argv:
      - hcloud
      - zone
      - rrset
      - set-records
      - --record
      - "{{ lb_public_ip }}"
      - "{{ dns_managed_zone }}"
      - "{{ dns_wildcard_record }}"
      - A
  register: dns_wildcard
  changed_when: dns_wildcard.rc == 0
  retries: "{{ hcloud_write_retries }}"
  delay: "{{ hcloud_write_delay }}"
  until: dns_wildcard.rc == 0
  failed_when: dns_wildcard.rc != 0
  when:
    - hetzner_manage_dns | default(true) | bool
    - dns_zone_available | bool

- name: Create DNS root A record (domain -> LB)
  ansible.builtin.command:
    argv:
      - hcloud
      - zone
      - rrset
      - set-records
      - --record
      - "{{ lb_public_ip }}"
      - "{{ dns_managed_zone }}"
      - "{{ dns_root_record }}"
      - A
  register: dns_root
  changed_when: dns_root.rc == 0
  retries: "{{ hcloud_write_retries }}"
  delay: "{{ hcloud_write_delay }}"
  until: dns_root.rc == 0
  failed_when: dns_root.rc != 0
  when:
    - hetzner_manage_dns | default(true) | bool
    - dns_zone_available | bool

- name: Create DNS VPN A record (vpn.domain -> bastion)
  ansible.builtin.command:
    argv:
      - hcloud
      - zone
      - rrset
      - set-records
      - --record
      - "{{ bastion_public_ip }}"
      - "{{ dns_managed_zone }}"
      - "{{ dns_vpn_record }}"
      - A
  register: dns_vpn
  changed_when: dns_vpn.rc == 0
  retries: "{{ hcloud_write_retries }}"
  delay: "{{ hcloud_write_delay }}"
  until: dns_vpn.rc == 0
  failed_when: dns_vpn.rc != 0
  when:
    - hetzner_manage_dns | default(true) | bool
    - dns_zone_available | bool

# ============================================
# Write infrastructure state
# ============================================

- name: Write infrastructure facts
  copy:
    dest: "{{ playbook_dir }}/{{ project }}-infra-facts.yml"
    content: |
      ---
      project: "{{ project }}"
      domain: "{{ domain }}"
      hetzner_dns_zone: "{{ hetzner_dns_zone | default(domain, true) }}"
      region: "{{ region }}"
      tier: "{{ infra_tier }}"
      bastion_public_ip: "{{ bastion_public_ip }}"
      bastion_private_ip: "{{ bastion_private_ip }}"
      lb_ip: "{{ lb_public_ip }}"
      lb_enabled: {{ lb_enabled | bool }}
      cp_count: {{ cp_count }}
      cp_schedulable: {{ cp_schedulable | bool }}
      worker_count: {{ worker_count }}
      master_ips: {{ master_ips | to_json }}
      worker_ips: {{ worker_ips | to_json }}
      first_master_ip: "{{ first_master_ip }}"
    mode: '0600'

- name: Display infrastructure summary
  debug:
    msg:
      - "=========================================="
      - "  Hetzner Infrastructure Provisioned"
      - "=========================================="
      - "  Project: {{ project }}"
      - "  Region: {{ region }} (zone: {{ network_zone }})"
      - "  Tier: {{ infra_tier }}"
      - "  Bastion IP: {{ bastion_public_ip }} (private: {{ bastion_private_ip }})"
      - "  LB IP: {{ lb_public_ip }}"
      - "  Masters: {{ cp_count }}x {{ cp_type }}"
      - "  Workers: {{ worker_type_plan | join(', ') }}"
      - "  Master IPs: {{ master_ips }}"
      - "  Worker IPs: {{ worker_ips }}"
      - "=========================================="
