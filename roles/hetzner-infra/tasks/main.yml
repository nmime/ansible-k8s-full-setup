---
# Hetzner Infrastructure Role
# Provisions Hetzner Cloud: servers, networks, load balancers, firewalls, DNS
# Drift-detecting and convergent — destructive server changes require approval.
# Uses hcloud CLI. Naming: {project}-{resource}

- name: Set infrastructure tier-specific variables
  set_fact:
    project: "{{ project_name | default('k8s') }}"
    region: "{{ infrastructure.region | default(hetzner_region | default('hel1')) }}"
    infra_tier: "{{ tier | default('medium') }}"
    network_cidr: "{{ network.private_network.cidr | default(private_network_cidr) }}"
    infra_subnet_cidr: "{{ network.private_network.infrastructure | default(infrastructure_subnet) }}"
    control_plane_subnet_cidr: "{{ network.private_network.control_plane | default(control_plane_subnet) }}"
    worker_subnet_cidr: "{{ network.private_network.workers | default(workers_subnet) }}"
    load_balancer_type: "{{ network.load_balancer.type | default('lb11') }}"

# ============================================
# Auto-select cheapest server types from Hetzner API
# ============================================

- name: Fetch available server types from Hetzner API
  ansible.builtin.command:
    cmd: hcloud server-type list -o json
  register: hcloud_server_types_raw
  changed_when: false

- name: Set EU locations list
  set_fact:
    hetzner_eu_locations:
      - "fsn1"
      - "nbg1"
      - "hel1"

- name: Build region-aware server type list sorted by price
  set_fact:
    available_server_types: >-
      {%- set raw = hcloud_server_types_raw.stdout | from_json
           | selectattr('architecture', 'equalto', 'x86')
           | list
           | json_query('[].{
               name: name,
               cores: cores,
               memory: memory,
               price: prices[?location==`' + region + '`] | [0].price_monthly.gross
             }')
           | selectattr('price', 'defined')
           | selectattr('price', 'ne', None)
           | list -%}
      {%- set ns = namespace(result=[]) -%}
      {%- for item in raw -%}
        {%- set _ = ns.result.append(item | combine({'price_num': item.price | float})) -%}
      {%- endfor -%}
      {{ ns.result | sort(attribute='price_num') | list }}

- name: Set tier spec reference
  set_fact:
    current_tier_spec: >-
      {{ hetzner_tier_specs[infra_tier] | combine({
        'cp_count': infrastructure.control_plane.count | default(hetzner_tier_specs[infra_tier].cp_count),
        'cp_schedulable': infrastructure.control_plane.schedulable | default(hetzner_tier_specs[infra_tier].cp_schedulable),
        'worker_count': infrastructure.workers.count | default(hetzner_tier_specs[infra_tier].worker_count),
        'lb_enabled': network.load_balancer.enabled | default(hetzner_tier_specs[infra_tier].lb_enabled)
      }) }}

# --- Try primary region first, fallback to any EU location ---

- name: Find bastion type in primary region
  set_fact:
    auto_bastion_type: >-
      {{ (available_server_types
          | selectattr('cores', 'ge', 2)
          | selectattr('memory', 'ge', 4)
          | map(attribute='name')
          | first | default('')) }}
  when: hetzner_bastion_type | default('') | length == 0

- name: Find control plane type in primary region
  set_fact:
    auto_cp_type: >-
      {{ (available_server_types
          | selectattr('cores', 'ge', current_tier_spec.cp_min_cores | int)
          | selectattr('memory', 'ge', current_tier_spec.cp_min_memory | int)
          | map(attribute='name')
          | first | default('')) }}
  when: hetzner_cp_type | default('') | length == 0

- name: Find worker type in primary region
  set_fact:
    auto_worker_type: >-
      {{ (available_server_types
          | selectattr('cores', 'ge', current_tier_spec.worker_min_cores | int)
          | selectattr('memory', 'ge', current_tier_spec.worker_min_memory | int)
          | map(attribute='name')
          | first | default('')) }}
  when: hetzner_worker_type | default('') | length == 0

- name: Check if any auto-selected type is missing in primary region
  set_fact:
    needs_eu_fallback: >-
      {{ (hetzner_bastion_type | default(auto_bastion_type | default(''), true) | trim | length == 0)
         or (hetzner_cp_type | default(auto_cp_type | default(''), true) | trim | length == 0)
         or (hetzner_worker_type | default(auto_worker_type | default(''), true) | trim | length == 0) }}

- name: Find cheapest EU fallback region
  block:
    - name: Build EU-wide server type lists per location
      set_fact:
        eu_types_by_location: >-
          {{ dict(
               hetzner_eu_locations
               | zip(
                   hetzner_eu_locations | map('regex_replace', '(.*)',
                     hcloud_server_types_raw.stdout | from_json
                     | selectattr('architecture', 'equalto', 'x86')
                     | list
                     | to_json
                   )
                 )
             ) }}

    - name: Pick cheapest EU location that has all needed types
      set_fact:
        eu_fallback_region: "{{ item }}"
        eu_fallback_types: >-
          {%- set raw = hcloud_server_types_raw.stdout | from_json
               | selectattr('architecture', 'equalto', 'x86')
               | list
               | json_query('[].{
                   name: name,
                   cores: cores,
                   memory: memory,
                   price: prices[?location==`' + item + '`] | [0].price_monthly.gross
                 }')
               | selectattr('price', 'defined')
               | selectattr('price', 'ne', None)
               | list -%}
          {%- set ns = namespace(result=[]) -%}
          {%- for t in raw -%}
            {%- set _ = ns.result.append(t | combine({'price_num': t.price | float})) -%}
          {%- endfor -%}
          {{ ns.result | sort(attribute='price_num') | list }}
      loop: "{{ hetzner_eu_locations | reject('equalto', region) | list }}"
      when: >-
        eu_fallback_region is not defined
        and (hcloud_server_types_raw.stdout | from_json
             | selectattr('architecture', 'equalto', 'x86')
             | list
             | json_query('[].{
                 name: name,
                 cores: cores,
                 memory: memory,
                 price: prices[?location==`' + item + '`] | [0].price_monthly.gross
               }')
             | selectattr('price', 'defined')
             | selectattr('price', 'ne', None)
             | selectattr('cores', 'ge', current_tier_spec.worker_min_cores | int)
             | selectattr('memory', 'ge', current_tier_spec.worker_min_memory | int)
             | list | length > 0)

    - name: Switch to EU fallback region
      set_fact:
        region: "{{ eu_fallback_region }}"
        available_server_types: "{{ eu_fallback_types }}"

    - name: Re-select bastion type from EU fallback
      set_fact:
        auto_bastion_type: >-
          {{ (eu_fallback_types
              | selectattr('cores', 'ge', 2)
              | selectattr('memory', 'ge', 4)
              | map(attribute='name')
              | first) }}
      when: hetzner_bastion_type | default('') | length == 0 and (auto_bastion_type | default('') | trim | length == 0)

    - name: Re-select control plane type from EU fallback
      set_fact:
        auto_cp_type: >-
          {{ (eu_fallback_types
              | selectattr('cores', 'ge', current_tier_spec.cp_min_cores | int)
              | selectattr('memory', 'ge', current_tier_spec.cp_min_memory | int)
              | map(attribute='name')
              | first) }}
      when: hetzner_cp_type | default('') | length == 0 and (auto_cp_type | default('') | trim | length == 0)

    - name: Re-select worker type from EU fallback
      set_fact:
        auto_worker_type: >-
          {{ (eu_fallback_types
              | selectattr('cores', 'ge', current_tier_spec.worker_min_cores | int)
              | selectattr('memory', 'ge', current_tier_spec.worker_min_memory | int)
              | map(attribute='name')
              | first) }}
      when: hetzner_worker_type | default('') | length == 0 and (auto_worker_type | default('') | trim | length == 0)

    - name: Warn about region fallback
      debug:
        msg: "WARNING: Region {{ hetzner_region | default('hel1') }} lacked suitable types. Falling back to {{ eu_fallback_region }}"
  when: needs_eu_fallback | bool

- name: Set tier-specific server configuration
  set_fact:
    cp_count: "{{ current_tier_spec.cp_count }}"
    cp_type: "{{ hetzner_cp_type | default(auto_cp_type, true) | trim }}"
    cp_schedulable: "{{ current_tier_spec.cp_schedulable | default(false) }}"
    worker_count: "{{ current_tier_spec.worker_count }}"
    worker_type: "{{ hetzner_worker_type | default(auto_worker_type, true) | trim }}"
    bastion_type: "{{ hetzner_bastion_type | default(auto_bastion_type, true) | trim }}"
    lb_enabled: "{{ current_tier_spec.lb_enabled | default(true) }}"

- name: Validate all server types were found
  assert:
    that:
      - bastion_type | length > 0
      - cp_type | length > 0
      - worker_type | length > 0
    fail_msg: >
      Could not find suitable server types in any EU region.
      Bastion={{ bastion_type }}, CP={{ cp_type }}, Worker={{ worker_type }}.
      Override manually: hetzner_bastion_type, hetzner_cp_type, hetzner_worker_type

- name: Resolve selected server type capacities
  ansible.builtin.set_fact:
    selected_bastion_spec: >-
      {{ hcloud_server_types_raw.stdout | from_json
         | selectattr('name', 'equalto', bastion_type) | first | default({}) }}
    selected_cp_spec: >-
      {{ hcloud_server_types_raw.stdout | from_json
         | selectattr('name', 'equalto', cp_type) | first | default({}) }}
    selected_worker_spec: >-
      {{ hcloud_server_types_raw.stdout | from_json
         | selectattr('name', 'equalto', worker_type) | first | default({}) }}

- name: Reject undersized explicit or auto-selected server types
  ansible.builtin.assert:
    that:
      - selected_bastion_spec | length > 0
      - selected_bastion_spec.cores | int >= 2
      - selected_bastion_spec.memory | int >= 4
      - selected_cp_spec | length > 0
      - selected_cp_spec.cores | int >= current_tier_spec.cp_min_cores | int
      - selected_cp_spec.memory | int >= current_tier_spec.cp_min_memory | int
      - selected_worker_spec | length > 0
      - selected_worker_spec.cores | int >= current_tier_spec.worker_min_cores | int
      - selected_worker_spec.memory | int >= current_tier_spec.worker_min_memory | int
    fail_msg: >-
      Selected server types do not satisfy the {{ platform_profile }} profile
      capacity floor. Bastion={{ bastion_type }} (minimum 2 cores/4 GiB),
      control-plane={{ cp_type }} (minimum {{ current_tier_spec.cp_min_cores }}
      cores/{{ current_tier_spec.cp_min_memory }} GiB), worker={{ worker_type }}
      (minimum {{ current_tier_spec.worker_min_cores }} cores/
      {{ current_tier_spec.worker_min_memory }} GiB).

- name: Build price lookup from available types
  set_fact:
    type_price_map: "{{ dict(available_server_types | map(attribute='name') | zip(available_server_types | map(attribute='price'))) }}"

- name: Display selected server types
  debug:
    msg:
      - "Tier: {{ infra_tier }} | Region: {{ region }}"
      - "Bastion: {{ bastion_type }} (~€{{ type_price_map[bastion_type] | default('?') }}/mo)"
      - "Control plane: {{ cp_type }} x{{ cp_count }} (~€{{ type_price_map[cp_type] | default('?') }}/mo each)"
      - "Workers: {{ worker_type }} x{{ worker_count }} (~€{{ type_price_map[worker_type] | default('?') }}/mo each)"

- name: Map region to network zone
  set_fact:
    network_zone: >-
      {{ region_zone_map[region[:3]] | default('eu-central') }}
  vars:
    region_zone_map:
      hel: eu-central
      fsn: eu-central
      nbg: eu-central
      ash: us-east
      hil: us-west

- name: Validate HCLOUD_TOKEN is set
  assert:
    that:
      - lookup('env', 'HCLOUD_TOKEN') | length > 0
    fail_msg: "HCLOUD_TOKEN not set. Get from: https://console.hetzner.cloud -> Security -> API Tokens"

# ============================================
# SSH Key
# ============================================

- name: Check if SSH key already exists
  ansible.builtin.command:
    cmd: hcloud ssh-key describe {{ project }}-key -o json
  register: ssh_key_check
  changed_when: false
  failed_when: false

- name: Get local SSH public key fingerprint in MD5 hex format
  ansible.builtin.shell: |
    ssh-keygen -l -E md5 -f {{ ssh_key_path | default('~/.ssh/id_ed25519') }}.pub | awk '{print $2}' | sed 's/^MD5://'
  register: local_key_fingerprint
  changed_when: false
  when: ssh_key_check.rc != 0

- name: Find existing SSH key by fingerprint
  ansible.builtin.shell: |
    hcloud ssh-key list -o json | python3 -c "import sys,json; keys=json.load(sys.stdin); matches=[k['name'] for k in keys if k['fingerprint']=='{{ local_key_fingerprint.stdout | trim }}']; print(matches[0] if matches else '')"
  register: existing_key_by_fp
  changed_when: false
  when: ssh_key_check.rc != 0

- name: Upload SSH public key to Hetzner
  ansible.builtin.command:
    cmd: >
      hcloud ssh-key create
      --name {{ project }}-key
      --public-key-from-file {{ ssh_key_path | default('~/.ssh/id_ed25519') }}.pub
  register: ssh_key_create
  changed_when: ssh_key_create.rc == 0
  failed_when: ssh_key_create.rc != 0
  when: ssh_key_check.rc != 0 and (existing_key_by_fp.stdout | default('') | trim | length == 0)

- name: Set SSH key name fact
  set_fact:
    hcloud_ssh_key: "{{ (ssh_key_check.rc == 0) | ternary(project + '-key', (existing_key_by_fp.stdout | default('') | trim | length > 0) | ternary(existing_key_by_fp.stdout | default('') | trim, project + '-key')) }}"

# ============================================
# Network
# ============================================

- name: Check if network already exists
  ansible.builtin.command:
    cmd: hcloud network describe {{ project }}-network -o json
  register: network_check
  changed_when: false
  failed_when: false

- name: Create private network
  ansible.builtin.command:
    cmd: >
      hcloud network create
      --name {{ project }}-network
      --ip-range {{ network_cidr }}
      --label project={{ project }}
  when: network_check.rc != 0

- name: Create infrastructure subnet
  ansible.builtin.command:
    cmd: >
      hcloud network add-subnet {{ project }}-network
      --type cloud
      --network-zone {{ network_zone }}
      --ip-range {{ infra_subnet_cidr }}
  register: subnet_infra
  changed_when: subnet_infra.rc == 0
  failed_when: >-
    subnet_infra.rc != 0
    and 'already' not in (subnet_infra.stderr | default(''))
    and 'exists' not in (subnet_infra.stderr | default(''))
    and 'overlaps' not in (subnet_infra.stderr | default(''))
    and 'duplicate' not in (subnet_infra.stderr | default(''))
    and 'uniqueness' not in (subnet_infra.stderr | default(''))

- name: Create control plane subnet
  ansible.builtin.command:
    cmd: >
      hcloud network add-subnet {{ project }}-network
      --type cloud
      --network-zone {{ network_zone }}
      --ip-range {{ control_plane_subnet_cidr }}
  register: subnet_cp
  changed_when: subnet_cp.rc == 0
  failed_when: >-
    subnet_cp.rc != 0
    and 'already' not in (subnet_cp.stderr | default(''))
    and 'exists' not in (subnet_cp.stderr | default(''))
    and 'overlaps' not in (subnet_cp.stderr | default(''))
    and 'duplicate' not in (subnet_cp.stderr | default(''))
    and 'uniqueness' not in (subnet_cp.stderr | default(''))

- name: Create workers subnet
  ansible.builtin.command:
    cmd: >
      hcloud network add-subnet {{ project }}-network
      --type cloud
      --network-zone {{ network_zone }}
      --ip-range {{ worker_subnet_cidr }}
  register: subnet_workers
  changed_when: subnet_workers.rc == 0
  failed_when: >-
    subnet_workers.rc != 0
    and 'already' not in (subnet_workers.stderr | default(''))
    and 'exists' not in (subnet_workers.stderr | default(''))
    and 'overlaps' not in (subnet_workers.stderr | default(''))
    and 'duplicate' not in (subnet_workers.stderr | default(''))
    and 'uniqueness' not in (subnet_workers.stderr | default(''))

# ============================================
# Placement Group (for HA)
# ============================================

- name: Check if placement group already exists
  ansible.builtin.command:
    cmd: hcloud placement-group describe {{ project }}-spread -o json
  register: pg_check
  changed_when: false
  failed_when: false
  when: infra_tier in ['medium', 'production']

- name: Create placement group for spread
  ansible.builtin.command:
    cmd: >
      hcloud placement-group create
      --name {{ project }}-spread
      --type spread
  when: infra_tier in ['medium', 'production'] and pg_check.rc != 0

# ============================================
# Firewalls
# ============================================

- name: Check if bastion firewall already exists
  ansible.builtin.command:
    cmd: hcloud firewall describe {{ project }}-fw-bastion -o json
  register: fw_bastion_check
  changed_when: false
  failed_when: false

- name: Create bastion firewall
  ansible.builtin.command:
    cmd: >
      hcloud firewall create
      --name {{ project }}-fw-bastion
      --label project={{ project }}
  when: fw_bastion_check.rc != 0

- name: Define the complete bastion firewall policy
  ansible.builtin.set_fact:
    desired_bastion_firewall_rules:
      - direction: in
        protocol: tcp
        port: '22'
        source_ips: '{{ hetzner_ssh_source_ips | default(["0.0.0.0/0", "::/0"]) }}'
        description: SSH access
      - direction: in
        protocol: tcp
        port: '443'
        source_ips: [0.0.0.0/0, '::/0']
        description: Headscale VPN
      - direction: in
        protocol: udp
        port: '3478'
        source_ips: [0.0.0.0/0, '::/0']
        description: STUN/DERP for VPN
      - direction: in
        protocol: udp
        port: '41641'
        source_ips: [0.0.0.0/0, '::/0']
        description: WireGuard/Tailscale VPN

- name: Read current bastion firewall after creation
  ansible.builtin.command:
    cmd: hcloud firewall describe {{ project }}-fw-bastion -o json
  register: fw_bastion_current
  changed_when: false

- name: Normalize current bastion firewall policy for comparison
  ansible.builtin.set_fact:
    current_bastion_firewall_rules: >-
      {%- set ns = namespace(rules=[]) -%}
      {%- for rule in (fw_bastion_current.stdout | from_json).rules | default([]) -%}
      {%- set _ = ns.rules.append({
        'direction': rule.direction,
        'protocol': rule.protocol,
        'port': rule.port,
        'source_ips': rule.source_ips,
        'description': rule.description
      }) -%}
      {%- endfor -%}
      {{ ns.rules }}

- name: Stage complete bastion firewall policy
  ansible.builtin.copy:
    dest: /tmp/{{ project }}-fw-bastion-rules.json
    content: '{{ desired_bastion_firewall_rules | to_nice_json }}'
    mode: '0600'
  when: current_bastion_firewall_rules != desired_bastion_firewall_rules

- name: Replace drifted bastion firewall policy atomically
  ansible.builtin.command:
    cmd: >-
      hcloud firewall replace-rules
      --rules-file /tmp/{{ project }}-fw-bastion-rules.json
      {{ project }}-fw-bastion
  when: current_bastion_firewall_rules != desired_bastion_firewall_rules

- name: Remove staged bastion firewall policy
  ansible.builtin.file:
    path: /tmp/{{ project }}-fw-bastion-rules.json
    state: absent

- name: Check if node firewall already exists
  ansible.builtin.command:
    cmd: hcloud firewall describe {{ project }}-fw-nodes -o json
  register: fw_nodes_check
  changed_when: false
  failed_when: false

- name: Create node firewall (private network only)
  ansible.builtin.command:
    cmd: >
      hcloud firewall create
      --name {{ project }}-fw-nodes
      --label project={{ project }}
  when: fw_nodes_check.rc != 0

- name: Define the complete node firewall policy
  ansible.builtin.set_fact:
    desired_node_firewall_rules:
      - direction: in
        protocol: tcp
        port: '22'
        source_ips: ['{{ network_cidr }}', 100.64.0.0/10]
        description: SSH from private network and VPN
      - direction: in
        protocol: tcp
        port: '6443'
        source_ips: ['{{ network_cidr }}', 100.64.0.0/10]
        description: Kubernetes API
      - direction: in
        protocol: tcp
        port: '10250'
        source_ips: ['{{ network_cidr }}', 100.64.0.0/10]
        description: Kubelet API
      - direction: in
        protocol: tcp
        port: 30000-32767
        source_ips: ['{{ network_cidr }}', 100.64.0.0/10]
        description: NodePort range
      - direction: in
        protocol: tcp
        port: 2379-2380
        source_ips: ['{{ network_cidr }}']
        description: etcd cluster
      - direction: in
        protocol: tcp
        port: '4240'
        source_ips: ['{{ network_cidr }}']
        description: Cilium health checks
      - direction: in
        protocol: udp
        port: '8472'
        source_ips: ['{{ network_cidr }}']
        description: Cilium VXLAN overlay

- name: Read current node firewall after creation
  ansible.builtin.command:
    cmd: hcloud firewall describe {{ project }}-fw-nodes -o json
  register: fw_nodes_current
  changed_when: false

- name: Normalize current node firewall policy for comparison
  ansible.builtin.set_fact:
    current_node_firewall_rules: >-
      {%- set ns = namespace(rules=[]) -%}
      {%- for rule in (fw_nodes_current.stdout | from_json).rules | default([]) -%}
      {%- set _ = ns.rules.append({
        'direction': rule.direction,
        'protocol': rule.protocol,
        'port': rule.port,
        'source_ips': rule.source_ips,
        'description': rule.description
      }) -%}
      {%- endfor -%}
      {{ ns.rules }}

- name: Stage complete node firewall policy
  ansible.builtin.copy:
    dest: /tmp/{{ project }}-fw-nodes-rules.json
    content: '{{ desired_node_firewall_rules | to_nice_json }}'
    mode: '0600'
  when: current_node_firewall_rules != desired_node_firewall_rules

- name: Replace drifted node firewall policy atomically
  ansible.builtin.command:
    cmd: >-
      hcloud firewall replace-rules
      --rules-file /tmp/{{ project }}-fw-nodes-rules.json
      {{ project }}-fw-nodes
  when: current_node_firewall_rules != desired_node_firewall_rules

- name: Remove staged node firewall policy
  ansible.builtin.file:
    path: /tmp/{{ project }}-fw-nodes-rules.json
    state: absent

# ============================================
# Bastion Server (public IP)
# ============================================

- name: Check if bastion server already exists
  ansible.builtin.command:
    cmd: hcloud server describe {{ project }}-bastion -o json
  register: bastion_check
  changed_when: false
  failed_when: false

- name: Create bastion server
  ansible.builtin.command:
    argv:
      - hcloud
      - server
      - create
      - --name
      - "{{ project }}-bastion"
      - --type
      - "{{ bastion_type }}"
      - --image
      - "{{ hetzner_image | default('ubuntu-24.04') }}"
      - --location
      - "{{ region }}"
      - --ssh-key
      - "{{ hcloud_ssh_key }}"
      - --network
      - "{{ project }}-network"
      - --firewall
      - "{{ project }}-fw-bastion"
      - --label
      - "project={{ project }},role=bastion"
  when: bastion_check.rc != 0

- name: Get bastion public IP
  ansible.builtin.command:
    cmd: hcloud server ip {{ project }}-bastion
  register: bastion_ip_result
  changed_when: false

- name: Set bastion IP fact
  set_fact:
    bastion_public_ip: "{{ bastion_ip_result.stdout | trim }}"

- name: Get bastion private IP
  ansible.builtin.shell:
    cmd: hcloud server describe {{ project }}-bastion -o json | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['private_net'][0]['ip'])"
  register: bastion_private_ip_result
  changed_when: false

- name: Set bastion private IP fact
  set_fact:
    bastion_private_ip: "{{ bastion_private_ip_result.stdout | trim }}"

- name: Wait for bastion SSH to be ready
  wait_for:
    host: "{{ bastion_public_ip }}"
    port: 22
    delay: 10
    timeout: 300
  delegate_to: localhost
  become: false

# ============================================
# Control Plane Servers (private network only)
# ============================================

- name: Check if control plane servers already exist
  ansible.builtin.command:
    cmd: hcloud server describe {{ project }}-master-{{ item }} -o json
  loop: "{{ range(1, (cp_count | int) + 1) | list }}"
  register: master_check
  changed_when: false
  failed_when: false

- name: Create control plane servers
  ansible.builtin.command:
    argv: >-
      {{
        [
          'hcloud', 'server', 'create',
          '--name', project + '-master-' + (item | string),
          '--type', cp_type,
          '--image', hetzner_image | default('ubuntu-24.04'),
          '--location', region,
          '--ssh-key', hcloud_ssh_key,
          '--network', project + '-network',
          '--firewall', project + '-fw-nodes',
          '--without-ipv4', '--without-ipv6',
          '--label', 'project=' + project + ',role=master,index=' + (item | string)
        ]
        + (['--placement-group', project + '-spread']
           if infra_tier in ['medium', 'production'] else [])
      }}
  loop: "{{ range(1, (cp_count | int) + 1) | list }}"
  when: master_check.results[item - 1].rc != 0

# ============================================
# Worker Servers (private network only)
# ============================================

- name: Check if worker servers already exist
  ansible.builtin.command:
    cmd: hcloud server describe {{ project }}-worker-{{ item }} -o json
  loop: "{{ range(1, (worker_count | int) + 1) | list }}"
  register: worker_check
  changed_when: false
  failed_when: false

- name: Create worker servers
  ansible.builtin.command:
    argv: >-
      {{
        [
          'hcloud', 'server', 'create',
          '--name', project + '-worker-' + (item | string),
          '--type', worker_type,
          '--image', hetzner_image | default('ubuntu-24.04'),
          '--location', region,
          '--ssh-key', hcloud_ssh_key,
          '--network', project + '-network',
          '--firewall', project + '-fw-nodes',
          '--without-ipv4', '--without-ipv6',
          '--label', 'project=' + project + ',role=worker,index=' + (item | string)
        ]
        + (['--placement-group', project + '-spread']
           if infra_tier in ['medium', 'production'] else [])
      }}
  loop: "{{ range(1, (worker_count | int) + 1) | list }}"
  when: worker_check.results[item - 1].rc != 0

- name: List project servers for convergence verification
  ansible.builtin.command:
    cmd: hcloud server list --selector project={{ project }} -o json
  register: project_servers_raw
  changed_when: false

- name: Build desired server inventory
  ansible.builtin.set_fact:
    desired_server_names: >-
      {%- set ns = namespace(names=[project + '-bastion']) -%}
      {%- for index in range(1, (cp_count | int) + 1) -%}
      {%- set _ = ns.names.append(project + '-master-' + (index | string)) -%}
      {%- endfor -%}
      {%- for index in range(1, (worker_count | int) + 1) -%}
      {%- set _ = ns.names.append(project + '-worker-' + (index | string)) -%}
      {%- endfor -%}
      {{ ns.names }}

- name: Detect server count and type drift
  ansible.builtin.set_fact:
    extra_server_names: >-
      {{ (project_servers_raw.stdout | from_json | map(attribute='name') | list)
         | difference(desired_server_names) }}
    mismatched_servers: >-
      {%- set ns = namespace(items=[]) -%}
      {%- for server in project_servers_raw.stdout | from_json -%}
      {%- set desired_type = bastion_type if server.name == project + '-bastion'
          else cp_type if server.name is match('^' + project + '-master-')
          else worker_type if server.name is match('^' + project + '-worker-')
          else '' -%}
      {%- if desired_type and server.server_type.name != desired_type -%}
      {%- set _ = ns.items.append({'name': server.name, 'current': server.server_type.name, 'desired': desired_type}) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ ns.items }}

- name: Refuse unsafe server deletion or bulk type convergence
  ansible.builtin.assert:
    that:
      - extra_server_names | length == 0
      - mismatched_servers | length == 0
    fail_msg: >-
      Infrastructure drift detected. Extra servers={{ extra_server_names }};
      type changes={{ mismatched_servers }}. The infrastructure role never
      deletes Kubernetes nodes or resizes multiple members because doing so can
      bypass drain, PDB, CSI, and etcd quorum gates. Use migrate-profile.sh for
      profile changes; it removes and resizes nodes one at a time.

# ============================================
# Discover actual private IPs from Hetzner API
# ============================================

- name: Get control plane server private IPs
  ansible.builtin.shell:
    cmd: hcloud server describe {{ project }}-master-{{ item }} -o json | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['private_net'][0]['ip'])"
  loop: "{{ range(1, (cp_count | int) + 1) | list }}"
  register: master_ip_results
  changed_when: false

- name: Get worker server private IPs
  ansible.builtin.shell:
    cmd: hcloud server describe {{ project }}-worker-{{ item }} -o json | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['private_net'][0]['ip'])"
  loop: "{{ range(1, (worker_count | int) + 1) | list }}"
  register: worker_ip_results
  changed_when: false

- name: Reset discovered node IP maps before rebuilding them
  set_fact:
    master_ips: {}
    worker_ips: {}

- name: Build master IP map
  set_fact:
    master_ips: "{{ master_ips | default({}) | combine({ project + '-master-' + (item.item | string): item.stdout | trim }) }}"
  loop: "{{ master_ip_results.results }}"
  loop_control:
    label: "{{ project }}-master-{{ item.item }}"

- name: Build worker IP map
  set_fact:
    worker_ips: "{{ worker_ips | default({}) | combine({ project + '-worker-' + (item.item | string): item.stdout | trim }) }}"
  loop: "{{ worker_ip_results.results }}"
  loop_control:
    label: "{{ project }}-worker-{{ item.item }}"

- name: Record private IPs allocated to servers created in this run
  ansible.builtin.set_fact:
    newly_created_node_ips: >-
      {%- set ns = namespace(ips=[]) -%}
      {%- for check in master_check.results | default([]) -%}
      {%- if (check.rc | default(0)) != 0 -%}
      {%- set _ = ns.ips.append(master_ips[project + '-master-' + (check.item | string)]) -%}
      {%- endif -%}
      {%- endfor -%}
      {%- for check in worker_check.results | default([]) -%}
      {%- if (check.rc | default(0)) != 0 -%}
      {%- set _ = ns.ips.append(worker_ips[project + '-worker-' + (check.item | string)]) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ ns.ips }}

- name: Set first master IP for kubeconfig
  set_fact:
    first_master_ip: "{{ master_ips[project + '-master-1'] }}"

- name: Display discovered node IPs
  debug:
    msg:
      - "Master IPs: {{ master_ips }}"
      - "Worker IPs: {{ worker_ips }}"
      - "First master: {{ first_master_ip }}"

# ============================================
# Load Balancer
# ============================================

- name: Check if load balancer already exists
  ansible.builtin.command:
    cmd: hcloud load-balancer describe {{ project }}-lb -o json
  register: lb_check
  changed_when: false
  failed_when: false

- name: Remove load balancer when disabled by the profile
  ansible.builtin.command:
    cmd: hcloud load-balancer delete {{ project }}-lb
  when:
    - not (lb_enabled | bool)
    - lb_check.rc == 0

- name: Create load balancer
  ansible.builtin.command:
    cmd: >
      hcloud load-balancer create
      --name {{ project }}-lb
      --type {{ load_balancer_type }}
      --location {{ region }}
      --label project={{ project }}
  when: lb_enabled | bool and lb_check.rc != 0

- name: Attach LB to private network
  ansible.builtin.command:
    cmd: >
      hcloud load-balancer attach-to-network {{ project }}-lb
      --network {{ project }}-network
  register: lb_network
  changed_when: lb_network.rc == 0
  failed_when: lb_network.rc != 0 and 'already' not in (lb_network.stderr | default('')) and 'attached' not in (lb_network.stderr | default(''))
  when: lb_enabled | bool

- name: Read load balancer configuration for convergence
  ansible.builtin.command:
    cmd: hcloud load-balancer describe {{ project }}-lb -o json
  register: lb_config
  changed_when: false
  when: lb_enabled | bool

- name: Index current load balancer services
  ansible.builtin.set_fact:
    lb_current_services: '{{ (lb_config.stdout | from_json).services | default([]) }}'
    lb_https_service: >-
      {{ ((lb_config.stdout | from_json).services | default([])
          | selectattr('listen_port', 'equalto', 443) | list | first) | default({}) }}
    lb_http_service: >-
      {{ ((lb_config.stdout | from_json).services | default([])
          | selectattr('listen_port', 'equalto', 80) | list | first) | default({}) }}
  when: lb_enabled | bool

- name: Remove load balancer services outside the declared policy
  ansible.builtin.command:
    argv:
      - hcloud
      - load-balancer
      - delete-service
      - --listen-port
      - '{{ item.listen_port | string }}'
      - '{{ project }}-lb'
  loop: '{{ lb_current_services | rejectattr("listen_port", "in", [80, 443]) | list }}'
  when: lb_enabled | bool

- name: Add missing LB service for HTTPS (443 -> NodePort 30443)
  ansible.builtin.command:
    cmd: >-
      hcloud load-balancer add-service {{ project }}-lb
      --protocol tcp --listen-port 443 --destination-port 30443
      --health-check-protocol tcp --health-check-port 30443
  when:
    - lb_enabled | bool
    - lb_https_service | length == 0

- name: Reconcile drifted LB service for HTTPS
  ansible.builtin.command:
    cmd: >-
      hcloud load-balancer update-service {{ project }}-lb
      --listen-port 443 --protocol tcp --destination-port 30443
      --health-check-protocol tcp --health-check-port 30443
  when:
    - lb_enabled | bool
    - lb_https_service | length > 0
    - >-
      lb_https_service.protocol != 'tcp'
      or lb_https_service.destination_port != 30443
      or lb_https_service.health_check.protocol != 'tcp'
      or lb_https_service.health_check.port != 30443

- name: Add missing LB service for HTTP (80 -> NodePort 30080)
  ansible.builtin.command:
    cmd: >-
      hcloud load-balancer add-service {{ project }}-lb
      --protocol tcp --listen-port 80 --destination-port 30080
      --health-check-protocol tcp --health-check-port 30080
  when:
    - lb_enabled | bool
    - lb_http_service | length == 0

- name: Reconcile drifted LB service for HTTP
  ansible.builtin.command:
    cmd: >-
      hcloud load-balancer update-service {{ project }}-lb
      --listen-port 80 --protocol tcp --destination-port 30080
      --health-check-protocol tcp --health-check-port 30080
  when:
    - lb_enabled | bool
    - lb_http_service | length > 0
    - >-
      lb_http_service.protocol != 'tcp'
      or lb_http_service.destination_port != 30080
      or lb_http_service.health_check.protocol != 'tcp'
      or lb_http_service.health_check.port != 30080

- name: Add worker servers as LB targets
  ansible.builtin.command:
    cmd: >
      hcloud load-balancer add-target {{ project }}-lb
      --server {{ project }}-worker-{{ item }}
      --use-private-ip
  loop: "{{ range(1, (worker_count | int) + 1) | list }}"
  register: lb_target
  changed_when: lb_target.rc == 0
  failed_when: lb_target.rc != 0 and 'already' not in (lb_target.stderr | default('')) and 'target' not in (lb_target.stderr | default(''))
  when: lb_enabled | bool

- name: Get load balancer public IP
  ansible.builtin.command:
    cmd: >
      hcloud load-balancer describe {{ project }}-lb -o json
  register: lb_info
  changed_when: false
  when: lb_enabled | bool

- name: Compute desired and current load balancer targets
  ansible.builtin.set_fact:
    desired_lb_server_target_ids: >-
      {%- set ns = namespace(ids=[]) -%}
      {%- for server in project_servers_raw.stdout | from_json -%}
      {%- if server.name in worker_ips.keys() | list -%}
      {%- set _ = ns.ids.append(server.id) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ ns.ids }}
    current_lb_server_target_ids: >-
      {%- set ns = namespace(ids=[]) -%}
      {%- for target in (lb_info.stdout | from_json).targets | default([]) -%}
      {%- if target.type == 'server' -%}
      {%- set _ = ns.ids.append(target.server.id) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ ns.ids }}
    unmanaged_lb_ip_targets: >-
      {%- set ns = namespace(items=[]) -%}
      {%- for target in (lb_info.stdout | from_json).targets | default([]) -%}
      {%- if target.type == 'ip' -%}
      {%- set _ = ns.items.append(target.ip.ip) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ ns.items }}
    unmanaged_lb_label_targets: >-
      {%- set ns = namespace(items=[]) -%}
      {%- for target in (lb_info.stdout | from_json).targets | default([]) -%}
      {%- if target.type == 'label_selector' -%}
      {%- set _ = ns.items.append(target.label_selector.selector) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ ns.items }}
  when: lb_enabled | bool

- name: Remove undeclared server targets from load balancer
  ansible.builtin.command:
    argv: [hcloud, load-balancer, remove-target, --server, '{{ item | string }}', '{{ project }}-lb']
  loop: '{{ current_lb_server_target_ids | difference(desired_lb_server_target_ids) }}'
  when: lb_enabled | bool

- name: Remove undeclared IP targets from load balancer
  ansible.builtin.command:
    argv: [hcloud, load-balancer, remove-target, --ip, '{{ item }}', '{{ project }}-lb']
  loop: '{{ unmanaged_lb_ip_targets }}'
  when: lb_enabled | bool

- name: Remove undeclared label-selector targets from load balancer
  ansible.builtin.command:
    argv: [hcloud, load-balancer, remove-target, --label-selector, '{{ item }}', '{{ project }}-lb']
  loop: '{{ unmanaged_lb_label_targets }}'
  when: lb_enabled | bool

- name: Set LB IP fact
  set_fact:
    lb_public_ip: "{{ (lb_info.stdout | from_json).public_net.ipv4.ip }}"
  when: lb_enabled | bool and lb_info.stdout is defined

- name: Set public IP to bastion when no LB
  set_fact:
    lb_public_ip: "{{ bastion_public_ip }}"
  when: not (lb_enabled | bool)

# ============================================
# DNS Setup (Hetzner Cloud unified DNS via hcloud CLI)
# Since hcloud v1.53.0, DNS is part of the Cloud API.
# Uses HCLOUD_TOKEN (same token as servers/networks).
# Commands: hcloud zone create, hcloud zone rrset create
# Idempotent: checks existing before creating.
# ============================================

- name: Normalize the managed Hetzner DNS zone
  ansible.builtin.set_fact:
    dns_managed_domain: "{{ domain | lower | regex_replace('\\.$', '') }}"
    dns_managed_zone: >-
      {{ hetzner_dns_zone | default(domain, true) | lower | regex_replace('\\.$', '') }}
  when: hetzner_manage_dns | default(true) | bool

- name: Validate that the domain belongs to the managed DNS zone
  ansible.builtin.assert:
    that:
      - dns_managed_zone | length > 0
      - >-
        dns_managed_domain == dns_managed_zone
        or dns_managed_domain.endswith('.' + dns_managed_zone)
    fail_msg: >-
      domain={{ domain }} must equal or be a subdomain of
      hetzner_dns_zone={{ dns_managed_zone }}.
  when: hetzner_manage_dns | default(true) | bool

- name: Calculate parent-zone-relative DNS record names
  ansible.builtin.set_fact:
    dns_root_record: >-
      {{ '@' if dns_managed_domain == dns_managed_zone
         else dns_managed_domain[0:-(dns_managed_zone | length + 1)] }}
    dns_wildcard_record: >-
      {{ '*' if dns_managed_domain == dns_managed_zone
         else '*.' + dns_managed_domain[0:-(dns_managed_zone | length + 1)] }}
    dns_vpn_record: >-
      {{ 'vpn' if dns_managed_domain == dns_managed_zone
         else 'vpn.' + dns_managed_domain[0:-(dns_managed_zone | length + 1)] }}
  when: hetzner_manage_dns | default(true) | bool

- name: Check if DNS zone already exists
  ansible.builtin.command:
    argv: [hcloud, zone, describe, "{{ dns_managed_zone }}", -o, json]
  register: dns_zone_check
  when: hetzner_manage_dns | default(true) | bool
  changed_when: false
  failed_when: false

- name: Create DNS zone
  ansible.builtin.command:
    cmd: >
      hcloud zone create
      --name {{ dns_managed_zone }}
      --mode primary
  register: dns_zone_create
  when:
    - hetzner_manage_dns | default(true) | bool
    - dns_zone_check.rc != 0
  failed_when: false

- name: Set DNS zone available flag
  set_fact:
    dns_zone_available: "{{ hetzner_manage_dns | default(true) | bool and (dns_zone_check.rc | default(1) == 0 or (dns_zone_create.rc | default(1) == 0)) }}"

- name: Warn if DNS zone creation failed
  debug:
    msg: "WARNING: Could not create Hetzner DNS zone for {{ dns_managed_zone }} ({{ dns_zone_create.stderr | default('skipped') | regex_replace('\n', ' ') }}). Configure DNS manually."
  when:
    - hetzner_manage_dns | default(true) | bool
    - not dns_zone_available | bool

- name: Create DNS wildcard A record (*.domain -> LB)
  ansible.builtin.command:
    argv:
      - hcloud
      - zone
      - rrset
      - set-records
      - --record
      - "{{ lb_public_ip }}"
      - "{{ dns_managed_zone }}"
      - "{{ dns_wildcard_record }}"
      - A
  register: dns_wildcard
  changed_when: dns_wildcard.rc == 0
  failed_when: dns_wildcard.rc != 0
  when:
    - hetzner_manage_dns | default(true) | bool
    - dns_zone_available | bool

- name: Create DNS root A record (domain -> LB)
  ansible.builtin.command:
    argv:
      - hcloud
      - zone
      - rrset
      - set-records
      - --record
      - "{{ lb_public_ip }}"
      - "{{ dns_managed_zone }}"
      - "{{ dns_root_record }}"
      - A
  register: dns_root
  changed_when: dns_root.rc == 0
  failed_when: dns_root.rc != 0
  when:
    - hetzner_manage_dns | default(true) | bool
    - dns_zone_available | bool

- name: Create DNS VPN A record (vpn.domain -> bastion)
  ansible.builtin.command:
    argv:
      - hcloud
      - zone
      - rrset
      - set-records
      - --record
      - "{{ bastion_public_ip }}"
      - "{{ dns_managed_zone }}"
      - "{{ dns_vpn_record }}"
      - A
  register: dns_vpn
  changed_when: dns_vpn.rc == 0
  failed_when: dns_vpn.rc != 0
  when:
    - hetzner_manage_dns | default(true) | bool
    - dns_zone_available | bool

# ============================================
# Write infrastructure state
# ============================================

- name: Write infrastructure facts
  copy:
    dest: "{{ playbook_dir }}/{{ project }}-infra-facts.yml"
    content: |
      ---
      project: "{{ project }}"
      domain: "{{ domain }}"
      hetzner_dns_zone: "{{ hetzner_dns_zone | default(domain, true) }}"
      region: "{{ region }}"
      tier: "{{ infra_tier }}"
      bastion_public_ip: "{{ bastion_public_ip }}"
      bastion_private_ip: "{{ bastion_private_ip }}"
      lb_ip: "{{ lb_public_ip }}"
      lb_enabled: {{ lb_enabled | bool }}
      cp_count: {{ cp_count }}
      worker_count: {{ worker_count }}
      master_ips: {{ master_ips | to_json }}
      worker_ips: {{ worker_ips | to_json }}
      first_master_ip: "{{ first_master_ip }}"
    mode: '0600'

- name: Display infrastructure summary
  debug:
    msg:
      - "=========================================="
      - "  Hetzner Infrastructure Provisioned"
      - "=========================================="
      - "  Project: {{ project }}"
      - "  Region: {{ region }} (zone: {{ network_zone }})"
      - "  Tier: {{ infra_tier }}"
      - "  Bastion IP: {{ bastion_public_ip }} (private: {{ bastion_private_ip }})"
      - "  LB IP: {{ lb_public_ip }}"
      - "  Masters: {{ cp_count }}x {{ cp_type }}"
      - "  Workers: {{ worker_count }}x {{ worker_type }}"
      - "  Master IPs: {{ master_ips }}"
      - "  Worker IPs: {{ worker_ips }}"
      - "=========================================="
