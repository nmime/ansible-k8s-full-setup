---
# Hetzner Infrastructure Role
# Provisions Hetzner Cloud: servers, networks, load balancers, firewalls, DNS
# Uses hcloud CLI (idempotent). Naming: {project}-{resource}

- name: Set infrastructure tier-specific variables
  set_fact:
    project: "{{ project_name | default('k8s') }}"
    region: "{{ hetzner_region | default('hel1') }}"
    infra_tier: "{{ tier | default('medium') }}"

- name: Set tier-specific server configuration
  set_fact:
    cp_count: "{{ tier_map[infra_tier].cp_count }}"
    cp_type: "{{ tier_map[infra_tier].cp_type }}"
    cp_schedulable: "{{ tier_map[infra_tier].cp_schedulable | default(false) }}"
    worker_count: "{{ tier_map[infra_tier].worker_count }}"
    worker_type: "{{ tier_map[infra_tier].worker_type }}"
    bastion_type: cx23
    lb_enabled: "{{ tier_map[infra_tier].lb_enabled | default(true) }}"
  vars:
    tier_map:
      minimal:
        cp_count: 1
        cp_type: cx23
        cp_schedulable: true
        worker_count: 1
        worker_type: cx23
        lb_enabled: false
      small:
        cp_count: 1
        cp_type: cx23
        cp_schedulable: false
        worker_count: 2
        worker_type: cx23
        lb_enabled: true
      medium:
        cp_count: 3
        cp_type: cx23
        cp_schedulable: false
        worker_count: 2
        worker_type: cx33
        lb_enabled: true
      production:
        cp_count: 3
        cp_type: cx33
        cp_schedulable: false
        worker_count: 3
        worker_type: cx33
        lb_enabled: true

- name: Validate HCLOUD_TOKEN is set
  assert:
    that:
      - lookup('env', 'HCLOUD_TOKEN') | length > 0
    fail_msg: "HCLOUD_TOKEN not set. Get from: https://console.hetzner.cloud -> Security -> API Tokens"

# ============================================
# SSH Key
# ============================================

- name: Upload SSH public key to Hetzner
  ansible.builtin.command:
    cmd: >
      hcloud ssh-key create
      --name {{ project }}-key
      --public-key-from-file {{ ssh_key_path | default('~/.ssh/id_ed25519') }}.pub
  register: ssh_key_create
  changed_when: ssh_key_create.rc == 0
  failed_when: false

- name: Set SSH key name fact
  set_fact:
    hcloud_ssh_key: "{{ project }}-key"

# ============================================
# Network
# ============================================

- name: Create private network
  ansible.builtin.command:
    cmd: >
      hcloud network create
      --name {{ project }}-network
      --ip-range 10.0.0.0/16
      --label project={{ project }}
  register: network_create
  changed_when: network_create.rc == 0
  failed_when: network_create.rc != 0 and 'uniqueness_error' not in (network_create.stderr | default(''))

- name: Create infrastructure subnet
  ansible.builtin.command:
    cmd: >
      hcloud network add-subnet {{ project }}-network
      --type cloud
      --network-zone eu-central
      --ip-range 10.0.0.0/24
  register: subnet_infra
  changed_when: subnet_infra.rc == 0
  failed_when: subnet_infra.rc != 0 and 'already' not in (subnet_infra.stderr | default(''))

- name: Create control plane subnet
  ansible.builtin.command:
    cmd: >
      hcloud network add-subnet {{ project }}-network
      --type cloud
      --network-zone eu-central
      --ip-range 10.0.1.0/24
  register: subnet_cp
  changed_when: subnet_cp.rc == 0
  failed_when: subnet_cp.rc != 0 and 'already' not in (subnet_cp.stderr | default(''))

- name: Create workers subnet
  ansible.builtin.command:
    cmd: >
      hcloud network add-subnet {{ project }}-network
      --type cloud
      --network-zone eu-central
      --ip-range 10.0.2.0/24
  register: subnet_workers
  changed_when: subnet_workers.rc == 0
  failed_when: subnet_workers.rc != 0 and 'already' not in (subnet_workers.stderr | default(''))

# ============================================
# Placement Group (for HA)
# ============================================

- name: Create placement group for spread
  ansible.builtin.command:
    cmd: >
      hcloud placement-group create
      --name {{ project }}-spread
      --type spread
  register: pg_create
  changed_when: pg_create.rc == 0
  failed_when: pg_create.rc != 0 and 'uniqueness_error' not in (pg_create.stderr | default(''))
  when: infra_tier in ['medium', 'production']

# ============================================
# Firewalls
# ============================================

- name: Create bastion firewall
  ansible.builtin.command:
    cmd: >
      hcloud firewall create
      --name {{ project }}-fw-bastion
      --label project={{ project }}
  register: fw_bastion
  changed_when: fw_bastion.rc == 0
  failed_when: fw_bastion.rc != 0 and 'uniqueness_error' not in (fw_bastion.stderr | default(''))

- name: Add SSH rule to bastion firewall
  ansible.builtin.command:
    cmd: >
      hcloud firewall add-rule {{ project }}-fw-bastion
      --direction in --protocol tcp --port 22
      --source-ips 0.0.0.0/0 --source-ips ::/0
      --description "SSH access"
  register: fw_rule_ssh
  changed_when: fw_rule_ssh.rc == 0
  failed_when: fw_rule_ssh.rc != 0 and 'duplicate' not in (fw_rule_ssh.stderr | default(''))

- name: Add VPN rule to bastion firewall
  ansible.builtin.command:
    cmd: >
      hcloud firewall add-rule {{ project }}-fw-bastion
      --direction in --protocol tcp --port 443
      --source-ips 0.0.0.0/0 --source-ips ::/0
      --description "Headscale VPN"
  register: fw_rule_vpn
  changed_when: fw_rule_vpn.rc == 0
  failed_when: fw_rule_vpn.rc != 0 and 'duplicate' not in (fw_rule_vpn.stderr | default(''))

- name: Add Headscale DERP rule to bastion firewall
  ansible.builtin.command:
    cmd: >
      hcloud firewall add-rule {{ project }}-fw-bastion
      --direction in --protocol udp --port 3478
      --source-ips 0.0.0.0/0 --source-ips ::/0
      --description "STUN/DERP for VPN"
  register: fw_rule_derp
  changed_when: fw_rule_derp.rc == 0
  failed_when: fw_rule_derp.rc != 0 and 'duplicate' not in (fw_rule_derp.stderr | default(''))

- name: Add WireGuard/Tailscale UDP rule to bastion firewall
  ansible.builtin.command:
    cmd: >
      hcloud firewall add-rule {{ project }}-fw-bastion
      --direction in --protocol udp --port 41641
      --source-ips 0.0.0.0/0 --source-ips ::/0
      --description "WireGuard/Tailscale VPN"
  register: fw_rule_wg
  changed_when: fw_rule_wg.rc == 0
  failed_when: fw_rule_wg.rc != 0 and 'duplicate' not in (fw_rule_wg.stderr | default(''))

- name: Create node firewall (private network only)
  ansible.builtin.command:
    cmd: >
      hcloud firewall create
      --name {{ project }}-fw-nodes
      --label project={{ project }}
  register: fw_nodes
  changed_when: fw_nodes.rc == 0
  failed_when: fw_nodes.rc != 0 and 'uniqueness_error' not in (fw_nodes.stderr | default(''))

- name: Add SSH from bastion and VPN to node firewall
  ansible.builtin.command:
    cmd: >
      hcloud firewall add-rule {{ project }}-fw-nodes
      --direction in --protocol tcp --port 22
      --source-ips 10.0.0.0/16 --source-ips 100.64.0.0/10
      --description "SSH from private network and VPN"
  register: fw_node_ssh
  changed_when: fw_node_ssh.rc == 0
  failed_when: fw_node_ssh.rc != 0 and 'duplicate' not in (fw_node_ssh.stderr | default(''))

- name: Add K8s API to node firewall
  ansible.builtin.command:
    cmd: >
      hcloud firewall add-rule {{ project }}-fw-nodes
      --direction in --protocol tcp --port 6443
      --source-ips 10.0.0.0/16 --source-ips 100.64.0.0/10
      --description "Kubernetes API"
  register: fw_node_api
  changed_when: fw_node_api.rc == 0
  failed_when: fw_node_api.rc != 0 and 'duplicate' not in (fw_node_api.stderr | default(''))

- name: Add kubelet to node firewall
  ansible.builtin.command:
    cmd: >
      hcloud firewall add-rule {{ project }}-fw-nodes
      --direction in --protocol tcp --port 10250
      --source-ips 10.0.0.0/16 --source-ips 100.64.0.0/10
      --description "Kubelet API"
  register: fw_node_kubelet
  changed_when: fw_node_kubelet.rc == 0
  failed_when: fw_node_kubelet.rc != 0 and 'duplicate' not in (fw_node_kubelet.stderr | default(''))

- name: Add NodePort range to node firewall
  ansible.builtin.command:
    cmd: >
      hcloud firewall add-rule {{ project }}-fw-nodes
      --direction in --protocol tcp --port 30000-32767
      --source-ips 10.0.0.0/16 --source-ips 100.64.0.0/10
      --description "NodePort range"
  register: fw_node_np
  changed_when: fw_node_np.rc == 0
  failed_when: fw_node_np.rc != 0 and 'duplicate' not in (fw_node_np.stderr | default(''))

- name: Add etcd ports to node firewall
  ansible.builtin.command:
    cmd: >
      hcloud firewall add-rule {{ project }}-fw-nodes
      --direction in --protocol tcp --port 2379-2380
      --source-ips 10.0.0.0/16
      --description "etcd cluster"
  register: fw_node_etcd
  changed_when: fw_node_etcd.rc == 0
  failed_when: fw_node_etcd.rc != 0 and 'duplicate' not in (fw_node_etcd.stderr | default(''))

- name: Add Cilium health check port to node firewall
  ansible.builtin.command:
    cmd: >
      hcloud firewall add-rule {{ project }}-fw-nodes
      --direction in --protocol tcp --port 4240
      --source-ips 10.0.0.0/16
      --description "Cilium health checks"
  register: fw_node_cilium_health
  changed_when: fw_node_cilium_health.rc == 0
  failed_when: fw_node_cilium_health.rc != 0 and 'duplicate' not in (fw_node_cilium_health.stderr | default(''))

- name: Add Cilium VXLAN port to node firewall
  ansible.builtin.command:
    cmd: >
      hcloud firewall add-rule {{ project }}-fw-nodes
      --direction in --protocol udp --port 8472
      --source-ips 10.0.0.0/16
      --description "Cilium VXLAN overlay"
  register: fw_node_cilium_vxlan
  changed_when: fw_node_cilium_vxlan.rc == 0
  failed_when: fw_node_cilium_vxlan.rc != 0 and 'duplicate' not in (fw_node_cilium_vxlan.stderr | default(''))

# ============================================
# Bastion Server (public IP)
# ============================================

- name: Create bastion server
  ansible.builtin.command:
    cmd: >
      hcloud server create
      --name {{ project }}-bastion
      --type {{ bastion_type }}
      --image ubuntu-24.04
      --location {{ region }}
      --ssh-key {{ hcloud_ssh_key }}
      --network {{ project }}-network
      --firewall {{ project }}-fw-bastion
      --label project={{ project }},role=bastion
  register: bastion_create
  changed_when: bastion_create.rc == 0
  failed_when: bastion_create.rc != 0 and 'uniqueness_error' not in (bastion_create.stderr | default(''))

- name: Get bastion public IP
  ansible.builtin.command:
    cmd: hcloud server ip {{ project }}-bastion
  register: bastion_ip_result
  changed_when: false

- name: Set bastion IP fact
  set_fact:
    bastion_public_ip: "{{ bastion_ip_result.stdout | trim }}"

- name: Wait for bastion SSH to be ready
  wait_for:
    host: "{{ bastion_public_ip }}"
    port: 22
    delay: 10
    timeout: 300
  delegate_to: localhost
  become: false

# ============================================
# Control Plane Servers (private network only)
# ============================================

- name: Create control plane servers
  ansible.builtin.command:
    cmd: >
      hcloud server create
      --name {{ project }}-master-{{ item }}
      --type {{ cp_type }}
      --image ubuntu-24.04
      --location {{ region }}
      --ssh-key {{ hcloud_ssh_key }}
      --network {{ project }}-network
      --firewall {{ project }}-fw-nodes
      --without-ipv4
      --without-ipv6
      --label project={{ project }},role=master,index={{ item }}
      {{ '--placement-group ' + project + '-spread' if infra_tier in ['medium', 'production'] else '' }}
  loop: "{{ range(1, (cp_count | int) + 1) | list }}"
  register: master_create
  changed_when: master_create.rc == 0
  failed_when: master_create.rc != 0 and 'uniqueness_error' not in (master_create.stderr | default(''))

# ============================================
# Worker Servers (private network only)
# ============================================

- name: Create worker servers
  ansible.builtin.command:
    cmd: >
      hcloud server create
      --name {{ project }}-worker-{{ item }}
      --type {{ worker_type }}
      --image ubuntu-24.04
      --location {{ region }}
      --ssh-key {{ hcloud_ssh_key }}
      --network {{ project }}-network
      --firewall {{ project }}-fw-nodes
      --without-ipv4
      --without-ipv6
      --label project={{ project }},role=worker,index={{ item }}
      {{ '--placement-group ' + project + '-spread' if infra_tier in ['medium', 'production'] else '' }}
  loop: "{{ range(1, (worker_count | int) + 1) | list }}"
  register: worker_create
  changed_when: worker_create.rc == 0
  failed_when: worker_create.rc != 0 and 'uniqueness_error' not in (worker_create.stderr | default(''))

# ============================================
# Load Balancer
# ============================================

- name: Create load balancer
  ansible.builtin.command:
    cmd: >
      hcloud load-balancer create
      --name {{ project }}-lb
      --type lb11
      --location {{ region }}
      --label project={{ project }}
  register: lb_create
  changed_when: lb_create.rc == 0
  failed_when: lb_create.rc != 0 and 'uniqueness_error' not in (lb_create.stderr | default(''))
  when: lb_enabled | bool

- name: Attach LB to private network
  ansible.builtin.command:
    cmd: >
      hcloud load-balancer attach-to-network {{ project }}-lb
      --network {{ project }}-network
  register: lb_network
  changed_when: lb_network.rc == 0
  failed_when: lb_network.rc != 0 and 'already' not in (lb_network.stderr | default(''))
  when: lb_enabled | bool

- name: Add LB service for HTTPS (443 -> NodePort 30443)
  ansible.builtin.command:
    cmd: >
      hcloud load-balancer add-service {{ project }}-lb
      --protocol tcp --listen-port 443 --destination-port 30443
      --health-check-protocol tcp --health-check-port 30443
  register: lb_svc_https
  changed_when: lb_svc_https.rc == 0
  failed_when: lb_svc_https.rc != 0 and 'already' not in (lb_svc_https.stderr | default(''))
  when: lb_enabled | bool

- name: Add LB service for HTTP (80 -> NodePort 30080)
  ansible.builtin.command:
    cmd: >
      hcloud load-balancer add-service {{ project }}-lb
      --protocol tcp --listen-port 80 --destination-port 30080
  register: lb_svc_http
  changed_when: lb_svc_http.rc == 0
  failed_when: lb_svc_http.rc != 0 and 'already' not in (lb_svc_http.stderr | default(''))
  when: lb_enabled | bool

- name: Add worker servers as LB targets
  ansible.builtin.command:
    cmd: >
      hcloud load-balancer add-target {{ project }}-lb
      --server {{ project }}-worker-{{ item }}
      --use-private-ip
  loop: "{{ range(1, (worker_count | int) + 1) | list }}"
  register: lb_target
  changed_when: lb_target.rc == 0
  failed_when: lb_target.rc != 0 and 'already' not in (lb_target.stderr | default(''))
  when: lb_enabled | bool

- name: Get load balancer public IP
  ansible.builtin.command:
    cmd: >
      hcloud load-balancer describe {{ project }}-lb -o json
  register: lb_info
  changed_when: false
  when: lb_enabled | bool

- name: Set LB IP fact
  set_fact:
    lb_public_ip: "{{ (lb_info.stdout | from_json).public_net.ipv4.ip }}"
  when: lb_enabled | bool and lb_info.stdout is defined

- name: Set public IP to bastion when no LB
  set_fact:
    lb_public_ip: "{{ bastion_public_ip }}"
  when: not (lb_enabled | bool)

# ============================================
# Write infrastructure state
# ============================================

- name: Write infrastructure facts
  copy:
    dest: "{{ playbook_dir }}/{{ project }}-infra-facts.yml"
    content: |
      ---
      project: "{{ project }}"
      domain: "{{ domain | default('example.com') }}"
      region: "{{ region }}"
      tier: "{{ infra_tier }}"
      bastion_ip: "{{ bastion_public_ip }}"
      lb_ip: "{{ lb_public_ip }}"
      lb_enabled: {{ lb_enabled | bool }}
      cp_count: {{ cp_count }}
      worker_count: {{ worker_count }}
    mode: '0644'

- name: Display infrastructure summary
  debug:
    msg:
      - "=========================================="
      - "  Hetzner Infrastructure Provisioned"
      - "=========================================="
      - "  Project: {{ project }}"
      - "  Region: {{ region }}"
      - "  Tier: {{ infra_tier }}"
      - "  Bastion IP: {{ bastion_public_ip }}"
      - "  LB IP: {{ lb_public_ip }}"
      - "  Masters: {{ cp_count }}x {{ cp_type }}"
      - "  Workers: {{ worker_count }}x {{ worker_type }}"
      - "=========================================="
