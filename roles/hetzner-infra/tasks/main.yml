---
# Hetzner Infrastructure Role
# Provisions Hetzner Cloud: servers, networks, load balancers, firewalls, DNS
# Drift-detecting and convergent — destructive server changes require approval.
# Uses hcloud CLI. Naming: {project}-{resource}

- name: Set infrastructure tier-specific variables
  set_fact:
    project: "{{ project_name | default('k8s') }}"
    server_name_prefix: "{{ hetzner_server_name_prefix }}"
    load_balancer_name: "{{ hetzner_server_name_prefix }}-lb"
    region: "{{ infrastructure.region | default(hetzner_region | default('hel1')) }}"
    infra_tier: "{{ tier | default('medium') }}"
    network_cidr: "{{ network.private_network.cidr | default(private_network_cidr) }}"
    infra_subnet_cidr: "{{ network.private_network.infrastructure | default(infrastructure_subnet) }}"
    control_plane_subnet_cidr: "{{ network.private_network.control_plane | default(control_plane_subnet) }}"
    worker_subnet_cidr: "{{ network.private_network.workers | default(workers_subnet) }}"
    load_balancer_type: "{{ network.load_balancer.type | default('lb11') }}"

# ============================================
# Auto-select cheapest server types from Hetzner API
# ============================================

- name: Fetch available server types from Hetzner API
  ansible.builtin.command:
    cmd: hcloud server-type list -o json
  register: hcloud_server_types_raw
  changed_when: false
  retries: 5
  delay: 5
  until: hcloud_server_types_raw.rc == 0

- name: Set EU locations list
  set_fact:
    hetzner_eu_locations:
      - "fsn1"
      - "nbg1"
      - "hel1"

- name: Build region-aware server type list sorted by price
  set_fact:
    available_server_types: >-
      {%- set raw = hcloud_server_types_raw.stdout | from_json
           | selectattr('architecture', 'equalto', 'x86')
           | list
           | json_query('[].{
               name: name,
               cores: cores,
               memory: memory,
               available: locations[?name==`' + region + '`] | [0].available,
               price: prices[?location==`' + region + '`] | [0].price_monthly.gross
             }')
           | selectattr('available', 'equalto', true)
           | selectattr('price', 'defined')
           | selectattr('price', 'ne', None)
           | list -%}
      {%- set ns = namespace(result=[]) -%}
      {%- for item in raw -%}
        {%- set _ = ns.result.append(item | combine({'price_num': item.price | float})) -%}
      {%- endfor -%}
      {{ ns.result | sort(attribute='price_num') | list }}

- name: Set tier spec reference
  set_fact:
    current_tier_spec: >-
      {{ hetzner_tier_specs[infra_tier] | combine({
        'cp_count': infrastructure.control_plane.count | default(hetzner_tier_specs[infra_tier].cp_count),
        'cp_schedulable': infrastructure.control_plane.schedulable | default(hetzner_tier_specs[infra_tier].cp_schedulable),
        'worker_count': infrastructure.workers.count | default(hetzner_tier_specs[infra_tier].worker_count),
        'lb_enabled': network.load_balancer.enabled | default(hetzner_tier_specs[infra_tier].lb_enabled)
      }) }}

# --- Try primary region first, fallback to any EU location ---

- name: Find bastion type in primary region
  set_fact:
    auto_bastion_type: >-
      {{ (available_server_types
          | selectattr('cores', 'ge', 2)
          | selectattr('memory', 'ge', 4)
          | map(attribute='name')
          | first | default('')) }}
  when: hetzner_bastion_type | default('') | length == 0

- name: Find control plane type in primary region
  set_fact:
    auto_cp_type: >-
      {{ (available_server_types
          | selectattr('cores', 'ge', current_tier_spec.cp_min_cores | int)
          | selectattr('memory', 'ge', current_tier_spec.cp_min_memory | int)
          | map(attribute='name')
          | first | default('')) }}
  when: hetzner_cp_type | default('') | length == 0

- name: Find worker type in primary region
  set_fact:
    auto_worker_type: >-
      {{ (available_server_types
          | selectattr('cores', 'ge', current_tier_spec.worker_min_cores | int)
          | selectattr('memory', 'ge', current_tier_spec.worker_min_memory | int)
          | map(attribute='name')
          | first | default('')) }}
  when: hetzner_worker_type | default('') | length == 0

- name: Check if any auto-selected type is missing in primary region
  set_fact:
    needs_eu_fallback: >-
      {{ (hetzner_bastion_type | default(auto_bastion_type | default(''), true) | trim | length == 0)
         or (hetzner_cp_type | default(auto_cp_type | default(''), true) | trim | length == 0)
         or (hetzner_worker_type | default(auto_worker_type | default(''), true) | trim | length == 0) }}

- name: Find cheapest EU fallback region
  block:
    - name: Build EU-wide server type lists per location
      set_fact:
        eu_types_by_location: >-
          {{ dict(
               hetzner_eu_locations
               | zip(
                   hetzner_eu_locations | map('regex_replace', '(.*)',
                     hcloud_server_types_raw.stdout | from_json
                     | selectattr('architecture', 'equalto', 'x86')
                     | list
                     | to_json
                   )
                 )
             ) }}

    - name: Pick cheapest EU location that has all needed types
      set_fact:
        eu_fallback_region: "{{ item }}"
        eu_fallback_types: >-
          {%- set raw = hcloud_server_types_raw.stdout | from_json
               | selectattr('architecture', 'equalto', 'x86')
               | list
               | json_query('[].{
                   name: name,
                   cores: cores,
                   memory: memory,
                   available: locations[?name==`' + item + '`] | [0].available,
                   price: prices[?location==`' + item + '`] | [0].price_monthly.gross
                 }')
               | selectattr('available', 'equalto', true)
               | selectattr('price', 'defined')
               | selectattr('price', 'ne', None)
               | list -%}
          {%- set ns = namespace(result=[]) -%}
          {%- for t in raw -%}
            {%- set _ = ns.result.append(t | combine({'price_num': t.price | float})) -%}
          {%- endfor -%}
          {{ ns.result | sort(attribute='price_num') | list }}
      loop: "{{ hetzner_eu_locations | reject('equalto', region) | list }}"
      when: >-
        eu_fallback_region is not defined
        and (hcloud_server_types_raw.stdout | from_json
             | selectattr('architecture', 'equalto', 'x86')
             | list
             | json_query('[].{
                 name: name,
                 cores: cores,
                 memory: memory,
                 available: locations[?name==`' + item + '`] | [0].available,
                 price: prices[?location==`' + item + '`] | [0].price_monthly.gross
               }')
             | selectattr('available', 'equalto', true)
             | selectattr('price', 'defined')
             | selectattr('price', 'ne', None)
             | selectattr('cores', 'ge', current_tier_spec.worker_min_cores | int)
             | selectattr('memory', 'ge', current_tier_spec.worker_min_memory | int)
             | list | length > 0)

    - name: Switch to EU fallback region
      set_fact:
        region: "{{ eu_fallback_region }}"
        available_server_types: "{{ eu_fallback_types }}"

    - name: Re-select bastion type from EU fallback
      set_fact:
        auto_bastion_type: >-
          {{ (eu_fallback_types
              | selectattr('cores', 'ge', 2)
              | selectattr('memory', 'ge', 4)
              | map(attribute='name')
              | first) }}
      when: hetzner_bastion_type | default('') | length == 0 and (auto_bastion_type | default('') | trim | length == 0)

    - name: Re-select control plane type from EU fallback
      set_fact:
        auto_cp_type: >-
          {{ (eu_fallback_types
              | selectattr('cores', 'ge', current_tier_spec.cp_min_cores | int)
              | selectattr('memory', 'ge', current_tier_spec.cp_min_memory | int)
              | map(attribute='name')
              | first) }}
      when: hetzner_cp_type | default('') | length == 0 and (auto_cp_type | default('') | trim | length == 0)

    - name: Re-select worker type from EU fallback
      set_fact:
        auto_worker_type: >-
          {{ (eu_fallback_types
              | selectattr('cores', 'ge', current_tier_spec.worker_min_cores | int)
              | selectattr('memory', 'ge', current_tier_spec.worker_min_memory | int)
              | map(attribute='name')
              | first) }}
      when: hetzner_worker_type | default('') | length == 0 and (auto_worker_type | default('') | trim | length == 0)

    - name: Warn about region fallback
      debug:
        msg: "WARNING: Region {{ hetzner_region | default('hel1') }} lacked suitable types. Falling back to {{ eu_fallback_region }}"
  when: needs_eu_fallback | bool

- name: Set tier-specific server configuration
  set_fact:
    cp_count: "{{ current_tier_spec.cp_count }}"
    cp_type: "{{ hetzner_cp_type | default(auto_cp_type, true) | trim }}"
    cp_schedulable: "{{ current_tier_spec.cp_schedulable | default(false) }}"
    worker_count: "{{ current_tier_spec.worker_count }}"
    worker_type: "{{ hetzner_worker_type | default(auto_worker_type, true) | trim }}"
    bastion_type: "{{ hetzner_bastion_type | default(auto_bastion_type, true) | trim }}"
    lb_enabled: "{{ current_tier_spec.lb_enabled | default(true) }}"
    node_type_overrides: >-
      {%- set ns = namespace(items={}) -%}
      {%- for index, server_type in
            (infrastructure.workers.type_overrides | default({})).items() -%}
      {%- set ns.items = ns.items | combine({
            project + '-worker-' + (index | string): server_type
          }) -%}
      {%- endfor -%}
      {{ ns.items | combine(infrastructure.node_type_overrides | default({})) }}
    dedicated_build_ci_worker_index: >-
      {{ gitlab_runner_worker_index | default(0) | int }}
    dedicated_docker_ci_worker_index: >-
      {{ gitlab_docker_host_runner_worker_index | default(0) | int }}
    dedicated_ci_worker_indices: >-
      {{
        [
          gitlab_runner_worker_index | default(0) | int,
          gitlab_docker_host_runner_worker_index | default(0) | int
        ] | reject('equalto', 0) | unique | list
      }}

- name: Validate the dedicated CI worker indices
  ansible.builtin.assert:
    that:
      - dedicated_build_ci_worker_index | int >= 0
      - dedicated_build_ci_worker_index | int <= worker_count | int
      - dedicated_docker_ci_worker_index | int >= 0
      - dedicated_docker_ci_worker_index | int <= worker_count | int
      - >-
        not (gitlab_docker_host_runner_enabled | default(false) | bool)
        or dedicated_docker_ci_worker_index | int > 0
      - >-
        dedicated_build_ci_worker_index | int == 0
        or dedicated_build_ci_worker_index | int !=
           dedicated_docker_ci_worker_index | int
    fail_msg: >-
      Dedicated CI worker indices must be inside infrastructure.workers.count.
      The protected Docker-smoke Runner requires a non-zero worker, while a
      configured CI-build worker must use a different node.

- name: Validate the provider-side server name prefix
  ansible.builtin.assert:
    that:
      - server_name_prefix is string
      - server_name_prefix | length > 0
      - server_name_prefix | length <= 50
      - server_name_prefix is match('^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$')
    fail_msg: >-
      infrastructure.server_name_prefix must be a lowercase Hetzner-safe
      prefix up to 50 characters. It changes provider display names only;
      Kubernetes node identities and project labels remain unchanged.

- name: Validate per-node server type override structure
  ansible.builtin.assert:
    that:
      - node_type_overrides is mapping
    fail_msg: >-
      infrastructure.node_type_overrides must be a mapping from a full
      {{ project }}-master-N or {{ project }}-worker-N server name to a server
      type. infrastructure.workers.type_overrides may provide the reusable
      worker-index form; explicit full-name overrides take precedence.

- name: Build the per-node worker type plan
  ansible.builtin.set_fact:
    worker_type_plan: >-
      {%- set ns = namespace(items=[]) -%}
      {%- for index in range(1, (worker_count | int) + 1) -%}
      {%- set node = project + '-worker-' + (index | string) -%}
      {%- set _ = ns.items.append(
        node + '=' + node_type_overrides.get(node, worker_type)) -%}
      {%- endfor -%}
      {{ ns.items }}

- name: Build valid per-node server type override names
  ansible.builtin.set_fact:
    valid_node_type_override_names: >-
      {%- set ns = namespace(names=[]) -%}
      {%- for index in range(1, (current_tier_spec.cp_count | int) + 1) -%}
      {%- set _ = ns.names.append(project + '-master-' + (index | string)) -%}
      {%- set _ = ns.names.append(server_name_prefix + '-master-' + (index | string)) -%}
      {%- endfor -%}
      {%- for index in range(1, (current_tier_spec.worker_count | int) + 1) -%}
      {%- set _ = ns.names.append(project + '-worker-' + (index | string)) -%}
      {%- set _ = ns.names.append(server_name_prefix + '-worker-' + (index | string)) -%}
      {%- endfor -%}
      {{ ns.names }}

- name: Validate all server types were found
  assert:
    that:
      - bastion_type | length > 0
      - cp_type | length > 0
      - worker_type | length > 0
    fail_msg: >
      Could not find suitable server types in any EU region.
      Bastion={{ bastion_type }}, CP={{ cp_type }}, Worker={{ worker_type }}.
      Override manually: hetzner_bastion_type, hetzner_cp_type, hetzner_worker_type

- name: Resolve selected server type capacities
  ansible.builtin.set_fact:
    selected_bastion_spec: >-
      {{ hcloud_server_types_raw.stdout | from_json
         | selectattr('name', 'equalto', bastion_type) | first | default({}) }}
    selected_cp_spec: >-
      {{ hcloud_server_types_raw.stdout | from_json
         | selectattr('name', 'equalto', cp_type) | first | default({}) }}
    selected_worker_spec: >-
      {{ hcloud_server_types_raw.stdout | from_json
         | selectattr('name', 'equalto', worker_type) | first | default({}) }}

- name: Resolve selected server type availability in the active region
  ansible.builtin.set_fact:
    selected_bastion_available_in_region: >-
      {{ selected_bastion_spec.locations | default([])
         | selectattr('name', 'equalto', region)
         | selectattr('available', 'equalto', true)
         | list | length > 0 }}
    selected_cp_available_in_region: >-
      {{ selected_cp_spec.locations | default([])
         | selectattr('name', 'equalto', region)
         | selectattr('available', 'equalto', true)
         | list | length > 0 }}
    selected_worker_available_in_region: >-
      {{ selected_worker_spec.locations | default([])
         | selectattr('name', 'equalto', region)
         | selectattr('available', 'equalto', true)
         | list | length > 0 }}

- name: Validate per-node server type override capacity
  ansible.builtin.assert:
    that:
      - item.key in valid_node_type_override_names
      - item.value is string
      - item.value | trim | length > 0
      - override_spec | length > 0
      - override_spec.architecture | default('') == 'x86'
      - override_spec.cores | default(0) | int >= override_min_cores | int
      - override_spec.memory | default(0) | int >= override_min_memory | int
    fail_msg: >-
      Invalid infrastructure.node_type_overrides entry {{ item.key }}={{ item.value }}.
      Overrides must name a desired control-plane or worker node, resolve to an
      x86 server type, and satisfy that role's profile capacity floor of
      {{ override_min_cores }} cores/{{ override_min_memory }} GiB.
  vars:
    override_spec: >-
      {{ hcloud_server_types_raw.stdout | from_json
         | selectattr('name', 'equalto', item.value) | first | default({}) }}
    override_is_master: >-
      {{ item.key is match('^' + project + '-master-')
         or item.key is match('^' + server_name_prefix + '-master-') }}
    override_min_cores: >-
      {{ current_tier_spec.cp_min_cores if (override_is_master | bool)
         else current_tier_spec.worker_min_cores }}
    override_min_memory: >-
      {{ current_tier_spec.cp_min_memory if (override_is_master | bool)
         else current_tier_spec.worker_min_memory }}
  loop: "{{ node_type_overrides | dict2items }}"
  loop_control:
    label: "{{ item.key }}={{ item.value }}"

- name: Reject undersized explicit or auto-selected server types
  ansible.builtin.assert:
    that:
      - selected_bastion_spec | length > 0
      - selected_bastion_spec.cores | int >= 2
      - selected_bastion_spec.memory | int >= 4
      - selected_cp_spec | length > 0
      - selected_cp_spec.cores | int >= current_tier_spec.cp_min_cores | int
      - selected_cp_spec.memory | int >= current_tier_spec.cp_min_memory | int
      - selected_worker_spec | length > 0
      - selected_worker_spec.cores | int >= current_tier_spec.worker_min_cores | int
      - selected_worker_spec.memory | int >= current_tier_spec.worker_min_memory | int
    fail_msg: >-
      Selected server types do not satisfy the {{ platform_profile }} profile
      capacity floor. Bastion={{ bastion_type }} (minimum 2 cores/4 GiB),
      control-plane={{ cp_type }} (minimum {{ current_tier_spec.cp_min_cores }}
      cores/{{ current_tier_spec.cp_min_memory }} GiB), worker={{ worker_type }}
      (minimum {{ current_tier_spec.worker_min_cores }} cores/
      {{ current_tier_spec.worker_min_memory }} GiB).

- name: Build price lookup from available types
  set_fact:
    type_price_map: "{{ dict(available_server_types | map(attribute='name') | zip(available_server_types | map(attribute='price'))) }}"

- name: Display selected server types
  debug:
    msg:
      - "Tier: {{ infra_tier }} | Region: {{ region }}"
      - "Bastion: {{ bastion_type }} (~€{{ type_price_map[bastion_type] | default('?') }}/mo)"
      - "Control plane: {{ cp_type }} x{{ cp_count }} (~€{{ type_price_map[cp_type] | default('?') }}/mo each)"
      - "Workers: {{ worker_type_plan | join(', ') }}"

- name: Map region to network zone
  set_fact:
    network_zone: >-
      {{ region_zone_map[region[:3]] | default('eu-central') }}
  vars:
    region_zone_map:
      hel: eu-central
      fsn: eu-central
      nbg: eu-central
      ash: us-east
      hil: us-west

- name: Validate HCLOUD_TOKEN is set
  assert:
    that:
      - lookup('env', 'HCLOUD_TOKEN') | length > 0
    fail_msg: "HCLOUD_TOKEN not set. Get from: https://console.hetzner.cloud -> Security -> API Tokens"

# ============================================
# SSH Key
# ============================================

- name: Check if SSH key already exists
  ansible.builtin.command:
    cmd: hcloud ssh-key describe {{ project }}-key -o json
  register: ssh_key_check
  changed_when: false
  retries: "{{ hcloud_read_retries }}"
  delay: "{{ hcloud_read_delay }}"
  until: >-
    ssh_key_check.rc == 0 or
    'not found' in (ssh_key_check.stderr | default('') | lower)
  failed_when: >-
    ssh_key_check.rc != 0 and
    'not found' not in (ssh_key_check.stderr | default('') | lower)

- name: Get local SSH public key fingerprint in MD5 hex format
  ansible.builtin.shell: |
    ssh-keygen -l -E md5 -f {{ ssh_key_path | default('~/.ssh/id_ed25519') }}.pub | awk '{print $2}' | sed 's/^MD5://'
  register: local_key_fingerprint
  changed_when: false
  when: ssh_key_check.rc != 0

- name: Find existing SSH key by fingerprint
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      hcloud ssh-key list -o json |
      python3 -c "import sys,json; keys=json.load(sys.stdin); matches=[k['name'] for k in keys if k['fingerprint']=='{{ local_key_fingerprint.stdout | trim }}']; print(matches[0] if matches else '')"
    executable: /bin/bash
  register: existing_key_by_fp
  changed_when: false
  retries: "{{ hcloud_read_retries }}"
  delay: "{{ hcloud_read_delay }}"
  until: existing_key_by_fp.rc == 0
  when: ssh_key_check.rc != 0

- name: Upload SSH public key to Hetzner
  ansible.builtin.command:
    cmd: >
      hcloud ssh-key create
      --name {{ project }}-key
      --public-key-from-file {{ ssh_key_path | default('~/.ssh/id_ed25519') }}.pub
  register: ssh_key_create
  changed_when: ssh_key_create.rc == 0
  retries: "{{ hcloud_write_retries }}"
  delay: "{{ hcloud_write_delay }}"
  until: >-
    ssh_key_create.rc == 0 or
    'already' in (ssh_key_create.stderr | default('') | lower) or
    'exists' in (ssh_key_create.stderr | default('') | lower) or
    'fingerprint' in (ssh_key_create.stderr | default('') | lower)
  failed_when: >-
    ssh_key_create.rc != 0 and
    'already' not in (ssh_key_create.stderr | default('') | lower) and
    'exists' not in (ssh_key_create.stderr | default('') | lower) and
    'fingerprint' not in (ssh_key_create.stderr | default('') | lower)
  when: ssh_key_check.rc != 0 and (existing_key_by_fp.stdout | default('') | trim | length == 0)

- name: Resolve SSH key by fingerprint after concurrent convergence
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      hcloud ssh-key list -o json |
      python3 -c "import sys,json; keys=json.load(sys.stdin); matches=[k['name'] for k in keys if k['fingerprint']=='{{ local_key_fingerprint.stdout | trim }}']; print(matches[0] if matches else '')"
    executable: /bin/bash
  register: converged_key_by_fp
  changed_when: false
  retries: "{{ hcloud_read_retries }}"
  delay: "{{ hcloud_read_delay }}"
  until: converged_key_by_fp.rc == 0 and (converged_key_by_fp.stdout | trim | length > 0)
  when: ssh_key_check.rc != 0

- name: Set SSH key name fact
  set_fact:
    hcloud_ssh_key: "{{ (ssh_key_check.rc == 0) | ternary(project + '-key', converged_key_by_fp.stdout | default('') | trim) }}"

# ============================================
# Network
# ============================================

- name: Check if network already exists
  ansible.builtin.command:
    cmd: hcloud network describe {{ project }}-network -o json
  register: network_check
  changed_when: false
  retries: "{{ hcloud_read_retries }}"
  delay: "{{ hcloud_read_delay }}"
  until: >-
    network_check.rc == 0 or
    'not found' in (network_check.stderr | default('') | lower)
  failed_when: >-
    network_check.rc != 0 and
    'not found' not in (network_check.stderr | default('') | lower)

- name: Create private network
  ansible.builtin.command:
    cmd: >
      hcloud network create
      --name {{ project }}-network
      --ip-range {{ network_cidr }}
      --label project={{ project }}
  register: network_create
  changed_when: network_create.rc == 0
  retries: "{{ hcloud_write_retries }}"
  delay: "{{ hcloud_write_delay }}"
  until: >-
    network_create.rc == 0 or
    'already' in (network_create.stderr | default('') | lower) or
    'exists' in (network_create.stderr | default('') | lower)
  failed_when: >-
    network_create.rc != 0 and
    'already' not in (network_create.stderr | default('') | lower) and
    'exists' not in (network_create.stderr | default('') | lower)
  when: network_check.rc != 0

- name: Create infrastructure subnet
  ansible.builtin.command:
    cmd: >
      hcloud network add-subnet {{ project }}-network
      --type cloud
      --network-zone {{ network_zone }}
      --ip-range {{ infra_subnet_cidr }}
  register: subnet_infra
  changed_when: subnet_infra.rc == 0
  retries: "{{ hcloud_write_retries }}"
  delay: "{{ hcloud_write_delay }}"
  until: >-
    subnet_infra.rc == 0 or
    'already' in (subnet_infra.stderr | default('') | lower) or
    'exists' in (subnet_infra.stderr | default('') | lower) or
    'overlaps' in (subnet_infra.stderr | default('') | lower) or
    'duplicate' in (subnet_infra.stderr | default('') | lower) or
    'uniqueness' in (subnet_infra.stderr | default('') | lower)
  failed_when: >-
    subnet_infra.rc != 0
    and 'already' not in (subnet_infra.stderr | default(''))
    and 'exists' not in (subnet_infra.stderr | default(''))
    and 'overlaps' not in (subnet_infra.stderr | default(''))
    and 'duplicate' not in (subnet_infra.stderr | default(''))
    and 'uniqueness' not in (subnet_infra.stderr | default(''))

