# ============================================
# Firewalls
# ============================================

- name: Resolve explicit bastion SSH source CIDRs
  ansible.builtin.set_fact:
    _hetzner_profile_ssh_source_ips: >-
      {{ hetzner_ssh_source_ips |
         default(network.ssh_source_ips | default([]), true) }}
    _hetzner_env_ssh_source_ips: >-
      {{ lookup('env', 'HETZNER_SSH_SOURCE_IPS') |
         default('', true) | split(',') | map('trim') |
         reject('equalto', '') | list }}

- name: Select the effective bastion SSH source CIDRs
  ansible.builtin.set_fact:
    effective_hetzner_ssh_source_ips: >-
      {{ _hetzner_profile_ssh_source_ips
         if (_hetzner_profile_ssh_source_ips | length > 0)
         else _hetzner_env_ssh_source_ips }}

- name: Reject public or missing bastion SSH exposure
  ansible.builtin.assert:
    that:
      - effective_hetzner_ssh_source_ips | length > 0
      - effective_hetzner_ssh_source_ips | length <= 16
      - "'0.0.0.0/0' not in effective_hetzner_ssh_source_ips"
      - "'::/0' not in effective_hetzner_ssh_source_ips"
      - effective_hetzner_ssh_source_ips |
        select('match', '^[0-9A-Fa-f:.]+/[0-9]{1,3}$') |
        list | length == effective_hetzner_ssh_source_ips | length
    fail_msg: >-
      Bastion SSH must be restricted to explicit operator/VPN CIDRs. Set
      network.ssh_source_ips, hetzner_ssh_source_ips, or comma-separated
      HETZNER_SSH_SOURCE_IPS. World-open 0.0.0.0/0 and ::/0 are forbidden.
    quiet: true

- name: Check if bastion firewall already exists
  ansible.builtin.command:
    cmd: hcloud firewall describe {{ project }}-fw-bastion -o json
  register: fw_bastion_check
  changed_when: false
  retries: "{{ hcloud_read_retries }}"
  delay: "{{ hcloud_read_delay }}"
  until: >-
    fw_bastion_check.rc == 0 or
    'not found' in (fw_bastion_check.stderr | default('') | lower)
  failed_when: >-
    fw_bastion_check.rc != 0 and
    'not found' not in (fw_bastion_check.stderr | default('') | lower)

- name: Create bastion firewall
  ansible.builtin.command:
    cmd: >
      hcloud firewall create
      --name {{ project }}-fw-bastion
      --label project={{ project }}
  register: fw_bastion_create
  retries: "{{ hcloud_write_retries }}"
  delay: "{{ hcloud_write_delay }}"
  until: >-
    fw_bastion_create.rc == 0 or
    'already' in (fw_bastion_create.stderr | default('') | lower) or
    'exists' in (fw_bastion_create.stderr | default('') | lower)
  failed_when: >-
    fw_bastion_create.rc != 0 and
    'already' not in (fw_bastion_create.stderr | default('') | lower) and
    'exists' not in (fw_bastion_create.stderr | default('') | lower)
  when: fw_bastion_check.rc != 0

- name: Define the complete bastion firewall policy
  ansible.builtin.set_fact:
    desired_bastion_firewall_rules:
      - direction: in
        protocol: tcp
        port: '22'
        source_ips: '{{ effective_hetzner_ssh_source_ips }}'
        description: SSH access from approved operator and VPN CIDRs
      - direction: in
        protocol: tcp
        port: '80'
        source_ips: [0.0.0.0/0, '::/0']
        description: HTTP ACME and minimal-tier ingress
      - direction: in
        protocol: tcp
        port: '443'
        source_ips: [0.0.0.0/0, '::/0']
        description: Headscale VPN and minimal-tier ingress
      - direction: in
        protocol: udp
        port: '3478'
        source_ips: [0.0.0.0/0, '::/0']
        description: STUN/DERP for VPN
      - direction: in
        protocol: udp
        port: '41641'
        source_ips: [0.0.0.0/0, '::/0']
        description: WireGuard/Tailscale VPN

- name: Read current bastion firewall after creation
  ansible.builtin.command:
    cmd: hcloud firewall describe {{ project }}-fw-bastion -o json
  register: fw_bastion_current
  changed_when: false
  retries: "{{ hcloud_read_retries }}"
  delay: "{{ hcloud_read_delay }}"
  until: fw_bastion_current.rc == 0

- name: Normalize current bastion firewall policy for comparison
  ansible.builtin.set_fact:
    current_bastion_firewall_rules: >-
      {%- set ns = namespace(rules=[]) -%}
      {%- for rule in (fw_bastion_current.stdout | from_json).rules | default([]) -%}
      {%- set _ = ns.rules.append({
        'direction': rule.direction,
        'protocol': rule.protocol,
        'port': rule.port,
        'source_ips': rule.source_ips,
        'description': rule.description
      }) -%}
      {%- endfor -%}
      {{ ns.rules }}

- name: Stage complete bastion firewall policy
  ansible.builtin.copy:
    dest: /tmp/{{ project }}-fw-bastion-rules.json
    content: '{{ desired_bastion_firewall_rules | to_nice_json }}'
    mode: '0600'
  when: current_bastion_firewall_rules != desired_bastion_firewall_rules

- name: Replace drifted bastion firewall policy atomically
  ansible.builtin.command:
    cmd: >-
      hcloud firewall replace-rules
      --rules-file /tmp/{{ project }}-fw-bastion-rules.json
      {{ project }}-fw-bastion
  register: fw_bastion_replace
  retries: "{{ hcloud_write_retries }}"
  delay: "{{ hcloud_write_delay }}"
  until: fw_bastion_replace.rc == 0
  when: current_bastion_firewall_rules != desired_bastion_firewall_rules

- name: Remove staged bastion firewall policy
  ansible.builtin.file:
    path: /tmp/{{ project }}-fw-bastion-rules.json
    state: absent

- name: Check if node firewall already exists
  ansible.builtin.command:
    cmd: hcloud firewall describe {{ project }}-fw-nodes -o json
  register: fw_nodes_check
  changed_when: false
  retries: "{{ hcloud_read_retries }}"
  delay: "{{ hcloud_read_delay }}"
  until: >-
    fw_nodes_check.rc == 0 or
    'not found' in (fw_nodes_check.stderr | default('') | lower)
  failed_when: >-
    fw_nodes_check.rc != 0 and
    'not found' not in (fw_nodes_check.stderr | default('') | lower)

- name: Create node firewall (private network only)
  ansible.builtin.command:
    cmd: >
      hcloud firewall create
      --name {{ project }}-fw-nodes
      --label project={{ project }}
  register: fw_nodes_create
  retries: "{{ hcloud_write_retries }}"
  delay: "{{ hcloud_write_delay }}"
  until: >-
    fw_nodes_create.rc == 0 or
    'already' in (fw_nodes_create.stderr | default('') | lower) or
    'exists' in (fw_nodes_create.stderr | default('') | lower)
  failed_when: >-
    fw_nodes_create.rc != 0 and
    'already' not in (fw_nodes_create.stderr | default('') | lower) and
    'exists' not in (fw_nodes_create.stderr | default('') | lower)
  when: fw_nodes_check.rc != 0

- name: Define the complete node firewall policy
  ansible.builtin.set_fact:
    desired_node_firewall_rules:
      - direction: in
        protocol: tcp
        port: '22'
        source_ips: ['{{ network_cidr }}', 100.64.0.0/10]
        description: SSH from private network and VPN
      - direction: in
        protocol: tcp
        port: '6443'
        source_ips: ['{{ network_cidr }}', 100.64.0.0/10]
        description: Kubernetes API
      - direction: in
        protocol: tcp
        port: '10250'
        source_ips: ['{{ network_cidr }}', 100.64.0.0/10]
        description: Kubelet API
      - direction: in
        protocol: tcp
        port: 30000-32767
        source_ips: ['{{ network_cidr }}', 100.64.0.0/10]
        description: NodePort range
      - direction: in
        protocol: tcp
        port: 2379-2380
        source_ips: ['{{ network_cidr }}']
        description: etcd cluster
      - direction: in
        protocol: tcp
        port: '4240'
        source_ips: ['{{ network_cidr }}']
        description: Cilium health checks
      - direction: in
        protocol: udp
        port: '8472'
        source_ips: ['{{ network_cidr }}']
        description: Cilium VXLAN overlay
      - direction: in
        protocol: udp
        port: '51871'
        source_ips: ['{{ network_cidr }}']
        description: Cilium WireGuard encryption

- name: Read current node firewall after creation
  ansible.builtin.command:
    cmd: hcloud firewall describe {{ project }}-fw-nodes -o json
  register: fw_nodes_current
  changed_when: false
  retries: "{{ hcloud_read_retries }}"
  delay: "{{ hcloud_read_delay }}"
  until: fw_nodes_current.rc == 0

- name: Normalize current node firewall policy for comparison
  ansible.builtin.set_fact:
    current_node_firewall_rules: >-
      {%- set ns = namespace(rules=[]) -%}
      {%- for rule in (fw_nodes_current.stdout | from_json).rules | default([]) -%}
      {%- set _ = ns.rules.append({
        'direction': rule.direction,
        'protocol': rule.protocol,
        'port': rule.port,
        'source_ips': rule.source_ips,
        'description': rule.description
      }) -%}
      {%- endfor -%}
      {{ ns.rules }}

- name: Stage complete node firewall policy
  ansible.builtin.copy:
    dest: /tmp/{{ project }}-fw-nodes-rules.json
    content: '{{ desired_node_firewall_rules | to_nice_json }}'
    mode: '0600'
  when: current_node_firewall_rules != desired_node_firewall_rules

- name: Replace drifted node firewall policy atomically
  ansible.builtin.command:
    cmd: >-
      hcloud firewall replace-rules
      --rules-file /tmp/{{ project }}-fw-nodes-rules.json
      {{ project }}-fw-nodes
  register: fw_nodes_replace
  retries: "{{ hcloud_write_retries }}"
  delay: "{{ hcloud_write_delay }}"
  until: fw_nodes_replace.rc == 0
  when: current_node_firewall_rules != desired_node_firewall_rules

- name: Remove staged node firewall policy
  ansible.builtin.file:
    path: /tmp/{{ project }}-fw-nodes-rules.json
    state: absent

# ============================================
# Bastion Server (public IP)
# ============================================

- name: Check if bastion server already exists
  ansible.builtin.command:
    cmd: hcloud server describe {{ server_name_prefix }}-bastion -o json
  register: bastion_check
  changed_when: false
  retries: "{{ hcloud_read_retries }}"
  delay: "{{ hcloud_read_delay }}"
  until: >-
    bastion_check.rc == 0 or
    'not found' in (bastion_check.stderr | default('') | lower)
  failed_when: >-
    bastion_check.rc != 0 and
    'not found' not in (bastion_check.stderr | default('') | lower)

- name: Refuse an unavailable bastion type when creation is required
  ansible.builtin.assert:
    that:
      - bastion_check.rc == 0 or (selected_bastion_available_in_region | bool)
    fail_msg: >-
      Bastion {{ server_name_prefix }}-bastion is missing, but selected type
      {{ bastion_type }} is currently unavailable in {{ region }}. Existing
      retained servers may continue running; refusing a creation attempt that
      the provider catalog says cannot be placed.

- name: Create bastion server
  ansible.builtin.command:
    argv:
      - hcloud
      - server
      - create
      - --name
      - "{{ server_name_prefix }}-bastion"
      - --type
      - "{{ bastion_type }}"
      - --image
      - "{{ hetzner_image | default('ubuntu-24.04') }}"
      - --location
      - "{{ region }}"
      - --ssh-key
      - "{{ hcloud_ssh_key }}"
      - --network
      - "{{ project }}-network"
      - --firewall
      - "{{ project }}-fw-bastion"
      - --label
      - "project={{ project }},role=bastion"
  register: bastion_create
  changed_when: bastion_create.rc == 0
  retries: "{{ hcloud_write_retries }}"
  delay: "{{ hcloud_write_delay }}"
  until: >-
    bastion_create.rc == 0 or
    'already' in (bastion_create.stderr | default('') | lower) or
    'exists' in (bastion_create.stderr | default('') | lower)
  failed_when: >-
    bastion_create.rc != 0 and
    'already' not in (bastion_create.stderr | default('') | lower) and
    'exists' not in (bastion_create.stderr | default('') | lower)
  when: bastion_check.rc != 0

- name: Get bastion public IP
  ansible.builtin.command:
    cmd: hcloud server ip {{ server_name_prefix }}-bastion
  register: bastion_ip_result
  changed_when: false
  retries: "{{ hcloud_read_retries }}"
  delay: "{{ hcloud_read_delay }}"
  until: bastion_ip_result.rc == 0

- name: Set bastion IP fact
  set_fact:
    bastion_public_ip: "{{ bastion_ip_result.stdout | trim }}"

- name: Get bastion private IP
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      hcloud server describe {{ server_name_prefix }}-bastion -o json |
      python3 -c "import sys,json; d=json.load(sys.stdin); print(d['private_net'][0]['ip'])"
    executable: /bin/bash
  register: bastion_private_ip_result
  changed_when: false
  retries: "{{ hcloud_read_retries }}"
  delay: "{{ hcloud_read_delay }}"
  until: bastion_private_ip_result.rc == 0

- name: Set bastion private IP fact
  set_fact:
    bastion_private_ip: "{{ bastion_private_ip_result.stdout | trim }}"

- name: Wait for bastion SSH to be ready
  wait_for:
    host: "{{ bastion_public_ip }}"
    port: 22
    delay: 10
    timeout: 300
  delegate_to: localhost
  become: false

# ============================================
# Control Plane Servers (private network only)
# ============================================

- name: Check if control plane servers already exist
  ansible.builtin.command:
    cmd: hcloud server describe {{ server_name_prefix }}-master-{{ item }} -o json
  loop: "{{ range(1, (cp_count | int) + 1) | list }}"
  register: master_check
  changed_when: false
  retries: "{{ hcloud_read_retries }}"
  delay: "{{ hcloud_read_delay }}"
  until: >-
    master_check.rc == 0 or
    'not found' in (master_check.stderr | default('') | lower)
  failed_when: >-
    master_check.rc != 0 and
    'not found' not in (master_check.stderr | default('') | lower)

- name: Refuse an unavailable control plane type when creation is required
  ansible.builtin.assert:
    that:
      - >-
        item.rc == 0 or
        (desired_node_spec.locations | default([])
         | selectattr('name', 'equalto', region)
         | selectattr('available', 'equalto', true)
         | list | length > 0)
    fail_msg: >-
      Control-plane server {{ desired_node_name }} is missing, but selected type
      {{ desired_node_type }} is currently unavailable in {{ region }}.
      Existing retained servers may continue running; refusing a partial
      expansion that the provider catalog says cannot be placed.
  vars:
    desired_node_name: "{{ project }}-master-{{ item.item }}"
    desired_node_type: >-
      {{ node_type_overrides.get(desired_node_name, cp_type) }}
    desired_node_spec: >-
      {{ hcloud_server_types_raw.stdout | from_json
         | selectattr('name', 'equalto', desired_node_type) | first | default({}) }}
  loop: "{{ master_check.results }}"
  loop_control:
    label: "{{ desired_node_name }}"

- name: Create control plane servers
  ansible.builtin.command:
    argv: >-
      {{
        [
          'hcloud', 'server', 'create',
          '--name', server_name_prefix + '-master-' + (item | string),
          '--type', node_type_overrides.get(
            project + '-master-' + (item | string), cp_type),
          '--image', hetzner_image | default('ubuntu-24.04'),
          '--location', region,
          '--ssh-key', hcloud_ssh_key,
          '--network', project + '-network',
          '--firewall', project + '-fw-nodes',
          '--without-ipv4', '--without-ipv6',
          '--label', 'project=' + project + ',role=master,index=' + (item | string)
        ]
        + (['--placement-group', project + '-spread']
           if infra_tier in ['medium', 'production'] else [])
      }}
  loop: "{{ range(1, (cp_count | int) + 1) | list }}"
  register: master_create
  changed_when: master_create.rc == 0
  retries: "{{ hcloud_write_retries }}"
  delay: "{{ hcloud_write_delay }}"
  until: >-
    master_create.rc == 0 or
    'already' in (master_create.stderr | default('') | lower) or
    'exists' in (master_create.stderr | default('') | lower)
  failed_when: >-
    master_create.rc != 0 and
    'already' not in (master_create.stderr | default('') | lower) and
    'exists' not in (master_create.stderr | default('') | lower)
  when: master_check.results[item - 1].rc != 0

