---
# Hetzner Infrastructure Role
# Provisions Hetzner Cloud: servers, networks, load balancers, firewalls, DNS
# Fully idempotent — safely re-runnable when resources already exist.
# Uses hcloud CLI. Naming: {project}-{resource}

- name: Set infrastructure tier-specific variables
  set_fact:
    project: "{{ project_name | default('k8s') }}"
    region: "{{ hetzner_region | default('hel1') }}"
    infra_tier: "{{ tier | default('medium') }}"

# ============================================
# Auto-select cheapest server types from Hetzner API
# ============================================

- name: Fetch available server types from Hetzner API
  ansible.builtin.command:
    cmd: hcloud server-type list -o json
  register: hcloud_server_types_raw
  changed_when: false

- name: Set EU locations list
  set_fact:
    hetzner_eu_locations:
      - "fsn1"
      - "nbg1"
      - "hel1"

- name: Build region-aware server type list sorted by price
  set_fact:
    available_server_types: >-
      {{ hcloud_server_types_raw.stdout | from_json
         | selectattr('architecture', 'equalto', 'x86')
         | list
         | json_query('[].{
             name: name,
             cores: cores,
             memory: memory,
             price: prices[?location==`' + region + '`] | [0].price_monthly.gross
           }')
         | selectattr('price', 'defined')
         | selectattr('price', 'ne', None)
         | sort(attribute='price')
         | list }}

- name: Set tier spec reference
  set_fact:
    current_tier_spec: "{{ hetzner_tier_specs[infra_tier] }}"

# --- Try primary region first, fallback to any EU location ---

- name: Find bastion type in primary region
  set_fact:
    auto_bastion_type: >-
      {{ (available_server_types
          | selectattr('cores', 'ge', 2)
          | selectattr('memory', 'ge', 4)
          | map(attribute='name')
          | first | default('')) }}
  when: hetzner_bastion_type | default('') | length == 0

- name: Find control plane type in primary region
  set_fact:
    auto_cp_type: >-
      {{ (available_server_types
          | selectattr('cores', 'ge', current_tier_spec.cp_min_cores | int)
          | selectattr('memory', 'ge', current_tier_spec.cp_min_memory | int)
          | map(attribute='name')
          | first | default('')) }}
  when: hetzner_cp_type | default('') | length == 0

- name: Find worker type in primary region
  set_fact:
    auto_worker_type: >-
      {{ (available_server_types
          | selectattr('cores', 'ge', current_tier_spec.worker_min_cores | int)
          | selectattr('memory', 'ge', current_tier_spec.worker_min_memory | int)
          | map(attribute='name')
          | first | default('')) }}
  when: hetzner_worker_type | default('') | length == 0

- name: Check if any auto-selected type is missing in primary region
  set_fact:
    needs_eu_fallback: >-
      {{ (hetzner_bastion_type | default(auto_bastion_type | default(''), true) | trim | length == 0)
         or (hetzner_cp_type | default(auto_cp_type | default(''), true) | trim | length == 0)
         or (hetzner_worker_type | default(auto_worker_type | default(''), true) | trim | length == 0) }}

- name: Find cheapest EU fallback region
  block:
    - name: Build EU-wide server type lists per location
      set_fact:
        eu_types_by_location: >-
          {{ dict(
               hetzner_eu_locations
               | zip(
                   hetzner_eu_locations | map('regex_replace', '(.*)',
                     hcloud_server_types_raw.stdout | from_json
                     | selectattr('architecture', 'equalto', 'x86')
                     | list
                     | to_json
                   )
                 )
             ) }}

    - name: Pick cheapest EU location that has all needed types
      set_fact:
        eu_fallback_region: "{{ item }}"
        eu_fallback_types: >-
          {{ hcloud_server_types_raw.stdout | from_json
             | selectattr('architecture', 'equalto', 'x86')
             | list
             | json_query('[].{
                 name: name,
                 cores: cores,
                 memory: memory,
                 price: prices[?location==`' + item + '`] | [0].price_monthly.gross
               }')
             | selectattr('price', 'defined')
             | selectattr('price', 'ne', None)
             | sort(attribute='price')
             | list }}
      loop: "{{ hetzner_eu_locations | reject('equalto', region) | list }}"
      when: >-
        eu_fallback_region is not defined
        and (hcloud_server_types_raw.stdout | from_json
             | selectattr('architecture', 'equalto', 'x86')
             | list
             | json_query('[].{
                 name: name,
                 cores: cores,
                 memory: memory,
                 price: prices[?location==`' + item + '`] | [0].price_monthly.gross
               }')
             | selectattr('price', 'defined')
             | selectattr('price', 'ne', None)
             | selectattr('cores', 'ge', current_tier_spec.worker_min_cores | int)
             | selectattr('memory', 'ge', current_tier_spec.worker_min_memory | int)
             | list | length > 0)

    - name: Switch to EU fallback region
      set_fact:
        region: "{{ eu_fallback_region }}"
        available_server_types: "{{ eu_fallback_types }}"

    - name: Re-select bastion type from EU fallback
      set_fact:
        auto_bastion_type: >-
          {{ (eu_fallback_types
              | selectattr('cores', 'ge', 2)
              | selectattr('memory', 'ge', 4)
              | map(attribute='name')
              | first) }}
      when: hetzner_bastion_type | default('') | length == 0 and (auto_bastion_type | default('') | trim | length == 0)

    - name: Re-select control plane type from EU fallback
      set_fact:
        auto_cp_type: >-
          {{ (eu_fallback_types
              | selectattr('cores', 'ge', current_tier_spec.cp_min_cores | int)
              | selectattr('memory', 'ge', current_tier_spec.cp_min_memory | int)
              | map(attribute='name')
              | first) }}
      when: hetzner_cp_type | default('') | length == 0 and (auto_cp_type | default('') | trim | length == 0)

    - name: Re-select worker type from EU fallback
      set_fact:
        auto_worker_type: >-
          {{ (eu_fallback_types
              | selectattr('cores', 'ge', current_tier_spec.worker_min_cores | int)
              | selectattr('memory', 'ge', current_tier_spec.worker_min_memory | int)
              | map(attribute='name')
              | first) }}
      when: hetzner_worker_type | default('') | length == 0 and (auto_worker_type | default('') | trim | length == 0)

    - name: Warn about region fallback
      debug:
        msg: "WARNING: Region {{ hetzner_region | default('hel1') }} lacked suitable types. Falling back to {{ eu_fallback_region }}"
  when: needs_eu_fallback | bool

- name: Set tier-specific server configuration
  set_fact:
    cp_count: "{{ current_tier_spec.cp_count }}"
    cp_type: "{{ hetzner_cp_type | default(auto_cp_type, true) | trim }}"
    cp_schedulable: "{{ current_tier_spec.cp_schedulable | default(false) }}"
    worker_count: "{{ current_tier_spec.worker_count }}"
    worker_type: "{{ hetzner_worker_type | default(auto_worker_type, true) | trim }}"
    bastion_type: "{{ hetzner_bastion_type | default(auto_bastion_type, true) | trim }}"
    lb_enabled: "{{ current_tier_spec.lb_enabled | default(true) }}"

- name: Validate all server types were found
  assert:
    that:
      - bastion_type | length > 0
      - cp_type | length > 0
      - worker_type | length > 0
    fail_msg: >
      Could not find suitable server types in any EU region.
      Bastion={{ bastion_type }}, CP={{ cp_type }}, Worker={{ worker_type }}.
      Override manually: hetzner_bastion_type, hetzner_cp_type, hetzner_worker_type

- name: Build price lookup from available types
  set_fact:
    type_price_map: "{{ dict(available_server_types | map(attribute='name') | zip(available_server_types | map(attribute='price'))) }}"

- name: Display selected server types
  debug:
    msg:
      - "Tier: {{ infra_tier }} | Region: {{ region }}"
      - "Bastion: {{ bastion_type }} (~€{{ type_price_map[bastion_type] | default('?') }}/mo)"
      - "Control plane: {{ cp_type }} x{{ cp_count }} (~€{{ type_price_map[cp_type] | default('?') }}/mo each)"
      - "Workers: {{ worker_type }} x{{ worker_count }} (~€{{ type_price_map[worker_type] | default('?') }}/mo each)"

- name: Map region to network zone
  set_fact:
    network_zone: >-
      {{ region_zone_map[region[:3]] | default('eu-central') }}
  vars:
    region_zone_map:
      hel: eu-central
      fsn: eu-central
      nbg: eu-central
      ash: us-east
      hil: us-west

- name: Validate HCLOUD_TOKEN is set
  assert:
    that:
      - lookup('env', 'HCLOUD_TOKEN') | length > 0
    fail_msg: "HCLOUD_TOKEN not set. Get from: https://console.hetzner.cloud -> Security -> API Tokens"

# ============================================
# SSH Key
# ============================================

- name: Check if SSH key already exists
  ansible.builtin.command:
    cmd: hcloud ssh-key describe {{ project }}-key -o json
  register: ssh_key_check
  changed_when: false
  failed_when: false

- name: Upload SSH public key to Hetzner
  ansible.builtin.command:
    cmd: >
      hcloud ssh-key create
      --name {{ project }}-key
      --public-key-from-file {{ ssh_key_path | default('~/.ssh/id_ed25519') }}.pub
  register: ssh_key_create
  changed_when: ssh_key_create.rc == 0
  failed_when: ssh_key_create.rc != 0
  when: ssh_key_check.rc != 0

- name: Set SSH key name fact
  set_fact:
    hcloud_ssh_key: "{{ project }}-key"

# ============================================
# Network
# ============================================

- name: Check if network already exists
  ansible.builtin.command:
    cmd: hcloud network describe {{ project }}-network -o json
  register: network_check
  changed_when: false
  failed_when: false

- name: Create private network
  ansible.builtin.command:
    cmd: >
      hcloud network create
      --name {{ project }}-network
      --ip-range 10.0.0.0/16
      --label project={{ project }}
  when: network_check.rc != 0

- name: Create infrastructure subnet
  ansible.builtin.command:
    cmd: >
      hcloud network add-subnet {{ project }}-network
      --type cloud
      --network-zone {{ network_zone }}
      --ip-range 10.0.0.0/24
  register: subnet_infra
  changed_when: subnet_infra.rc == 0
  failed_when: >-
    subnet_infra.rc != 0
    and 'already' not in (subnet_infra.stderr | default(''))
    and 'exists' not in (subnet_infra.stderr | default(''))
    and 'overlaps' not in (subnet_infra.stderr | default(''))
    and 'duplicate' not in (subnet_infra.stderr | default(''))
    and 'uniqueness' not in (subnet_infra.stderr | default(''))

- name: Create control plane subnet
  ansible.builtin.command:
    cmd: >
      hcloud network add-subnet {{ project }}-network
      --type cloud
      --network-zone {{ network_zone }}
      --ip-range 10.0.1.0/24
  register: subnet_cp
  changed_when: subnet_cp.rc == 0
  failed_when: >-
    subnet_cp.rc != 0
    and 'already' not in (subnet_cp.stderr | default(''))
    and 'exists' not in (subnet_cp.stderr | default(''))
    and 'overlaps' not in (subnet_cp.stderr | default(''))
    and 'duplicate' not in (subnet_cp.stderr | default(''))
    and 'uniqueness' not in (subnet_cp.stderr | default(''))

- name: Create workers subnet
  ansible.builtin.command:
    cmd: >
      hcloud network add-subnet {{ project }}-network
      --type cloud
      --network-zone {{ network_zone }}
      --ip-range 10.0.2.0/24
  register: subnet_workers
  changed_when: subnet_workers.rc == 0
  failed_when: >-
    subnet_workers.rc != 0
    and 'already' not in (subnet_workers.stderr | default(''))
    and 'exists' not in (subnet_workers.stderr | default(''))
    and 'overlaps' not in (subnet_workers.stderr | default(''))
    and 'duplicate' not in (subnet_workers.stderr | default(''))
    and 'uniqueness' not in (subnet_workers.stderr | default(''))

# ============================================
# Placement Group (for HA)
# ============================================

- name: Check if placement group already exists
  ansible.builtin.command:
    cmd: hcloud placement-group describe {{ project }}-spread -o json
  register: pg_check
  changed_when: false
  failed_when: false
  when: infra_tier in ['medium', 'production']

- name: Create placement group for spread
  ansible.builtin.command:
    cmd: >
      hcloud placement-group create
      --name {{ project }}-spread
      --type spread
  when: infra_tier in ['medium', 'production'] and pg_check.rc != 0

# ============================================
# Firewalls
# ============================================

- name: Check if bastion firewall already exists
  ansible.builtin.command:
    cmd: hcloud firewall describe {{ project }}-fw-bastion -o json
  register: fw_bastion_check
  changed_when: false
  failed_when: false

- name: Create bastion firewall
  ansible.builtin.command:
    cmd: >
      hcloud firewall create
      --name {{ project }}-fw-bastion
      --label project={{ project }}
  when: fw_bastion_check.rc != 0

- name: Add SSH rule to bastion firewall
  ansible.builtin.command:
    cmd: >
      hcloud firewall add-rule {{ project }}-fw-bastion
      --direction in --protocol tcp --port 22
      --source-ips 0.0.0.0/0 --source-ips ::/0
      --description "SSH access"
  register: fw_rule_ssh
  changed_when: fw_rule_ssh.rc == 0
  failed_when: fw_rule_ssh.rc != 0 and 'duplicate' not in (fw_rule_ssh.stderr | default('')) and 'already' not in (fw_rule_ssh.stderr | default(''))

- name: Add VPN rule to bastion firewall
  ansible.builtin.command:
    cmd: >
      hcloud firewall add-rule {{ project }}-fw-bastion
      --direction in --protocol tcp --port 443
      --source-ips 0.0.0.0/0 --source-ips ::/0
      --description "Headscale VPN"
  register: fw_rule_vpn
  changed_when: fw_rule_vpn.rc == 0
  failed_when: fw_rule_vpn.rc != 0 and 'duplicate' not in (fw_rule_vpn.stderr | default('')) and 'already' not in (fw_rule_vpn.stderr | default(''))

- name: Add Headscale DERP rule to bastion firewall
  ansible.builtin.command:
    cmd: >
      hcloud firewall add-rule {{ project }}-fw-bastion
      --direction in --protocol udp --port 3478
      --source-ips 0.0.0.0/0 --source-ips ::/0
      --description "STUN/DERP for VPN"
  register: fw_rule_derp
  changed_when: fw_rule_derp.rc == 0
  failed_when: fw_rule_derp.rc != 0 and 'duplicate' not in (fw_rule_derp.stderr | default('')) and 'already' not in (fw_rule_derp.stderr | default(''))

- name: Add WireGuard/Tailscale UDP rule to bastion firewall
  ansible.builtin.command:
    cmd: >
      hcloud firewall add-rule {{ project }}-fw-bastion
      --direction in --protocol udp --port 41641
      --source-ips 0.0.0.0/0 --source-ips ::/0
      --description "WireGuard/Tailscale VPN"
  register: fw_rule_wg
  changed_when: fw_rule_wg.rc == 0
  failed_when: fw_rule_wg.rc != 0 and 'duplicate' not in (fw_rule_wg.stderr | default('')) and 'already' not in (fw_rule_wg.stderr | default(''))

- name: Check if node firewall already exists
  ansible.builtin.command:
    cmd: hcloud firewall describe {{ project }}-fw-nodes -o json
  register: fw_nodes_check
  changed_when: false
  failed_when: false

- name: Create node firewall (private network only)
  ansible.builtin.command:
    cmd: >
      hcloud firewall create
      --name {{ project }}-fw-nodes
      --label project={{ project }}
  when: fw_nodes_check.rc != 0

- name: Add SSH from bastion and VPN to node firewall
  ansible.builtin.command:
    cmd: >
      hcloud firewall add-rule {{ project }}-fw-nodes
      --direction in --protocol tcp --port 22
      --source-ips 10.0.0.0/16 --source-ips 100.64.0.0/10
      --description "SSH from private network and VPN"
  register: fw_node_ssh
  changed_when: fw_node_ssh.rc == 0
  failed_when: fw_node_ssh.rc != 0 and 'duplicate' not in (fw_node_ssh.stderr | default('')) and 'already' not in (fw_node_ssh.stderr | default(''))

- name: Add K8s API to node firewall
  ansible.builtin.command:
    cmd: >
      hcloud firewall add-rule {{ project }}-fw-nodes
      --direction in --protocol tcp --port 6443
      --source-ips 10.0.0.0/16 --source-ips 100.64.0.0/10
      --description "Kubernetes API"
  register: fw_node_api
  changed_when: fw_node_api.rc == 0
  failed_when: fw_node_api.rc != 0 and 'duplicate' not in (fw_node_api.stderr | default('')) and 'already' not in (fw_node_api.stderr | default(''))

- name: Add kubelet to node firewall
  ansible.builtin.command:
    cmd: >
      hcloud firewall add-rule {{ project }}-fw-nodes
      --direction in --protocol tcp --port 10250
      --source-ips 10.0.0.0/16 --source-ips 100.64.0.0/10
      --description "Kubelet API"
  register: fw_node_kubelet
  changed_when: fw_node_kubelet.rc == 0
  failed_when: fw_node_kubelet.rc != 0 and 'duplicate' not in (fw_node_kubelet.stderr | default('')) and 'already' not in (fw_node_kubelet.stderr | default(''))

- name: Add NodePort range to node firewall
  ansible.builtin.command:
    cmd: >
      hcloud firewall add-rule {{ project }}-fw-nodes
      --direction in --protocol tcp --port 30000-32767
      --source-ips 10.0.0.0/16 --source-ips 100.64.0.0/10
      --description "NodePort range"
  register: fw_node_np
  changed_when: fw_node_np.rc == 0
  failed_when: fw_node_np.rc != 0 and 'duplicate' not in (fw_node_np.stderr | default('')) and 'already' not in (fw_node_np.stderr | default(''))

- name: Add etcd ports to node firewall
  ansible.builtin.command:
    cmd: >
      hcloud firewall add-rule {{ project }}-fw-nodes
      --direction in --protocol tcp --port 2379-2380
      --source-ips 10.0.0.0/16
      --description "etcd cluster"
  register: fw_node_etcd
  changed_when: fw_node_etcd.rc == 0
  failed_when: fw_node_etcd.rc != 0 and 'duplicate' not in (fw_node_etcd.stderr | default('')) and 'already' not in (fw_node_etcd.stderr | default(''))

- name: Add Cilium health check port to node firewall
  ansible.builtin.command:
    cmd: >
      hcloud firewall add-rule {{ project }}-fw-nodes
      --direction in --protocol tcp --port 4240
      --source-ips 10.0.0.0/16
      --description "Cilium health checks"
  register: fw_node_cilium_health
  changed_when: fw_node_cilium_health.rc == 0
  failed_when: fw_node_cilium_health.rc != 0 and 'duplicate' not in (fw_node_cilium_health.stderr | default('')) and 'already' not in (fw_node_cilium_health.stderr | default(''))

- name: Add Cilium VXLAN port to node firewall
  ansible.builtin.command:
    cmd: >
      hcloud firewall add-rule {{ project }}-fw-nodes
      --direction in --protocol udp --port 8472
      --source-ips 10.0.0.0/16
      --description "Cilium VXLAN overlay"
  register: fw_node_cilium_vxlan
  changed_when: fw_node_cilium_vxlan.rc == 0
  failed_when: fw_node_cilium_vxlan.rc != 0 and 'duplicate' not in (fw_node_cilium_vxlan.stderr | default('')) and 'already' not in (fw_node_cilium_vxlan.stderr | default(''))

# ============================================
# Bastion Server (public IP)
# ============================================

- name: Check if bastion server already exists
  ansible.builtin.command:
    cmd: hcloud server describe {{ project }}-bastion -o json
  register: bastion_check
  changed_when: false
  failed_when: false

- name: Create bastion server
  ansible.builtin.command:
    cmd: >
      hcloud server create
      --name {{ project }}-bastion
      --type {{ bastion_type }}
      --image {{ hetzner_image | default('ubuntu-24.04') }}
      --location {{ region }}
      --ssh-key {{ hcloud_ssh_key }}
      --network {{ project }}-network
      --firewall {{ project }}-fw-bastion
      --label project={{ project }},role=bastion
  when: bastion_check.rc != 0

- name: Get bastion public IP
  ansible.builtin.command:
    cmd: hcloud server ip {{ project }}-bastion
  register: bastion_ip_result
  changed_when: false

- name: Set bastion IP fact
  set_fact:
    bastion_public_ip: "{{ bastion_ip_result.stdout | trim }}"

- name: Get bastion private IP
  ansible.builtin.shell:
    cmd: hcloud server describe {{ project }}-bastion -o json | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['private_net'][0]['ip'])"
  register: bastion_private_ip_result
  changed_when: false

- name: Set bastion private IP fact
  set_fact:
    bastion_private_ip: "{{ bastion_private_ip_result.stdout | trim }}"

- name: Wait for bastion SSH to be ready
  wait_for:
    host: "{{ bastion_public_ip }}"
    port: 22
    delay: 10
    timeout: 300
  delegate_to: localhost
  become: false

# ============================================
# Control Plane Servers (private network only)
# ============================================

- name: Check if control plane servers already exist
  ansible.builtin.command:
    cmd: hcloud server describe {{ project }}-master-{{ item }} -o json
  loop: "{{ range(1, (cp_count | int) + 1) | list }}"
  register: master_check
  changed_when: false
  failed_when: false

- name: Create control plane servers
  ansible.builtin.command:
    cmd: >
      hcloud server create
      --name {{ project }}-master-{{ item }}
      --type {{ cp_type }}
      --image {{ hetzner_image | default('ubuntu-24.04') }}
      --location {{ region }}
      --ssh-key {{ hcloud_ssh_key }}
      --network {{ project }}-network
      --firewall {{ project }}-fw-nodes
      --without-ipv4
      --without-ipv6
      --label project={{ project }},role=master,index={{ item }}
      {{ '--placement-group ' + project + '-spread' if infra_tier in ['medium', 'production'] else '' }}
  loop: "{{ range(1, (cp_count | int) + 1) | list }}"
  when: master_check.results[item - 1].rc != 0

# ============================================
# Worker Servers (private network only)
# ============================================

- name: Check if worker servers already exist
  ansible.builtin.command:
    cmd: hcloud server describe {{ project }}-worker-{{ item }} -o json
  loop: "{{ range(1, (worker_count | int) + 1) | list }}"
  register: worker_check
  changed_when: false
  failed_when: false

- name: Create worker servers
  ansible.builtin.command:
    cmd: >
      hcloud server create
      --name {{ project }}-worker-{{ item }}
      --type {{ worker_type }}
      --image {{ hetzner_image | default('ubuntu-24.04') }}
      --location {{ region }}
      --ssh-key {{ hcloud_ssh_key }}
      --network {{ project }}-network
      --firewall {{ project }}-fw-nodes
      --without-ipv4
      --without-ipv6
      --label project={{ project }},role=worker,index={{ item }}
      {{ '--placement-group ' + project + '-spread' if infra_tier in ['medium', 'production'] else '' }}
  loop: "{{ range(1, (worker_count | int) + 1) | list }}"
  when: worker_check.results[item - 1].rc != 0

# ============================================
# Discover actual private IPs from Hetzner API
# ============================================

- name: Get control plane server private IPs
  ansible.builtin.shell:
    cmd: hcloud server describe {{ project }}-master-{{ item }} -o json | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['private_net'][0]['ip'])"
  loop: "{{ range(1, (cp_count | int) + 1) | list }}"
  register: master_ip_results
  changed_when: false

- name: Get worker server private IPs
  ansible.builtin.shell:
    cmd: hcloud server describe {{ project }}-worker-{{ item }} -o json | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['private_net'][0]['ip'])"
  loop: "{{ range(1, (worker_count | int) + 1) | list }}"
  register: worker_ip_results
  changed_when: false

- name: Build master IP map
  set_fact:
    master_ips: "{{ master_ips | default({}) | combine({ project + '-master-' + (item.item | string): item.stdout | trim }) }}"
  loop: "{{ master_ip_results.results }}"
  loop_control:
    label: "{{ project }}-master-{{ item.item }}"

- name: Build worker IP map
  set_fact:
    worker_ips: "{{ worker_ips | default({}) | combine({ project + '-worker-' + (item.item | string): item.stdout | trim }) }}"
  loop: "{{ worker_ip_results.results }}"
  loop_control:
    label: "{{ project }}-worker-{{ item.item }}"

- name: Set first master IP for kubeconfig
  set_fact:
    first_master_ip: "{{ master_ips[project + '-master-1'] }}"

- name: Display discovered node IPs
  debug:
    msg:
      - "Master IPs: {{ master_ips }}"
      - "Worker IPs: {{ worker_ips }}"
      - "First master: {{ first_master_ip }}"

# ============================================
# Load Balancer
# ============================================

- name: Check if load balancer already exists
  ansible.builtin.command:
    cmd: hcloud load-balancer describe {{ project }}-lb -o json
  register: lb_check
  changed_when: false
  failed_when: false
  when: lb_enabled | bool

- name: Create load balancer
  ansible.builtin.command:
    cmd: >
      hcloud load-balancer create
      --name {{ project }}-lb
      --type lb11
      --location {{ region }}
      --label project={{ project }}
  when: lb_enabled | bool and lb_check.rc != 0

- name: Attach LB to private network
  ansible.builtin.command:
    cmd: >
      hcloud load-balancer attach-to-network {{ project }}-lb
      --network {{ project }}-network
  register: lb_network
  changed_when: lb_network.rc == 0
  failed_when: lb_network.rc != 0 and 'already' not in (lb_network.stderr | default('')) and 'attached' not in (lb_network.stderr | default(''))
  when: lb_enabled | bool

- name: Add LB service for HTTPS (443 -> NodePort 30443)
  ansible.builtin.command:
    cmd: >
      hcloud load-balancer add-service {{ project }}-lb
      --protocol tcp --listen-port 443 --destination-port 30443
      --health-check-protocol tcp --health-check-port 30443
  register: lb_svc_https
  changed_when: lb_svc_https.rc == 0
  failed_when: lb_svc_https.rc != 0 and 'already' not in (lb_svc_https.stderr | default('')) and 'exists' not in (lb_svc_https.stderr | default(''))
  when: lb_enabled | bool

- name: Add LB service for HTTP (80 -> NodePort 30080)
  ansible.builtin.command:
    cmd: >
      hcloud load-balancer add-service {{ project }}-lb
      --protocol tcp --listen-port 80 --destination-port 30080
  register: lb_svc_http
  changed_when: lb_svc_http.rc == 0
  failed_when: lb_svc_http.rc != 0 and 'already' not in (lb_svc_http.stderr | default('')) and 'exists' not in (lb_svc_http.stderr | default(''))
  when: lb_enabled | bool

- name: Add worker servers as LB targets
  ansible.builtin.command:
    cmd: >
      hcloud load-balancer add-target {{ project }}-lb
      --server {{ project }}-worker-{{ item }}
      --use-private-ip
  loop: "{{ range(1, (worker_count | int) + 1) | list }}"
  register: lb_target
  changed_when: lb_target.rc == 0
  failed_when: lb_target.rc != 0 and 'already' not in (lb_target.stderr | default('')) and 'target' not in (lb_target.stderr | default(''))
  when: lb_enabled | bool

- name: Get load balancer public IP
  ansible.builtin.command:
    cmd: >
      hcloud load-balancer describe {{ project }}-lb -o json
  register: lb_info
  changed_when: false
  when: lb_enabled | bool

- name: Set LB IP fact
  set_fact:
    lb_public_ip: "{{ (lb_info.stdout | from_json).public_net.ipv4.ip }}"
  when: lb_enabled | bool and lb_info.stdout is defined

- name: Set public IP to bastion when no LB
  set_fact:
    lb_public_ip: "{{ bastion_public_ip }}"
  when: not (lb_enabled | bool)

# ============================================
# DNS Setup (Hetzner Cloud unified DNS via hcloud CLI)
# Since hcloud v1.53.0, DNS is part of the Cloud API.
# Uses HCLOUD_TOKEN (same token as servers/networks).
# Commands: hcloud zone create, hcloud zone rrset create
# Idempotent: checks existing before creating.
# ============================================

- name: Check if DNS zone already exists
  ansible.builtin.command:
    cmd: hcloud zone describe {{ domain }} -o json
  register: dns_zone_check
  changed_when: false
  failed_when: false

- name: Create DNS zone
  ansible.builtin.command:
    cmd: >
      hcloud zone create
      --name {{ domain }}
      --mode primary
  register: dns_zone_create
  when: dns_zone_check.rc != 0
  failed_when: false

- name: Set DNS zone available flag
  set_fact:
    dns_zone_available: "{{ dns_zone_check.rc == 0 or (dns_zone_create.rc | default(1) == 0) }}"

- name: Warn if DNS zone creation failed
  debug:
    msg: "WARNING: Could not create Hetzner DNS zone for {{ domain }} ({{ dns_zone_create.stderr | default('skipped') | regex_replace('\n', ' ') }}). Configure DNS manually."
  when: not dns_zone_available | bool

- name: Create DNS wildcard A record (*.domain -> LB)
  ansible.builtin.command:
    cmd: >
      hcloud zone rrset create {{ domain }}
      --name '*'
      --type A
      --record {{ lb_public_ip }}
  register: dns_wildcard
  changed_when: dns_wildcard.rc == 0
  failed_when: dns_wildcard.rc != 0 and 'already' not in (dns_wildcard.stderr | default('')) and 'exists' not in (dns_wildcard.stderr | default(''))
  when: dns_zone_available | bool

- name: Create DNS root A record (domain -> LB)
  ansible.builtin.command:
    cmd: >
      hcloud zone rrset create {{ domain }}
      --name @
      --type A
      --record {{ lb_public_ip }}
  register: dns_root
  changed_when: dns_root.rc == 0
  failed_when: dns_root.rc != 0 and 'already' not in (dns_root.stderr | default('')) and 'exists' not in (dns_root.stderr | default(''))
  when: dns_zone_available | bool

- name: Create DNS VPN A record (vpn.domain -> bastion)
  ansible.builtin.command:
    cmd: >
      hcloud zone rrset create {{ domain }}
      --name vpn
      --type A
      --record {{ bastion_public_ip }}
  register: dns_vpn
  changed_when: dns_vpn.rc == 0
  failed_when: dns_vpn.rc != 0 and 'already' not in (dns_vpn.stderr | default('')) and 'exists' not in (dns_vpn.stderr | default(''))
  when: dns_zone_available | bool

# ============================================
# Write infrastructure state
# ============================================

- name: Write infrastructure facts
  copy:
    dest: "{{ playbook_dir }}/{{ project }}-infra-facts.yml"
    content: |
      ---
      project: "{{ project }}"
      domain: "{{ domain }}"
      region: "{{ region }}"
      tier: "{{ infra_tier }}"
      bastion_public_ip: "{{ bastion_public_ip }}"
      bastion_private_ip: "{{ bastion_private_ip }}"
      lb_ip: "{{ lb_public_ip }}"
      lb_enabled: {{ lb_enabled | bool }}
      cp_count: {{ cp_count }}
      worker_count: {{ worker_count }}
      master_ips: {{ master_ips | to_json }}
      worker_ips: {{ worker_ips | to_json }}
      first_master_ip: "{{ first_master_ip }}"
    mode: '0600'

- name: Display infrastructure summary
  debug:
    msg:
      - "=========================================="
      - "  Hetzner Infrastructure Provisioned"
      - "=========================================="
      - "  Project: {{ project }}"
      - "  Region: {{ region }} (zone: {{ network_zone }})"
      - "  Tier: {{ infra_tier }}"
      - "  Bastion IP: {{ bastion_public_ip }} (private: {{ bastion_private_ip }})"
      - "  LB IP: {{ lb_public_ip }}"
      - "  Masters: {{ cp_count }}x {{ cp_type }}"
      - "  Workers: {{ worker_count }}x {{ worker_type }}"
      - "  Master IPs: {{ master_ips }}"
      - "  Worker IPs: {{ worker_ips }}"
      - "=========================================="
