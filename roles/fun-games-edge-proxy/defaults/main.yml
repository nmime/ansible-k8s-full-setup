---
fun_games_edge_mode: audit
fun_games_edge_confirm_cutover: false
fun_games_edge_install_root: /opt/fun-games-edge
fun_games_edge_backup_root: /var/backups/fun-games-edge
fun_games_edge_safeline_root: /data/safeline
fun_games_edge_compose_project: fun-games-edge
fun_games_edge_image: >-
  nginxinc/nginx-unprivileged@sha256:59ccf0943b0b8e8d9e6ea9039a39555730f544701a655c596f7df7d096c593f5
fun_games_edge_resolvers:
  - 1.1.1.1
  - 8.8.8.8
fun_games_edge_canary_http_port: 18080
fun_games_edge_canary_https_port: 18443
fun_games_edge_http_port: 80
fun_games_edge_https_port: 443
fun_games_edge_proxy_connect_timeout: 10s
fun_games_edge_proxy_read_timeout: 3600s
fun_games_edge_proxy_send_timeout: 3600s
fun_games_edge_hsts_max_age: 31536000
fun_games_edge_container_cpus: "1.0"
fun_games_edge_container_memory: 256m
fun_games_edge_container_pids_limit: 128
fun_games_edge_tls_group_name: fun-games-edge-tls
fun_games_edge_tls_group_gid: 39101

# Bootstrap certificates are copied from SafeLine/cert-manager for the canary
# and cutover. After public DNS reaches this edge, run mode=certificates once;
# Certbot then owns edge renewals while missing challenge files still fall back
# to the origin for cert-manager HTTP-01 renewals.
fun_games_edge_acme_enabled: true
fun_games_edge_acme_email: >-
  {{ lookup('env', 'FUN_GAMES_EDGE_ACME_EMAIL') | default('', true) }}
fun_games_edge_acme_server: ""
fun_games_edge_acme_webroot: "{{ fun_games_edge_install_root }}/acme-webroot"
fun_games_edge_acme_certificates: []

# A production cutover is not allowed until the SafeLine archive has been
# encrypted and round-trip verified in the disaster-recovery object store.
fun_games_edge_backup_age_recipient: >-
  {{ lookup('env', 'CLUSTER_BACKUP_AGE_RECIPIENT') | default('', true) }}
fun_games_edge_backup_dr_endpoint: >-
  {{ lookup('env', 'BACKUP_DR_ENDPOINT') | default('', true) }}
fun_games_edge_backup_dr_region: >-
  {{ lookup('env', 'BACKUP_DR_REGION') | default('us-east-1', true) }}
fun_games_edge_backup_dr_bucket: >-
  {{ lookup('env', 'BACKUP_DR_BUCKET') | default('', true) }}
fun_games_edge_backup_dr_prefix: >-
  {{ lookup('env', 'BACKUP_DR_PREFIX') | default('cluster-backups', true) }}/edge/safeline
fun_games_edge_backup_dr_access_key: >-
  {{ lookup('env', 'BACKUP_DR_ACCESS_KEY') | default('', true) }}
fun_games_edge_backup_dr_secret_key: >-
  {{ lookup('env', 'BACKUP_DR_SECRET_KEY') | default('', true) }}

# Every entry must use a distinct certificate that covers hostname. Upstream
# DNS is resolved by Nginx independently from the compatibility hostname to
# prevent a public-DNS loop after cutover.
fun_games_edge_hosts: []

# A production cutover is fail-closed until every compatibility hostname that
# currently depends on the edge is represented. Override this inventory only
# after documenting an intentional retirement.
fun_games_edge_required_hosts:
  - uno.funfiesta.games
  - api.uno.funfiesta.games
  - backend.uno.funfiesta.games
  - bot.uno.funfiesta.games
  - admin.uno.funfiesta.games
  - uno.pp.funfiesta.games
  - api.uno.pp.funfiesta.games
  - backend.uno.pp.funfiesta.games
  - bot.uno.pp.funfiesta.games
  - admin.uno.pp.funfiesta.games
  - durak.funfiesta.games
  - api.durak.funfiesta.games
  - backend.durak.funfiesta.games
  - bot.durak.funfiesta.games
  - admin.durak.funfiesta.games
  - durak.pp.funfiesta.games
  - api.durak.pp.funfiesta.games
  - backend.durak.pp.funfiesta.games
  - bot.durak.pp.funfiesta.games
  - admin.durak.pp.funfiesta.games
  - s3.funfiesta.games
