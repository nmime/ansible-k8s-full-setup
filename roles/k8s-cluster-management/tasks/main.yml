  until: _r_install_cert_manager is not failed

- name: Add Hetzner Cloud Helm repository
  kubernetes.core.helm_repository:
    name: hcloud
    repo_url: "https://charts.hetzner.cloud"
  register: _r_add_hetzner_cloud_helm_repository
  retries: 3
  delay: 10
  until: _r_add_hetzner_cloud_helm_repository is not failed

- name: Install official Hetzner Cloud DNS webhook for cert-manager
  kubernetes.core.helm:
    name: cert-manager-webhook-hetzner
    chart_ref: hcloud/cert-manager-webhook-hetzner
    chart_version: "0.6.7"
    release_namespace: cert-manager
    release_state: present
    wait: true
    values:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi
  when: k8s_create_external_tls | default(true) | bool
  register: _r_install_official_hetzner_cloud_dns_webho
  retries: 3
  delay: 10
  until: _r_install_official_hetzner_cloud_dns_webho is not failed

- name: Create Hetzner Cloud API token secret for cert-manager
  no_log: true
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: hetzner-secret
        namespace: cert-manager
      stringData:
        api-token: "{{ hcloud_token | default(lookup('env', 'HCLOUD_TOKEN')) }}"
  when: k8s_create_external_tls | default(true) | bool
  register: _r_create_hetzner_cloud_api_token_secret_fo
  retries: 3
  delay: 10
  until: _r_create_hetzner_cloud_api_token_secret_fo is not failed

- name: Create Let's Encrypt ClusterIssuer (staging)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cert-manager.io/v1
      kind: ClusterIssuer
      metadata:
        name: letsencrypt-staging
      spec:
        acme:
          server: https://acme-staging-v02.api.letsencrypt.org/directory
          email: "{{ email }}"
          privateKeySecretRef:
            name: letsencrypt-staging-key
          solvers:
            - dns01:
                webhook:
                  groupName: acme.hetzner.com
                  solverName: hetzner
                  config:
                    tokenSecretKeyRef:
                      name: hetzner-secret
                      key: api-token
  when: k8s_create_external_tls | default(true) | bool
  register: _r_create_let_s_encrypt_clusterissuer_stagi
  retries: 3
  delay: 10
  until: _r_create_let_s_encrypt_clusterissuer_stagi is not failed

- name: Create Let's Encrypt ClusterIssuer (production)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cert-manager.io/v1
      kind: ClusterIssuer
      metadata:
        name: letsencrypt-prod
      spec:
        acme:
          server: https://acme-v02.api.letsencrypt.org/directory
          email: "{{ email }}"
          privateKeySecretRef:
            name: letsencrypt-prod-key
          solvers:
            - dns01:
                webhook:
                  groupName: acme.hetzner.com
                  solverName: hetzner
                  config:
                    tokenSecretKeyRef:
                      name: hetzner-secret
                      key: api-token
  when: k8s_create_external_tls | default(true) | bool
  register: _r_create_let_s_encrypt_clusterissuer_produ
  retries: 3
  delay: 10
  until: _r_create_let_s_encrypt_clusterissuer_produ is not failed

- name: Create wildcard TLS certificate
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cert-manager.io/v1
      kind: Certificate
      metadata:
        name: wildcard-tls
        namespace: gateway-secrets
      spec:
        secretName: wildcard-tls
        issuerRef:
          name: "{{ cert_manager_cluster_issuer }}"
          kind: ClusterIssuer
        dnsNames:
          - "{{ domain }}"
          - "*.{{ domain }}"
  when: k8s_create_external_tls | default(true) | bool
  register: _r_create_wildcard_tls_certificate
  retries: 3
  delay: 10
  until: _r_create_wildcard_tls_certificate is not failed

- name: Wait for the selected wildcard certificate issuer to become ready
  kubernetes.core.k8s_info:
    api_version: cert-manager.io/v1
    kind: Certificate
    namespace: gateway-secrets
    name: wildcard-tls
  register: wildcard_tls_certificate
  retries: 60
  delay: 10
  until:
    - wildcard_tls_certificate.resources | default([]) | length == 1
    - wildcard_tls_certificate.resources[0].spec.issuerRef.name == cert_manager_cluster_issuer
    - >-
      wildcard_tls_certificate.resources[0].status.conditions | default([])
      | selectattr('type', 'equalto', 'Ready')
      | selectattr('status', 'equalto', 'True')
      | selectattr('observedGeneration', 'defined')
      | selectattr(
          'observedGeneration',
          'ge',
          wildcard_tls_certificate.resources[0].metadata.generation | default(1)
        )
      | list | length == 1
  when: k8s_create_external_tls | default(true) | bool

- name: Read the ready Gateway source certificate secret
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    namespace: gateway-secrets
    name: wildcard-tls
  register: gateway_source_secret
  when: k8s_create_external_tls | default(true) | bool
  no_log: true

- name: Wait for Cilium to sync the current Gateway certificate
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    namespace: cilium-secrets
    name: gateway-secrets-wildcard-tls
  register: cilium_gateway_synced_secret
  retries: 40
  delay: 5
  until:
    - cilium_gateway_synced_secret.resources | default([]) | length == 1
    - >-
      cilium_gateway_synced_secret.resources[0].data['tls.crt']
      == gateway_source_secret.resources[0].data['tls.crt']
    - >-
      cilium_gateway_synced_secret.resources[0].data['tls.key']
      == gateway_source_secret.resources[0].data['tls.key']
  when: k8s_create_external_tls | default(true) | bool
  no_log: true

- name: Calculate the expected public Gateway certificate fingerprint
  ansible.builtin.command:
    argv:
      - openssl
      - x509
      - -noout
      - -fingerprint
      - -sha256
    stdin: "{{ gateway_source_secret.resources[0].data['tls.crt'] | b64decode }}"
  register: expected_gateway_certificate_fingerprint
  changed_when: false
  when: k8s_create_external_tls | default(true) | bool
  no_log: true

- name: Wait for the public Gateway to serve the current certificate
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail &&
      openssl s_client
      -connect {{ domain | quote }}:443
      -servername {{ domain | quote }}
      </dev/null 2>/dev/null |
      openssl x509 -noout -fingerprint -sha256
    executable: /bin/bash
  register: served_gateway_certificate_fingerprint
  changed_when: false
  retries: 40
  delay: 5
  until:
    - served_gateway_certificate_fingerprint.rc == 0
    - >-
      served_gateway_certificate_fingerprint.stdout
      | regex_replace('(?i)^sha256 fingerprint=', '')
      | trim
      ==
      expected_gateway_certificate_fingerprint.stdout
      | regex_replace('(?i)^sha256 fingerprint=', '')
      | trim
  when: k8s_create_external_tls | default(true) | bool

- name: Require public TLS ingress with the selected certificate issuer
  ansible.builtin.uri:
    url: https://{{ domain }}/
    validate_certs: "{{ cert_manager_cluster_issuer == 'letsencrypt-prod' }}"
    status_code: [200, 301, 302, 308, 401, 403, 404]
    timeout: 15
  register: public_tls_ingress
  retries: 12
  delay: 5
  until: public_tls_ingress is not failed
  when: k8s_create_external_tls | default(true) | bool

- name: Remove the legacy wildcard Certificate from the Cilium sync namespace
  kubernetes.core.k8s:
    state: absent
    api_version: cert-manager.io/v1
    kind: Certificate
    namespace: cilium-secrets
    name: wildcard-tls
  when: k8s_create_external_tls | default(true) | bool

- name: Remove legacy in-place Cilium Gateway TLS secrets
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Secret
    namespace: cilium-secrets
    name: "{{ item }}"
  loop:
    - wildcard-tls
    - cilium-secrets-wildcard-tls
  when: k8s_create_external_tls | default(true) | bool
  no_log: true


