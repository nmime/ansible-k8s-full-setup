---
# K8s Cluster Management - Kubespray v2.29.1 + Cilium v1.18.6 + Gateway API v1.4.0
# Installs Kubernetes cluster with core addons
# Components: K8s v1.34.3, etcd v3.5.26, containerd v2.2.1, Hetzner CCM v1.22.0, cert-manager v1.19.2, MetalLB v0.14.9

- name: Set cluster management variables
  set_fact:
    project: "{{ project_name | default('k8s') }}"
    k8s_ver: "{{ k8s_version | default('v1.34.3') }}"
    kubespray_version: "v2.29.1"
    cilium_ver: "{{ cilium_version | default('v1.18.6') }}"
    gateway_api_ver: "{{ gateway_api_version | default('v1.4.0') }}"
    certmanager_ver: "v1.19.2"
    metallb_ver: "v0.14.9"
    hetzner_ccm_ver: "v1.22.0"
    hetzner_csi_ver: "v2.12.0"
    cluster_tier: "{{ tier | default('medium') }}"

# ============================================
# Kubespray Setup
# ============================================

- name: Check for Kubespray installation
  stat:
    path: "{{ playbook_dir }}/kubespray"
  register: kubespray_dir
  delegate_to: localhost
  become: false

- name: Clone Kubespray
  git:
    repo: https://github.com/kubernetes-sigs/kubespray.git
    dest: "{{ playbook_dir }}/kubespray"
    version: "{{ kubespray_version }}"
    depth: 1
  when: not kubespray_dir.stat.exists
  delegate_to: localhost
  become: false

- name: Install Kubespray Python requirements
  pip:
    requirements: "{{ playbook_dir }}/kubespray/requirements.txt"
    state: present
  delegate_to: localhost
  become: false

- name: Create Kubespray inventory directory
  file:
    path: "{{ playbook_dir }}/kubespray/inventory/{{ project }}/group_vars/all"
    state: directory
    mode: '0755'
  delegate_to: localhost
  become: false

- name: Generate Kubespray inventory
  copy:
    dest: "{{ playbook_dir }}/kubespray/inventory/{{ project }}/hosts.yml"
    content: |
      all:
        hosts:
      {% for i in range(1, (cp_count | default(1) | int) + 1) %}
      {% set host = project + '-master-' + (i | string) %}
      {% set ip = master_ips[host] | default('10.0.1.' + (i | string)) %}
          {{ host }}:
            ansible_host: {{ ip }}
            ip: {{ ip }}
            access_ip: {{ ip }}
      {% endfor %}
      {% for i in range(1, (worker_count | default(2) | int) + 1) %}
      {% set host = project + '-worker-' + (i | string) %}
      {% set ip = worker_ips[host] | default('10.0.2.' + (i | string)) %}
          {{ host }}:
            ansible_host: {{ ip }}
            ip: {{ ip }}
            access_ip: {{ ip }}
      {% endfor %}
        children:
          kube_control_plane:
            hosts:
      {% for i in range(1, (cp_count | default(1) | int) + 1) %}
              {{ project }}-master-{{ i }}: {}
      {% endfor %}
          kube_node:
            hosts:
      {% for i in range(1, (worker_count | default(2) | int) + 1) %}
              {{ project }}-worker-{{ i }}: {}
      {% endfor %}
      {% if cp_schedulable | default(false) | bool %}
      {% for i in range(1, (cp_count | default(1) | int) + 1) %}
              {{ project }}-master-{{ i }}: {}
      {% endfor %}
      {% endif %}
          etcd:
            hosts:
      {% for i in range(1, (cp_count | default(1) | int) + 1) %}
              {{ project }}-master-{{ i }}: {}
      {% endfor %}
          k8s_cluster:
            children:
              kube_control_plane: {}
              kube_node: {}
    mode: '0644'
  delegate_to: localhost
  become: false

- name: Generate Kubespray group_vars
  copy:
    dest: "{{ playbook_dir }}/kubespray/inventory/{{ project }}/group_vars/all/custom.yml"
    content: |
      ---
      # Kubernetes
      kube_version: {{ k8s_ver }}
      container_manager: containerd
      kube_pods_subnet: {{ k8s_pod_cidr | default('10.233.64.0/18') }}
      kube_service_addresses: {{ k8s_service_cidr | default('10.233.0.0/18') }}
      kube_proxy_mode: ipvs
      kubernetes_audit: true
      metrics_server_enabled: true
      enable_nodelocaldns: true
      kubelet_max_pods: 110
      kubelet_rotate_certificates: true
      dashboard_enabled: false
      # Security
      podsecuritypolicy_enabled: false
      kube_pod_security_use_default: true
      kube_pod_security_default_enforce: baseline
      kube_apiserver_enable_admission_plugins:
        - NodeRestriction
        - PodSecurity
      # SSH
      ansible_ssh_common_args: '-o ProxyJump=root@{{ bastion_public_ip | default("") }}'
      ansible_user: root
      # etcd
      etcd_deployment_type: host
      etcd_compaction_retention: "8"
      etcd_quota_backend_bytes: "8589934592"
      # Cilium CNI
      kube_network_plugin: cilium
      cilium_version: {{ cilium_ver }}
      cilium_enable_hubble: true
      cilium_hubble_enabled: true
      cilium_hubble_relay_enabled: true
      cilium_hubble_ui_enabled: true
      cilium_gateway_api_enabled: true
      cilium_enable_gateway_api_support: true
      cilium_enable_bpf_masquerade: true
      cilium_kube_proxy_replacement: "true"
      cilium_tunnel_mode: disabled
      cilium_auto_direct_node_routes: true
      cilium_native_routing_cidr: 10.0.0.0/16
      cilium_enable_endpoint_health_checking: true
      cilium_enable_health_checking: true
      cilium_enable_bandwidth_manager: true
      cilium_enable_ipv4_masquerade: true
    mode: '0644'
  delegate_to: localhost
  become: false

- name: Run Kubespray cluster deployment
  ansible.builtin.command:
    cmd: >
      ansible-playbook -i inventory/{{ project }}/hosts.yml
      --become --become-user=root
      cluster.yml
    chdir: "{{ playbook_dir }}/kubespray"
  delegate_to: localhost
  become: false
  register: kubespray_result
  changed_when: true

# ============================================
# Post-install: kubeconfig
# ============================================

- name: Copy kubeconfig to bastion
  ansible.builtin.raw: |
    mkdir -p /root/.kube
    ssh -o StrictHostKeyChecking=no root@{{ first_master_ip | default('10.0.1.1') }} "cat /etc/kubernetes/admin.conf" > /root/.kube/config
    chmod 600 /root/.kube/config
    sed -i 's|https://.*:6443|https://{{ first_master_ip | default("10.0.1.1") }}:6443|g' /root/.kube/config
  delegate_to: "{{ bastion_public_ip | default('') }}"
  become: true
  when: bastion_public_ip is defined

- name: Copy kubeconfig to Ansible controller
  ansible.builtin.raw: |
    cat /root/.kube/config
  delegate_to: "{{ bastion_public_ip | default('') }}"
  become: true
  register: kubeconfig_content
  when: bastion_public_ip is defined

- name: Create local .kube directory
  file:
    path: "{{ lookup('env', 'HOME') }}/.kube"
    state: directory
    mode: '0700'
  delegate_to: localhost
  become: false

- name: Write kubeconfig locally
  copy:
    content: "{{ kubeconfig_content.stdout }}"
    dest: "{{ lookup('env', 'HOME') }}/.kube/config"
    mode: '0600'
  delegate_to: localhost
  become: false
  when: kubeconfig_content is defined and kubeconfig_content.stdout is defined

- name: Update local kubeconfig API server endpoint
  ansible.builtin.replace:
    path: "{{ lookup('env', 'HOME') }}/.kube/config"
    regexp: 'https://.*:6443'
    replace: "https://{{ first_master_ip | default('10.0.1.1') }}:6443"
  delegate_to: localhost
  become: false
  when: kubeconfig_content is defined

# ============================================
# Hetzner Cloud Controller Manager v1.22.0
# ============================================

- name: Create hcloud-token secret for CCM
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: hcloud
        namespace: kube-system
      stringData:
        token: "{{ lookup('env', 'HCLOUD_TOKEN') }}"
        network: "{{ project }}-network"

- name: Install Hetzner Cloud Controller Manager
  kubernetes.core.k8s:
    state: present
    src: "https://github.com/hetznercloud/hcloud-cloud-controller-manager/releases/download/{{ hetzner_ccm_ver }}/ccm-networks.yaml"

- name: Wait for Hetzner CCM to be ready
  kubernetes.core.k8s_info:
    kind: Deployment
    namespace: kube-system
    name: hcloud-cloud-controller-manager
  register: ccm_deploy
  until: >
    ccm_deploy.resources | length > 0
    and (ccm_deploy.resources[0].status.readyReplicas | default(0)) >= 1
  retries: 30
  delay: 10

# ============================================
# Hetzner CSI Driver (for hcloud-volumes StorageClass)
# ============================================

- name: Install Hetzner CSI Driver
  kubernetes.core.k8s:
    state: present
    src: "https://raw.githubusercontent.com/hetznercloud/csi-driver/{{ hetzner_csi_ver }}/deploy/kubernetes/hcloud-csi.yml"

- name: Wait for Hetzner CSI controller to be ready
  kubernetes.core.k8s_info:
    kind: Deployment
    namespace: kube-system
    name: hcloud-csi-controller
  register: csi_deploy
  until: >
    csi_deploy.resources | length > 0
    and (csi_deploy.resources[0].status.readyReplicas | default(0)) >= 1
  retries: 30
  delay: 10

# ============================================
# Gateway API CRDs + Cilium Gateway
# ============================================

- name: Install Gateway API CRDs (standard)
  kubernetes.core.k8s:
    state: present
    src: "https://github.com/kubernetes-sigs/gateway-api/releases/download/{{ gateway_api_ver }}/standard-install.yaml"

- name: Install Gateway API CRDs (experimental - TCPRoute, TLSRoute, GRPCRoute)
  kubernetes.core.k8s:
    state: present
    src: "https://github.com/kubernetes-sigs/gateway-api/releases/download/{{ gateway_api_ver }}/experimental-install.yaml"

- name: Create cilium-system namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: cilium-system

- name: Create cilium-secrets namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: cilium-secrets

- name: Create ReferenceGrant for Gateway to access TLS secrets
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: gateway.networking.k8s.io/v1beta1
      kind: ReferenceGrant
      metadata:
        name: allow-gateway-tls
        namespace: cilium-secrets
      spec:
        from:
          - group: gateway.networking.k8s.io
            kind: Gateway
            namespace: cilium-system
        to:
          - group: ""
            kind: Secret

- name: Create Cilium main Gateway
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: gateway.networking.k8s.io/v1
      kind: Gateway
      metadata:
        name: main-gateway
        namespace: cilium-system
      spec:
        gatewayClassName: cilium
        listeners:
          - name: http
            protocol: HTTP
            port: 80
            allowedRoutes:
              namespaces:
                from: All
          - name: https
            protocol: HTTPS
            port: 443
            tls:
              mode: Terminate
              certificateRefs:
                - name: wildcard-tls
                  namespace: cilium-secrets
            allowedRoutes:
              namespaces:
                from: All

- name: Wait for Cilium to create Gateway service
  kubernetes.core.k8s_info:
    kind: Service
    namespace: cilium-system
    label_selectors:
      - "io.cilium.gateway/owning-gateway=main-gateway"
  register: gw_svc
  until: gw_svc.resources | length > 0
  retries: 30
  delay: 10

- name: Patch Gateway service to use fixed NodePorts (30080/30443)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: "{{ gw_svc.resources[0].metadata.name }}"
        namespace: cilium-system
      spec:
        ports:
          - name: http
            port: 80
            targetPort: 80
            nodePort: 30080
            protocol: TCP
          - name: https
            port: 443
            targetPort: 443
            nodePort: 30443
            protocol: TCP
  when: gw_svc.resources | length > 0

# ============================================
# Admin Gateway (VPN-only access for admin services)
# ============================================

- name: Create admin Gateway (VPN-only for GitLab, ArgoCD, Grafana, Vault)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: gateway.networking.k8s.io/v1
      kind: Gateway
      metadata:
        name: admin-gateway
        namespace: cilium-system
      spec:
        gatewayClassName: cilium
        listeners:
          - name: https
            protocol: HTTPS
            port: 8443
            tls:
              mode: Terminate
              certificateRefs:
                - name: wildcard-tls
                  namespace: cilium-secrets
            allowedRoutes:
              namespaces:
                from: All

- name: Wait for admin Gateway service
  kubernetes.core.k8s_info:
    kind: Service
    namespace: cilium-system
    label_selectors:
      - "io.cilium.gateway/owning-gateway=admin-gateway"
  register: admin_gw_svc
  until: admin_gw_svc.resources | length > 0
  retries: 30
  delay: 10

- name: Patch admin Gateway service to use NodePort 30443 on internal only
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: "{{ admin_gw_svc.resources[0].metadata.name }}"
        namespace: cilium-system
      spec:
        ports:
          - name: https
            port: 8443
            targetPort: 8443
            nodePort: 31443
            protocol: TCP
  when: admin_gw_svc.resources | length > 0

- name: Create NetworkPolicy to restrict admin-gateway to VPN and private network
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: admin-gateway-vpn-only
        namespace: cilium-system
      spec:
        endpointSelector:
          matchLabels:
            io.cilium.gateway/owning-gateway: admin-gateway
        ingress:
          - fromCIDR:
              - 10.0.0.0/16
              - 100.64.0.0/10

# ============================================
# cert-manager v1.19.2
# ============================================

- name: Add Jetstack Helm repository
  kubernetes.core.helm_repository:
    name: jetstack
    repo_url: "https://charts.jetstack.io"

- name: Install cert-manager
  kubernetes.core.helm:
    name: cert-manager
    chart_ref: jetstack/cert-manager
    chart_version: "{{ certmanager_ver }}"
    release_namespace: cert-manager
    create_namespace: true
    release_state: present
    wait: true
    values:
      crds:
        enabled: true
      replicaCount: "{{ 2 if cluster_tier in ['medium', 'production'] else 1 }}"
      webhook:
        replicaCount: "{{ 2 if cluster_tier in ['medium', 'production'] else 1 }}"
      cainjector:
        replicaCount: "{{ 2 if cluster_tier in ['medium', 'production'] else 1 }}"

- name: Add Hetzner Cloud Helm repository
  kubernetes.core.helm_repository:
    name: hcloud
    repo_url: "https://charts.hetzner.cloud"

- name: Install official Hetzner Cloud DNS webhook for cert-manager
  kubernetes.core.helm:
    name: cert-manager-webhook-hetzner
    chart_ref: hcloud/cert-manager-webhook-hetzner
    release_namespace: cert-manager
    release_state: present
    wait: true

- name: Create Hetzner Cloud API token secret for cert-manager
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: hetzner-secret
        namespace: cert-manager
      stringData:
        api-token: "{{ lookup('env', 'HCLOUD_TOKEN') }}"

- name: Create Let's Encrypt ClusterIssuer (staging)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cert-manager.io/v1
      kind: ClusterIssuer
      metadata:
        name: letsencrypt-staging
      spec:
        acme:
          server: https://acme-staging-v02.api.letsencrypt.org/directory
          email: "{{ email | default('admin@example.com') }}"
          privateKeySecretRef:
            name: letsencrypt-staging-key
          solvers:
            - dns01:
                webhook:
                  groupName: acme.hetzner.com
                  solverName: hetzner
                  config:
                    tokenSecretKeyRef:
                      name: hetzner-secret
                      key: api-token

- name: Create Let's Encrypt ClusterIssuer (production)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cert-manager.io/v1
      kind: ClusterIssuer
      metadata:
        name: letsencrypt-prod
      spec:
        acme:
          server: https://acme-v02.api.letsencrypt.org/directory
          email: "{{ email | default('admin@example.com') }}"
          privateKeySecretRef:
            name: letsencrypt-prod-key
          solvers:
            - dns01:
                webhook:
                  groupName: acme.hetzner.com
                  solverName: hetzner
                  config:
                    tokenSecretKeyRef:
                      name: hetzner-secret
                      key: api-token

- name: Create wildcard TLS certificate
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cert-manager.io/v1
      kind: Certificate
      metadata:
        name: wildcard-tls
        namespace: cilium-secrets
      spec:
        secretName: wildcard-tls
        issuerRef:
          name: letsencrypt-prod
          kind: ClusterIssuer
        dnsNames:
          - "{{ domain }}"
          - "*.{{ domain }}"

# ============================================
# MetalLB v0.14.9
# ============================================

- name: Add MetalLB Helm repository
  kubernetes.core.helm_repository:
    name: metallb
    repo_url: "https://metallb.github.io/metallb"

- name: Install MetalLB
  kubernetes.core.helm:
    name: metallb
    chart_ref: metallb/metallb
    chart_version: "{{ metallb_ver }}"
    release_namespace: metallb-system
    create_namespace: true
    release_state: present
    wait: true

- name: Configure MetalLB IPAddressPool
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: metallb.io/v1beta1
      kind: IPAddressPool
      metadata:
        name: default-pool
        namespace: metallb-system
      spec:
        addresses:
          - "10.0.10.1-10.0.10.254"

- name: Configure MetalLB L2Advertisement
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: metallb.io/v1beta1
      kind: L2Advertisement
      metadata:
        name: default
        namespace: metallb-system
      spec:
        ipAddressPools:
          - default-pool

# ============================================
# Core Namespaces
# ============================================

- name: Create platform namespaces
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ item }}"
  loop:
    - gitlab
    - argocd
    - monitoring
    - storage
    - databases
    - vault
    - keda
    - production

- name: Display cluster management summary
  debug:
    msg:
      - "=========================================="
      - "  Kubernetes Cluster Deployed"
      - "=========================================="
      - "  K8s: {{ k8s_ver }}"
      - "  Kubespray: {{ kubespray_version }}"
      - "  Cilium: {{ cilium_ver }} + Gateway API {{ gateway_api_ver }}"
      - "  Hetzner CCM: {{ hetzner_ccm_ver }}"
      - "  Hetzner CSI: {{ hetzner_csi_ver }}"
      - "  cert-manager: {{ certmanager_ver }}"
      - "  MetalLB: {{ metallb_ver }}"
      - "  Tier: {{ cluster_tier }}"
      - "=========================================="
