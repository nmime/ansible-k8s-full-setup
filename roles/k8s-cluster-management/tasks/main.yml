---
# K8s Cluster Management - Kubespray v2.31.0 + Cilium v1.19.5 + Gateway API v1.6.0
# Installs Kubernetes cluster with core addons
# Components: K8s v1.35.4, Hetzner CCM v1.33.0, Hetzner CSI v2.22.0, cert-manager v1.21.0, MetalLB v0.16.1

- name: Set cluster management variables
  set_fact:
    project: "{{ project_name | default('k8s') }}"
    k8s_ver: "{{ k8s_version | default('v1.35.4') }}"
    kubespray_version: "v2.31.0"
    cilium_ver: "{{ cilium_version | default('v1.19.5') }}"
    gateway_api_ver: "{{ gateway_api_version | default('v1.6.0') }}"
    certmanager_ver: "{{ cert_manager_version | default('v1.21.0') }}"
    metallb_ver: "{{ metallb_version | default('v0.16.1') }}"
    hetzner_ccm_ver: "{{ hetzner_ccm_version | default('v1.33.0') }}"
    hetzner_csi_ver: "{{ hetzner_csi_version | default('v2.22.0') }}"
    cluster_tier: "{{ tier | default('medium') }}"
    certmanager_replicas: "{{ kubernetes.cert_manager_replicas | default(1 if resource_tier in ['minimal', 'small'] else 3) }}"
    controller_known_hosts_file: >-
      {{ lookup('env', 'HOME') }}/.ssh/known_hosts-{{ project_name | default('k8s') }}
    kubespray_control_path_dir: >-
      /tmp/ansible-k8s-cp/{{ (project_name | default('k8s') | hash('sha256'))[:16] }}
    cluster_manifest_dir: >-
      {{ lookup('env', 'HOME') }}/.cache/ansible-k8s/{{ project_name | default('k8s') }}/manifests
    local_api_port: "{{ k8s_api_local_port | default(16443) | int }}"

- name: Validate the controller-local Kubernetes API port
  ansible.builtin.assert:
    that:
      - (k8s_api_local_port | default(16443) | string) is match('^[0-9]+$')
      - local_api_port | int >= 1024
      - local_api_port | int <= 65535
    fail_msg: k8s_api_local_port must be an integer between 1024 and 65535.

- name: Create project-scoped controller state directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ controller_known_hosts_file | dirname }}", mode: '0700'}
    - {path: "{{ kubespray_control_path_dir }}", mode: '0700'}
    - {path: "{{ cluster_manifest_dir }}", mode: '0700'}
  delegate_to: localhost
  become: false

- name: Create the project-scoped controller known-hosts file
  ansible.builtin.file:
    path: "{{ controller_known_hosts_file }}"
    state: touch
    mode: '0600'
    access_time: preserve
    modification_time: preserve
  delegate_to: localhost
  become: false

# ============================================
# Kubespray Setup
# ============================================

- name: Check for Kubespray installation
  stat:
    path: "{{ playbook_dir }}/kubespray"
  register: kubespray_dir
  delegate_to: localhost
  become: false

- name: Clone Kubespray
  git:
    repo: https://github.com/kubernetes-sigs/kubespray.git
    dest: "{{ playbook_dir }}/kubespray"
    version: "{{ kubespray_version }}"
    depth: 1
  when: not kubespray_dir.stat.exists
  delegate_to: localhost
  become: false

- name: Read the pinned Kubespray Kubernetes compatibility matrix
  ansible.builtin.slurp:
    src: "{{ playbook_dir }}/kubespray/roles/kubespray_defaults/vars/main/checksums.yml"
  register: kubespray_checksum_matrix
  delegate_to: localhost
  become: false

- name: Reject Kubernetes versions unsupported by the pinned Kubespray release
  ansible.builtin.assert:
    that:
      - >-
        (k8s_ver | regex_replace('^v', '')) in
        ((kubespray_checksum_matrix.content | b64decode | from_yaml)
          .kubeadm_checksums.amd64)
    fail_msg: >-
      Kubernetes {{ k8s_ver }} is not supported by Kubespray
      {{ kubespray_version }} for amd64. Align the central Kubernetes pin with
      the pinned Kubespray checksum matrix before provisioning a cluster.
  delegate_to: localhost
  become: false

- name: Create isolated venv for Kubespray
  ansible.builtin.command:
    cmd: python3 -m venv "{{ playbook_dir }}/kubespray/.venv"
    creates: "{{ playbook_dir }}/kubespray/.venv/bin/python"
  delegate_to: localhost
  become: false

- name: Install Kubespray Python requirements in isolated venv
  ansible.builtin.command:
    cmd: "{{ playbook_dir }}/kubespray/.venv/bin/pip install -r {{ playbook_dir }}/kubespray/requirements.txt"
  delegate_to: localhost
  become: false
  register: kubespray_pip
  changed_when: "'Successfully installed' in kubespray_pip.stdout"

- name: Create Kubespray inventory directory
  file:
    path: "{{ playbook_dir }}/kubespray/inventory/{{ project }}/group_vars/all"
    state: directory
    mode: '0755'
  delegate_to: localhost
  become: false

- name: Generate Kubespray inventory
  copy:
    dest: "{{ playbook_dir }}/kubespray/inventory/{{ project }}/hosts.yml"
    content: |
      all:
        hosts:
      {% for i in range(1, (cp_count | default(1) | int) + 1) %}
      {% set host = project + '-master-' + (i | string) %}
      {% set ip = master_ips[host] | default('10.0.1.' + (i | string)) %}
          {{ host }}:
            ansible_host: {{ ip }}
            ip: {{ ip }}
            access_ip: {{ ip }}
      {% endfor %}
      {% for i in range(1, (worker_count | default(2) | int) + 1) %}
      {% set host = project + '-worker-' + (i | string) %}
      {% set ip = worker_ips[host] | default('10.0.2.' + (i | string)) %}
          {{ host }}:
            ansible_host: {{ ip }}
            ip: {{ ip }}
            access_ip: {{ ip }}
      {% endfor %}
        children:
          kube_control_plane:
            hosts:
      {% for i in range(1, (cp_count | default(1) | int) + 1) %}
              {{ project }}-master-{{ i }}: {}
      {% endfor %}
          kube_node:
            hosts:
      {% for i in range(1, (worker_count | default(2) | int) + 1) %}
              {{ project }}-worker-{{ i }}: {}
      {% endfor %}
      {% if cp_schedulable | default(false) | bool %}
      {% for i in range(1, (cp_count | default(1) | int) + 1) %}
              {{ project }}-master-{{ i }}: {}
      {% endfor %}
      {% endif %}
          etcd:
            hosts:
      {% for i in range(1, (cp_count | default(1) | int) + 1) %}
              {{ project }}-master-{{ i }}: {}
      {% endfor %}
          k8s_cluster:
            children:
              kube_control_plane: {}
              kube_node: {}
          bastion:
            hosts: {}
          calico_rr:
            hosts: {}
    mode: '0644'
  delegate_to: localhost
  become: false

- name: Generate Kubespray group_vars
  copy:
    dest: "{{ playbook_dir }}/kubespray/inventory/{{ project }}/group_vars/all/custom.yml"
    content: |
      ---
      # Kubernetes
      kube_version: "{{ k8s_ver | regex_replace('^v', '') }}"
      container_manager: containerd
      kube_pods_subnet: {{ k8s_pod_cidr | default('10.233.64.0/18') }}
      kube_service_addresses: {{ k8s_service_cidr | default('10.233.0.0/18') }}
      kube_proxy_mode: ipvs
      kubernetes_audit: true
      kube_encrypt_secret_data: true
      kube_encryption_resources:
        - secrets
      kube_encryption_algorithm: aescbc
      metrics_server_enabled: true
      enable_nodelocaldns: true
      kubelet_max_pods: 110
      kubelet_rotate_certificates: true
      # Kubelet must delegate cloud identity to the external provider. The CCM
      # itself is installed and pinned below instead of by Kubespray.
      cloud_provider: external
      external_cloud_provider: manual
      additional_sysctl:
        - name: vm.max_map_count
          value: 262144
      dashboard_enabled: false
      # Cilium 1.19 init containers drop DAC_OVERRIDE. The host CNI directory
      # must therefore be root-owned so their root UID can install helpers.
      cni_bin_owner: root
      # Security
      podsecuritypolicy_enabled: false
      kube_pod_security_use_default: true
      kube_pod_security_default_enforce: baseline
      kube_apiserver_enable_admission_plugins:
        - NodeRestriction
        - PodSecurity
      # SSH
      ansible_ssh_common_args: '-o StrictHostKeyChecking=accept-new -o UserKnownHostsFile={{ controller_known_hosts_file }} -o ProxyCommand="ssh -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile={{ controller_known_hosts_file }} -W %h:%p root@{{ bastion_public_ip | default("") }}"'
      ansible_user: root
      # etcd
      etcd_deployment_type: host
      etcd_compaction_retention: "8"
      etcd_quota_backend_bytes: "8589934592"
      # Cilium CNI
      kube_network_plugin: cilium
      cilium_version: "{{ cilium_ver | regex_replace('^v', '') }}"
      cilium_enable_hubble: true
      cilium_hubble_enabled: true
      cilium_hubble_relay_enabled: true
      cilium_hubble_ui_enabled: true
      cilium_gateway_api_enabled: true
      cilium_enable_gateway_api_support: true
      cilium_enable_bpf_masquerade: true
      cilium_kube_proxy_replacement: "true"
      cilium_tunnel_mode: vxlan
      cilium_auto_direct_node_routes: false
      cilium_enable_endpoint_health_checking: true
      cilium_enable_health_checking: true
      cilium_enable_bandwidth_manager: true
      cilium_enable_ipv4_masquerade: true
      # Keep control-plane networking components schedulable on compact nodes.
      # Kubespray passes this dictionary directly to the pinned Cilium chart.
      cilium_extra_values:
        operator:
          resources:
            requests:
              cpu: {{ '25m' if resource_tier in ['minimal', 'small'] else '50m' }}
              memory: {{ '64Mi' if resource_tier in ['minimal', 'small'] else '128Mi' }}
            limits:
              cpu: {{ '250m' if resource_tier in ['minimal', 'small'] else '500m' }}
              memory: {{ '256Mi' if resource_tier in ['minimal', 'small'] else '512Mi' }}
        envoy:
          resources:
            requests:
              cpu: {{ '20m' if resource_tier in ['minimal', 'small'] else '50m' }}
              memory: {{ '32Mi' if resource_tier in ['minimal', 'small'] else '64Mi' }}
            limits:
              cpu: {{ '250m' if resource_tier in ['minimal', 'small'] else '500m' }}
              memory: {{ '256Mi' if resource_tier in ['minimal', 'small'] else '512Mi' }}
      # Nodes use the public registry endpoint. Kubernetes service DNS is only
      # available to pods, so a *.svc.cluster.local mirror breaks kubelet pulls.
      containerd_registries_mirrors:
        - prefix: docker.io
          mirrors:
            - host: https://registry-1.docker.io
              capabilities: ["pull", "resolve"]
              skip_verify: false
        - prefix: registry.{{ domain }}
          mirrors:
            - host: https://registry.{{ domain }}
              capabilities: ["pull", "resolve", "push"]
              skip_verify: false
    mode: '0644'
  delegate_to: localhost
  become: false

- name: Clean stale SSH control sockets before Kubespray
  ansible.builtin.shell: |
    rm -rf {{ kubespray_control_path_dir | quote }}
    mkdir -p {{ kubespray_control_path_dir | quote }}
    chmod 700 {{ kubespray_control_path_dir | quote }}
    true
  delegate_to: localhost
  become: false
  changed_when: false

- name: Verify SSH connectivity to k8s nodes via bastion before Kubespray
  ansible.builtin.shell: |
    ssh -o StrictHostKeyChecking=accept-new \
      -o UserKnownHostsFile={{ controller_known_hosts_file | quote }} \
      -o ConnectTimeout=15 \
      -o ProxyCommand='ssh -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile={{ controller_known_hosts_file }} -W %h:%p root@{{ bastion_public_ip }}' \
      root@{{ item }} 'echo CONNECTIVITY_OK'
  delegate_to: localhost
  become: false
  loop: "{{ (master_ips | default({}) | dict2items | map(attribute='value') | list) + (worker_ips | default({}) | dict2items | map(attribute='value') | list) }}"
  when: item is defined and item | length > 0
  register: ssh_verify
  retries: 3
  delay: 10
  until: ssh_verify.rc == 0
  changed_when: false

- name: Ensure Kubespray ansible.cfg has control_path_dir for auto-creation
  ansible.builtin.lineinfile:
    path: "{{ playbook_dir }}/kubespray/ansible.cfg"
    insertafter: '^\[ssh_connection\]'
    regexp: '^control_path_dir'
    line: 'control_path_dir = {{ kubespray_control_path_dir }}'
  delegate_to: localhost
  become: false

- name: Bound Kubespray SSH multiplex lifetime and detect dead bastion paths
  ansible.builtin.lineinfile:
    path: "{{ playbook_dir }}/kubespray/ansible.cfg"
    regexp: '^ssh_args'
    line: >-
      ssh_args = -o ControlMaster=auto -o ControlPersist=10m
      -o ConnectionAttempts=10 -o ServerAliveInterval=15
      -o ServerAliveCountMax=3
      -o UserKnownHostsFile={{ controller_known_hosts_file }}
  delegate_to: localhost
  become: false

- name: Make Kubespray create the Cilium host binary directory as root
  ansible.builtin.replace:
    path: "{{ playbook_dir }}/kubespray/roles/kubernetes/preinstall/tasks/0050-create_directories.yml"
    after: '- name: Create cni directories'
    before: '- name: Create calico cni directories'
    regexp: 'owner: "\{\{ kube_owner \}\}"'
    replace: 'owner: root'
  delegate_to: localhost
  become: false
  register: kubespray_cni_owner_patch

- name: Verify Kubespray Cilium preinstall ownership patch
  ansible.builtin.command:
    argv:
      - sed
      - -n
      - /Create cni directories/,/Create calico cni directories/p
      - "{{ playbook_dir }}/kubespray/roles/kubernetes/preinstall/tasks/0050-create_directories.yml"
  delegate_to: localhost
  become: false
  register: kubespray_cni_directory_block
  changed_when: false
  failed_when: "'owner: root' not in kubespray_cni_directory_block.stdout"

- name: Adopt GatewayClass cilium for Helm (idempotent)
  ansible.builtin.shell: |
    ssh -o StrictHostKeyChecking=accept-new \
      -o UserKnownHostsFile={{ controller_known_hosts_file | quote }} \
      root@{{ bastion_public_ip }} '
      if kubectl get gatewayclass cilium >/dev/null 2>&1; then
        kubectl annotate gatewayclass cilium \
          meta.helm.sh/release-name=cilium \
          meta.helm.sh/release-namespace=kube-system --overwrite
        kubectl label gatewayclass cilium \
          app.kubernetes.io/managed-by=Helm --overwrite
      fi
    '
  args:
    executable: /bin/bash
  delegate_to: localhost
  become: false
  changed_when: false

- name: Run Kubespray cluster deployment
  ansible.builtin.shell: |
    unset ANSIBLE_CONFIG ANSIBLE_SSH_ARGS ANSIBLE_SSH_COMMON_ARGS
    export ANSIBLE_CONFIG={{ playbook_dir }}/kubespray/ansible.cfg
    cd {{ playbook_dir }}/kubespray
    {{ playbook_dir }}/kubespray/.venv/bin/ansible-playbook \
      -i inventory/{{ project }}/hosts.yml \
      --become --become-user=root \
      cluster.yml
  args:
    executable: /bin/bash
  delegate_to: localhost
  become: false
  register: kubespray_result
  changed_when: true
  when: not (skip_kubespray | default(false) | bool)

- name: Record the completed Kubespray reconciliation checkpoint
  ansible.builtin.file:
    path: '{{ profile_migration_kubespray_checkpoint }}'
    state: touch
    mode: '0600'
  delegate_to: localhost
  become: false
  when: profile_migration_kubespray_checkpoint | default('') | length > 0

# Fix CNI binary directory permissions (Kubespray creates it owned by kube user)
- name: Fix /opt/cni/bin ownership for Cilium
  ansible.builtin.shell: |
    ssh -o StrictHostKeyChecking=accept-new \
      -o UserKnownHostsFile={{ controller_known_hosts_file | quote }} \
      -o ProxyCommand='ssh -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile={{ controller_known_hosts_file }} -W %h:%p root@{{ bastion_public_ip }}' \
      root@{{ item }} 'bash -s' << 'REMOTECMD'
    chown -R root:root /opt/cni
    chmod 755 /opt/cni /opt/cni/bin
    ls -la /opt/cni/bin/ 2>/dev/null | head -5
    REMOTECMD
  args:
    executable: /bin/bash
  delegate_to: localhost
  become: false
  loop: "{{ (master_ips | default({}) | dict2items | map(attribute='value') | list) + (worker_ips | default({}) | dict2items | map(attribute='value') | list) }}"
  when: item is defined and item | length > 0


# ============================================
# Post-install: kubeconfig
# ============================================

- name: Copy kubeconfig from master via ProxyCommand
  ansible.builtin.shell: |
    mkdir -p {{ (lookup('env', 'HOME') + '/.kube') | quote }}
    ssh -o StrictHostKeyChecking=accept-new \
      -o UserKnownHostsFile={{ controller_known_hosts_file | quote }} \
      -o ProxyCommand='ssh -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile={{ controller_known_hosts_file }} -W %h:%p root@{{ bastion_public_ip }}' \
      root@{{ first_master_ip | default('10.0.1.1') }} 'cat /etc/kubernetes/admin.conf' \
      > {{ (lookup('env', 'HOME') + '/.kube/config') | quote }}
    chmod 600 {{ (lookup('env', 'HOME') + '/.kube/config') | quote }}
  args:
    executable: /bin/bash
  delegate_to: localhost
  become: false
  when: bastion_public_ip is defined

- name: Ensure SSH tunnel to k8s API is active
  ansible.builtin.shell: |
    set -euo pipefail
    kubeconfig={{ lookup('env', 'HOME') }}/.kube/config
    tunnel_pid_file={{ lookup('env', 'HOME') }}/.kube/{{ project }}-api-tunnel.pid
    local_api_port={{ local_api_port | int }}
    if [ -f "$tunnel_pid_file" ]; then
      old_pid=$(cat "$tunnel_pid_file")
      if [[ "$old_pid" =~ ^[0-9]+$ ]] && kill -0 "$old_pid" 2>/dev/null; then
        old_command=$(ps -p "$old_pid" -o command=)
        if [[ "$old_command" != *"kube-api-tunnel-supervisor.sh"* || "$old_command" != *"--local-port ${local_api_port}"* ]]; then
          echo "Refusing to kill PID $old_pid because it is not a managed API tunnel: $old_command" >&2
          exit 1
        fi
        kill "$old_pid"
        # The supervisor may be inside its 15-second health interval. Wait
        # beyond that interval so its TERM trap can reap the SSH child and
        # release the listener before the replacement starts.
        for _ in $(seq 1 120); do kill -0 "$old_pid" 2>/dev/null || break; sleep 0.25; done
        if kill -0 "$old_pid" 2>/dev/null; then
          echo "Managed API tunnel PID $old_pid did not stop within 30 seconds" >&2
          exit 1
        fi
        for _ in $(seq 1 120); do
          nc -z 127.0.0.1 "$local_api_port" >/dev/null 2>&1 || break
          sleep 0.25
        done
      fi
      rm -f "$tunnel_pid_file"
    fi
    if nc -z 127.0.0.1 "$local_api_port" >/dev/null 2>&1; then
      echo "Local port $local_api_port is occupied by an unmanaged process" >&2
      lsof -nP -iTCP:"$local_api_port" -sTCP:LISTEN >&2 || true
      exit 1
    fi
    nohup {{ playbook_dir }}/../scripts/kube-api-tunnel-supervisor.sh \
      --bastion {{ bastion_public_ip | quote }} \
      {% for target in (master_ips | default({}) | dict2items | sort(attribute='key') | map(attribute='value') | list) or [first_master_ip | default('10.0.1.1')] %}
      --target {{ target | quote }} \
      {% endfor %}
      --kubeconfig "$kubeconfig" \
      --known-hosts-file {{ controller_known_hosts_file | quote }} \
      --local-port "$local_api_port" > /dev/null 2>&1 &
    tunnel_pid=$!
    printf '%s\n' "$tunnel_pid" > "$tunnel_pid_file"
    chmod 600 "$tunnel_pid_file"
    for attempt in $(seq 1 30); do
      if nc -z 127.0.0.1 "$local_api_port" >/dev/null 2>&1; then
        echo "SSH tunnel ready after ${attempt}s"
        break
      fi
      if ! kill -0 "$tunnel_pid" 2>/dev/null; then
        echo "SSH tunnel exited before becoming ready" >&2
        exit 1
      fi
      sleep 1
    done
    nc -z 127.0.0.1 "$local_api_port" >/dev/null 2>&1 || { echo "SSH tunnel timed out" >&2; exit 1; }
    kubectl --kubeconfig "$kubeconfig" config set-cluster cluster.local \
      --server="https://127.0.0.1:${local_api_port}" >/dev/null
    for verify in $(seq 1 5); do
      if KUBECONFIG="$kubeconfig" kubectl get nodes 2>/dev/null; then
        exit 0
      fi
      sleep 2
    done
    echo "kubectl failed after 5 retries"
    KUBECONFIG="$kubeconfig" kubectl get nodes
  args:
    executable: /bin/bash
  delegate_to: localhost
  become: false
  when: bastion_public_ip is defined

# ============================================
# Hetzner Cloud Controller Manager

- name: Wait for all nodes to be Ready before applying fixes
  ansible.builtin.shell: |
    for i in $(seq 1 60); do
      NOT_READY=$(kubectl get nodes --no-headers 2>/dev/null | grep -v ' Ready ' | wc -l)
      TOTAL=$(kubectl get nodes --no-headers 2>/dev/null | wc -l)
      if [ "$NOT_READY" -eq 0 ] && [ "$TOTAL" -gt 0 ]; then
        echo "All $TOTAL nodes Ready"; exit 0
      fi
      if [ "$((i % 10))" -eq 0 ]; then
        echo "--- Diagnostic at attempt $i ---"
        kubectl get nodes 2>/dev/null
        kubectl get pods -A --no-headers 2>/dev/null | grep -v Running | grep -v Completed || true
      fi
      echo "Waiting for nodes (attempt $i/60, $NOT_READY not ready)..."; sleep 15
    done
    echo "FINAL STATE:"
    kubectl get nodes 2>/dev/null
    kubectl get pods -A 2>/dev/null | head -30
    echo "Timeout waiting for nodes after 15 minutes"; exit 1
  args:
    executable: /bin/bash
  delegate_to: localhost
  become: false
  changed_when: false

- name: Reconcile Cilium operator resource bounds after Kubespray
  kubernetes.core.k8s:
    state: patched
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: cilium-operator
        namespace: kube-system
      spec:
        template:
          spec:
            containers:
              - name: cilium-operator
                resources:
                  requests:
                    cpu: "{{ '25m' if resource_tier in ['minimal', 'small'] else '50m' }}"
                    memory: "{{ '64Mi' if resource_tier in ['minimal', 'small'] else '128Mi' }}"
                  limits:
                    cpu: "{{ '250m' if resource_tier in ['minimal', 'small'] else '500m' }}"
                    memory: "{{ '256Mi' if resource_tier in ['minimal', 'small'] else '512Mi' }}"
  register: _r_bound_cilium_operator
  retries: 3
  delay: 10
  until: _r_bound_cilium_operator is not failed

- name: Reconcile Cilium Envoy resource bounds after Kubespray
  kubernetes.core.k8s:
    state: patched
    definition:
      apiVersion: apps/v1
      kind: DaemonSet
      metadata:
        name: cilium-envoy
        namespace: kube-system
      spec:
        template:
          spec:
            containers:
              - name: cilium-envoy
                resources:
                  requests:
                    cpu: "{{ '20m' if resource_tier in ['minimal', 'small'] else '50m' }}"
                    memory: "{{ '32Mi' if resource_tier in ['minimal', 'small'] else '64Mi' }}"
                  limits:
                    cpu: "{{ '250m' if resource_tier in ['minimal', 'small'] else '500m' }}"
                    memory: "{{ '256Mi' if resource_tier in ['minimal', 'small'] else '512Mi' }}"
  register: _r_bound_cilium_envoy
  retries: 3
  delay: 10
  until: _r_bound_cilium_envoy is not failed

- name: Enforce dedicated control-plane scheduling contract
  ansible.builtin.shell: |
    set -euo pipefail
    changed=false
    for node in {{ master_ips.keys() | list | join(' ') }}; do
      if kubectl get node "$node" -o json | jq -e '
        any(.spec.taints[]?;
          (.key == "node-role.kubernetes.io/control-plane"
            or .key == "node-role.kubernetes.io/master")
          and .effect == "NoSchedule")
      ' >/dev/null; then
        if kubectl get node "$node" -o json | jq -e '.spec.unschedulable == true' >/dev/null; then
          kubectl uncordon "$node"
          changed=true
        fi
      else
        kubectl taint node "$node" node-role.kubernetes.io/control-plane=:NoSchedule --overwrite
        if ! kubectl drain "$node" --ignore-daemonsets --delete-emptydir-data \
          --force --timeout=10m; then
          kubectl uncordon "$node" >/dev/null 2>&1 || true
          kubectl taint node "$node" node-role.kubernetes.io/control-plane:NoSchedule- \
            >/dev/null 2>&1 || true
          exit 1
        fi
        kubectl uncordon "$node"
        changed=true
      fi
      kubectl get node "$node" -o json | jq -e '
        (.spec.unschedulable != true) and
        any(.spec.taints[]?;
          (.key == "node-role.kubernetes.io/control-plane"
            or .key == "node-role.kubernetes.io/master")
          and .effect == "NoSchedule")
      ' >/dev/null || {
        echo "dedicated scheduling contract was not established for $node" >&2
        exit 1
      }
    done
    echo "changed=$changed"
  args:
    executable: /bin/bash
  register: dedicated_control_plane
  changed_when: "'changed=true' in dedicated_control_plane.stdout"
  retries: 2
  delay: 30
  until: dedicated_control_plane is success
  when: not (cp_schedulable | default(false) | bool)

- name: Enforce schedulable control-plane contract for compact profiles
  ansible.builtin.shell: |
    set -euo pipefail
    changed=false
    for node in {{ master_ips.keys() | list | join(' ') }}; do
      if kubectl get node "$node" -o json | jq -e '
        any(.spec.taints[]?;
          (.key == "node-role.kubernetes.io/control-plane"
            or .key == "node-role.kubernetes.io/master")
          and .effect == "NoSchedule")
      ' >/dev/null; then
        kubectl taint node "$node" node-role.kubernetes.io/control-plane:NoSchedule- \
          >/dev/null 2>&1 || true
        kubectl taint node "$node" node-role.kubernetes.io/master:NoSchedule- \
          >/dev/null 2>&1 || true
        changed=true
      fi
      if kubectl get node "$node" -o json | jq -e '.spec.unschedulable == true' >/dev/null; then
        kubectl uncordon "$node"
        changed=true
      fi
      kubectl get node "$node" -o json | jq -e '
        (.spec.unschedulable != true) and
        ([.spec.taints[]? |
          select(
            (.key == "node-role.kubernetes.io/control-plane"
              or .key == "node-role.kubernetes.io/master")
            and .effect == "NoSchedule"
          )] | length == 0)
      ' >/dev/null || {
        echo "schedulable control-plane contract was not established for $node" >&2
        exit 1
      }
    done
    echo "changed=$changed"
  args:
    executable: /bin/bash
  register: schedulable_control_plane
  changed_when: "'changed=true' in schedulable_control_plane.stdout"
  when: cp_schedulable | default(false) | bool

- name: Fix CoreDNS forward to use upstream DNS instead of resolv.conf loop
  ansible.builtin.shell: |
    kubectl -n kube-system get cm coredns -o json | \
      python3 -c "import sys,json; d=json.load(sys.stdin); d['data']['Corefile']=d['data']['Corefile'].replace('127.0.0.53','1.1.1.1 8.8.8.8').replace('/etc/resolv.conf','1.1.1.1 8.8.8.8'); json.dump(d,sys.stdout)" | \
      kubectl apply -f -
    kubectl -n kube-system get cm nodelocaldns -o json | \
      python3 -c "import sys,json; d=json.load(sys.stdin); d['data']['Corefile']=d['data']['Corefile'].replace('/etc/resolv.conf','1.1.1.1 8.8.8.8'); json.dump(d,sys.stdout)" | \
      kubectl apply -f - 2>/dev/null || true
    kubectl -n kube-system rollout restart deployment coredns
    kubectl -n kube-system delete pods -l k8s-app=node-local-dns 2>/dev/null || true
  args:
    executable: /bin/bash
  delegate_to: localhost
  become: false
  changed_when: true

- name: Reconcile NodeLocal DNS complete resource bounds
  kubernetes.core.k8s:
    state: patched
    definition:
      apiVersion: apps/v1
      kind: DaemonSet
      metadata:
        name: nodelocaldns
        namespace: kube-system
      spec:
        template:
          spec:
            containers:
              - name: node-cache
                resources:
                  requests:
                    cpu: "{{ '50m' if resource_tier in ['minimal', 'small'] else '100m' }}"
                    memory: "{{ '40Mi' if resource_tier in ['minimal', 'small'] else '70Mi' }}"
                  limits:
                    cpu: "{{ '250m' if resource_tier in ['minimal', 'small'] else '500m' }}"
                    memory: "{{ '128Mi' if resource_tier in ['minimal', 'small'] else '200Mi' }}"
  register: _r_bound_nodelocaldns
  retries: 3
  delay: 10
  until: _r_bound_nodelocaldns is not failed

# ============================================

- name: Create hcloud-token secret for CCM
  no_log: true
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: hcloud
        namespace: kube-system
      stringData:
        token: "{{ hcloud_token | default(lookup('env', 'HCLOUD_TOKEN')) }}"
        network: "{{ project }}-network"
  register: _r_create_hcloud_token_secret_for_ccm
  retries: 3
  delay: 10
  until: _r_create_hcloud_token_secret_for_ccm is not failed

- name: Resolve Hetzner server identities for Kubernetes nodes
  ansible.builtin.command:
    argv:
      - hcloud
      - server
      - describe
      - '{{ item }}'
      - -o
      - json
  environment:
    HCLOUD_TOKEN: "{{ hcloud_token | default(lookup('env', 'HCLOUD_TOKEN')) }}"
  loop: '{{ (master_ips.keys() | list) + (worker_ips.keys() | list) }}'
  register: hcloud_node_identities
  changed_when: false
  no_log: true

- name: Reconcile Kubernetes node provider IDs with Hetzner server IDs
  kubernetes.core.k8s:
    state: patched
    definition:
      apiVersion: v1
      kind: Node
      metadata:
        name: '{{ item.item }}'
      spec:
        providerID: 'hcloud://{{ (item.stdout | from_json).id }}'
  loop: '{{ hcloud_node_identities.results }}'
  register: hcloud_node_provider_ids
  retries: 3
  delay: 10
  until: hcloud_node_provider_ids is not failed
  no_log: true

- name: Download verified Hetzner Cloud Controller Manager manifest
  ansible.builtin.get_url:
    url: "https://github.com/hetznercloud/hcloud-cloud-controller-manager/releases/download/{{ hetzner_ccm_ver }}/ccm-networks.yaml"
    dest: "{{ cluster_manifest_dir }}/hcloud-ccm-networks.yaml"
    checksum: "sha256:{{ hetzner_ccm_manifest_sha256 }}"
    mode: '0600'

- name: Install Hetzner Cloud Controller Manager
  kubernetes.core.k8s:
    state: present
    src: "{{ cluster_manifest_dir }}/hcloud-ccm-networks.yaml"
  register: _r_install_hetzner_cloud_controller_manager
  retries: 3
  delay: 10
  until: _r_install_hetzner_cloud_controller_manager is not failed

- name: Read the CCM environment before enforcing controller ownership
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    namespace: kube-system
    name: hcloud-cloud-controller-manager
  register: ccm_before_controller_policy

- name: Remove stale or duplicate CCM controller-ownership switches
  ansible.builtin.set_fact:
    ccm_controller_policy_env: >-
      {{
        ccm_before_controller_policy.resources[0].spec.template.spec.containers[0].env
        | default([])
        | rejectattr('name', 'equalto', 'HCLOUD_LOAD_BALANCERS_ENABLED')
        | rejectattr('name', 'equalto', 'HCLOUD_NETWORK_ROUTES_ENABLED')
        | list
        + [
            {'name': 'HCLOUD_LOAD_BALANCERS_ENABLED', 'value': 'false'},
            {'name': 'HCLOUD_NETWORK_ROUTES_ENABLED', 'value': 'false'}
          ]
      }}

- name: Enforce the bounded CCM controller policy and rollout deadline
  kubernetes.core.k8s_json_patch:
    kind: Deployment
    namespace: kube-system
    name: hcloud-cloud-controller-manager
    patch:
      - op: replace
        path: /spec/progressDeadlineSeconds
        value: 1800
      # MetalLB owns Gateway API service addresses and Hetzner LBs are created
      # by the infrastructure role. CCM should only reconcile cloud node data.
      - op: replace
        path: /spec/template/spec/containers/0/env
        value: "{{ ccm_controller_policy_env }}"
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: "{{ '25m' if resource_tier in ['minimal', 'small'] else '50m' }}"
            memory: "{{ '32Mi' if resource_tier in ['minimal', 'small'] else '64Mi' }}"
          limits:
            cpu: "{{ '250m' if resource_tier in ['minimal', 'small'] else '500m' }}"
            memory: "{{ '128Mi' if resource_tier in ['minimal', 'small'] else '256Mi' }}"
  register: _r_patch_ccm_progress_deadline
  retries: 3
  delay: 10
  until: _r_patch_ccm_progress_deadline is not failed

- name: Wait for initial CCM deployment to be ready before patching
  kubernetes.core.k8s_info:
    kind: Deployment
    namespace: kube-system
    name: hcloud-cloud-controller-manager
  register: ccm_pre_patch
  until: >
    (ccm_pre_patch.resources | default([])) | length > 0
    and (ccm_pre_patch.resources[0].status.readyReplicas | default(0)) >= 1
  retries: 120
  delay: 15
  failed_when: false

- name: Patch CCM DNS to use upstream DNS (hostNetwork pods can't use nodelocaldns IPv6)
  kubernetes.core.k8s_json_patch:
    kind: Deployment
    namespace: kube-system
    name: hcloud-cloud-controller-manager
    patch:
      - op: replace
        path: /spec/template/spec/dnsPolicy
        value: "None"
      - op: add
        path: /spec/template/spec/dnsConfig
        value:
          nameservers:
            - "185.12.64.1"
            - "185.12.64.2"
          searches:
            - "kube-system.svc.cluster.local"
            - "svc.cluster.local"
            - "cluster.local"
  register: _r_patch_ccm_dns_to_use_upstream_dns_hostne
  retries: 3
  delay: 10
  until: _r_patch_ccm_dns_to_use_upstream_dns_hostne is not failed

- name: Wait for Hetzner CCM to be ready
  kubernetes.core.k8s_info:
    kind: Deployment
    namespace: kube-system
    name: hcloud-cloud-controller-manager
  register: ccm_deploy
  until: >
    (ccm_deploy.resources | default([])) | length > 0
    and (ccm_deploy.resources[0].status.readyReplicas | default(0)) >= 1
  retries: 60
  delay: 15

- name: Verify every Kubernetes node has a Hetzner provider ID
  ansible.builtin.shell: |
    set -euo pipefail
    kubectl get nodes -o json | python3 -c '
    import json, sys
    nodes = json.load(sys.stdin)["items"]
    invalid = [n["metadata"]["name"] for n in nodes if not n["spec"].get("providerID", "").startswith("hcloud://")]
    if invalid:
        raise SystemExit("nodes without Hetzner provider IDs: " + ", ".join(invalid))
    '
  args:
    executable: /bin/bash
  changed_when: false
  register: provider_id_result
  retries: 60
  delay: 5
  until: provider_id_result.rc == 0

- name: Verify CCM removed the external cloud-provider taint from every node
  ansible.builtin.shell: |
    set -euo pipefail
    kubectl get nodes -o json | python3 -c '
    import json, sys
    nodes = json.load(sys.stdin)["items"]
    key = "node.cloudprovider.kubernetes.io/uninitialized"
    invalid = [
        n["metadata"]["name"]
        for n in nodes
        if any(t.get("key") == key for t in n["spec"].get("taints", []))
    ]
    if invalid:
        raise SystemExit("nodes retaining external cloud-provider taint: " + ", ".join(invalid))
    '
  args:
    executable: /bin/bash
  changed_when: false
  register: cloud_provider_taint_result
  retries: 60
  delay: 5
  until: cloud_provider_taint_result.rc == 0

- name: Verify DNS resolution after CCM removes cloud-provider taints
  ansible.builtin.shell: |
    set -euo pipefail
    name=dns-test-{{ ansible_facts.date_time.epoch }}
    kubectl delete pod "$name" --ignore-not-found --wait=false >/dev/null 2>&1 || true
    trap 'kubectl delete pod "$name" --ignore-not-found --wait=false >/dev/null 2>&1 || true' EXIT
    kubectl run "$name" --restart=Never --image=busybox --command -- \
      nslookup kubernetes.default.svc.cluster.local
    kubectl wait --for=jsonpath='{.status.phase}'=Succeeded "pod/$name" --timeout=2m
    kubectl logs "$name"
  args:
    executable: /bin/bash
  delegate_to: localhost
  become: false
  changed_when: false
  register: dns_result
  retries: 5
  delay: 30
  until: dns_result.rc == 0


# ============================================
# Hetzner CSI Driver (for hcloud-volumes StorageClass)
# ============================================

- name: Download verified Hetzner CSI Driver manifest
  ansible.builtin.get_url:
    url: "https://raw.githubusercontent.com/hetznercloud/csi-driver/{{ hetzner_csi_ver }}/deploy/kubernetes/hcloud-csi.yml"
    dest: "{{ cluster_manifest_dir }}/hcloud-csi.yaml"
    checksum: "sha256:{{ hetzner_csi_manifest_sha256 }}"
    mode: '0600'

- name: Install Hetzner CSI Driver
  kubernetes.core.k8s:
    state: present
    src: "{{ cluster_manifest_dir }}/hcloud-csi.yaml"
  register: _r_install_hetzner_csi_driver
  retries: 3
  delay: 10
  until: _r_install_hetzner_csi_driver is not failed

- name: Reconcile Hetzner CSI controller resource bounds
  kubernetes.core.k8s:
    state: patched
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: hcloud-csi-controller
        namespace: kube-system
      spec:
        template:
          spec:
            containers:
              - name: hcloud-csi-driver
                resources:
                  requests: {cpu: "{{ '25m' if resource_tier in ['minimal', 'small'] else '50m' }}", memory: 64Mi}
                  limits: {cpu: 500m, memory: 256Mi}
              - name: csi-attacher
                resources:
                  requests: {cpu: 10m, memory: 32Mi}
                  limits: {cpu: 200m, memory: 128Mi}
              - name: csi-resizer
                resources:
                  requests: {cpu: 10m, memory: 32Mi}
                  limits: {cpu: 200m, memory: 128Mi}
              - name: csi-provisioner
                resources:
                  requests: {cpu: 20m, memory: 32Mi}
                  limits: {cpu: 250m, memory: 128Mi}
              - name: liveness-probe
                resources:
                  requests: {cpu: 5m, memory: 16Mi}
                  limits: {cpu: 100m, memory: 64Mi}
  register: _r_bound_hcloud_csi_controller
  retries: 3
  delay: 10
  until: _r_bound_hcloud_csi_controller is not failed

- name: Reconcile Hetzner CSI node resource bounds
  kubernetes.core.k8s:
    state: patched
    definition:
      apiVersion: apps/v1
      kind: DaemonSet
      metadata:
        name: hcloud-csi-node
        namespace: kube-system
      spec:
        template:
          spec:
            containers:
              - name: csi-node-driver-registrar
                resources:
                  requests: {cpu: 5m, memory: 16Mi}
                  limits: {cpu: 100m, memory: 64Mi}
              - name: liveness-probe
                resources:
                  requests: {cpu: 5m, memory: 16Mi}
                  limits: {cpu: 100m, memory: 64Mi}
              - name: hcloud-csi-driver
                resources:
                  requests: {cpu: "{{ '20m' if resource_tier in ['minimal', 'small'] else '50m' }}", memory: 64Mi}
                  limits: {cpu: 500m, memory: 256Mi}
  register: _r_bound_hcloud_csi_node
  retries: 3
  delay: 10
  until: _r_bound_hcloud_csi_node is not failed

- name: Increase CSI progressDeadlineSeconds for slow image pulls
  kubernetes.core.k8s_json_patch:
    kind: Deployment
    namespace: kube-system
    name: hcloud-csi-controller
    patch:
      - op: replace
        path: /spec/progressDeadlineSeconds
        value: 1800
  register: _r_patch_csi_progress_deadline
  retries: 3
  delay: 10
  until: _r_patch_csi_progress_deadline is not failed

- name: Wait for Hetzner CSI controller to be ready
  kubernetes.core.k8s_info:
    kind: Deployment
    namespace: kube-system
    name: hcloud-csi-controller
  register: csi_deploy
  until: >
    (csi_deploy.resources | default([])) | length > 0
    and (csi_deploy.resources[0].status.readyReplicas | default(0)) >= 1
  retries: 120
  delay: 15
  failed_when: false

- name: Wait for Hetzner CSI node DaemonSet to be ready on all nodes
  kubernetes.core.k8s_info:
    kind: DaemonSet
    namespace: kube-system
    name: hcloud-csi-node
  register: csi_node_ds
  until: >
    (csi_node_ds.resources | default([])) | length > 0
    and (csi_node_ds.resources[0].status.numberReady | default(0)) >= (csi_node_ds.resources[0].status.desiredNumberScheduled | default(1))
  retries: 120
  delay: 15
  failed_when: false

# ============================================
# Bounded node-local storage (optional)
# ============================================

- name: Configure the retained static local storage class
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: storage.k8s.io/v1
      kind: StorageClass
      metadata:
        name: "{{ local_storage_class }}"
        annotations:
          storageclass.kubernetes.io/is-default-class: 'false'
      provisioner: kubernetes.io/no-provisioner
      reclaimPolicy: Retain
      volumeBindingMode: WaitForFirstConsumer
  register: _r_configure_local_storage_class
  retries: 3
  delay: 10
  until: _r_configure_local_storage_class is not failed
  when: local_storage_enabled | bool

- name: Resolve schedulable control-plane nodes for the static local PV pool
  ansible.builtin.shell: |
    set -euo pipefail
    kubectl get nodes -o json |
      jq -r '.items[]
        | select(.metadata.labels["node-role.kubernetes.io/control-plane"] != null)
        | .metadata.name' |
      sort
  args:
    executable: /bin/bash
  register: local_storage_control_plane_nodes_result
  changed_when: false
  when: local_storage_enabled | bool

- name: Resolve worker nodes for the static local PV pool
  ansible.builtin.shell: |
    set -euo pipefail
    kubectl get nodes -o json |
      jq -r '.items[]
        | select(.metadata.labels["node-role.kubernetes.io/control-plane"] == null)
        | .metadata.name' |
      sort
  args:
    executable: /bin/bash
  register: local_storage_worker_nodes_result
  changed_when: false
  when: local_storage_enabled | bool

- name: Enforce the audited 3+3 local-storage topology
  ansible.builtin.assert:
    that:
      - cp_schedulable | bool
      - local_storage_control_plane_nodes_result.stdout_lines | length == 3
      - local_storage_worker_nodes_result.stdout_lines | length >= 3
    fail_msg: >-
      The medium-optimized local PV pool requires exactly three schedulable
      control planes and at least three workers. Only the first three workers
      receive target-generation slots; a temporary fourth worker is tolerated
      during a checkpointed scale-in migration.
  when: local_storage_enabled | bool

- name: Enforce root-disk capacity for the static local PV reservation
  ansible.builtin.shell: |
    set -euo pipefail
    nodes=$(kubectl get nodes -o json)
    jq -e '
      def capacity_kib:
        (.status.capacity["ephemeral-storage"]
          | capture("^(?<value>[0-9]+)Ki$").value
          | tonumber);
      all(
        .items[];
        if .metadata.labels["node-role.kubernetes.io/control-plane"] != null
        then capacity_kib >= (70 * 1024 * 1024)
        else capacity_kib >= (140 * 1024 * 1024)
        end
      )
    ' <<<"$nodes" >/dev/null
  args:
    executable: /bin/bash
  changed_when: false
  when: local_storage_enabled | bool

- name: Build the capacity-aware static local PV slot map
  ansible.builtin.set_fact:
    local_storage_pv_slots:
      # Each 80 GiB control-plane root disk keeps at least 40 GiB outside PVCs.
      - {node: "{{ local_storage_control_plane_nodes_result.stdout_lines[0] }}", size: 30, slot: 1}
      - {node: "{{ local_storage_control_plane_nodes_result.stdout_lines[0] }}", size: 10, slot: 1}
      - {node: "{{ local_storage_control_plane_nodes_result.stdout_lines[1] }}", size: 30, slot: 1}
      - {node: "{{ local_storage_control_plane_nodes_result.stdout_lines[1] }}", size: 10, slot: 1}
      - {node: "{{ local_storage_control_plane_nodes_result.stdout_lines[2] }}", size: 30, slot: 1}
      - {node: "{{ local_storage_control_plane_nodes_result.stdout_lines[2] }}", size: 10, slot: 1}
      # Three 160 GiB worker disks reserve 80 GiB each. The 20 GiB slots are
      # dormant capacity for the optional three-member MongoDB deployment.
      - {node: "{{ local_storage_worker_nodes_result.stdout_lines[0] }}", size: 40, slot: 1}
      - {node: "{{ local_storage_worker_nodes_result.stdout_lines[0] }}", size: 20, slot: 1}
      - {node: "{{ local_storage_worker_nodes_result.stdout_lines[0] }}", size: 10, slot: 1}
      - {node: "{{ local_storage_worker_nodes_result.stdout_lines[0] }}", size: 10, slot: 2}
      - {node: "{{ local_storage_worker_nodes_result.stdout_lines[1] }}", size: 40, slot: 1}
      - {node: "{{ local_storage_worker_nodes_result.stdout_lines[1] }}", size: 20, slot: 1}
      - {node: "{{ local_storage_worker_nodes_result.stdout_lines[1] }}", size: 10, slot: 1}
      - {node: "{{ local_storage_worker_nodes_result.stdout_lines[1] }}", size: 10, slot: 2}
      - {node: "{{ local_storage_worker_nodes_result.stdout_lines[2] }}", size: 40, slot: 1}
      - {node: "{{ local_storage_worker_nodes_result.stdout_lines[2] }}", size: 20, slot: 1}
      - {node: "{{ local_storage_worker_nodes_result.stdout_lines[2] }}", size: 10, slot: 1}
      - {node: "{{ local_storage_worker_nodes_result.stdout_lines[2] }}", size: 10, slot: 2}
  when: local_storage_enabled | bool

- name: Create and validate static local PV directories on every node
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: apps/v1
      kind: DaemonSet
      metadata:
        name: platform-local-storage-initializer
        namespace: kube-system
      spec:
        selector:
          matchLabels:
            app.kubernetes.io/name: platform-local-storage-initializer
        template:
          metadata:
            labels:
              app.kubernetes.io/name: platform-local-storage-initializer
          spec:
            tolerations:
              - operator: Exists
            containers:
              - name: initializer
                image: docker.io/library/busybox:1.37.0
                command:
                  - sh
                  - -ec
                  - >-
                    free_kib=$(df -Pk /storage | awk 'NR==2 {print $4}');
                    test "$free_kib" -ge {{
                    (local_storage_min_free_gib_per_node | int) * 1024 * 1024 }};
                    for slot in
                    10gi-1 10gi-2 10gi-3 10gi-4
                    20gi-1 20gi-2 30gi-1 40gi-1 40gi-2;
                    do mkdir -m 0777 -p "/storage/pv-$slot"; done;
                    touch /storage/.platform-static-local-pv-ready;
                    sleep 3600
                resources:
                  requests: {cpu: 5m, memory: 8Mi}
                  limits: {cpu: 50m, memory: 32Mi}
                volumeMounts:
                  - name: local-storage
                    mountPath: /storage
            volumes:
              - name: local-storage
                hostPath:
                  path: "{{ local_storage_path }}"
                  type: DirectoryOrCreate
  register: _r_create_local_storage_initializer
  retries: 3
  delay: 10
  until: _r_create_local_storage_initializer is not failed
  when: local_storage_enabled | bool

- name: Wait for every node to initialize the static local PV pool
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: DaemonSet
    namespace: kube-system
    name: platform-local-storage-initializer
  register: local_storage_initializer
  until: >
    (local_storage_initializer.resources | default([])) | length > 0
    and
    (local_storage_initializer.resources[0].status.numberReady | default(0))
    ==
    (local_storage_initializer.resources[0].status.desiredNumberScheduled | default(1))
  retries: 60
  delay: 5
  when: local_storage_enabled | bool

- name: Reconcile the capacity-aware static local PV pool
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: PersistentVolume
      metadata:
        name: >-
          platform-local-{{ (item.node | hash('sha1'))[0:8] }}-{{
          item.size }}gi-{{ item.slot }}
        labels:
          app.kubernetes.io/managed-by: ansible
          platform.example.com/project: "{{ project_name }}"
          platform.example.com/storage-pool: medium-optimized-local
          platform.example.com/storage-pool-generation: three-plus-three-v1
      spec:
        capacity:
          storage: "{{ item.size }}Gi"
        volumeMode: Filesystem
        accessModes: [ReadWriteOnce]
        persistentVolumeReclaimPolicy: Retain
        storageClassName: "{{ local_storage_class }}"
        local:
          path: "{{ local_storage_path }}/pv-{{ item.size }}gi-{{ item.slot }}"
        nodeAffinity:
          required:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: ["{{ item.node }}"]
  loop: "{{ local_storage_pv_slots }}"
  loop_control:
    label: "{{ item.node }}:{{ item.size }}Gi:{{ item.slot }}"
  register: _r_reconcile_static_local_pv_pool
  retries: 3
  delay: 5
  until: _r_reconcile_static_local_pv_pool is not failed
  when: local_storage_enabled | bool

- name: Verify the static local PV pool count and capacity
  ansible.builtin.shell: |
    set -euo pipefail
    pool=$(kubectl get pv -l \
      platform.example.com/project={{ project_name | quote }},platform.example.com/storage-pool=medium-optimized-local,platform.example.com/storage-pool-generation=three-plus-three-v1 \
      -o json)
    test "$(jq '.items | length' <<<"$pool")" -eq 18
    test "$(jq '[.items[].spec.capacity.storage | sub("Gi$"; "") | tonumber] | add' <<<"$pool")" -eq 360
    test "$(jq '[.items[].spec.persistentVolumeReclaimPolicy] | all(. == "Retain")' <<<"$pool")" = true
    test "$(jq '[.items[].spec.nodeAffinity.required.nodeSelectorTerms[0].matchExpressions[0].values | length] | all(. == 1)' <<<"$pool")" = true
  args:
    executable: /bin/bash
  changed_when: false
  when: local_storage_enabled | bool

- name: Remove the successful static local PV initializer
  kubernetes.core.k8s:
    state: absent
    api_version: apps/v1
    kind: DaemonSet
    namespace: kube-system
    name: platform-local-storage-initializer
    wait: true
  when: local_storage_enabled | bool

# ============================================
# Gateway API CRDs + Cilium Gateway
# ============================================

- name: Download verified Gateway API standard CRDs
  ansible.builtin.get_url:
    url: "https://github.com/kubernetes-sigs/gateway-api/releases/download/{{ gateway_api_ver }}/standard-install.yaml"
    dest: "{{ cluster_manifest_dir }}/gateway-api-standard.yaml"
    checksum: "sha256:{{ gateway_api_standard_sha256 }}"
    mode: '0600'

- name: Install Gateway API CRDs (standard)
  kubernetes.core.k8s:
    state: present
    src: "{{ cluster_manifest_dir }}/gateway-api-standard.yaml"
  register: _r_install_gateway_api_crds_standard
  retries: 3
  delay: 10
  until: _r_install_gateway_api_crds_standard is not failed

- name: Remove Gateway API safe-upgrades policy to allow experimental CRDs
  kubernetes.core.k8s:
    state: absent
    api_version: admissionregistration.k8s.io/v1
    kind: "{{ item.kind }}"
    name: safe-upgrades.gateway.networking.k8s.io
  loop:
    - { kind: ValidatingAdmissionPolicyBinding }
    - { kind: ValidatingAdmissionPolicy }
  register: _r_remove_gateway_api_safe_upgrades_policy_
  retries: 3
  delay: 10
  until: _r_remove_gateway_api_safe_upgrades_policy_ is not failed

- name: Download verified Gateway API experimental CRDs
  ansible.builtin.get_url:
    url: "https://github.com/kubernetes-sigs/gateway-api/releases/download/{{ gateway_api_ver }}/experimental-install.yaml"
    dest: "{{ cluster_manifest_dir }}/gateway-api-experimental.yaml"
    checksum: "sha256:{{ gateway_api_experimental_sha256 }}"
    mode: '0600'

- name: Install Gateway API CRDs (experimental - TCPRoute, TLSRoute, GRPCRoute)
  kubernetes.core.k8s:
    state: present
    src: "{{ cluster_manifest_dir }}/gateway-api-experimental.yaml"
  register: _r_install_gateway_api_crds_experimental_tc
  retries: 3
  delay: 10
  until: _r_install_gateway_api_crds_experimental_tc is not failed

- name: Create Cilium GatewayClass
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: gateway.networking.k8s.io/v1
      kind: GatewayClass
      metadata:
        name: cilium
        labels:
          app.kubernetes.io/managed-by: Helm
        annotations:
          meta.helm.sh/release-name: cilium
          meta.helm.sh/release-namespace: kube-system
      spec:
        controllerName: io.cilium/gateway-controller
  register: _r_create_cilium_gatewayclass
  retries: 3
  delay: 10
  until: _r_create_cilium_gatewayclass is not failed

- name: Restart Cilium operator to pick up Gateway API CRDs
  kubernetes.core.k8s:
    state: present
    kind: Deployment
    namespace: kube-system
    name: cilium-operator
    definition:
      spec:
        template:
          metadata:
            annotations:
              kubectl.kubernetes.io/restartedAt: "{{ ansible_facts.date_time.iso8601 }}"
  register: _r_restart_cilium_operator_to_pick_up_gatew
  retries: 3
  delay: 10
  until: _r_restart_cilium_operator_to_pick_up_gatew is not failed

- name: Create cilium-system namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: cilium-system
        labels:
          pod-security.kubernetes.io/enforce: privileged
          pod-security.kubernetes.io/warn: privileged
  register: _r_create_cilium_system_namespace
  retries: 3
  delay: 10
  until: _r_create_cilium_system_namespace is not failed

- name: Create cilium-secrets namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: cilium-secrets
        labels:
          pod-security.kubernetes.io/enforce: baseline
          pod-security.kubernetes.io/warn: restricted
  register: _r_create_cilium_secrets_namespace
  retries: 3
  delay: 10
  until: _r_create_cilium_secrets_namespace is not failed

- name: Create Gateway source secrets namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: gateway-secrets
        labels:
          pod-security.kubernetes.io/enforce: baseline
          pod-security.kubernetes.io/warn: restricted
  register: _r_create_gateway_source_secrets_namespace
  retries: 3
  delay: 10
  until: _r_create_gateway_source_secrets_namespace is not failed

- name: Check for the dedicated Gateway source secret
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    namespace: gateway-secrets
    name: wildcard-tls
  register: gateway_source_secret_before_migration
  no_log: true

- name: Check for the legacy in-place Cilium Gateway source secret
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    namespace: cilium-secrets
    name: wildcard-tls
  register: legacy_gateway_source_secret
  no_log: true

- name: Preserve the existing wildcard certificate while separating Cilium source and sync namespaces
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: wildcard-tls
        namespace: gateway-secrets
      type: kubernetes.io/tls
      data: "{{ legacy_gateway_source_secret.resources[0].data }}"
  when:
    - gateway_source_secret_before_migration.resources | default([]) | length == 0
    - legacy_gateway_source_secret.resources | default([]) | length == 1
  no_log: true

- name: Create ReferenceGrant for Gateway to access TLS secrets
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: gateway.networking.k8s.io/v1beta1
      kind: ReferenceGrant
      metadata:
        name: allow-gateway-tls
        namespace: gateway-secrets
      spec:
        from:
          - group: gateway.networking.k8s.io
            kind: Gateway
            namespace: cilium-system
        to:
          - group: ""
            kind: Secret
  when: k8s_create_external_tls | default(true) | bool
  register: _r_create_referencegrant_for_gateway_to_acc
  retries: 3
  delay: 10
  until: _r_create_referencegrant_for_gateway_to_acc is not failed
  no_log: true

- name: Create Cilium main Gateway
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: gateway.networking.k8s.io/v1
      kind: Gateway
      metadata:
        name: main-gateway
        namespace: cilium-system
      spec:
        gatewayClassName: cilium
        listeners:
          - name: http
            protocol: HTTP
            port: 80
            allowedRoutes:
              namespaces:
                from: All
          - name: https
            protocol: HTTPS
            port: 443
            tls:
              mode: Terminate
              certificateRefs:
                - name: wildcard-tls
                  namespace: gateway-secrets
            allowedRoutes:
              namespaces:
                from: All
  when: k8s_create_external_tls | default(true) | bool
  register: _r_create_cilium_main_gateway
  retries: 3
  delay: 10
  until: _r_create_cilium_main_gateway is not failed

- name: Wait for Cilium to create Gateway service
  kubernetes.core.k8s_info:
    kind: Service
    namespace: cilium-system
    label_selectors:
      - "io.cilium.gateway/owning-gateway=main-gateway"
  when: k8s_create_external_tls | default(true) | bool
  register: gw_svc
  until: (gw_svc.resources | default([])) | length > 0
  retries: 30
  delay: 10
  failed_when: false

- name: Record the controller-owned main Gateway NodePorts
  ansible.builtin.set_fact:
    gateway_http_node_port: >-
      {{ (gw_svc.resources[0].spec.ports
          | selectattr('port', 'equalto', 80)
          | map(attribute='nodePort') | first) | int }}
    gateway_https_node_port: >-
      {{ (gw_svc.resources[0].spec.ports
          | selectattr('port', 'equalto', 443)
          | map(attribute='nodePort') | first) | int }}
  when:
    - gw_svc.resources | default([]) | length > 0
    - k8s_create_external_tls | default(true) | bool

- name: Allow the Cilium operator reconciliation loop to settle
  ansible.builtin.pause:
    seconds: 10
  when: k8s_create_external_tls | default(true) | bool

- name: Re-read the controller-owned main Gateway service
  kubernetes.core.k8s_info:
    kind: Service
    namespace: cilium-system
    name: "{{ gw_svc.resources[0].metadata.name }}"
  register: stable_gw_svc
  when:
    - gw_svc.resources | default([]) | length > 0
    - k8s_create_external_tls | default(true) | bool

- name: Require stable valid main Gateway NodePorts
  ansible.builtin.assert:
    that:
      - stable_gw_svc.resources | default([]) | length == 1
      - gateway_http_node_port >= 30000
      - gateway_http_node_port <= 32767
      - gateway_https_node_port >= 30000
      - gateway_https_node_port <= 32767
      - >-
        gateway_http_node_port ==
        ((stable_gw_svc.resources[0].spec.ports
          | selectattr('port', 'equalto', 80)
          | map(attribute='nodePort') | first) | int)
      - >-
        gateway_https_node_port ==
        ((stable_gw_svc.resources[0].spec.ports
          | selectattr('port', 'equalto', 443)
          | map(attribute='nodePort') | first) | int)
    fail_msg: >-
      Cilium changed the main Gateway NodePorts during reconciliation; refusing
      to publish stale ports to the external load balancer.
  when: k8s_create_external_tls | default(true) | bool

- name: Read the Hetzner load balancer before Gateway convergence
  ansible.builtin.command:
    argv: [hcloud, load-balancer, describe, '{{ project }}-lb', -o, json]
  register: gateway_lb_config
  changed_when: false
  retries: 5
  delay: 5
  until: gateway_lb_config.rc == 0
  when:
    - lb_enabled | default(false) | bool
    - k8s_create_external_tls | default(true) | bool

- name: Index the current Hetzner Gateway services
  ansible.builtin.set_fact:
    gateway_lb_http_service: >-
      {{ ((gateway_lb_config.stdout | from_json).services
          | selectattr('listen_port', 'equalto', 80) | list | first)
          | default({}) }}
    gateway_lb_https_service: >-
      {{ ((gateway_lb_config.stdout | from_json).services
          | selectattr('listen_port', 'equalto', 443) | list | first)
          | default({}) }}
  when:
    - lb_enabled | default(false) | bool
    - k8s_create_external_tls | default(true) | bool

- name: Require the infrastructure role to create both Gateway LB services
  ansible.builtin.assert:
    that:
      - gateway_lb_http_service | length > 0
      - gateway_lb_https_service | length > 0
    fail_msg: >-
      The Hetzner load balancer is missing its HTTP or HTTPS service; refusing
      to continue with an incomplete public ingress path.
  when:
    - lb_enabled | default(false) | bool
    - k8s_create_external_tls | default(true) | bool

- name: Converge Hetzner HTTP service to the live Cilium NodePort
  ansible.builtin.command:
    argv:
      - hcloud
      - load-balancer
      - update-service
      - '{{ project }}-lb'
      - --listen-port
      - '80'
      - --protocol
      - tcp
      - --destination-port
      - '{{ gateway_http_node_port | string }}'
      - --health-check-protocol
      - tcp
      - --health-check-port
      - '{{ gateway_http_node_port | string }}'
  register: gateway_lb_http_update
  retries: 5
  delay: 5
  until: gateway_lb_http_update.rc == 0
  when:
    - lb_enabled | default(false) | bool
    - k8s_create_external_tls | default(true) | bool
    - >-
      gateway_lb_http_service.destination_port != gateway_http_node_port
      or gateway_lb_http_service.health_check.protocol != 'tcp'
      or gateway_lb_http_service.health_check.port != gateway_http_node_port

- name: Converge Hetzner HTTPS service to the live Cilium NodePort
  ansible.builtin.command:
    argv:
      - hcloud
      - load-balancer
      - update-service
      - '{{ project }}-lb'
      - --listen-port
      - '443'
      - --protocol
      - tcp
      - --destination-port
      - '{{ gateway_https_node_port | string }}'
      - --health-check-protocol
      - tcp
      - --health-check-port
      - '{{ gateway_https_node_port | string }}'
  register: gateway_lb_https_update
  retries: 5
  delay: 5
  until: gateway_lb_https_update.rc == 0
  when:
    - lb_enabled | default(false) | bool
    - k8s_create_external_tls | default(true) | bool
    - >-
      gateway_lb_https_service.destination_port != gateway_https_node_port
      or gateway_lb_https_service.health_check.protocol != 'tcp'
      or gateway_lb_https_service.health_check.port != gateway_https_node_port

- name: Require Hetzner Gateway service port readback to match Cilium
  ansible.builtin.shell: |
    set -euo pipefail
    hcloud load-balancer describe {{ (project ~ '-lb') | quote }} -o json |
      jq -e \
        --argjson http {{ gateway_http_node_port | quote }} \
        --argjson https {{ gateway_https_node_port | quote }} '
          ([.services[] | select(.listen_port == 80)][0]) as $http_service
          | ([.services[] | select(.listen_port == 443)][0]) as $https_service
          | $http_service.destination_port == $http
          and $http_service.health_check.protocol == "tcp"
          and $http_service.health_check.port == $http
          and $https_service.destination_port == $https
          and $https_service.health_check.protocol == "tcp"
          and $https_service.health_check.port == $https
        '
  args:
    executable: /bin/bash
  register: gateway_lb_port_readback
  changed_when: false
  retries: 12
  delay: 5
  until: gateway_lb_port_readback.rc == 0
  when:
    - lb_enabled | default(false) | bool
    - k8s_create_external_tls | default(true) | bool

- name: Wait for every Hetzner Gateway target to become healthy
  ansible.builtin.shell: |
    set -euo pipefail
    hcloud load-balancer describe {{ (project ~ '-lb') | quote }} -o json |
      jq -e --argjson expected {{ ((worker_count | int) * 2) | quote }} '
        [ .targets[].health_status[]
          | select(.listen_port == 80 or .listen_port == 443) ] as $checks
        | ($checks | length) == $expected
        and all($checks[]; .status == "healthy")
      '
  args:
    executable: /bin/bash
  register: gateway_lb_health
  changed_when: false
  retries: 40
  delay: 5
  until: gateway_lb_health.rc == 0
  when:
    - lb_enabled | default(false) | bool
    - k8s_create_external_tls | default(true) | bool

- name: Converge the minimal-tier bastion edge to live Gateway NodePorts
  ansible.builtin.shell: |
    ssh -o StrictHostKeyChecking=accept-new \
      -o UserKnownHostsFile={{ controller_known_hosts_file | quote }} \
      root@{{ bastion_public_ip }} 'bash -s' <<'REMOTECMD'
    set -euo pipefail
    cat > /etc/haproxy/haproxy.cfg <<'HAPROXY'
    # managed-by-ansible-k8s-minimal-edge
    global
      log /dev/log local0
      maxconn 4096

    defaults
      log global
      mode tcp
      option tcplog
      timeout connect 5s
      timeout client 60s
      timeout server 60s

    frontend public-http
      bind :80
      mode http
      option httplog
      acl is-headscale hdr(host) -i vpn.{{ domain }}
      use_backend headscale-http if is-headscale
      default_backend kubernetes-http

    frontend public-https
      bind :443
      mode tcp
      tcp-request inspect-delay 5s
      tcp-request content accept if { req.ssl_hello_type 1 }
      acl is-headscale req.ssl_sni -i vpn.{{ domain }}
      use_backend headscale-https if is-headscale
      default_backend kubernetes-https

    backend headscale-http
      mode http
      server caddy 127.0.0.1:8080 check

    backend headscale-https
      mode tcp
      server caddy 127.0.0.1:8443 check

    backend kubernetes-http
      mode http
      server gateway {{ first_master_ip }}:{{ gateway_http_node_port }} check

    backend kubernetes-https
      mode tcp
      server gateway {{ first_master_ip }}:{{ gateway_https_node_port }} check
    HAPROXY
    haproxy -c -f /etc/haproxy/haproxy.cfg
    systemctl enable haproxy
    systemctl reload-or-restart haproxy
    REMOTECMD
  register: minimal_edge_convergence
  retries: 3
  delay: 10
  until: minimal_edge_convergence.rc == 0
  when:
    - not (lb_enabled | default(false) | bool)
    - k8s_create_external_tls | default(true) | bool

- name: Require minimal-tier HTTP ingress through the bastion edge
  ansible.builtin.command:
    argv:
      - curl
      - --silent
      - --show-error
      - --output
      - /dev/null
      - --connect-timeout
      - '10'
      - --resolve
      - '{{ domain }}:80:{{ bastion_public_ip }}'
      - http://{{ domain }}/
  register: minimal_edge_http
  changed_when: false
  retries: 12
  delay: 5
  until: minimal_edge_http.rc == 0
  when:
    - not (lb_enabled | default(false) | bool)
    - k8s_create_external_tls | default(true) | bool

- name: Create admin Gateway (VPN-only for GitLab, ArgoCD, Grafana, Vault)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: gateway.networking.k8s.io/v1
      kind: Gateway
      metadata:
        name: admin-gateway
        namespace: cilium-system
      spec:
        gatewayClassName: cilium
        listeners:
          - name: http
            protocol: HTTP
            port: 8080
            allowedRoutes:
              namespaces:
                from: All
          - name: https
            protocol: HTTPS
            port: 8443
            tls:
              mode: Terminate
              certificateRefs:
                - name: wildcard-tls
                  namespace: gateway-secrets
            allowedRoutes:
              namespaces:
                from: All
  when: k8s_create_external_tls | default(true) | bool
  register: _r_create_admin_gateway_vpn_only_for_gitlab
  retries: 3
  delay: 10
  until: _r_create_admin_gateway_vpn_only_for_gitlab is not failed

- name: Wait for admin Gateway service
  kubernetes.core.k8s_info:
    kind: Service
    namespace: cilium-system
    label_selectors:
      - "io.cilium.gateway/owning-gateway=admin-gateway"
  when: k8s_create_external_tls | default(true) | bool
  register: admin_gw_svc
  until: (admin_gw_svc.resources | default([])) | length > 0
  retries: 30
  delay: 10

- name: Record the controller-owned admin Gateway NodePort
  ansible.builtin.set_fact:
    admin_gateway_node_port: >-
      {{ (admin_gw_svc.resources[0].spec.ports
          | selectattr('port', 'equalto', 8443)
          | map(attribute='nodePort') | first) | int }}
  when:
    - admin_gw_svc.resources | default([]) | length > 0
    - k8s_create_external_tls | default(true) | bool

- name: Require a valid admin Gateway NodePort
  ansible.builtin.assert:
    that:
      - admin_gateway_node_port >= 30000
      - admin_gateway_node_port <= 32767
    fail_msg: Cilium did not allocate a valid admin Gateway NodePort.
  when: k8s_create_external_tls | default(true) | bool

- name: Create NetworkPolicy to restrict admin-gateway to VPN and private network
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: admin-gateway-vpn-only
        namespace: cilium-system
      spec:
        endpointSelector:
          matchLabels:
            io.cilium.gateway/owning-gateway: admin-gateway
        ingress:
          - fromCIDR:
              - 10.0.0.0/16
              - 100.64.0.0/10
  register: _r_create_networkpolicy_to_restrict_admin_g
  retries: 3
  delay: 10
  until: _r_create_networkpolicy_to_restrict_admin_g is not failed

# ============================================
# cert-manager v1.21.0
# ============================================
# These small requests bound configurable application add-ons without applying
# generic limits to Cilium, MetalLB, Hetzner CSI, kube-system static pods, or
# control-plane components. Those systems require component-specific capacity
# and latency evidence before resource limits are safe.

- name: Add Jetstack Helm repository
  kubernetes.core.helm_repository:
    name: jetstack
    repo_url: "https://charts.jetstack.io"
  register: _r_add_jetstack_helm_repository
  retries: 3
  delay: 10
  until: _r_add_jetstack_helm_repository is not failed

- name: Install cert-manager
  kubernetes.core.helm:
    name: cert-manager
    chart_ref: jetstack/cert-manager
    chart_version: "{{ certmanager_ver }}"
    release_namespace: cert-manager
    create_namespace: true
    release_state: present
    wait: true
    values:
      crds:
        enabled: true
      global:
        podSecurityPolicy:
          enabled: false
      securityContext:
        runAsNonRoot: true
      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 256Mi
      webhook:
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 128Mi
      cainjector:
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
      startupapicheck:
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 128Mi
    set_values:
      - value: "replicaCount={{ certmanager_replicas }}"
      - value: "webhook.replicaCount={{ certmanager_replicas }}"
      - value: "cainjector.replicaCount={{ certmanager_replicas }}"
  register: _r_install_cert_manager
