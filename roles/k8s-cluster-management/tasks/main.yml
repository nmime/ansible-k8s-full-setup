# MetalLB v0.16.1
# ============================================

- name: Add MetalLB Helm repository
  kubernetes.core.helm_repository:
    name: metallb
    repo_url: "https://metallb.github.io/metallb"
  register: _r_add_metallb_helm_repository
  retries: 3
  delay: 10
  until: _r_add_metallb_helm_repository is not failed

- name: Install MetalLB
  kubernetes.core.helm:
    name: metallb
    chart_ref: metallb/metallb
    chart_version: "{{ metallb_ver }}"
    release_namespace: metallb-system
    create_namespace: true
    release_state: present
    wait: true
    values:
      controller:
        resources:
          requests:
            cpu: "{{ '20m' if resource_tier in ['minimal', 'small'] else '50m' }}"
            memory: 64Mi
          limits: {cpu: 250m, memory: 256Mi}
      speaker:
        resources:
          requests:
            cpu: "{{ '20m' if resource_tier in ['minimal', 'small'] else '50m' }}"
            memory: 64Mi
          limits: {cpu: 250m, memory: 256Mi}
      frr-k8s:
        frrk8s:
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {cpu: 250m, memory: 256Mi}
          frr:
            resources:
              requests: {cpu: 25m, memory: 64Mi}
              limits: {cpu: 300m, memory: 256Mi}
          reloader:
            resources:
              requests: {cpu: 5m, memory: 16Mi}
              limits: {cpu: 100m, memory: 64Mi}
          frrMetrics:
            resources:
              requests: {cpu: 5m, memory: 16Mi}
              limits: {cpu: 100m, memory: 64Mi}
          frrStatus:
            resources:
              requests: {cpu: 5m, memory: 16Mi}
              limits: {cpu: 100m, memory: 64Mi}
  register: _r_install_metallb
  retries: 3
  delay: 10
  until: _r_install_metallb is not failed

- name: Reconcile MetalLB FRR-K8s init-container resource bounds
  kubernetes.core.k8s:
    state: patched
    definition:
      apiVersion: apps/v1
      kind: DaemonSet
      metadata:
        name: metallb-frr-k8s
        namespace: metallb-system
      spec:
        template:
          spec:
            initContainers:
              - name: "{{ item }}"
                resources:
                  requests: {cpu: 5m, memory: 8Mi}
                  limits: {cpu: 100m, memory: 64Mi}
  loop:
    - cp-frr-files
    - cp-reloader
    - cp-metrics
    - cp-frr-status
  register: _r_bound_metallb_frr_init
  retries: 3
  delay: 10
  until: _r_bound_metallb_frr_init is not failed

- name: Configure MetalLB IPAddressPool
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: metallb.io/v1beta1
      kind: IPAddressPool
      metadata:
        name: default-pool
        namespace: metallb-system
      spec:
        addresses:
          - "10.0.10.1-10.0.10.254"
  register: _r_configure_metallb_ipaddresspool
  retries: 3
  delay: 10
  until: _r_configure_metallb_ipaddresspool is not failed

- name: Configure MetalLB L2Advertisement
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: metallb.io/v1beta1
      kind: L2Advertisement
      metadata:
        name: default
        namespace: metallb-system
      spec:
        ipAddressPools:
          - default-pool
  register: _r_configure_metallb_l2advertisement
  retries: 3
  delay: 10
  until: _r_configure_metallb_l2advertisement is not failed

