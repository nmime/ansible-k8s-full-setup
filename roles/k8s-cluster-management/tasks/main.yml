---
# K8s Cluster Management - Kubespray v2.30.0 + Cilium v1.19.2 + Gateway API v1.5.1
# Installs Kubernetes cluster with core addons
# Components: K8s v1.34.3, Hetzner CCM v1.30.1, Hetzner CSI v2.20.0, cert-manager v1.20.1, MetalLB v0.15.3

- name: Set cluster management variables
  set_fact:
    project: "{{ project_name | default('k8s') }}"
    k8s_ver: "{{ k8s_version | default('v1.34.3') }}"
    kubespray_version: "v2.30.0"
    cilium_ver: "{{ cilium_version | default('v1.19.2') }}"
    gateway_api_ver: "{{ gateway_api_version | default('v1.5.1') }}"
    certmanager_ver: "v1.20.1"
    metallb_ver: "v0.15.3"
    hetzner_ccm_ver: "v1.30.1"
    hetzner_csi_ver: "v2.20.0"
    cluster_tier: "{{ tier | default('medium') }}"
    certmanager_replicas: "{{ (tier | default('medium')=='minimal')|ternary(1, (tier | default('medium')=='production')|ternary(3, 2)) }}"

# ============================================
# Kubespray Setup
# ============================================

- name: Check for Kubespray installation
  stat:
    path: "{{ playbook_dir }}/kubespray"
  register: kubespray_dir
  delegate_to: localhost
  become: false

- name: Clone Kubespray
  git:
    repo: https://github.com/kubernetes-sigs/kubespray.git
    dest: "{{ playbook_dir }}/kubespray"
    version: "{{ kubespray_version }}"
    depth: 1
  when: not kubespray_dir.stat.exists
  delegate_to: localhost
  become: false

- name: Create isolated venv for Kubespray
  ansible.builtin.command:
    cmd: python3 -m venv "{{ playbook_dir }}/kubespray/.venv"
    creates: "{{ playbook_dir }}/kubespray/.venv/bin/python"
  delegate_to: localhost
  become: false

- name: Install Kubespray Python requirements in isolated venv
  ansible.builtin.command:
    cmd: "{{ playbook_dir }}/kubespray/.venv/bin/pip install -r {{ playbook_dir }}/kubespray/requirements.txt"
  delegate_to: localhost
  become: false
  register: kubespray_pip
  changed_when: "'Successfully installed' in kubespray_pip.stdout"

- name: Create Kubespray inventory directory
  file:
    path: "{{ playbook_dir }}/kubespray/inventory/{{ project }}/group_vars/all"
    state: directory
    mode: '0755'
  delegate_to: localhost
  become: false

- name: Generate Kubespray inventory
  copy:
    dest: "{{ playbook_dir }}/kubespray/inventory/{{ project }}/hosts.yml"
    content: |
      all:
        hosts:
      {% for i in range(1, (cp_count | default(1) | int) + 1) %}
      {% set host = project + '-master-' + (i | string) %}
      {% set ip = master_ips[host] | default('10.0.1.' + (i | string)) %}
          {{ host }}:
            ansible_host: {{ ip }}
            ip: {{ ip }}
            access_ip: {{ ip }}
      {% endfor %}
      {% for i in range(1, (worker_count | default(2) | int) + 1) %}
      {% set host = project + '-worker-' + (i | string) %}
      {% set ip = worker_ips[host] | default('10.0.2.' + (i | string)) %}
          {{ host }}:
            ansible_host: {{ ip }}
            ip: {{ ip }}
            access_ip: {{ ip }}
      {% endfor %}
        children:
          kube_control_plane:
            hosts:
      {% for i in range(1, (cp_count | default(1) | int) + 1) %}
              {{ project }}-master-{{ i }}: {}
      {% endfor %}
          kube_node:
            hosts:
      {% for i in range(1, (worker_count | default(2) | int) + 1) %}
              {{ project }}-worker-{{ i }}: {}
      {% endfor %}
      {% if cp_schedulable | default(false) | bool %}
      {% for i in range(1, (cp_count | default(1) | int) + 1) %}
              {{ project }}-master-{{ i }}: {}
      {% endfor %}
      {% endif %}
          etcd:
            hosts:
      {% for i in range(1, (cp_count | default(1) | int) + 1) %}
              {{ project }}-master-{{ i }}: {}
      {% endfor %}
          k8s_cluster:
            children:
              kube_control_plane: {}
              kube_node: {}
          bastion:
            hosts: {}
          calico_rr:
            hosts: {}
    mode: '0644'
  delegate_to: localhost
  become: false

- name: Generate Kubespray group_vars
  copy:
    dest: "{{ playbook_dir }}/kubespray/inventory/{{ project }}/group_vars/all/custom.yml"
    content: |
      ---
      # Kubernetes
      kube_version: "{{ k8s_ver | regex_replace('^v', '') }}"
      container_manager: containerd
      kube_pods_subnet: {{ k8s_pod_cidr | default('10.233.64.0/18') }}
      kube_service_addresses: {{ k8s_service_cidr | default('10.233.0.0/18') }}
      kube_proxy_mode: ipvs
      kubernetes_audit: true
      metrics_server_enabled: true
      enable_nodelocaldns: true
      kubelet_max_pods: 110
      kubelet_rotate_certificates: true
      dashboard_enabled: false
      # Security
      podsecuritypolicy_enabled: false
      kube_pod_security_use_default: true
      kube_pod_security_default_enforce: baseline
      kube_apiserver_enable_admission_plugins:
        - NodeRestriction
        - PodSecurity
      # SSH
      ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ProxyCommand="ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -W %h:%p root@{{ bastion_public_ip | default("") }}"'
      ansible_user: root
      # etcd
      etcd_deployment_type: host
      etcd_compaction_retention: "8"
      etcd_quota_backend_bytes: "8589934592"
      # Cilium CNI
      kube_network_plugin: cilium
      cilium_version: "{{ cilium_ver | regex_replace('^v', '') }}"
      cilium_enable_hubble: true
      cilium_hubble_enabled: true
      cilium_hubble_relay_enabled: true
      cilium_hubble_ui_enabled: true
      cilium_gateway_api_enabled: true
      cilium_enable_gateway_api_support: true
      cilium_enable_bpf_masquerade: true
      cilium_kube_proxy_replacement: "true"
      cilium_tunnel_mode: vxlan
      cilium_auto_direct_node_routes: false
      cilium_enable_endpoint_health_checking: true
      cilium_enable_health_checking: true
      cilium_enable_bandwidth_manager: true
      cilium_enable_ipv4_masquerade: true
      # Containerd registry mirrors - route private registry through internal service
      containerd_registries_mirrors:
        - prefix: docker.io
          mirrors:
            - host: https://registry-1.docker.io
              capabilities: ["pull", "resolve"]
              skip_verify: false
        - prefix: registry.{{ domain }}
          mirrors:
            - host: http://gitlab-registry.gitlab.svc.cluster.local:5000
              capabilities: ["pull", "resolve", "push"]
              skip_verify: true
    mode: '0644'
  delegate_to: localhost
  become: false

- name: Clean stale SSH control sockets before Kubespray
  ansible.builtin.shell: |
    rm -rf /tmp/kubespray-cp /tmp/outer-ansible-cp/root@{{ bastion_public_ip }}* 2>/dev/null
    find /tmp -maxdepth 2 -name 'root@*' -type s -delete 2>/dev/null
    find /root/.ssh -name 'ansible-*' -type s -delete 2>/dev/null
    mkdir -p /tmp/kubespray-cp /tmp/outer-ansible-cp
    true
  delegate_to: localhost
  become: false
  changed_when: false

- name: Verify SSH connectivity to k8s nodes via bastion before Kubespray
  ansible.builtin.shell: |
    ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15       -o ProxyCommand='ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -W %h:%p root@{{ bastion_public_ip }}'       root@{{ item }} 'echo CONNECTIVITY_OK'
  delegate_to: localhost
  become: false
  loop: "{{ (master_ips | default({}) | dict2items | map(attribute='value') | list) + (worker_ips | default({}) | dict2items | map(attribute='value') | list) }}"
  when: item is defined and item | length > 0
  register: ssh_verify
  retries: 3
  delay: 10
  until: ssh_verify.rc == 0
  changed_when: false

- name: Ensure Kubespray ansible.cfg has control_path_dir for auto-creation
  ansible.builtin.lineinfile:
    path: "{{ playbook_dir }}/kubespray/ansible.cfg"
    insertafter: '^\[ssh_connection\]'
    regexp: '^control_path_dir'
    line: 'control_path_dir = /tmp/kubespray-cp'
  delegate_to: localhost
  become: false

- name: Adopt GatewayClass cilium for Helm (idempotent)
  ansible.builtin.shell: |
    ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null       root@{{ bastion_public_ip }} '
        kubectl get gatewayclass cilium 2>/dev/null &&         kubectl annotate gatewayclass cilium meta.helm.sh/release-name=cilium meta.helm.sh/release-namespace=kube-system --overwrite &&         kubectl label gatewayclass cilium app.kubernetes.io/managed-by=Helm --overwrite || true
      '
  args:
    executable: /bin/bash
  delegate_to: localhost
  become: false
  ignore_errors: true

- name: Run Kubespray cluster deployment
  ansible.builtin.shell: |
    unset ANSIBLE_CONFIG ANSIBLE_SSH_ARGS ANSIBLE_SSH_COMMON_ARGS
    export ANSIBLE_CONFIG={{ playbook_dir }}/kubespray/ansible.cfg
    cd {{ playbook_dir }}/kubespray
    {{ playbook_dir }}/kubespray/.venv/bin/ansible-playbook \
      -i inventory/{{ project }}/hosts.yml \
      --become --become-user=root \
      cluster.yml
  args:
    executable: /bin/bash
  delegate_to: localhost
  become: false
  register: kubespray_result
  changed_when: true
  when: not (skip_kubespray | default(false) | bool)

# Fix CNI binary directory permissions (Kubespray creates it owned by kube user)
- name: Fix /opt/cni/bin ownership for Cilium
  ansible.builtin.shell: |
    ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
      -o ProxyCommand='ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -W %h:%p root@{{ bastion_public_ip }}' \
      root@{{ item }} 'bash -s' << 'REMOTECMD'
    chown -R root:root /opt/cni 2>/dev/null || true
    chmod 755 /opt/cni /opt/cni/bin 2>/dev/null || true
    ls -la /opt/cni/bin/ 2>/dev/null | head -5
    REMOTECMD
  args:
    executable: /bin/bash
  delegate_to: localhost
  become: false
  loop: "{{ (master_ips | default({}) | dict2items | map(attribute='value') | list) + (worker_ips | default({}) | dict2items | map(attribute='value') | list) }}"
  when: item is defined and item | length > 0
  ignore_errors: true


# ============================================
# Post-install: kubeconfig
# ============================================

- name: Copy kubeconfig from master via ProxyCommand
  ansible.builtin.shell: |
    mkdir -p {{ lookup('env', 'HOME') }}/.kube
    ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
      -o ProxyCommand='ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -W %h:%p root@{{ bastion_public_ip }}' \
      root@{{ first_master_ip | default('10.0.1.1') }} 'cat /etc/kubernetes/admin.conf' \
      > {{ lookup('env', 'HOME') }}/.kube/config
    chmod 600 {{ lookup('env', 'HOME') }}/.kube/config
  args:
    executable: /bin/bash
  delegate_to: localhost
  become: false
  when: bastion_public_ip is defined

- name: Ensure SSH tunnel to k8s API is active
  ansible.builtin.shell: |
    fuser -k 6443/tcp 2>/dev/null || true
    sleep 1
    nohup ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -N -L 6443:{{ first_master_ip | default('10.0.1.1') }}:6443 root@{{ bastion_public_ip }} > /dev/null 2>&1 &
    for attempt in $(seq 1 30); do
      if ss -tlnp | grep -q ':6443'; then
        echo "SSH tunnel ready after ${attempt}s"
        break
      fi
      sleep 1
    done
    sed -i 's|https://{{ first_master_ip | default("10.0.1.1") }}:6443|https://127.0.0.1:6443|g' {{ lookup('env', 'HOME') }}/.kube/config
    for verify in $(seq 1 5); do
      if KUBECONFIG={{ lookup('env', 'HOME') }}/.kube/config kubectl get nodes 2>/dev/null; then
        exit 0
      fi
      sleep 2
    done
    echo "kubectl failed after 5 retries"
    KUBECONFIG={{ lookup('env', 'HOME') }}/.kube/config kubectl get nodes
  args:
    executable: /bin/bash
  delegate_to: localhost
  become: false
  when: bastion_public_ip is defined

# ============================================
# Hetzner Cloud Controller Manager

- name: Wait for all nodes to be Ready before applying fixes
  ansible.builtin.shell: |
    for i in $(seq 1 60); do
      NOT_READY=$(kubectl get nodes --no-headers 2>/dev/null | grep -v ' Ready ' | wc -l)
      TOTAL=$(kubectl get nodes --no-headers 2>/dev/null | wc -l)
      if [ "$NOT_READY" -eq 0 ] && [ "$TOTAL" -gt 0 ]; then
        echo "All $TOTAL nodes Ready"; exit 0
      fi
      if [ "$((i % 10))" -eq 0 ]; then
        echo "--- Diagnostic at attempt $i ---"
        kubectl get nodes 2>/dev/null
        kubectl get pods -A --no-headers 2>/dev/null | grep -v Running | grep -v Completed || true
      fi
      echo "Waiting for nodes (attempt $i/60, $NOT_READY not ready)..."; sleep 15
    done
    echo "FINAL STATE:"
    kubectl get nodes 2>/dev/null
    kubectl get pods -A 2>/dev/null | head -30
    echo "Timeout waiting for nodes after 15 minutes"; exit 1
  args:
    executable: /bin/bash
  delegate_to: localhost
  become: false
  changed_when: false

- name: Fix CoreDNS forward to use upstream DNS instead of resolv.conf loop
  ansible.builtin.shell: |
    kubectl -n kube-system get cm coredns -o json | \
      python3 -c "import sys,json; d=json.load(sys.stdin); d['data']['Corefile']=d['data']['Corefile'].replace('127.0.0.53','1.1.1.1 8.8.8.8').replace('/etc/resolv.conf','1.1.1.1 8.8.8.8'); json.dump(d,sys.stdout)" | \
      kubectl apply -f -
    kubectl -n kube-system get cm nodelocaldns -o json | \
      python3 -c "import sys,json; d=json.load(sys.stdin); d['data']['Corefile']=d['data']['Corefile'].replace('/etc/resolv.conf','1.1.1.1 8.8.8.8'); json.dump(d,sys.stdout)" | \
      kubectl apply -f - 2>/dev/null || true
    kubectl -n kube-system rollout restart deployment coredns
    kubectl -n kube-system delete pods -l k8s-app=node-local-dns 2>/dev/null || true
  args:
    executable: /bin/bash
  delegate_to: localhost
  become: false
  changed_when: true

- name: Verify DNS resolution in cluster
  ansible.builtin.shell: |
    kubectl run dns-test-{{ ansible_date_time.epoch }} --rm -i --restart=Never --image=busybox --wait=true -- nslookup kubernetes.default.svc.cluster.local
  args:
    executable: /bin/bash
  delegate_to: localhost
  become: false
  changed_when: false
  register: dns_result
  retries: 5
  delay: 30
  until: dns_result.rc == 0
  ignore_errors: true


# ============================================

- name: Create hcloud-token secret for CCM
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: hcloud
        namespace: kube-system
      stringData:
        token: "{{ lookup('env', 'HCLOUD_TOKEN') }}"
        network: "{{ project }}-network"
  register: _r_create_hcloud_token_secret_for_ccm
  retries: 3
  delay: 10
  until: _r_create_hcloud_token_secret_for_ccm is not failed
  no_log: true

- name: Install Hetzner Cloud Controller Manager
  kubernetes.core.k8s:
    state: present
    src: "https://github.com/hetznercloud/hcloud-cloud-controller-manager/releases/download/{{ hetzner_ccm_ver }}/ccm-networks.yaml"
  register: _r_install_hetzner_cloud_controller_manager
  retries: 3
  delay: 10
  until: _r_install_hetzner_cloud_controller_manager is not failed

- name: Increase CCM progressDeadlineSeconds for slow image pulls
  kubernetes.core.k8s_json_patch:
    kind: Deployment
    namespace: kube-system
    name: hcloud-cloud-controller-manager
    patch:
      - op: replace
        path: /spec/progressDeadlineSeconds
        value: 1800
  register: _r_patch_ccm_progress_deadline
  retries: 3
  delay: 10
  until: _r_patch_ccm_progress_deadline is not failed

- name: Wait for initial CCM deployment to be ready before patching
  kubernetes.core.k8s_info:
    kind: Deployment
    namespace: kube-system
    name: hcloud-cloud-controller-manager
  register: ccm_pre_patch
  until: >
    ccm_pre_patch.resources | length > 0
    and (ccm_pre_patch.resources[0].status.readyReplicas | default(0)) >= 1
  retries: 120
  delay: 15
  failed_when: false

- name: Patch CCM DNS to use upstream DNS (hostNetwork pods can't use nodelocaldns IPv6)
  kubernetes.core.k8s_json_patch:
    kind: Deployment
    namespace: kube-system
    name: hcloud-cloud-controller-manager
    patch:
      - op: replace
        path: /spec/template/spec/dnsPolicy
        value: "None"
      - op: add
        path: /spec/template/spec/dnsConfig
        value:
          nameservers:
            - "185.12.64.1"
            - "185.12.64.2"
          searches:
            - "kube-system.svc.cluster.local"
            - "svc.cluster.local"
            - "cluster.local"
  register: _r_patch_ccm_dns_to_use_upstream_dns_hostne
  retries: 3
  delay: 10
  until: _r_patch_ccm_dns_to_use_upstream_dns_hostne is not failed

- name: Wait for Hetzner CCM to be ready
  kubernetes.core.k8s_info:
    kind: Deployment
    namespace: kube-system
    name: hcloud-cloud-controller-manager
  register: ccm_deploy
  until: >
    ccm_deploy.resources | length > 0
    and (ccm_deploy.resources[0].status.readyReplicas | default(0)) >= 1
  retries: 60
  delay: 15
  failed_when: false


# ============================================
# Hetzner CSI Driver (for hcloud-volumes StorageClass)
# ============================================

- name: Install Hetzner CSI Driver
  kubernetes.core.k8s:
    state: present
    src: "https://raw.githubusercontent.com/hetznercloud/csi-driver/{{ hetzner_csi_ver }}/deploy/kubernetes/hcloud-csi.yml"
  register: _r_install_hetzner_csi_driver
  retries: 3
  delay: 10
  until: _r_install_hetzner_csi_driver is not failed

- name: Increase CSI progressDeadlineSeconds for slow image pulls
  kubernetes.core.k8s_json_patch:
    kind: Deployment
    namespace: kube-system
    name: hcloud-csi-controller
    patch:
      - op: replace
        path: /spec/progressDeadlineSeconds
        value: 1800
  register: _r_patch_csi_progress_deadline
  retries: 3
  delay: 10
  until: _r_patch_csi_progress_deadline is not failed

- name: Wait for Hetzner CSI controller to be ready
  kubernetes.core.k8s_info:
    kind: Deployment
    namespace: kube-system
    name: hcloud-csi-controller
  register: csi_deploy
  until: >
    csi_deploy.resources | length > 0
    and (csi_deploy.resources[0].status.readyReplicas | default(0)) >= 1
  retries: 120
  delay: 15
  failed_when: false

- name: Wait for Hetzner CSI node DaemonSet to be ready on all nodes
  kubernetes.core.k8s_info:
    kind: DaemonSet
    namespace: kube-system
    name: hcloud-csi-node
  register: csi_node_ds
  until: >
    csi_node_ds.resources | length > 0
    and (csi_node_ds.resources[0].status.numberReady | default(0)) >= (csi_node_ds.resources[0].status.desiredNumberScheduled | default(1))
  retries: 120
  delay: 15
  failed_when: false

# ============================================
# Gateway API CRDs + Cilium Gateway
# ============================================

- name: Install Gateway API CRDs (standard)
  kubernetes.core.k8s:
    state: present
    src: "https://github.com/kubernetes-sigs/gateway-api/releases/download/{{ gateway_api_ver }}/standard-install.yaml"
  register: _r_install_gateway_api_crds_standard
  retries: 3
  delay: 10
  until: _r_install_gateway_api_crds_standard is not failed

- name: Remove Gateway API safe-upgrades policy to allow experimental CRDs
  kubernetes.core.k8s:
    state: absent
    api_version: admissionregistration.k8s.io/v1
    kind: "{{ item.kind }}"
    name: safe-upgrades.gateway.networking.k8s.io
  loop:
    - { kind: ValidatingAdmissionPolicyBinding }
    - { kind: ValidatingAdmissionPolicy }
  ignore_errors: true
  register: _r_remove_gateway_api_safe_upgrades_policy_
  retries: 3
  delay: 10
  until: _r_remove_gateway_api_safe_upgrades_policy_ is not failed

- name: Install Gateway API CRDs (experimental - TCPRoute, TLSRoute, GRPCRoute)
  kubernetes.core.k8s:
    state: present
    src: "https://github.com/kubernetes-sigs/gateway-api/releases/download/{{ gateway_api_ver }}/experimental-install.yaml"
  register: _r_install_gateway_api_crds_experimental_tc
  retries: 3
  delay: 10
  until: _r_install_gateway_api_crds_experimental_tc is not failed

- name: Create Cilium GatewayClass
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: gateway.networking.k8s.io/v1
      kind: GatewayClass
      metadata:
        name: cilium
        labels:
          app.kubernetes.io/managed-by: Helm
        annotations:
          meta.helm.sh/release-name: cilium
          meta.helm.sh/release-namespace: kube-system
      spec:
        controllerName: io.cilium/gateway-controller
  register: _r_create_cilium_gatewayclass
  retries: 3
  delay: 10
  until: _r_create_cilium_gatewayclass is not failed

- name: Restart Cilium operator to pick up Gateway API CRDs
  kubernetes.core.k8s:
    state: present
    kind: Deployment
    namespace: kube-system
    name: cilium-operator
    definition:
      spec:
        template:
          metadata:
            annotations:
              kubectl.kubernetes.io/restartedAt: "{{ ansible_date_time.iso8601 }}"
  register: _r_restart_cilium_operator_to_pick_up_gatew
  retries: 3
  delay: 10
  until: _r_restart_cilium_operator_to_pick_up_gatew is not failed

- name: Create cilium-system namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: cilium-system
  register: _r_create_cilium_system_namespace
  retries: 3
  delay: 10
  until: _r_create_cilium_system_namespace is not failed

- name: Create cilium-secrets namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: cilium-secrets
  register: _r_create_cilium_secrets_namespace
  retries: 3
  delay: 10
  until: _r_create_cilium_secrets_namespace is not failed

- name: Create ReferenceGrant for Gateway to access TLS secrets
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: gateway.networking.k8s.io/v1beta1
      kind: ReferenceGrant
      metadata:
        name: allow-gateway-tls
        namespace: cilium-secrets
      spec:
        from:
          - group: gateway.networking.k8s.io
            kind: Gateway
            namespace: cilium-system
        to:
          - group: ""
            kind: Secret
  register: _r_create_referencegrant_for_gateway_to_acc
  retries: 3
  delay: 10
  until: _r_create_referencegrant_for_gateway_to_acc is not failed
  no_log: true

- name: Create Cilium main Gateway
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: gateway.networking.k8s.io/v1
      kind: Gateway
      metadata:
        name: main-gateway
        namespace: cilium-system
      spec:
        gatewayClassName: cilium
        listeners:
          - name: http
            protocol: HTTP
            port: 80
            allowedRoutes:
              namespaces:
                from: All
          - name: https
            protocol: HTTPS
            port: 443
            tls:
              mode: Terminate
              certificateRefs:
                - name: wildcard-tls
                  namespace: cilium-secrets
            allowedRoutes:
              namespaces:
                from: All
  register: _r_create_cilium_main_gateway
  retries: 3
  delay: 10
  until: _r_create_cilium_main_gateway is not failed

- name: Wait for Cilium to create Gateway service
  kubernetes.core.k8s_info:
    kind: Service
    namespace: cilium-system
    label_selectors:
      - "io.cilium.gateway/owning-gateway=main-gateway"
  register: gw_svc
  until: gw_svc.resources | length > 0
  retries: 30
  delay: 10
  failed_when: false

- name: Patch Gateway service to use fixed NodePorts (30080/30443)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: "{{ gw_svc.resources[0].metadata.name }}"
        namespace: cilium-system
      spec:
        ports:
          - name: http
            port: 80
            targetPort: 80
            nodePort: 30080
            protocol: TCP
          - name: https
            port: 443
            targetPort: 443
            nodePort: 30443
            protocol: TCP
  when: gw_svc.resources | length > 0
  register: _r_patch_gateway_service_to_use_fixed_nodep
  retries: 3
  delay: 10
  until: _r_patch_gateway_service_to_use_fixed_nodep is not failed


- name: Create admin Gateway (VPN-only for GitLab, ArgoCD, Grafana, Vault)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: gateway.networking.k8s.io/v1
      kind: Gateway
      metadata:
        name: admin-gateway
        namespace: cilium-system
      spec:
        gatewayClassName: cilium
        listeners:
          - name: http
            protocol: HTTP
            port: 8080
            allowedRoutes:
              namespaces:
                from: All
          - name: https
            protocol: HTTPS
            port: 8443
            tls:
              mode: Terminate
              certificateRefs:
                - name: wildcard-tls
                  namespace: cilium-secrets
            allowedRoutes:
              namespaces:
                from: All
  register: _r_create_admin_gateway_vpn_only_for_gitlab
  retries: 3
  delay: 10
  until: _r_create_admin_gateway_vpn_only_for_gitlab is not failed

- name: Wait for admin Gateway service
  kubernetes.core.k8s_info:
    kind: Service
    namespace: cilium-system
    label_selectors:
      - "io.cilium.gateway/owning-gateway=admin-gateway"
  register: admin_gw_svc
  until: admin_gw_svc.resources | length > 0
  retries: 30
  delay: 10
  failed_when: false
  ignore_errors: true

- name: Patch admin Gateway service to use NodePort 31443
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: "{{ admin_gw_svc.resources[0].metadata.name }}"
        namespace: cilium-system
      spec:
        ports:
          - name: port-8080
            port: 8080
            targetPort: 8080
            protocol: TCP
          - name: port-8443
            port: 8443
            targetPort: 8443
            nodePort: 31443
            protocol: TCP
  when: admin_gw_svc.resources | default([]) | length > 0
  register: _r_patch_admin_gateway_service_to_use_nodep
  retries: 3
  delay: 10
  until: _r_patch_admin_gateway_service_to_use_nodep is not failed

- name: Create NetworkPolicy to restrict admin-gateway to VPN and private network
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: admin-gateway-vpn-only
        namespace: cilium-system
      spec:
        endpointSelector:
          matchLabels:
            io.cilium.gateway/owning-gateway: admin-gateway
        ingress:
          - fromCIDR:
              - 10.0.0.0/16
              - 100.64.0.0/10
  register: _r_create_networkpolicy_to_restrict_admin_g
  retries: 3
  delay: 10
  until: _r_create_networkpolicy_to_restrict_admin_g is not failed

# ============================================
# cert-manager v1.20.1
# ============================================

- name: Add Jetstack Helm repository
  kubernetes.core.helm_repository:
    name: jetstack
    repo_url: "https://charts.jetstack.io"
  register: _r_add_jetstack_helm_repository
  retries: 3
  delay: 10
  until: _r_add_jetstack_helm_repository is not failed

- name: Install cert-manager
  kubernetes.core.helm:
    name: cert-manager
    chart_ref: jetstack/cert-manager
    chart_version: "{{ certmanager_ver }}"
    release_namespace: cert-manager
    create_namespace: true
    release_state: present
    wait: true
    values:
      crds:
        enabled: true
      global:
        podSecurityPolicy:
          enabled: false
      securityContext:
        runAsNonRoot: true
      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
    set_values:
      - value: "replicaCount={{ certmanager_replicas }}"
      - value: "webhook.replicaCount={{ certmanager_replicas }}"
      - value: "cainjector.replicaCount={{ certmanager_replicas }}"
  register: _r_install_cert_manager
  retries: 3
  delay: 10
  until: _r_install_cert_manager is not failed

- name: Add Hetzner Cloud Helm repository
  kubernetes.core.helm_repository:
    name: hcloud
    repo_url: "https://charts.hetzner.cloud"
  register: _r_add_hetzner_cloud_helm_repository
  retries: 3
  delay: 10
  until: _r_add_hetzner_cloud_helm_repository is not failed

- name: Install official Hetzner Cloud DNS webhook for cert-manager
  kubernetes.core.helm:
    name: cert-manager-webhook-hetzner
    chart_ref: hcloud/cert-manager-webhook-hetzner
    chart_version: "0.6.7"
    release_namespace: cert-manager
    release_state: present
    wait: true
  register: _r_install_official_hetzner_cloud_dns_webho
  retries: 3
  delay: 10
  until: _r_install_official_hetzner_cloud_dns_webho is not failed

- name: Create Hetzner Cloud API token secret for cert-manager
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: hetzner-secret
        namespace: cert-manager
      stringData:
        api-token: "{{ lookup('env', 'HCLOUD_TOKEN') }}"
  register: _r_create_hetzner_cloud_api_token_secret_fo
  retries: 3
  delay: 10
  until: _r_create_hetzner_cloud_api_token_secret_fo is not failed
  no_log: true

- name: Create Let's Encrypt ClusterIssuer (staging)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cert-manager.io/v1
      kind: ClusterIssuer
      metadata:
        name: letsencrypt-staging
      spec:
        acme:
          server: https://acme-staging-v02.api.letsencrypt.org/directory
          email: "{{ email }}"
          privateKeySecretRef:
            name: letsencrypt-staging-key
          solvers:
            - dns01:
                webhook:
                  groupName: acme.hetzner.com
                  solverName: hetzner
                  config:
                    tokenSecretKeyRef:
                      name: hetzner-secret
                      key: api-token
  register: _r_create_let_s_encrypt_clusterissuer_stagi
  retries: 3
  delay: 10
  until: _r_create_let_s_encrypt_clusterissuer_stagi is not failed

- name: Create Let's Encrypt ClusterIssuer (production)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cert-manager.io/v1
      kind: ClusterIssuer
      metadata:
        name: letsencrypt-prod
      spec:
        acme:
          server: https://acme-v02.api.letsencrypt.org/directory
          email: "{{ email }}"
          privateKeySecretRef:
            name: letsencrypt-prod-key
          solvers:
            - dns01:
                webhook:
                  groupName: acme.hetzner.com
                  solverName: hetzner
                  config:
                    tokenSecretKeyRef:
                      name: hetzner-secret
                      key: api-token
  register: _r_create_let_s_encrypt_clusterissuer_produ
  retries: 3
  delay: 10
  until: _r_create_let_s_encrypt_clusterissuer_produ is not failed

- name: Create wildcard TLS certificate
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cert-manager.io/v1
      kind: Certificate
      metadata:
        name: wildcard-tls
        namespace: cilium-secrets
      spec:
        secretName: wildcard-tls
        issuerRef:
          name: letsencrypt-prod
          kind: ClusterIssuer
        dnsNames:
          - "{{ domain }}"
          - "*.{{ domain }}"
  register: _r_create_wildcard_tls_certificate
  retries: 3
  delay: 10
  until: _r_create_wildcard_tls_certificate is not failed


