---
# HashiCorp Vault Raft Snapshot Backup - idempotent

- name: "Backup-Vault | Create Vault backup credentials secret"
  no_log: true
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: vault-backup-credentials
        namespace: "{{ backup_vault_namespace | default('vault') }}"
        labels:
          app.kubernetes.io/part-of: backup-restore
          app.kubernetes.io/component: vault-raft
      type: Opaque
      stringData:
        AWS_ACCESS_KEY_ID: "{{ backup_storage_access_key }}"
        AWS_SECRET_ACCESS_KEY: "{{ backup_storage_secret_key }}"
        AWS_ENDPOINT_URL: "{{ backup_storage_endpoint }}"
        AWS_DEFAULT_REGION: "{{ backup_storage_region }}"
        VAULT_ADDR: "{{ backup_vault_server | default('http://vault-active.vault.svc.cluster.local:8200') }}"
        SNAPSHOT_BUCKET: "{{ backup_vault_snapshot_bucket | default('vault-snapshots') }}"
      data:
        # Secret.data is base64 text and cannot be retyped as a JSON number by
        # Ansible's native Jinja conversion when the configured value is `30`.
        SNAPSHOT_RETENTION: "{{ (backup_vault_snapshot_retention | default(30) | string) | b64encode }}"
  tags: [backup, backup-vault]

- name: "Backup-Vault | Create snapshot backup service account"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: vault-backup
        namespace: "{{ backup_vault_namespace | default('vault') }}"
        labels:
          app.kubernetes.io/part-of: backup-restore
          app.kubernetes.io/component: vault-raft
      automountServiceAccountToken: false
  tags: [backup, backup-vault]

- name: "Backup-Vault | Detect active Vault storage backend"
  kubernetes.core.k8s_exec:
    namespace: "{{ backup_vault_namespace | default('vault') }}"
    pod: vault-0
    command: vault status -format=json
  register: backup_vault_storage_status
  changed_when: false
  failed_when: false
  tags: [backup, backup-vault]

- name: "Backup-Vault | Suspend Raft snapshots until Vault uses Raft"
  ansible.builtin.set_fact:
    backup_vault_raft_snapshot_suspended: >-
      {{
        ((backup_vault_storage_status.stdout | default('{}', true) | from_json).storage_type
          | default('')) != 'raft'
      }}
  tags: [backup, backup-vault]

- name: "Backup-Vault | Deploy Vault Raft snapshot CronJob"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: batch/v1
      kind: CronJob
      metadata:
        name: vault-raft-snapshot
        namespace: "{{ backup_vault_namespace | default('vault') }}"
        labels:
          app.kubernetes.io/part-of: backup-restore
          app.kubernetes.io/component: vault-raft
      spec:
        schedule: "{{ _backup_schedule }}"
        suspend: "{{ backup_vault_raft_snapshot_suspended }}"
        timeZone: "{{ backup_cron_timezone | default('UTC') }}"
        concurrencyPolicy: "{{ backup_cron_concurrency_policy | default('Forbid') }}"
        successfulJobsHistoryLimit: "{{ backup_cron_successful_jobs_history | default(3) }}"
        failedJobsHistoryLimit: "{{ backup_cron_failed_jobs_history | default(1) }}"
        jobTemplate:
          spec:
            ttlSecondsAfterFinished: 600
            backoffLimit: 2
            template:
              spec:
                serviceAccountName: vault-backup
                automountServiceAccountToken: false
                restartPolicy: Never
                securityContext:
                  fsGroup: 1000
                  runAsNonRoot: true
                  seccompProfile:
                    type: RuntimeDefault
                containers:
                  - name: vault-snapshot
                    image: "{{ backup_vault_image | default('hashicorp/vault:2.0.3') }}"
                    securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop: ["ALL"]
                      runAsNonRoot: true
                      runAsUser: 100
                      runAsGroup: 1000
                    command:
                      - /bin/sh
                      - -c
                      - |
                        set -euo pipefail
                        trap 'rc=$?; if [ "$rc" -ne 0 ]; then printf "%s" "$rc" > /backup/failed; fi' EXIT
                        TS=$(date -u +%Y%m%dT%H%M%SZ)
                        SF="/backup/vault-${TS}.snap"
                        JWT=$(cat /var/run/secrets/vault-auth/token)
                        VAULT_TOKEN=$(vault write -field=token auth/kubernetes/login role=vault-backup jwt="$JWT")
                        export VAULT_TOKEN
                        vault operator raft snapshot save "${SF}"
                        chmod 0640 "${SF}"
                        printf '%s' "$TS" > /backup/ready
                    envFrom:
                      - secretRef:
                          name: vault-backup-credentials
                    env:
                      - name: VAULT_CACERT
                        value: "{{ '/vault/tls/ca.crt' if not (vault_tls_disabled | default(false) | bool) else '' }}"
                    volumeMounts:
                      - name: vault-auth-token
                        mountPath: /var/run/secrets/vault-auth
                        readOnly: true
                      - name: backup-work
                        mountPath: /backup
                      - name: vault-tls
                        mountPath: /vault/tls
                        readOnly: true
                    resources:
                      requests:
                        cpu: "{{ backup_job_cpu_request | default('100m') }}"
                        memory: "{{ backup_job_memory_request | default('128Mi') }}"
                      limits:
                        cpu: "{{ backup_job_cpu_limit | default('500m') }}"
                        memory: "{{ backup_job_memory_limit | default('512Mi') }}"
                  - name: s3-uploader
                    image: "{{ backup_s3cli_image | default('amazon/aws-cli:2.34.48') }}"
                    securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop: ["ALL"]
                      runAsNonRoot: true
                      runAsUser: 1000
                      runAsGroup: 1000
                    command:
                      - /bin/sh
                      - -c
                      - |
                        set -euo pipefail
                        attempts=0
                        while [ ! -s /backup/ready ]; do
                          if [ -s /backup/failed ]; then
                            echo "Vault snapshot container failed with exit code $(cat /backup/failed)" >&2
                            exit 1
                          fi
                          attempts=$((attempts + 1))
                          [ "$attempts" -le 300 ] || { echo "snapshot was not produced" >&2; exit 1; }
                          sleep 2
                        done
                        TS=$(cat /backup/ready)
                        SF="/backup/vault-${TS}.snap"
                        test -s "$SF"
                        aws --endpoint-url="${AWS_ENDPOINT_URL}" s3 cp "$SF" "s3://${SNAPSHOT_BUCKET}/vault-${TS}.snap"
                        aws --endpoint-url="${AWS_ENDPOINT_URL}" s3 ls "s3://${SNAPSHOT_BUCKET}/vault-${TS}.snap" >/dev/null
                        printf 'BACKUP_ARTIFACT_URI=s3://%s/vault-%s.snap\n' "$SNAPSHOT_BUCKET" "$TS"
                        RETENTION=${SNAPSHOT_RETENTION:-30}
                        aws --endpoint-url="${AWS_ENDPOINT_URL}" s3 ls "s3://${SNAPSHOT_BUCKET}/" 2>/dev/null | awk '{print $4}' | while read -r F; do
                          D=$(echo "$F" | grep -oP '\d{8}T\d{6}Z' || echo "")
                          [ -z "$D" ] && continue
                          E=$(date -d "$D" +%s 2>/dev/null || echo 0)
                          C=$(( $(date +%s) - (RETENTION * 86400) ))
                          if [ "$E" -gt 0 ] && [ "$E" -lt "$C" ]; then
                            aws --endpoint-url="${AWS_ENDPOINT_URL}" s3 rm "s3://${SNAPSHOT_BUCKET}/${F}"
                          fi
                        done
                        echo "=== Vault Raft Snapshot completed ==="
                    envFrom:
                      - secretRef:
                          name: vault-backup-credentials
                    volumeMounts:
                      - name: backup-work
                        mountPath: /backup
                    resources:
                      requests:
                        cpu: "{{ backup_job_cpu_request | default('100m') }}"
                        memory: "{{ backup_job_memory_request | default('128Mi') }}"
                      limits:
                        cpu: "{{ backup_job_cpu_limit | default('500m') }}"
                        memory: "{{ backup_job_memory_limit | default('512Mi') }}"
                volumes:
                  - name: vault-auth-token
                    projected:
                      # Kubernetes API uses the decimal representation of 0400.
                      defaultMode: 256
                      sources:
                        - serviceAccountToken:
                            path: token
                            audience: vault-backup
                            expirationSeconds: 900
                  - name: backup-work
                    emptyDir: {}
                  - name: vault-tls
                    secret:
                      secretName: vault-internal-tls
                      optional: "{{ vault_tls_disabled | default(false) | bool }}"
                      items:
                        - key: ca.crt
                          path: ca.crt
  tags: [backup, backup-vault]
