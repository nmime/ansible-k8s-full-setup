---
- name: "Backup | Set backup resolved facts"
  ansible.builtin.set_fact:
    _backup_project: "{{ backup_project_name | default('k8s') }}"
    _backup_bucket: "{{ backup_storage_bucket | default('backups.local') }}"
    _backup_ns: "{{ backup_namespace | default('backups') }}"
    _backup_retention: "{{ backup_retention_days | default(30) }}"
    _backup_schedule: "{{ backup_schedule | default('0 2 * * *') }}"
  tags: [backup, backup-setup]

- name: "Backup | Resolve enabled backup component set"
  ansible.builtin.set_fact:
    _backup_components: >-
      {%- set ns = namespace(items=[]) -%}
      {%- if backup_postgresql_enabled | bool and platform_postgresql_enabled | default(true) | bool -%}
      {%- set _ = ns.items.append('postgresql') -%}
      {%- endif -%}
      {%- if backup_mongodb_enabled | bool and platform_mongodb_enabled | default(true) | bool -%}
      {%- set _ = ns.items.append('mongodb') -%}
      {%- endif -%}
      {%- if backup_vault_enabled | bool and platform_secrets_enabled | default(true) | bool -%}
      {%- set _ = ns.items.append('vault') -%}
      {%- endif -%}
      {%- if backup_seaweedfs_enabled | bool and platform_object_storage_enabled | default(true) | bool -%}
      {%- set _ = ns.items.append('seaweedfs') -%}
      {%- endif -%}
      {%- if backup_gitlab_enabled | bool and platform_gitlab_enabled | default(true) | bool -%}
      {%- set _ = ns.items.append('gitlab') -%}
      {%- set _ = ns.items.append('gitlab-secrets') -%}
      {%- endif -%}
      {{ ns.items }}
  tags: [backup, backup-setup]

- name: "Backup | Create backup metadata namespace"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ _backup_ns }}"
        labels:
          app.kubernetes.io/part-of: backup-restore
          app.kubernetes.io/managed-by: ansible
          pod-security.kubernetes.io/enforce: baseline
  tags: [backup, backup-setup]

- name: "Backup | Require generated object-storage credentials"
  ansible.builtin.assert:
    that:
      - backup_storage_access_key | length >= 12
      - backup_storage_secret_key | length >= 24
    fail_msg: >-
      Backup storage credentials are missing or insecure. Run the
      generate-secrets role and do not use static fallback credentials.
  no_log: true
  tags: [backup, backup-setup]

- name: "Backup | Create backup storage credentials secret"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: backup-storage-credentials
        namespace: "{{ _backup_ns }}"
        labels:
          app.kubernetes.io/part-of: backup-restore
      type: Opaque
      stringData:
        AWS_ACCESS_KEY_ID: "{{ backup_storage_access_key }}"
        AWS_SECRET_ACCESS_KEY: "{{ backup_storage_secret_key }}"
        AWS_ENDPOINT_URL: "{{ backup_storage_endpoint }}"
        AWS_DEFAULT_REGION: "{{ backup_storage_region }}"
  no_log: true
  tags: [backup, backup-setup]

- name: "Backup | Include PostgreSQL backup tasks"
  ansible.builtin.include_tasks: postgresql_pgbackrest.yml
  when: "'postgresql' in _backup_components"
  tags: [backup, backup-postgresql]

- name: "Backup | Include MongoDB backup tasks"
  ansible.builtin.include_tasks: mongodb_pbm.yml
  when: "'mongodb' in _backup_components"
  tags: [backup, backup-mongodb]

- name: "Backup | Include Vault Raft snapshot tasks"
  ansible.builtin.include_tasks: vault_raft.yml
  when: "'vault' in _backup_components"
  tags: [backup, backup-vault]

- name: "Backup | Include SeaweedFS backup tasks"
  ansible.builtin.include_tasks: seaweedfs.yml
  when: "'seaweedfs' in _backup_components"
  tags: [backup, backup-seaweedfs]

- name: "Backup | Include GitLab backup tasks"
  ansible.builtin.include_tasks: gitlab.yml
  when: "'gitlab' in _backup_components"
  tags: [backup, backup-gitlab]

- name: "Backup | Include full-cluster disaster-recovery tasks"
  ansible.builtin.include_tasks:
    file: velero.yml
    apply:
      tags: [backup, backup-dr, velero]
  when: backup_dr_enabled | bool
  tags: [backup, backup-dr, velero]

- name: "Backup | Remove disabled full-cluster disaster-recovery controller"
  ansible.builtin.include_tasks:
    file: velero_disabled.yml
    apply:
      tags: [backup, backup-dr, velero]
  when: not (backup_dr_enabled | bool)
  tags: [backup, backup-dr, velero]

- name: "Backup | Include verification jobs"
  ansible.builtin.include_tasks: verification.yml
  when: backup_verify_all | bool
  tags: [backup, backup-verify]

- name: "Backup | Include alerting configuration"
  ansible.builtin.include_tasks: alerts.yml
  when: backup_alert_enabled | bool
  tags: [backup, backup-alerts]
