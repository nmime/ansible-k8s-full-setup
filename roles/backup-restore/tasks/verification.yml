---
# Backup Verification - checks all backup artifacts exist in S3

- name: "Backup-Verify | Deploy backup verification CronJob"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: batch/v1
      kind: CronJob
      metadata:
        name: backup-verification
        namespace: "{{ _backup_ns }}"
        labels:
          app.kubernetes.io/part-of: backup-restore
          app.kubernetes.io/component: verification
      spec:
        schedule: "0 6 * * *"
        timeZone: "{{ backup_cron_timezone | default('UTC') }}"
        concurrencyPolicy: "{{ backup_cron_concurrency_policy | default('Forbid') }}"
        successfulJobsHistoryLimit: "{{ backup_cron_successful_jobs_history | default(3) }}"
        failedJobsHistoryLimit: "{{ backup_cron_failed_jobs_history | default(1) }}"
        jobTemplate:
          spec:
            ttlSecondsAfterFinished: 600
            # Verification is read-only and AWS CLI already retries transient
            # requests. Re-running a deterministic missing-artifact result in
            # the same Pod only inflates restart alerts without adding proof.
            backoffLimit: 0
            activeDeadlineSeconds: "{{ backup_verification_timeout | default(3600) }}"
            template:
              spec:
                restartPolicy: Never
                securityContext:
                  runAsNonRoot: true
                  seccompProfile:
                    type: RuntimeDefault
                containers:
                  - name: verify
                    image: "{{ backup_s3cli_image | default('amazon/aws-cli:2.34.48') }}"
                    securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop: ["ALL"]
                      runAsNonRoot: true
                      runAsUser: 1000
                      runAsGroup: 1000
                    command:
                      - /bin/sh
                      - -c
                      - |
                        set -euo pipefail
                        TS=$(date -u +%Y%m%dT%H%M%SZ); FAIL=0
                        B="${_BACKUP_BUCKET:-backups-local}"; P="${_BACKUP_PROJECT:-k8s}"; E="${AWS_ENDPOINT_URL}"
                        echo "=== Backup Verification ${TS} ==="
                        for comp in {{ _backup_components | join(' ') }}; do
                          if [ "$comp" = gitlab ]; then
                            bucket="gitlab-backups"
                            prefix=""
                          elif [ "$comp" = postgresql ]; then
                            bucket="$B"
                            prefix="pgbackrest/${P}-pg/repo2/"
                          elif [ "$comp" = mongodb ]; then
                            bucket="$B"
                            prefix="mongodb/${P}-mongo/"
                          else
                            bucket="$B"
                            prefix="${P}/${comp}/"
                          fi
                          if [ "$comp" = gitlab ]; then
                            N=$(AWS_ACCESS_KEY_ID="$GITLAB_AWS_ACCESS_KEY_ID" \
                              AWS_SECRET_ACCESS_KEY="$GITLAB_AWS_SECRET_ACCESS_KEY" \
                              aws --endpoint-url="$E" s3api list-objects-v2 \
                              --bucket "$bucket" --prefix "$prefix" --max-keys 1 --no-paginate \
                              --query 'length(Contents || `[]`)' --output text 2>/dev/null) || N_ERROR=1
                          else
                            N=$(aws --endpoint-url="$E" s3api list-objects-v2 \
                              --bucket "$bucket" --prefix "$prefix" --max-keys 1 --no-paginate \
                              --query 'length(Contents || `[]`)' --output text 2>/dev/null) || N_ERROR=1
                          fi
                          if [ "${N_ERROR:-0}" -eq 1 ]; then
                            echo "FAIL: unable to verify ${comp} artifacts"
                            FAIL=$((FAIL+1))
                            unset N_ERROR
                            continue
                          fi
                          case "$N" in
                            ''|*[!0-9]*)
                              echo "FAIL: invalid ${comp} verification response"
                              FAIL=$((FAIL+1))
                              ;;
                            0)
                              echo "FAIL: no ${comp} artifacts"
                              FAIL=$((FAIL+1))
                              ;;
                            *)
                              echo "OK: ${comp} artifacts present"
                              ;;
                          esac
                        done
                        echo "Failures: ${FAIL}"
                        [ "$FAIL" -gt 0 ] && echo "STATUS: FAIL" && exit 1
                        echo "STATUS: PASS"
                    env:
                      - name: _BACKUP_BUCKET
                        value: "{{ _backup_bucket }}"
                      - name: _BACKUP_PROJECT
                        value: "{{ _backup_project }}"
                    envFrom:
                      - secretRef:
                          name: backup-storage-credentials
                      - secretRef:
                          name: backup-gitlab-verification-credentials
                    resources:
                      requests:
                        cpu: "{{ backup_job_cpu_request | default('100m') }}"
                        memory: "{{ backup_job_memory_request | default('128Mi') }}"
                      limits:
                        cpu: "{{ backup_job_cpu_limit | default('500m') }}"
                        memory: "{{ backup_job_memory_limit | default('512Mi') }}"
  tags: [backup, backup-verify]
