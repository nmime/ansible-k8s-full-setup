---
- name: "Backup-DR | Reject an in-cluster disaster-recovery target"
  ansible.builtin.assert:
    that:
      - backup_dr_storage_endpoint | length > 0
      - (backup_dr_storage_endpoint | urlsplit('scheme')) in ['http', 'https']
      - (backup_dr_storage_endpoint | urlsplit('hostname') | default('', true)) | length > 0
      - (backup_dr_storage_endpoint | urlsplit('hostname')) is not match('^[0-9]{1,3}(\\.[0-9]{1,3}){3}$')
      - "':' not in (backup_dr_storage_endpoint | urlsplit('hostname'))"
      - "'.svc' not in backup_dr_storage_endpoint"
      - "'seaweedfs' not in backup_dr_storage_endpoint"
      - backup_dr_storage_bucket | length > 2
      - backup_dr_storage_access_key | length >= 8
      - backup_dr_storage_secret_key | length >= 16
    fail_msg: >-
      Full-cluster recovery requires an external S3-compatible target and
      independently supplied BACKUP_DR_ACCESS_KEY/BACKUP_DR_SECRET_KEY.
      The protected cluster's SeaweedFS endpoint is not a disaster-recovery
      destination.
  no_log: true

- name: "Backup-DR | Resolve the bounded object-storage network destination"
  ansible.builtin.set_fact:
    backup_dr_storage_hostname: "{{ backup_dr_storage_endpoint | urlsplit('hostname') }}"
    backup_dr_storage_port: >-
      {{ backup_dr_storage_endpoint | urlsplit('port') |
         default(443 if (backup_dr_storage_endpoint | urlsplit('scheme')) == 'https' else 80, true) }}

- name: "Backup-DR | Create privileged Velero namespace"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ backup_dr_namespace }}"
        labels:
          app.kubernetes.io/part-of: backup-restore
          pod-security.kubernetes.io/enforce: privileged
          pod-security.kubernetes.io/audit: privileged
          pod-security.kubernetes.io/warn: privileged

- name: "Backup-DR | Create external object-storage credentials"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: velero-cloud-credentials
        namespace: "{{ backup_dr_namespace }}"
        labels:
          app.kubernetes.io/part-of: backup-restore
      type: Opaque
      stringData:
        cloud: |
          [default]
          aws_access_key_id={{ backup_dr_storage_access_key }}
          aws_secret_access_key={{ backup_dr_storage_secret_key }}
  no_log: true

- name: "Backup-DR | Add official Velero Helm repository"
  kubernetes.core.helm_repository:
    name: vmware-tanzu
    repo_url: https://vmware-tanzu.github.io/helm-charts

# Velero consumes skipImmediately and then owns that field. Helm 4 uses
# server-side apply, so a later upgrade otherwise conflicts with velero-server
# and can leave the release failed. Scheduled backups do not use owner
# references, so replacing this declarative schedule never removes backups.
- name: "Backup-DR | Detect whether the Velero Schedule CRD is installed"
  ansible.builtin.command:
    argv:
      - kubectl
      - get
      - crd
      - schedules.velero.io
  register: backup_dr_schedule_crd
  changed_when: false
  failed_when: false

- name: "Backup-DR | Replace the controller-mutated Helm schedule safely"
  kubernetes.core.k8s:
    state: absent
    api_version: velero.io/v1
    kind: Schedule
    namespace: "{{ backup_dr_namespace }}"
    name: velero-full-cluster
    wait: true
  when: backup_dr_schedule_crd.rc == 0

- name: "Backup-DR | Deploy Velero with node-agent filesystem backups"
  kubernetes.core.helm:
    name: velero
    chart_ref: vmware-tanzu/velero
    chart_version: "{{ backup_dr_velero_chart_version }}"
    release_namespace: "{{ backup_dr_namespace }}"
    create_namespace: false
    state: present
    # Operational recovery can temporarily patch node-agent resources while a
    # node is constrained. Helm 4 uses server-side apply, so reclaim those
    # fields on the next declarative run instead of leaving the release failed
    # on a managed-fields conflict.
    force_conflicts: true
    wait: true
    timeout: 10m0s
    atomic: true
    values:
      image:
        repository: docker.io/velero/velero
        tag: "{{ backup_dr_velero_image_tag }}"
      initContainers:
        - name: velero-plugin-for-aws
          image: "docker.io/velero/velero-plugin-for-aws:{{ backup_dr_velero_aws_plugin_tag }}"
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: "{{ backup_dr_velero_plugin_cpu_request }}"
              memory: "{{ backup_dr_velero_plugin_memory_request }}"
            limits:
              cpu: "{{ backup_dr_velero_plugin_cpu_limit }}"
              memory: "{{ backup_dr_velero_plugin_memory_limit }}"
          volumeMounts:
            - mountPath: /target
              name: plugins
      credentials:
        useSecret: true
        existingSecret: velero-cloud-credentials
      configuration:
        backupStorageLocation:
          - name: default
            provider: aws
            bucket: "{{ backup_dr_storage_bucket }}"
            prefix: "{{ backup_dr_storage_prefix }}"
            default: true
            accessMode: ReadWrite
            credential:
              name: velero-cloud-credentials
              key: cloud
            config:
              region: "{{ backup_dr_storage_region }}"
              s3ForcePathStyle: "true"
              s3Url: "{{ backup_dr_storage_endpoint }}"
        defaultVolumesToFsBackup: true
        defaultBackupTTL: "{{ backup_dr_retention_hours }}h"
        defaultItemOperationTimeout: 8h
        fsBackupTimeout: 8h
        uploaderType: kopia
      backupsEnabled: true
      snapshotsEnabled: false
      deployNodeAgent: true
      # Velero injects this helper into pods participating in filesystem
      # restores. The upstream image declares the symbolic user "cnb"; pods
      # enforcing runAsNonRoot require an explicit numeric identity.
      configMaps:
        fs-restore-action-config:
          labels:
            velero.io/plugin-config: ""
            velero.io/pod-volume-restore: RestoreItemAction
          data:
            image: "docker.io/velero/velero:{{ backup_dr_velero_image_tag }}"
            cpuRequest: 25m
            memRequest: 32Mi
            cpuLimit: 250m
            memLimit: 128Mi
            secCtx: |
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              privileged: false
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              runAsUser: 1001
              runAsGroup: 1001
              seccompProfile:
                type: RuntimeDefault
      resources:
        requests:
          cpu: "{{ '25m' if resource_tier in ['minimal', 'small'] else backup_dr_velero_cpu_request }}"
          memory: "{{ '64Mi' if resource_tier in ['minimal', 'small'] else backup_dr_velero_memory_request }}"
        limits:
          cpu: "{{ '250m' if resource_tier in ['minimal', 'small'] else backup_dr_velero_cpu_limit }}"
          # Full API exports can exceed 256Mi even on a two-node cluster. Keep
          # the reservation tiny, but allow a bounded serialization burst.
          memory: "{{ '512Mi' if resource_tier in ['minimal', 'small'] else backup_dr_velero_memory_limit }}"
      nodeAgent:
        # Medium-optimized deliberately schedules stateful workloads on the
        # tainted control plane. A node agent must therefore run there too or
        # an otherwise healthy full-cluster backup silently skips those PVCs.
        tolerations:
          - key: node-role.kubernetes.io/control-plane
            operator: Exists
            effect: NoSchedule
          - key: node-role.kubernetes.io/master
            operator: Exists
            effect: NoSchedule
        resources:
          requests:
            cpu: "{{ '25m' if resource_tier != 'production' else backup_dr_node_agent_cpu_request }}"
            memory: "{{ '64Mi' if resource_tier != 'production' else backup_dr_node_agent_memory_request }}"
          limits:
            cpu: "{{ '500m' if resource_tier != 'production' else backup_dr_node_agent_cpu_limit }}"
            memory: "{{ '512Mi' if resource_tier != 'production' else backup_dr_node_agent_memory_limit }}"
      schedules:
        full-cluster:
          disabled: false
          paused: false
          skipImmediately: true
          schedule: "{{ backup_dr_schedule }}"
          useOwnerReferencesInBackup: false
          template:
            ttl: "{{ backup_dr_retention_hours }}h"
            storageLocation: default
            includeClusterResources: true
            defaultVolumesToFsBackup: true
  register: backup_dr_velero_helm
  until: backup_dr_velero_helm is succeeded
  retries: 3
  delay: 10

- name: "Backup-DR | Remove legacy invalid Cilium default-deny"
  kubernetes.core.k8s:
    state: absent
    definition:
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: default-deny
        namespace: "{{ backup_dr_namespace }}"

- name: "Backup-DR | Create default-deny NetworkPolicy"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: default-deny
        namespace: "{{ backup_dr_namespace }}"
      spec:
        podSelector: {}
        policyTypes:
          - Ingress
          - Egress
        ingress: []
        egress: []

- name: "Backup-DR | Allow only required Velero control and backup traffic"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: allow-velero-required-traffic
        namespace: "{{ backup_dr_namespace }}"
      spec:
        endpointSelector: {}
        ingress:
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: "{{ backup_dr_namespace }}"
          - fromEntities:
              - host
              - remote-node
            toPorts:
              - ports:
                  - port: '8085'
                    protocol: TCP
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: monitoring
            toPorts:
              - ports:
                  - port: '8085'
                    protocol: TCP
        egress:
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: kube-system
                  k8s:k8s-app: kube-dns
            toPorts:
              - ports:
                  - port: '53'
                    protocol: UDP
                  - port: '53'
                    protocol: TCP
                rules:
                  dns:
                    - matchName: "{{ backup_dr_storage_hostname }}"
          - toCIDR:
              - 169.254.25.10/32
            toPorts:
              - ports:
                  - port: '53'
                    protocol: UDP
                  - port: '53'
                    protocol: TCP
                rules:
                  dns:
                    - matchName: "{{ backup_dr_storage_hostname }}"
          - toEntities:
              - host
            toPorts:
              - ports:
                  - port: '53'
                    protocol: UDP
                  - port: '53'
                    protocol: TCP
                rules:
                  dns:
                    - matchName: "{{ backup_dr_storage_hostname }}"
          - toEntities:
              - kube-apiserver
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: "{{ backup_dr_namespace }}"
          # DR storage must remain outside the protected cluster. Match only
          # the validated DNS name and configured HTTP(S) port; literal IP
          # endpoints are rejected above because they cannot be DNS-bound.
          - toFQDNs:
              - matchName: "{{ backup_dr_storage_hostname }}"
            toPorts:
              - ports:
                  - port: "{{ backup_dr_storage_port | string }}"
                    protocol: TCP

- name: "Backup-DR | Wait for the Velero server"
  ansible.builtin.command:
    cmd: >-
      kubectl rollout status deployment/velero
      --namespace {{ backup_dr_namespace }} --timeout=600s
  changed_when: false

- name: "Backup-DR | Wait for node agents on every schedulable node"
  ansible.builtin.command:
    cmd: >-
      kubectl rollout status daemonset/node-agent
      --namespace {{ backup_dr_namespace }} --timeout=600s
  changed_when: false

- name: "Backup-DR | Prove node-agent coverage on every schedulable node"
  ansible.builtin.shell: |
    set -o pipefail
    schedulable=$(kubectl get nodes -o json | jq '[.items[] | select(.spec.unschedulable != true)] | length')
    covered=$(kubectl get daemonset/node-agent --namespace {{ backup_dr_namespace }} -o jsonpath='{.status.numberReady}')
    test "${covered:-0}" -eq "$schedulable"
  args:
    executable: /bin/bash
  changed_when: false

- name: "Backup-DR | Require an available external backup location"
  ansible.builtin.command:
    cmd: >-
      kubectl wait backupstoragelocation/default
      --namespace {{ backup_dr_namespace }}
      --for=jsonpath='{.status.phase}'=Available --timeout=300s
  changed_when: false
