---
# MongoDB backups are owned by the PerconaServerMongoDB operator. The database
# role configures S3 storage, PITR, retention, and scheduled backup tasks.

- name: "Backup-MongoDB | Remove obsolete standalone PBM CronJob"
  kubernetes.core.k8s:
    state: absent
    api_version: batch/v1
    kind: CronJob
    name: mongodb-backup
    namespace: "{{ backup_mongodb_namespace }}"

- name: "Backup-MongoDB | Read operator-managed MongoDB cluster"
  kubernetes.core.k8s_info:
    api_version: psmdb.percona.com/v1
    kind: PerconaServerMongoDB
    name: "{{ backup_mongodb_cluster_name }}"
    namespace: "{{ backup_mongodb_namespace }}"
  register: _mongodb_backup_cluster
  retries: 12
  delay: 10
  until: (_mongodb_backup_cluster.resources | default([])) | length == 1

- name: "Backup-MongoDB | Verify operator backup policy"
  ansible.builtin.assert:
    that:
      - _mongodb_backup_cluster.resources[0].spec.backup.enabled | bool
      - _mongodb_backup_cluster.resources[0].spec.backup.storages['s3-object-storage'] is defined
      - _mongodb_backup_cluster.resources[0].spec.backup.tasks | selectattr('enabled', 'equalto', true) | list | length > 0
    fail_msg: >-
      The PerconaServerMongoDB backup policy is missing. Reconcile the
      k8s-databases role before enabling backup verification.
  tags: [backup, backup-mongodb]
