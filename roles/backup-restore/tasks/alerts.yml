---
# Backup Alert Configuration - Slack-compatible webhook alerts

- name: "Backup-Alerts | Create alert webhook secret"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: backup-alert-config
        namespace: "{{ _backup_ns }}"
        labels:
          app.kubernetes.io/part-of: backup-restore
          app.kubernetes.io/component: alerts
      type: Opaque
      stringData:
        WEBHOOK_URL: "{{ backup_alert_webhook_url | default('') }}"
        CHANNEL: "{{ backup_alert_channel | default('#alerts') }}"
        ON_FAILURE_ONLY: "{{ backup_alert_on_failure_only | default(false) | lower }}"
  tags: [backup, backup-alerts]

- name: "Backup-Alerts | Create alert checker service account"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: backup-alert-check
        namespace: "{{ _backup_ns }}"
        labels:
          app.kubernetes.io/part-of: backup-restore
          app.kubernetes.io/component: alerts
      automountServiceAccountToken: true
  tags: [backup, backup-alerts]

- name: "Backup-Alerts | Permit alert checker to list verification pods"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: backup-alert-check
        namespace: "{{ _backup_ns }}"
      rules:
        - apiGroups: [""]
          resources: ["pods"]
          verbs: ["get", "list"]
  tags: [backup, backup-alerts]

- name: "Backup-Alerts | Bind alert checker read-only role"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: backup-alert-check
        namespace: "{{ _backup_ns }}"
      subjects:
        - kind: ServiceAccount
          name: backup-alert-check
          namespace: "{{ _backup_ns }}"
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: Role
        name: backup-alert-check
  tags: [backup, backup-alerts]

- name: "Backup-Alerts | Deploy backup alert CronJob"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: batch/v1
      kind: CronJob
      metadata:
        name: backup-alert-check
        namespace: "{{ _backup_ns }}"
        labels:
          app.kubernetes.io/part-of: backup-restore
          app.kubernetes.io/component: alerts
      spec:
        schedule: "0 7 * * *"
        timeZone: "{{ backup_cron_timezone | default('UTC') }}"
        concurrencyPolicy: "{{ backup_cron_concurrency_policy | default('Forbid') }}"
        successfulJobsHistoryLimit: 1
        failedJobsHistoryLimit: 1
        jobTemplate:
          spec:
            ttlSecondsAfterFinished: 120
            backoffLimit: 1
            template:
              spec:
                restartPolicy: OnFailure
                serviceAccountName: backup-alert-check
                automountServiceAccountToken: true
                securityContext:
                  runAsNonRoot: true
                  runAsUser: 100
                  runAsGroup: 101
                  seccompProfile:
                    type: RuntimeDefault
                containers:
                  - name: alert
                    image: "{{ backup_curl_image }}"
                    securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop: ["ALL"]
                      readOnlyRootFilesystem: true
                    command:
                      - /bin/sh
                      - -c
                      - |
                        set -euo pipefail
                        TS=$(date -u +%Y%m%dT%H%M%SZ)
                        [ -z "${WEBHOOK_URL}" ] && echo "No webhook, skipping" && exit 0
                        API="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT_HTTPS}"
                        TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
                        CA=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                        SELECTOR='app.kubernetes.io%2Fcomponent%3Dverification'
                        PS=$(curl --fail --silent --show-error --cacert "$CA" \
                          -H "Authorization: Bearer ${TOKEN}" \
                          "${API}/api/v1/namespaces/{{ _backup_ns }}/pods?labelSelector=${SELECTOR}")
                        S="UNKNOWN"
                        echo "$PS" | grep -Eq '"phase"[[:space:]]*:[[:space:]]*"Succeeded"' && S="PASS"
                        echo "$PS" | grep -Eq '"phase"[[:space:]]*:[[:space:]]*"Failed"' && S="FAIL"
                        [ "${ON_FAILURE_ONLY}" = "true" ] && [ "$S" != "FAIL" ] && exit 0
                        C="#36a64f"; [ "$S" = "FAIL" ] && C="#ff0000"
                        curl --fail --silent --show-error -X POST \
                          -H 'Content-type: application/json' \
                          -d "{\"channel\":\"${CHANNEL}\",\"attachments\":[{\"color\":\"${C}\",\"title\":\"Backup: ${S}\",\"text\":\"${TS}\"}]}" \
                          "${WEBHOOK_URL}" || echo "WARN: alert failed"
                    envFrom:
                      - secretRef:
                          name: backup-alert-config
                    resources:
                      requests:
                        cpu: "{{ backup_job_cpu_request | default('100m') }}"
                        memory: "{{ backup_job_memory_request | default('128Mi') }}"
                      limits:
                        cpu: "{{ backup_job_cpu_limit | default('500m') }}"
                        memory: "{{ backup_job_memory_limit | default('512Mi') }}"
  tags: [backup, backup-alerts]
