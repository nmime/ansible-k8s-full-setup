---
# GitLab backups are created by the chart's Toolbox backup-utility CronJob.
# The database component is intentionally excluded there: the external Percona
# cluster is protected by its native, version-matched backup in the same gated
# backup-all run. This avoids coupling GitLab's bundled pg_dump major version
# to the independently managed PostgreSQL major version.
# A separate job protects the Rails encryption secret, which GitLab explicitly
# excludes from the application backup archive.

- name: "Backup-GitLab | Remove obsolete standalone backup CronJob"
  kubernetes.core.k8s:
    state: absent
    api_version: batch/v1
    kind: CronJob
    name: gitlab-backup
    namespace: "{{ backup_gitlab_namespace }}"

- name: "Backup-GitLab | Wait for official Toolbox backup CronJob"
  kubernetes.core.k8s_info:
    api_version: batch/v1
    kind: CronJob
    name: gitlab-toolbox-backup
    namespace: "{{ backup_gitlab_namespace }}"
  register: _gitlab_toolbox_backup_cron
  retries: 12
  delay: 10
  until: (_gitlab_toolbox_backup_cron.resources | default([])) | length == 1

- name: "Backup-GitLab | Create Rails secret backup credentials"
  no_log: true
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: gitlab-rails-backup-credentials
        namespace: "{{ backup_gitlab_namespace }}"
        labels:
          app.kubernetes.io/part-of: backup-restore
          app.kubernetes.io/component: gitlab-rails-secrets
      type: Opaque
      stringData:
        AWS_ACCESS_KEY_ID: "{{ backup_storage_access_key }}"
        AWS_SECRET_ACCESS_KEY: "{{ backup_storage_secret_key }}"
        AWS_ENDPOINT_URL: "{{ backup_storage_endpoint }}"
        AWS_DEFAULT_REGION: "{{ backup_storage_region }}"

- name: "Backup-GitLab | Deploy Rails encryption secret backup CronJob"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: batch/v1
      kind: CronJob
      metadata:
        name: gitlab-rails-secrets-backup
        namespace: "{{ backup_gitlab_namespace }}"
        labels:
          app.kubernetes.io/part-of: backup-restore
          app.kubernetes.io/component: gitlab-rails-secrets
      spec:
        schedule: "{{ _backup_schedule }}"
        timeZone: "{{ backup_cron_timezone }}"
        concurrencyPolicy: Forbid
        successfulJobsHistoryLimit: "{{ backup_cron_successful_jobs_history }}"
        failedJobsHistoryLimit: "{{ backup_cron_failed_jobs_history }}"
        jobTemplate:
          spec:
            ttlSecondsAfterFinished: 600
            backoffLimit: 1
            activeDeadlineSeconds: 900
            template:
              spec:
                restartPolicy: Never
                securityContext:
                  runAsNonRoot: true
                  seccompProfile:
                    type: RuntimeDefault
                containers:
                  - name: backup-rails-secrets
                    image: "{{ backup_s3cli_image }}"
                    securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop: ["ALL"]
                      runAsNonRoot: true
                      runAsUser: 1000
                      runAsGroup: 1000
                    command: [/bin/sh, -c]
                    args:
                      - |
                        set -eu
                        test -s /rails/secrets.yml
                        ts=$(date -u +%Y%m%dT%H%M%SZ)
                        destination="s3://${BACKUP_BUCKET}/${BACKUP_PROJECT}/gitlab-secrets/${ts}-secrets.yml"
                        aws --endpoint-url="$AWS_ENDPOINT_URL" s3 cp /rails/secrets.yml "$destination"
                        aws --endpoint-url="$AWS_ENDPOINT_URL" s3 ls "$destination" >/dev/null
                    env:
                      - name: BACKUP_BUCKET
                        value: "{{ _backup_bucket }}"
                      - name: BACKUP_PROJECT
                        value: "{{ _backup_project }}"
                    envFrom:
                      - secretRef:
                          name: gitlab-rails-backup-credentials
                    volumeMounts:
                      - name: rails-secrets
                        mountPath: /rails
                        readOnly: true
                    resources:
                      requests:
                        cpu: "{{ backup_job_cpu_request }}"
                        memory: "{{ backup_job_memory_request }}"
                      limits:
                        cpu: "{{ backup_job_cpu_limit }}"
                        memory: "{{ backup_job_memory_limit }}"
                volumes:
                  - name: rails-secrets
                    secret:
                      secretName: gitlab-rails-secret
                      items:
                        - key: secrets.yml
                          path: secrets.yml
  tags: [backup, backup-gitlab]
