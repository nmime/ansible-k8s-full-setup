---
backup_storage_type: s3
backup_storage_endpoint: "{{ object_storage_endpoint | default('http://seaweedfs-filer.storage.svc.cluster.local:8333', true) }}"
backup_storage_region: "{{ object_storage_region | default('us-east-1') }}"
backup_storage_bucket: backups
backup_storage_access_key: "{{ object_storage_access_key | default('', true) }}"
backup_storage_secret_key: "{{ object_storage_secret_key | default('', true) }}"
backup_storage_path_style: true
backup_schedule: "0 2 * * *"
backup_retention_days: 30
backup_retention_count: 7
backup_compression: true
backup_namespace: backups
backup_label: backup-restore
backup_project_name: "{{ project_name | default('k8s') }}"
backup_postgresql_enabled: true
backup_postgresql_namespace: databases
backup_postgresql_cluster_name: "{{ backup_project_name }}-pg"
backup_mongodb_enabled: true
backup_mongodb_namespace: databases
backup_mongodb_cluster_name: "{{ backup_project_name }}-mongo"
backup_mongodb_pbm_config_map: pbm-s3-creds
backup_mongodb_verify_after: true
backup_vault_enabled: true
backup_vault_namespace: vault
# Snapshot requests must go directly to the active Raft member. The generic
# Vault service can select a standby, whose redirect produces a truncated
# snapshot archive (missing SHA256SUMS.sealed).
backup_vault_server: "{{ 'http' if vault_tls_disabled | default(false) | bool else 'https' }}://vault-active.{{ backup_vault_namespace }}.svc.cluster.local:8200"
backup_vault_snapshot_bucket: "{{ backup_storage_bucket }}/{{ backup_project_name }}/vault"
backup_vault_snapshot_retention: "{{ backup_retention_days }}"
backup_vault_verify_after: true
backup_seaweedfs_enabled: true
backup_seaweedfs_namespace: "{{ object_storage_namespace | default('storage') }}"
backup_seaweedfs_filer_endpoint: "{{ object_storage_endpoint | default('http://seaweedfs-filer.storage.svc.cluster.local:8333') }}"
backup_seaweedfs_verify_after: true
backup_gitlab_enabled: true
backup_gitlab_namespace: gitlab
backup_gitlab_chart: gitlab
backup_gitlab_verify_after: true
backup_verify_all: true
backup_verification_timeout: 3600
backup_alert_enabled: false
backup_alert_webhook_url: ""
backup_alert_on_failure_only: false
backup_alert_channel: "#alerts"
restore_drill_namespace: restore-drill
restore_drill_auto_cleanup: true
restore_drill_cleanup_after_hours: 24
restore_safety_gate_skip_verification: false
restore_safety_gate_confirm_required: true
backup_cron_timezone: UTC
backup_cron_concurrency_policy: Forbid
backup_cron_successful_jobs_history: 3
backup_cron_failed_jobs_history: 1
backup_job_cpu_request: 100m
backup_job_cpu_limit: 500m
backup_job_memory_request: 128Mi
backup_job_memory_limit: 512Mi
backup_alpine_image: alpine:3.22
backup_curl_image: curlimages/curl:8.21.0
backup_vault_image: "hashicorp/vault:2.0.3"
backup_mongo_image: mongodb/mongodb-community-server:7.0.15
backup_s3cli_image: amazon/aws-cli:2.34.48

# Full-cluster disaster recovery. This target must be outside the Kubernetes
# cluster and outside the SeaweedFS instance it protects. Credentials are
# independently supplied; they are never generated from in-cluster storage.
backup_dr_enabled: false
backup_dr_namespace: velero
backup_dr_storage_endpoint: "{{ lookup('env', 'BACKUP_DR_ENDPOINT') | default('', true) }}"
backup_dr_storage_region: "{{ lookup('env', 'BACKUP_DR_REGION') | default('us-east-1', true) }}"
backup_dr_storage_bucket: "{{ lookup('env', 'BACKUP_DR_BUCKET') | default('', true) }}"
backup_dr_storage_prefix: >-
  {{ lookup('env', 'BACKUP_DR_PREFIX') |
     default(backup_project_name ~ '/velero', true) }}
backup_dr_storage_access_key: "{{ lookup('env', 'BACKUP_DR_ACCESS_KEY') | default('', true) }}"
backup_dr_storage_secret_key: "{{ lookup('env', 'BACKUP_DR_SECRET_KEY') | default('', true) }}"
backup_dr_schedule: "30 2 * * *"
backup_dr_retention_hours: 720
backup_dr_velero_chart_version: "12.1.0"
backup_dr_velero_image_tag: "v1.18.1"
backup_dr_velero_aws_plugin_tag: "v1.14.2"
backup_dr_velero_cpu_request: 100m
backup_dr_velero_cpu_limit: 500m
backup_dr_velero_memory_request: 128Mi
backup_dr_velero_memory_limit: 512Mi
backup_dr_velero_plugin_cpu_request: 5m
backup_dr_velero_plugin_cpu_limit: 100m
backup_dr_velero_plugin_memory_request: 16Mi
backup_dr_velero_plugin_memory_limit: 64Mi
backup_dr_node_agent_cpu_request: 100m
backup_dr_node_agent_cpu_limit: 1
backup_dr_node_agent_memory_request: 256Mi
backup_dr_node_agent_memory_limit: 1Gi
