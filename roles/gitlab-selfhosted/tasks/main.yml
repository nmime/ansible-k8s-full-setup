- name: Set GitLab tier-specific variables
  tags:
    - gitlab-runner
    - gitlab-general-runner
    - gitlab-image-builder-runner
    - gitlab-docker-host-runner
  set_fact:
    gitlab_chart_version: 10.1.2
    gitlab_namespace: gitlab
    gitlab_domain: "{{ gitlab.domain | default('git.' ~ domain, true) }}"
    gitlab_admin_email: "{{ email }}"
    registry_domain: registry.{{ domain }}
    kas_domain: kas.{{ domain }}
    gitlab_mode: '{{ gitlab.mode | default(''light'' if resource_tier in [''minimal'', ''small''] or tier == ''medium'' else ''full'') }}'
    gitlab_webservice_replicas: '{{ gitlab.webservice_replicas | default(1 if resource_tier in [''minimal'', ''small''] else 2) }}'
    gitlab_webservice_max_replicas: '{{ gitlab.webservice_max_replicas | default(10) }}'
    gitlab_webservice_worker_processes: '{{ gitlab.worker_processes | default(2) }}'
    gitlab_webservice_memory_request: '{{ gitlab.webservice_memory_request | default("1Gi" if (gitlab.mode | default("light" if resource_tier in ["minimal", "small"] or tier == "medium" else "full")) == "light" else "2.5Gi") }}'
    gitlab_webservice_memory_limit: '{{ gitlab.webservice_memory_limit | default("2Gi" if (gitlab.mode | default("light" if resource_tier in ["minimal", "small"] or tier == "medium" else "full")) == "light" else "5Gi") }}'
    gitlab_sidekiq_memory_request: '{{ gitlab.sidekiq_memory_request | default("1Gi" if (gitlab.mode | default("light" if resource_tier in ["minimal", "small"] or tier == "medium" else "full")) == "light" else "1.5Gi") }}'
    gitlab_kas_memory_request: '{{ gitlab.kas_memory_request | default("256Mi") }}'
    gitlab_toolbox_cpu_request: '{{ gitlab.toolbox_cpu_request | default("50m") }}'
    gitlab_toolbox_cpu_limit: '{{ gitlab.toolbox_cpu_limit | default("1") }}'
    gitlab_toolbox_memory_request: '{{ gitlab.toolbox_memory_request | default("350M") }}'
    gitlab_toolbox_memory_limit: '{{ gitlab.toolbox_memory_limit | default("2Gi") }}'
    gitlab_sidekiq_replicas: '{{ gitlab.sidekiq_replicas | default(1 if resource_tier in [''minimal'', ''small''] else 2) }}'
    gitlab_sidekiq_max_replicas: '{{ gitlab.sidekiq_max_replicas | default(10) }}'
    gitlab_registry_max_replicas: '{{ gitlab.registry_max_replicas | default(5) }}'
    gitlab_gitaly_storage_size: '{{ gitlab.gitaly_storage_size | default(''10Gi'' if resource_tier == ''minimal'' else ''20Gi'' if resource_tier == ''small'' else ''50Gi'') }}'
    gitlab_backup_persistence_enabled: '{{ gitlab.backup_persistence_enabled | default(true) | bool }}'
    gitlab_backup_persistence_size: '{{ gitlab.backup_persistence_size | default(''50Gi'') }}'
    gitlab_toolbox_backup_suspended: >-
      {{ gitlab.toolbox_backup_suspended | default(false) | bool }}
    gitlab_runner_concurrent: '{{ gitlab_runner_concurrent_jobs | default(10) }}'
    gitlab_runner_namespace: >-
      {{
        gitlab.runner.namespace |
        default(
          'gitlab-ci-general'
          if (gitlab.runner.general_pool_enabled | default(false) | bool)
          else 'gitlab'
        )
      }}
    gitlab_runner_replicas: '{{ gitlab.runner.replicas | default(1) }}'
    gitlab_runner_worker_index: >-
      {{ gitlab.runner.dedicated_worker_index |
         default(gitlab_runner_worker_index | default(0)) }}
    gitlab_general_runner_pool_enabled: >-
      {{ gitlab.runner.general_pool_enabled | default(false) | bool }}
    gitlab_runner_job_resources: >-
      {{ gitlab.runner.job_resources | default({}) }}
    gitlab_runner_cleanup_grace_period_seconds: >-
      {{ gitlab.runner.cleanup_grace_period_seconds | default(5) }}
    gitlab_runner_pod_termination_grace_period_seconds: >-
      {{ gitlab.runner.pod_termination_grace_period_seconds | default(5) }}
    gitlab_runner_cleanup_resources_timeout: >-
      {{ gitlab.runner.cleanup_resources_timeout | default('30s') }}
    gitlab_runner_cache_insecure: >-
      {{ (object_storage_endpoint |
          default('http://seaweedfs-filer.storage.svc.cluster.local:8333'))
         is match('^http://') }}
    gitlab_runner_enabled: '{{ gitlab.runner.enabled | default(gitlab_runner_enabled | default(false)) | bool }}'
    gitlab_image_builder_runner_enabled: >-
      {{ ((gitlab.runner.image_builder | default({})).enabled |
          default(gitlab_image_builder_runner_enabled | default(false))) | bool }}
    gitlab_image_builder_runner_replicas: >-
      {{ (gitlab.runner.image_builder | default({})).replicas |
         default(gitlab_image_builder_runner_replicas | default(1)) }}
    gitlab_image_builder_runner_concurrent: >-
      {{ (gitlab.runner.image_builder | default({})).concurrent_jobs |
         default(gitlab_image_builder_runner_concurrent_jobs | default(1)) }}
    gitlab_image_builder_runner_namespace: >-
      {{ gitlab_image_builder_runner_namespace | default('gitlab-image-builds') }}
    gitlab_docker_host_runner_enabled: >-
      {{ ((gitlab.runner.docker_host | default({})).enabled |
          default(gitlab_docker_host_runner_enabled | default(false))) | bool }}
    gitlab_docker_host_runner_replicas: >-
      {{ (gitlab.runner.docker_host | default({})).replicas |
         default(gitlab_docker_host_runner_replicas | default(1)) }}
    gitlab_docker_host_runner_concurrent: >-
      {{ (gitlab.runner.docker_host | default({})).concurrent_jobs |
         default(gitlab_docker_host_runner_concurrent_jobs | default(1)) }}
    gitlab_docker_host_runner_namespace: >-
      {{ gitlab_docker_host_runner_namespace |
         default('gitlab-docker-builds') }}
    gitlab_docker_host_runner_worker_index: >-
      {{ (gitlab.runner.docker_host | default({})).dedicated_worker_index |
         default(gitlab_docker_host_runner_worker_index | default(0)) }}
    gitlab_public_webservice_enabled: '{{ gitlab.public_webservice_enabled | default(false) | bool }}'
    gitlab_readiness_timeout: '{{ gitlab.readiness_timeout | default(''30m'') }}'
    gitlab_readiness_retries: '{{ gitlab.readiness_retries | default(180) }}'
    gitlab_readiness_delay: '{{ gitlab.readiness_delay | default(10) }}'
    gitlab_progress_deadline_seconds: >-
      {{ gitlab.progress_deadline_seconds | default(1800) }}
- name: Set GitLab compatibility domains
  ansible.builtin.set_fact:
    gitlab_domain_aliases: >-
      {{ gitlab.domain_aliases | default([], true) |
         reject('equalto', gitlab_domain) | unique | list }}
- name: Require a GitLab Runner authentication token when Runner is selected
  tags:
    - gitlab-runner
    - gitlab-general-runner
    - gitlab-image-builder-runner
    - gitlab-docker-host-runner
  ansible.builtin.assert:
    that:
      - vault_encrypt_secrets | default(true) | bool
      - gitlab_runner_token | default('') | string | trim | length > 20
      - gitlab_runner_token | default('') | string is match(
          '^glrt-[A-Za-z0-9_-]+(\.[A-Za-z0-9_-]+)*$')
      - gitlab_runner_concurrent | int > 0
      - gitlab_runner_replicas | int > 0
      - gitlab_runner_worker_index | int >= 0
      - gitlab_runner_worker_index | int <= worker_count | int
      - gitlab_runner_namespace | length <= 63
      - gitlab_runner_namespace is match('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
      - gitlab_runner_namespace != gitlab_namespace
      - gitlab_runner_namespace != gitlab_image_builder_runner_namespace
      - gitlab_runner_namespace != gitlab_docker_host_runner_namespace
      - >-
        not (gitlab_general_runner_pool_enabled | bool) or
        (gitlab_runner_replicas | int) == 2
      - >-
        not (gitlab_general_runner_pool_enabled | bool) or
        (gitlab_runner_concurrent | int) == 1
      - >-
        not (gitlab_general_runner_pool_enabled | bool) or
        gitlab_runner_namespace == 'gitlab-ci-general'
    fail_msg: >-
      gitlab.runner.enabled=true requires a positive runner.concurrent_jobs value,
      an existing GitLab Runner authentication token (glrt-...), and a declared
      HA general pool, when selected, of exactly two managers with one job each. Create an
      instance runner in GitLab Admin > CI/CD > Runners, export
      GITLAB_RUNNER_TOKEN=glrt-..., and rerun the playbook. The token is persisted
      only in the Ansible Vault-encrypted platform secrets file. Legacy runner
      registration tokens are intentionally unsupported.
    quiet: true
  when: gitlab_runner_enabled | bool

- name: Resolve the dedicated CI-build worker
  tags: [gitlab-runner, gitlab-general-runner, gitlab-image-builder-runner]
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Node
    label_selectors:
      - workload.n0xeid.xyz/ci-build=true
  register: _gitlab_ci_build_worker
  when:
    - gitlab_runner_enabled | bool
    - gitlab_runner_worker_index | int > 0

- name: Enforce the dedicated CI-build worker boundary
  tags: [gitlab-runner, gitlab-general-runner, gitlab-image-builder-runner]
  ansible.builtin.assert:
    that:
      - _gitlab_ci_build_worker.resources | length == 1
      - >-
        (_gitlab_ci_build_worker.resources | first).metadata.name ==
        project_name ~ '-worker-' ~ (gitlab_runner_worker_index | string)
      - >-
        ((_gitlab_ci_build_worker.resources | first).spec.taints |
         default([]) |
         selectattr('key', 'equalto', 'workload.n0xeid.xyz/ci-build') |
         selectattr('value', 'equalto', 'true') |
         selectattr('effect', 'equalto', 'NoSchedule') |
         list | length) == 1
    fail_msg: >-
      General and rootless image-build jobs require exactly one dedicated,
      NoSchedule-tainted CI-build node matching the configured worker index.
  when:
    - gitlab_runner_enabled | bool
    - gitlab_runner_worker_index | int > 0
- name: Require a dedicated protected image-builder Runner identity
  tags: [gitlab-runner, gitlab-image-builder-runner]
  ansible.builtin.assert:
    that:
      - gitlab_runner_enabled | bool
      - vault_encrypt_secrets | default(true) | bool
      - gitlab_image_builder_runner_token | default('') |
        string | trim | length > 20
      - gitlab_image_builder_runner_token | default('') | string is match(
          '^glrt-[A-Za-z0-9_-]+(\.[A-Za-z0-9_-]+)*$')
      - gitlab_image_builder_runner_token | string | trim !=
        gitlab_runner_token | string | trim
      - gitlab_image_builder_runner_replicas | int > 0
      - gitlab_image_builder_runner_concurrent | int == 1
    fail_msg: >-
      The rootless image builder requires a distinct protected GitLab Runner
      authentication token, one replica, and exactly one concurrent job. The
      general Runner identity must never receive its Unconfined build-container
      exception.
    quiet: true
  no_log: true
  when: gitlab_image_builder_runner_enabled | bool
- name: Require a dedicated protected Docker-smoke Runner identity
  tags: [gitlab-runner, gitlab-docker-host-runner]
  ansible.builtin.assert:
    that:
      - gitlab_runner_enabled | bool
      - vault_encrypt_secrets | default(true) | bool
      - gitlab_docker_host_runner_token | default('') |
        string | trim | length > 20
      - gitlab_docker_host_runner_token | default('') | string is match(
          '^glrt-[A-Za-z0-9_-]+(\.[A-Za-z0-9_-]+)*$')
      - gitlab_docker_host_runner_token | string | trim !=
        gitlab_runner_token | string | trim
      - gitlab_docker_host_runner_token | string | trim !=
        gitlab_image_builder_runner_token | string | trim
      - gitlab_docker_host_runner_replicas | int > 0
      - gitlab_docker_host_runner_concurrent | int == 1
      - gitlab_docker_host_runner_worker_index | int > 0
      - gitlab_docker_host_runner_worker_index | int <= worker_count | int
    fail_msg: >-
      Docker smoke jobs require a distinct protected Runner identity, one
      replica, exactly one concurrent job, and a valid dedicated worker index.
      Reusing either restricted Runner identity or a shared production worker
      for the privileged DinD service is forbidden.
    quiet: true
  no_log: true
  when: gitlab_docker_host_runner_enabled | bool
- name: Create GitLab namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: '{{ gitlab_namespace }}'
        labels:
          app.kubernetes.io/part-of: gitlab
          pod-security.kubernetes.io/enforce: baseline
          pod-security.kubernetes.io/warn: restricted
  register: _r_create_gitlab_namespace
  retries: 3
  delay: 10
  until: _r_create_gitlab_namespace is not failed
- name: Add GitLab Helm repository
  kubernetes.core.helm_repository:
    name: gitlab
    repo_url: https://charts.gitlab.io/
  register: _r_add_gitlab_helm_repository
  retries: 3
  delay: 10
  until: _r_add_gitlab_helm_repository is not failed
- name: Create dedicated Postal SMTP secret for GitLab
  no_log: true
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: gitlab-smtp
        namespace: '{{ gitlab_namespace }}'
        labels:
          app.kubernetes.io/managed-by: ansible
          app.kubernetes.io/part-of: gitlab
      type: Opaque
      stringData:
        username: '{{ postal_smtp_auth_username }}'
        password: "{{ postal_smtp_credentials['gitlab'] }}"
  when: platform_postal_enabled | default(false) | bool
- name: Create S3 object storage secret for GitLab
  no_log: true
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: gitlab-object-storage
        namespace: '{{ gitlab_namespace }}'
      type: Opaque
      stringData:
        accesskey: "{{ object_storage_gitlab_access_key }}"
        secretkey: "{{ object_storage_gitlab_secret_key }}"
        connection: |
          provider: AWS
          region: us-east-1
          aws_access_key_id: "{{ object_storage_gitlab_access_key }}"
          aws_secret_access_key: "{{ object_storage_gitlab_secret_key }}"
          endpoint: "{{ object_storage_endpoint | default('http://seaweedfs-filer.storage.svc.cluster.local:8333') }}"
          path_style: true
  register: _r_create_s3_object_storage_secret_for_gitl
  retries: 3
  delay: 10
  until: _r_create_s3_object_storage_secret_for_gitl is not failed
- name: Create registry storage secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: gitlab-registry-storage
        namespace: '{{ gitlab_namespace }}'
      type: Opaque
      stringData:
        config: "s3:\n  bucket: gitlab-registry\n  accesskey: \"{{ object_storage_gitlab_access_key }}\"\n  secretkey: \"{{ object_storage_gitlab_secret_key }}\"\n  region: us-east-1\n  regionendpoint: \"{{ object_storage_endpoint | default('http://seaweedfs-filer.storage.svc.cluster.local:8333') }}\"\
          \n  v4auth: true\n  pathstyle: true\n  checksum_disabled: true\n  rootdirectory: /registry\nredirect:\n  disable: true\n"
  register: _r_create_registry_storage_secret
  retries: 3
  delay: 10
  until: _r_create_registry_storage_secret is not failed
  no_log: true
- name: Create external Redis password secret for GitLab
  no_log: true
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: gitlab-redis
        namespace: '{{ gitlab_namespace }}'
      type: Opaque
      stringData:
        redis-password: '{{ dragonfly_password }}'
  register: _r_create_external_redis_password_secret
  retries: 3
  delay: 10
  until: _r_create_external_redis_password_secret is not failed
- name: Check GitLab Helm release status
  ansible.builtin.command: helm status gitlab -n {{ gitlab_namespace }} -o json
  register: _gitlab_helm_status
  failed_when: false
  changed_when: false
- name: Recover a failed GitLab Helm revision without deleting release workloads
  when:
    - _gitlab_helm_status.rc == 0
    - (_gitlab_helm_status.stdout | from_json).info.status | default('') == 'failed'
  block:
    # Helm stores release history in exact sh.helm.release.v1 Secrets. If a
    # previous deployed revision exists, removing only newer failed history
    # records exposes that deployed revision again without uninstalling any
    # controller, Service, Secret, or PVC.
    - name: Discover GitLab Helm release history Secrets
      no_log: true
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        namespace: '{{ gitlab_namespace }}'
        label_selectors:
          - owner=helm
          - name=gitlab
      register: _gitlab_helm_release_secrets

    - name: Classify deployed and failed GitLab Helm revisions
      no_log: true
      ansible.builtin.set_fact:
        _gitlab_deployed_release_secrets: >-
          {{ _gitlab_helm_release_secrets.resources |
             selectattr('metadata.labels.status', 'defined') |
             selectattr('metadata.labels.status', 'equalto', 'deployed') | list }}
        _gitlab_failed_release_secrets: >-
          {{ _gitlab_helm_release_secrets.resources |
             selectattr('metadata.labels.status', 'defined') |
             selectattr('metadata.labels.status', 'equalto', 'failed') | list }}

    - name: Select the prior deployed GitLab Helm revision
      no_log: true
      ansible.builtin.set_fact:
        _gitlab_deployed_release_revision: >-
          {{ (_gitlab_deployed_release_secrets | first).metadata.labels.version | int }}
      when: _gitlab_deployed_release_secrets | length == 1

    - name: Require an unambiguous prior deployed GitLab Helm revision
      ansible.builtin.assert:
        that:
          - (_gitlab_deployed_release_secrets | length) in [0, 1]
        fail_msg: >-
          Refusing failed GitLab release recovery because Helm history has
          {{ _gitlab_deployed_release_secrets | length }} deployed revisions;
          expected at most one exact deployed predecessor.

    - name: Prove every revision newer than the deployed predecessor is failed
      no_log: true
      ansible.builtin.assert:
        that:
          - item.metadata.labels.status == 'failed'
          - item.type == 'helm.sh/release.v1'
          - item.metadata.name == ('sh.helm.release.v1.gitlab.v' ~ item.metadata.labels.version)
          - item.metadata.labels.owner == 'helm'
          - item.metadata.labels.name == 'gitlab'
          - (item.metadata.ownerReferences | default([]) | length) == 0
          - (item.data.release | default('') | length) > 0
        fail_msg: >-
          Refusing failed GitLab release recovery because a post-deployed Helm
          history Secret has an unexpected status, type, identity, or owner.
      loop: '{{ _gitlab_helm_release_secrets.resources }}'
      loop_control:
        label: '{{ item.metadata.name }}'
      when:
        - _gitlab_deployed_release_secrets | length == 1
        - (item.metadata.labels.version | default('0') | int) > (_gitlab_deployed_release_revision | int)

    - name: Require at least one exact failed revision after the deployed predecessor
      ansible.builtin.assert:
        that:
          - >-
            (_gitlab_failed_release_secrets |
             map(attribute='metadata.labels.version') |
             map('int') |
             select('gt', _gitlab_deployed_release_revision | int) |
             list | length) > 0
        fail_msg: >-
          Helm reports GitLab failed, but no exact failed release Secret newer
          than the deployed predecessor was found; refusing recovery.
      when: _gitlab_deployed_release_secrets | length == 1

    - name: Delete only failed GitLab Helm revisions newer than the deployed predecessor
      no_log: true
      kubernetes.core.k8s:
        state: absent
        api_version: v1
        kind: Secret
        namespace: '{{ gitlab_namespace }}'
        name: '{{ item.metadata.name }}'
        delete_options:
          preconditions:
            uid: '{{ item.metadata.uid }}'
            resourceVersion: '{{ item.metadata.resourceVersion }}'
        wait: true
        wait_timeout: 120
      loop: '{{ _gitlab_failed_release_secrets }}'
      loop_control:
        label: '{{ item.metadata.name }}'
      when:
        - _gitlab_deployed_release_secrets | length == 1
        - (item.metadata.labels.version | int) > (_gitlab_deployed_release_revision | int)

    - name: Recheck GitLab Helm status after failed revision cleanup
      ansible.builtin.command: helm status gitlab -n {{ gitlab_namespace }} -o json
      register: _gitlab_recovered_helm_status
      failed_when: false
      changed_when: false
      when: _gitlab_deployed_release_secrets | length == 1

    - name: Require failed revision cleanup to expose the deployed predecessor
      ansible.builtin.assert:
        that:
          - _gitlab_recovered_helm_status.rc == 0
          - >-
            ((_gitlab_recovered_helm_status.stdout | from_json).info.status |
             default('')) == 'deployed'
          - >-
            ((_gitlab_recovered_helm_status.stdout | from_json).version | int) ==
            (_gitlab_deployed_release_revision | int)
        fail_msg: >-
          Failed GitLab history cleanup did not restore the exact prior deployed
          revision; no workload or PVC uninstall was attempted.
      when: _gitlab_deployed_release_secrets | length == 1

    # A failed first installation has no deployed predecessor. Uninstalling is
    # permitted only when no Gitaly resources exist or the one exact Helm pair
    # is Pending, unbound, and never ready. Any data-bearing shape fails closed.
    - name: Discover first-install Gitaly StatefulSets before safe failed-release removal
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: StatefulSet
        namespace: '{{ gitlab_namespace }}'
        label_selectors:
          - release=gitlab
          - app=gitaly
      register: _gitlab_failed_first_install_gitaly_statefulsets
      when: _gitlab_deployed_release_secrets | length == 0

    - name: Discover first-install Gitaly PVCs before safe failed-release removal
      kubernetes.core.k8s_info:
        api_version: v1
        kind: PersistentVolumeClaim
        namespace: '{{ gitlab_namespace }}'
        label_selectors:
          - release=gitlab
          - app=gitaly
      register: _gitlab_failed_first_install_gitaly_pvcs
      when: _gitlab_deployed_release_secrets | length == 0

    - name: Select the exact failed first-install Gitaly pair
      ansible.builtin.set_fact:
        _gitlab_failed_first_install_gitaly_statefulset: >-
          {{ _gitlab_failed_first_install_gitaly_statefulsets.resources | first }}
        _gitlab_failed_first_install_gitaly_pvc: >-
          {{ _gitlab_failed_first_install_gitaly_pvcs.resources | first }}
      when:
        - _gitlab_deployed_release_secrets | length == 0
        - _gitlab_failed_first_install_gitaly_statefulsets.resources | length == 1
        - _gitlab_failed_first_install_gitaly_pvcs.resources | length == 1

    - name: Prove failed first-install Gitaly resources are absent or data-free
      ansible.builtin.assert:
        that:
          - >-
            ((_gitlab_failed_first_install_gitaly_statefulsets.resources | length) == 0 and
             (_gitlab_failed_first_install_gitaly_pvcs.resources | length) == 0) or
            ((_gitlab_failed_first_install_gitaly_statefulsets.resources | length) == 1 and
             (_gitlab_failed_first_install_gitaly_pvcs.resources | length) == 1 and
             _gitlab_failed_first_install_gitaly_statefulset.metadata.name ==
             'gitlab-gitaly' and
             _gitlab_failed_first_install_gitaly_statefulset.metadata.labels.release ==
             'gitlab' and
             _gitlab_failed_first_install_gitaly_statefulset.metadata.labels.app ==
             'gitaly' and
             _gitlab_failed_first_install_gitaly_statefulset.metadata.labels.heritage ==
             'Helm' and
             _gitlab_failed_first_install_gitaly_statefulset.metadata.labels[
             'app.kubernetes.io/managed-by'] == 'Helm' and
             (_gitlab_failed_first_install_gitaly_statefulset.metadata.annotations[
              'meta.helm.sh/release-name'] | default('')) == 'gitlab' and
             (_gitlab_failed_first_install_gitaly_statefulset.metadata.annotations[
              'meta.helm.sh/release-namespace'] | default('')) == gitlab_namespace and
             (_gitlab_failed_first_install_gitaly_statefulset.metadata.ownerReferences |
              default([]) | length) == 0 and
             (_gitlab_failed_first_install_gitaly_statefulset.status.readyReplicas |
              default(0) | int) == 0 and
             _gitlab_failed_first_install_gitaly_pvc.metadata.name ==
             'repo-data-gitlab-gitaly-0' and
             _gitlab_failed_first_install_gitaly_pvc.metadata.labels.release ==
             'gitlab' and
             _gitlab_failed_first_install_gitaly_pvc.metadata.labels.app ==
             'gitaly' and
             (_gitlab_failed_first_install_gitaly_pvc.metadata.ownerReferences |
              default([]) | length) == 0 and
             (_gitlab_failed_first_install_gitaly_pvc.status.phase | default('')) ==
             'Pending' and
             (_gitlab_failed_first_install_gitaly_pvc.spec.volumeName |
              default('') | length) == 0)
        fail_msg: >-
          Refusing to uninstall a failed first GitLab revision because Gitaly
          resources are not absent or an exact never-ready, unbound, data-free
          Helm pair. No workload or PVC was deleted.
      when: _gitlab_deployed_release_secrets | length == 0

    - name: Remove only a proven data-free failed first GitLab release
      kubernetes.core.helm:
        name: gitlab
        release_namespace: '{{ gitlab_namespace }}'
        release_state: absent
        wait: true
      when: _gitlab_deployed_release_secrets | length == 0

    - name: Require data-free failed first release removal to complete
      ansible.builtin.command: helm status gitlab -n {{ gitlab_namespace }} -o json
      register: _gitlab_removed_first_release_status
      failed_when: false
      changed_when: false
      when: _gitlab_deployed_release_secrets | length == 0

    - name: Prove the data-free failed first release is absent
      ansible.builtin.assert:
        that:
          - _gitlab_removed_first_release_status.rc != 0
        fail_msg: >-
          The proven data-free failed first GitLab release was not removed;
          refusing to continue.
      when: _gitlab_deployed_release_secrets | length == 0
- name: Discover failed GitLab database migration Jobs
  kubernetes.core.k8s_info:
    api_version: batch/v1
    kind: Job
    namespace: '{{ gitlab_namespace }}'
    label_selectors:
      - app=migrations
      - release=gitlab
  register: _gitlab_migration_jobs
- name: Remove failed GitLab database migration Jobs before Helm reconcile
  kubernetes.core.k8s:
    state: absent
    api_version: batch/v1
    kind: Job
    namespace: '{{ gitlab_namespace }}'
    name: '{{ item.metadata.name }}'
    wait: true
    wait_timeout: 120
  loop: >-
    {{ _gitlab_migration_jobs.resources |
       selectattr('status.failed', 'defined') |
       selectattr('status.failed', 'gt', 0) | list }}
  loop_control:
    label: '{{ item.metadata.name }}'
- name: Inspect existing Gitaly storage before Helm reconcile
  block:
    - name: Discover existing Gitaly StatefulSets
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: StatefulSet
        namespace: '{{ gitlab_namespace }}'
        label_selectors:
          - release=gitlab
          - app=gitaly
      register: _gitlab_existing_gitaly_statefulsets

    - name: Discover existing Gitaly persistent volume claims
      kubernetes.core.k8s_info:
        api_version: v1
        kind: PersistentVolumeClaim
        namespace: '{{ gitlab_namespace }}'
        label_selectors:
          - release=gitlab
          - app=gitaly
      register: _gitlab_existing_gitaly_pvcs

    - name: Require an unambiguous existing Gitaly storage inventory
      ansible.builtin.assert:
        that:
          - >-
            ((_gitlab_existing_gitaly_statefulsets.resources | length) == 0 and
             (_gitlab_existing_gitaly_pvcs.resources | length) == 0) or
            ((_gitlab_existing_gitaly_statefulsets.resources | length) == 1 and
             (_gitlab_existing_gitaly_pvcs.resources | length) == 1)
        fail_msg: >-
          Refusing automatic Gitaly storage reconciliation: expected either no
          existing release storage or exactly one release=gitlab,app=gitaly
          StatefulSet and PVC, found
          {{ _gitlab_existing_gitaly_statefulsets.resources | length }} StatefulSet(s)
          and {{ _gitlab_existing_gitaly_pvcs.resources | length }} PVC(s).

    - name: Select the exact existing Gitaly storage pair
      ansible.builtin.set_fact:
        _gitlab_existing_gitaly_statefulset: >-
          {{ _gitlab_existing_gitaly_statefulsets.resources | first }}
        _gitlab_existing_gitaly_pvc: >-
          {{ _gitlab_existing_gitaly_pvcs.resources | first }}
        _gitlab_desired_gitaly_storage_class: >-
          {{ storage_class | default('hcloud-volumes') }}
      when: _gitlab_existing_gitaly_statefulsets.resources | length == 1

    # Helm does not add ownerReferences to release objects. Requiring the exact
    # release annotations, chart labels, selector, retention policy, claim
    # template, and retained PVC identity prevents an unrelated or partially
    # adopted StatefulSet from entering either automatic recovery path.
    - name: Prove exact Helm ownership of the existing Gitaly storage pair
      ansible.builtin.assert:
        that:
          - _gitlab_existing_gitaly_statefulset.metadata.name == 'gitlab-gitaly'
          - _gitlab_existing_gitaly_statefulset.metadata.labels.release == 'gitlab'
          - _gitlab_existing_gitaly_statefulset.metadata.labels.app == 'gitaly'
          - _gitlab_existing_gitaly_statefulset.metadata.labels.heritage == 'Helm'
          - _gitlab_existing_gitaly_statefulset.metadata.labels['app.kubernetes.io/managed-by'] == 'Helm'
          - _gitlab_existing_gitaly_statefulset.metadata.labels.chart == ('gitaly-' ~ gitlab_chart_version)
          - _gitlab_existing_gitaly_statefulset.metadata.annotations['meta.helm.sh/release-name'] == 'gitlab'
          - _gitlab_existing_gitaly_statefulset.metadata.annotations['meta.helm.sh/release-namespace'] == gitlab_namespace
          - (_gitlab_existing_gitaly_statefulset.metadata.ownerReferences | default([]) | length) == 0
          - _gitlab_existing_gitaly_statefulset.spec.serviceName == 'gitlab-gitaly'
          - _gitlab_existing_gitaly_statefulset.spec.selector.matchLabels.release == 'gitlab'
          - _gitlab_existing_gitaly_statefulset.spec.selector.matchLabels.app == 'gitaly'
          - _gitlab_existing_gitaly_statefulset.spec.persistentVolumeClaimRetentionPolicy.whenDeleted == 'Retain'
          - _gitlab_existing_gitaly_statefulset.spec.persistentVolumeClaimRetentionPolicy.whenScaled == 'Retain'
          - (_gitlab_existing_gitaly_statefulset.spec.volumeClaimTemplates | length) == 1
          - (_gitlab_existing_gitaly_statefulset.spec.volumeClaimTemplates | first).metadata.name == 'repo-data'
          - (_gitlab_existing_gitaly_statefulset.spec.volumeClaimTemplates | first).metadata.labels.release == 'gitlab'
          - (_gitlab_existing_gitaly_statefulset.spec.volumeClaimTemplates | first).metadata.labels.app == 'gitaly'
          - _gitlab_existing_gitaly_pvc.metadata.name == 'repo-data-gitlab-gitaly-0'
          - _gitlab_existing_gitaly_pvc.metadata.labels.release == 'gitlab'
          - _gitlab_existing_gitaly_pvc.metadata.labels.app == 'gitaly'
          - (_gitlab_existing_gitaly_pvc.metadata.ownerReferences | default([]) | length) == 0
        fail_msg: >-
          Refusing automatic Gitaly immutable-storage recovery because the
          discovered StatefulSet/PVC pair does not have the exact GitLab Helm
          release identity and Retain ownership contract.
      when: _gitlab_existing_gitaly_statefulsets.resources | length == 1

    - name: Classify immutable Gitaly storage size drift
      ansible.builtin.set_fact:
        _gitlab_gitaly_size_mismatched_pvcs: >-
          {{ _gitlab_existing_gitaly_pvcs.resources |
             rejectattr('spec.resources.requests.storage', 'equalto', gitlab_gitaly_storage_size) |
             list }}
        _gitlab_existing_gitaly_ready_replicas: >-
          {{ (((_gitlab_existing_gitaly_statefulsets.resources | first).status.readyReplicas |
               default(0) | int)
              if (_gitlab_existing_gitaly_statefulsets.resources | length > 0)
              else 0) }}
        _gitlab_gitaly_statefulset_template_drift: >-
          {{
            (_gitlab_existing_gitaly_statefulsets.resources | length == 1) and
            (((_gitlab_existing_gitaly_statefulset.spec.volumeClaimTemplates | first).
               spec.resources.requests.storage | default('')) != gitlab_gitaly_storage_size or
             ((_gitlab_existing_gitaly_statefulset.spec.volumeClaimTemplates | first).
               spec.storageClassName | default('', true)) !=
             _gitlab_desired_gitaly_storage_class)
          }}

    # A Pending claim with no volumeName has never had storage attached, so it
    # cannot contain Gitaly data. Any claim that is Bound/Lost or has a volume
    # reference is deliberately rejected and requires an operator-led migration.
    - name: Prove mismatched Gitaly claims are unbound and data-free
      ansible.builtin.assert:
        that:
          - (item.status.phase | default('')) == 'Pending'
          - (item.spec.volumeName | default('') | length) == 0
          - (_gitlab_existing_gitaly_ready_replicas | int) == 0
        fail_msg: >-
          Refusing automatic Gitaly storage replacement for PVC
          {{ item.metadata.name }}: requested={{ item.spec.resources.requests.storage }},
          desired={{ gitlab_gitaly_storage_size }}, phase={{ item.status.phase | default('Unknown') }},
          volume={{ item.spec.volumeName | default('none', true) }},
          ready_replicas={{ _gitlab_existing_gitaly_ready_replicas }}.
          A Bound, previously ready, or otherwise potentially data-bearing Gitaly volume
          requires an explicit backup and operator-led migration.
      loop: '{{ _gitlab_gitaly_size_mismatched_pvcs }}'
      loop_control:
        label: '{{ item.metadata.name }}'

    - name: Remove never-ready Gitaly StatefulSets with immutable storage drift
      kubernetes.core.k8s:
        state: absent
        api_version: apps/v1
        kind: StatefulSet
        namespace: '{{ gitlab_namespace }}'
        name: '{{ item.metadata.name }}'
        wait: true
        wait_timeout: 180
      loop: '{{ _gitlab_existing_gitaly_statefulsets.resources }}'
      loop_control:
        label: '{{ item.metadata.name }}'
      when: _gitlab_gitaly_size_mismatched_pvcs | length > 0

    - name: Remove unbound Gitaly claims with immutable storage drift
      kubernetes.core.k8s:
        state: absent
        api_version: v1
        kind: PersistentVolumeClaim
        namespace: '{{ gitlab_namespace }}'
        name: '{{ item.metadata.name }}'
        wait: true
        wait_timeout: 180
      loop: '{{ _gitlab_gitaly_size_mismatched_pvcs }}'
      loop_control:
        label: '{{ item.metadata.name }}'

    # A Helm values correction can leave a healthy StatefulSet's immutable
    # volumeClaimTemplate stale while its already-bound PVC has the exact
    # desired request and class. Orphaning only that proven Helm StatefulSet
    # lets Helm recreate the controller and adopt its pod/PVC; the data-bearing
    # claim is never deleted or patched.
    - name: Prove bound Gitaly PVC and controller are safe for StatefulSet-only recovery
      ansible.builtin.assert:
        that:
          - (_gitlab_gitaly_size_mismatched_pvcs | length) == 0
          - (_gitlab_existing_gitaly_pvc.status.phase | default('')) == 'Bound'
          - (_gitlab_existing_gitaly_pvc.spec.volumeName | default('') | length) > 0
          - _gitlab_existing_gitaly_pvc.spec.resources.requests.storage == gitlab_gitaly_storage_size
          - _gitlab_existing_gitaly_pvc.status.capacity.storage == gitlab_gitaly_storage_size
          - _gitlab_existing_gitaly_pvc.spec.storageClassName == _gitlab_desired_gitaly_storage_class
          - >-
            ((_gitlab_existing_gitaly_statefulset.spec.replicas | default(1) | int) > 0 and
             (_gitlab_existing_gitaly_statefulset.status.observedGeneration | default(0) | int) >=
             (_gitlab_existing_gitaly_statefulset.metadata.generation | int) and
             (_gitlab_existing_gitaly_statefulset.status.readyReplicas | default(0) | int) ==
             (_gitlab_existing_gitaly_statefulset.spec.replicas | default(1) | int) and
             (_gitlab_existing_gitaly_statefulset.status.currentReplicas | default(0) | int) ==
             (_gitlab_existing_gitaly_statefulset.spec.replicas | default(1) | int) and
             (_gitlab_existing_gitaly_statefulset.status.updatedReplicas | default(0) | int) ==
             (_gitlab_existing_gitaly_statefulset.spec.replicas | default(1) | int) and
             (_gitlab_existing_gitaly_statefulset.status.availableReplicas | default(0) | int) ==
             (_gitlab_existing_gitaly_statefulset.spec.replicas | default(1) | int) and
             (_gitlab_existing_gitaly_statefulset.status.currentRevision | default('') | length) > 0 and
             _gitlab_existing_gitaly_statefulset.status.currentRevision ==
             _gitlab_existing_gitaly_statefulset.status.updateRevision) or
            ((_gitlab_existing_gitaly_statefulset.spec.replicas | default(1) | int) == 0 and
             (_gitlab_existing_gitaly_statefulset.status.readyReplicas | default(0) | int) == 0 and
             (_gitlab_existing_gitaly_statefulset.status.currentReplicas | default(0) | int) == 0 and
             (_gitlab_existing_gitaly_statefulset.status.updatedReplicas | default(0) | int) == 0)
        fail_msg: >-
          Refusing StatefulSet-only Gitaly recovery: the retained PVC is not an
          exact Bound {{ gitlab_gitaly_storage_size }}
          {{ _gitlab_desired_gitaly_storage_class }} claim, or the controller is
          neither fully healthy nor safely scaled to zero. The PVC was not changed.
      when:
        - _gitlab_gitaly_statefulset_template_drift | bool
        - _gitlab_gitaly_size_mismatched_pvcs | length == 0

    - name: Orphan only the drifted Gitaly StatefulSet while retaining its Bound PVC
      kubernetes.core.k8s:
        state: absent
        api_version: apps/v1
        kind: StatefulSet
        namespace: '{{ gitlab_namespace }}'
        name: '{{ _gitlab_existing_gitaly_statefulset.metadata.name }}'
        delete_options:
          propagationPolicy: Orphan
          preconditions:
            uid: '{{ _gitlab_existing_gitaly_statefulset.metadata.uid }}'
            resourceVersion: '{{ _gitlab_existing_gitaly_statefulset.metadata.resourceVersion }}'
        wait: true
        wait_timeout: 180
      when:
        - _gitlab_gitaly_statefulset_template_drift | bool
        - _gitlab_gitaly_size_mismatched_pvcs | length == 0

    - name: Re-read retained Gitaly PVC after StatefulSet orphaning
      kubernetes.core.k8s_info:
        api_version: v1
        kind: PersistentVolumeClaim
        namespace: '{{ gitlab_namespace }}'
        name: '{{ _gitlab_existing_gitaly_pvc.metadata.name }}'
      register: _gitlab_retained_gitaly_pvc
      when:
        - _gitlab_gitaly_statefulset_template_drift | bool
        - _gitlab_gitaly_size_mismatched_pvcs | length == 0

    - name: Prove StatefulSet-only recovery preserved the exact Bound Gitaly PVC
      ansible.builtin.assert:
        that:
          - (_gitlab_retained_gitaly_pvc.resources | length) == 1
          - (_gitlab_retained_gitaly_pvc.resources | first).metadata.uid == _gitlab_existing_gitaly_pvc.metadata.uid
          - (_gitlab_retained_gitaly_pvc.resources | first).status.phase == 'Bound'
          - (_gitlab_retained_gitaly_pvc.resources | first).spec.volumeName == _gitlab_existing_gitaly_pvc.spec.volumeName
          - (_gitlab_retained_gitaly_pvc.resources | first).spec.resources.requests.storage == gitlab_gitaly_storage_size
          - (_gitlab_retained_gitaly_pvc.resources | first).status.capacity.storage == gitlab_gitaly_storage_size
          - (_gitlab_retained_gitaly_pvc.resources | first).spec.storageClassName == _gitlab_desired_gitaly_storage_class
        fail_msg: >-
          StatefulSet orphaning did not preserve the exact Bound Gitaly PVC;
          refusing to continue to Helm reconciliation.
      when:
        - _gitlab_gitaly_statefulset_template_drift | bool
        - _gitlab_gitaly_size_mismatched_pvcs | length == 0
- name: Install GitLab with Helm
  kubernetes.core.helm:
    name: gitlab
    chart_ref: gitlab/gitlab
    chart_version: '{{ gitlab_chart_version }}'
    release_namespace: '{{ gitlab_namespace }}'
    create_namespace: true
    release_state: present
    # Helm 4 uses server-side apply. Reclaim fields previously patched by the
    # platform or older kubectl-based migration tooling before reapplying the
    # chart-owned workload placement contract.
    force_conflicts: true
    timeout: 30m0s
    wait: false
    values:
      global:
        edition: "{{ gitlab_edition | default('ce') }}"
        gitlabVersion: 19.1.2
        # Keep the stateful control plane isolated from GitLab application
        # bursts. The medium-optimized profile has three production workers,
        # so this preserves placement redundancy without adding nodes.
        nodeSelector:
          node-role.kubernetes.io/worker: 'true'
        hosts:
          domain: '{{ domain }}'
          gitlab:
            name: '{{ gitlab_domain }}'
            https: true
          registry:
            name: '{{ registry_domain }}'
            https: true
          kas:
            name: '{{ kas_domain }}'
            https: true
        ingress:
          enabled: false
          configureCertmanager: false
        gatewayApi:
          enabled: false
          installEnvoy: false
          configureCertmanager: false
        time_zone: UTC
        extraEnv:
          PGSSLMODE: verify-full
          PGSSLROOTCERT: /etc/ssl/certs/ca-certificates.crt
        certificates:
          customCAs:
            - secret: gitlab-postgresql-password
              keys:
                - ca.crt
        email:
          from: gitlab@{{ domain }}
          display_name: GitLab
          reply_to: noreply@{{ domain }}
        smtp:
          enabled: '{{ platform_postal_enabled | default(false) | bool }}'
          address: '{{ postal_submission_hostname }}'
          port: 587
          domain: '{{ domain }}'
          authentication: plain
          starttls_auto: true
          openssl_verify_mode: peer
          user_name_secret:
            secret: gitlab-smtp
            key: username
          password:
            secret: gitlab-smtp
            key: password
        psql:
          host: >-
            {{
              (databases.postgresql.service_alias ~ '.databases.svc.cluster.local')
              if (databases.postgresql.service_alias | default('') | length > 0)
              else
              ((project_name | default('k8s')) ~ '-pg-pgbouncer.databases.svc.cluster.local')
            }}
          port: 5432
          database: gitlabhq_production
          username: gitlab
          password:
            secret: gitlab-postgresql-password
            key: postgresql-password
          preparedStatements: false
        redis:
          host: dragonfly.dragonfly.svc.cluster.local
          port: 6379
          auth:
            enabled: true
            secret: gitlab-redis
            key: redis-password
        railsSecrets:
          secret: gitlab-rails-secret
        registry:
          enabled: true
          bucket: gitlab-registry
        appConfig:
          initialDefaults:
            signupEnabled: false
          registry:
            enabled: true
          object_store:
            enabled: true
            proxy_download: true
            connection:
              secret: gitlab-object-storage
              key: connection
          lfs:
            enabled: true
            bucket: gitlab-lfs
          artifacts:
            enabled: true
            bucket: gitlab-artifacts
          uploads:
            enabled: true
            bucket: gitlab-uploads
          packages:
            enabled: true
            bucket: gitlab-packages
          terraformState:
            enabled: true
            bucket: gitlab-terraform-state
          ciSecureFiles:
            enabled: true
            bucket: gitlab-ci-secure-files
          dependencyProxy:
            enabled: true
            bucket: gitlab-dependency-proxy
          backups:
            bucket: gitlab-backups
            tmpBucket: gitlab-tmp
      gitlab:
        webservice:
          init:
            resources:
              requests: {cpu: 10m, memory: 16Mi}
              limits: {cpu: 100m, memory: 64Mi}
          replicaCount: '{{ gitlab_webservice_replicas | int }}'
          minReplicas: '{{ gitlab_webservice_replicas | int }}'
          maxReplicas: '{{ gitlab_webservice_max_replicas | int }}'
          deployment:
            strategy:
              type: RollingUpdate
              rollingUpdate:
                maxUnavailable: 0
                maxSurge: 1
          topologySpreadConstraints:
            - maxSkew: 1
              minDomains: 2
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              nodeAffinityPolicy: Honor
              nodeTaintsPolicy: Honor
              labelSelector:
                matchExpressions:
                  - key: release
                    operator: In
                    values:
                      - gitlab
                  - key: app
                    operator: In
                    values:
                      - webservice
                      - sidekiq
          resources:
            requests:
              cpu: '{{ ''100m'' if gitlab_mode == ''light'' else ''300m'' }}'
              memory: '{{ gitlab_webservice_memory_request }}'
            limits:
              cpu: '{{ ''1500m'' if gitlab_mode == ''light'' else ''2000m'' }}'
              memory: '{{ gitlab_webservice_memory_limit }}'
          workhorse:
            resources:
              requests: {cpu: 50m, memory: 64Mi}
              limits: {cpu: 500m, memory: 256Mi}
          workerProcesses: '{{ gitlab_webservice_worker_processes | int }}'
        sidekiq:
          init:
            resources:
              requests: {cpu: 10m, memory: 16Mi}
              limits: {cpu: 100m, memory: 64Mi}
          replicaCount: '{{ gitlab_sidekiq_replicas | int }}'
          minReplicas: '{{ gitlab_sidekiq_replicas | int }}'
          maxReplicas: '{{ gitlab_sidekiq_max_replicas | int }}'
          deployment:
            strategy:
              type: RollingUpdate
              rollingUpdate:
                maxUnavailable: 0
                maxSurge: 1
          topologySpreadConstraints:
            - maxSkew: 1
              minDomains: 2
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              nodeAffinityPolicy: Honor
              nodeTaintsPolicy: Honor
              labelSelector:
                matchExpressions:
                  - key: release
                    operator: In
                    values:
                      - gitlab
                  - key: app
                    operator: In
                    values:
                      - webservice
                      - sidekiq
          resources:
            requests:
              cpu: '{{ ''50m'' if gitlab_mode == ''light'' else ''200m'' }}'
              memory: '{{ gitlab_sidekiq_memory_request }}'
            limits:
              cpu: '{{ ''1000m'' if gitlab_mode == ''light'' else ''1500m'' }}'
              memory: '{{ ''2Gi'' if gitlab_mode == ''light'' else ''3Gi'' }}'
        gitlab-shell:
          init:
            resources:
              requests: {cpu: 10m, memory: 16Mi}
              limits: {cpu: 100m, memory: 64Mi}
          replicaCount: '{{ gitlab_webservice_replicas | int }}'
          minReplicas: '{{ gitlab_webservice_replicas | int }}'
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
        gitaly:
          init:
            resources:
              requests: {cpu: 10m, memory: 16Mi}
              limits: {cpu: 100m, memory: 64Mi}
          # Gitaly is an intentional singleton. The chart always renders its
          # PDB, so fail safe: voluntary eviction must not remove the only pod.
          # Operators must explicitly migrate/scale or temporarily override
          # this gate for planned maintenance; this is not node-failure HA.
          maxUnavailable: 0
          persistence:
            enabled: true
            size: '{{ gitlab_gitaly_storage_size }}'
            storageClass: '{{ storage_class | default(''hcloud-volumes'') }}'
          resources:
            requests:
              cpu: '{{ ''50m'' if gitlab_mode == ''light'' else ''200m'' }}'
              memory: '{{ ''256Mi'' if gitlab_mode == ''light'' else ''512Mi'' }}'
            limits:
              cpu: '{{ ''1000m'' if gitlab_mode == ''light'' else ''1500m'' }}'
              memory: '{{ ''1Gi'' if gitlab_mode == ''light'' else ''2Gi'' }}'
        kas:
          enabled: true
          init:
            resources:
              requests: {cpu: 10m, memory: 16Mi}
              limits: {cpu: 100m, memory: 64Mi}
          minReplicas: '{{ gitlab_webservice_replicas | int }}'
          resources:
            requests:
              cpu: 50m
              memory: '{{ gitlab_kas_memory_request }}'
            limits:
              cpu: 500m
              memory: 1Gi
        toolbox:
          enabled: true
          init:
            resources:
              requests: {cpu: 10m, memory: 16Mi}
              limits: {cpu: 100m, memory: 64Mi}
          resources:
            requests:
              cpu: '{{ gitlab_toolbox_cpu_request }}'
              memory: '{{ gitlab_toolbox_memory_request }}'
            limits:
              cpu: '{{ gitlab_toolbox_cpu_limit }}'
              memory: '{{ gitlab_toolbox_memory_limit }}'
          extraEnvFrom:
            AWS_ACCESS_KEY_ID:
              secretKeyRef:
                name: gitlab-object-storage
                key: accesskey
            AWS_SECRET_ACCESS_KEY:
              secretKeyRef:
                name: gitlab-object-storage
                key: secretkey
          extraEnv:
            AWS_DEFAULT_REGION: us-east-1
            AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
          backups:
            objectStorage:
              backend: s3
              config:
                secret: gitlab-object-storage
                key: connection
            cron:
              enabled: '{{ platform_backup_enabled | default(backup_enabled) | bool }}'
              schedule: '{{ backup_schedule }}'
              timeZone: '{{ backup_cron_timezone }}'
              concurrencyPolicy: Forbid
              successfulJobsHistoryLimit: 3
              failedJobsHistoryLimit: 1
              resources:
                requests: {cpu: 50m, memory: 128Mi}
                limits: {cpu: 500m, memory: 1Gi}
              extraArgs: >-
                --skip db
                --s3tool awscli
                --aws-s3-endpoint-url {{ object_storage_endpoint }}
              persistence:
                # Backups are streamed to object storage; persistent scratch
                # remains the safe default but can be disabled explicitly for
                # quota-constrained clusters.
                enabled: '{{ gitlab_backup_persistence_enabled | bool }}'
                storageClass: '{{ storage_class | default(''hcloud-volumes'') }}'
                size: '{{ gitlab_backup_persistence_size }}'
        gitlab-exporter:
          init:
            resources:
              requests: {cpu: 10m, memory: 16Mi}
              limits: {cpu: 100m, memory: 64Mi}
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 250m, memory: 256Mi}
        migrations:
          init:
            resources:
              requests: {cpu: 10m, memory: 16Mi}
              limits: {cpu: 100m, memory: 64Mi}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 1, memory: 1Gi}
      registry:
        enabled: true
        init:
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
        replicaCount: '{{ gitlab_webservice_replicas | int }}'
        hpa:
          minReplicas: '{{ gitlab_webservice_replicas | int }}'
          maxReplicas: '{{ gitlab_registry_max_replicas | int }}'
        storage:
          secret: gitlab-registry-storage
          key: config
        maintenance:
          gc:
            disabled: false
            schedule: 0 4 * * 0
        resources:
          requests:
            cpu: '{{ ''25m'' if gitlab_mode == ''light'' else ''50m'' }}'
            memory: '{{ ''32Mi'' if gitlab_mode == ''light'' else ''64Mi'' }}'
          limits:
            cpu: 500m
            memory: 256Mi
      upgradeCheck:
        resources:
          requests: {cpu: 10m, memory: 16Mi}
          limits: {cpu: 100m, memory: 64Mi}
      prometheus:
        install: false
      grafana:
        install: false
      installCertmanager: false
      nginx-ingress:
        enabled: false
      gitlab-runner:
        install: false
      shared-secrets:
        enabled: true
        resources:
          requests: {cpu: 10m, memory: 16Mi}
          limits: {cpu: 100m, memory: 128Mi}
        rbac:
          create: true
  when: tier is defined and tier | default('medium') in ['minimal', 'small', 'medium', 'production']
  register: _r_install_gitlab_ce_with_helm
  retries: 3
  delay: 10
  until: _r_install_gitlab_ce_with_helm is not failed
- name: Enforce the GitLab toolbox backup operational gate
  kubernetes.core.k8s:
    state: patched
    definition:
      apiVersion: batch/v1
      kind: CronJob
      metadata:
        namespace: '{{ gitlab_namespace }}'
        name: gitlab-toolbox-backup
      spec:
        suspend: '{{ gitlab_toolbox_backup_suspended | bool }}'
  register: _r_patch_gitlab_toolbox_backup_gate
  retries: 3
  delay: 10
  until: _r_patch_gitlab_toolbox_backup_gate is not failed
  when: platform_backup_enabled | default(backup_enabled) | bool
- name: Discover the GitLab toolbox backup scratch claim
  kubernetes.core.k8s_info:
    api_version: v1
    kind: PersistentVolumeClaim
    namespace: '{{ gitlab_namespace }}'
    name: gitlab-toolbox-backup-tmp
  register: _gitlab_toolbox_backup_scratch_pvc
  when: gitlab_backup_persistence_enabled | bool

- name: Require the persistent GitLab toolbox backup scratch claim
  ansible.builtin.assert:
    that:
      - (_gitlab_toolbox_backup_scratch_pvc.resources | default([]) | length) == 1
    fail_msg: >-
      GitLab backup scratch persistence is enabled, but the exact
      gitlab-toolbox-backup-tmp PersistentVolumeClaim is absent or ambiguous.
  when: gitlab_backup_persistence_enabled | bool

- name: Mark the GitLab toolbox claim as backup lifecycle scratch
  kubernetes.core.k8s:
    state: patched
    definition:
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        namespace: '{{ gitlab_namespace }}'
        name: gitlab-toolbox-backup-tmp
        labels:
          platform.n0xeid.xyz/backup-scratch: 'true'
  when: gitlab_backup_persistence_enabled | bool

- name: Enforce GitLab post-reconcile readiness
  block:
    - name: Discover data-bearing GitLab persistent volume claims
      kubernetes.core.k8s_info:
        api_version: v1
        kind: PersistentVolumeClaim
        namespace: '{{ gitlab_namespace }}'
        label_selectors:
          - release=gitlab
          - app=gitaly
      register: _gitlab_selected_pvcs

    - name: Require data-bearing GitLab persistent volume claims to exist
      ansible.builtin.assert:
        that:
          - (_gitlab_selected_pvcs.resources | default([]) | length) > 0
        fail_msg: >-
          No release=gitlab,app=gitaly PersistentVolumeClaims were found in namespace
          {{ gitlab_namespace }}; refusing to report a successful GitLab reconcile.

    # The toolbox backup scratch claim intentionally uses WaitForFirstConsumer
    # and has no consumer until a backup Job runs. Waiting on every release PVC
    # would therefore deadlock an otherwise healthy first installation.
    - name: Wait for data-bearing GitLab persistent volume claims to be Bound
      ansible.builtin.command:
        argv:
          - kubectl
          - wait
          - --namespace
          - '{{ gitlab_namespace }}'
          - --for=jsonpath={.status.phase}=Bound
          - --selector=release=gitlab,app=gitaly
          - persistentvolumeclaim
          - '--timeout={{ gitlab_readiness_timeout }}'
      changed_when: false

    - name: Define required GitLab controllers
      ansible.builtin.set_fact:
        _gitlab_required_controllers:
          - kind: StatefulSet
            app: gitaly
          - kind: Deployment
            app: webservice
          - kind: Deployment
            app: sidekiq
          - kind: Deployment
            app: toolbox

    - name: Discover required GitLab controllers by stable chart labels
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: '{{ item.kind }}'
        namespace: '{{ gitlab_namespace }}'
        label_selectors:
          - release=gitlab
          - 'app={{ item.app }}'
      loop: '{{ _gitlab_required_controllers }}'
      loop_control:
        label: '{{ item.kind }}/app={{ item.app }}'
      register: _gitlab_required_controller_discovery

    - name: Require every critical GitLab controller to exist
      ansible.builtin.assert:
        that:
          - (item.resources | default([]) | length) > 0
        fail_msg: >-
          Required GitLab {{ item.item.kind }} with labels
          release=gitlab,app={{ item.item.app }} was not found in namespace
          {{ gitlab_namespace }}.
        quiet: true
      loop: '{{ _gitlab_required_controller_discovery.results }}'
      loop_control:
        label: '{{ item.item.kind }}/app={{ item.item.app }}'

    # GitLab's Rails init containers can legitimately take more than the
    # Kubernetes default 600 seconds on the resource-bounded production
    # profile. Keep the deployment controller's own failure deadline aligned
    # with this role's bounded readiness window.
    - name: Align GitLab Deployment progress deadlines with bounded readiness
      kubernetes.core.k8s:
        state: patched
        definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            namespace: '{{ gitlab_namespace }}'
            name: '{{ (item.resources | first).metadata.name }}'
          spec:
            progressDeadlineSeconds: '{{ gitlab_progress_deadline_seconds | int }}'
      loop: '{{ _gitlab_required_controller_discovery.results }}'
      loop_control:
        label: 'Deployment/app={{ item.item.app }}'
      when: item.item.kind == 'Deployment'

    # Polling the observed controller state is resilient to a transient watch
    # disconnect through the controller's SSH API tunnel. Success still
    # requires every desired replica to be observed, updated and ready; a
    # disconnected API cannot be mistaken for readiness.
    - name: Wait boundedly for all critical GitLab controllers to be current and ready
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - '{{ item.kind | lower }}'
          - --namespace
          - '{{ gitlab_namespace }}'
          - '--selector=release=gitlab,app={{ item.app }}'
          - --output=json
          - --request-timeout=20s
      register: _gitlab_controller_readiness
      until:
        - (_gitlab_controller_readiness.rc | default(1) | int) == 0
        - >-
          (((_gitlab_controller_readiness.stdout |
             default('{"items":[]}', true) | from_json)['items'] |
            default([]) | length) == 1)
        - >-
          ((((_gitlab_controller_readiness.stdout |
              default('{"items":[]}', true) | from_json)['items'] |
             first).status.observedGeneration | default(0) | int) >=
           (((_gitlab_controller_readiness.stdout |
              default('{"items":[]}', true) | from_json)['items'] |
             first).metadata.generation | int))
        - >-
          ((((_gitlab_controller_readiness.stdout |
              default('{"items":[]}', true) | from_json)['items'] |
             first).status.readyReplicas | default(0) | int) ==
           (((_gitlab_controller_readiness.stdout |
              default('{"items":[]}', true) | from_json)['items'] |
             first).spec.replicas | int))
        - >-
          ((((_gitlab_controller_readiness.stdout |
              default('{"items":[]}', true) | from_json)['items'] |
             first).status.updatedReplicas | default(0) | int) ==
           (((_gitlab_controller_readiness.stdout |
              default('{"items":[]}', true) | from_json)['items'] |
             first).spec.replicas | int))
        - >-
          item.kind != 'Deployment' or
          (((((_gitlab_controller_readiness.stdout |
               default('{"items":[]}', true) | from_json)['items'] |
              first).status.availableReplicas | default(0) | int) ==
            (((_gitlab_controller_readiness.stdout |
               default('{"items":[]}', true) | from_json)['items'] |
              first).spec.replicas | int)))
        - >-
          item.kind != 'StatefulSet' or
          (((((_gitlab_controller_readiness.stdout |
               default('{"items":[]}', true) | from_json)['items'] |
              first).status.currentRevision | default('')) ==
            (((_gitlab_controller_readiness.stdout |
               default('{"items":[]}', true) | from_json)['items'] |
              first).status.updateRevision | default('missing'))))
      retries: '{{ gitlab_readiness_retries | int }}'
      delay: '{{ gitlab_readiness_delay | int }}'
      changed_when: false
      loop: '{{ _gitlab_required_controllers }}'
      loop_control:
        label: '{{ item.kind }}/app={{ item.app }}'

    - name: Require hard per-component topology spread for GitLab Rails workloads
      ansible.builtin.assert:
        that:
          - >-
            (((item.resources | first).spec.template.spec.topologySpreadConstraints |
              default([])) | length) == 1
          - >-
            ((item.resources | first).spec.template.spec.topologySpreadConstraints |
              first).topologyKey == 'kubernetes.io/hostname'
          - >-
            (((item.resources | first).spec.template.spec.topologySpreadConstraints |
              first).maxSkew | int) == 1
          - >-
            (((item.resources | first).spec.template.spec.topologySpreadConstraints |
              first).minDomains | default(0) | int) == 2
          - >-
            ((item.resources | first).spec.template.spec.topologySpreadConstraints |
              first).whenUnsatisfiable == 'DoNotSchedule'
          - >-
            ((item.resources | first).spec.template.spec.topologySpreadConstraints |
              first).nodeAffinityPolicy == 'Honor'
          - >-
            ((item.resources | first).spec.template.spec.topologySpreadConstraints |
              first).nodeTaintsPolicy == 'Honor'
          - >-
            ((item.resources | first).spec.template.spec.nodeSelector[
              'node-role.kubernetes.io/worker'] | default('missing')) == 'true'
          - >-
            ((((item.resources | first).spec.template.spec.topologySpreadConstraints |
              first).labelSelector.matchExpressions |
              selectattr('key', 'equalto', 'app') |
              map(attribute='values') | first | default([])) ==
             ['webservice', 'sidekiq'])
        fail_msg: >-
          GitLab {{ item.item.app }} does not have the required hard,
          per-component hostname topology spread; refusing to report a
          successful reconcile that can co-locate its two-replica floor.
        quiet: true
      loop: '{{ _gitlab_required_controller_discovery.results }}'
      loop_control:
        label: 'Deployment/app={{ item.item.app }}'
      when: item.item.app in ['webservice', 'sidekiq']

    - name: Discover ready GitLab Rails pods after controller convergence
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        namespace: '{{ gitlab_namespace }}'
        label_selectors:
          - release=gitlab
          - app in (webservice,sidekiq)
      register: _gitlab_rails_pods

    - name: Classify ready GitLab Rails pod placement
      ansible.builtin.set_fact:
        _gitlab_ready_rails_pods: >-
          {{
            _gitlab_rails_pods.resources |
            rejectattr('metadata.deletionTimestamp', 'defined') |
            selectattr('status.phase', 'defined') |
            selectattr('status.phase', 'equalto', 'Running') |
            selectattr('spec.nodeName', 'defined') | list
          }}
        _gitlab_ready_rails_nodes: >-
          {{
            _gitlab_rails_pods.resources |
            rejectattr('metadata.deletionTimestamp', 'defined') |
            selectattr('status.phase', 'defined') |
            selectattr('status.phase', 'equalto', 'Running') |
            selectattr('spec.nodeName', 'defined') |
            map(attribute='spec.nodeName') | unique | list
          }}

    # During a rolling Helm upgrade, terminating predecessor pods can
    # temporarily satisfy topology spread and leave the final Webservice and
    # Sidekiq floor co-located. Recreate one Sidekiq pod only when the converged
    # Rails floor is actually on one node; unlike a controller patch this is
    # conditional and idempotent on every subsequent reconcile.
    - name: Select one Sidekiq pod for conditional post-upgrade rebalance
      ansible.builtin.set_fact:
        _gitlab_sidekiq_rebalance_pod: >-
          {{
            _gitlab_ready_rails_pods |
            selectattr('metadata.labels.app', 'equalto', 'sidekiq') | first
          }}
      when:
        - _gitlab_ready_rails_pods | length >= 2
        - _gitlab_ready_rails_nodes | length == 1

    - name: Recreate one co-located Sidekiq pod after a rolling upgrade
      kubernetes.core.k8s:
        state: absent
        api_version: v1
        kind: Pod
        namespace: '{{ gitlab_namespace }}'
        name: '{{ _gitlab_sidekiq_rebalance_pod.metadata.name }}'
        wait: true
        wait_timeout: 180
      when:
        - _gitlab_ready_rails_pods | length >= 2
        - _gitlab_ready_rails_nodes | length == 1

    - name: Wait for Sidekiq after conditional post-upgrade rebalance
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        namespace: '{{ gitlab_namespace }}'
        name: gitlab-sidekiq-all-in-1-v2
      register: _gitlab_sidekiq_rebalanced
      until: >-
        ((_gitlab_sidekiq_rebalanced.resources | default([]) | length) == 1) and
        (((_gitlab_sidekiq_rebalanced.resources | first).status.observedGeneration |
          default(0) | int) >=
         ((_gitlab_sidekiq_rebalanced.resources | first).metadata.generation | int)) and
        (((_gitlab_sidekiq_rebalanced.resources | first).status.readyReplicas |
          default(0) | int) ==
         ((_gitlab_sidekiq_rebalanced.resources | first).spec.replicas | int))
      retries: 90
      delay: 10
      when:
        - _gitlab_ready_rails_pods | length >= 2
        - _gitlab_ready_rails_nodes | length == 1

    - name: Rediscover GitLab Rails pods after conditional rebalance
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        namespace: '{{ gitlab_namespace }}'
        label_selectors:
          - release=gitlab
          - app in (webservice,sidekiq)
      register: _gitlab_rebalanced_rails_pods

    - name: Require the ready GitLab Rails floor to span workers
      ansible.builtin.assert:
        that:
          - >-
            (_gitlab_rebalanced_rails_pods.resources |
             rejectattr('metadata.deletionTimestamp', 'defined') |
             selectattr('status.phase', 'defined') |
             selectattr('status.phase', 'equalto', 'Running') |
             selectattr('spec.nodeName', 'defined') | list | length) >= 2
          - >-
            (_gitlab_rebalanced_rails_pods.resources |
             rejectattr('metadata.deletionTimestamp', 'defined') |
             selectattr('status.phase', 'defined') |
             selectattr('status.phase', 'equalto', 'Running') |
             selectattr('spec.nodeName', 'defined') |
             map(attribute='spec.nodeName') | unique | list | length) >= 2
        fail_msg: >-
          The converged GitLab Webservice and Sidekiq floor is not ready across
          at least two worker nodes; refusing to report a production-ready
          reconcile.
        quiet: true

    - name: Discover singleton Gitaly PodDisruptionBudget
      kubernetes.core.k8s_info:
        api_version: policy/v1
        kind: PodDisruptionBudget
        namespace: '{{ gitlab_namespace }}'
        name: gitlab-gitaly
      register: _gitlab_gitaly_pdb

    - name: Require the singleton Gitaly PodDisruptionBudget to exist
      ansible.builtin.assert:
        that:
          - (_gitlab_gitaly_pdb.resources | default([]) | length) == 1
        fail_msg: >-
          The chart-managed gitlab-gitaly PodDisruptionBudget was not found;
          refusing to report a successful singleton Gitaly reconcile.

    - name: Require the singleton Gitaly disruption budget to fail safe
      ansible.builtin.assert:
        that:
          - ((_gitlab_gitaly_pdb.resources | first).spec.maxUnavailable | int) == 0
          - (_gitlab_gitaly_pdb.resources | first).spec.minAvailable is not defined
        fail_msg: >-
          gitlab-gitaly must retain maxUnavailable=0 with no competing
          minAvailable value so voluntary disruption cannot remove its only pod.

  rescue:
    - name: Collect sanitized GitLab PVC readiness metadata
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - persistentvolumeclaim
          - --namespace
          - '{{ gitlab_namespace }}'
          - --selector=release=gitlab
          - --no-headers
          - >-
            --output=custom-columns=NAME:.metadata.name,PHASE:.status.phase,
            REQUEST:.spec.resources.requests.storage,STORAGECLASS:.spec.storageClassName,
            VOLUME:.spec.volumeName
      register: _gitlab_readiness_pvc_metadata
      changed_when: false
      failed_when: false

    - name: Collect sanitized GitLab controller readiness metadata
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - deployment,statefulset
          - --namespace
          - '{{ gitlab_namespace }}'
          - '--selector=release=gitlab,app in (gitaly,webservice,sidekiq,toolbox)'
          - --no-headers
          - >-
            --output=custom-columns=KIND:.kind,NAME:.metadata.name,APP:.metadata.labels.app,
            DESIRED:.spec.replicas,READY:.status.readyReplicas,
            AVAILABLE:.status.availableReplicas,UPDATED:.status.updatedReplicas
      register: _gitlab_readiness_controller_metadata
      changed_when: false
      failed_when: false

    - name: Collect sanitized GitLab warning event metadata
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - event
          - --namespace
          - '{{ gitlab_namespace }}'
          - --field-selector=type=Warning
          - --sort-by=.metadata.creationTimestamp
          - --no-headers
          - >-
            --output=custom-columns=LAST:.lastTimestamp,REASON:.reason,
            OBJECT_KIND:.involvedObject.kind,OBJECT_NAME:.involvedObject.name,COUNT:.count
      register: _gitlab_readiness_warning_events
      changed_when: false
      failed_when: false

    - name: Fail closed when GitLab is not fully ready
      ansible.builtin.fail:
        msg: |-
          GitLab post-reconcile readiness gate failed at "{{ ansible_failed_task.name }}".
          No Secret data, container environment, or event messages are included below.

          PersistentVolumeClaims (name, phase, request, storage class, volume):
          {{ _gitlab_readiness_pvc_metadata.stdout | default('unavailable', true) }}

          Critical controllers (kind, name, app, desired, ready, available, updated):
          {{ _gitlab_readiness_controller_metadata.stdout | default('unavailable', true) }}

          Warning events (last timestamp, reason, object kind, object name, count):
          {{ _gitlab_readiness_warning_events.stdout | default('none', true) }}
- name: Discover the in-cluster GitLab Shell service
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Service
    namespace: '{{ gitlab_namespace }}'
    name: gitlab-gitlab-shell
  register: gitlab_shell_service
  retries: 30
  delay: 5
  until:
    - gitlab_shell_service.resources | default([]) | length == 1
    - gitlab_shell_service.resources[0].spec.clusterIP | default('') | length > 0
- name: Record the in-cluster GitLab Shell address for GitOps
  ansible.builtin.set_fact:
    gitlab_shell_cluster_ip: '{{ gitlab_shell_service.resources[0].spec.clusterIP }}'
- name: Allow Argo CD repository access to GitLab Shell
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: allow-argocd-to-gitlab-shell
        namespace: '{{ gitlab_namespace }}'
      spec:
        podSelector:
          matchLabels:
            app: gitlab-shell
        policyTypes:
          - Ingress
        ingress:
          - from:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: argocd
                podSelector:
                  matchLabels:
                    app.kubernetes.io/name: argocd-repo-server
            ports:
              - port: 2222
                protocol: TCP
- name: Allow Argo CD repository access in the Cilium policy plane
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: allow-argocd-to-gitlab-shell
        namespace: '{{ gitlab_namespace }}'
      spec:
        endpointSelector:
          matchLabels:
            app: gitlab-shell
        ingress:
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: argocd
                  k8s:app.kubernetes.io/name: argocd-repo-server
            toPorts:
              - ports:
                  - port: '2222'
                    protocol: TCP
- name: Disable public GitLab self-registration before publishing the webservice
  ansible.builtin.command:
    argv:
      - kubectl
      - exec
      - --namespace
      - '{{ gitlab_namespace }}'
      - deployment/gitlab-toolbox
      - --container
      - toolbox
      - --
      - gitlab-rails
      - runner
      - >-
        settings = ApplicationSetting.current;
        changed = settings.signup_enabled;
        settings.update!(signup_enabled: false) if changed;
        puts "changed=#{changed};signup_enabled=#{ApplicationSetting.current.signup_enabled}"
  register: _gitlab_disable_public_signup
  changed_when: "'changed=true' in _gitlab_disable_public_signup.stdout"
  failed_when: "'signup_enabled=false' not in _gitlab_disable_public_signup.stdout"
  when: gitlab_public_webservice_enabled | bool
- name: Replace the generated GitLab root email placeholder
  ansible.builtin.command:
    argv:
      - kubectl
      - exec
      - --namespace
      - '{{ gitlab_namespace }}'
      - deployment/gitlab-toolbox
      - --container
      - toolbox
      - --
      - gitlab-rails
      - runner
      - >-
        user = User.find_by_username!("root");
        desired = {{ gitlab_admin_email | to_json }};
        placeholder = user.email.to_s.end_with?("@example.com");
        changed = placeholder && user.email != desired;
        if changed then
          user.email = desired;
          user.skip_reconfirmation!;
          user.save!;
        end;
        puts "changed=#{changed};email=#{user.email}"
  register: _gitlab_root_email_reconcile
  changed_when: "'changed=true' in _gitlab_root_email_reconcile.stdout"
  failed_when: >-
    _gitlab_root_email_reconcile.rc != 0 or
    (
      'changed=true' in _gitlab_root_email_reconcile.stdout and
      ('email=' + gitlab_admin_email) not in
      _gitlab_root_email_reconcile.stdout
    )
- name: Create private GitLab Gateway API HTTPRoute
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: gitlab-webservice
        namespace: '{{ gitlab_namespace }}'
      spec:
        parentRefs:
        - name: admin-gateway
          namespace: cilium-system
          sectionName: https
        - name: admin-gateway
          namespace: cilium-system
          sectionName: cluster-https
        hostnames: '{{ [gitlab_domain] + gitlab_domain_aliases }}'
        rules:
        - matches:
          - path:
              type: PathPrefix
              value: /
          backendRefs:
          - name: gitlab-webservice-default
            port: 8181
  register: _r_create_gitlab_gateway_api_httproute_vpn_
  retries: 3
  delay: 10
  until: _r_create_gitlab_gateway_api_httproute_vpn_ is not failed
- name: Publish the canonical GitLab hostname through the main Gateway
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: gitlab-webservice-public
        namespace: '{{ gitlab_namespace }}'
      spec:
        parentRefs:
        - name: main-gateway
          namespace: cilium-system
          sectionName: https
        hostnames:
        - '{{ gitlab_domain }}'
        rules:
        - matches:
          - path:
              type: PathPrefix
              value: /
          backendRefs:
          - name: gitlab-webservice-default
            port: 8181
  when: gitlab_public_webservice_enabled | bool
- name: Remove the public GitLab route when public access is disabled
  kubernetes.core.k8s:
    state: absent
    api_version: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    name: gitlab-webservice-public
    namespace: '{{ gitlab_namespace }}'
  when: not gitlab_public_webservice_enabled | bool
- name: Create GitLab Registry HTTPRoute (VPN-only via admin-gateway)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: gitlab-registry
        namespace: '{{ gitlab_namespace }}'
      spec:
        parentRefs:
        - name: admin-gateway
          namespace: cilium-system
          sectionName: https
        hostnames:
        - '{{ registry_domain }}'
        rules:
        - matches:
          - path:
              type: PathPrefix
              value: /
          backendRefs:
          - name: gitlab-registry
            port: 5000
  register: _r_create_gitlab_registry_httproute
  retries: 3
  delay: 10
  until: _r_create_gitlab_registry_httproute is not failed
- name: Create GitLab KAS HTTPRoute (VPN-only via admin-gateway)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: gitlab-kas
        namespace: '{{ gitlab_namespace }}'
      spec:
        parentRefs:
        - name: admin-gateway
          namespace: cilium-system
          sectionName: https
        hostnames:
        - '{{ kas_domain }}'
        rules:
        - matches:
          - path:
              type: PathPrefix
              value: /
          backendRefs:
          - name: gitlab-kas
            port: 8150
  register: _r_create_gitlab_kas_httproute_vpn_only_via
  retries: 3
  delay: 10
  until: _r_create_gitlab_kas_httproute_vpn_only_via is not failed
- name: Create TLS Certificate for GitLab
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cert-manager.io/v1
      kind: Certificate
      metadata:
        name: gitlab-tls
        namespace: cilium-secrets
      spec:
        secretName: gitlab-tls
        issuerRef:
          name: '{{ cert_manager_cluster_issuer }}'
          kind: ClusterIssuer
        dnsNames: >-
          {{ [gitlab_domain, registry_domain, kas_domain] +
             gitlab_domain_aliases }}
  register: _r_create_tls_certificate_for_gitlab
  retries: 3
  delay: 10
  until: _r_create_tls_certificate_for_gitlab is not failed
- name: Discover the dedicated build CI node for the general Runner pool
  tags: [gitlab-runner, gitlab-general-runner]
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Node
    label_selectors:
      - workload.n0xeid.xyz/ci-build=true
  register: _gitlab_general_pool_build_nodes
  when:
    - gitlab_runner_enabled | bool
    - gitlab_general_runner_pool_enabled | bool

- name: Discover the dedicated Docker CI node for the general Runner pool
  tags: [gitlab-runner, gitlab-general-runner]
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Node
    label_selectors:
      - workload.n0xeid.xyz/ci-docker=true
  register: _gitlab_general_pool_docker_nodes
  when:
    - gitlab_runner_enabled | bool
    - gitlab_general_runner_pool_enabled | bool

- name: Require two distinct dedicated nodes for the general Runner pool
  tags: [gitlab-runner, gitlab-general-runner]
  ansible.builtin.assert:
    that:
      - (_gitlab_general_pool_build_nodes.resources | default([]) | length) == 1
      - (_gitlab_general_pool_docker_nodes.resources | default([]) | length) == 1
      - >-
        (_gitlab_general_pool_build_nodes.resources | first).metadata.name !=
        (_gitlab_general_pool_docker_nodes.resources | first).metadata.name
    fail_msg: >-
      The HA general Runner pool requires one ci-build node and one distinct
      ci-docker node. Refusing to collapse managers and jobs onto one host.
    quiet: true
  when:
    - gitlab_runner_enabled | bool
    - gitlab_general_runner_pool_enabled | bool

- name: Resolve the two-node general Runner pool membership
  tags: [gitlab-runner, gitlab-general-runner]
  ansible.builtin.set_fact:
    _gitlab_general_pool_node_names: >-
      {{
        [
          (_gitlab_general_pool_build_nodes.resources | first).metadata.name,
          (_gitlab_general_pool_docker_nodes.resources | first).metadata.name
        ] | unique | list
      }}
  when:
    - gitlab_runner_enabled | bool
    - gitlab_general_runner_pool_enabled | bool

- name: Discover all nodes before reconciling general Runner pool membership
  tags: [gitlab-runner, gitlab-general-runner]
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Node
  register: _gitlab_general_pool_all_nodes
  when:
    - gitlab_runner_enabled | bool
    - gitlab_general_runner_pool_enabled | bool

- name: Reconcile the two-node general Runner pool label
  tags: [gitlab-runner, gitlab-general-runner]
  kubernetes.core.k8s:
    state: present
    merge_type: merge
    definition:
      apiVersion: v1
      kind: Node
      metadata:
        name: '{{ item }}'
        labels:
          workload.n0xeid.xyz/ci-general: 'true'
  loop: '{{ _gitlab_general_pool_node_names }}'
  loop_control:
    label: '{{ item }}'
  when:
    - gitlab_runner_enabled | bool
    - gitlab_general_runner_pool_enabled | bool

- name: Remove stale general Runner pool labels from all other nodes
  tags: [gitlab-runner, gitlab-general-runner]
  kubernetes.core.k8s:
    state: present
    merge_type: merge
    definition:
      apiVersion: v1
      kind: Node
      metadata:
        name: '{{ item.metadata.name }}'
        labels:
          workload.n0xeid.xyz/ci-general: null
  loop: '{{ _gitlab_general_pool_all_nodes.resources }}'
  loop_control:
    label: '{{ item.metadata.name }}'
  when:
    - gitlab_runner_enabled | bool
    - gitlab_general_runner_pool_enabled | bool
    - item.metadata.name not in _gitlab_general_pool_node_names
    - >-
      'workload.n0xeid.xyz/ci-general' in
      (item.metadata.labels | default({}))

- name: Establish the isolated general CI Runner boundary
  tags: [gitlab-runner, gitlab-general-runner]
  ansible.builtin.include_tasks:
    file: general-runner-boundary.yml
    apply:
      tags: [gitlab-runner, gitlab-general-runner]
  when: gitlab_runner_enabled | bool
- name: Read the persisted GitLab Runner authentication token
  tags: [gitlab-runner, gitlab-general-runner]
  no_log: true
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    namespace: '{{ gitlab_runner_namespace }}'
    name: platform-gitlab-runner-auth
  register: _gitlab_runner_auth_secret
  when: gitlab_runner_enabled | bool
- name: Read the legacy GitLab Runner authentication token for migration
  tags: [gitlab-runner, gitlab-general-runner]
  no_log: true
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    namespace: '{{ gitlab_namespace }}'
    name: platform-gitlab-runner-auth
  register: _gitlab_runner_legacy_auth_secret
  when:
    - gitlab_runner_enabled | bool
    - gitlab_runner_namespace != gitlab_namespace
    - _gitlab_runner_auth_secret.resources | default([]) | length == 0
- name: Resolve the persisted GitLab Runner authentication token candidate
  tags: [gitlab-runner, gitlab-general-runner]
  no_log: true
  ansible.builtin.set_fact:
    _gitlab_runner_auth_candidate: >-
      {{
        ((_gitlab_runner_auth_secret.resources | first).data['runner-token'] |
         b64decode)
        if (_gitlab_runner_auth_secret.resources | default([]) | length) == 1
        else (
          (((_gitlab_runner_legacy_auth_secret |
             default({'resources': []})).resources | first).
           data['runner-token'] | b64decode)
          if (((_gitlab_runner_legacy_auth_secret |
               default({'resources': []})).resources |
              default([]) | length) == 1)
          else ''
        )
      }}
  when: gitlab_runner_enabled | bool
- name: Verify the persisted GitLab Runner identity
  tags: [gitlab-runner, gitlab-general-runner]
  no_log: true
  ansible.builtin.shell: |
    set -euo pipefail
    status=$(printf '%s' "$GITLAB_RUNNER_TOKEN" |
      kubectl exec -i --namespace "{{ gitlab_namespace }}" \
        deployment/gitlab-toolbox -c toolbox -- sh -ec '
          token=$(cat)
          payload=$(printf \
            "{\"token\":\"%s\",\"system_id\":\"s_ansible_k8s_reconcile\"}" \
            "$token")
          printf "%s" "$payload" |
            curl -sS -o /dev/null -w "%{http_code}" \
              -H "Content-Type: application/json" --data-binary @- \
              http://gitlab-webservice-default.{{ gitlab_namespace }}.svc:8181/api/v4/runners/verify
        ')
    test "$status" = 200
  args:
    executable: /bin/bash
  environment:
    GITLAB_RUNNER_TOKEN: '{{ _gitlab_runner_auth_candidate }}'
  register: _gitlab_runner_auth_verification
  changed_when: false
  failed_when: false
  when:
    - gitlab_runner_enabled | bool
    - _gitlab_runner_auth_candidate | length > 0
- name: Verify the declared GitLab Runner identity after persisted-token drift
  tags: [gitlab-runner, gitlab-general-runner]
  no_log: true
  ansible.builtin.shell: |
    set -euo pipefail
    status=$(printf '%s' "$GITLAB_RUNNER_TOKEN" |
      kubectl exec -i --namespace "{{ gitlab_namespace }}" \
        deployment/gitlab-toolbox -c toolbox -- sh -ec '
          token=$(cat)
          payload=$(printf \
            "{\"token\":\"%s\",\"system_id\":\"s_ansible_k8s_reconcile\"}" \
            "$token")
          printf "%s" "$payload" |
            curl -sS -o /dev/null -w "%{http_code}" \
              -H "Content-Type: application/json" --data-binary @- \
              http://gitlab-webservice-default.{{ gitlab_namespace }}.svc:8181/api/v4/runners/verify
        ')
    test "$status" = 200
  args:
    executable: /bin/bash
  environment:
    GITLAB_RUNNER_TOKEN: '{{ gitlab_runner_token | string | trim }}'
  register: _gitlab_runner_declared_verification
  changed_when: false
  failed_when: false
  when:
    - gitlab_runner_enabled | bool
    - >-
      (_gitlab_runner_auth_verification.rc | default(1) | int) != 0
- name: Reject an invalid declared GitLab Runner identity
  tags: [gitlab-runner, gitlab-general-runner]
  no_log: true
  ansible.builtin.assert:
    that:
      - (_gitlab_runner_declared_verification.rc | default(1) | int) == 0
    fail_msg: >-
      The persisted GitLab Runner identity is stale and the declarative glrt-
      authentication token is not valid. Rotate GITLAB_RUNNER_TOKEN in the
      encrypted project secrets and rerun; legacy registration-token bootstrap
      is intentionally forbidden.
  when:
    - gitlab_runner_enabled | bool
    - >-
      (_gitlab_runner_auth_verification.rc | default(1) | int) != 0
- name: Resolve the reconciled GitLab Runner authentication token
  tags: [gitlab-runner, gitlab-general-runner]
  no_log: true
  ansible.builtin.set_fact:
    _gitlab_runner_auth_token: >-
      {{
        _gitlab_runner_auth_candidate
        if (_gitlab_runner_auth_verification.rc | default(1) | int) == 0
        else (gitlab_runner_token | string | trim)
      }}
  when: gitlab_runner_enabled | bool
- name: Persist the reconciled GitLab Runner authentication token
  tags: [gitlab-runner, gitlab-general-runner]
  no_log: true
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: platform-gitlab-runner-auth
        namespace: '{{ gitlab_runner_namespace }}'
        labels:
          app.kubernetes.io/managed-by: ansible
      type: Opaque
      stringData:
        runner-token: '{{ _gitlab_runner_auth_token }}'
  when: gitlab_runner_enabled | bool
- name: Add GitLab Runner Helm repository
  tags:
    - gitlab-runner
    - gitlab-general-runner
    - gitlab-image-builder-runner
    - gitlab-docker-host-runner
  kubernetes.core.helm_repository:
    name: gitlab-runner
    repo_url: https://charts.gitlab.io/
  register: _r_add_gitlab_runner_helm_repository
  retries: 3
  delay: 10
  until: _r_add_gitlab_runner_helm_repository is not failed
  when: gitlab_runner_enabled | bool
- name: Create S3 cache secret for GitLab Runner
  tags: [gitlab-runner, gitlab-general-runner]
  no_log: true
  when: gitlab_runner_enabled | bool
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: gitlab-runner-s3-cache
        namespace: '{{ gitlab_runner_namespace }}'
        labels:
          app.kubernetes.io/managed-by: ansible
          workload.n0xeid.xyz/trust-boundary: general-ci
      type: Opaque
      stringData:
        accesskey: '{{ object_storage_ci_cache_access_key }}'
        secretkey: '{{ object_storage_ci_cache_secret_key }}'
  register: _r_create_s3_cache_secret_for_gitlab_runner
  retries: 3
  delay: 10
  until: _r_create_s3_cache_secret_for_gitlab_runner is not failed
- name: Install GitLab Runner with Helm
  tags: [gitlab-runner, gitlab-general-runner]
  kubernetes.core.helm:
    name: gitlab-runner
    chart_ref: gitlab/gitlab-runner
    chart_version: 0.91.0
    release_namespace: '{{ gitlab_runner_namespace }}'
    create_namespace: false
    release_state: present
    force_conflicts: true
    wait: true
    values:
      # The public Gateway is VPN-only, so in-cluster runners must register and
      # clone through the namespace-local Webservice instead of hairpinning
      # through the external load balancer (which intentionally returns 404).
      gitlabUrl: http://gitlab-webservice-default.{{ gitlab_namespace }}.svc:8181
      runnerToken: '{{ _gitlab_runner_auth_token }}'
      replicas: '{{ gitlab_runner_replicas | int }}'
      # Each manager may long-poll concurrently, while the per-runner TOML
      # limit below preserves exactly one active job per manager.
      concurrent: '{{ [gitlab_runner_concurrent | int, 2] | max }}'
      checkInterval: 3
      strategy:
        type: RollingUpdate
        rollingUpdate:
          # Each manager has a local `limit = 1`. A surge replica therefore
          # becomes an unintended third execution slot before it is Ready.
          # Replace one manager at a time instead; the chart's one-hour
          # termination grace lets GitLab Runner drain its active job first.
          maxSurge: 0
          maxUnavailable: 1
      terminationGracePeriodSeconds: 3600
      shutdown_timeout: 3300
      podLabels:
        workload.n0xeid.xyz/component: gitlab-runner-manager
      affinity:
        podAntiAffinity:
          # The hard topology-spread rule below keeps the steady two replicas
          # on distinct nodes. Keep anti-affinity preferred so a one-at-a-time
          # replacement can return to either isolated CI worker.
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    workload.n0xeid.xyz/component: gitlab-runner-manager
                topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          minDomains: 2
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeAffinityPolicy: Honor
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              workload.n0xeid.xyz/component: gitlab-runner-manager
      podDisruptionBudget:
        maxUnavailable: 1
      metrics:
        enabled: true
      rbac:
        create: true
        clusterWideAccess: false
      serviceAccount:
        create: true
      nodeSelector: >-
        {{
          {'workload.n0xeid.xyz/ci-general': 'true'}
          if gitlab_general_runner_pool_enabled | bool
          else (
            {'workload.n0xeid.xyz/ci-build': 'true'}
            if gitlab_runner_worker_index | default(0) | int > 0
            else {'node-role.kubernetes.io/worker': 'true'}
          )
        }}
      tolerations: >-
        {{
          (
            [
              {
                'key': 'workload.n0xeid.xyz/ci-build',
                'operator': 'Equal',
                'value': 'true',
                'effect': 'NoSchedule'
              },
              {
                'key': 'workload.n0xeid.xyz/ci-docker',
                'operator': 'Equal',
                'value': 'true',
                'effect': 'NoSchedule'
              }
            ]
            if gitlab_general_runner_pool_enabled | bool
            else (
              [
                {
                  'key': 'workload.n0xeid.xyz/ci-build',
                  'operator': 'Equal',
                  'value': 'true',
                  'effect': 'NoSchedule'
                }
              ]
              if gitlab_runner_worker_index | default(0) | int > 0
              else []
            )
          )
        }}
      podSecurityContext:
        runAsUser: 100
        fsGroup: 65533
        seccompProfile:
          type: RuntimeDefault
      runners:
        config: |
          [[runners]]
            clone_url = "http://gitlab-webservice-default.{{ gitlab_namespace }}.svc:8181"
            request_concurrency = {{ [gitlab_runner_concurrent | int, 2] | max }}
            limit = {{ gitlab_runner_concurrent | int }}
            cache_dir = "/tmp/cache"
            # Restricted jobs run as a numeric UID that may not exist in the
            # image passwd database. Give Git and the helper a writable HOME
            # so source checkout never falls back to the read-only root path.
            environment = ["HOME=/tmp", "FF_USE_ADVANCED_POD_SPEC_CONFIGURATION=true"]
            [runners.kubernetes]
              namespace = "{{ gitlab_runner_namespace }}"
              image = "ubuntu:22.04"
              cleanup_grace_period_seconds = {{ gitlab_runner_cleanup_grace_period_seconds | int }}
              pod_termination_grace_period_seconds = {{ gitlab_runner_pod_termination_grace_period_seconds | int }}
              cleanup_resources_timeout = "{{ gitlab_runner_cleanup_resources_timeout }}"
          {% if gitlab_general_runner_pool_enabled | default(false) %}
              # General non-privileged jobs run only on the two isolated CI
              # workers and tolerate each node's narrow dedicated taint.
              node_selector = { "workload.n0xeid.xyz/ci-general" = "true" }
              node_tolerations = { "workload.n0xeid.xyz/ci-build=true" = "NoSchedule", "workload.n0xeid.xyz/ci-docker=true" = "NoSchedule" }
          {% elif gitlab_runner_worker_index | default(0) | int > 0 %}
              node_selector = { "workload.n0xeid.xyz/ci-build" = "true" }
              node_tolerations = { "workload.n0xeid.xyz/ci-build=true" = "NoSchedule" }
          {% else %}
              node_selector = { "node-role.kubernetes.io/worker" = "true" }
          {% endif %}
              privileged = false
              allow_privilege_escalation = false
              cap_drop = ["ALL"]
              automount_service_account_token = false
              logs_base_dir = "/tmp"
              scripts_base_dir = "/tmp"
              cpu_request = "{{ gitlab_runner_job_resources.cpu_request | default(gitlab_runner_cpu_request) }}"
              cpu_limit = "{{ gitlab_runner_job_resources.cpu_limit | default(gitlab_runner_cpu_limit) }}"
              memory_request = "{{ gitlab_runner_job_resources.memory_request | default(gitlab_runner_memory_request) }}"
              memory_limit = "{{ gitlab_runner_job_resources.memory_limit | default(gitlab_runner_memory_limit) }}"
              service_cpu_request = "{{ gitlab_runner_job_resources.service_cpu_request | default(gitlab_runner_service_cpu_request) }}"
              service_cpu_limit = "{{ gitlab_runner_job_resources.service_cpu_limit | default(gitlab_runner_service_cpu_limit) }}"
              service_memory_request = "{{ gitlab_runner_job_resources.service_memory_request | default(gitlab_runner_service_memory_request) }}"
              service_memory_limit = "{{ gitlab_runner_job_resources.service_memory_limit | default(gitlab_runner_service_memory_limit) }}"
              helper_cpu_request = "{{ gitlab_runner_job_resources.helper_cpu_request | default(gitlab_runner_helper_cpu_request) }}"
              helper_cpu_limit = "{{ gitlab_runner_job_resources.helper_cpu_limit | default(gitlab_runner_helper_cpu_limit) }}"
              helper_memory_request = "{{ gitlab_runner_job_resources.helper_memory_request | default(gitlab_runner_helper_memory_request) }}"
              helper_memory_limit = "{{ gitlab_runner_job_resources.helper_memory_limit | default(gitlab_runner_helper_memory_limit) }}"
              [runners.kubernetes.pod_security_context]
                [runners.kubernetes.pod_security_context.seccomp_profile]
                  type = "RuntimeDefault"
              [runners.kubernetes.pod_labels]
                "workload.n0xeid.xyz/class" = "ci-job"
              [[runners.kubernetes.pod_spec]]
                name = "spread-ci-jobs-across-workers"
                patch = '''
                  affinity:
                    podAntiAffinity:
                      requiredDuringSchedulingIgnoredDuringExecution:
                        - labelSelector:
                            matchLabels:
                              workload.n0xeid.xyz/class: protected-docker-smoke-job
                          # Pod affinity terms default to the current namespace.
                          # Protected jobs live in a separate namespace, so name
                          # it explicitly or this hard anti-affinity is a no-op.
                          namespaces:
                            - "{{ gitlab_docker_host_runner_namespace }}"
                          topologyKey: kubernetes.io/hostname
                  topologySpreadConstraints:
                    - maxSkew: 1
                      topologyKey: kubernetes.io/hostname
                      # CI must keep making progress when a worker is tainted,
                      # under disk pressure, or reserved for protected builds.
                      # The scheduler still prefers an even spread, but an
                      # unavailable domain must not deadlock the whole queue.
                      whenUnsatisfiable: ScheduleAnyway
                      nodeAffinityPolicy: Honor
                      nodeTaintsPolicy: Honor
                      labelSelector:
                        matchLabels:
                          workload.n0xeid.xyz/class: ci-job
                '''
                patch_type = "strategic"
            [runners.cache]
              Type = "s3"
              Path = "gitlab-runner"
              Shared = true
              [runners.cache.s3]
                ServerAddress = "{{ object_storage_endpoint_hostport |
                                     default('seaweedfs-filer.storage.svc.cluster.local:8333') }}"
                BucketName = "gitlab-runner-cache"
                BucketLocation = "us-east-1"
                Insecure = {{ gitlab_runner_cache_insecure |
                              default(true) | lower }}
        cache:
          secretName: gitlab-runner-s3-cache
        tags: kubernetes,k8s
        runUntagged: true
      podAnnotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '9252'
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 256Mi
  when: gitlab_runner_enabled | bool
  no_log: true
  register: _r_install_gitlab_runner_with_helm
  retries: 3
  delay: 10
  until: _r_install_gitlab_runner_with_helm is not failed
- name: Wait for the enabled GitLab Runner deployment to converge
  tags: [gitlab-runner, gitlab-general-runner]
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    namespace: '{{ gitlab_runner_namespace }}'
    name: gitlab-runner
  register: _gitlab_runner_deployment
  until: >-
    ((_gitlab_runner_deployment.resources | default([]) | length) == 1) and
    (((_gitlab_runner_deployment.resources | first).status.observedGeneration |
      default(0) | int) >=
     ((_gitlab_runner_deployment.resources | first).metadata.generation | int)) and
    (((_gitlab_runner_deployment.resources | first).status.readyReplicas |
      default(0) | int) ==
     ((_gitlab_runner_deployment.resources | first).spec.replicas | int)) and
    (((_gitlab_runner_deployment.resources | first).status.availableReplicas |
      default(0) | int) ==
     ((_gitlab_runner_deployment.resources | first).spec.replicas | int)) and
    (((_gitlab_runner_deployment.resources | first).status.updatedReplicas |
      default(0) | int) ==
     ((_gitlab_runner_deployment.resources | first).spec.replicas | int))
  retries: 60
  delay: 10
  when: gitlab_runner_enabled | bool

- name: Read the converged general Runner manager pods
  tags: [gitlab-runner, gitlab-general-runner]
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: '{{ gitlab_runner_namespace }}'
    label_selectors:
      - app=gitlab-runner
  register: _gitlab_general_runner_manager_pods
  until: >-
    ((_gitlab_general_runner_manager_pods.resources | default([]) | length) == 2) and
    ((_gitlab_general_runner_manager_pods.resources |
      map(attribute='spec.nodeName') | unique | sort | list) ==
     (_gitlab_general_pool_node_names | sort | list)) and
    ((_gitlab_general_runner_manager_pods.resources |
      rejectattr('status.phase', 'equalto', 'Running') | list | length) == 0)
  retries: 60
  delay: 10
  when:
    - gitlab_runner_enabled | bool
    - gitlab_general_runner_pool_enabled | bool

- name: Read the converged general Runner rendered configuration
  tags: [gitlab-runner, gitlab-general-runner]
  kubernetes.core.k8s_info:
    api_version: v1
    kind: ConfigMap
    namespace: '{{ gitlab_runner_namespace }}'
    name: gitlab-runner
  register: _gitlab_general_runner_configmap
  when:
    - gitlab_runner_enabled | bool
    - gitlab_general_runner_pool_enabled | bool

- name: Require the converged general Runner to remain on the isolated two-node pool
  tags: [gitlab-runner, gitlab-general-runner]
  ansible.builtin.assert:
    that:
      - ((_gitlab_runner_deployment.resources | first).spec.replicas | int) == 2
      - >-
        ((_gitlab_runner_deployment.resources | first).spec.strategy.rollingUpdate.maxSurge |
         int) == 0
      - >-
        ((_gitlab_runner_deployment.resources | first).spec.strategy.rollingUpdate.maxUnavailable |
         int) == 1
      - >-
        ((_gitlab_runner_deployment.resources | first).spec.template.spec.nodeSelector |
         default({})).get('workload.n0xeid.xyz/ci-general', '') == 'true'
      - >-
        ((_gitlab_runner_deployment.resources | first).spec.template.spec.tolerations |
         selectattr('key', 'equalto', 'workload.n0xeid.xyz/ci-build') |
         selectattr('value', 'equalto', 'true') |
         selectattr('effect', 'equalto', 'NoSchedule') | list | length) == 1
      - >-
        ((_gitlab_runner_deployment.resources | first).spec.template.spec.tolerations |
         selectattr('key', 'equalto', 'workload.n0xeid.xyz/ci-docker') |
         selectattr('value', 'equalto', 'true') |
         selectattr('effect', 'equalto', 'NoSchedule') | list | length) == 1
      - (_gitlab_general_runner_manager_pods.resources | default([]) | length) == 2
      - >-
        ((_gitlab_general_runner_manager_pods.resources |
          map(attribute='spec.nodeName') | unique | sort | list) ==
         (_gitlab_general_pool_node_names | sort | list))
      - >-
        (_gitlab_general_runner_manager_pods.resources |
         rejectattr('status.phase', 'equalto', 'Running') | list | length) == 0
      - (_gitlab_general_runner_configmap.resources | default([]) | length) == 1
      - >-
        'node_selector = { "workload.n0xeid.xyz/ci-general" = "true" }' in
        ((_gitlab_general_runner_configmap.resources | first).data['config.template.toml'] |
         default(''))
      - >-
        '"workload.n0xeid.xyz/ci-build=true" = "NoSchedule"' in
        ((_gitlab_general_runner_configmap.resources | first).data['config.template.toml'] |
         default(''))
      - >-
        '"workload.n0xeid.xyz/ci-docker=true" = "NoSchedule"' in
        ((_gitlab_general_runner_configmap.resources | first).data['config.template.toml'] |
         default(''))
      - >-
        'limit = 1' in
        ((_gitlab_general_runner_configmap.resources | first).data['config.template.toml'] |
         default(''))
    fail_msg: >-
      The general Runner converged without its two-node isolation contract.
      Refusing to accept generic-worker placement or extra execution slots.
    quiet: true
  when:
    - gitlab_runner_enabled | bool
    - gitlab_general_runner_pool_enabled | bool

- name: Require the general Runner process to load its registered configuration
  tags: [gitlab-runner, gitlab-general-runner]
  ansible.builtin.command:
    argv:
      - kubectl
      - exec
      - --namespace
      - '{{ gitlab_runner_namespace }}'
      - deployment/gitlab-runner
      - --
      - sh
      - -ec
      - >-
        test -s /home/gitlab-runner/.gitlab-runner/config.toml &&
        grep -q '^\[\[runners\]\]' /home/gitlab-runner/.gitlab-runner/config.toml &&
        pgrep -f 'gitlab-runner run' >/dev/null
  register: _gitlab_runner_registered_process
  changed_when: false
  retries: 18
  delay: 10
  until: _gitlab_runner_registered_process.rc == 0
  when: gitlab_runner_enabled | bool
- name: Deploy the isolated protected image-builder Runner
  tags: [gitlab-runner, gitlab-image-builder-runner]
  ansible.builtin.include_tasks:
    file: image-builder-runner.yml
    apply:
      tags: [gitlab-runner, gitlab-image-builder-runner]
  when: gitlab_image_builder_runner_enabled | bool
- name: Deploy the isolated protected Docker-smoke Runner
  tags: [gitlab-runner, gitlab-docker-host-runner]
  ansible.builtin.include_tasks:
    file: docker-host-runner.yml
    apply:
      tags: [gitlab-runner, gitlab-docker-host-runner]
  when: gitlab_docker_host_runner_enabled | bool
- name: Check for active jobs on the legacy general Runner
  tags: [gitlab-runner, gitlab-general-runner]
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: '{{ gitlab_namespace }}'
    label_selectors:
      - workload.n0xeid.xyz/class=ci-job
    field_selectors:
      - status.phase!=Succeeded
      - status.phase!=Failed
  register: _gitlab_legacy_runner_active_jobs
  when:
    - gitlab_runner_enabled | bool
    - gitlab_runner_namespace != gitlab_namespace
- name: Refuse to interrupt active jobs during general Runner migration
  tags: [gitlab-runner, gitlab-general-runner]
  ansible.builtin.assert:
    that:
      - _gitlab_legacy_runner_active_jobs.resources | default([]) | length == 0
    fail_msg: >-
      The replacement general Runner is ready, but the legacy namespace still
      contains active CI job pods. Let them finish and rerun; migration will
      never terminate an in-flight job.
  when:
    - gitlab_runner_enabled | bool
    - gitlab_runner_namespace != gitlab_namespace
- name: Remove the legacy general Runner release after isolated replacement
  tags: [gitlab-runner, gitlab-general-runner]
  kubernetes.core.helm:
    name: gitlab-runner
    release_namespace: '{{ gitlab_namespace }}'
    release_state: absent
    wait: true
  when:
    - gitlab_runner_enabled | bool
    - gitlab_runner_namespace != gitlab_namespace
- name: Remove legacy general Runner credentials and observability objects
  tags: [gitlab-runner, gitlab-general-runner]
  kubernetes.core.k8s:
    state: absent
    definition: '{{ item }}'
  loop:
    - apiVersion: v1
      kind: Secret
      metadata:
        name: platform-gitlab-runner-auth
        namespace: '{{ gitlab_namespace }}'
    - apiVersion: v1
      kind: Secret
      metadata:
        name: gitlab-runner-s3-cache
        namespace: '{{ gitlab_namespace }}'
    - apiVersion: operator.victoriametrics.com/v1beta1
      kind: VMPodScrape
      metadata:
        name: gitlab-runner
        namespace: '{{ gitlab_namespace }}'
    - apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: allow-gitlab-runner-metrics
        namespace: '{{ gitlab_namespace }}'
  loop_control:
    label: '{{ item.kind }}/{{ item.metadata.name }}'
  when:
    - gitlab_runner_enabled | bool
    - gitlab_runner_namespace != gitlab_namespace
- name: Remove legacy invalid Cilium default-deny for GitLab namespace
  kubernetes.core.k8s:
    state: absent
    definition:
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: default-deny
        namespace: '{{ gitlab_namespace }}'
- name: Create default-deny NetworkPolicy for GitLab namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: default-deny
        namespace: '{{ gitlab_namespace }}'
      spec:
        podSelector: {}
        policyTypes:
        - Ingress
        - Egress
        ingress: []
        egress: []
- name: Allow VictoriaMetrics to scrape GitLab Runner metrics
  tags: [gitlab-runner, gitlab-general-runner]
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: allow-gitlab-runner-metrics
        namespace: '{{ gitlab_runner_namespace }}'
      spec:
        endpointSelector:
          matchLabels:
            app: gitlab-runner
        ingress:
        - fromEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: monitoring
          toPorts:
          - ports:
            - port: '9252'
              protocol: TCP
  when:
    - gitlab_runner_enabled | bool
    - platform_observability_enabled | default(false) | bool
- name: Allow GitLab ingress from gateway
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: allow-gitlab-ingress
        namespace: '{{ gitlab_namespace }}'
      spec:
        endpointSelector:
          matchLabels:
            app: webservice
        ingress:
        - fromEntities:
          - cluster
          toPorts:
          - ports:
            - port: '8181'
              protocol: TCP
- name: Allow GitLab registry ingress
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: allow-registry-ingress
        namespace: '{{ gitlab_namespace }}'
      spec:
        endpointSelector:
          matchLabels:
            app: registry
        ingress:
        - fromEntities:
          - cluster
          toPorts:
          - ports:
            - port: '5000'
              protocol: TCP
- name: Allow GitLab KAS ingress from gateway
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: allow-kas-ingress
        namespace: '{{ gitlab_namespace }}'
      spec:
        endpointSelector:
          matchLabels:
            app: kas
        ingress:
        - fromEntities:
          - cluster
          toPorts:
          - ports:
            - port: '8150'
              protocol: TCP
- name: Allow GitLab egress to PostgreSQL and object storage
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: allow-gitlab-egress
        namespace: '{{ gitlab_namespace }}'
      spec:
        endpointSelector: {}
        egress:
        - toEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: databases
          toPorts:
          - ports:
            - port: '5432'
              protocol: TCP
        - toEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: dragonfly
          toPorts:
          - ports:
            - port: '6379'
              protocol: TCP
        - toEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: storage
          toPorts:
          - ports:
            - port: '8333'
              protocol: TCP
        - toEntities:
          - kube-apiserver
          - world
        - toFQDNs:
          - matchPattern: '*'
          toPorts:
          - ports:
            - port: '443'
              protocol: TCP
            - port: '53'
              protocol: UDP
- name: Allow GitLab Rails workloads to submit mail through Postal
  kubernetes.core.k8s:
    state: '{{ "present" if (platform_postal_enabled | default(false) | bool) else "absent" }}'
    definition:
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: allow-gitlab-postal-submission
        namespace: '{{ gitlab_namespace }}'
      spec:
        endpointSelector:
          matchExpressions:
          - key: k8s:app
            operator: In
            values: [webservice, sidekiq, toolbox]
        egress:
        - toEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: postal
              k8s:component: smtp
          toPorts:
          - ports:
            - port: '587'
              protocol: TCP
            - port: '2525'
              protocol: TCP
- name: Create GitLab VMServiceScrape
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: operator.victoriametrics.com/v1beta1
      kind: VMServiceScrape
      metadata:
        name: gitlab
        namespace: '{{ gitlab_namespace }}'
        labels:
          release: prometheus
      spec:
        selector:
          matchLabels:
            app: webservice
        endpoints:
        - port: http-workhorse
          interval: 30s
          path: /-/metrics
  when: platform_observability_enabled | default(false) | bool
- name: Create GitLab Runner VMPodScrape
  tags: [gitlab-runner, gitlab-general-runner]
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: operator.victoriametrics.com/v1beta1
      kind: VMPodScrape
      metadata:
        name: gitlab-runner
        namespace: '{{ gitlab_runner_namespace }}'
        labels:
          release: prometheus
      spec:
        selector:
          matchLabels:
            app: gitlab-runner
        podMetricsEndpoints:
        - port: metrics
          interval: 30s
          path: /metrics
  when:
    - gitlab_runner_enabled | bool
    - platform_observability_enabled | default(false) | bool
- name: Display GitLab deployment info
  debug:
    msg:
      - "=========================================="
      - "  GitLab {{ gitlab_edition | default('ce') | upper }} Deployed"
      - "  Mode: {{ gitlab_mode }}"
      - "=========================================="
      - "  GitLab URL: https://{{ gitlab_domain }}"
      - "  Registry: https://{{ registry_domain }}"
      - "  KAS: https://{{ kas_domain }}"
      - "  Edition: {{ 'Enterprise Edition' if gitlab_edition|default('ce') == 'ee' else 'Community Edition' }}"
      - ""
      - "  Get root password:"
      - "  kubectl get secret gitlab-gitlab-initial-root-password -n gitlab -o jsonpath='{.data.password}' | base64 -d"
      - "=========================================="
