---
# GitLab Self-Hosted Role - Enterprise Edition with License
# Deploys GitLab EE on Kubernetes using Helm
# Generates and applies Ultimate license via GitLab-License-Generator
# Supports light mode (minimal/small) and full mode (medium/production)

- name: Set GitLab tier-specific variables
  set_fact:
    gitlab_chart_version: "9.7.1"
    gitlab_namespace: "gitlab"
    gitlab_domain: "gitlab.{{ domain | default('example.com') }}"
    registry_domain: "registry.{{ domain | default('example.com') }}"
    kas_domain: "kas.{{ domain | default('example.com') }}"
    gitlab_mode: "{{ 'light' if tier in ['minimal', 'small'] else 'full' }}"
    gitlab_webservice_replicas: "{{ 1 if tier in ['minimal', 'small'] else 2 }}"
    gitlab_sidekiq_replicas: "{{ 1 if tier in ['minimal', 'small'] else 2 }}"
    gitlab_runner_concurrent: "{{ gitlab_runner_concurrent_jobs | default(10) }}"
    gitlab_license_name: "{{ gitlab_license_holder_name | default('Platform Admin') }}"
    gitlab_license_company: "{{ gitlab_license_holder_company | default('Platform Team') }}"
    gitlab_license_email: "{{ email | default('admin@example.com') }}"

- name: Create GitLab namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ gitlab_namespace }}"
        labels:
          app.kubernetes.io/part-of: gitlab

# ============================================
# GitLab License Generation
# Generates an Ultimate license using GitLab-License-Generator
# Runs on the Ansible controller (localhost)
# ============================================

- name: Check if license already generated
  stat:
    path: "{{ playbook_dir }}/.gitlab-license/result.gitlab-license"
  register: gitlab_license_file
  delegate_to: localhost
  become: false

- name: Create license build directory
  file:
    path: "{{ playbook_dir }}/.gitlab-license"
    state: directory
    mode: '0700'
  delegate_to: localhost
  become: false
  when: not gitlab_license_file.stat.exists

- name: Install Ruby dependencies for license generation
  ansible.builtin.command:
    cmd: "{{ item }}"
  loop:
    - gem install gitlab-license
  delegate_to: localhost
  become: false
  when: not gitlab_license_file.stat.exists
  register: gem_install
  changed_when: gem_install.rc == 0
  failed_when: gem_install.rc != 0

- name: Generate license key pair and license file
  ansible.builtin.script:
    cmd: /dev/stdin
    executable: /usr/bin/ruby
    chdir: "{{ playbook_dir }}/.gitlab-license"
  args:
    stdin: |
      require 'openssl'
      require 'gitlab/license'

      # Generate RSA key pair
      key = OpenSSL::PKey::RSA.generate(2048)
      File.write('license_key', key.to_pem)
      File.write('public.key', key.public_key.to_pem)

      # Build the license
      license = Gitlab::License.new

      license.licensee = {
        "Name"    => "{{ gitlab_license_name }}",
        "Company" => "{{ gitlab_license_company }}",
        "Email"   => "{{ gitlab_license_email }}"
      }

      license.starts_at      = Date.today
      license.expires_at     = Date.new(2500, 1, 1)
      license.notify_admins_at = license.expires_at
      license.notify_users_at  = license.expires_at
      license.block_changes_at = license.expires_at

      license.restrictions = {
        plan: "ultimate",
        active_user_count: 2147483647,
        subscription_id: "S-00000001"
      }

      # Sign and export
      Gitlab::License.encryption_key = key
      data = license.export
      File.write('result.gitlab-license', data)

      puts "License generated successfully"
      puts "Licensee: {{ gitlab_license_name }} <{{ gitlab_license_email }}>"
      puts "Plan: ultimate"
      puts "Expires: 2500-01-01"
  delegate_to: localhost
  become: false
  register: license_gen
  when: not gitlab_license_file.stat.exists

- name: Read generated public key
  slurp:
    src: "{{ playbook_dir }}/.gitlab-license/public.key"
  register: gitlab_public_key
  delegate_to: localhost
  become: false

- name: Read generated license file
  slurp:
    src: "{{ playbook_dir }}/.gitlab-license/result.gitlab-license"
  register: gitlab_license_data
  delegate_to: localhost
  become: false

# ============================================
# Helm Repositories
# ============================================

- name: Add GitLab Helm repository
  kubernetes.core.helm_repository:
    name: gitlab
    repo_url: "https://charts.gitlab.io/"

# ============================================
# Pre-requisite Secrets
# ============================================

- name: Create S3 object storage secret for GitLab
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: gitlab-object-storage
        namespace: "{{ gitlab_namespace }}"
      type: Opaque
      stringData:
        connection: |
          provider: AWS
          region: us-east-1
          aws_access_key_id: "{{ minio_root_user | default('minioadmin') }}"
          aws_secret_access_key: "{{ minio_root_password | default('minioadmin') }}"
          endpoint: "http://minio.storage.svc.cluster.local:9000"
          path_style: true

- name: Create registry storage secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: gitlab-registry-storage
        namespace: "{{ gitlab_namespace }}"
      type: Opaque
      stringData:
        config: |
          s3:
            bucket: gitlab-registry
            accesskey: "{{ minio_root_user | default('minioadmin') }}"
            secretkey: "{{ minio_root_password | default('minioadmin') }}"
            region: us-east-1
            regionendpoint: "http://minio.storage.svc.cluster.local:9000"
            v4auth: true
            pathstyle: true
            rootdirectory: /registry

- name: Create license public key secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: gitlab-license-public-key
        namespace: "{{ gitlab_namespace }}"
      type: Opaque
      data:
        public.key: "{{ gitlab_public_key.content }}"

- name: Create license secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: gitlab-license
        namespace: "{{ gitlab_namespace }}"
      type: Opaque
      data:
        gitlab.gitlab-license: "{{ gitlab_license_data.content }}"

# ============================================
# GitLab EE Helm Installation
# ============================================

- name: Install GitLab EE with Helm
  kubernetes.core.helm:
    name: gitlab
    chart_ref: gitlab/gitlab
    chart_version: "{{ gitlab_chart_version }}"
    release_namespace: "{{ gitlab_namespace }}"
    create_namespace: true
    release_state: present
    timeout: "30m0s"
    wait: true
    values:
      global:
        edition: ee
        gitlabVersion: "18.7.1-ee"
        hosts:
          domain: "{{ domain | default('example.com') }}"
          gitlab:
            name: "{{ gitlab_domain }}"
            https: true
          registry:
            name: "{{ registry_domain }}"
            https: true
          kas:
            name: "{{ kas_domain }}"
            https: true
        ingress:
          enabled: false
          configureCertmanager: false
        time_zone: UTC
        email:
          from: "gitlab@{{ domain | default('example.com') }}"
          display_name: GitLab
          reply_to: "noreply@{{ domain | default('example.com') }}"
        psql:
          host: "{{ project_name | default('k8s') }}-pg-pgbouncer.databases.svc.cluster.local"
          port: 5432
          database: gitlabhq_production
          username: gitlab
          password:
            secret: gitlab-postgresql-password
            key: postgresql-password
          preparedStatements: false
        registry:
          enabled: true
          bucket: gitlab-registry
        appConfig:
          registry:
            enabled: true
          object_store:
            enabled: true
            proxy_download: true
            connection:
              secret: gitlab-object-storage
              key: connection
          lfs:
            enabled: true
            bucket: gitlab-lfs
          artifacts:
            enabled: true
            bucket: gitlab-artifacts
          uploads:
            enabled: true
            bucket: gitlab-uploads
          packages:
            enabled: true
            bucket: gitlab-packages
          terraformState:
            enabled: true
            bucket: gitlab-terraform-state
          ciSecureFiles:
            enabled: true
            bucket: gitlab-ci-secure-files
          dependencyProxy:
            enabled: true
            bucket: gitlab-dependency-proxy
          backups:
            bucket: gitlab-backups
            tmpBucket: gitlab-tmp
      postgresql:
        install: false
      redis:
        install: true
        architecture: standalone
        primary:
          persistence:
            enabled: true
            size: 8Gi
            storageClass: hcloud-volumes
      gitlab:
        webservice:
          replicaCount: "{{ gitlab_webservice_replicas }}"
          minReplicas: "{{ gitlab_webservice_replicas }}"
          maxReplicas: 10
          resources:
            requests:
              cpu: "{{ '200m' if gitlab_mode == 'light' else '300m' }}"
              memory: "{{ '1.5Gi' if gitlab_mode == 'light' else '2.5Gi' }}"
            limits:
              cpu: "{{ '1500m' if gitlab_mode == 'light' else '2000m' }}"
              memory: "{{ '3Gi' if gitlab_mode == 'light' else '5Gi' }}"
          workerProcesses: 2
          extraVolumes:
            - name: license-public-key
              secret:
                secretName: gitlab-license-public-key
          extraVolumeMounts:
            - name: license-public-key
              mountPath: /srv/gitlab/.license_encryption_key.pub
              subPath: public.key
              readOnly: true
        sidekiq:
          replicaCount: "{{ gitlab_sidekiq_replicas }}"
          minReplicas: 1
          maxReplicas: 10
          resources:
            requests:
              cpu: "{{ '100m' if gitlab_mode == 'light' else '200m' }}"
              memory: "{{ '1Gi' if gitlab_mode == 'light' else '1.5Gi' }}"
            limits:
              cpu: "{{ '1000m' if gitlab_mode == 'light' else '1500m' }}"
              memory: "{{ '2Gi' if gitlab_mode == 'light' else '3Gi' }}"
          extraVolumes:
            - name: license-public-key
              secret:
                secretName: gitlab-license-public-key
          extraVolumeMounts:
            - name: license-public-key
              mountPath: /srv/gitlab/.license_encryption_key.pub
              subPath: public.key
              readOnly: true
        gitlab-shell:
          replicaCount: "{{ gitlab_webservice_replicas }}"
          minReplicas: "{{ gitlab_webservice_replicas }}"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
        gitaly:
          persistence:
            enabled: true
            size: 50Gi
            storageClass: hcloud-volumes
          resources:
            requests:
              cpu: "{{ '100m' if gitlab_mode == 'light' else '200m' }}"
              memory: "{{ '256Mi' if gitlab_mode == 'light' else '512Mi' }}"
            limits:
              cpu: "{{ '1000m' if gitlab_mode == 'light' else '1500m' }}"
              memory: "{{ '1Gi' if gitlab_mode == 'light' else '2Gi' }}"
        kas:
          enabled: true
          minReplicas: "{{ gitlab_webservice_replicas }}"
        toolbox:
          enabled: true
          backups:
            cron:
              enabled: true
              schedule: "0 2 * * *"
              extraArgs: ""
            objectStorage:
              config:
                secret: gitlab-object-storage
                key: connection
          extraVolumes:
            - name: license-public-key
              secret:
                secretName: gitlab-license-public-key
          extraVolumeMounts:
            - name: license-public-key
              mountPath: /srv/gitlab/.license_encryption_key.pub
              subPath: public.key
              readOnly: true
      registry:
        enabled: true
        replicaCount: "{{ gitlab_webservice_replicas }}"
        hpa:
          minReplicas: "{{ gitlab_webservice_replicas }}"
          maxReplicas: 5
        storage:
          secret: gitlab-registry-storage
          key: config
        maintenance:
          gc:
            disabled: false
            schedule: "0 4 * * 0"
        resources:
          requests:
            cpu: "{{ '25m' if gitlab_mode == 'light' else '50m' }}"
            memory: "{{ '32Mi' if gitlab_mode == 'light' else '64Mi' }}"
          limits:
            cpu: 500m
            memory: 256Mi
      prometheus:
        install: false
      grafana:
        install: false
      certmanager:
        install: false
      nginx-ingress:
        enabled: false
      gitlab-runner:
        install: false
      minio:
        install: false
      shared-secrets:
        enabled: true
        rbac:
          create: true
  when: tier is defined and tier | default('medium') in ['minimal', 'small', 'medium', 'production']

# ============================================
# Apply License to GitLab EE
# ============================================

- name: Wait for GitLab webservice to be ready
  kubernetes.core.k8s_info:
    kind: Deployment
    namespace: "{{ gitlab_namespace }}"
    label_selectors:
      - app=webservice
  register: gitlab_webservice_deploy
  until: >
    gitlab_webservice_deploy.resources | length > 0
    and (gitlab_webservice_deploy.resources[0].status.readyReplicas | default(0)) >= 1
  retries: 60
  delay: 15

- name: Get GitLab toolbox pod name
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: "{{ gitlab_namespace }}"
    label_selectors:
      - app=toolbox
  register: toolbox_pods

- name: Apply license via GitLab Rails console
  kubernetes.core.k8s_exec:
    namespace: "{{ gitlab_namespace }}"
    pod: "{{ toolbox_pods.resources[0].metadata.name }}"
    container: toolbox
    command:
      - /bin/bash
      - -c
      - |
        cat /srv/gitlab/config/secrets/.gitlab_license > /tmp/license.txt 2>/dev/null || true
        gitlab-rails runner "
          license_key = File.read('/etc/gitlab-license/gitlab.gitlab-license') rescue nil
          if license_key.nil?
            puts 'No license file found, skipping'
            exit 0
          end
          if License.current && !License.current.expired?
            puts 'Valid license already active, skipping'
            exit 0
          end
          license = License.new(data: license_key)
          if license.save
            puts 'License activated successfully!'
            puts \"Plan: #{license.plan}\"
            puts \"Licensee: #{license.licensee}\"
            puts \"Expires: #{license.expires_at}\"
          else
            puts \"License errors: #{license.errors.full_messages.join(', ')}\"
            exit 1
          end
        "
  register: license_apply
  when: toolbox_pods.resources | length > 0
  failed_when: false

- name: Mount license file in toolbox for activation
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: gitlab-license-file
        namespace: "{{ gitlab_namespace }}"
      data:
        gitlab.gitlab-license: "{{ gitlab_license_data.content | b64decode }}"

# ============================================
# Gateway API Routes
# ============================================

- name: Create GitLab Gateway API HTTPRoute (VPN-only via admin-gateway)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: gitlab-webservice
        namespace: "{{ gitlab_namespace }}"
      spec:
        parentRefs:
          - name: admin-gateway
            namespace: cilium-system
            sectionName: https
        hostnames:
          - "{{ gitlab_domain }}"
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - name: gitlab-webservice-default
                port: 8181

- name: Create GitLab Registry HTTPRoute
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: gitlab-registry
        namespace: "{{ gitlab_namespace }}"
      spec:
        parentRefs:
          - name: main-gateway
            namespace: cilium-system
            sectionName: https
        hostnames:
          - "{{ registry_domain }}"
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - name: gitlab-registry
                port: 5000

- name: Create GitLab KAS HTTPRoute (VPN-only via admin-gateway)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: gitlab-kas
        namespace: "{{ gitlab_namespace }}"
      spec:
        parentRefs:
          - name: admin-gateway
            namespace: cilium-system
            sectionName: https
        hostnames:
          - "{{ kas_domain }}"
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - name: gitlab-kas
                port: 8150

- name: Create TLS Certificate for GitLab
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cert-manager.io/v1
      kind: Certificate
      metadata:
        name: gitlab-tls
        namespace: cilium-secrets
      spec:
        secretName: gitlab-tls
        issuerRef:
          name: letsencrypt-prod
          kind: ClusterIssuer
        dnsNames:
          - "{{ gitlab_domain }}"
          - "{{ registry_domain }}"
          - "{{ kas_domain }}"

# ============================================
# GitLab Runner
# ============================================

- name: Add GitLab Runner Helm repository
  kubernetes.core.helm_repository:
    name: gitlab-runner
    repo_url: "https://charts.gitlab.io/"

- name: Install GitLab Runner with Helm
  kubernetes.core.helm:
    name: gitlab-runner
    chart_ref: gitlab/gitlab-runner
    chart_version: "0.84.2"
    release_namespace: "{{ gitlab_namespace }}"
    create_namespace: false
    release_state: present
    wait: true
    values:
      gitlabUrl: "https://{{ gitlab_domain }}"
      runnerToken: "{{ gitlab_runner_token | default('') }}"
      concurrent: "{{ gitlab_runner_concurrent }}"
      checkInterval: 3
      rbac:
        create: true
        clusterWideAccess: true
      runners:
        config: |
          [[runners]]
            [runners.kubernetes]
              namespace = "{{ gitlab_namespace }}"
              image = "ubuntu:22.04"
              privileged = false
              [runners.kubernetes.pod_security_context]
                run_as_non_root = true
                run_as_user = 1000
              [runners.kubernetes.build_container_resources]
                cpu_request = "500m"
                cpu_limit = "2000m"
                memory_request = "1Gi"
                memory_limit = "4Gi"
              [runners.kubernetes.service_container_resources]
                cpu_request = "200m"
                memory_request = "512Mi"
              [runners.kubernetes.helper_container_resources]
                cpu_request = "100m"
                memory_request = "128Mi"
        tags: "kubernetes,docker,k8s"
        runUntagged: true
      podAnnotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9252"
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 256Mi
  when: gitlab_runner_token is defined and gitlab_runner_token != ''

- name: Create S3 cache secret for GitLab Runner
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: gitlab-runner-s3-cache
        namespace: "{{ gitlab_namespace }}"
      type: Opaque
      stringData:
        accesskey: "{{ minio_root_user | default('minioadmin') }}"
        secretkey: "{{ minio_root_password | default('minioadmin') }}"

- name: Display GitLab EE deployment info
  debug:
    msg:
      - "=========================================="
      - "  GitLab EE (Ultimate) Deployed"
      - "  Mode: {{ gitlab_mode }}"
      - "=========================================="
      - "  GitLab URL: https://{{ gitlab_domain }}"
      - "  Registry: https://{{ registry_domain }}"
      - "  KAS: https://{{ kas_domain }}"
      - "  Edition: Enterprise (Ultimate)"
      - "  License: Active until 2500-01-01"
      - ""
      - "  Get root password:"
      - "  kubectl get secret gitlab-gitlab-initial-root-password -n gitlab -o jsonpath='{.data.password}' | base64 -d"
      - ""
      - "  License files: {{ playbook_dir }}/.gitlab-license/"
      - "=========================================="
