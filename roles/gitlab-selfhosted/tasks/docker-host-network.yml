---
- name: Docker smoke | Bound per-container resources
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: LimitRange
      metadata:
        name: protected-docker-smoke-containers
        namespace: '{{ gitlab_docker_host_runner_namespace }}'
        labels:
          app.kubernetes.io/managed-by: ansible
          workload.n0xeid.xyz/trust-boundary: protected-docker-smoke
      spec:
        limits:
          - type: Container
            # Keep missing-resource defaults small while admitting the exact
            # build, helper, and DinD limits rendered into Runner config.toml.
            defaultRequest:
              cpu: >-
                {{ gitlab_docker_host_runner_job_resources.helper_cpu_request |
                   default('100m') }}
              memory: >-
                {{ gitlab_docker_host_runner_job_resources.helper_memory_request |
                   default('256Mi') }}
            default:
              cpu: >-
                {{ gitlab_docker_host_runner_job_resources.helper_cpu_limit |
                   default('500m') }}
              memory: >-
                {{ gitlab_docker_host_runner_job_resources.helper_memory_limit |
                   default('512Mi') }}
            max:
              cpu: >-
                {{ gitlab_docker_host_runner_job_resources.service_cpu_limit |
                   default('4000m') }}
              memory: >-
                {{ gitlab_docker_host_runner_job_resources.service_memory_limit |
                   default('6Gi') }}

- name: Docker smoke | Bound protected Runner admission with cleanup headroom
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ResourceQuota
      metadata:
        name: protected-docker-smoke-budget
        namespace: '{{ gitlab_docker_host_runner_namespace }}'
      spec:
        hard:
          # Runner concurrency remains one. This quota intentionally admits the
          # completed Pod and its successor during the bounded cleanup window,
          # preventing stage transitions from failing before Pod creation.
          pods: '10'
          requests.cpu: >-
            {{ gitlab_docker_host_runner_quota.requests_cpu | default('4') }}
          requests.memory: >-
            {{ gitlab_docker_host_runner_quota.requests_memory | default('7Gi') }}
          limits.cpu: >-
            {{ gitlab_docker_host_runner_quota.limits_cpu | default('14') }}
          limits.memory: >-
            {{ gitlab_docker_host_runner_quota.limits_memory | default('18Gi') }}
          configmaps: '12'
          secrets: '20'
          services: '8'
          persistentvolumeclaims: '0'

- name: Docker smoke | Create default-deny policy
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: default-deny
        namespace: '{{ gitlab_docker_host_runner_namespace }}'
      spec:
        podSelector: {}
        policyTypes: [Ingress, Egress]
        ingress: []
        egress: []

- name: Docker smoke | Allow namespace-local DNS
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: allow-dns
        namespace: '{{ gitlab_docker_host_runner_namespace }}'
      spec:
        podSelector: {}
        policyTypes: [Egress]
        egress:
          - to:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: kube-system
                podSelector:
                  matchLabels:
                    k8s-app: kube-dns
            ports:
              - {port: 53, protocol: UDP}
              - {port: 53, protocol: TCP}
          - to:
              - ipBlock:
                  cidr: 169.254.25.10/32
            ports:
              - {port: 53, protocol: UDP}
              - {port: 53, protocol: TCP}

- name: Docker smoke | Allow NodeLocal DNS in the Cilium policy plane
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: allow-nodelocal-dns
        namespace: '{{ gitlab_docker_host_runner_namespace }}'
      spec:
        endpointSelector: {}
        egress:
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: kube-system
                  k8s:k8s-app: kube-dns
            toPorts:
              - ports:
                  - {port: '53', protocol: UDP}
                  - {port: '53', protocol: TCP}
                rules:
                  dns:
                    - matchPattern: '*'
          - toCIDR:
              - 169.254.25.10/32
            toPorts:
              - ports:
                  - {port: '53', protocol: UDP}
                  - {port: '53', protocol: TCP}
                rules:
                  dns:
                    - matchPattern: '*'
          - toEntities: [host]
            toPorts:
              - ports:
                  - {port: '53', protocol: UDP}
                  - {port: '53', protocol: TCP}
                rules:
                  dns:
                    - matchPattern: '*'

- name: Docker smoke | Allow only internal GitLab control-plane traffic
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: allow-gitlab
        namespace: '{{ gitlab_docker_host_runner_namespace }}'
      spec:
        podSelector: {}
        policyTypes: [Egress]
        egress:
          - to:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: '{{ gitlab_namespace }}'
            ports:
              - {port: 8181, protocol: TCP}
              - {port: 5000, protocol: TCP}

- name: Docker smoke | Allow manager access to Kubernetes API
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: allow-manager-kube-api
        namespace: '{{ gitlab_docker_host_runner_namespace }}'
      spec:
        endpointSelector:
          matchLabels:
            workload.n0xeid.xyz/class: protected-docker-smoke-manager
        egress:
          - toEntities: [kube-apiserver]

- name: Docker smoke | Allow runner cache traffic to SeaweedFS
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: allow-runner-cache
        namespace: '{{ gitlab_docker_host_runner_namespace }}'
      spec:
        podSelector: {}
        policyTypes: [Egress]
        egress:
          - to:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: storage
            ports:
              - {port: 8333, protocol: TCP}

- name: Docker smoke | Allow audited HTTPS build dependencies
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: allow-build-dependencies
        namespace: '{{ gitlab_docker_host_runner_namespace }}'
      spec:
        endpointSelector:
          matchLabels:
            workload.n0xeid.xyz/class: protected-docker-smoke-job
        egress:
          - toFQDNs:
              - {matchName: registry.n0xeid.xyz}
              - {matchName: registry-1.docker.io}
              - {matchName: auth.docker.io}
              - {matchName: production.cloudflare.docker.com}
              # BuildKit's dockerfile frontend is currently served from this
              # nested CloudFront hostname. Cilium FQDN wildcards match one
              # label only, so '*.docker.com' cannot authorize it.
              - {matchName: production.cloudfront.docker.com}
              # Protected component jobs publish their cacheable Nx result
              # through the authenticated public cache route.
              - {matchName: nx-cache.n0xeid.xyz}
              - {matchPattern: '*.docker.com'}
              - {matchPattern: '*.docker.io'}
              - {matchPattern: '*.cloudflarestorage.com'}
              - {matchName: registry.npmjs.org}
              - {matchName: dl-cdn.alpinelinux.org}
              - {matchName: deb.debian.org}
              - {matchName: security.debian.org}
              - {matchName: github.com}
              - {matchName: api.github.com}
              # pnpm installs git-hosted dependencies from the codeload host;
              # the runner's default-deny Cilium boundary must name it exactly.
              - {matchName: codeload.github.com}
              - {matchName: objects.githubusercontent.com}
              - {matchName: release-assets.githubusercontent.com}
              - {matchName: pkg-containers.githubusercontent.com}
              - {matchName: ghcr.io}
              - {matchName: unofficial-builds.nodejs.org}
            toPorts:
              - ports:
                  - {port: '443', protocol: TCP}

- name: Docker smoke | Allow VictoriaMetrics to scrape manager metrics
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: allow-runner-metrics
        namespace: '{{ gitlab_docker_host_runner_namespace }}'
      spec:
        endpointSelector:
          matchLabels:
            workload.n0xeid.xyz/class: protected-docker-smoke-manager
        ingress:
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: monitoring
            toPorts:
              - ports:
                  - {port: '9252', protocol: TCP}
  when: platform_observability_enabled | default(false) | bool
