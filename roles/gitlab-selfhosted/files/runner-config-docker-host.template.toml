# RUNNERS-DYN — docker-host pool (dynamic kubernetes executor, privileged DinD)
# ns gitlab-docker-builds (PSS privileged) | tags [docker-host, dind] | concurrency 2 | privileged dind
[[runners]]
  clone_url = "https://git.n0xeid.xyz"
  # Dynamic pool: 2 concurrent DinD job pods max, bound by docker-host-budget
  # ResourceQuota (pods=12, cpu=16, mem=32Gi).
  request_concurrency = 2
  limit = 2
  environment = ["HOME=/tmp", "FF_USE_ADVANCED_POD_SPEC_CONFIGURATION=true"]
  [runners.cache]
    Type = "s3"
    Path = "gitlab-runner"
    Shared = true
    [runners.cache.s3]
      ServerAddress = "seaweedfs-filer.storage.svc.cluster.local:8333"
      BucketName = "gitlab-runner-cache"
      BucketLocation = "us-east-1"
      Insecure = true
      AuthenticationType = "access-key"
  [runners.kubernetes]
    namespace = "gitlab-docker-builds"
    image = "docker.io/library/node:24.18.0-alpine@sha256:a0b9bf06e4e6193cf7a0f58816cc935ff8c2a908f81e6f1a95432d679c54fbfd"
    # helper_image: NOT pinned — runner auto-selects arch/version-correct helper.
    image_pull_secrets = ["gitlab-registry-pull"]
    poll_timeout = 3600
    max_builds = 100
    cleanup_grace_period_seconds = 5
    pod_termination_grace_period_seconds = 5
    cleanup_resources_timeout = "30s"
    allowed_images = ["docker.io/library/node:24.18.0-alpine@sha256:a0b9bf06e4e6193cf7a0f58816cc935ff8c2a908f81e6f1a95432d679c54fbfd"]
    allowed_services = ["docker.io/library/docker:27.5.1-dind@sha256:aa3df78ecf320f5fafdce71c659f1629e96e9de0968305fe1de670e0ca9176ce"]
    service_account = "ci-job-sa"
    # The dind SERVICE container is privileged (see pod_spec patch below);
    # the build/helper containers stay restricted. Runs on worker-4 (ci-docker).
    node_selector = { "workload.n0xeid.xyz/ci-docker" = "true" }
    node_tolerations = { "workload.n0xeid.xyz/ci-docker=true" = "NoSchedule" }
    privileged = false
    allow_privilege_escalation = false
    cap_drop = ["ALL"]
    automount_service_account_token = false
    logs_base_dir = "/tmp"
    scripts_base_dir = "/tmp"
    cpu_request = "500m"
    cpu_limit = "2"
    memory_request = "1Gi"
    memory_limit = "2Gi"
    service_cpu_request = "1000m"
    service_cpu_limit = "4"
    service_memory_request = "2Gi"
    service_memory_limit = "6Gi"
    helper_cpu_request = "100m"
    helper_cpu_limit = "500m"
    helper_memory_request = "256Mi"
    helper_memory_limit = "512Mi"
    active_deadline_seconds = 7200
    priority_class_name = "n0xeid-ci"
    helper_priority_class_name = "n0xeid-ci"
    service_priority_class_name = "n0xeid-ci"
    pod_annotations_overwrite_allowed = ".*"
    [runners.kubernetes.pod_security_context]
      [runners.kubernetes.pod_security_context.seccomp_profile]
        type = "RuntimeDefault"
    [runners.kubernetes.pod_labels]
      "workload.n0xeid.xyz/class" = "protected-docker-smoke-job"
    [[runners.kubernetes.pod_spec]]
      name = "restrict-docker-smoke-build-and-helper"
      patch = '''
        containers:
          - name: build
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
              seccompProfile:
                type: RuntimeDefault
          - name: helper
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
              seccompProfile:
                type: RuntimeDefault
      '''
      patch_type = "strategic"
    [[runners.kubernetes.pod_spec]]
      name = "privilege-only-the-pinned-dind-service"
      patch = '''
        containers:
          - name: docker
            securityContext:
              privileged: true
              allowPrivilegeEscalation: true
              capabilities:
                drop: [NET_RAW]
              seccompProfile:
                type: Unconfined
      '''
      patch_type = "strategic"
    [[runners.kubernetes.pod_spec]]
      name = "separate-protected-docker-from-general-ci"
      patch = '''
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchLabels:
                    workload.n0xeid.xyz/class: ci-job
                namespaces:
                  - "gitlab-ci-general"
                topologyKey: kubernetes.io/hostname
      '''
      patch_type = "strategic"
