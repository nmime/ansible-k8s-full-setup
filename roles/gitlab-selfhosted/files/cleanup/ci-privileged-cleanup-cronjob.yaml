# RUNNERS hygiene: nightly docker prune + weekly build-cache/tmp GC.
# Merged into ONE privileged CronJob in a dedicated namespace with the
# pod-security.kubernetes.io/enforce=privileged label so it can reach the
# host containerd socket and /var/tmp. Covers both CI workers via a
# nodeAffinity on ci-general (carried by ci-build AND ci-docker workers).
# One job per schedule, runs sequentially. activeDeadlineSeconds caps runtime.
apiVersion: v1
kind: Namespace
metadata:
  name: gitlab-ci-cleanup
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: docker-prune-nightly
  namespace: gitlab-ci-cleanup
  labels:
    app.kubernetes.io/part-of: gitlab-runner-hygiene
    workload.platform.example.com/component: ci-cleanup
spec:
  schedule: "30 2 * * *"
  timeZone: "UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 1800
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1800
      backoffLimit: 1
      template:
        metadata:
          labels:
            workload.platform.example.com/component: ci-cleanup
        spec:
          restartPolicy: Never
          priorityClassName: platform-ci
          tolerations:
            - key: workload.platform.example.com/ci-build
              operator: Equal
              value: "true"
              effect: NoSchedule
            - key: workload.platform.example.com/ci-docker
              operator: Equal
              value: "true"
              effect: NoSchedule
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: workload.platform.example.com/ci-general
                        operator: In
                        values: ["true"]
          containers:
            - name: prune
              image: docker:27-cli
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  echo "Pruning container runtime on $(cat /proc/sys/kernel/hostname)"
                  crictl --runtime-endpoint unix:///run/k3s/containerd/containerd.sock rmi --prune || true
                  crictl --runtime-endpoint unix:///run/k3s/containerd/containerd.sock rm --all-stopped || true
                  df -h /host-root | tail -1
              securityContext:
                privileged: true
                runAsUser: 0
                allowPrivilegeEscalation: true
                capabilities:
                  add: ["DAC_OVERRIDE"]
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 300m
                  memory: 256Mi
              volumeMounts:
                - name: containerd-sock
                  mountPath: /run/k3s/containerd/containerd.sock
                - name: host-root
                  mountPath: /host-root
                  readOnly: true
          volumes:
            - name: containerd-sock
              hostPath:
                path: /run/k3s/containerd/containerd.sock
                type: Socket
            - name: host-root
              hostPath:
                path: /
                type: Directory
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ci-build-cache-gc
  namespace: gitlab-ci-cleanup
  labels:
    app.kubernetes.io/part-of: gitlab-runner-hygiene
    workload.platform.example.com/component: ci-cleanup
spec:
  schedule: "0 3 * * 0"
  timeZone: "UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      activeDeadlineSeconds: 3600
      backoffLimit: 1
      template:
        metadata:
          labels:
            workload.platform.example.com/component: ci-cleanup
        spec:
          restartPolicy: Never
          priorityClassName: platform-ci
          tolerations:
            - key: workload.platform.example.com/ci-build
              operator: Equal
              value: "true"
              effect: NoSchedule
            - key: workload.platform.example.com/ci-docker
              operator: Equal
              value: "true"
              effect: NoSchedule
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: workload.platform.example.com/ci-general
                        operator: In
                        values: ["true"]
          containers:
            - name: gc
              image: docker:27-cli
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  echo "Node: $(cat /proc/sys/kernel/hostname)"
                  echo "--- containerd image GC (unused) ---"
                  crictl --runtime-endpoint unix:///run/k3s/containerd/containerd.sock rmi --prune || true
                  echo "--- stale job /tmp + workdir sweep ---"
                  find /host-tmp/gitlab-runner-* /host-tmp/builds -mindepth 1 -maxdepth 3 -mtime +2 -exec rm -rf {} + 2>/dev/null || true
                  df -h /host-root | tail -1
              securityContext:
                privileged: true
                runAsUser: 0
                allowPrivilegeEscalation: true
                capabilities:
                  add: ["DAC_OVERRIDE","FOWNER","CHOWN","SYS_ADMIN"]
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              volumeMounts:
                - name: containerd-sock
                  mountPath: /run/k3s/containerd/containerd.sock
                - name: host-tmp
                  mountPath: /host-tmp
                - name: host-root
                  mountPath: /host-root
                  readOnly: true
          volumes:
            - name: containerd-sock
              hostPath:
                path: /run/k3s/containerd/containerd.sock
                type: Socket
            - name: host-tmp
              hostPath:
                path: /var/tmp
                type: DirectoryOrCreate
            - name: host-root
              hostPath:
                path: /
                type: Directory
