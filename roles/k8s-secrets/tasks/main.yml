- name: Set secrets tier-specific variables
  set_fact:
    vault_ns: vault
    eso_ns: external-secrets
    vault_chart_ver: "{{ vault_chart_version | default('0.34.0') }}"
    vault_version: "{{ vault_version | default('2.0.3') }}"
    eso_chart_ver: 2.7.0
    vault_replicas: '{{ 3 if tier in [''medium'', ''production''] else 1 }}'
    vault_ha: '{{ true if tier in [''medium'', ''production''] else false }}'
    vault_storage: '{{ vault_storage_size | default(''20Gi'') }}'
    vault_domain: vault.{{ domain }}
- name: Create Vault namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: vault
        labels:
          app.kubernetes.io/part-of: vault
          pod-security.kubernetes.io/enforce: baseline
          pod-security.kubernetes.io/warn: restricted
  register: _r_create_vault_namespace
  retries: 3
  delay: 15
  until: _r_create_vault_namespace is not failed
- name: Prepare Vault internal TLS certificates
  ansible.builtin.include_tasks: vault_tls.yml
  when: not (vault_tls_disabled | bool)
- name: Add HashiCorp Helm repository
  kubernetes.core.helm_repository:
    name: hashicorp
    repo_url: https://helm.releases.hashicorp.com
  register: _r_add_hashicorp_helm_repository
  retries: 3
  delay: 15
  until: _r_add_hashicorp_helm_repository is not failed
- name: Install Vault via Helm
  kubernetes.core.helm:
    name: vault
    chart_ref: hashicorp/vault
    chart_version: '{{ vault_chart_ver }}'
    release_namespace: vault
    create_namespace: true
    release_state: present
    wait: true
    timeout: 10m0s
    set_values:
    - value: server.ha.replicas={{ vault_replicas }}
    - value: server.ha.enabled={{ (vault_ha | bool) | lower }}
    - value: server.ha.raft.enabled={{ (vault_ha | bool) | lower }}
    - value: server.standalone.enabled={{ (not (vault_ha | bool)) | lower }}
    values:
      global:
        tlsDisable: '{{ vault_tls_disabled | bool }}'
      injector:
        enabled: false
      server:
        securityContext:
          runAsNonRoot: true
          runAsUser: 100
          runAsGroup: 1000
          fsGroup: 1000
        containerSecurityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: vault
                    component: server
                topologyKey: kubernetes.io/hostname
        tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        dataStorage:
          enabled: true
          size: '{{ vault_storage }}'
          storageClass: '{{ storage_class | default(''hcloud-volumes'') }}'
        auditStorage:
          enabled: true
          size: 20Gi
          storageClass: '{{ storage_class | default(''hcloud-volumes'') }}'
        extraEnvironmentVars:
          VAULT_API_ADDR: "{{ 'http' if vault_tls_disabled | bool else 'https' }}://$(HOSTNAME).vault-internal:8200"
          VAULT_CLUSTER_ADDR: "{{ 'http' if vault_tls_disabled | bool else 'https' }}://$(HOSTNAME).vault-internal:8201"
          VAULT_CACERT: "{{ '' if vault_tls_disabled | bool else '/vault/tls/ca.crt' }}"
        volumes: >-
          {{ [] if vault_tls_disabled | bool else
             [{'name': 'vault-tls', 'secret': {'secretName': 'vault-internal-tls'}}] }}
        volumeMounts: >-
          {{ [] if vault_tls_disabled | bool else
             [{'name': 'vault-tls', 'mountPath': '/vault/tls', 'readOnly': true}] }}
        ha:
          raft:
            setNodeId: true
            config: |
              ui = true
              listener "tcp" {
                tls_disable = {{ 1 if vault_tls_disabled | bool else 0 }}
                address = "[::]:8200"
                cluster_address = "[::]:8201"
              {% if not (vault_tls_disabled | bool) %}
                tls_cert_file = "/vault/tls/tls.crt"
                tls_key_file = "/vault/tls/tls.key"
              {% endif %}
              }
              telemetry {
                prometheus_retention_time = "30s"
                disable_hostname = true
                unauthenticated_metrics_access = true
              }
              storage "raft" {
                path = "/vault/data"
              {% for peer in range(0, vault_replicas | int) %}
                retry_join {
                  leader_api_addr = "{{ 'http' if vault_tls_disabled | bool else 'https' }}://vault-{{ peer }}.vault-internal:8200"
              {% if not (vault_tls_disabled | bool) %}
                  leader_ca_cert_file = "/vault/tls/ca.crt"
              {% endif %}
                }
              {% endfor %}
              }
        standalone:
          config: |
            ui = true
            listener "tcp" {
              tls_disable = {{ 1 if vault_tls_disabled | bool else 0 }}
              address = "[::]:8200"
              cluster_address = "[::]:8201"
            {% if not (vault_tls_disabled | bool) %}
              tls_cert_file = "/vault/tls/tls.crt"
              tls_key_file = "/vault/tls/tls.key"
            {% endif %}
            }
            telemetry {
              prometheus_retention_time = "30s"
              disable_hostname = true
              unauthenticated_metrics_access = true
            }
            storage "file" {
              path = "/vault/data"
            }
        ingress:
          enabled: false
        ui:
          enabled: true
      csi:
        enabled: false
  register: _r_install_vault_via_helm
  retries: 3
  delay: 15
  until: _r_install_vault_via_helm is not failed
- name: Wait for Vault pods to be running
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: '{{ vault_ns }}'
    label_selectors:
    - app.kubernetes.io/name=vault
    - component=server
  register: vault_pods
  until: 'vault_pods.resources | length >= (vault_replicas | int) and vault_pods.resources | map(attribute=''status.phase'') | select(''equalto'', ''Running'') | list | length >= (vault_replicas | int)

    '
  retries: 120
  delay: 15
  failed_when: false
  when: not (vault_initialized | default(false) | bool) and vault_ha | bool
- name: Patch Vault StatefulSet DNS to bypass nodelocaldns
  kubernetes.core.k8s:
    state: patched
    kind: StatefulSet
    name: vault
    namespace: '{{ vault_ns }}'
    definition:
      spec:
        template:
          spec:
            dnsPolicy: None
            dnsConfig:
              nameservers:
              - 10.233.0.3
              searches:
              - '{{ vault_ns }}.svc.cluster.local'
              - svc.cluster.local
              - cluster.local
              options:
              - name: ndots
                value: '5'
  when: vault_ha | bool
- name: Delete Vault pods to apply DNS patch
  kubernetes.core.k8s:
    state: absent
    kind: Pod
    namespace: '{{ vault_ns }}'
    label_selectors:
    - app.kubernetes.io/name=vault
    - component=server
  when: vault_ha | bool
- name: Wait for Vault pods to be running after DNS patch
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: '{{ vault_ns }}'
    label_selectors:
    - app.kubernetes.io/name=vault
    - component=server
  register: vault_pods_dns
  until: 'vault_pods_dns.resources | length >= (vault_replicas | int) and vault_pods_dns.resources | map(attribute=''status.phase'') | select(''equalto'', ''Running'') | list | length >= (vault_replicas
    | int)

    '
  retries: 120
  delay: 15
  failed_when: false
  when: vault_ha | bool
- name: Check Vault init status
  kubernetes.core.k8s_exec:
    namespace: '{{ vault_ns }}'
    pod: vault-0
    command: vault status -format=json
  register: vault_status_raw
  retries: 3
  delay: 15
  until: vault_status_raw is not failed
  failed_when: false
  changed_when: false
- name: Refuse to continue when Vault initialization state is unknown
  ansible.builtin.assert:
    that:
      - vault_status_raw.rc is defined
      - vault_status_raw.rc in [0, 2]
      - vault_status_raw.stdout | default('') | length > 0
    fail_msg: >-
      Vault status could not be determined safely. No initialization or data
      cleanup was attempted. Restore connectivity and rerun the playbook.
- name: Parse Vault status
  set_fact:
    vault_initialized: '{{ (vault_status_raw.stdout | from_json).initialized | default(false) }}'
  when: vault_status_raw.rc is defined and (vault_status_raw.rc == 0 or vault_status_raw.rc == 2)
  failed_when: false
- name: Initialize Vault (if not initialized)
  kubernetes.core.k8s_exec:
    namespace: '{{ vault_ns }}'
    pod: vault-0
    command: vault operator init -key-shares=5 -key-threshold=3 -format=json
  register: vault_init
  retries: 3
  delay: 15
  until: vault_init is not failed
  when: not (vault_initialized | default(false) | bool)
  failed_when: vault_init.rc is defined and vault_init.rc != 0
  no_log: true
- name: Normalize vault init output
  set_fact:
    vault_init_data: '{{ vault_init.stdout if vault_init.stdout is mapping else vault_init.stdout | from_json }}'
  when: vault_init is changed
  no_log: true
- name: Save Vault initialization material outside the cluster
  block:
  - name: Write Vault initialization material to a temporary local file
    ansible.builtin.copy:
      content: '{{ vault_init_data | to_nice_json }}'
      dest: '{{ vault_init_output_file }}.tmp'
      mode: '0600'
    delegate_to: localhost
    become: false
    no_log: true

  - name: Encrypt Vault initialization material with Ansible Vault
    ansible.builtin.command:
      argv:
      - ansible-vault
      - encrypt
      - --vault-password-file
      - '{{ resolved_vault_password_file | default(vault_password_file | expanduser) }}'
      - --output
      - '{{ vault_init_output_file }}'
      - '{{ vault_init_output_file }}.tmp'
    delegate_to: localhost
    become: false
    changed_when: true
    no_log: true
  always:
  - name: Remove temporary Vault initialization material
    ansible.builtin.file:
      path: '{{ vault_init_output_file }}.tmp'
      state: absent
    delegate_to: localhost
    become: false
    no_log: true
  when: vault_init is changed
- name: Check encrypted Vault initialization material for an existing cluster
  ansible.builtin.stat:
    path: '{{ vault_init_output_file }}'
  register: vault_init_output_stat
  delegate_to: localhost
  become: false
  when: vault_initialized | default(false) | bool
- name: Require encrypted Vault initialization material for reconciliation
  ansible.builtin.assert:
    that:
    - vault_init_output_stat.stat.exists
    - vault_init_output_stat.stat.isreg
    fail_msg: >-
      Vault is already initialized, but {{ vault_init_output_file }} is not an
      encrypted regular file. Restore that file from the protected operator
      backup before reconciling Vault authentication or backup policy.
  when: vault_initialized | default(false) | bool
- name: Load encrypted Vault initialization material for reconciliation
  ansible.builtin.command:
    argv:
    - ansible-vault
    - view
    - --vault-password-file
    - '{{ resolved_vault_password_file | default(vault_password_file | expanduser) }}'
    - '{{ vault_init_output_file }}'
  register: vault_init_view
  delegate_to: localhost
  become: false
  changed_when: false
  no_log: true
  when: vault_initialized | default(false) | bool
- name: Parse existing Vault initialization material
  ansible.builtin.set_fact:
    vault_init_data: '{{ vault_init_view.stdout | from_json }}'
  no_log: true
  when: vault_initialized | default(false) | bool
- name: Unseal Vault (primary)
  kubernetes.core.k8s_exec:
    namespace: '{{ vault_ns }}'
    pod: vault-0
    command: vault operator unseal {{ vault_init_data.unseal_keys_b64[item] }}
  loop:
  - 0
  - 1
  - 2
  when: vault_init is changed
  no_log: true
  register: _r_unseal_vault__primary_
  retries: 3
  delay: 15
  until: _r_unseal_vault__primary_ is not failed
- name: Wait for Vault leader to be ready for raft
  kubernetes.core.k8s_exec:
    namespace: '{{ vault_ns }}'
    pod: vault-0
    command: vault status -format=json
  when: vault_ha | bool and vault_init is changed
  register: _r_vault_leader_status
  retries: 12
  delay: 5
  until: _r_vault_leader_status.stdout is defined and (_r_vault_leader_status.stdout | from_json).sealed == false
  failed_when: false
- name: Join raft peers (HA mode)
  kubernetes.core.k8s_exec:
    namespace: '{{ vault_ns }}'
    pod: vault-{{ item }}
    command: vault operator raft join http://vault-0.vault-internal:8200
  loop: '{{ range(1, vault_replicas | int) | list }}'
  when: vault_ha | bool and vault_init is changed
  register: _r_join_raft_peers__ha_mode_
  retries: 10
  delay: 15
  until: _r_join_raft_peers__ha_mode_.rc | default(1) == 0
- name: Wait for raft peers to recognize initialization
  kubernetes.core.k8s_exec:
    namespace: '{{ vault_ns }}'
    pod: vault-{{ item }}
    command: vault status -format=json
  loop: '{{ range(1, vault_replicas | int) | list }}'
  when: vault_ha | bool and vault_init is changed
  register: _r_wait_raft_init
  retries: 120
  delay: 5
  failed_when: false
  until: _r_wait_raft_init.stdout is defined and (_r_wait_raft_init.stdout | from_json).initialized | default(false)
- name: Unseal raft peers (HA mode)
  kubernetes.core.k8s_exec:
    namespace: '{{ vault_ns }}'
    pod: vault-{{ item.0 }}
    command: vault operator unseal {{ vault_init_data.unseal_keys_b64[item.1] }}
  loop: '{{ range(1, vault_replicas | int) | list | product([0, 1, 2]) | list }}'
  when: vault_ha | bool and vault_init is changed
  no_log: true
  register: _r_unseal_raft_peers__ha_mode_
  retries: 5
  delay: 15
  until: _r_unseal_raft_peers__ha_mode_ is not failed
- name: Remove legacy in-cluster Vault auto-unseal job
  kubernetes.core.k8s:
    state: absent
    api_version: batch/v1
    kind: CronJob
    name: vault-auto-unseal
    namespace: '{{ vault_ns }}'
  when: vault_init is changed
- name: Remove legacy in-cluster Vault initialization keys
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Secret
    name: vault-init-keys
    namespace: '{{ vault_ns }}'
- name: Enable KV v2 secrets engine
  kubernetes.core.k8s_exec:
    namespace: '{{ vault_ns }}'
    pod: vault-0
    command: sh -c "VAULT_TOKEN={{ vault_init_data.root_token }} vault secrets enable -path=secret kv-v2"
  when: vault_init is changed
  failed_when: false
  no_log: true
  register: _r_enable_kv_v2_secrets_engine
  retries: 3
  delay: 15
  until: _r_enable_kv_v2_secrets_engine is not failed
- name: Enable Vault file audit device
  kubernetes.core.k8s_exec:
    namespace: '{{ vault_ns }}'
    pod: vault-0
    command: sh -c "VAULT_TOKEN={{ vault_init_data.root_token }} vault audit enable file file_path=/vault/audit/audit.log"
  register: _r_enable_vault_audit
  retries: 3
  delay: 10
  until: _r_enable_vault_audit is not failed
  failed_when: _r_enable_vault_audit.rc is defined and _r_enable_vault_audit.rc != 0 and "already in use" not in (_r_enable_vault_audit.stderr | default(''))
  when: vault_init is changed
  no_log: true
- name: Enable Kubernetes auth method
  kubernetes.core.k8s_exec:
    namespace: '{{ vault_ns }}'
    pod: vault-0
    command: sh -c "VAULT_TOKEN={{ vault_init_data.root_token }} vault auth enable kubernetes"
  when: vault_init_data is defined
  failed_when: false
  no_log: true
  register: _r_enable_kubernetes_auth_method
  retries: 3
  delay: 15
  until: _r_enable_kubernetes_auth_method is not failed
- name: Configure Kubernetes auth method
  kubernetes.core.k8s_exec:
    namespace: '{{ vault_ns }}'
    pod: vault-0
    command: sh -c "VAULT_TOKEN={{ vault_init_data.root_token }} vault write auth/kubernetes/config kubernetes_host=https://kubernetes.default.svc:443"
  when: vault_init_data is defined
  no_log: true
  register: _r_configure_kubernetes_auth_method
  retries: 3
  delay: 15
  until: _r_configure_kubernetes_auth_method is not failed
- name: Create Vault snapshot backup policy
  kubernetes.core.k8s_exec:
    namespace: '{{ vault_ns }}'
    pod: vault-0
    command: >-
      sh -c 'printf %s "path \"sys/storage/raft/snapshot\" {
      capabilities = [\"read\"]
      }" | VAULT_TOKEN="$1" vault policy write snapshot-backup -' --
      {{ vault_init_data.root_token }}
  when: vault_init_data is defined
  no_log: true
  register: _vault_snapshot_policy
  retries: 3
  delay: 10
  until: _vault_snapshot_policy is not failed
- name: Create Vault Kubernetes auth role for snapshot backups
  kubernetes.core.k8s_exec:
    namespace: '{{ vault_ns }}'
    pod: vault-0
    command: >-
      sh -c 'VAULT_TOKEN="$1" vault write auth/kubernetes/role/vault-backup
      bound_service_account_names=vault-backup
      bound_service_account_namespaces={{ vault_ns }}
      policies=snapshot-backup ttl=15m' -- {{ vault_init_data.root_token }}
  when: vault_init_data is defined
  no_log: true
  register: _vault_snapshot_auth_role
  retries: 3
  delay: 10
  until: _vault_snapshot_auth_role is not failed
- name: Create Vault TLS certificate
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cert-manager.io/v1
      kind: Certificate
      metadata:
        name: vault-tls
        namespace: cilium-secrets
      spec:
        secretName: vault-tls
        issuerRef:
          name: letsencrypt-prod
          kind: ClusterIssuer
        dnsNames:
        - '{{ vault_domain }}'
  register: _r_create_vault_tls_certificate
  retries: 3
  delay: 15
  until: _r_create_vault_tls_certificate is not failed
- name: Create Vault HTTPRoute (VPN-only via admin-gateway)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: vault
        namespace: '{{ vault_ns }}'
      spec:
        parentRefs:
        - name: admin-gateway
          namespace: cilium-system
          sectionName: https
        hostnames:
        - '{{ vault_domain }}'
        rules:
        - matches:
          - path:
              type: PathPrefix
              value: /
          backendRefs:
          - name: vault-ui
            port: 8200
  register: _r_create_vault_httproute_vpn_only_via_admi
  retries: 3
  delay: 15
  until: _r_create_vault_httproute_vpn_only_via_admi is not failed
- name: Create ESO namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: '{{ eso_ns }}'
        labels:
          app.kubernetes.io/part-of: external-secrets
          pod-security.kubernetes.io/enforce: baseline
          pod-security.kubernetes.io/warn: restricted
  register: _r_create_eso_namespace
  retries: 3
  delay: 15
  until: _r_create_eso_namespace is not failed
- name: Add External Secrets Helm repository
  kubernetes.core.helm_repository:
    name: external-secrets
    repo_url: https://charts.external-secrets.io
  register: _r_add_external_secrets_helm_repository
  retries: 3
  delay: 15
  until: _r_add_external_secrets_helm_repository is not failed
- name: Install External Secrets Operator via Helm
  kubernetes.core.helm:
    name: external-secrets
    chart_ref: external-secrets/external-secrets
    chart_version: '{{ eso_chart_ver }}'
    release_namespace: '{{ eso_ns }}'
    create_namespace: true
    release_state: present
    wait: true
    set_values:
    - value: replicaCount={{ 2 if tier in ['medium', 'production'] else 1 }}
    - value: webhook.replicaCount={{ 2 if tier in ['medium', 'production'] else 1 }}
    - value: certController.replicaCount={{ 2 if tier in ['medium', 'production'] else 1 }}
    - value: serviceMonitor.enabled=true
  register: _r_install_external_secrets_operator_via_he
  retries: 3
  delay: 15
  until: _r_install_external_secrets_operator_via_he is not failed
- name: Wait for ESO to be ready
  kubernetes.core.k8s_info:
    kind: Deployment
    namespace: '{{ eso_ns }}'
    name: external-secrets
  register: eso_deploy
  until: 'eso_deploy.resources | length > 0 and (eso_deploy.resources[0].status.readyReplicas | default(0)) >= 1

    '
  retries: 120
  failed_when: false
  delay: 15
- name: Create Vault ESO service account
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ServiceAccount
      automountServiceAccountToken: false
      metadata:
        name: external-secrets-vault
        namespace: '{{ eso_ns }}'
  register: _r_create_vault_eso_service_account
  retries: 3
  delay: 15
  until: _r_create_vault_eso_service_account is not failed
- name: Create Vault ESO auth role
  kubernetes.core.k8s_exec:
    namespace: '{{ vault_ns }}'
    pod: vault-0
    command: sh -c "VAULT_TOKEN={{ vault_init_data.root_token }} vault write auth/kubernetes/role/external-secrets bound_service_account_names=external-secrets-vault bound_service_account_namespaces={{
      eso_ns }} policies=default,external-secrets ttl=1h"
  when: vault_init is changed
  failed_when: false
  no_log: true
  register: _r_create_vault_eso_auth_role
  retries: 3
  delay: 15
  until: _r_create_vault_eso_auth_role is not failed
- name: Create Vault policy for ESO
  kubernetes.core.k8s_exec:
    namespace: '{{ vault_ns }}'
    pod: vault-0
    command: "export VAULT_TOKEN={{ vault_init_data.root_token }}\nvault policy write external-secrets - <<EOF\npath \"secret/data/*\" {\n  capabilities = [\"read\", \"list\"]\n}\npath \"secret/metadata/*\"\
      \ {\n  capabilities = [\"read\", \"list\"]\n}\nEOF\n"
  when: vault_init is changed
  failed_when: false
  no_log: true
  register: _r_create_vault_policy_for_eso
  retries: 3
  delay: 15
  until: _r_create_vault_policy_for_eso is not failed
- name: Create ClusterSecretStore for Vault
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: external-secrets.io/v1
      kind: ClusterSecretStore
      metadata:
        name: vault-backend
      spec:
        provider:
          vault:
            server: "{{ 'http' if vault_tls_disabled | bool else 'https' }}://vault.{{ vault_ns }}.svc.cluster.local:8200"
            path: secret
            version: v2
            caProvider: '{{ omit if vault_tls_disabled | bool else {"type": "Secret", "name": "vault-internal-tls", "key": "ca.crt", "namespace": vault_ns} }}'
            auth:
              kubernetes:
                mountPath: kubernetes
                role: external-secrets
                serviceAccountRef:
                  name: external-secrets-vault
                  namespace: '{{ eso_ns }}'
  register: _r_create_clustersecretstore_for_vault
  retries: 3
  delay: 15
  until: _r_create_clustersecretstore_for_vault is not failed
- name: Create example ExternalSecret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata:
        name: example-secret
        namespace: default
      spec:
        refreshInterval: 1h
        secretStoreRef:
          name: vault-backend
          kind: ClusterSecretStore
        target:
          name: example-secret
          creationPolicy: Owner
        data:
        - secretKey: password
          remoteRef:
            key: example
            property: password
  register: _r_create_example_externalsecret
  retries: 3
  delay: 15
  until: _r_create_example_externalsecret is not failed
- name: Create PodDisruptionBudget for Vault (HA mode)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata:
        name: vault-pdb
        namespace: '{{ vault_ns }}'
      spec:
        maxUnavailable: 1
        selector:
          matchLabels:
            app.kubernetes.io/name: vault
            component: server
  when: vault_ha | bool
  register: _r_create_vault_pdb
  retries: 3
  delay: 10
  until: _r_create_vault_pdb is not failed
- name: Create PodDisruptionBudget for ESO
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata:
        name: external-secrets-pdb
        namespace: external-secrets
      spec:
        minAvailable: 1
        selector:
          matchLabels:
            app.kubernetes.io/name: external-secrets
  when: tier in ['medium', 'production']
  register: _r_create_eso_pdb
  retries: 3
  delay: 10
  until: _r_create_eso_pdb is not failed
- name: Display secrets management summary
  debug:
    msg:
    - ==========================================
    - '  Secrets Management Deployed'
    - ==========================================
    - '  Vault: v2.0.3 (chart {{ vault_chart_ver }})'
    - '  ESO: chart {{ eso_chart_ver }}'
    - '  HA Mode: {{ vault_ha }}'
    - '  Replicas: {{ vault_replicas }}'
    - '  UI: {{ vault_domain }}'
    - '  ClusterSecretStore: vault-backend'
    - ==========================================
- name: Create default-deny for Vault namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: default-deny
        namespace: '{{ vault_ns | default(''vault'') }}'
      spec:
        endpointSelector: {}
- name: Allow Vault ingress from cluster (ExternalSecrets + gateway)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: allow-vault-ingress
        namespace: '{{ vault_ns | default(''vault'') }}'
      spec:
        endpointSelector:
          matchLabels:
            app.kubernetes.io/name: vault
        ingress:
        - fromEntities:
          - cluster
          toPorts:
          - ports:
            - port: '8200'
              protocol: TCP
            - port: '8201'
              protocol: TCP
- name: Allow Vault egress (Raft replication)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: allow-vault-egress
        namespace: '{{ vault_ns | default(''vault'') }}'
      spec:
        endpointSelector: {}
        egress:
        - toEndpoints:
          - matchLabels: {}
          toPorts:
          - ports:
            - port: '8200'
              protocol: TCP
            - port: '8201'
              protocol: TCP
        - toEntities:
          - kube-apiserver
- name: Create Vault ServiceMonitor
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: monitoring.coreos.com/v1
      kind: ServiceMonitor
      metadata:
        name: vault
        namespace: '{{ vault_ns | default("vault") }}'
        labels:
          release: prometheus
      spec:
        selector:
          matchLabels:
            app.kubernetes.io/name: vault
        endpoints:
        - port: https
          scheme: https
          interval: 30s
          tlsConfig:
            insecureSkipVerify: true
