---
# K8s Secrets Role - Vault (Helm 0.32.0) + ESO (Helm 2.2.0)
# HashiCorp Vault for secret storage + External Secrets Operator for K8s integration
# Components: Vault (Helm chart 0.32.0), ESO (Helm chart 2.2.0)

- name: Set secrets tier-specific variables
  set_fact:
    vault_ns: "vault"
    eso_ns: "external-secrets"
    vault_chart_ver: "0.32.0"
    eso_chart_ver: "2.2.0"
    vault_replicas: "{{ 3 if tier in ['medium', 'production'] else 1 }}"
    vault_ha: "{{ true if tier in ['medium', 'production'] else false }}"
    vault_storage: "{{ vault_storage_size | default('10Gi') }}"
    vault_domain: "vault.{{ domain }}"

# ============================================
# Vault Installation
# ============================================

- name: Create Vault namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: vault
        labels:
          app.kubernetes.io/part-of: vault
          pod-security.kubernetes.io/enforce: baseline
          pod-security.kubernetes.io/warn: restricted
  register: _r_create_vault_namespace
  retries: 3
  delay: 10
  until: _r_create_vault_namespace is not failed

- name: Add HashiCorp Helm repository
  kubernetes.core.helm_repository:
    name: hashicorp
    repo_url: "https://helm.releases.hashicorp.com"
  register: _r_add_hashicorp_helm_repository
  retries: 3
  delay: 10
  until: _r_add_hashicorp_helm_repository is not failed

- name: Install Vault via Helm
  kubernetes.core.helm:
    name: vault
    chart_ref: hashicorp/vault
    chart_version: "{{ vault_chart_version }}"
    release_namespace: vault
    create_namespace: true
    release_state: present
    wait: true
    timeout: "10m0s"
    values:
      global:
        tlsDisable: false
      injector:
        enabled: false
      server:
        securityContext:
          runAsNonRoot: true
          runAsUser: 100
          runAsGroup: 1000
          fsGroup: 1000
        containerSecurityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        resources:
          enabled: true
          size: "{{ vault_storage }}"
          storageClass: "{{ storage_class | default('hcloud-volumes') }}"
        auditStorage:
          enabled: true
          size: "10Gi"
          storageClass: "{{ storage_class | default('hcloud-volumes') }}"
        ha:
          enabled: "{{ vault_ha }}"
          replicas: "{{ vault_replicas }}"
          raft:
            enabled: "{{ vault_ha }}"
            setNodeId: true
            config: |
              ui = true
              listener "tcp" {
                tls_disable = 1
                address = "[::]:8200"
                cluster_address = "[::]:8201"
              }
              storage "raft" {
                path = "/vault/data"
              }
              service_registration "kubernetes" {}
        standalone:
          enabled: "{{ not vault_ha }}"
          config: |
            ui = true
            listener "tcp" {
              tls_disable = 1
              address = "[::]:8200"
              cluster_address = "[::]:8201"
            }
            storage "file" {
              path = "/vault/data"
            }
        ingress:
          enabled: false
        ui:
          enabled: true
      csi:
        enabled: true
  register: _r_install_vault_via_helm
  retries: 3
  delay: 10
  until: _r_install_vault_via_helm is not failed

- name: Wait for Vault pods to be running
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: "{{ vault_ns }}"
    label_selectors:
      - app.kubernetes.io/name=vault
      - component=server
  register: vault_pods
  until: >
    vault_pods.resources | length >= (vault_replicas | int)
    and vault_pods.resources | map(attribute='status.phase') | select('equalto', 'Running') | list | length >= (vault_replicas | int)
  retries: 30
  delay: 10

# ============================================
# Vault Initialization & Configuration
# ============================================

- name: Check Vault init status
  kubernetes.core.k8s_exec:
    namespace: "{{ vault_ns }}"
    pod: "vault-0"
    command: vault status -format=json
  register: vault_status_raw
  retries: 3
  delay: 10
  until: vault_status_raw is not failed
  failed_when: false
  changed_when: false

- name: Parse Vault status
  set_fact:
    vault_initialized: "{{ (vault_status_raw.stdout | from_json).initialized | default(false) }}"
  when: vault_status_raw.rc == 0 or vault_status_raw.rc == 2
  failed_when: false

- name: Initialize Vault (if not initialized)
  kubernetes.core.k8s_exec:
    namespace: "{{ vault_ns }}"
    pod: "vault-0"
    command: vault operator init -key-shares=5 -key-threshold=3 -format=json
  register: vault_init
  retries: 3
  delay: 10
  until: vault_init is not failed
  when: not (vault_initialized | default(false) | bool)
  failed_when: vault_init.rc is defined and vault_init.rc != 0

- name: Store Vault init keys as K8s secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: vault-init-keys
        namespace: "{{ vault_ns }}"
        labels:
          app: vault
      stringData:
        init-output: "{{ vault_init.stdout }}"
  when: vault_init is changed
  register: _r_store_vault_init_keys_as_k8s_secret
  retries: 3
  delay: 10
  until: _r_store_vault_init_keys_as_k8s_secret is not failed
  no_log: true

- name: Unseal Vault (primary)
  kubernetes.core.k8s_exec:
    namespace: "{{ vault_ns }}"
    pod: "vault-0"
    command: "vault operator unseal {{ (vault_init.stdout | from_json).unseal_keys_b64[item] }}"
  loop: [0, 1, 2]
  when: vault_init is changed
  no_log: true
  register: _r_unseal_vault__primary_
  retries: 3
  delay: 10
  until: _r_unseal_vault__primary_ is not failed

- name: Join raft peers (HA mode)
  kubernetes.core.k8s_exec:
    namespace: "{{ vault_ns }}"
    pod: "vault-{{ item }}"
    command: vault operator raft join http://vault-0.vault-internal:8200
  loop: "{{ range(1, vault_replicas | int) | list }}"
  when: vault_ha and vault_init is changed
  failed_when: false
  register: _r_join_raft_peers__ha_mode_
  retries: 3
  delay: 10
  until: _r_join_raft_peers__ha_mode_ is not failed

- name: Unseal raft peers (HA mode)
  kubernetes.core.k8s_exec:
    namespace: "{{ vault_ns }}"
    pod: "vault-{{ item.0 }}"
    command: "vault operator unseal {{ (vault_init.stdout | from_json).unseal_keys_b64[item.1] }}"
  loop: "{{ range(1, vault_replicas | int) | list | product([0, 1, 2]) | list }}"
  when: vault_ha and vault_init is changed
  no_log: true
  register: _r_unseal_raft_peers__ha_mode_
  retries: 3
  delay: 10
  until: _r_unseal_raft_peers__ha_mode_ is not failed

- name: Enable KV v2 secrets engine
  kubernetes.core.k8s_exec:
    namespace: "{{ vault_ns }}"
    pod: "vault-0"
    command: sh -c "VAULT_TOKEN={{ (vault_init.stdout | from_json).root_token }} vault secrets enable -path=secret kv-v2"
  when: vault_init is changed
  failed_when: false
  no_log: true
  register: _r_enable_kv_v2_secrets_engine
  retries: 3
  delay: 10
  until: _r_enable_kv_v2_secrets_engine is not failed

- name: Enable Kubernetes auth method
  kubernetes.core.k8s_exec:
    namespace: "{{ vault_ns }}"
    pod: "vault-0"
    command: sh -c "VAULT_TOKEN={{ (vault_init.stdout | from_json).root_token }} vault auth enable kubernetes"
  when: vault_init is changed
  failed_when: false
  no_log: true
  register: _r_enable_kubernetes_auth_method
  retries: 3
  delay: 10
  until: _r_enable_kubernetes_auth_method is not failed

- name: Configure Kubernetes auth method
  kubernetes.core.k8s_exec:
    namespace: "{{ vault_ns }}"
    pod: "vault-0"
    command: >-
      sh -c "VAULT_TOKEN={{ (vault_init.stdout | from_json).root_token }}
      vault write auth/kubernetes/config
      kubernetes_host=https://kubernetes.default.svc:443"
  when: vault_init is changed
  failed_when: false
  no_log: true

# ============================================
# Vault Gateway API Route
# ============================================
  register: _r_configure_kubernetes_auth_method
  retries: 3
  delay: 10
  until: _r_configure_kubernetes_auth_method is not failed

- name: Create Vault TLS certificate
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cert-manager.io/v1
      kind: Certificate
      metadata:
        name: vault-tls
        namespace: gateway-secrets
      spec:
        secretName: vault-tls
        issuerRef:
          name: letsencrypt-prod
          kind: ClusterIssuer
        dnsNames:
          - "{{ vault_domain }}"
  register: _r_create_vault_tls_certificate
  retries: 3
  delay: 10
  until: _r_create_vault_tls_certificate is not failed

- name: Create Vault HTTPRoute (VPN-only via admin-gateway)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: vault
        namespace: "{{ vault_ns }}"
      spec:
        parentRefs:
          - name: admin-gateway
            namespace: cilium-system
            sectionName: https
        hostnames:
          - "{{ vault_domain }}"
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - name: vault-ui
                port: 8200

# ============================================
# External Secrets Operator v1.2.1
# ============================================
  register: _r_create_vault_httproute_vpn_only_via_admi
  retries: 3
  delay: 10
  until: _r_create_vault_httproute_vpn_only_via_admi is not failed

- name: Create ESO namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ eso_ns }}"
        labels:
          app.kubernetes.io/part-of: external-secrets
  register: _r_create_eso_namespace
  retries: 3
  delay: 10
  until: _r_create_eso_namespace is not failed

- name: Add External Secrets Helm repository
  kubernetes.core.helm_repository:
    name: external-secrets
    repo_url: "https://charts.external-secrets.io"
  register: _r_add_external_secrets_helm_repository
  retries: 3
  delay: 10
  until: _r_add_external_secrets_helm_repository is not failed

- name: Install External Secrets Operator via Helm
  kubernetes.core.helm:
    name: external-secrets
    chart_ref: external-secrets/external-secrets
    chart_version: "{{ eso_chart_ver }}"
    release_namespace: "{{ eso_ns }}"
    create_namespace: true
    release_state: present
    wait: true
    values:
      replicaCount: "{{ 2 if tier in ['medium', 'production'] else 1 }}"
      webhook:
        replicaCount: "{{ 2 if tier in ['medium', 'production'] else 1 }}"
      certController:
        replicaCount: "{{ 2 if tier in ['medium', 'production'] else 1 }}"
      serviceMonitor:
        enabled: true
  register: _r_install_external_secrets_operator_via_he
  retries: 3
  delay: 10
  until: _r_install_external_secrets_operator_via_he is not failed

- name: Wait for ESO to be ready
  kubernetes.core.k8s_info:
    kind: Deployment
    namespace: "{{ eso_ns }}"
    name: external-secrets
  register: eso_deploy
  until: >
    eso_deploy.resources | length > 0
    and (eso_deploy.resources[0].status.readyReplicas | default(0)) >= 1
  retries: 30
  delay: 10

# ============================================
# ClusterSecretStore (Vault Backend)
# ============================================

- name: Create Vault ESO service account
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: external-secrets-vault
        namespace: "{{ eso_ns }}"
  register: _r_create_vault_eso_service_account
  retries: 3
  delay: 10
  until: _r_create_vault_eso_service_account is not failed

- name: Create Vault ESO auth role
  kubernetes.core.k8s_exec:
    namespace: "{{ vault_ns }}"
    pod: "vault-0"
    command: >-
      sh -c "VAULT_TOKEN={{ (vault_init.stdout | from_json).root_token }}
      vault write auth/kubernetes/role/external-secrets
      bound_service_account_names=external-secrets-vault
      bound_service_account_namespaces={{ eso_ns }}
      policies=default,external-secrets
      ttl=1h"
  when: vault_init is changed
  failed_when: false
  no_log: true
  register: _r_create_vault_eso_auth_role
  retries: 3
  delay: 10
  until: _r_create_vault_eso_auth_role is not failed

- name: Create Vault policy for ESO
  kubernetes.core.k8s_exec:
    namespace: "{{ vault_ns }}"
    pod: "vault-0"
    command: |
      export VAULT_TOKEN={{ (vault_init.stdout | from_json).root_token }}
      vault policy write external-secrets - <<EOF
      path "secret/data/*" {
        capabilities = ["read", "list"]
      }
      path "secret/metadata/*" {
        capabilities = ["read", "list"]
      }
      EOF
  when: vault_init is changed
  failed_when: false
  no_log: true
  register: _r_create_vault_policy_for_eso
  retries: 3
  delay: 10
  until: _r_create_vault_policy_for_eso is not failed

- name: Create ClusterSecretStore for Vault
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: external-secrets.io/v1
      kind: ClusterSecretStore
      metadata:
        name: vault-backend
      spec:
        provider:
          vault:
            server: "http://vault.{{ vault_ns }}.svc.cluster.local:8200"
            path: "secret"
            version: "v2"
            auth:
              kubernetes:
                mountPath: "kubernetes"
                role: "external-secrets"
                serviceAccountRef:
                  name: "external-secrets-vault"
                  namespace: "{{ eso_ns }}"

# ============================================
# Example ExternalSecret
# ============================================
  register: _r_create_clustersecretstore_for_vault
  retries: 3
  delay: 10
  until: _r_create_clustersecretstore_for_vault is not failed

- name: Create example ExternalSecret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata:
        name: example-secret
        namespace: default
      spec:
        refreshInterval: 1h
        secretStoreRef:
          name: vault-backend
          kind: ClusterSecretStore
        target:
          name: example-secret
          creationPolicy: Owner
        data:
          - secretKey: password
            remoteRef:
              key: example
              property: password
  register: _r_create_example_externalsecret
  retries: 3
  delay: 10
  until: _r_create_example_externalsecret is not failed

- name: Display secrets management summary
  debug:
    msg:
      - "=========================================="
      - "  Secrets Management Deployed"
      - "=========================================="
      - "  Vault: v1.21.2 (chart {{ vault_chart_ver }})"
      - "  ESO: v0.15.0 (chart {{ eso_chart_ver }})"
      - "  HA Mode: {{ vault_ha }}"
      - "  Replicas: {{ vault_replicas }}"
      - "  UI: {{ vault_domain }}"
      - "  ClusterSecretStore: vault-backend"
      - "=========================================="
