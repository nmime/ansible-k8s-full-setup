# Executed through main.yml so transient Vault authentication material is
# removed from both the controller and pod on every success or failure path.
- name: Set secrets tier-specific variables
  set_fact:
    vault_ns: vault
    eso_ns: external-secrets
    vault_chart_ver: "{{ vault_chart_version | default('0.34.0') }}"
    vault_version: "{{ vault_version | default('2.0.3') }}"
    eso_chart_ver: 2.7.0
    vault_replicas: '{{ secrets.vault.replicas | default(3 if resource_tier in [''medium'', ''production''] else 1) }}'
    # Integrated Raft is used even for a one-replica compact deployment so
    # every tier supports application-consistent snapshots and safe expansion.
    vault_ha: true
    vault_storage: '{{ vault_storage_size | default(''20Gi'') }}'
    # Audit logs are append-only but do not need a claim larger than the Raft
    # data claim on compact tiers. Operators can still opt into a larger size.
    vault_audit_storage: '{{ vault_audit_storage_size | default(vault_storage_size | default(''20Gi'')) }}'
    vault_domain: vault.{{ domain }}
- name: Create Vault namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: vault
        labels:
          app.kubernetes.io/part-of: vault
          pod-security.kubernetes.io/enforce: baseline
          pod-security.kubernetes.io/warn: restricted
  register: _r_create_vault_namespace
  retries: 3
  delay: 15
  until: _r_create_vault_namespace is not failed
- name: Prepare Vault internal TLS certificates
  ansible.builtin.include_tasks: vault_tls.yml
  when: not (vault_tls_disabled | bool)
- name: Detect protected Vault initialization material before a rolling reconcile
  ansible.builtin.stat:
    path: '{{ vault_init_output_file }}'
  register: _vault_pre_reconcile_init_stat
  delegate_to: localhost
  become: false
- name: Load protected Vault initialization material before a rolling reconcile
  ansible.builtin.command:
    argv:
    - ansible-vault
    - view
    - --vault-password-file
    - '{{ resolved_vault_password_file | default(vault_password_file | expanduser) }}'
    - '{{ vault_init_output_file }}'
  register: _vault_pre_reconcile_init_view
  delegate_to: localhost
  become: false
  changed_when: false
  no_log: true
  when: _vault_pre_reconcile_init_stat.stat.exists
- name: Prepare protected unseal keys for one-member-at-a-time reconciliation
  ansible.builtin.set_fact:
    vault_init_data: '{{ _vault_pre_reconcile_init_view.stdout | from_json }}'
  no_log: true
  when: _vault_pre_reconcile_init_stat.stat.exists
- name: Add HashiCorp Helm repository
  kubernetes.core.helm_repository:
    name: hashicorp
    repo_url: https://helm.releases.hashicorp.com
  register: _r_add_hashicorp_helm_repository
  retries: 3
  delay: 15
  until: _r_add_hashicorp_helm_repository is not failed
- name: Detect local Helm major version for post-renderer compatibility
  ansible.builtin.command: helm version --short
  register: vault_helm_version
  changed_when: false
- name: Resolve local Helm major version
  ansible.builtin.set_fact:
    vault_helm_major: >-
      {{ vault_helm_version.stdout | regex_replace('^v?([0-9]+).*', '\1') | int }}
- name: Install the Vault Helm 3 DNS post-renderer executable
  ansible.builtin.copy:
    src: vault-post-renderer.sh
    dest: /tmp/vault-post-renderer.sh
    mode: '0700'
  when: vault_helm_major | int < 4
- name: Discover Helm 4 plugin directory
  ansible.builtin.command: helm env HELM_PLUGINS
  register: vault_helm_plugins
  changed_when: false
  when: vault_helm_major | int >= 4
- name: Create the Helm 4 Vault DNS post-renderer plugin directory
  ansible.builtin.file:
    path: '{{ vault_helm_plugins.stdout }}/vault-dns'
    state: directory
    mode: '0700'
  when: vault_helm_major | int >= 4
- name: Install the Helm 4 Vault DNS post-renderer executable
  ansible.builtin.copy:
    src: vault-post-renderer.sh
    dest: '{{ vault_helm_plugins.stdout }}/vault-dns/vault-post-renderer.sh'
    mode: '0700'
  when: vault_helm_major | int >= 4
- name: Install the Helm 4 Vault DNS post-renderer plugin manifest
  ansible.builtin.copy:
    dest: '{{ vault_helm_plugins.stdout }}/vault-dns/plugin.yaml'
    mode: '0600'
    content: |
      apiVersion: v1
      type: postrenderer/v1
      name: vault-dns
      version: 1.0.0
      runtime: subprocess
      runtimeConfig:
        platformCommand:
          - command: ${HELM_PLUGIN_DIR}/vault-post-renderer.sh
  when: vault_helm_major | int >= 4
- name: Resolve the version-compatible Vault DNS post-renderer
  ansible.builtin.set_fact:
    vault_helm_post_renderer: >-
      {{ 'vault-dns' if vault_helm_major | int >= 4 else '/tmp/vault-post-renderer.sh' }}
- name: Install Vault via Helm
  kubernetes.core.helm:
    name: vault
    chart_ref: hashicorp/vault
    chart_version: '{{ vault_chart_ver }}'
    release_namespace: vault
    create_namespace: true
    release_state: present
    force_conflicts: '{{ vault_helm_major | int >= 4 }}'
    # Removed values must not linger in Helm's stored release state. This is
    # particularly important for chart-owned environment variables such as
    # VAULT_API_ADDR and VAULT_CLUSTER_ADDR, which setNodeId renders itself.
    reset_values: true
    wait: true
    timeout: 10m0s
    post_renderer: '{{ vault_helm_post_renderer }}'
    set_values:
    - value: server.ha.replicas={{ vault_replicas }}
    - value: server.ha.enabled={{ (vault_ha | bool) | lower }}
    - value: server.ha.raft.enabled={{ (vault_ha | bool) | lower }}
    - value: server.standalone.enabled={{ (not (vault_ha | bool)) | lower }}
    values:
      global:
        tlsDisable: '{{ vault_tls_disabled | bool }}'
      injector:
        enabled: false
      server:
        # Hash the rendered HCL into the OnDelete pod template so the revision
        # reconciler below can detect and roll configuration-only changes.
        includeConfigAnnotation: true
        # Keep a single chart-created PDB across every tier. A value of one
        # permits one-node-at-a-time maintenance and preserves quorum for the
        # three-replica tiers. Chart 0.34.0 hard-codes zero for one replica, so
        # the Helm post-renderer keeps that special case in Helm's ownership.
        image:
          repository: hashicorp/vault
          tag: '{{ vault_version }}'
          pullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 1Gi
        # Empty PVCs created while expanding from one to three Raft members do
        # not contain Vault's storage subdirectory. Create it as the hardened
        # Vault UID/GID before the server starts; the volume's fsGroup grants
        # the required write access without a privileged or root init process.
        extraInitContainers:
        - name: prepare-raft-data
          image: 'hashicorp/vault:{{ vault_version }}'
          imagePullPolicy: IfNotPresent
          command:
          - sh
          - -ec
          - mkdir -p /vault/data/raft; find /vault/data/raft -type f -exec chmod 0600 {} +
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
              - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
          - name: data
            mountPath: /vault/data
        statefulSet:
          securityContext:
            pod:
              runAsNonRoot: true
              runAsUser: 100
              runAsGroup: 1000
              fsGroup: 1000
              fsGroupChangePolicy: OnRootMismatch
              seccompProfile:
                type: RuntimeDefault
            container:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
        # The Vault chart consumes affinity as a templated YAML string. Keeping
        # this value a string avoids Helm coalescing type warnings while still
        # rendering required hostname separation for Raft members.
        affinity: |
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: vault
                    component: server
                topologyKey: kubernetes.io/hostname
        tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        dataStorage:
          enabled: true
          size: '{{ vault_storage }}'
          storageClass: '{{ vault_data_storage_class | default(storage_class | default(''hcloud-volumes'')) }}'
        auditStorage:
          enabled: true
          size: '{{ vault_audit_storage }}'
          storageClass: '{{ vault_audit_storage_class | default(storage_class | default(''hcloud-volumes'')) }}'
        extraEnvironmentVars:
          VAULT_CACERT: "{{ '' if vault_tls_disabled | bool else '/vault/tls/ca.crt' }}"
        volumes: >-
          {{ [] if vault_tls_disabled | bool else
             [{'name': 'vault-tls', 'secret': {'secretName': 'vault-internal-tls'}}] }}
        volumeMounts: >-
          {{ [] if vault_tls_disabled | bool else
             [{'name': 'vault-tls', 'mountPath': '/vault/tls', 'readOnly': true}] }}
        ha:
          disruptionBudget:
            enabled: true
            maxUnavailable: 1
          raft:
            setNodeId: true
            config: |
              ui = true
              listener "tcp" {
                tls_disable = {{ 1 if vault_tls_disabled | bool else 0 }}
                address = "[::]:8200"
                cluster_address = "[::]:8201"
                telemetry {
                  unauthenticated_metrics_access = true
                }
              {% if not (vault_tls_disabled | bool) %}
                tls_cert_file = "/vault/tls/tls.crt"
                tls_key_file = "/vault/tls/tls.key"
              {% endif %}
              }
              telemetry {
                prometheus_retention_time = "30s"
                disable_hostname = true
              }
              storage "raft" {
                path = "/vault/data/raft"
              {% for peer in range(0, vault_replicas | int) %}
                retry_join {
                  leader_api_addr = "{{ 'http' if vault_tls_disabled | bool else 'https' }}://vault-{{ peer }}.vault-internal.{{ vault_ns }}.svc.cluster.local:8200"
              {% if not (vault_tls_disabled | bool) %}
                  leader_ca_cert_file = "/vault/tls/ca.crt"
              {% endif %}
                }
              {% endfor %}
              }
              # Maintain the vault-active/vault-standby service selectors. The
              # backup path intentionally targets vault-active because the
              # snapshot API cannot safely follow a standby redirect.
              service_registration "kubernetes" {}
        standalone:
          config: |
            ui = true
            listener "tcp" {
              tls_disable = {{ 1 if vault_tls_disabled | bool else 0 }}
              address = "[::]:8200"
              cluster_address = "[::]:8201"
              telemetry {
                unauthenticated_metrics_access = true
              }
            {% if not (vault_tls_disabled | bool) %}
              tls_cert_file = "/vault/tls/tls.crt"
              tls_key_file = "/vault/tls/tls.key"
            {% endif %}
            }
            telemetry {
              prometheus_retention_time = "30s"
              disable_hostname = true
            }
            storage "file" {
              path = "/vault/data"
            }
        ingress:
          enabled: false
        ui:
          enabled: true
      csi:
        enabled: false
  register: _r_install_vault_via_helm
  retries: 3
  delay: 15
  until: _r_install_vault_via_helm is not failed

- name: Roll Vault safely when its mounted TLS certificate changes
  kubernetes.core.k8s:
    state: patched
    api_version: apps/v1
    kind: StatefulSet
    namespace: '{{ vault_ns }}'
    name: vault
    definition:
      spec:
        template:
          metadata:
            annotations:
              platform.example.com/vault-tls-resource-version: >-
                {{ vault_tls_secret.resources[0].metadata.resourceVersion }}
  when: not (vault_tls_disabled | bool)

- name: Read the desired Vault StatefulSet revision
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: StatefulSet
    namespace: '{{ vault_ns }}'
    name: vault
  register: _vault_statefulset
  until:
  - _vault_statefulset.resources | length == 1
  - _vault_statefulset.resources[0].status.updateRevision | default('') | length > 0
  retries: 30
  delay: 5

# The upstream chart deliberately uses OnDelete so an operator controls sealed
# server restarts. Reconcile peers first and the primary last, one pod at a time,
# before applying the protected unseal keys below.
- name: Reconcile Vault pods to the desired OnDelete revision
  ansible.builtin.include_tasks: reconcile_vault_pod.yml
  loop: '{{ (range(1, vault_replicas | int) | list) + [0] }}'
  loop_control:
    loop_var: vault_pod_index

- name: Wait for Vault pods to be running
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: '{{ vault_ns }}'
    label_selectors:
    - app.kubernetes.io/name=vault
    - component=server
  register: vault_pods
  until: '(vault_pods.resources | default([])) | length >= (vault_replicas | int) and (vault_pods.resources | default([])) | map(attribute=''status.phase'') | select(''equalto'', ''Running'') | list | length >= (vault_replicas | int)

    '
  retries: 120
  delay: 15
  failed_when: false
  when: not (vault_initialized | default(false) | bool) and vault_ha | bool
- name: Wait for the Vault server container before checking initialization
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: '{{ vault_ns }}'
    name: vault-0
  register: vault_server_pod
  until:
    - vault_server_pod.resources | length == 1
    - vault_server_pod.resources[0].status.phase | default('') == 'Running'
    - vault_server_pod.resources[0].status.containerStatuses | default([]) | length > 0
    - vault_server_pod.resources[0].status.containerStatuses[0].state.running is defined
  retries: 120
  delay: 5

- name: Check Vault init status
  kubernetes.core.k8s_exec:
    namespace: '{{ vault_ns }}'
    pod: vault-0
    command: vault status -format=json
  register: vault_status_raw
  retries: 60
  delay: 5
  until:
    - vault_status_raw.rc is defined
    - vault_status_raw.rc in [0, 2]
    - vault_status_raw.stdout | default('') | length > 0
  failed_when: false
  changed_when: false
- name: Refuse to continue when Vault initialization state is unknown
  ansible.builtin.assert:
    that:
      - vault_status_raw.rc is defined
      - vault_status_raw.rc in [0, 2]
      - vault_status_raw.stdout | default('') | length > 0
    fail_msg: >-
      Vault status could not be determined safely. No initialization or data
      cleanup was attempted. Restore connectivity and rerun the playbook.
- name: Parse Vault status
  set_fact:
    vault_initialized: '{{ (vault_status_raw.stdout | from_json).initialized | default(false) }}'
  when: vault_status_raw.rc is defined and (vault_status_raw.rc == 0 or vault_status_raw.rc == 2)
  failed_when: false
- name: Prove Vault initialization material can be encrypted before initialization
  ansible.builtin.command:
    argv:
    - ansible-vault
    - encrypt_string
    - --vault-password-file
    - '{{ resolved_vault_password_file | default(vault_password_file | expanduser) }}'
    - --encrypt-vault-id
    - default
    - --name
    - probe
    - probe
  delegate_to: localhost
  become: false
  changed_when: false
  no_log: true
  when: not (vault_initialized | default(false) | bool)
- name: Initialize Vault (if not initialized)
  kubernetes.core.k8s_exec:
    namespace: '{{ vault_ns }}'
    pod: vault-0
    command: vault operator init -key-shares=5 -key-threshold=3 -format=json
  register: vault_init
  retries: 3
  delay: 15
  until: vault_init is not failed
  when: not (vault_initialized | default(false) | bool)
  failed_when: vault_init.rc is defined and vault_init.rc != 0
  no_log: true
- name: Normalize vault init output
  set_fact:
    vault_init_data: '{{ vault_init.stdout if vault_init.stdout is mapping else vault_init.stdout | from_json }}'
  when: vault_init is changed
  no_log: true
- name: Save Vault initialization material outside the cluster
  block:
  - name: Write Vault initialization material to a temporary local file
    ansible.builtin.copy:
      content: '{{ vault_init_data | to_nice_json }}'
      dest: '{{ vault_init_output_file }}.tmp'
      mode: '0600'
    delegate_to: localhost
    become: false
    no_log: true

  - name: Encrypt Vault initialization material with Ansible Vault
    ansible.builtin.command:
      argv:
      - ansible-vault
      - encrypt
      - --vault-password-file
      - '{{ resolved_vault_password_file | default(vault_password_file | expanduser) }}'
      - --encrypt-vault-id
      - default
      - --output
      - '{{ vault_init_output_file }}'
      - '{{ vault_init_output_file }}.tmp'
    delegate_to: localhost
    become: false
    changed_when: true
    no_log: true
    register: vault_init_encrypt
  rescue:
  - name: Refuse to discard unencrypted Vault recovery material
    ansible.builtin.fail:
      msg: >-
        Vault initialization material encryption failed. The mode-0600
        recovery file was retained at {{ vault_init_output_file }}.tmp.
        Protect and encrypt it before retrying; it is the only copy of the
        current unseal keys and root token.
  always:
  - name: Remove temporary Vault initialization material
    ansible.builtin.file:
      path: '{{ vault_init_output_file }}.tmp'
      state: absent
    delegate_to: localhost
    become: false
    no_log: true
    when: vault_init_encrypt is defined and vault_init_encrypt is succeeded
  when: vault_init is changed
- name: Check encrypted Vault initialization material for an existing cluster
  ansible.builtin.stat:
    path: '{{ vault_init_output_file }}'
  register: vault_init_output_stat
  delegate_to: localhost
  become: false
  when: vault_initialized | default(false) | bool
- name: Require encrypted Vault initialization material for reconciliation
  ansible.builtin.assert:
    that:
    - vault_init_output_stat.stat.exists
    - vault_init_output_stat.stat.isreg
    fail_msg: >-
      Vault is already initialized, but {{ vault_init_output_file }} is not an
      encrypted regular file. Restore that file from the protected operator
      backup before reconciling Vault authentication or backup policy.
  when: vault_initialized | default(false) | bool
- name: Load encrypted Vault initialization material for reconciliation
  ansible.builtin.command:
    argv:
    - ansible-vault
    - view
    - --vault-password-file
    - '{{ resolved_vault_password_file | default(vault_password_file | expanduser) }}'
    - '{{ vault_init_output_file }}'
  register: vault_init_view
  delegate_to: localhost
  become: false
  changed_when: false
  no_log: true
  when: vault_initialized | default(false) | bool
- name: Parse existing Vault initialization material
  ansible.builtin.set_fact:
    vault_init_data: '{{ vault_init_view.stdout | from_json }}'
  no_log: true
  when: vault_initialized | default(false) | bool
- name: Unseal Vault (primary)
  kubernetes.core.k8s_exec:
    namespace: '{{ vault_ns }}'
    pod: vault-0
    command: >-
      sh -c 'for key do
      vault operator unseal "$key" >/dev/null 2>&1 || true;
      sleep 1;
      vault status >/dev/null 2>&1; rc=$?;
      [ "$rc" -eq 0 ] && exit 0;
      done;
      exit 1' --
      {{ vault_init_data.unseal_keys_b64 | join(' ') }}
  when: vault_init_data is defined
  no_log: true
  register: _r_unseal_vault__primary_
  retries: 3
  delay: 5
  until: _r_unseal_vault__primary_ is not failed
- name: Wait for Vault leader to be ready for raft
  kubernetes.core.k8s_exec:
    namespace: '{{ vault_ns }}'
    pod: vault-0
    command: vault status
  when: vault_ha | bool and vault_init_data is defined
  register: _r_vault_leader_status
  retries: 12
  delay: 5
  until: _r_vault_leader_status.rc is defined and _r_vault_leader_status.rc == 0
  failed_when: false
- name: Require the primary Vault server to be unsealed
  ansible.builtin.assert:
    that:
    - _r_vault_leader_status.rc is defined
    - _r_vault_leader_status.rc == 0
    fail_msg: Vault remained sealed after applying the protected operator unseal keys.
  when: vault_ha | bool and vault_init_data is defined
- name: Join raft peers (HA mode)
  kubernetes.core.k8s_exec:
    namespace: '{{ vault_ns }}'
    pod: vault-{{ item }}
    command: >-
      sh -ec '
      if vault status -format=json 2>/dev/null |
         grep -Eq "\"initialized\"[[:space:]]*:[[:space:]]*true"; then
        exit 0;
      fi;
      vault operator raft join
      https://vault-0.vault-internal.{{ vault_ns }}.svc.cluster.local:8200
      '
  loop: '{{ range(1, vault_replicas | int) | list }}'
  when: vault_ha | bool and vault_init is changed
  register: _r_join_raft_peers__ha_mode_
  retries: 10
  delay: 15
  until: _r_join_raft_peers__ha_mode_.rc | default(1) == 0
- name: Wait for raft peers to recognize initialization
  kubernetes.core.k8s_exec:
    namespace: '{{ vault_ns }}'
    pod: vault-{{ item }}
    command: vault status -format=json
  loop: '{{ range(1, vault_replicas | int) | list }}'
  when: vault_ha | bool and vault_init_data is defined
  register: _r_wait_raft_init
  retries: 120
  delay: 5
  failed_when: false
  until: _r_wait_raft_init.stdout is defined and (_r_wait_raft_init.stdout | from_json).initialized | default(false)
- name: Unseal raft peers (HA mode)
  kubernetes.core.k8s_exec:
    namespace: '{{ vault_ns }}'
    pod: vault-{{ item }}
    command: >-
      sh -c 'for key do
      vault operator unseal "$key" >/dev/null 2>&1 || true;
      sleep 1;
      vault status >/dev/null 2>&1; rc=$?;
      [ "$rc" -eq 0 ] && exit 0;
      done;
      exit 1' --
      {{ vault_init_data.unseal_keys_b64 | join(' ') }}
  loop: '{{ range(1, vault_replicas | int) | list }}'
  when: vault_ha | bool and vault_init_data is defined
  no_log: true
  register: _r_unseal_raft_peers__ha_mode_
  retries: 3
  delay: 5
  until: _r_unseal_raft_peers__ha_mode_ is not failed
- name: Remove legacy in-cluster Vault auto-unseal job
  kubernetes.core.k8s:
    state: absent
    api_version: batch/v1
    kind: CronJob
    name: vault-auto-unseal
    namespace: '{{ vault_ns }}'
  when: vault_init is changed
- name: Remove legacy in-cluster Vault initialization keys
  no_log: true
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Secret
    name: vault-init-keys
    namespace: '{{ vault_ns }}'
- name: Allocate a transient controller file for Vault authentication
  ansible.builtin.tempfile:
    state: file
    prefix: ansible-vault-root-token-
  register: _vault_token_controller_tempfile
  no_log: true
  when: vault_init_data is defined
- name: Record transient Vault token file paths for guaranteed cleanup
  ansible.builtin.set_fact:
    vault_token_controller_file: '{{ _vault_token_controller_tempfile.path }}'
    vault_token_remote_file: >-
      /tmp/{{ _vault_token_controller_tempfile.path | basename }}
  no_log: true
  when: vault_init_data is defined
- name: Write the Vault token to the mode-0600 controller file
  ansible.builtin.copy:
    content: "{{ vault_init_data.root_token }}\n"
    dest: '{{ vault_token_controller_file }}'
    mode: '0600'
  no_log: true
  when: vault_init_data is defined
- name: Copy the transient Vault token file into the Vault pod
  kubernetes.core.k8s_cp:
    namespace: '{{ vault_ns }}'
    pod: vault-0
    container: vault
    local_path: '{{ vault_token_controller_file }}'
    remote_path: '{{ vault_token_remote_file }}'
    state: to_pod
  no_log: true
  when: vault_init_data is defined
- name: Enforce mode 0600 on the transient Vault pod token file
  kubernetes.core.k8s_exec:
    namespace: '{{ vault_ns }}'
    pod: vault-0
    command: >-
      chmod 0600 -- {{ vault_token_remote_file }}
  changed_when: false
  no_log: true
  when: vault_init_data is defined
- name: Validate the generated credential Vault mirror boundary
  ansible.builtin.assert:
    that:
    - platform_generated_secret_bundle is defined
    - (platform_generated_secret_bundle | length) > 0
    - >-
      vault_platform_generated_secret_path | string is
      match('^[A-Za-z0-9][A-Za-z0-9._/-]{0,254}$')
    - >-
      '..' not in (vault_platform_generated_secret_path | string).split('/')
    - >-
      '*' not in (vault_platform_generated_secret_path | string)
    fail_msg: >-
      The generated credential mirror requires the protected local recovery
      bundle and one exact Vault KV-v2 path.
  no_log: true
  when:
  - vault_init_data is defined
  - vault_platform_generated_seed_enabled | bool
- name: Read the generated platform credential mirror from Vault
  kubernetes.core.k8s_exec:
    namespace: '{{ vault_ns }}'
    pod: vault-0
    command: >-
      sh -ec 'VAULT_TOKEN=$(cat "$1"); export VAULT_TOKEN;
      exec vault kv get -format=json "secret/$2"' --
      {{ vault_token_remote_file }} {{ vault_platform_generated_secret_path }}
  register: _vault_platform_generated_read
  changed_when: false
  failed_when: false
  no_log: true
  when:
  - vault_init_data is defined
  - vault_platform_generated_seed_enabled | bool
- name: Reject errors while reading the generated credential mirror
  ansible.builtin.assert:
    that:
    - >-
      (_vault_platform_generated_read.rc | int) == 0 or
      ((_vault_platform_generated_read.rc | int) == 2 and
      'No value found at' in
      ((_vault_platform_generated_read.stdout | default('')) ~
      (_vault_platform_generated_read.stderr | default(''))))
    fail_msg: >-
      Vault credential mirror discovery failed for a reason other than a
      missing key; refusing to overwrite it.
  no_log: true
  when:
  - vault_init_data is defined
  - vault_platform_generated_seed_enabled | bool
- name: Capture the existing generated credential mirror revision
  ansible.builtin.set_fact:
    _vault_platform_generated_existing_bundle: >-
      {{ (_vault_platform_generated_read.stdout | from_json).data.data }}
    _vault_platform_generated_existing_version: >-
      {{ (_vault_platform_generated_read.stdout | from_json).data.metadata.version
      | int }}
  no_log: true
  when:
  - vault_init_data is defined
  - vault_platform_generated_seed_enabled | bool
  - (_vault_platform_generated_read.rc | int) == 0
- name: Identify generated credential drift keys without exposing values
  ansible.builtin.set_fact:
    _vault_platform_generated_drift_keys: >-
      {%- set drift = [] -%}
      {%- set all_keys =
        ((_vault_platform_generated_existing_bundle.keys() | list) +
         (platform_generated_secret_bundle.keys() | list)) | unique -%}
      {%- for key in all_keys | sort -%}
      {%-   if key not in _vault_platform_generated_existing_bundle or
              key not in platform_generated_secret_bundle or
              _vault_platform_generated_existing_bundle[key] !=
                platform_generated_secret_bundle[key] -%}
      {%-     set _ = drift.append(key) -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ drift }}
  when:
  - vault_init_data is defined
  - vault_platform_generated_seed_enabled | bool
  - (_vault_platform_generated_read.rc | int) == 0
- name: Read the live GitLab Runner token for an authorized Vault adoption
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    namespace: '{{ vault_platform_generated_gitlab_runner_secret_namespace }}'
    name: '{{ vault_platform_generated_gitlab_runner_secret_name }}'
  register: _vault_platform_generated_gitlab_runner_secret
  no_log: true
  when:
  - vault_init_data is defined
  - vault_platform_generated_seed_enabled | bool
  - (_vault_platform_generated_read.rc | int) == 0
  - vault_platform_generated_gitlab_runner_rotation_allowed | bool
- name: Require the authorized GitLab Runner token to match the live runtime
  ansible.builtin.assert:
    that:
    - _vault_platform_generated_gitlab_runner_secret.resources | length == 1
    - >-
      vault_platform_generated_gitlab_runner_secret_key in
      (_vault_platform_generated_gitlab_runner_secret.resources[0].data |
       default({}))
    - >-
      ((_vault_platform_generated_gitlab_runner_secret.resources[0].data[
        vault_platform_generated_gitlab_runner_secret_key] | b64decode) ==
       platform_generated_secret_bundle['gitlab_runner_token'])
    fail_msg: >-
      Refusing GitLab Runner token adoption because the encrypted recovery
      token does not exactly match the active Kubernetes runtime Secret.
  no_log: true
  when:
  - vault_init_data is defined
  - vault_platform_generated_seed_enabled | bool
  - (_vault_platform_generated_read.rc | int) == 0
  - vault_platform_generated_gitlab_runner_rotation_allowed | bool
- name: Classify the authorized alert bootstrap plus live Runner adoption
  ansible.builtin.set_fact:
    _vault_platform_generated_alert_and_gitlab_runner_bootstrap: >-
      {{
        (vault_platform_generated_gitlab_runner_rotation_allowed | bool) and
        ((_vault_platform_generated_existing_bundle[
          'alert_telegram_bot_token'] | default('') | length) == 0) and
        ((_vault_platform_generated_existing_bundle[
          'alert_telegram_chat_id'] | default('') | length) == 0) and
        ((platform_generated_secret_bundle['alert_telegram_bot_token']
          | default('') | length) > 0) and
        ((platform_generated_secret_bundle['alert_telegram_chat_id']
          | default('') | length) > 0) and
        ((_vault_platform_generated_existing_bundle | combine({
          'alert_telegram_bot_token':
            platform_generated_secret_bundle['alert_telegram_bot_token'],
          'alert_telegram_chat_id':
            platform_generated_secret_bundle['alert_telegram_chat_id'],
          'gitlab_runner_token':
            platform_generated_secret_bundle['gitlab_runner_token']
        })) == platform_generated_secret_bundle)
      }}
  no_log: true
  when:
  - vault_init_data is defined
  - vault_platform_generated_seed_enabled | bool
  - (_vault_platform_generated_read.rc | int) == 0
  - vault_platform_generated_gitlab_runner_rotation_allowed | bool
- name: Classify the explicitly authorized live GitLab Runner rotation
  ansible.builtin.set_fact:
    _vault_platform_generated_gitlab_runner_rotation: >-
      {{
        (vault_platform_generated_gitlab_runner_rotation_allowed | bool) and
        ((_vault_platform_generated_existing_bundle | combine({
          'gitlab_runner_token':
            platform_generated_secret_bundle['gitlab_runner_token']
        })) == platform_generated_secret_bundle)
      }}
  no_log: true
  when:
  - vault_init_data is defined
  - vault_platform_generated_seed_enabled | bool
  - (_vault_platform_generated_read.rc | int) == 0
  - vault_platform_generated_gitlab_runner_rotation_allowed | bool
- name: Classify the one-time alert credential bootstrap
  ansible.builtin.set_fact:
    _vault_platform_generated_alert_bootstrap: >-
      {{
        ((_vault_platform_generated_existing_bundle[
          'alert_telegram_bot_token'] | default('') | length) == 0) and
        ((_vault_platform_generated_existing_bundle[
          'alert_telegram_chat_id'] | default('') | length) == 0) and
        ((platform_generated_secret_bundle['alert_telegram_bot_token']
          | default('') | length) > 0) and
        ((platform_generated_secret_bundle['alert_telegram_chat_id']
          | default('') | length) > 0) and
        ((_vault_platform_generated_existing_bundle | combine({
          'alert_telegram_bot_token':
            platform_generated_secret_bundle['alert_telegram_bot_token'],
          'alert_telegram_chat_id':
            platform_generated_secret_bundle['alert_telegram_chat_id']
        })) == platform_generated_secret_bundle)
      }}
  no_log: true
  when:
  - vault_init_data is defined
  - vault_platform_generated_seed_enabled | bool
  - (_vault_platform_generated_read.rc | int) == 0
- name: Classify an explicitly authorized Telegram destination rotation
  ansible.builtin.set_fact:
    _vault_platform_generated_alert_destination_rotation: >-
      {{
        (vault_platform_generated_alert_destination_rotation_allowed | bool) and
        ((_vault_platform_generated_existing_bundle[
          'alert_telegram_bot_token'] | default('')) ==
         (platform_generated_secret_bundle[
          'alert_telegram_bot_token'] | default(''))) and
        ((platform_generated_secret_bundle[
          'alert_telegram_chat_id'] | default('') | length) > 0) and
        ((_vault_platform_generated_existing_bundle[
          'alert_telegram_chat_id'] | default('')) !=
         (platform_generated_secret_bundle[
          'alert_telegram_chat_id'] | default(''))) and
        ((_vault_platform_generated_drift_keys | default([])) ==
         ['alert_telegram_chat_id']) and
        ((_vault_platform_generated_existing_bundle | combine({
          'alert_telegram_chat_id':
            platform_generated_secret_bundle['alert_telegram_chat_id']
        })) == platform_generated_secret_bundle)
      }}
  no_log: true
  when:
  - vault_init_data is defined
  - vault_platform_generated_seed_enabled | bool
  - (_vault_platform_generated_read.rc | int) == 0
  - vault_platform_generated_alert_destination_rotation_allowed | bool
- name: Classify an explicitly authorized DR credential rotation
  ansible.builtin.set_fact:
    _vault_platform_generated_dr_rotation: >-
      {{
        (vault_platform_generated_dr_rotation_allowed | bool) and
        ((platform_generated_secret_bundle['backup_dr_access_key']
          | default('') | length) >= 8) and
        ((platform_generated_secret_bundle['backup_dr_secret_key']
          | default('') | length) >= 16) and
        ((_vault_platform_generated_existing_bundle | combine({
          'backup_dr_access_key':
            platform_generated_secret_bundle['backup_dr_access_key'],
          'backup_dr_secret_key':
            platform_generated_secret_bundle['backup_dr_secret_key']
        })) == platform_generated_secret_bundle)
      }}
  no_log: true
  when:
  - vault_init_data is defined
  - vault_platform_generated_seed_enabled | bool
  - (_vault_platform_generated_read.rc | int) == 0
- name: Refuse divergent generated credentials in Vault
  ansible.builtin.assert:
    that:
    - >-
      (_vault_platform_generated_existing_bundle ==
      platform_generated_secret_bundle) or
      (_vault_platform_generated_alert_bootstrap | default(false) | bool) or
      (_vault_platform_generated_alert_and_gitlab_runner_bootstrap |
       default(false) | bool) or
      (_vault_platform_generated_gitlab_runner_rotation |
       default(false) | bool) or
      (_vault_platform_generated_alert_destination_rotation |
       default(false) | bool) or
      (_vault_platform_generated_dr_rotation | default(false) | bool)
    fail_msg: >-
      Generated credentials differ between the encrypted recovery bundle and
      Vault. Only the compare-and-set transition from empty to configured
      Telegram alert credentials is automatic. DR credential rotation requires
      the explicit one-run authorization. GitLab Runner token adoption also
      requires an explicit one-run authorization and an exact match with the
      active runtime Secret. Telegram destination rotation requires its own
      one-run authorization and permits only the chat ID to differ; every other overwrite is
      forbidden.
      Drifted key names={{ _vault_platform_generated_drift_keys | default([]) }}
  no_log: true
  when:
  - vault_init_data is defined
  - vault_platform_generated_seed_enabled | bool
  - (_vault_platform_generated_read.rc | int) == 0
- name: Allocate a transient generated credential mirror file
  ansible.builtin.tempfile:
    state: file
    prefix: ansible-vault-platform-generated-
  register: _vault_platform_generated_tempfile
  delegate_to: localhost
  become: false
  no_log: true
  when:
  - vault_init_data is defined
  - vault_platform_generated_seed_enabled | bool
  - >-
    (_vault_platform_generated_read.rc | int) == 2 or
    (_vault_platform_generated_alert_bootstrap | default(false) | bool) or
    (_vault_platform_generated_alert_and_gitlab_runner_bootstrap |
     default(false) | bool) or
    (_vault_platform_generated_gitlab_runner_rotation |
     default(false) | bool) or
    (_vault_platform_generated_alert_destination_rotation |
     default(false) | bool) or
    (_vault_platform_generated_dr_rotation | default(false) | bool)
- name: Record generated credential mirror paths for guaranteed cleanup
  ansible.builtin.set_fact:
    vault_platform_generated_controller_file: >-
      {{ _vault_platform_generated_tempfile.path }}
    vault_platform_generated_remote_file: >-
      /tmp/{{ _vault_platform_generated_tempfile.path | basename }}
  no_log: true
  when:
  - _vault_platform_generated_tempfile is not skipped
- name: Stage generated credentials in the transient controller file
  ansible.builtin.copy:
    content: '{{ platform_generated_secret_bundle | to_nice_json }}'
    dest: '{{ vault_platform_generated_controller_file }}'
    mode: '0600'
  delegate_to: localhost
  become: false
  no_log: true
  when:
  - vault_platform_generated_controller_file is defined
- name: Copy the generated credential mirror file into the Vault pod
  kubernetes.core.k8s_cp:
    namespace: '{{ vault_ns }}'
    pod: vault-0
    container: vault
    local_path: '{{ vault_platform_generated_controller_file }}'
    remote_path: '{{ vault_platform_generated_remote_file }}'
    state: to_pod
  no_log: true
  when:
  - vault_platform_generated_remote_file is defined
- name: Seed or one-time-bootstrap the generated credential mirror
  kubernetes.core.k8s_exec:
    namespace: '{{ vault_ns }}'
    pod: vault-0
    command: >-
      sh -ec 'chmod 0600 "$2";
      VAULT_TOKEN=$(cat "$1"); export VAULT_TOKEN;
      if [ "$4" = "0" ]; then
        exec vault kv put "secret/$3" @"$2";
      fi;
      exec vault kv put -cas="$4" "secret/$3" @"$2"' --
      {{ vault_token_remote_file }} {{ vault_platform_generated_remote_file }}
      {{ vault_platform_generated_secret_path }}
      {{ _vault_platform_generated_existing_version | default(0) }}
  no_log: true
  register: _vault_platform_generated_seed
  retries: 3
  delay: 5
  until: _vault_platform_generated_seed is not failed
  when:
  - vault_platform_generated_remote_file is defined
- name: Verify the generated platform credential mirror after seeding
  kubernetes.core.k8s_exec:
    namespace: '{{ vault_ns }}'
    pod: vault-0
    command: >-
      sh -ec 'VAULT_TOKEN=$(cat "$1"); export VAULT_TOKEN;
      exec vault kv get -format=json "secret/$2"' --
      {{ vault_token_remote_file }} {{ vault_platform_generated_secret_path }}
  register: _vault_platform_generated_verified
  changed_when: false
  no_log: true
  when:
  - vault_platform_generated_remote_file is defined
- name: Prove the generated credential mirror was seeded exactly
  ansible.builtin.assert:
    that:
    - >-
      ((_vault_platform_generated_verified.stdout | from_json).data.data) ==
      platform_generated_secret_bundle
    fail_msg: Vault did not persist the generated credential mirror exactly.
  no_log: true
  when:
  - vault_platform_generated_remote_file is defined
- name: Read Vault raft membership from the leader
  kubernetes.core.k8s_exec:
    namespace: '{{ vault_ns }}'
    pod: vault-0
    command: >-
      sh -ec 'VAULT_TOKEN=$(cat "$1"); export VAULT_TOKEN;
      exec vault operator raft list-peers -format=json' --
      {{ vault_token_remote_file }}
  register: _vault_raft_peers_raw
  changed_when: false
  no_log: true
  retries: 12
  delay: 5
  until: >-
    _vault_raft_peers_raw.rc | default(1) == 0 and
    (((_vault_raft_peers_raw.stdout | from_json)
    .get('data', {}).get('config', {}).get('servers', [])) | length) ==
    (vault_replicas | int)
  when: vault_ha | bool and vault_init_data is defined
- name: Build expected Vault raft membership
  ansible.builtin.set_fact:
    vault_expected_raft_node_ids: >-
      {{ range(0, vault_replicas | int) | map('string') |
      map('regex_replace', '^', 'vault-') | list }}
    vault_raft_servers: >-
      {{ (_vault_raft_peers_raw.stdout | from_json)
      .get('data', {}).get('config', {}).get('servers', []) }}
  when: vault_ha | bool and vault_init_data is defined
- name: Prove exact Vault raft quorum
  ansible.builtin.assert:
    that:
    - (vault_raft_servers | length) == (vault_replicas | int)
    - >-
      (vault_raft_servers | map(attribute='node_id') | list | sort) ==
      (vault_expected_raft_node_ids | sort)
    - >-
      (vault_raft_servers | selectattr('voter', 'defined') |
      selectattr('voter', 'equalto', true) | list | length) ==
      (vault_replicas | int)
    - >-
      (vault_raft_servers | selectattr('leader', 'defined') |
      selectattr('leader', 'equalto', true) | list | length) == 1
    fail_msg: >-
      Vault Raft membership is unsafe. Expected nodes
      {{ vault_expected_raft_node_ids | sort }}, observed
      {{ vault_raft_servers | map(attribute='node_id') | list | sort }};
      voters={{ vault_raft_servers | selectattr('voter', 'defined') |
      selectattr('voter', 'equalto', true) | list | length }},
      leaders={{ vault_raft_servers | selectattr('leader', 'defined') |
      selectattr('leader', 'equalto', true) | list | length }}.
  when: vault_ha | bool and vault_init_data is defined
- name: Discover Vault secrets engines before reconciliation
  kubernetes.core.k8s_exec:
    namespace: '{{ vault_ns }}'
    pod: vault-0
    command: >-
      sh -ec 'VAULT_TOKEN=$(cat "$1"); export VAULT_TOKEN;
      exec vault secrets list -format=json' --
      {{ vault_token_remote_file }}
  when: vault_init_data is defined
  changed_when: false
  no_log: true
  register: _vault_secret_mounts_raw
  retries: 3
  delay: 15
  until: >-
    _vault_secret_mounts_raw.rc is defined and
    _vault_secret_mounts_raw.rc == 0
- name: Parse Vault secrets engines before reconciliation
  ansible.builtin.set_fact:
    vault_secret_mounts: '{{ _vault_secret_mounts_raw.stdout | from_json }}'
  when: vault_init_data is defined
  no_log: true
- name: Reject an incompatible Vault secret mount
  ansible.builtin.assert:
    that:
    - >-
      'secret/' not in vault_secret_mounts or
      vault_secret_mounts['secret/'].type | default('') == 'kv'
    - >-
      'secret/' not in vault_secret_mounts or
      vault_secret_mounts['secret/'].options.version | default('') | string == '2'
    fail_msg: >-
      Vault path secret/ already exists but is not a KV-v2 secrets engine.
      Refusing to replace or mutate an incompatible secrets mount.
  when: vault_init_data is defined
  no_log: true
- name: Enable missing KV-v2 secrets engine
  kubernetes.core.k8s_exec:
    namespace: '{{ vault_ns }}'
    pod: vault-0
    command: >-
      sh -ec 'VAULT_TOKEN=$(cat "$1"); export VAULT_TOKEN;
      exec vault secrets enable -path=secret kv-v2' --
      {{ vault_token_remote_file }}
  when:
  - vault_init_data is defined
  - "'secret/' not in vault_secret_mounts"
  no_log: true
  register: _r_enable_kv_v2_secrets_engine
  retries: 3
  delay: 15
  until: >-
    _r_enable_kv_v2_secrets_engine.rc is defined and
    _r_enable_kv_v2_secrets_engine.rc == 0
- name: Verify reconciled Vault secrets engines
  kubernetes.core.k8s_exec:
    namespace: '{{ vault_ns }}'
    pod: vault-0
    command: >-
      sh -ec 'VAULT_TOKEN=$(cat "$1"); export VAULT_TOKEN;
      exec vault secrets list -format=json' --
      {{ vault_token_remote_file }}
  when: vault_init_data is defined
  changed_when: false
  no_log: true
  register: _vault_secret_mounts_verified_raw
  retries: 3
  delay: 15
  until: >-
    _vault_secret_mounts_verified_raw.rc is defined and
    _vault_secret_mounts_verified_raw.rc == 0
- name: Prove the KV-v2 secrets engine is reconciled
  ansible.builtin.assert:
    that:
    - "'secret/' in (_vault_secret_mounts_verified_raw.stdout | from_json)"
    - >-
      (_vault_secret_mounts_verified_raw.stdout | from_json)['secret/'].type == 'kv'
    - >-
      (_vault_secret_mounts_verified_raw.stdout |
      from_json)['secret/'].options.version | string == '2'
    fail_msg: Vault path secret/ was not reconciled as a KV-v2 secrets engine.
  when: vault_init_data is defined
  no_log: true
- name: Enable Vault file audit device
  kubernetes.core.k8s_exec:
    namespace: '{{ vault_ns }}'
    pod: vault-0
    command: >-
      sh -ec 'VAULT_TOKEN=$(cat "$1"); export VAULT_TOKEN;
      exec vault audit enable file file_path=/vault/audit/audit.log' --
      {{ vault_token_remote_file }}
  register: _r_enable_vault_audit
  retries: 3
  delay: 10
  until: _r_enable_vault_audit is not failed
  failed_when: _r_enable_vault_audit.rc is defined and _r_enable_vault_audit.rc != 0 and "already in use" not in (_r_enable_vault_audit.stderr | default(''))
  when: vault_init is changed
  no_log: true
- name: Discover Vault auth methods before reconciliation
  kubernetes.core.k8s_exec:
    namespace: '{{ vault_ns }}'
    pod: vault-0
    command: >-
      sh -ec 'VAULT_TOKEN=$(cat "$1"); export VAULT_TOKEN;
      exec vault auth list -format=json' --
      {{ vault_token_remote_file }}
  when: vault_init_data is defined
  changed_when: false
  no_log: true
  register: _vault_auth_methods_raw
  retries: 3
  delay: 15
  until: >-
    _vault_auth_methods_raw.rc is defined and
    _vault_auth_methods_raw.rc == 0
- name: Parse Vault auth methods before reconciliation
  ansible.builtin.set_fact:
    vault_auth_methods: '{{ _vault_auth_methods_raw.stdout | from_json }}'
  when: vault_init_data is defined
  no_log: true
- name: Reject an incompatible Vault Kubernetes auth mount
  ansible.builtin.assert:
    that:
    - >-
      'kubernetes/' not in vault_auth_methods or
      vault_auth_methods['kubernetes/'].type | default('') == 'kubernetes'
    fail_msg: >-
      Vault auth path kubernetes/ already exists with an incompatible type.
      Refusing to replace or mutate that auth mount.
  when: vault_init_data is defined
  no_log: true
- name: Enable missing Kubernetes auth method
  kubernetes.core.k8s_exec:
    namespace: '{{ vault_ns }}'
    pod: vault-0
    command: >-
      sh -ec 'VAULT_TOKEN=$(cat "$1"); export VAULT_TOKEN;
      exec vault auth enable kubernetes' --
      {{ vault_token_remote_file }}
  when:
  - vault_init_data is defined
  - "'kubernetes/' not in vault_auth_methods"
  no_log: true
  register: _r_enable_kubernetes_auth_method
  retries: 3
  delay: 15
  until: >-
    _r_enable_kubernetes_auth_method.rc is defined and
    _r_enable_kubernetes_auth_method.rc == 0
- name: Configure Kubernetes auth method
  kubernetes.core.k8s_exec:
    namespace: '{{ vault_ns }}'
    pod: vault-0
    command: >-
      sh -ec 'VAULT_TOKEN=$(cat "$1"); export VAULT_TOKEN;
      exec vault write auth/kubernetes/config
      kubernetes_host=https://kubernetes.default.svc:443' --
      {{ vault_token_remote_file }}
  when: vault_init_data is defined
  no_log: true
  register: _r_configure_kubernetes_auth_method
  retries: 3
  delay: 15
  until: _r_configure_kubernetes_auth_method is not failed
- name: Verify reconciled Vault auth methods
  kubernetes.core.k8s_exec:
    namespace: '{{ vault_ns }}'
    pod: vault-0
    command: >-
      sh -ec 'VAULT_TOKEN=$(cat "$1"); export VAULT_TOKEN;
      exec vault auth list -format=json' --
      {{ vault_token_remote_file }}
  when: vault_init_data is defined
  changed_when: false
  no_log: true
  register: _vault_auth_methods_verified_raw
  retries: 3
  delay: 15
  until: >-
    _vault_auth_methods_verified_raw.rc is defined and
    _vault_auth_methods_verified_raw.rc == 0
- name: Prove the Kubernetes auth method is reconciled
  ansible.builtin.assert:
    that:
    - "'kubernetes/' in (_vault_auth_methods_verified_raw.stdout | from_json)"
    - >-
      (_vault_auth_methods_verified_raw.stdout |
      from_json)['kubernetes/'].type == 'kubernetes'
    fail_msg: Vault auth path kubernetes/ was not reconciled with type kubernetes.
  when: vault_init_data is defined
  no_log: true
- name: Verify the Vault Kubernetes auth configuration
  kubernetes.core.k8s_exec:
    namespace: '{{ vault_ns }}'
    pod: vault-0
    command: >-
      sh -ec 'VAULT_TOKEN=$(cat "$1"); export VAULT_TOKEN;
      exec vault read -format=json auth/kubernetes/config' --
      {{ vault_token_remote_file }}
  when: vault_init_data is defined
  changed_when: false
  no_log: true
  register: _vault_kubernetes_auth_config_verified_raw
  retries: 3
  delay: 15
  until: >-
    _vault_kubernetes_auth_config_verified_raw.rc is defined and
    _vault_kubernetes_auth_config_verified_raw.rc == 0
- name: Prove the Vault Kubernetes auth configuration is reconciled
  ansible.builtin.assert:
    that:
    - >-
      (_vault_kubernetes_auth_config_verified_raw.stdout |
      from_json).data.kubernetes_host ==
      'https://kubernetes.default.svc:443'
    fail_msg: Vault Kubernetes auth is not configured for the in-cluster API.
  when: vault_init_data is defined
  no_log: true
- name: Create Vault snapshot backup policy
  kubernetes.core.k8s_exec:
    namespace: '{{ vault_ns }}'
    pod: vault-0
    command: >-
      sh -ec 'VAULT_TOKEN=$(cat "$1"); export VAULT_TOKEN;
      printf %s "path \"sys/storage/raft/snapshot\" {
      capabilities = [\"read\"]
      }" | vault policy write snapshot-backup -' --
      {{ vault_token_remote_file }}
  when: vault_init_data is defined
  no_log: true
  register: _vault_snapshot_policy
  retries: 3
  delay: 10
  until: _vault_snapshot_policy is not failed
- name: Create Vault Kubernetes auth role for snapshot backups
  kubernetes.core.k8s_exec:
    namespace: '{{ vault_ns }}'
    pod: vault-0
    command: >-
      sh -ec 'VAULT_TOKEN=$(cat "$1"); export VAULT_TOKEN;
      vault write auth/kubernetes/role/vault-backup
      bound_service_account_names=vault-backup
      bound_service_account_namespaces={{ vault_ns }}
      audience=vault-backup
      policies=snapshot-backup
      token_no_default_policy=true
      token_ttl=15m
      token_explicit_max_ttl=15m
      token_type=batch' -- {{ vault_token_remote_file }}
  when: vault_init_data is defined
  no_log: true
  register: _vault_snapshot_auth_role
  retries: 3
  delay: 10
  until: _vault_snapshot_auth_role is not failed
- name: Create Vault TLS certificate
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cert-manager.io/v1
      kind: Certificate
      metadata:
        name: vault-tls
        namespace: cilium-secrets
      spec:
        secretName: vault-tls
        issuerRef:
          name: '{{ cert_manager_cluster_issuer }}'
          kind: ClusterIssuer
        dnsNames:
        - '{{ vault_domain }}'
  register: _r_create_vault_tls_certificate
  retries: 3
  delay: 15
  until: _r_create_vault_tls_certificate is not failed
- name: Discover the pinned Cilium Envoy image for the Vault gateway bridge
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: DaemonSet
    namespace: kube-system
    name: cilium-envoy
  register: _r_vault_gateway_envoy_daemonset
- name: Require the pinned Cilium Envoy image
  ansible.builtin.assert:
    that:
    - _r_vault_gateway_envoy_daemonset.resources | length == 1
    - _r_vault_gateway_envoy_daemonset.resources[0].spec.template.spec.containers | length > 0
    - _r_vault_gateway_envoy_daemonset.resources[0].spec.template.spec.containers[0].image | length > 0
    fail_msg: The running Cilium Envoy image could not be discovered
- name: Configure the verified Vault TLS gateway bridge
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: vault-gateway-proxy
        namespace: '{{ vault_ns }}'
        labels:
          app.kubernetes.io/name: vault-gateway-proxy
          app.kubernetes.io/part-of: vault
      data:
        envoy.yaml: |
          static_resources:
            listeners:
              - name: vault_http
                address:
                  socket_address:
                    address: 0.0.0.0
                    port_value: 8080
                filter_chains:
                  - filters:
                      - name: envoy.filters.network.http_connection_manager
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                          stat_prefix: vault_gateway
                          route_config:
                            name: vault
                            virtual_hosts:
                              - name: vault
                                domains: ["*"]
                                routes:
                                  - match: {prefix: "/"}
                                    route:
                                      cluster: vault
                                      timeout: 60s
                                      host_rewrite_literal: vault.{{ vault_ns }}.svc.cluster.local
                          http_filters:
                            - name: envoy.filters.http.router
                              typed_config:
                                "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
            clusters:
              - name: vault
                connect_timeout: 5s
                type: STRICT_DNS
                lb_policy: ROUND_ROBIN
                load_assignment:
                  cluster_name: vault
                  endpoints:
                    - lb_endpoints:
                        - endpoint:
                            address:
                              socket_address:
                                address: vault.{{ vault_ns }}.svc.cluster.local
                                port_value: 8200
                transport_socket:
                  name: envoy.transport_sockets.tls
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
                    sni: vault.{{ vault_ns }}.svc.cluster.local
                    common_tls_context:
                      validation_context:
                        trusted_ca:
                          filename: /etc/vault-ca/ca.crt
- name: Create the Vault TLS gateway bridge service
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: vault-gateway-proxy
        namespace: '{{ vault_ns }}'
        labels:
          app.kubernetes.io/name: vault-gateway-proxy
          app.kubernetes.io/part-of: vault
      spec:
        selector:
          app.kubernetes.io/name: vault-gateway-proxy
        ports:
          - name: http
            port: 8080
            targetPort: http
- name: Deploy the highly available Vault TLS gateway bridge
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: vault-gateway-proxy
        namespace: '{{ vault_ns }}'
        labels:
          app.kubernetes.io/name: vault-gateway-proxy
          app.kubernetes.io/part-of: vault
      spec:
        replicas: 2
        selector:
          matchLabels:
            app.kubernetes.io/name: vault-gateway-proxy
        template:
          metadata:
            labels:
              app.kubernetes.io/name: vault-gateway-proxy
              app.kubernetes.io/part-of: vault
          spec:
            automountServiceAccountToken: false
            securityContext:
              runAsNonRoot: true
              runAsUser: 65532
              runAsGroup: 65532
              seccompProfile:
                type: RuntimeDefault
            affinity:
              podAntiAffinity:
                preferredDuringSchedulingIgnoredDuringExecution:
                  - weight: 100
                    podAffinityTerm:
                      topologyKey: kubernetes.io/hostname
                      labelSelector:
                        matchLabels:
                          app.kubernetes.io/name: vault-gateway-proxy
            containers:
              - name: envoy
                image: "{{ _r_vault_gateway_envoy_daemonset.resources[0].spec.template.spec.containers[0].image }}"
                imagePullPolicy: IfNotPresent
                command:
                  - /usr/bin/cilium-envoy
                args:
                  - -c
                  - /etc/envoy/envoy.yaml
                  - --log-level
                  - warning
                ports:
                  - name: http
                    containerPort: 8080
                readinessProbe:
                  tcpSocket:
                    port: http
                  initialDelaySeconds: 2
                  periodSeconds: 5
                livenessProbe:
                  tcpSocket:
                    port: http
                  initialDelaySeconds: 10
                  periodSeconds: 10
                resources:
                  requests:
                    cpu: 10m
                    memory: 32Mi
                  limits:
                    cpu: 100m
                    memory: 96Mi
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop: [ALL]
                  readOnlyRootFilesystem: true
                volumeMounts:
                  - name: config
                    mountPath: /etc/envoy
                    readOnly: true
                  - name: vault-ca
                    mountPath: /etc/vault-ca
                    readOnly: true
            volumes:
              - name: config
                configMap:
                  name: vault-gateway-proxy
              - name: vault-ca
                secret:
                  secretName: vault-internal-tls
                  items:
                    - key: ca.crt
                      path: ca.crt
- name: Allow only Cilium ingress to reach the Vault gateway bridge
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: vault-gateway-proxy
        namespace: '{{ vault_ns }}'
      spec:
        endpointSelector:
          matchLabels:
            app.kubernetes.io/name: vault-gateway-proxy
        ingress:
          - fromEntities:
              - ingress
            toPorts:
              - ports:
                  - port: '8080'
                    protocol: TCP
- name: Create Vault HTTPRoute (VPN-only via admin-gateway)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: vault
        namespace: '{{ vault_ns }}'
      spec:
        parentRefs:
        - name: admin-gateway
          namespace: cilium-system
          sectionName: https
        hostnames:
        - '{{ vault_domain }}'
        rules:
        - matches:
          - path:
              type: PathPrefix
              value: /
          backendRefs:
          - name: vault-gateway-proxy
            port: 8080
  register: _r_create_vault_httproute_vpn_only_via_admi
  retries: 3
  delay: 15
  until: _r_create_vault_httproute_vpn_only_via_admi is not failed
- name: Create ESO namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: '{{ eso_ns }}'
        labels:
          app.kubernetes.io/part-of: external-secrets
          pod-security.kubernetes.io/enforce: baseline
          pod-security.kubernetes.io/warn: restricted
  register: _r_create_eso_namespace
  retries: 3
  delay: 15
  until: _r_create_eso_namespace is not failed
  when: eso_enabled | bool
- name: Add External Secrets Helm repository
  kubernetes.core.helm_repository:
    name: external-secrets
    repo_url: https://charts.external-secrets.io
  register: _r_add_external_secrets_helm_repository
  retries: 3
  delay: 15
  until: _r_add_external_secrets_helm_repository is not failed
  when: eso_enabled | bool
- name: Install External Secrets Operator via Helm
  kubernetes.core.helm:
    name: external-secrets
    chart_ref: external-secrets/external-secrets
    chart_version: '{{ eso_chart_ver }}'
    release_namespace: '{{ eso_ns }}'
    create_namespace: true
    release_state: present
    wait: true
    set_values:
    - value: replicaCount={{ secrets.eso.replicas | default(2 if resource_tier in ['medium', 'production'] else 1) }}
    - value: webhook.replicaCount={{ secrets.eso.replicas | default(2 if resource_tier in ['medium', 'production'] else 1) }}
    - value: certController.replicaCount={{ secrets.eso.replicas | default(2 if resource_tier in ['medium', 'production'] else 1) }}
    - value: serviceMonitor.enabled=true
    values:
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 256Mi
      webhook:
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 128Mi
      certController:
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 128Mi
  register: _r_install_external_secrets_operator_via_he
  retries: 3
  delay: 15
  until: _r_install_external_secrets_operator_via_he is not failed
  when: eso_enabled | bool
- name: Remove legacy invalid Cilium default-deny for External Secrets namespace
  kubernetes.core.k8s:
    state: absent
    definition:
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: default-deny
        namespace: '{{ eso_ns }}'
  when: eso_enabled | bool
- name: Create default-deny NetworkPolicy for External Secrets namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: default-deny
        namespace: '{{ eso_ns }}'
      spec:
        podSelector: {}
        policyTypes:
        - Ingress
        - Egress
        ingress: []
        egress: []
  when: eso_enabled | bool
- name: Allow only required External Secrets reconciliation traffic
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: allow-external-secrets-required-traffic
        namespace: '{{ eso_ns }}'
      spec:
        endpointSelector: {}
        ingress:
        - fromEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: '{{ eso_ns }}'
        - fromEntities:
          - kube-apiserver
          toPorts:
          - ports:
            - port: '10250'
              protocol: TCP
        - fromEntities:
          - host
          - remote-node
          toPorts:
          - ports:
            - port: '8080'
              protocol: TCP
            - port: '8081'
              protocol: TCP
            - port: '10250'
              protocol: TCP
        - fromEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: monitoring
          toPorts:
          - ports:
            - port: '8080'
              protocol: TCP
        egress:
        - toEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: kube-system
              k8s:k8s-app: kube-dns
          toPorts:
          - ports:
            - port: '53'
              protocol: UDP
            - port: '53'
              protocol: TCP
        - toCIDR:
          - 169.254.25.10/32
          toPorts:
          - ports:
            - port: '53'
              protocol: UDP
            - port: '53'
              protocol: TCP
        - toEntities:
          - host
          toPorts:
          - ports:
            - port: '53'
              protocol: UDP
            - port: '53'
              protocol: TCP
        - toEntities:
          - kube-apiserver
        - toEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: '{{ eso_ns }}'
        - toServices:
          - k8sService:
              serviceName: vault
              namespace: '{{ vault_ns }}'
          toPorts:
          - ports:
            - port: '8200'
              protocol: TCP
  when: eso_enabled | bool
- name: Wait for ESO to be ready
  kubernetes.core.k8s_info:
    kind: Deployment
    namespace: '{{ eso_ns }}'
    name: external-secrets
  register: eso_deploy
  until: '(eso_deploy.resources | default([])) | length > 0 and (eso_deploy.resources[0].status.readyReplicas | default(0)) >= 1

    '
  retries: 120
  failed_when: false
  delay: 15
  when: eso_enabled | bool
- name: Create Vault ESO service account
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ServiceAccount
      automountServiceAccountToken: false
      metadata:
        name: external-secrets-vault
        namespace: '{{ eso_ns }}'
  register: _r_create_vault_eso_service_account
  retries: 3
  delay: 15
  until: _r_create_vault_eso_service_account is not failed
  when: eso_enabled | bool
- name: Validate the fail-closed Vault ESO access boundary
  ansible.builtin.assert:
    that:
    - (eso_vault_allowed_namespaces | length) > 0
    - >-
      (eso_vault_allowed_namespaces |
      select('match', '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$') |
      list | length) == (eso_vault_allowed_namespaces | length)
    - >-
      (eso_vault_read_paths |
      select('match', '^[A-Za-z0-9][A-Za-z0-9._/-]{0,254}$') |
      list | length) == (eso_vault_read_paths | length)
    - >-
      (eso_vault_read_paths |
      reject('search', '(^|/)\.\.(/|$)') |
      list | length) == (eso_vault_read_paths | length)
    - "'*' not in (eso_vault_read_paths | join(''))"
    - eso_vault_token_audience | string is match('^[A-Za-z0-9][A-Za-z0-9._:/-]{0,127}$')
    - eso_vault_token_ttl | string is match('^[1-9][0-9]*[smh]$')
    fail_msg: >-
      ESO Vault access must use exact KV-v2 paths, explicit Kubernetes
      namespaces, a bounded audience, and a finite token TTL. Wildcards and
      parent traversal are rejected.
  when: eso_enabled | bool
- name: Build the exact Vault policy for ESO
  ansible.builtin.set_fact:
    vault_eso_policy_hcl: |-
      # Managed by ansible-k8s-full-setup. Empty means deny all KV reads.
      # ESO validates each Vault login token before reading secret data.
      path "auth/token/lookup-self" {
        capabilities = ["read"]
      }
      {% for remote_path in (eso_vault_read_paths | unique | sort) %}
      path "secret/data/{{ remote_path }}" {
        capabilities = ["read"]
      }
      path "secret/metadata/{{ remote_path }}" {
        capabilities = ["read"]
      }
      {% endfor %}
    eso_vault_token_ttl_seconds: >-
      {{ (eso_vault_token_ttl | regex_replace('[smh]$', '') | int) *
         (1 if (eso_vault_token_ttl | string).endswith('s') else
          60 if (eso_vault_token_ttl | string).endswith('m') else 3600) }}
  when: eso_enabled | bool
- name: Create Vault policy for ESO
  kubernetes.core.k8s_exec:
    namespace: '{{ vault_ns }}'
    pod: vault-0
    command: >-
      sh -ec 'VAULT_TOKEN=$(cat "$1"); export VAULT_TOKEN;
      printf %s "$2" | base64 -d | vault policy write external-secrets -' --
      {{ vault_token_remote_file }} {{ vault_eso_policy_hcl | b64encode }}
  when:
  - eso_enabled | bool
  - vault_init_data is defined
  no_log: true
  register: _r_create_vault_policy_for_eso
  retries: 3
  delay: 15
  until: >-
    _r_create_vault_policy_for_eso.rc is defined and
    _r_create_vault_policy_for_eso.rc == 0
- name: Create Vault ESO auth role
  kubernetes.core.k8s_exec:
    namespace: '{{ vault_ns }}'
    pod: vault-0
    command: >-
      sh -ec 'VAULT_TOKEN=$(cat "$1"); export VAULT_TOKEN;
      vault write
      auth/kubernetes/role/external-secrets
      bound_service_account_names=external-secrets-vault
      bound_service_account_namespaces="$2"
      audience="$3"
      policies=external-secrets
      token_no_default_policy=true
      token_ttl="$4"
      token_explicit_max_ttl="$4"
      token_type=batch' --
      {{ vault_token_remote_file }} {{ eso_ns }}
      {{ eso_vault_token_audience }} {{ eso_vault_token_ttl }}
  when:
  - eso_enabled | bool
  - vault_init_data is defined
  no_log: true
  register: _r_create_vault_eso_auth_role
  retries: 3
  delay: 15
  until: >-
    _r_create_vault_eso_auth_role.rc is defined and
    _r_create_vault_eso_auth_role.rc == 0
- name: Verify the Vault policy for ESO
  kubernetes.core.k8s_exec:
    namespace: '{{ vault_ns }}'
    pod: vault-0
    command: >-
      sh -ec 'VAULT_TOKEN=$(cat "$1"); export VAULT_TOKEN;
      exec vault policy read external-secrets' --
      {{ vault_token_remote_file }}
  when:
  - eso_enabled | bool
  - vault_init_data is defined
  changed_when: false
  no_log: true
  register: _vault_eso_policy_verified
  retries: 3
  delay: 15
  until: >-
    _vault_eso_policy_verified.rc is defined and
    _vault_eso_policy_verified.rc == 0
- name: Prove the Vault policy for ESO grants the required KV-v2 reads
  ansible.builtin.assert:
    that:
    - >-
      (_vault_eso_policy_verified.stdout | trim) ==
      (vault_eso_policy_hcl | trim)
    - "'*' not in _vault_eso_policy_verified.stdout"
    - "'list' not in _vault_eso_policy_verified.stdout"
    fail_msg: >-
      Vault policy external-secrets differs from the exact, read-only KV-v2
      allowlist plus the required token self-validation capability.
  when:
  - eso_enabled | bool
  - vault_init_data is defined
  no_log: true
- name: Verify the Vault ESO auth role
  kubernetes.core.k8s_exec:
    namespace: '{{ vault_ns }}'
    pod: vault-0
    command: >-
      sh -ec 'VAULT_TOKEN=$(cat "$1"); export VAULT_TOKEN;
      exec vault read -format=json
      auth/kubernetes/role/external-secrets' --
      {{ vault_token_remote_file }}
  when:
  - eso_enabled | bool
  - vault_init_data is defined
  changed_when: false
  no_log: true
  register: _vault_eso_role_verified_raw
  retries: 3
  delay: 15
  until: >-
    _vault_eso_role_verified_raw.rc is defined and
    _vault_eso_role_verified_raw.rc == 0
- name: Prove the Vault ESO auth role is reconciled
  ansible.builtin.assert:
    that:
    - >-
      ((_vault_eso_role_verified_raw.stdout |
      from_json).data.bound_service_account_names | sort | list) ==
      ['external-secrets-vault']
    - >-
      (_vault_eso_role_verified_raw.stdout |
      from_json).data.bound_service_account_namespaces == [eso_ns]
    - >-
      ((_vault_eso_role_verified_raw.stdout |
      from_json).data.token_policies | sort | list) ==
      ['external-secrets']
    - >-
      (_vault_eso_role_verified_raw.stdout |
      from_json).data.token_no_default_policy | bool
    - >-
      (_vault_eso_role_verified_raw.stdout |
      from_json).data.token_ttl | int ==
      (eso_vault_token_ttl_seconds | int)
    - >-
      (_vault_eso_role_verified_raw.stdout |
      from_json).data.token_explicit_max_ttl | int ==
      (eso_vault_token_ttl_seconds | int)
    - >-
      (_vault_eso_role_verified_raw.stdout |
      from_json).data.token_type == 'batch'
    - >-
      (_vault_eso_role_verified_raw.stdout |
      from_json).data.audience == eso_vault_token_audience
    fail_msg: Vault Kubernetes auth role external-secrets is not reconciled.
  when:
  - eso_enabled | bool
  - vault_init_data is defined
  no_log: true
- name: Create ClusterSecretStore for Vault
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: external-secrets.io/v1
      kind: ClusterSecretStore
      metadata:
        name: vault-backend
      spec:
        conditions:
        - namespaces: '{{ eso_vault_allowed_namespaces | unique | sort }}'
        provider:
          vault:
            server: "{{ 'http' if vault_tls_disabled | bool else 'https' }}://vault.{{ vault_ns }}.svc.cluster.local:8200"
            path: secret
            version: v2
            caProvider: '{{ omit if vault_tls_disabled | bool else {"type": "Secret", "name": "vault-internal-tls", "key": "ca.crt", "namespace": vault_ns} }}'
            auth:
              kubernetes:
                mountPath: kubernetes
                role: external-secrets
                serviceAccountRef:
                  name: external-secrets-vault
                  namespace: '{{ eso_ns }}'
                  audiences:
                  - '{{ eso_vault_token_audience }}'
  register: _r_create_clustersecretstore_for_vault
  retries: 3
  delay: 15
  until: _r_create_clustersecretstore_for_vault is not failed
  when: eso_enabled | bool
- name: Wait for the restricted Vault ClusterSecretStore
  kubernetes.core.k8s_info:
    api_version: external-secrets.io/v1
    kind: ClusterSecretStore
    name: vault-backend
  register: _vault_clustersecretstore_status
  changed_when: false
  retries: 24
  delay: 5
  until: >-
    (_vault_clustersecretstore_status.resources | default([]) | length) == 1 and
    ((_vault_clustersecretstore_status.resources[0].status.conditions |
    default([]) | selectattr('type', 'equalto', 'Ready') |
    selectattr('status', 'equalto', 'True') | list | length) == 1)
  when: eso_enabled | bool
- name: Validate the opt-in example ExternalSecret contract
  ansible.builtin.assert:
    that:
    - eso_enabled | bool
    - vault_init_data is defined
    - eso_example_secret_remote_key | string is match('^[A-Za-z0-9][A-Za-z0-9._/-]{0,254}$')
    - "'..' not in (eso_example_secret_remote_key | string).split('/')"
    - eso_example_secret_remote_property | string is match('^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$')
    fail_msg: >-
      The example ExternalSecret is an explicit demo fixture. It requires ESO,
      protected Vault initialization material, a safe non-empty KV-v2 key below
      secret/, and a safe non-empty property name. Create that source value in
      Vault before enabling secrets.eso.example_secret.enabled.
  when: eso_example_secret_enabled | bool

- name: Discover the ExternalSecret CRD for disabled-fixture cleanup
  kubernetes.core.k8s_info:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: externalsecrets.external-secrets.io
  register: _eso_example_externalsecret_crd
  changed_when: false

- name: Discover the disabled example ExternalSecret candidate
  kubernetes.core.k8s_info:
    api_version: external-secrets.io/v1
    kind: ExternalSecret
    name: example-secret
    namespace: default
  register: _eso_example_externalsecret_candidate
  changed_when: false
  no_log: true
  when:
  - not (eso_example_secret_enabled | bool)
  - (_eso_example_externalsecret_crd.resources | default([]) | length) == 1

- name: Discover the disabled example target Secret candidate
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: example-secret
    namespace: default
  register: _eso_example_target_secret_candidate
  changed_when: false
  no_log: true
  when: not (eso_example_secret_enabled | bool)

- name: Resolve disabled example cleanup candidates
  ansible.builtin.set_fact:
    _eso_example_externalsecret_object: >-
      {{ (_eso_example_externalsecret_candidate.resources | default([]) | first) |
         default({}) }}
    _eso_example_target_secret_object: >-
      {{ (_eso_example_target_secret_candidate.resources | default([]) | first) |
         default({}) }}
  no_log: true
  when: not (eso_example_secret_enabled | bool)

- name: Classify managed example fixture ownership
  ansible.builtin.set_fact:
    _eso_example_externalsecret_managed: >-
      {{
        (_eso_example_externalsecret_object | length > 0) and
        (
          ((_eso_example_externalsecret_object.metadata.labels | default({}))["platform.example.com/fixture"] |
           default('')) == 'example-secret' or
          (
            (_eso_example_externalsecret_object.spec.refreshInterval | default('')) == '1h' and
            (_eso_example_externalsecret_object.spec.secretStoreRef.name | default('')) == 'vault-backend' and
            (_eso_example_externalsecret_object.spec.secretStoreRef.kind | default('')) == 'ClusterSecretStore' and
            (_eso_example_externalsecret_object.spec.target.name | default('')) == 'example-secret' and
            (_eso_example_externalsecret_object.spec.target.creationPolicy | default('')) == 'Owner' and
            (_eso_example_externalsecret_object.spec.data | default([]) | length) == 1 and
            ((_eso_example_externalsecret_object.spec.data | first).secretKey | default('')) == 'password' and
            ((_eso_example_externalsecret_object.spec.data | first).remoteRef.key | default('')) == 'example' and
            ((_eso_example_externalsecret_object.spec.data | first).remoteRef.property | default('')) == 'password'
          )
        )
      }}
    _eso_example_target_secret_managed: >-
      {{
        (_eso_example_target_secret_object | length > 0) and
        (
          ((_eso_example_target_secret_object.metadata.labels | default({}))["platform.example.com/fixture"] |
           default('')) == 'example-secret' or
          (
            (
              _eso_example_target_secret_object.metadata.ownerReferences | default([]) |
              selectattr('apiVersion', 'match', '^external-secrets.io/') |
              selectattr('kind', 'equalto', 'ExternalSecret') |
              selectattr('name', 'equalto', 'example-secret') |
              list | length
            ) == 1 and
            (
              (_eso_example_externalsecret_object | length) == 0 or
              (
                _eso_example_target_secret_object.metadata.ownerReferences | default([]) |
                selectattr('uid', 'equalto', _eso_example_externalsecret_object.metadata.uid) |
                list | length
              ) == 1
            )
          )
        )
      }}
  no_log: true
  when: not (eso_example_secret_enabled | bool)

- name: Refuse to delete an unmanaged example ExternalSecret collision
  ansible.builtin.assert:
    that:
    - >-
      (_eso_example_externalsecret_object | length) == 0 or
      _eso_example_externalsecret_managed | bool
    fail_msg: >-
      default/example-secret already exists as an ExternalSecret but does not
      have this platform's fixture label or the exact legacy fixture identity.
      It was left unchanged; move or rename the unrelated object before retrying.
  no_log: true
  when: not (eso_example_secret_enabled | bool)

- name: Refuse to delete an unmanaged example target Secret collision
  ansible.builtin.assert:
    that:
    - >-
      (_eso_example_target_secret_object | length) == 0 or
      _eso_example_target_secret_managed | bool
    fail_msg: >-
      default/example-secret already exists as a Secret but is not labeled as
      this platform's fixture and is not owned by the example ExternalSecret.
      It was left unchanged; move or rename the unrelated object before retrying.
  no_log: true
  when: not (eso_example_secret_enabled | bool)

- name: Remove the disabled example ExternalSecret
  kubernetes.core.k8s:
    state: absent
    api_version: external-secrets.io/v1
    kind: ExternalSecret
    name: example-secret
    namespace: default
    wait: true
    wait_timeout: 60
  register: _r_remove_example_externalsecret
  retries: 3
  delay: 10
  until: _r_remove_example_externalsecret is not failed
  when:
  - not (eso_example_secret_enabled | bool)
  - (_eso_example_externalsecret_crd.resources | default([]) | length) == 1
  - _eso_example_externalsecret_managed | bool

- name: Remove the disabled example target Secret
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Secret
    name: example-secret
    namespace: default
    wait: true
    wait_timeout: 60
  no_log: true
  register: _r_remove_example_target_secret
  retries: 3
  delay: 10
  until: _r_remove_example_target_secret is not failed
  when:
  - not (eso_example_secret_enabled | bool)
  - _eso_example_target_secret_managed | bool

- name: Verify the opt-in example source key exists in Vault
  kubernetes.core.k8s_exec:
    namespace: '{{ vault_ns }}'
    pod: vault-0
    command: >-
      sh -ec 'VAULT_TOKEN=$(cat "$1"); export VAULT_TOKEN;
      exec vault kv get -format=json "secret/$2"' --
      {{ vault_token_remote_file }} {{ eso_example_secret_remote_key }}
  register: _vault_eso_example_source
  changed_when: false
  no_log: true
  retries: 3
  delay: 15
  until: >-
    _vault_eso_example_source.rc is defined and
    _vault_eso_example_source.rc == 0
  when: eso_example_secret_enabled | bool

- name: Require the opt-in example source property to exist in Vault
  ansible.builtin.assert:
    that:
    - >-
      (_vault_eso_example_source.stdout |
      from_json).data.data[eso_example_secret_remote_property] is defined
    fail_msg: >-
      Vault key secret/{{ eso_example_secret_remote_key }} does not contain the
      required {{ eso_example_secret_remote_property }} property.
  no_log: true
  when: eso_example_secret_enabled | bool

- name: Create the opt-in example ExternalSecret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata:
        name: example-secret
        namespace: default
        labels:
          app.kubernetes.io/managed-by: ansible-k8s-full-setup
          platform.example.com/fixture: example-secret
      spec:
        refreshInterval: 1h
        secretStoreRef:
          name: vault-backend
          kind: ClusterSecretStore
        target:
          name: example-secret
          creationPolicy: Owner
          template:
            metadata:
              labels:
                app.kubernetes.io/managed-by: ansible-k8s-full-setup
                platform.example.com/fixture: example-secret
        data:
        - secretKey: password
          remoteRef:
            key: '{{ eso_example_secret_remote_key }}'
            property: '{{ eso_example_secret_remote_property }}'
  register: _r_create_example_externalsecret
  retries: 3
  delay: 15
  until: _r_create_example_externalsecret is not failed
  when: eso_example_secret_enabled | bool
- name: Remove legacy duplicate Vault PodDisruptionBudget
  kubernetes.core.k8s:
    state: absent
    api_version: policy/v1
    kind: PodDisruptionBudget
    name: vault-pdb
    namespace: '{{ vault_ns }}'
  register: _r_remove_legacy_vault_pdb
  retries: 3
  delay: 10
  until: _r_remove_legacy_vault_pdb is not failed
- name: Create PodDisruptionBudget for ESO
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata:
        name: external-secrets-pdb
        namespace: external-secrets
      spec:
        minAvailable: 1
        selector:
          matchLabels:
            app.kubernetes.io/name: external-secrets
  when:
    - eso_enabled | bool
    - (secrets.eso.replicas | default(2 if resource_tier in ['medium', 'production'] else 1) | int) > 1
  register: _r_create_eso_pdb
  retries: 3
  delay: 10
  until: _r_create_eso_pdb is not failed
- name: Display secrets management summary
  debug:
    msg:
    - ==========================================
    - '  Secrets Management Deployed'
    - ==========================================
    - '  Vault: v2.0.3 (chart {{ vault_chart_ver }})'
    - "  ESO: {{ 'chart ' + eso_chart_ver if eso_enabled | bool else 'disabled' }}"
    - '  HA Mode: {{ vault_ha }}'
    - '  Replicas: {{ vault_replicas }}'
    - '  UI: {{ vault_domain }}'
    - "  ClusterSecretStore: {{ 'vault-backend' if eso_enabled | bool else 'disabled' }}"
    - ==========================================
- name: Remove legacy invalid Cilium default-deny for Vault namespace
  kubernetes.core.k8s:
    state: absent
    definition:
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: default-deny
        namespace: '{{ vault_ns | default(''vault'') }}'
- name: Create default-deny NetworkPolicy for Vault namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: default-deny
        namespace: '{{ vault_ns | default(''vault'') }}'
      spec:
        podSelector: {}
        policyTypes:
        - Ingress
        - Egress
        ingress: []
        egress: []
- name: Allow Vault ingress from cluster (ExternalSecrets + gateway)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: allow-vault-ingress
        namespace: '{{ vault_ns | default(''vault'') }}'
      spec:
        endpointSelector:
          matchLabels:
            app.kubernetes.io/name: vault
        ingress:
        - fromEntities:
          - cluster
          toPorts:
          - ports:
            - port: '8200'
              protocol: TCP
            - port: '8201'
              protocol: TCP
- name: Allow Vault egress (Raft replication)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: allow-vault-egress
        namespace: '{{ vault_ns | default(''vault'') }}'
      spec:
        endpointSelector: {}
        egress:
        - toEndpoints:
          - matchLabels: {}
          toPorts:
          - ports:
            - port: '8200'
              protocol: TCP
            - port: '8201'
              protocol: TCP
        - toEntities:
          - kube-apiserver
