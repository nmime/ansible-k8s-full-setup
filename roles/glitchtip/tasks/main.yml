---
# Deploy GlitchTip - Sentry-compatible error tracking
# Reuses: Percona PostgreSQL, Dragonfly Redis, Gateway API, cert-manager, Postal

- name: Set GlitchTip facts
  set_fact:
    gt_ns: "{{ glitchtip_namespace | default('glitchtip') }}"
    gt_db_ns: "{{ glitchtip_db_namespace | default('databases') }}"
    gt_pg_cluster: "{{ project_name | default('k8s') }}-pg"
    gt_pg_host_direct: "{{ project_name | default('k8s') }}-pg-primary.{{ glitchtip_db_namespace | default('databases') }}.svc.cluster.local"

- name: Create GlitchTip namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ gt_ns }}"
        labels:
          app.kubernetes.io/part-of: glitchtip
          pod-security.kubernetes.io/enforce: baseline
          pod-security.kubernetes.io/warn: baseline
  register: _r_gt_ns
  retries: 3
  delay: 10
  until: _r_gt_ns is not failed

- name: Retrieve Percona-generated GlitchTip PG password
  no_log: true
  kubernetes.core.k8s_info:
    kind: Secret
    namespace: "{{ gt_db_ns }}"
    name: "{{ gt_pg_cluster }}-pguser-{{ glitchtip_db_user }}"
  register: gt_pg_secret
  until: (gt_pg_secret.resources | default([])) | length > 0
  retries: 90
  delay: 10
  failed_when: false

- name: Fail if GlitchTip PG user not found
  fail:
    msg: >-
      GlitchTip PG user secret not found. Ensure 'glitchtip' user is defined
      in the PerconaPGCluster spec (k8s-databases role).
  when: gt_pg_secret.resources | length == 0

- name: Set GlitchTip PG password fact
  set_fact:
    gt_pg_password: "{{ gt_pg_secret.resources[0].data.password | b64decode }}"
  no_log: true

- name: Retrieve Dragonfly password for GlitchTip
  no_log: true
  kubernetes.core.k8s_info:
    kind: Secret
    namespace: dragonfly
    name: dragonfly-auth
  register: gt_dragonfly_secret
  until: (gt_dragonfly_secret.resources | default([])) | length > 0
  retries: 30
  delay: 10

- name: Set GlitchTip Dragonfly password fact
  set_fact:
    gt_dragonfly_password: "{{ gt_dragonfly_secret.resources[0].data.password | b64decode }}"
  no_log: true

- name: Check if GlitchTip config secret already exists
  no_log: true
  kubernetes.core.k8s_info:
    kind: Secret
    namespace: "{{ gt_ns }}"
    name: glitchtip-config
  register: gt_existing_secret

- name: Generate new SECRET_KEY (first run)
  set_fact:
    gt_secret_key: "{{ lookup('password', '/dev/null chars=ascii_letters,digits length=64') }}"
  when: gt_existing_secret.resources | length == 0
  no_log: true

- name: Reuse existing SECRET_KEY if secret exists
  set_fact:
    gt_secret_key: "{{ gt_existing_secret.resources[0].data.SECRET_KEY | b64decode }}"
  when: gt_existing_secret.resources | length > 0
  no_log: true

- name: Create GlitchTip config secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: glitchtip-config
        namespace: "{{ gt_ns }}"
        labels:
          app.kubernetes.io/part-of: glitchtip
      type: Opaque
      stringData:
        SECRET_KEY: "{{ gt_secret_key }}"
        DATABASE_URL: "postgres://{{ glitchtip_db_user | urlencode | replace('/', '%2F') }}:{{ gt_pg_password | urlencode | replace('/', '%2F') }}@{{ gt_pg_host_direct }}:5432/{{ glitchtip_db_name | urlencode | replace('/', '%2F') }}"
        REDIS_URL: "redis://:{{ gt_dragonfly_password | urlencode | replace('/', '%2F') }}@{{ glitchtip_redis_host }}:{{ glitchtip_redis_port }}/{{ glitchtip_redis_db }}"
  no_log: true
  register: _r_gt_config
  retries: 3
  delay: 10
  until: _r_gt_config is not failed

- name: Add GlitchTip Helm repository
  kubernetes.core.helm_repository:
    name: glitchtip
    repo_url: https://gitlab.com/api/v4/projects/16325141/packages/helm/stable
  register: _r_gt_repo
  retries: 3
  delay: 10
  until: _r_gt_repo is not failed

- name: Allow GlitchTip egress to DNS and stateful dependencies
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: allow-glitchtip-dependencies
        namespace: "{{ gt_ns }}"
      spec:
        podSelector: {}
        policyTypes:
          - Egress
        egress:
          - to:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: kube-system
            ports:
              - port: 53
                protocol: UDP
              - port: 53
                protocol: TCP
          - to:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: "{{ gt_db_ns }}"
            ports:
              - port: 5432
                protocol: TCP
          - to:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: dragonfly
            ports:
              - port: "{{ glitchtip_redis_port | int }}"
                protocol: TCP
          - to:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: postal
            ports:
              - port: "{{ glitchtip_smtp_port | int }}"
                protocol: TCP
  register: _r_gt_dependency_egress
  retries: 3
  delay: 10
  until: _r_gt_dependency_egress is not failed

- name: Validate GlitchTip stale Helm recovery threshold
  ansible.builtin.assert:
    that:
      - (glitchtip_helm_pending_stale_seconds | int) >= 900
    fail_msg: >-
      glitchtip_helm_pending_stale_seconds must be at least 900 seconds so an
      active Helm transaction cannot be mistaken for a stale one.

- name: Inspect GlitchTip Helm release metadata
  ansible.builtin.command:
    argv:
      - kubectl
      - get
      - secrets
      - --namespace
      - "{{ gt_ns }}"
      - --selector
      - owner=helm,name=glitchtip
      - --output
      - >-
        custom-columns=NAME:.metadata.name,OWNER:.metadata.labels.owner,RELEASE:.metadata.labels.name,STATUS:.metadata.labels.status,VERSION:.metadata.labels.version,CREATED:.metadata.creationTimestamp,UID:.metadata.uid,RESOURCE_VERSION:.metadata.resourceVersion
      - --no-headers
  register: gt_helm_metadata
  changed_when: false

- name: Initialize GlitchTip Helm release metadata facts
  ansible.builtin.set_fact:
    gt_helm_release_records: []

- name: Require complete GlitchTip Helm metadata-only records
  ansible.builtin.assert:
    that:
      - (item.split() | length) == 8
    fail_msg: >-
      Refusing automatic GlitchTip Helm recovery because a release metadata
      record is incomplete or ambiguous.
  loop: "{{ gt_helm_metadata.stdout_lines | default([]) }}"
  loop_control:
    label: "{{ item.split() | first | default('invalid-release-record') }}"

- name: Parse GlitchTip Helm release metadata
  ansible.builtin.set_fact:
    gt_helm_release_records: >-
      {{ gt_helm_release_records + [{
        'name': gt_helm_fields[0],
        'owner': gt_helm_fields[1],
        'release': gt_helm_fields[2],
        'status': gt_helm_fields[3],
        'revision': gt_helm_fields[4] | int,
        'created': gt_helm_fields[5],
        'uid': gt_helm_fields[6],
        'resource_version': gt_helm_fields[7]
      }] }}
  vars:
    gt_helm_fields: "{{ item.split() }}"
  loop: "{{ gt_helm_metadata.stdout_lines | default([]) }}"
  loop_control:
    label: "{{ item.split() | first | default('invalid-release-record') }}"
  no_log: true

- name: Fail closed on ambiguous GlitchTip Helm release metadata
  ansible.builtin.assert:
    that:
      - item.name is match('^sh\.helm\.release\.v1\.glitchtip\.v[1-9][0-9]*$')
      - item.owner == 'helm'
      - item.release == 'glitchtip'
      - (item.revision | int) == (item.name | regex_replace('^.*\.v', '') | int)
      - item.status in ['deployed', 'failed', 'superseded', 'uninstalled', 'pending-install', 'pending-upgrade', 'pending-rollback']
      - item.created is match('^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$')
      - item.uid is match('^[0-9a-f-]{36}$')
      - item.resource_version is match('^[1-9][0-9]*$')
    fail_msg: >-
      Refusing automatic GlitchTip Helm recovery because release metadata is
      malformed or does not have the exact expected ownership and name.
  loop: "{{ gt_helm_release_records }}"
  loop_control:
    label: "{{ item.name | default('invalid-release-record') }}"

- name: Select pending GlitchTip Helm release revisions
  ansible.builtin.set_fact:
    gt_helm_pending_records: >-
      {{ gt_helm_release_records
         | selectattr('status', 'in', ['pending-install', 'pending-upgrade', 'pending-rollback'])
         | list }}

- name: Recover a stale GlitchTip Helm transaction
  when: (gt_helm_pending_records | length) > 0
  block:
    - name: Require one unambiguous newest pending GlitchTip revision
      ansible.builtin.assert:
        that:
          - (gt_helm_pending_records | length) == 1
          - (gt_helm_pending_records[0].revision | int) == (gt_helm_release_records | map(attribute='revision') | map('int') | max)
        fail_msg: >-
          Refusing automatic GlitchTip Helm recovery because the pending
          transaction is ambiguous or is not the newest release revision.

    - name: Calculate pending GlitchTip Helm transaction age
      ansible.builtin.set_fact:
        gt_helm_pending_age_seconds: >-
          {{ ((now(utc=true) -
               (gt_helm_pending_records[0].created |
                to_datetime('%Y-%m-%dT%H:%M:%SZ'))).total_seconds()) | int }}

    - name: Refuse to interrupt a recent GlitchTip Helm transaction
      ansible.builtin.assert:
        that:
          - (gt_helm_pending_age_seconds | int) >= (glitchtip_helm_pending_stale_seconds | int)
        fail_msg: >-
          GlitchTip Helm revision {{ gt_helm_pending_records[0].revision }} is
          still pending but is only {{ gt_helm_pending_age_seconds }} seconds
          old. Refusing recovery until it is at least
          {{ glitchtip_helm_pending_stale_seconds }} seconds old.

    - name: Reinspect pending GlitchTip Helm metadata before recovery
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - secret
          - "{{ gt_helm_pending_records[0].name }}"
          - --namespace
          - "{{ gt_ns }}"
          - --output
          - >-
            custom-columns=NAME:.metadata.name,OWNER:.metadata.labels.owner,RELEASE:.metadata.labels.name,STATUS:.metadata.labels.status,VERSION:.metadata.labels.version,CREATED:.metadata.creationTimestamp,UID:.metadata.uid,RESOURCE_VERSION:.metadata.resourceVersion
          - --no-headers
      register: gt_helm_recheck
      changed_when: false

    - name: Require unchanged stale GlitchTip transaction metadata
      ansible.builtin.assert:
        that:
          - (gt_helm_recheck.stdout.split() | length) == 8
          - gt_helm_recheck.stdout.split()[0] == gt_helm_pending_records[0].name
          - gt_helm_recheck.stdout.split()[1] == 'helm'
          - gt_helm_recheck.stdout.split()[2] == 'glitchtip'
          - gt_helm_recheck.stdout.split()[3] == gt_helm_pending_records[0].status
          - (gt_helm_recheck.stdout.split()[4] | int) == (gt_helm_pending_records[0].revision | int)
          - gt_helm_recheck.stdout.split()[5] == gt_helm_pending_records[0].created
          - gt_helm_recheck.stdout.split()[6] == gt_helm_pending_records[0].uid
          - gt_helm_recheck.stdout.split()[7] == gt_helm_pending_records[0].resource_version
        fail_msg: >-
          Refusing automatic GlitchTip Helm recovery because the transaction
          metadata changed after inspection.

    - name: Delete only the UID-matched stale GlitchTip Helm revision
      no_log: true
      kubernetes.core.k8s:
        state: absent
        api_version: v1
        kind: Secret
        namespace: "{{ gt_ns }}"
        name: "{{ gt_helm_pending_records[0].name }}"
        delete_options:
          preconditions:
            uid: "{{ gt_helm_pending_records[0].uid }}"
            resourceVersion: "{{ gt_helm_pending_records[0].resource_version }}"
      register: gt_helm_stale_secret_delete

    - name: Ensure no GlitchTip Helm transaction started during recovery
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - secrets
          - --namespace
          - "{{ gt_ns }}"
          - --selector
          - owner=helm,name=glitchtip,status=pending-install
          - --output
          - name
      register: gt_helm_new_pending_install
      changed_when: false

    - name: Inspect concurrent pending GlitchTip upgrades
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - secrets
          - --namespace
          - "{{ gt_ns }}"
          - --selector
          - owner=helm,name=glitchtip,status=pending-upgrade
          - --output
          - name
      register: gt_helm_new_pending_upgrade
      changed_when: false

    - name: Inspect concurrent pending GlitchTip rollbacks
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - secrets
          - --namespace
          - "{{ gt_ns }}"
          - --selector
          - owner=helm,name=glitchtip,status=pending-rollback
          - --output
          - name
      register: gt_helm_new_pending_rollback
      changed_when: false

    - name: Refuse uninstall when a new GlitchTip transaction appeared
      ansible.builtin.assert:
        that:
          - gt_helm_new_pending_install.stdout | trim | length == 0
          - gt_helm_new_pending_upgrade.stdout | trim | length == 0
          - gt_helm_new_pending_rollback.stdout | trim | length == 0
        fail_msg: >-
          A new GlitchTip Helm transaction appeared during stale recovery.
          Refusing to uninstall an active release.

    - name: Uninstall only the stale GlitchTip Helm release
      ansible.builtin.command:
        argv:
          - helm
          - uninstall
          - glitchtip
          - --namespace
          - "{{ gt_ns }}"
          - --no-hooks
          - --wait
          - --timeout
          - "{{ glitchtip_helm_recovery_timeout }}"
      register: gt_helm_stale_uninstall
      changed_when: gt_helm_stale_uninstall.rc == 0
      failed_when: >-
        gt_helm_stale_uninstall.rc != 0 and
        'release: not found' not in (gt_helm_stale_uninstall.stderr | lower)

- name: Install GlitchTip via Helm
  no_log: true
  kubernetes.core.helm:
    name: glitchtip
    chart_ref: glitchtip/glitchtip
    chart_version: "{{ glitchtip_chart_version }}"
    release_namespace: "{{ gt_ns }}"
    create_namespace: false
    release_state: present
    wait: true
    timeout: 15m0s
    values:
      image:
        tag: "{{ glitchtip_app_version | regex_replace('^v', '') }}"
      glitchtip:
        existingSecret: glitchtip-config
        existingSecretKey: SECRET_KEY
        domain: "https://{{ glitchtip_domain }}"
        database:
          existingSecret: glitchtip-config
          existingSecretKey: DATABASE_URL
        valkey:
          existingSecret: glitchtip-config
          existingSecretKey: REDIS_URL
      valkey:
        enabled: false
      postgresql:
        enabled: false
      extraEnvVars:
        - name: ENABLE_USER_REGISTRATION
          value: "{{ glitchtip_enable_user_registration | string | lower }}"
        - name: ENABLE_ORGANIZATION_CREATION
          value: "{{ glitchtip_enable_organization_creation | string | lower }}"
        - name: DEFAULT_FROM_EMAIL
          value: "{{ glitchtip_default_from_email }}"
        - name: GLITCHTIP_MAX_EVENT_LIFE_DAYS
          value: "{{ glitchtip_events_retention_days | string }}"
        - name: EMAIL_BACKEND
          value: "{{ 'django.core.mail.backends.smtp.EmailBackend' if glitchtip_email_backend == 'smtp' else 'django.core.mail.backends.console.EmailBackend' }}"
        - name: EMAIL_HOST
          value: "{{ glitchtip_smtp_host }}"
        - name: EMAIL_PORT
          value: "{{ glitchtip_smtp_port | string }}"
        - name: EMAIL_HOST_USER
          value: "{{ glitchtip_smtp_user }}"
        - name: EMAIL_HOST_PASSWORD
          value: "{{ glitchtip_smtp_password }}"
        - name: EMAIL_USE_TLS
          value: "{{ glitchtip_smtp_use_tls | string | lower }}"
      web:
        replicaCount: "{{ glitchtip_web_replicas | int }}"
        embedWorker: true
        service:
          type: ClusterIP
          port: 80
        resources:
          requests:
            cpu: "{{ glitchtip_web_cpu_request }}"
            memory: "{{ glitchtip_web_memory_request }}"
          limits:
            cpu: "{{ glitchtip_web_cpu_limit }}"
            memory: "{{ glitchtip_web_memory_limit }}"
      worker:
        enabled: "{{ glitchtip_worker_enabled | bool }}"
        replicaCount: "{{ glitchtip_worker_replicas | int }}"
        resources:
          requests:
            cpu: "{{ glitchtip_worker_cpu_request }}"
            memory: "{{ glitchtip_worker_memory_request }}"
          limits:
            cpu: "{{ glitchtip_worker_cpu_limit }}"
            memory: "{{ glitchtip_worker_memory_limit }}"
      migrationJob:
        enabled: true
  register: _r_gt_helm
  retries: 2
  delay: 15
  until: _r_gt_helm is not failed

- name: Create TLS Certificate for GlitchTip domain
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cert-manager.io/v1
      kind: Certificate
      metadata:
        name: glitchtip-tls
        namespace: "{{ gt_ns }}"
      spec:
        secretName: glitchtip-tls
        issuerRef:
          name: "{{ cert_manager_cluster_issuer }}"
          kind: ClusterIssuer
        commonName: "{{ glitchtip_domain }}"
        dnsNames:
          - "{{ glitchtip_domain }}"
  register: _r_gt_cert
  retries: 3
  delay: 10
  until: _r_gt_cert is not failed

- name: Create GlitchTip HTTPRoute via public gateway
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: glitchtip
        namespace: "{{ gt_ns }}"
      spec:
        parentRefs:
          - name: main-gateway
            namespace: cilium-system
            sectionName: https
        hostnames:
          - "{{ glitchtip_domain }}"
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - name: glitchtip-web
                port: 80
  register: _r_gt_route
  retries: 3
  delay: 10
  until: _r_gt_route is not failed

- name: Wait for GlitchTip web deployment to be ready
  kubernetes.core.k8s_info:
    kind: Deployment
    namespace: "{{ gt_ns }}"
    name: glitchtip-web
  register: gt_web_status
  until: >-
    (gt_web_status.resources | default([])) | length > 0 and
    (gt_web_status.resources[0].status.readyReplicas | default(0)) >= (glitchtip_web_replicas | int)
  retries: 60
  delay: 10

- name: Display GlitchTip deployment summary
  debug:
    msg:
      - "=========================================="
      - "  GlitchTip Deployed"
      - "  URL: https://{{ glitchtip_domain }}"
      - "  Web replicas: {{ glitchtip_web_replicas }}"
      - "  Worker replicas: {{ glitchtip_worker_replicas if glitchtip_worker_enabled else 'embedded' }}"
      - "  DB: {{ glitchtip_db_name }}@{{ gt_pg_host_direct }}"
      - "  Redis: {{ glitchtip_redis_host }}:{{ glitchtip_redis_port }}/{{ glitchtip_redis_db }}"
      - "=========================================="
