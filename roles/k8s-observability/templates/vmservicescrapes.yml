---
# Scrape resources for services deployed before the observability operator.
# Services deployed later in deploy_platform.yml own their scrape resources.
{% if platform_object_storage_enabled | default(false) | bool %}
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: seaweedfs
  namespace: {{ object_storage_namespace_resolved | default('storage') }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ object_storage_release_name | default('seaweedfs') }}
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
{% endif %}
{% if platform_secrets_enabled | default(false) | bool %}
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: vault
  namespace: {{ vault_ns | default('vault') }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: vault
  endpoints:
    - port: https
      scheme: https
      path: /v1/sys/metrics
      params:
        format: [prometheus]
      tlsConfig:
        insecureSkipVerify: true
      interval: 30s
{% endif %}
{% if platform_elasticsearch_enabled | default(false) | bool %}
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: elasticsearch
  namespace: {{ es_ns | default('elasticsearch') }}
spec:
  selector:
    matchLabels:
      app: elasticsearch
  endpoints:
    - port: https
      scheme: https
      tlsConfig:
        insecureSkipVerify: true
      interval: 30s
{% endif %}
