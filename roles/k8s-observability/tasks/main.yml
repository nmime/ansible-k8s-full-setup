          interval: 30s
  register: _r_create_vmservicescrape_for_pmm_server
  retries: 3
  delay: 10
  until: _r_create_vmservicescrape_for_pmm_server is not failed
- name: Deploy VMRule for alerting
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: operator.victoriametrics.com/v1beta1
      kind: VMRule
      metadata:
        name: platform-alerts
        namespace: '{{ monitoring_namespace }}'
      spec:
        groups:
        - name: kubernetes
          rules:
          - alert: KubePodCrashLooping
            expr: rate(kube_pod_container_status_restarts_total[15m]) * 60 * 5 > 0
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: Pod {{ '{{ $labels.namespace }}' }}/{{ '{{ $labels.pod }}' }} is crash looping
          - alert: KubeNodeNotReady
            expr: kube_node_status_condition{condition="Ready",status="true"} == 0
            for: 15m
            labels:
              severity: critical
            annotations:
              summary: Node {{ '{{ $labels.node }}' }} is not ready
          - alert: KubePersistentVolumeFillingUp
            expr: kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes < 0.15
            for: 1h
            labels:
              severity: warning
            annotations:
              summary: PV {{ '{{ $labels.persistentvolumeclaim }}' }} filling up (< 15% free)
          - alert: HighMemoryUsage
            expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 0.9
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: High memory usage on {{ '{{ $labels.instance }}' }}
        - name: databases
          rules:
          - alert: PostgreSQLDown
            expr: pg_up == 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: PostgreSQL instance {{ '{{ $labels.instance }}' }} is down
          - alert: PostgreSQLReplicationLag
            expr: pg_replication_lag > 30
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: PostgreSQL replication lag is {{ '{{ $value }}' }}s on {{ '{{ $labels.instance }}' }}
          - alert: PostgreSQLTooManyConnections
            expr: sum by (instance) (pg_stat_activity_count) > pg_settings_max_connections * 0.8
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: PostgreSQL connections above 80% on {{ '{{ $labels.instance }}' }}
          - alert: PostgreSQLDeadlocks
            expr: rate(pg_stat_database_deadlocks[5m]) > 0
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: PostgreSQL deadlocks detected on {{ '{{ $labels.datname }}' }}
          - alert: MongoDBDown
            expr: mongodb_up == 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: MongoDB instance {{ '{{ $labels.instance }}' }} is down
          - alert: MongoDBReplicationLag
            expr: mongodb_mongod_replset_member_replication_lag > 30
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: MongoDB replication lag is {{ '{{ $value }}' }}s on {{ '{{ $labels.instance }}' }}
          - alert: MongoDBCursorsOpen
            expr: mongodb_mongod_metrics_cursor_open{state="total"} > 10000
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: MongoDB has {{ '{{ $value }}' }} open cursors on {{ '{{ $labels.instance }}' }}
          - alert: PGBackrestBackupStale
            expr: time() - pg_backrest_backup_last_completed_time_epoch > 172800
            for: 1h
            labels:
              severity: warning
            annotations:
              summary: pgbackrest backup is older than 48h
  register: _r_deploy_vmrule_for_alerting
  retries: 3
  delay: 10
  until: _r_deploy_vmrule_for_alerting is not failed
- name: Display observability deployment info
  debug:
    msg: >-
      {{
        ['==========================================',
         '  Observability Stack Deployed',
         '==========================================',
         '  Grafana: https://' ~ grafana_domain,
         '    User: ' ~ grafana_admin_user ~ ' / ****',
         '  VictoriaMetrics: ' ~ ('Cluster' if tier in ['medium', 'production'] else 'Single') ~ ' mode',
         '  Logs: ' ~ ('Loki' if log_stack == 'loki' else 'Elasticsearch'),
         '  Retention: metrics=' ~ vm_retention ~ ', logs=' ~ logging_retention]
        + (['  PMM Server: https://pmm.' ~ domain,
             '    User: admin / ****'] if (pmm_enabled | bool) else ['  PMM Server: DISABLED'])
        + ['==========================================']
      }}
- name: Add Elastic Helm repository
  kubernetes.core.helm_repository:
    name: elastic
    repo_url: https://helm.elastic.co
  register: _r_add_elastic_helm_repository
  retries: 3
  delay: 10
  until: _r_add_elastic_helm_repository is not failed
  when: log_stack == "elk"
- name: Remove legacy Filebeat release from Elasticsearch namespace
  kubernetes.core.helm:
    name: filebeat
    release_namespace: elasticsearch
    release_state: absent
    wait: true
  when: log_stack == "elk"
- name: Read Elasticsearch secrets for the isolated Filebeat agent
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    namespace: elasticsearch
    name: '{{ item }}'
  loop:
  - es-tls-certs
  - es-credentials
  register: _r_filebeat_source_secrets
  no_log: true
  when: log_stack == "elk"
- name: Replicate the minimum Elasticsearch credentials into the agent namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: '{{ item.name }}'
        namespace: '{{ logging_agent_namespace }}'
      type: Opaque
      data: '{{ item.data }}'
  loop:
  - name: es-tls-certs
    data:
      ca.crt: '{{ _r_filebeat_source_secrets.results[0].resources[0].data["ca.crt"] }}'
  - name: es-credentials
    data:
      ELASTIC_PASSWORD: '{{ _r_filebeat_source_secrets.results[1].resources[0].data.ELASTIC_PASSWORD }}'
  no_log: true
  when: log_stack == "elk"
- name: Install Filebeat for log collection (ELK)
  kubernetes.core.helm:
    name: filebeat
    chart_ref: elastic/filebeat
    chart_version: 8.5.1
    release_namespace: '{{ logging_agent_namespace }}'
    create_namespace: false
    release_state: present
    wait: false
    values:
      imageTag: 9.4.3
      daemonset:
        enabled: true
        filebeatConfig:
          filebeat.yml: |
            filebeat.inputs:
              - type: filestream
                id: kubernetes-container-logs
                prospector.scanner.symlinks: true
                parsers:
                  - container: ~
                paths:
                  - /var/log/containers/*.log
            processors:
              - add_kubernetes_metadata:
                  host: ${NODE_NAME}
                  matchers:
                    - logs_path:
                        logs_path: /var/log/containers/
            {% if log_redaction_enabled | bool %}
              - script:
                  lang: javascript
                  id: regulated-data-redaction
                  source: >-
                    function process(event) {
                      var msg = event.Get("message");
                      if (!msg) return;
                      msg = msg.replace(/\b\d{3}-\d{2}-\d{4}\b/g, "XXX-XX-XXXX");
                      msg = msg.replace(/\(\d{3}\)\s*\d{3}-\d{4}/g, "(XXX) XXX-XXXX");
                      msg = msg.replace(/\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}\b/g, "[REDACTED_EMAIL]");
                      event.Put("message", msg);
                    }
            {% endif %}
            output.elasticsearch:
              hosts: ["https://elasticsearch.elasticsearch.svc.cluster.local:9200"]
              username: elastic
              password: ${ELASTICSEARCH_PASSWORD}
              ssl.certificate_authorities: ["/usr/share/filebeat/config/certs/ca.crt"]
              index: "filebeat-%{[agent.version]}-%{+yyyy.MM.dd}"
            setup.ilm.enabled: true
            setup.ilm.rollover_alias: filebeat
            setup.ilm.pattern: "{now/d}-000001"
            setup.template.name: filebeat
            setup.template.pattern: "filebeat-*"
            logging.level: info
        secretMounts:
        - name: elasticsearch-ca
          secretName: es-tls-certs
          path: /usr/share/filebeat/config/certs
        extraEnvs:
        - name: ELASTICSEARCH_PASSWORD
          valueFrom:
            secretKeyRef:
              name: es-credentials
              key: ELASTIC_PASSWORD
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
  register: _r_install_filebeat_elk
  retries: 3
  delay: 10
  until: _r_install_filebeat_elk is not failed
  when: log_stack == "elk"
- name: Add Fluent Helm repository
  kubernetes.core.helm_repository:
    name: fluent
    repo_url: https://fluent.github.io/helm-charts
  register: _r_add_fluent_helm_repository
  retries: 3
  delay: 10
  until: _r_add_fluent_helm_repository is not failed
  when: log_stack == "efk"
- name: Install Fluentd for log collection (EFK)
  kubernetes.core.helm:
    name: fluentd
    chart_ref: fluent/fluentd
    chart_version: 0.5.2
    release_namespace: '{{ monitoring_namespace }}'
    create_namespace: true
    release_state: present
    wait: false
    values:
      kind: DaemonSet
      fileConfigs:
        01_sources.conf: "<source>\n  @type tail\n  @id in_tail_container_logs\n  path /var/log/containers/*.log\n  pos_file /var/log/fluentd-containers.log.pos\n  tag kubernetes.*\n  read_from_head true\n\
          \  <parse>\n    @type json\n    time_format %Y-%m-%dT%H:%M:%S.%NZ\n  </parse>\n</source>\n"
        02_filters.conf: |
          <filter kubernetes.**>
            @type kubernetes_metadata
            @id filter_kube_metadata
          </filter>
          {% if log_redaction_enabled | bool %}
          <filter kubernetes.**>
            @type record_transformer
            enable_ruby true
            <record>
              log ${record["log"]&.gsub(/\b\d{3}-\d{2}-\d{4}\b/, "XXX-XX-XXXX")&.gsub(/\(\d{3}\)\s*\d{3}-\d{4}/, "(XXX) XXX-XXXX")&.gsub(/\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}\b/, "[REDACTED_EMAIL]")}
            </record>
          </filter>
          {% endif %}
        04_outputs.conf: "<match **>\n  @type elasticsearch\n  @id out_es\n  host elasticsearch.elasticsearch.svc.cluster.local\n  port 9200\n  scheme https\n  ssl_verify true\n  ca_file /fluentd/certs/ca.crt\n\
          \  user elastic\n  password \"#{ENV['ELASTICSEARCH_PASSWORD']}\"\n  logstash_format true\n  logstash_prefix fluentd\n  <buffer>\n    @type file\n    path /var/log/fluentd-buffers/kubernetes.system.buffer\n\
          \    flush_mode interval\n    retry_type exponential_backoff\n    flush_interval 5s\n    retry_forever false\n    retry_max_interval 30\n    chunk_limit_size 2M\n    queue_limit_length 8\n   \
          \ overflow_action block\n  </buffer>\n</match>\n"
      extraVolumes:
      - name: elasticsearch-ca
        secret:
          secretName: es-tls-certs
      extraVolumeMounts:
      - name: elasticsearch-ca
        mountPath: /fluentd/certs
        readOnly: true
      env:
      - name: ELASTICSEARCH_PASSWORD
        valueFrom:
          secretKeyRef:
            name: es-credentials
            key: ELASTIC_PASSWORD
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
  register: _r_install_fluentd_efk
  retries: 3
  delay: 10
  until: _r_install_fluentd_efk is not failed
  when: log_stack == "efk"
- name: Create Hetzner Cloud token secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: hetzner-cloud-token
        namespace: '{{ monitoring_namespace }}'
      type: Opaque
      stringData:
        token: '{{ lookup(''env'', ''HCLOUD_TOKEN'') }}'
  when: hetzner_metrics_enabled | default(true) | bool
  no_log: true
  register: _r_create_hetzner_token_secret
  retries: 3
  delay: 10
  until: _r_create_hetzner_token_secret is not failed
- name: Deploy Hetzner Cloud Exporter
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: hetzner-cloud-exporter
        namespace: '{{ monitoring_namespace }}'
        labels:
          app: hetzner-cloud-exporter
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: hetzner-cloud-exporter
        template:
          metadata:
            labels:
              app: hetzner-cloud-exporter
          spec:
            automountServiceAccountToken: false
            securityContext:
              runAsNonRoot: true
              runAsUser: 1337
              runAsGroup: 1337
              seccompProfile:
                type: RuntimeDefault
            containers:
            - name: exporter
              image: promhippie/hcloud-exporter:{{ hcloud_exporter_version }}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
              env:
              - name: HCLOUD_EXPORTER_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: hetzner-cloud-token
                    key: token
              - name: HCLOUD_EXPORTER_COLLECTOR_SERVER_METRICS
                value: 'true'
              ports:
              - containerPort: 9501
                name: metrics
              readinessProbe:
                httpGet:
                  # /metrics performs live cloud API collection. Probing it
                  # multiplies API traffic and can exhaust Hetzner quotas.
                  path: /healthz
                  port: metrics
                initialDelaySeconds: 5
                periodSeconds: 10
              livenessProbe:
                httpGet:
                  path: /healthz
                  port: metrics
                initialDelaySeconds: 15
                periodSeconds: 30
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
  when: hetzner_metrics_enabled | default(true) | bool
  register: _r_deploy_hetzner_exporter
  retries: 3
  delay: 10
  until: _r_deploy_hetzner_exporter is not failed
- name: Create Hetzner Exporter Service
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: hetzner-cloud-exporter
        namespace: '{{ monitoring_namespace }}'
        labels:
          app: hetzner-cloud-exporter
      spec:
        selector:
          app: hetzner-cloud-exporter
        ports:
        - port: 9501
          targetPort: 9501
          name: metrics
  when: hetzner_metrics_enabled | default(true) | bool
  register: _r_create_hetzner_exporter_svc
  retries: 3
  delay: 10
  until: _r_create_hetzner_exporter_svc is not failed
- name: Create VMServiceScrape for Hetzner Cloud Exporter
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: operator.victoriametrics.com/v1beta1
      kind: VMServiceScrape
      metadata:
        name: hetzner-cloud-exporter
        namespace: '{{ monitoring_namespace }}'
      spec:
        selector:
          matchLabels:
            app: hetzner-cloud-exporter
        endpoints:
        - port: metrics
          # Cloud inventory changes slowly and each scrape fans out across
          # multiple provider API endpoints. Keep generous quota headroom for
          # provisioning, backup, and autoscaling control-plane operations.
          interval: 5m
  when: hetzner_metrics_enabled | default(true) | bool
  register: _r_create_hetzner_vmservicescrape
  retries: 3
  delay: 10
  until: _r_create_hetzner_vmservicescrape is not failed
- name: Deploy VMServiceScrapes for platform services (VictoriaMetrics)
  kubernetes.core.k8s:
    state: present
    definition: >-
      {{ lookup('ansible.builtin.template',
         playbook_dir + '/../roles/k8s-observability/templates/vmservicescrapes.yml')
         | from_yaml_all | list }}
  when:
  - platform_object_storage_enabled | default(false) | bool
    or platform_secrets_enabled | default(false) | bool
    or platform_elasticsearch_enabled | default(false) | bool
- name: Deploy cert-manager alert (cert expiry warning)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: operator.victoriametrics.com/v1beta1
      kind: VMRule
      metadata:
        name: cert-expiry-alerts
        namespace: '{{ monitoring_namespace | default(''monitoring'') }}'
      spec:
        groups:
        - name: cert-manager
          rules:
          - alert: CertificateExpiringSoon
            expr: certmanager_certificate_expiration_timestamp_seconds - time() < 7 * 24 * 3600
            for: 1h
            labels:
                severity: warning
            annotations:
                summary: Certificate {{ '{{ $labels.name }}' }} expires in < 7 days
                description: Namespace {{ '{{ $labels.namespace }}' }}, cert {{ '{{ $labels.name }}' }}
          - alert: CertificateExpiryCritical
            expr: certmanager_certificate_expiration_timestamp_seconds - time() < 24 * 3600
            for: 10m
            labels:
                severity: critical
            annotations:
                summary: Certificate {{ '{{ $labels.name }}' }} expires in < 24 hours!
                description: Immediate action needed. Namespace {{ '{{ $labels.namespace }}' }}
          - alert: CertificateRenewalFailed
            expr: certmanager_certificate_ready_status{condition="False"} == 1
            for: 30m
            labels:
                severity: critical
            annotations:
                summary: Certificate {{ '{{ $labels.name }}' }} renewal FAILED
                description: cert-manager cannot renew {{ '{{ $labels.name }}' }} in {{ '{{ $labels.namespace }}' }}
- name: Remove legacy invalid Cilium default-deny for monitoring namespace
  kubernetes.core.k8s:
    state: absent
    definition:
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: default-deny
        namespace: '{{ monitoring_namespace | default(''monitoring'') }}'
- name: Create default-deny NetworkPolicy for monitoring namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: default-deny
        namespace: '{{ monitoring_namespace | default(''monitoring'') }}'
      spec:
        podSelector: {}
        policyTypes:
        - Ingress
        - Egress
        ingress: []
        egress: []
- name: Allow Grafana ingress from gateway
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: allow-grafana-ingress
        namespace: '{{ monitoring_namespace | default(''monitoring'') }}'
      spec:
        endpointSelector:
          matchLabels:
            app.kubernetes.io/name: grafana
        ingress:
        - fromEntities:
          - cluster
          toPorts:
          - ports:
            - port: '3000'
              protocol: TCP
- name: Allow monitoring scrape (VMAgent/Promtail collect from all namespaces)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: allow-monitoring-egress
        namespace: '{{ monitoring_namespace | default(''monitoring'') }}'
      spec:
        endpointSelector: {}
        egress:
        - toEntities:
          - cluster
          - kube-apiserver
        ingress:
        - fromEntities:
          - cluster

- name: Include alerting (VMAlertmanager + VMAlert + VMRules + routing)
  ansible.builtin.import_tasks: alerting.yml

- name: Include distributed tracing (Tempo + OTel Collector)
  ansible.builtin.import_tasks: tracing.yml

- name: Include observability health checks
  ansible.builtin.import_tasks: health_checks.yml

- name: Include Coroot (auto-discovering application observability)
  ansible.builtin.import_tasks: coroot.yml
  when: coroot_enabled | bool
  tags: [coroot]
