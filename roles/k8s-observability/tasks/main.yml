---
# Observability Stack Role - Complete Implementation
# Deploys VictoriaMetrics + Loki + Grafana on Kubernetes
# VictoriaMetrics v1.133.0, Loki v3.6.3, Grafana v12.3.1

- name: Set observability tier-specific variables
  set_fact:
    monitoring_namespace: "monitoring"
    vm_operator_version: "0.59.3"
    loki_chart_version: "6.55.0"
    grafana_chart_version: "10.5.15"
    grafana_domain: "grafana.{{ domain }}"
    vm_retention: "{{ metrics_retention | default('30d') }}"
    vm_storage_size: "{{ metrics_storage | default('50Gi') }}"
    loki_retention: "{{ logging_retention | default('14d') }}"
    vm_replicas: "{{ 2 if tier in ['medium', 'production'] else 1 }}"
    grafana_replicas: "{{ 2 if tier == 'production' else 1 }}"

- name: Create monitoring namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ monitoring_namespace }}"
        labels:
          app.kubernetes.io/part-of: observability

# ============================================
# VictoriaMetrics
# ============================================

- name: Add VictoriaMetrics Helm repository
  kubernetes.core.helm_repository:
    name: vm
    repo_url: "https://victoriametrics.github.io/helm-charts/"

- name: Install VictoriaMetrics Operator
  kubernetes.core.helm:
    name: vm-operator
    chart_ref: vm/victoria-metrics-operator
    chart_version: "{{ vm_operator_version }}"
    release_namespace: "{{ monitoring_namespace }}"
    create_namespace: true
    release_state: present
    wait: true
    values:
      operator:
        enable_converter_ownership: true

- name: Deploy VMCluster (distributed mode)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: operator.victoriametrics.com/v1beta1
      kind: VMCluster
      metadata:
        name: vmcluster
        namespace: "{{ monitoring_namespace }}"
      spec:
        retentionPeriod: "{{ vm_retention }}"
        replicationFactor: "{{ 2 if tier in ['medium', 'production'] else 1 }}"
        vmstorage:
          replicaCount: "{{ vm_replicas }}"
          storage:
            volumeClaimTemplate:
              spec:
                storageClassName: "{{ storage_class | default('hcloud-volumes') }}"
                resources:
                  requests:
                    storage: "{{ vm_storage_size }}"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 2Gi
        vmselect:
          replicaCount: "{{ vm_replicas }}"
          cacheMountPath: /cache
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 1Gi
        vminsert:
          replicaCount: "{{ vm_replicas }}"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
  when: tier in ['medium', 'production']

- name: Deploy VMSingle (standalone mode for minimal/small)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: operator.victoriametrics.com/v1beta1
      kind: VMSingle
      metadata:
        name: vmsingle
        namespace: "{{ monitoring_namespace }}"
      spec:
        retentionPeriod: "{{ vm_retention }}"
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: "{{ storage_class | default('hcloud-volumes') }}"
              resources:
                requests:
                  storage: "{{ vm_storage_size }}"
        resources:
          requests:
            cpu: "{{ '50m' if tier == 'minimal' else '100m' }}"
            memory: "{{ '128Mi' if tier == 'minimal' else '256Mi' }}"
          limits:
            cpu: 1000m
            memory: 2Gi
  when: tier in ['minimal', 'small']

- name: Deploy VMAgent for scraping
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: operator.victoriametrics.com/v1beta1
      kind: VMAgent
      metadata:
        name: vmagent
        namespace: "{{ monitoring_namespace }}"
      spec:
        replicaCount: "{{ vm_replicas }}"
        selectAllByDefault: true
        remoteWrite:
          - url: "{{ 'http://vminsert-vmcluster.' + monitoring_namespace + '.svc:8480/insert/0/prometheus/api/v1/write' if tier in ['medium', 'production'] else 'http://vmsingle-vmsingle.' + monitoring_namespace + '.svc:8429/api/v1/write' }}"
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi

# ============================================
# Loki (Log Aggregation)
# ============================================

- name: Add Grafana Helm repository
  kubernetes.core.helm_repository:
    name: grafana
    repo_url: "https://grafana.github.io/helm-charts"

- name: Create Loki S3 credentials secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: loki-s3-credentials
        namespace: "{{ monitoring_namespace }}"
      type: Opaque
      stringData:
        S3_ACCESS_KEY: "{{ minio_root_user }}"
        S3_SECRET_KEY: "{{ minio_root_password }}"

- name: Install Loki with Helm
  kubernetes.core.helm:
    name: loki
    chart_ref: grafana/loki
    chart_version: "{{ loki_chart_version }}"
    release_namespace: "{{ monitoring_namespace }}"
    create_namespace: true
    release_state: present
    wait: true
    timeout: "10m0s"
    values:
      deploymentMode: "{{ 'SingleBinary' if tier in ['minimal', 'small'] else 'SimpleScalable' }}"
      loki:
        auth_enabled: false
        commonConfig:
          replication_factor: "{{ 2 if tier in ['medium', 'production'] else 1 }}"
        storage:
          type: s3
          s3:
            endpoint: "http://minio.storage.svc.cluster.local:9000"
            bucketnames: loki-chunks
            access_key_id: "{{ minio_root_user }}"
            secret_access_key: "{{ minio_root_password }}"
            s3ForcePathStyle: true
            insecure: true
          bucketNames:
            chunks: loki-chunks
            ruler: loki-ruler
            admin: loki-admin
        schemaConfig:
          configs:
            - from: "2024-01-01"
              store: tsdb
              object_store: s3
              schema: v13
              index:
                prefix: loki_index_
                period: 24h
        limits_config:
          retention_period: "{{ loki_retention }}"
          max_query_length: 721h
          max_query_parallelism: 32
      read:
        replicas: "{{ 0 if tier in ['minimal', 'small'] else vm_replicas }}"
        resources:
          requests:
            cpu: "{{ '25m' if tier == 'minimal' else '50m' }}"
            memory: "{{ '64Mi' if tier == 'minimal' else '128Mi' }}"
          limits:
            cpu: 500m
            memory: 512Mi
      write:
        replicas: "{{ 0 if tier in ['minimal', 'small'] else vm_replicas }}"
        resources:
          requests:
            cpu: "{{ '25m' if tier == 'minimal' else '50m' }}"
            memory: "{{ '64Mi' if tier == 'minimal' else '128Mi' }}"
          limits:
            cpu: 500m
            memory: 512Mi
        persistence:
          enabled: true
          size: "{{ '5Gi' if tier == 'minimal' else '10Gi' }}"
          storageClass: "{{ storage_class | default('hcloud-volumes') }}"
      backend:
        replicas: "{{ 0 if tier in ['minimal', 'small'] else vm_replicas }}"
        resources:
          requests:
            cpu: "{{ '25m' if tier == 'minimal' else '50m' }}"
            memory: "{{ '64Mi' if tier == 'minimal' else '128Mi' }}"
          limits:
            cpu: 500m
            memory: 512Mi
        persistence:
          enabled: true
          size: "{{ '5Gi' if tier == 'minimal' else '10Gi' }}"
          storageClass: "{{ storage_class | default('hcloud-volumes') }}"
      singleBinary:
        replicas: "{{ 1 if tier in ['minimal', 'small'] else 0 }}"
        resources:
          requests:
            cpu: "{{ '25m' if tier == 'minimal' else '50m' }}"
            memory: "{{ '64Mi' if tier == 'minimal' else '128Mi' }}"
          limits:
            cpu: 500m
            memory: 512Mi
        persistence:
          enabled: true
          size: "{{ '5Gi' if tier == 'minimal' else '10Gi' }}"
          storageClass: "{{ storage_class | default('hcloud-volumes') }}"
      gateway:
        enabled: true
        replicas: 1
        nginxConfig:
          resolver: coredns.kube-system.svc.cluster.local.
      chunksCache:
        enabled: false
      resultsCache:
        enabled: false
      minio:
        enabled: false
      test:
        enabled: false

- name: Install Promtail for log collection
  kubernetes.core.helm:
    name: promtail
    chart_ref: grafana/promtail
    chart_version: "6.17.1"
    release_namespace: "{{ monitoring_namespace }}"
    create_namespace: true
    release_state: present
    wait: true
    values:
      config:
        clients:
          - url: "http://loki-gateway.{{ monitoring_namespace }}.svc.cluster.local/loki/api/v1/push"
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 256Mi

# ============================================
# Grafana
# ============================================

- name: Install Grafana with Helm
  kubernetes.core.helm:
    name: grafana
    chart_ref: grafana/grafana
    chart_version: "{{ grafana_chart_version }}"
    release_namespace: "{{ monitoring_namespace }}"
    create_namespace: true
    release_state: present
    wait: true
    values:
      replicas: "{{ grafana_replicas }}"
      adminUser: "{{ grafana_admin_user | default('admin') }}"
      adminPassword: "{{ grafana_admin_password }}"
      persistence:
        enabled: true
        size: 5Gi
        storageClass: "{{ storage_class | default('hcloud-volumes') }}"
      datasources:
        datasources.yaml:
          apiVersion: 1
          datasources:
            - name: VictoriaMetrics
              type: prometheus
              uid: victoria-metrics
              url: "{{ 'http://vmselect-vmcluster.' + monitoring_namespace + '.svc:8481/select/0/prometheus' if tier in ['medium', 'production'] else 'http://vmsingle-vmsingle.' + monitoring_namespace + '.svc:8429' }}"
              access: proxy
              isDefault: true
              jsonData:
                timeInterval: 15s
            - name: Loki
              type: loki
              uid: loki
              url: "http://loki-gateway.{{ monitoring_namespace }}.svc.cluster.local"
              access: proxy
              jsonData:
                maxLines: 1000
            - name: PMM
              type: prometheus
              uid: pmm
              url: "http://pmm-server.{{ monitoring_namespace }}.svc.cluster.local/prometheus"
              access: proxy
              jsonData:
                timeInterval: 5s
      dashboardProviders:
        dashboardproviders.yaml:
          apiVersion: 1
          providers:
            - name: default
              orgId: 1
              folder: ''
              type: file
              disableDeletion: false
              editable: true
              options:
                path: /var/lib/grafana/dashboards/default
      dashboards:
        default:
          node-exporter:
            gnetId: 1860
            revision: 37
            datasource: VictoriaMetrics
          kubernetes-cluster:
            gnetId: 7249
            revision: 1
            datasource: VictoriaMetrics
          victoriametrics-cluster:
            gnetId: 11176
            revision: 18
            datasource: VictoriaMetrics
          loki-dashboard:
            gnetId: 13639
            revision: 2
            datasource: Loki
          cilium-dashboard:
            gnetId: 16611
            revision: 1
            datasource: VictoriaMetrics
          postgresql-dashboard:
            gnetId: 9628
            revision: 7
            datasource: VictoriaMetrics
          mongodb-dashboard:
            gnetId: 2583
            revision: 2
            datasource: VictoriaMetrics
          percona-pg-overview:
            gnetId: 12273
            revision: 5
            datasource: VictoriaMetrics
          percona-mongodb-overview:
            gnetId: 7353
            revision: 5
            datasource: VictoriaMetrics
          percona-pg-replication:
            gnetId: 12280
            revision: 2
            datasource: VictoriaMetrics
          argocd-dashboard:
            gnetId: 14584
            revision: 1
            datasource: VictoriaMetrics
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
      sidecar:
        dashboards:
          enabled: true
        datasources:
          enabled: true

- name: Create Grafana Gateway API HTTPRoute (VPN-only via admin-gateway)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: grafana
        namespace: "{{ monitoring_namespace }}"
      spec:
        parentRefs:
          - name: admin-gateway
            namespace: cilium-system
            sectionName: https
        hostnames:
          - "{{ grafana_domain }}"
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - name: grafana
                port: 80

- name: Create TLS Certificate for Grafana
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cert-manager.io/v1
      kind: Certificate
      metadata:
        name: grafana-tls
        namespace: cilium-secrets
      spec:
        secretName: grafana-tls
        issuerRef:
          name: letsencrypt-prod
          kind: ClusterIssuer
        dnsNames:
          - "{{ grafana_domain }}"

# ============================================
# Percona Monitoring and Management (PMM) Server
# ============================================

- name: Create PMM admin password secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: pmm-secret
        namespace: "{{ monitoring_namespace }}"
      type: Opaque
      stringData:
        PMM_ADMIN_PASSWORD: "{{ grafana_admin_password }}"

- name: Deploy PMM Server
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: pmm-server
        namespace: "{{ monitoring_namespace }}"
        labels:
          app: pmm-server
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: pmm-server
        template:
          metadata:
            labels:
              app: pmm-server
          spec:
            containers:
              - name: pmm-server
                image: "percona/pmm-server:2"
                ports:
                  - containerPort: 443
                    name: https
                  - containerPort: 80
                    name: http
                env:
                  - name: DISABLE_UPDATES
                    value: "1"
                  - name: METRICS_RESOLUTION
                    value: "5s"
                  - name: DISABLE_TELEMETRY
                    value: "1"
                  - name: PMM_ADMIN_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: pmm-secret
                        key: PMM_ADMIN_PASSWORD
                volumeMounts:
                  - name: pmm-data
                    mountPath: /srv
                resources:
                  requests:
                    cpu: 200m
                    memory: 512Mi
                  limits:
                    cpu: "2"
                    memory: 2Gi
                readinessProbe:
                  httpGet:
                    path: /v1/readyz
                    port: 80
                  initialDelaySeconds: 30
                  periodSeconds: 10
                livenessProbe:
                  httpGet:
                    path: /v1/readyz
                    port: 80
                  initialDelaySeconds: 60
                  periodSeconds: 30
            volumes:
              - name: pmm-data
                persistentVolumeClaim:
                  claimName: pmm-server-data

- name: Create PMM Server PVC
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: pmm-server-data
        namespace: "{{ monitoring_namespace }}"
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: "{{ storage_class | default('hcloud-volumes') }}"
        resources:
          requests:
            storage: 20Gi

- name: Create PMM Server Service
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: pmm-server
        namespace: "{{ monitoring_namespace }}"
        labels:
          app: pmm-server
      spec:
        selector:
          app: pmm-server
        ports:
          - name: http
            port: 80
            targetPort: 80
          - name: https
            port: 443
            targetPort: 443

- name: Wait for PMM Server to be ready
  kubernetes.core.k8s_info:
    kind: Deployment
    namespace: "{{ monitoring_namespace }}"
    name: pmm-server
  register: pmm_deploy
  until: >
    pmm_deploy.resources | length > 0
    and (pmm_deploy.resources[0].status.readyReplicas | default(0)) >= 1
  retries: 30
  delay: 15
  failed_when: false

- name: Get PMM Server pod name
  shell: kubectl get pod -n {{ monitoring_namespace }} -l app=pmm-server -o jsonpath='{.items[0].metadata.name}'
  register: pmm_pod_name
  changed_when: false
  failed_when: false

- name: Generate PMM API key for database monitoring
  shell: |
    kubectl exec -n {{ monitoring_namespace }} {{ pmm_pod_name.stdout }} -- \
      curl -s -X POST \
      -H 'Content-Type: application/json' \
      -u admin:admin \
      http://localhost/graph/api/auth/keys \
      -d '{"name":"percona-db-key-{{ ansible_date_time.epoch }}","role":"Admin"}'
  register: pmm_api_key_result
  failed_when: false
  changed_when: false
  when: pmm_pod_name.stdout | default('') | length > 0

- name: Set PMM API key fact
  set_fact:
    pmm_api_key: "{{ (pmm_api_key_result.stdout | default('{}') | from_json).key | default('') }}"
  when: pmm_api_key_result.rc | default(1) == 0
  failed_when: false

- name: Create PMM HTTPRoute (VPN-only via admin-gateway)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: pmm
        namespace: "{{ monitoring_namespace }}"
      spec:
        parentRefs:
          - name: admin-gateway
            namespace: cilium-system
            sectionName: https
        hostnames:
          - "pmm.{{ domain }}"
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - name: pmm-server
                port: 80

- name: Create TLS Certificate for PMM
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cert-manager.io/v1
      kind: Certificate
      metadata:
        name: pmm-tls
        namespace: cilium-secrets
      spec:
        secretName: pmm-tls
        issuerRef:
          name: letsencrypt-prod
          kind: ClusterIssuer
        dnsNames:
          - "pmm.{{ domain }}"

# ============================================
# VMServiceScrape for Percona exporters
# ============================================

- name: Create VMServiceScrape for PostgreSQL exporter
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: operator.victoriametrics.com/v1beta1
      kind: VMServiceScrape
      metadata:
        name: percona-pg-exporter
        namespace: "{{ monitoring_namespace }}"
      spec:
        namespaceSelector:
          matchNames:
            - databases
        selector:
          matchLabels:
            postgres-operator.crunchydata.com/crunchy-postgres-exporter: "true"
        endpoints:
          - port: exporter
            path: /metrics
            interval: 30s

- name: Create VMServiceScrape for MongoDB exporter
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: operator.victoriametrics.com/v1beta1
      kind: VMServiceScrape
      metadata:
        name: percona-mongodb-exporter
        namespace: "{{ monitoring_namespace }}"
      spec:
        namespaceSelector:
          matchNames:
            - databases
        selector:
          matchLabels:
            app.kubernetes.io/name: percona-server-mongodb
        endpoints:
          - port: metrics
            path: /metrics
            interval: 30s

- name: Create VMServiceScrape for PMM Server
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: operator.victoriametrics.com/v1beta1
      kind: VMServiceScrape
      metadata:
        name: pmm-server
        namespace: "{{ monitoring_namespace }}"
      spec:
        selector:
          matchLabels:
            app: pmm-server
        endpoints:
          - port: http
            path: /prometheus/metrics
            interval: 30s

# ============================================
# Alerting Rules
# ============================================

- name: Deploy VMRule for alerting
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: operator.victoriametrics.com/v1beta1
      kind: VMRule
      metadata:
        name: platform-alerts
        namespace: "{{ monitoring_namespace }}"
      spec:
        groups:
          - name: kubernetes
            rules:
              - alert: KubePodCrashLooping
                expr: 'rate(kube_pod_container_status_restarts_total[15m]) * 60 * 5 > 0'
                for: 15m
                labels:
                  severity: warning
                annotations:
                  summary: "Pod {{ '{{ $labels.namespace }}' }}/{{ '{{ $labels.pod }}' }} is crash looping"
              - alert: KubeNodeNotReady
                expr: 'kube_node_status_condition{condition="Ready",status="true"} == 0'
                for: 15m
                labels:
                  severity: critical
                annotations:
                  summary: "Node {{ '{{ $labels.node }}' }} is not ready"
              - alert: KubePersistentVolumeFillingUp
                expr: 'kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes < 0.15'
                for: 1h
                labels:
                  severity: warning
                annotations:
                  summary: "PV {{ '{{ $labels.persistentvolumeclaim }}' }} filling up (< 15% free)"
              - alert: HighMemoryUsage
                expr: '(1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 0.9'
                for: 5m
                labels:
                  severity: warning
                annotations:
                  summary: "High memory usage on {{ '{{ $labels.instance }}' }}"
          - name: databases
            rules:
              - alert: PostgreSQLDown
                expr: 'pg_up == 0'
                for: 2m
                labels:
                  severity: critical
                annotations:
                  summary: "PostgreSQL instance {{ '{{ $labels.instance }}' }} is down"
              - alert: PostgreSQLReplicationLag
                expr: 'pg_replication_lag > 30'
                for: 5m
                labels:
                  severity: warning
                annotations:
                  summary: "PostgreSQL replication lag is {{ '{{ $value }}' }}s on {{ '{{ $labels.instance }}' }}"
              - alert: PostgreSQLTooManyConnections
                expr: 'sum by (instance) (pg_stat_activity_count) > pg_settings_max_connections * 0.8'
                for: 5m
                labels:
                  severity: warning
                annotations:
                  summary: "PostgreSQL connections above 80% on {{ '{{ $labels.instance }}' }}"
              - alert: PostgreSQLDeadlocks
                expr: 'rate(pg_stat_database_deadlocks[5m]) > 0'
                for: 5m
                labels:
                  severity: warning
                annotations:
                  summary: "PostgreSQL deadlocks detected on {{ '{{ $labels.datname }}' }}"
              - alert: MongoDBDown
                expr: 'mongodb_up == 0'
                for: 2m
                labels:
                  severity: critical
                annotations:
                  summary: "MongoDB instance {{ '{{ $labels.instance }}' }} is down"
              - alert: MongoDBReplicationLag
                expr: 'mongodb_mongod_replset_member_replication_lag > 30'
                for: 5m
                labels:
                  severity: warning
                annotations:
                  summary: "MongoDB replication lag is {{ '{{ $value }}' }}s on {{ '{{ $labels.instance }}' }}"
              - alert: MongoDBCursorsOpen
                expr: 'mongodb_mongod_metrics_cursor_open{state="total"} > 10000'
                for: 5m
                labels:
                  severity: warning
                annotations:
                  summary: "MongoDB has {{ '{{ $value }}' }} open cursors on {{ '{{ $labels.instance }}' }}"
              - alert: PGBackrestBackupStale
                expr: 'time() - pg_backrest_backup_last_completed_time_epoch > 172800'
                for: 1h
                labels:
                  severity: warning
                annotations:
                  summary: "pgbackrest backup is older than 48h"

- name: Display observability deployment info
  debug:
    msg:
      - "=========================================="
      - "  Observability Stack Deployed"
      - "=========================================="
      - "  Grafana: https://{{ grafana_domain }}"
      - "    User: {{ grafana_admin_user }} / {{ grafana_admin_password[:4] }}****"
      - "  VictoriaMetrics: {{ 'Cluster' if tier in ['medium', 'production'] else 'Single' }} mode"
      - "  Loki: SimpleScalable mode"
      - "  PMM Server: https://pmm.{{ domain }}"
      - "    User: admin / {{ grafana_admin_password[:4] }}****"
      - "  Retention: metrics={{ vm_retention }}, logs={{ loki_retention }}"
      - "  DB Dashboards: PostgreSQL, MongoDB, Replication, PMM"
      - "=========================================="
