- name: Create VMServiceScrape for MongoDB exporter
  kubernetes.core.k8s:
    state: '{{ "present" if (platform_mongodb_enabled | default(false) | bool) else "absent" }}'
    definition:
      apiVersion: operator.victoriametrics.com/v1beta1
      kind: VMServiceScrape
      metadata:
        name: percona-mongodb-exporter
        namespace: '{{ monitoring_namespace }}'
      spec:
        namespaceSelector:
          matchNames:
