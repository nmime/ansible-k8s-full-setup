  register: _r_create_hetzner_vmservicescrape
  retries: 3
  delay: 10
  until: _r_create_hetzner_vmservicescrape is not failed
  ignore_errors: true
- name: Add Tempo Helm repository
  kubernetes.core.helm_repository:
    name: grafana
    repo_url: https://grafana.github.io/helm-charts
  when: tracing_enabled | default(false) | bool
  register: _r_add_tempo_helm_repo
  retries: 3
  delay: 10
  until: _r_add_tempo_helm_repo is not failed
- name: Create Tempo S3 credentials secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: tempo-s3-credentials
        namespace: '{{ monitoring_namespace }}'
      type: Opaque
      stringData:
        S3_ACCESS_KEY: '{{ object_storage_access_key }}'
        S3_SECRET_KEY: '{{ object_storage_secret_key }}'
  when: tracing_enabled | default(false) | bool
  no_log: true
  register: _r_create_tempo_s3_secret
  retries: 3
  delay: 10
  until: _r_create_tempo_s3_secret is not failed
- name: Create Tempo object storage bucket
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: create-tempo-bucket
        namespace: storage
      spec:
        ttlSecondsAfterFinished: 300
        template:
          spec:
            restartPolicy: OnFailure
            containers:
            - name: aws-cli
              image: "{{ object_storage_aws_cli_image | default('amazon/aws-cli:latest') }}"
              command:
              - sh
              - -c
              - |-
                if ! aws --endpoint-url {{ object_storage_endpoint | default('http://seaweedfs-filer.storage.svc.cluster.local:8333') }} s3api head-bucket --bucket tempo-traces >/dev/null 2>&1; then
                  aws --endpoint-url {{ object_storage_endpoint | default('http://seaweedfs-filer.storage.svc.cluster.local:8333') }} s3api create-bucket --bucket tempo-traces
                fi
              env:
              - name: AWS_ACCESS_KEY_ID
                valueFrom:
                  secretKeyRef:
                    name: seaweedfs-s3-config
                    key: AWS_ACCESS_KEY_ID
              - name: AWS_SECRET_ACCESS_KEY
                valueFrom:
                  secretKeyRef:
                    name: seaweedfs-s3-config
                    key: AWS_SECRET_ACCESS_KEY
              - name: AWS_DEFAULT_REGION
                value: us-east-1
              - name: AWS_EC2_METADATA_DISABLED
                value: "true"
  when: tracing_enabled | default(false) | bool
  register: _r_create_tempo_bucket
  retries: 3
  delay: 10
  until: _r_create_tempo_bucket is not failed
  ignore_errors: true
- name: Install Grafana Tempo with Helm
  kubernetes.core.helm:
    name: tempo
    chart_ref: grafana/tempo-distributed
    chart_version: 1.9.0
    release_namespace: '{{ monitoring_namespace }}'
    create_namespace: true
    release_state: present
    wait: false
    values:
      storage:
        trace:
          backend: s3
          s3:
            bucket: tempo-traces
            endpoint: "{{ object_storage_endpoint_hostport | default('seaweedfs-filer.storage.svc.cluster.local:8333') }}"
            access_key: '{{ object_storage_access_key }}'
            secret_key: '{{ object_storage_secret_key }}'
            insecure: true
      compactor:
        config:
          compaction:
            block_retention: '{{ tempo_retention | default(''24h'') }}'
      distributor:
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
      ingester:
        replicas: '{{ 1 if tier in [''minimal'', ''small'', ''medium''] else 2 }}'
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        persistence:
          enabled: true
          size: '{{ tempo_storage_size | default(''5Gi'') }}'
          storageClass: '{{ storage_class }}'
      querier:
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
      queryFrontend:
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
      gateway:
        enabled: true
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
  when: tracing_enabled | default(false) | bool
  register: _r_install_tempo
  retries: 3
  delay: 10
  until: _r_install_tempo is not failed
- name: Add OpenTelemetry Helm repository
  kubernetes.core.helm_repository:
    name: open-telemetry
    repo_url: https://open-telemetry.github.io/opentelemetry-helm-charts
  when: otel_collector_enabled | default(false) | bool
  register: _r_add_otel_helm_repo
