- name: Set observability tier-specific variables
  set_fact:
    monitoring_namespace: monitoring
    logging_agent_namespace: logging-agents
    vm_operator_version: "{{ vm_operator_version | default('0.66.2') }}"
    loki_chart_version: 6.55.0
    grafana_chart_version: 10.5.15
    grafana_domain: grafana.{{ domain }}
    vm_retention: '{{ metrics_retention | default(''30d'') }}'
    vm_storage_size: '{{ metrics_storage | default(''100Gi'') }}'
    loki_retention: '{{ logging_retention | default(''14d'') }}'
    vm_replicas: '{{ observability.metrics.replicas | default(2 if resource_tier in [''medium'', ''production''] else 1) | int }}'
    vm_replication_factor: >-
      {{ observability.metrics.replication_factor |
         default(2 if (observability.metrics.replicas |
           default(2 if resource_tier in ['medium', 'production'] else 1) | int) >= 2 else 1) |
         int }}
    grafana_replicas: '{{ observability.grafana.replicas | default(2 if resource_tier == ''production'' else 1) }}'
    bastion_metrics_ip: >-
      {{ bastion_private_ip | default(bastion_public_ip | default('')) }}
    ha_egress_metrics_ips: >-
      {{
        [
          ha_egress.gateway_1_private_ip | default(ha_egress.active_private_ip),
          ha_egress.gateway_2_private_ip | default(ha_egress.standby_private_ip)
        ]
        if ha_egress is defined and ha_egress.enabled | default(false) | bool
        else []
      }}
- name: Require a persisted bastion address for host metrics
  ansible.builtin.assert:
    that:
    - bastion_metrics_ip | length > 0
    fail_msg: >-
      Bastion address is unavailable. Deploy infrastructure first so
      playbooks/{{ project_name }}-infra-facts.yml can be loaded.
- name: Create monitoring namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: monitoring
        labels:
          app.kubernetes.io/part-of: observability
          pod-security.kubernetes.io/enforce: baseline
          pod-security.kubernetes.io/warn: restricted
  register: _r_create_monitoring_namespace
  retries: 3
  delay: 10
  until: _r_create_monitoring_namespace is not failed
- name: Add VictoriaMetrics Helm repository
  kubernetes.core.helm_repository:
    name: vm
    repo_url: https://victoriametrics.github.io/helm-charts/
  register: _r_add_victoriametrics_helm_repository
  retries: 3
  delay: 10
  until: _r_add_victoriametrics_helm_repository is not failed
- name: Install VictoriaMetrics Operator
  kubernetes.core.helm:
    name: vm-operator
    chart_ref: vm/victoria-metrics-operator
    chart_version: '{{ vm_operator_version }}'
    release_namespace: '{{ monitoring_namespace }}'
    create_namespace: true
    release_state: present
    wait: true
    timeout: 2m0s
    values:
      operator:
        enable_converter_ownership: true
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi
      podSecurityContext:
        enabled: true
        fsGroup: 2000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        enabled: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
        readOnlyRootFilesystem: true
  register: _r_install_victoriametrics_operator
  retries: 3
  delay: 10
  until: _r_install_victoriametrics_operator is not failed
- name: Wait for VictoriaMetrics Operator webhook to be ready
  kubernetes.core.k8s_info:
    api_version: admissionregistration.k8s.io/v1
    kind: ValidatingWebhookConfiguration
    name: vm-operator-victoria-metrics-operator-admission
  register: _r_vm_webhook
  retries: 30
  delay: 10
  failed_when: false
  until:
  - _r_vm_webhook.resources | length > 0
  - _r_vm_webhook.resources[0].webhooks | default([]) | length > 0
- name: Wait for VictoriaMetrics Operator pod to be fully ready
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: '{{ monitoring_namespace }}'
    label_selectors:
    - app.kubernetes.io/name=victoria-metrics-operator
  register: _r_vm_operator_pod
  retries: 30
  delay: 10
  until:
  - _r_vm_operator_pod.resources | length > 0
  - _r_vm_operator_pod.resources[0].status.containerStatuses is defined
  - _r_vm_operator_pod.resources[0].status.containerStatuses | selectattr('ready', 'equalto', true) | list | length == _r_vm_operator_pod.resources[0].status.containerStatuses | length
- name: Wait for operator webhook endpoint to be serving
  ansible.builtin.pause:
    seconds: 15
- name: Remove legacy bastion node-exporter Endpoints object
  kubernetes.core.k8s:
    api_version: v1
    kind: Endpoints
    namespace: '{{ monitoring_namespace }}'
    name: bastion-node-exporter
    state: absent
- name: Add bastion node-exporter EndpointSlice after the Kubernetes API is ready
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: discovery.k8s.io/v1
      kind: EndpointSlice
      metadata:
        name: bastion-node-exporter
        namespace: '{{ monitoring_namespace }}'
        labels:
          app: bastion-node-exporter
          kubernetes.io/service-name: bastion-node-exporter
      addressType: IPv4
      endpoints:
      - addresses: ['{{ bastion_metrics_ip }}']
      ports:
      - name: metrics
        port: 9100
        protocol: TCP
- name: Add bastion node-exporter headless Service
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: bastion-node-exporter
        namespace: '{{ monitoring_namespace }}'
        labels:
          app: bastion-node-exporter
      spec:
        clusterIP: None
        ports:
        - name: metrics
          port: 9100
          protocol: TCP
- name: Add VMServiceScrape for bastion node-exporter
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: operator.victoriametrics.com/v1beta1
      kind: VMServiceScrape
      metadata:
        name: bastion-node-exporter
        namespace: '{{ monitoring_namespace }}'
      spec:
        discoveryRole: endpointslices
        selector:
          matchLabels:
            app: bastion-node-exporter
        endpoints:
        - port: metrics
          interval: 30s
- name: Add HA egress health EndpointSlice
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: discovery.k8s.io/v1
      kind: EndpointSlice
      metadata:
        name: ha-egress-health
        namespace: '{{ monitoring_namespace }}'
        labels:
          app: ha-egress-health
          app.kubernetes.io/name: ha-egress-health
          app.kubernetes.io/component: network-egress
          kubernetes.io/service-name: ha-egress-health
      addressType: IPv4
      endpoints:
      - addresses: ['{{ ha_egress_metrics_ips[0] }}']
      - addresses: ['{{ ha_egress_metrics_ips[1] }}']
      ports:
      - name: metrics
        port: '{{ ha_egress.health_port | default(9911) | int }}'
        protocol: TCP
  when: ha_egress_metrics_ips | length == 2
- name: Add HA egress health headless Service
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: ha-egress-health
        namespace: '{{ monitoring_namespace }}'
        labels:
          app: ha-egress-health
          app.kubernetes.io/name: ha-egress-health
          app.kubernetes.io/component: network-egress
      spec:
        clusterIP: None
        ports:
        - name: metrics
          port: '{{ ha_egress.health_port | default(9911) | int }}'
          protocol: TCP
  when: ha_egress_metrics_ips | length == 2
- name: Allow only VictoriaMetrics to scrape the private HA egress gateways
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: allow-vmagent-to-ha-egress
        namespace: '{{ monitoring_namespace }}'
      spec:
        podSelector:
          matchLabels:
            app.kubernetes.io/name: vmagent
            app.kubernetes.io/instance: vmagent
        policyTypes: [Egress]
        egress:
        - to:
          - ipBlock:
              cidr: '{{ ha_egress_metrics_ips[0] }}/32'
          - ipBlock:
              cidr: '{{ ha_egress_metrics_ips[1] }}/32'
          ports:
          - protocol: TCP
            port: '{{ ha_egress.health_port | default(9911) | int }}'
  when: ha_egress_metrics_ips | length == 2
- name: Add VMServiceScrape for HA egress health
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: operator.victoriametrics.com/v1beta1
      kind: VMServiceScrape
      metadata:
        name: ha-egress-health
        namespace: '{{ monitoring_namespace }}'
        labels:
          app.kubernetes.io/name: ha-egress-health
          app.kubernetes.io/component: network-egress
      spec:
        discoveryRole: endpointslices
        selector:
          matchLabels:
            app.kubernetes.io/name: ha-egress-health
            app.kubernetes.io/component: network-egress
        endpoints:
        - port: metrics
          path: /metrics
          interval: 15s
  when: ha_egress_metrics_ips | length == 2
- name: Deploy VMCluster (distributed mode)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: operator.victoriametrics.com/v1beta1
      kind: VMCluster
      metadata:
        name: vmcluster
        namespace: '{{ monitoring_namespace }}'
      spec:
        retentionPeriod: '{{ vm_retention }}'
        replicationFactor: '{{ vm_replication_factor | int }}'
        vmstorage:
          replicaCount: '{{ vm_replicas | int }}'
          storage:
            volumeClaimTemplate:
              spec:
                storageClassName: '{{ storage_class | default(''hcloud-volumes'') }}'
                resources:
                  requests:
                    storage: '{{ vm_storage_size }}'
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
        vmselect:
          replicaCount: '{{ vm_replicas | int }}'
          cacheMountPath: /cache
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
        vminsert:
          replicaCount: '{{ vm_replicas | int }}'
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
  when: tier in ['medium', 'production']
  register: _r_deploy_vmcluster_distributed_mode
  retries: 10
  delay: 30
  until: _r_deploy_vmcluster_distributed_mode is not failed
- name: Deploy VMSingle (standalone mode for minimal/small)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: operator.victoriametrics.com/v1beta1
      kind: VMSingle
      metadata:
        name: vmsingle
        namespace: '{{ monitoring_namespace }}'
      spec:
        retentionPeriod: '{{ vm_retention }}'
        storage:
          storageClassName: '{{ storage_class | default(''hcloud-volumes'') }}'
          resources:
            requests:
              storage: '{{ vm_storage_size }}'
        resources:
          requests:
            cpu: '{{ ''100m'' if resource_tier in [''minimal'', ''small''] else ''200m'' }}'
            memory: '{{ ''256Mi'' if resource_tier in [''minimal'', ''small''] else ''512Mi'' }}'
          limits:
            cpu: 1000m
            memory: 2Gi
  when: tier in ['minimal', 'small']
  register: _r_deploy_vmsingle_standalone_mode_for_mini
  retries: 10
  delay: 30
  until: _r_deploy_vmsingle_standalone_mode_for_mini is not failed
- name: Deploy VMAgent for scraping
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: operator.victoriametrics.com/v1beta1
      kind: VMAgent
      metadata:
        name: vmagent
        namespace: '{{ monitoring_namespace }}'
      spec:
        replicaCount: '{{ vm_replicas | int }}'
        selectAllByDefault: true
        configReloaderResources:
          requests:
            cpu: 10m
            memory: 25Mi
          limits:
            cpu: "{{ '100m' if resource_tier in ['minimal', 'small'] else '200m' }}"
            memory: "{{ '64Mi' if resource_tier in ['minimal', 'small'] else '128Mi' }}"
        remoteWrite:
        - url: '{{ ''http://vminsert-vmcluster.'' + monitoring_namespace + ''.svc:8480/insert/0/prometheus/api/v1/write'' if tier in [''medium'', ''production''] else ''http://vmsingle-vmsingle.'' + monitoring_namespace
            + ''.svc:8429/api/v1/write'' }}'
        resources:
          requests:
            cpu: '{{ ''50m'' if resource_tier in [''minimal'', ''small''] else ''100m'' }}'
            memory: '{{ ''128Mi'' if resource_tier in [''minimal'', ''small''] else ''256Mi'' }}'
          limits:
            cpu: 500m
            memory: 512Mi
  register: _r_deploy_vmagent_for_scraping
  retries: 3
  delay: 10
  until: _r_deploy_vmagent_for_scraping is not failed
- name: Add Grafana Helm repository
  kubernetes.core.helm_repository:
    name: grafana
    repo_url: https://grafana.github.io/helm-charts
  register: _r_add_grafana_helm_repository
  retries: 3
  delay: 10
  until: _r_add_grafana_helm_repository is not failed
  when: log_stack in ["loki", "elk", "efk"]
- name: Create Loki S3 credentials secret
  no_log: true
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: loki-s3-credentials
        namespace: '{{ monitoring_namespace }}'
      type: Opaque
      stringData:
        S3_ACCESS_KEY: '{{ object_storage_observability_access_key }}'
        S3_SECRET_KEY: '{{ object_storage_observability_secret_key }}'
  register: _r_create_loki_s3_credentials_secret
  retries: 3
  delay: 10
  until: _r_create_loki_s3_credentials_secret is not failed
  when: log_stack == "loki"
- name: Install Loki with Helm
  no_log: true
  kubernetes.core.helm:
    name: loki
    chart_ref: grafana/loki
    chart_version: '{{ loki_chart_version }}'
    release_namespace: '{{ monitoring_namespace }}'
    create_namespace: true
    release_state: present
    wait: false
    timeout: 10m0s
    values:
      deploymentMode: '{{ ''SingleBinary'' if loki_deployment_mode == ''single-binary'' else ''SimpleScalable'' }}'
      loki:
        auth_enabled: false
        podSecurityContext:
          seccompProfile:
            type: RuntimeDefault
        commonConfig:
          replication_factor: '{{ 2 if resource_tier in [''medium'', ''production''] else 1 }}'
        storage:
          type: s3
          s3:
            endpoint: "{{ object_storage_endpoint | default('http://seaweedfs-filer.storage.svc.cluster.local:8333') }}"
            bucketnames: loki-chunks
            access_key_id: '{{ object_storage_observability_access_key }}'
            secret_access_key: '{{ object_storage_observability_secret_key }}'
            s3ForcePathStyle: true
            insecure: true
          bucketNames:
            chunks: loki-chunks
            ruler: loki-ruler
            admin: loki-admin
        schemaConfig:
          configs:
          - from: '2024-01-01'
            store: tsdb
            object_store: s3
            schema: v13
            index:
              prefix: loki_index_
              period: 24h
        limits_config:
          retention_period: '{{ loki_retention }}'
          max_query_length: 721h
          max_query_parallelism: 32
      read:
        replicas: '{{ 0 if loki_deployment_mode == ''single-binary'' else vm_replicas | int }}'
        resources:
          requests:
            cpu: '{{ ''50m'' if resource_tier == ''minimal'' else ''100m'' }}'
            memory: '{{ ''128Mi'' if resource_tier == ''minimal'' else ''256Mi'' }}'
          limits:
            cpu: 500m
            memory: 512Mi
      write:
        replicas: '{{ 0 if loki_deployment_mode == ''single-binary'' else vm_replicas | int }}'
        resources:
          requests:
            cpu: '{{ ''25m'' if resource_tier == ''minimal'' else ''50m'' }}'
            memory: '{{ ''64Mi'' if resource_tier == ''minimal'' else ''128Mi'' }}'
          limits:
            cpu: 500m
            memory: 512Mi
        persistence:
          enabled: true
          enableStatefulSetAutoDeletePVC: false
          whenDeleted: Retain
          whenScaled: Retain
          size: '{{ ''10Gi'' if resource_tier in [''minimal'', ''small''] else ''20Gi'' }}'
          storageClass: '{{ storage_class | default(''hcloud-volumes'') }}'
      backend:
        replicas: '{{ 0 if loki_deployment_mode == ''single-binary'' else vm_replicas | int }}'
        resources:
          requests:
            cpu: '{{ ''25m'' if resource_tier == ''minimal'' else ''50m'' }}'
            memory: '{{ ''64Mi'' if resource_tier == ''minimal'' else ''128Mi'' }}'
          limits:
            cpu: 500m
            memory: 512Mi
        persistence:
          enabled: true
          enableStatefulSetAutoDeletePVC: false
          whenDeleted: Retain
          whenScaled: Retain
          size: '{{ ''10Gi'' if resource_tier in [''minimal'', ''small''] else ''20Gi'' }}'
          storageClass: '{{ storage_class | default(''hcloud-volumes'') }}'
      singleBinary:
        replicas: '{{ 1 if loki_deployment_mode == ''single-binary'' else 0 }}'
        resources:
          requests:
            cpu: '{{ ''25m'' if resource_tier == ''minimal'' else ''50m'' }}'
            memory: '{{ ''64Mi'' if resource_tier == ''minimal'' else ''128Mi'' }}'
          limits:
            cpu: 500m
            memory: 512Mi
        persistence:
          enabled: true
          enableStatefulSetAutoDeletePVC: false
          whenDeleted: Retain
          whenScaled: Retain
          size: '{{ ''10Gi'' if resource_tier in [''minimal'', ''small''] else ''20Gi'' }}'
          storageClass: '{{ storage_class | default(''hcloud-volumes'') }}'
      gateway:
        enabled: true
        replicas: 1
        podSecurityContext:
          seccompProfile:
            type: RuntimeDefault
        nginxConfig:
          resolver: coredns.kube-system.svc.cluster.local.
      lokiCanary:
        podSecurityContext:
          seccompProfile:
            type: RuntimeDefault
      chunksCache:
        enabled: false
      resultsCache:
        enabled: false
      test:
        enabled: false
  register: _r_install_loki_with_helm
  retries: 3
  delay: 10
  until: _r_install_loki_with_helm is not failed
  when: log_stack == "loki"
- name: Remove legacy Promtail release from the baseline monitoring namespace
  kubernetes.core.helm:
    name: promtail
    release_namespace: '{{ monitoring_namespace }}'
    release_state: absent
    wait: true
  when: log_stack in ["loki", "elk", "efk"]
- name: Remove Promtail node agents when Loki is not the selected log backend
  kubernetes.core.helm:
    name: promtail
    release_namespace: '{{ logging_agent_namespace }}'
    release_state: absent
    wait: true
  when: log_stack != "loki"
- name: Create isolated privileged namespace for node log agents
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: '{{ logging_agent_namespace }}'
        labels:
          app.kubernetes.io/part-of: observability
          pod-security.kubernetes.io/enforce: privileged
          pod-security.kubernetes.io/audit: restricted
          pod-security.kubernetes.io/warn: restricted
  when: log_stack in ["loki", "elk", "efk"]
- name: Install Promtail for log collection
  kubernetes.core.helm:
    name: promtail
    chart_ref: grafana/promtail
    chart_version: 6.17.1
    release_namespace: '{{ logging_agent_namespace }}'
    create_namespace: true
    release_state: present
    wait: false
    values:
      config:
        clients:
        - url: http://loki-gateway.{{ monitoring_namespace }}.svc.cluster.local/loki/api/v1/push
        snippets:
          pipelineStages: >-
            {{
              [
                {'cri': {}},
                {'replace': {'expression': '\\b\\d{3}-\\d{2}-\\d{4}\\b', 'replace': 'XXX-XX-XXXX'}},
                {'replace': {'expression': '\\(\\d{3}\\)\\s*\\d{3}-\\d{4}', 'replace': '(XXX) XXX-XXXX'}},
                {'replace': {'expression': '\\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}\\b', 'replace': '[REDACTED_EMAIL]'}}
              ]
              if log_redaction_enabled | bool else [{'cri': {}}]
            }}
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 256Mi
      # On log-heavy nodes Promtail can briefly spend more than the upstream
      # one-second default serving /ready while it reconciles rotated files.
      # Keep the probe strict, but avoid marking a healthy node agent
      # unavailable during ordinary GitLab and backup bursts.
      readinessProbe:
        failureThreshold: 6
        httpGet:
          path: /ready
          port: http-metrics
        initialDelaySeconds: 10
        periodSeconds: 10
        successThreshold: 1
        timeoutSeconds: 5
      # The upstream chart also defaults to Docker's container directory.
      # containerd CRI logs live under /var/log/pods, so declare only the
      # runtime state and host-log mounts that Promtail actually consumes.
      defaultVolumes:
      - name: run
        hostPath:
          path: /run/promtail
      - name: pods
        hostPath:
          path: /var/log/pods
      defaultVolumeMounts:
      - name: run
        mountPath: /run/promtail
      - name: pods
        mountPath: /var/log/pods
        readOnly: true
      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
        readOnlyRootFilesystem: true
        seccompProfile:
          type: RuntimeDefault
      # Node-local log collection must cover dedicated CI and mail workers as
      # well as general workers. These tolerations do not weaken workload
      # isolation: Promtail remains a small, resource-bounded DaemonSet and
      # does not make the tainted nodes eligible for ordinary workloads.
      tolerations:
      - key: workload.platform.example.com/ci-docker
        operator: Exists
        effect: NoSchedule
      - key: workload.platform.example.com/ci-build
        operator: Exists
        effect: NoSchedule
      - key: workload.platform.example.com/mail
        operator: Exists
        effect: NoSchedule
  register: _r_install_promtail_for_log_collection
  retries: 3
  delay: 10
  until: _r_install_promtail_for_log_collection is not failed
  when: log_stack == "loki"
- name: Remove legacy invalid Cilium default-deny for logging agents
  kubernetes.core.k8s:
    state: absent
    definition:
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: default-deny
        namespace: '{{ logging_agent_namespace }}'
  when: log_stack in ["loki", "elk", "efk"]
- name: Create default-deny NetworkPolicy for logging agents
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: default-deny
        namespace: '{{ logging_agent_namespace }}'
      spec:
        podSelector: {}
        policyTypes:
        - Ingress
        - Egress
        ingress: []
        egress: []
  when: log_stack in ["loki", "elk", "efk"]
- name: Allow logging agents to reach the selected backend and Kubernetes discovery
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: allow-logging-egress
        namespace: '{{ logging_agent_namespace }}'
      spec:
        endpointSelector: {}
        egress:
        - toEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: kube-system
              k8s:k8s-app: kube-dns
          toPorts:
          - ports:
            - port: '53'
              protocol: UDP
            - port: '53'
              protocol: TCP
        - toCIDR:
          - 169.254.25.10/32
          toPorts:
          - ports:
            - port: '53'
              protocol: UDP
            - port: '53'
              protocol: TCP
        - toEntities:
          - host
          toPorts:
          - ports:
            - port: '53'
              protocol: UDP
            - port: '53'
              protocol: TCP
        - toEntities:
          - kube-apiserver
        - toServices:
          - k8sService:
              serviceName: '{{ "loki-gateway" if log_stack == "loki" else "elasticsearch" }}'
              namespace: '{{ monitoring_namespace if log_stack == "loki" else "elasticsearch" }}'
          toPorts:
          - ports:
            - port: '{{ "80" if log_stack == "loki" else "9200" }}'
              protocol: TCP
        # Cilium resolves toServices against the Service frontend, but the
        # selected backend Pod still receives traffic on its targetPort. Keep
        # an explicit endpoint rule so default-deny remains correct across
        # kube-proxy-free service translation and policy regeneration.
        - toEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: '{{ monitoring_namespace }}'
              k8s:app.kubernetes.io/name: loki
              k8s:app.kubernetes.io/instance: loki
              k8s:app.kubernetes.io/component: gateway
          toPorts:
          - ports:
            - port: '8080'
              protocol: TCP
  when: log_stack in ["loki", "elk", "efk"]
- name: Allow node health probes to logging agents
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: allow-logging-node-health-probes
        namespace: '{{ logging_agent_namespace }}'
      spec:
        endpointSelector: {}
        ingress:
        - fromEntities:
          - host
          - remote-node
          toPorts:
          - ports:
            - port: '{{ "3101" if log_stack == "loki" else "5066" }}'
              protocol: TCP
  when: log_stack in ["loki", "elk", "efk"]
- name: Fetch Elasticsearch credentials for Grafana datasource
  kubernetes.core.k8s_info:
    kind: Secret
    namespace: elasticsearch
    name: es-credentials
  register: _r_grafana_es_credentials
  when: log_stack != "loki"
  no_log: true
- name: Set Grafana Elasticsearch password fact
  set_fact:
    grafana_es_password: '{{ _r_grafana_es_credentials.resources[0].data.ELASTIC_PASSWORD | b64decode }}'
  when: log_stack != "loki" and _r_grafana_es_credentials.resources | default([]) | length > 0
  no_log: true
- name: Create dedicated Postal SMTP secret for Grafana
  no_log: true
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: grafana-smtp
        namespace: '{{ monitoring_namespace }}'
        labels:
          app.kubernetes.io/managed-by: ansible
          app.kubernetes.io/part-of: observability
      type: Opaque
      stringData:
        username: '{{ postal_smtp_auth_username }}'
        password: "{{ postal_smtp_credentials['grafana'] }}"
  when: platform_postal_enabled | default(false) | bool
- name: Install Grafana with Helm
  no_log: true
  kubernetes.core.helm:
    name: grafana
    chart_ref: grafana/grafana
    chart_version: '{{ grafana_chart_version }}'
    release_namespace: '{{ monitoring_namespace }}'
    create_namespace: true
    release_state: present
    wait: false
    values:
      replicas: '{{ grafana_replicas | int }}'
      # The bundled persistence is a single RWO volume backed by SQLite. A
      # surge rollout deadlocks on multi-attach; replace the singleton cleanly.
      deploymentStrategy:
        type: Recreate
      adminUser: '{{ grafana_admin_user | default(''admin'') }}'
      adminPassword: '{{ grafana_admin_password }}'
      envValueFrom: >-
        {{
          {
            'GF_SMTP_USER': {
              'secretKeyRef': {'name': 'grafana-smtp', 'key': 'username'}
            },
            'GF_SMTP_PASSWORD': {
              'secretKeyRef': {'name': 'grafana-smtp', 'key': 'password'}
            }
          }
          if platform_postal_enabled | default(false) | bool
          else {}
        }}
      grafana.ini:
        smtp:
          enabled: '{{ platform_postal_enabled | default(false) | bool }}'
          host: '{{ postal_submission_hostname }}:587'
          user: $__env{GF_SMTP_USER}
          password: $__env{GF_SMTP_PASSWORD}
          from_address: grafana@{{ domain }}
          from_name: platform Grafana
          startTLS_policy: MandatoryStartTLS
      persistence:
        enabled: true
        size: 10Gi
        storageClass: '{{ storage_class | default(''hcloud-volumes'') }}'
      datasources:
        datasources.yaml:
          apiVersion: 1
          deleteDatasources: '{{ [] if (pmm_enabled | bool) else [{"name": "PMM", "orgId": 1}] }}'
          datasources: >-
            {{
              [{
                'name': 'VictoriaMetrics',
                'type': 'prometheus',
                'uid': 'victoria-metrics',
                'url': ('http://vmselect-vmcluster.' ~ monitoring_namespace ~ '.svc:8481/select/0/prometheus')
                  if tier in ['medium', 'production']
                  else ('http://vmsingle-vmsingle.' ~ monitoring_namespace ~ '.svc:8429'),
                'access': 'proxy',
                'isDefault': true,
                'jsonData': {'timeInterval': '15s'}
              }]
              + ([{
                'name': 'Loki',
                'type': 'loki',
                'uid': 'loki',
                'url': 'http://loki-gateway.' ~ monitoring_namespace ~ '.svc.cluster.local',
                'access': 'proxy',
                'basicAuth': false,
                'jsonData': {'maxLines': 1000}
              }] if log_stack == 'loki' else [{
                'name': 'Elasticsearch',
                'type': 'elasticsearch',
                'uid': 'elasticsearch',
                'url': 'https://elasticsearch.elasticsearch.svc.cluster.local:9200',
                'access': 'proxy',
                'basicAuth': true,
                'basicAuthUser': 'elastic',
                'jsonData': {'timeField': '@timestamp', 'esVersion': '8.0.0', 'tlsSkipVerify': true},
                'secureJsonData': {'basicAuthPassword': grafana_es_password}
              }])
              + ([{
                'name': 'PMM',
                'type': 'prometheus',
                'uid': 'pmm',
                'url': 'http://pmm-server.' ~ monitoring_namespace ~ '.svc.cluster.local/prometheus',
                'access': 'proxy',
                'jsonData': {'timeInterval': '5s'}
              }] if (pmm_enabled | bool) else [])
            }}
      dashboardProviders:
        dashboardproviders.yaml:
          apiVersion: 1
          providers:
          - name: default
            orgId: 1
            folder: ''
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/default
      dashboards:
        default:
          node-exporter:
            gnetId: 1860
            revision: 37
            datasource: VictoriaMetrics
          kubernetes-cluster:
            gnetId: 7249
            revision: 1
            datasource: VictoriaMetrics
          victoriametrics-cluster:
            gnetId: 11176
            revision: 18
            datasource: VictoriaMetrics
          loki-dashboard:
            gnetId: 13639
            revision: 2
            datasource: Loki
          cilium-dashboard:
            gnetId: 16611
            revision: 1
            datasource: VictoriaMetrics
          postgresql-dashboard:
            gnetId: 9628
            revision: 7
            datasource: VictoriaMetrics
          mongodb-dashboard:
            gnetId: 2583
            revision: 2
            datasource: VictoriaMetrics
          percona-pg-overview:
            gnetId: 12273
            revision: 5
            datasource: VictoriaMetrics
          percona-mongodb-overview:
            gnetId: 7353
            revision: 5
            datasource: VictoriaMetrics
          percona-pg-replication:
            gnetId: 12280
            revision: 2
            datasource: VictoriaMetrics
          argocd-dashboard:
            gnetId: 14584
            revision: 1
            datasource: VictoriaMetrics
      resources:
        requests:
          cpu: '{{ ''25m'' if resource_tier in [''minimal'', ''small''] else ''50m'' }}'
          memory: '{{ ''64Mi'' if resource_tier in [''minimal'', ''small''] else ''128Mi'' }}'
        limits:
          cpu: 500m
          memory: 512Mi
      initChownData:
        resources:
          requests: {cpu: 5m, memory: 16Mi}
          limits: {cpu: 100m, memory: 64Mi}
      downloadDashboards:
        resources:
          requests: {cpu: 5m, memory: 16Mi}
          limits: {cpu: 100m, memory: 64Mi}
      sidecar:
        resources:
          requests: {cpu: 10m, memory: 32Mi}
          limits:
            cpu: "{{ '100m' if resource_tier in ['minimal', 'small'] else '200m' }}"
            memory: 128Mi
        dashboards:
          enabled: true
        datasources:
          enabled: true
  register: _r_install_grafana_with_helm
  retries: 3
  delay: 10
  until: _r_install_grafana_with_helm is not failed
- name: Wait for Grafana before reconciling its persisted admin password
  ansible.builtin.command:
    argv:
      - kubectl
      - rollout
      - status
      - deployment/grafana
      - --namespace
      - '{{ monitoring_namespace }}'
      - --timeout=10m
  changed_when: false
- name: Reconcile the persisted Grafana admin password
  no_log: true
  ansible.builtin.shell: |
    set -euo pipefail
    printf '%s\n' "$GRAFANA_ADMIN_PASSWORD" | \
      kubectl exec -i --namespace "{{ monitoring_namespace }}" deployment/grafana \
        -- sh -ec 'IFS= read -r password; grafana cli --homepath /usr/share/grafana \
          --config /etc/grafana/grafana.ini \
          admin reset-admin-password "$password" >/dev/null'
  args:
    executable: /bin/bash
  environment:
    GRAFANA_ADMIN_PASSWORD: '{{ grafana_admin_password }}'
  changed_when: true
- name: Verify the reconciled Grafana admin login
  no_log: true
  ansible.builtin.shell: |
    set -euo pipefail
    payload=$(jq -cn \
      --arg user "{{ grafana_admin_user | default('admin', true) }}" \
      --rawfile password <(printf '%s' "$GRAFANA_ADMIN_PASSWORD") \
      '{user:$user,password:$password}')
    jq -e '(.user | length) > 0 and (.password | length) > 0' \
      >/dev/null <<<"$payload"
    printf '%s' "$payload" | kubectl exec -i --namespace "{{ monitoring_namespace }}" \
      deployment/grafana -- sh -ec '
        umask 077
        payload_file=$(mktemp)
        trap "rm -f -- \"$payload_file\"" EXIT
        cat >"$payload_file"
        grep -Eq "\"user\":\"[^\"]+\"" "$payload_file"
        grep -Eq "\"password\":\"[^\"]+\"" "$payload_file"
        curl -fsS -H "Content-Type: application/json" \
          --data-binary @"$payload_file" http://localhost:3000/login >/dev/null
      '
  args:
    executable: /bin/bash
  environment:
    GRAFANA_ADMIN_PASSWORD: '{{ grafana_admin_password }}'
  changed_when: false
  register: _grafana_password_verification
  retries: 10
  delay: 3
  until: _grafana_password_verification is succeeded
- name: Create Grafana Gateway API HTTPRoute (VPN-only via admin-gateway)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: grafana
        namespace: '{{ monitoring_namespace }}'
      spec:
        parentRefs:
        - name: admin-gateway
          namespace: cilium-system
          sectionName: https
        hostnames:
        - '{{ grafana_domain }}'
        rules:
        - matches:
          - path:
              type: PathPrefix
              value: /
          backendRefs:
          - name: grafana
            port: 80
  register: _r_create_grafana_gateway_api_httproute_vpn
  retries: 3
  delay: 10
  until: _r_create_grafana_gateway_api_httproute_vpn is not failed
- name: Create TLS Certificate for Grafana
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cert-manager.io/v1
      kind: Certificate
      metadata:
        name: grafana-tls
        namespace: cilium-secrets
      spec:
        secretName: grafana-tls
        issuerRef:
          name: '{{ cert_manager_cluster_issuer }}'
          kind: ClusterIssuer
        dnsNames:
        - '{{ grafana_domain }}'
  register: _r_create_tls_certificate_for_grafana
  retries: 3
  delay: 10
  until: _r_create_tls_certificate_for_grafana is not failed
- name: Create PMM admin password secret
  when: pmm_enabled | bool
  no_log: true
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: pmm-secret
        namespace: '{{ monitoring_namespace }}'
      type: Opaque
      stringData:
        PMM_ADMIN_PASSWORD: '{{ grafana_admin_password }}'
  register: _r_create_pmm_admin_password_secret
  retries: 3
  delay: 10
  until: _r_create_pmm_admin_password_secret is not failed
- name: Create PMM ServiceAccount
  when: pmm_enabled | bool
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: pmm-server
        namespace: '{{ monitoring_namespace }}'
        labels:
          app: pmm-server
      automountServiceAccountToken: false
  register: _r_create_pmm_sa
  retries: 3
  delay: 10
  until: _r_create_pmm_sa is not failed
- name: Create PMM Server PVC
  when: pmm_enabled | bool
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: pmm-server-data
        namespace: '{{ monitoring_namespace }}'
      spec:
        accessModes:
        - ReadWriteOnce
        storageClassName: '{{ storage_class | default(''hcloud-volumes'') }}'
        resources:
          requests:
            storage: '{{ pmm_storage_size }}'
  register: _r_create_pmm_server_pvc
  retries: 3
  delay: 10
  until: _r_create_pmm_server_pvc is not failed
- name: Read existing PMM Deployment before security-context reconciliation
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    namespace: '{{ monitoring_namespace }}'
    name: pmm-server
  register: _pmm_existing_deployment
  when: pmm_enabled | bool
- name: Remove the legacy privileged PMM permission init container
  kubernetes.core.k8s_json_patch:
    api_version: apps/v1
    kind: Deployment
    namespace: '{{ monitoring_namespace }}'
    name: pmm-server
    patch:
      - op: remove
        path: /spec/template/spec/initContainers
  when:
    - pmm_enabled | bool
    - (_pmm_existing_deployment.resources | default([])) | length == 1
    - _pmm_existing_deployment.resources[0].spec.template.spec.initContainers | default([]) | length > 0
- name: Deploy PMM Server
  when: pmm_enabled | bool
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: pmm-server
        namespace: '{{ monitoring_namespace }}'
        labels:
          app: pmm-server
      spec:
        replicas: 1
        # The single PMM instance mounts a ReadWriteOnce Hetzner volume. A
        # rolling update deadlocks on multi-attach, so release the old pod first.
        strategy:
          type: Recreate
        selector:
          matchLabels:
            app: pmm-server
        template:
          metadata:
            labels:
              app: pmm-server
          spec:
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
              fsGroup: 1000
              fsGroupChangePolicy: OnRootMismatch
              seccompProfile:
                type: RuntimeDefault
            serviceAccountName: pmm-server
            enableServiceLinks: false
            containers:
            - name: pmm-server
              image: percona/pmm-server:{{ pmm_server_version }}
              ports:
              - containerPort: 8443
                name: https
              - containerPort: 8080
                name: http
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                  - ALL
              env:
              - name: PMM_ENABLE_UPDATES
                value: 'false'
              - name: PMM_METRICS_RESOLUTION
                value: 5s
              - name: PMM_ENABLE_TELEMETRY
                value: 'false'
              - name: PMM_ADMIN_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: pmm-secret
                    key: PMM_ADMIN_PASSWORD
              volumeMounts:
              - name: pmm-data
                mountPath: /srv
              resources:
                requests:
                  cpu: '{{ ''50m'' if resource_tier in [''minimal'', ''small''] else ''200m'' }}'
                  memory: '{{ ''256Mi'' if resource_tier in [''minimal'', ''small''] else ''512Mi'' }}'
                limits:
                  cpu: '2'
                  memory: 4Gi
              readinessProbe:
                httpGet:
                  path: /v1/readyz
                  port: 8080
                initialDelaySeconds: 60
                periodSeconds: 10
                timeoutSeconds: 5
              livenessProbe:
                httpGet:
                  path: /v1/readyz
                  port: 8080
                initialDelaySeconds: 300
                periodSeconds: 30
                timeoutSeconds: 5
                failureThreshold: 10
            volumes:
            - name: pmm-data
              persistentVolumeClaim:
                claimName: pmm-server-data
  register: _r_deploy_pmm_server
  retries: 3
  delay: 10
  until: _r_deploy_pmm_server is not failed
- name: Create PMM Server Service
  when: pmm_enabled | bool
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: pmm-server
        namespace: '{{ monitoring_namespace }}'
        labels:
          app: pmm-server
      spec:
        selector:
          app: pmm-server
        ports:
        - name: http
          port: 8080
          targetPort: 8080
        - name: https
          port: 8443
          targetPort: 8443
        - name: https-compat
          port: 443
          targetPort: 8443
  register: _r_create_pmm_server_service
  retries: 3
  delay: 10
  until: _r_create_pmm_server_service is not failed
- name: Wait for PMM Server to be ready
  when: pmm_enabled | bool
  kubernetes.core.k8s_info:
    kind: Deployment
    namespace: '{{ monitoring_namespace }}'
    name: pmm-server
  register: pmm_deploy
  until: '(pmm_deploy.resources | default([])) | length > 0 and (pmm_deploy.resources[0].status.readyReplicas | default(0)) >= 1

    '
  retries: 30
  delay: 15
- name: Get PMM Server pod name
  when: pmm_enabled | bool
  shell: kubectl get pod -n {{ monitoring_namespace }} -l app=pmm-server -o jsonpath='{.items[0].metadata.name}'
  register: pmm_pod_name
  changed_when: false
  retries: 30
  delay: 5
  until: pmm_pod_name.stdout | default('') | length > 0
- name: Issue a validated PMM 3 service-account token
  shell: |
    kubectl exec -i -n {{ monitoring_namespace }} {{ pmm_pod_name.stdout }} -- bash <<'PMM_TOKEN_SCRIPT'
    set -euo pipefail
    COOKIE_FILE=$(mktemp)
    trap 'rm -f "$COOKIE_FILE"' EXIT

    # PMM only applies PMM_ADMIN_PASSWORD on first boot. Reconcile the
    # persisted Grafana database before using its authenticated API.
    grafana cli --homepath /usr/share/grafana \
      --config /etc/grafana/grafana.ini \
      admin reset-admin-password "$PMM_ADMIN_PASSWORD" >/dev/null 2>&1

    LOGIN_JSON=$(python3 -c 'import json,os; print(json.dumps({"user":"admin","password":os.environ["PMM_ADMIN_PASSWORD"]}))')
    curl -sf -c "$COOKIE_FILE" -H 'Content-Type: application/json' \
      --data-binary "$LOGIN_JSON" \
      http://127.0.0.1:3000/graph/login >/dev/null

    SA_ID=$(curl -sf -b "$COOKIE_FILE" \
      'http://127.0.0.1:3000/graph/api/serviceaccounts/search?query=percona-db-sa' \
      | python3 -c 'import json,sys; accounts=json.load(sys.stdin).get("serviceAccounts",[]); print(accounts[0]["id"] if accounts else "")')
    if [ -z "$SA_ID" ]; then
      SA_ID=$(curl -sf -X POST -b "$COOKIE_FILE" \
        -H 'Content-Type: application/json' \
        -d '{"name":"percona-db-sa","role":"Admin"}' \
        http://127.0.0.1:3000/graph/api/serviceaccounts \
        | python3 -c 'import json,sys; print(json.load(sys.stdin).get("id",""))')
    fi

    KEY=$(curl -sf -X POST -b "$COOKIE_FILE" \
      -H 'Content-Type: application/json' \
      -d "{\"name\":\"percona-db-key-$(date +%s%N)\"}" \
      "http://127.0.0.1:3000/graph/api/serviceaccounts/${SA_ID}/tokens" \
      | python3 -c 'import json,sys; print(json.load(sys.stdin).get("key",""))')
    case "$KEY" in
      glsa_*) ;;
      *) exit 1 ;;
    esac
    printf '%s\n' "$KEY"
    PMM_TOKEN_SCRIPT
  register: pmm_server_token_result
  retries: 12
  delay: 10
  until: >-
    pmm_server_token_result.rc == 0 and
    (pmm_server_token_result.stdout_lines | default([]) | last | default('')).startswith('glsa_')
  failed_when: >-
    pmm_server_token_result.rc != 0 or
    not (pmm_server_token_result.stdout_lines | default([]) | last | default('')).startswith('glsa_')
  changed_when: false
  no_log: true
  when:
    - pmm_enabled | bool
    - pmm_pod_name.stdout | default('') | length > 0
- name: Set PMM service-account token fact
  set_fact:
    pmm_server_token: '{{ pmm_server_token_result.stdout_lines | default([]) | last | default('''') }}'
  no_log: true
  when:
    - pmm_enabled | bool
    - pmm_server_token_result.rc | default(1) == 0
- name: Require a non-empty PMM service-account token for database monitoring
  ansible.builtin.assert:
    that:
      - pmm_server_token | default('') | length > 0
    fail_msg: PMM did not issue a database-monitoring service-account token.
  no_log: true
  when: pmm_enabled | bool
- name: Persist the PMM service-account token for component-only reconciliations
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: pmm-client-credentials
        namespace: '{{ monitoring_namespace }}'
      type: Opaque
      stringData:
        PMM_SERVER_TOKEN: '{{ pmm_server_token }}'
  no_log: true
  when: pmm_enabled | bool
- name: Create PMM HTTPRoute (VPN-only via admin-gateway)
  when: pmm_enabled | bool
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: pmm
        namespace: '{{ monitoring_namespace }}'
      spec:
        parentRefs:
        - name: admin-gateway
          namespace: cilium-system
          sectionName: https
        hostnames:
        - pmm.{{ domain }}
        rules:
        - matches:
          - path:
              type: PathPrefix
              value: /
          backendRefs:
          - name: pmm-server
            port: 8080
  register: _r_create_pmm_httproute_vpn_only_via_admin_
  retries: 3
  delay: 10
  until: _r_create_pmm_httproute_vpn_only_via_admin_ is not failed
- name: Create TLS Certificate for PMM
  when: pmm_enabled | bool
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cert-manager.io/v1
      kind: Certificate
      metadata:
        name: pmm-tls
        namespace: cilium-secrets
      spec:
        secretName: pmm-tls
        issuerRef:
          name: '{{ cert_manager_cluster_issuer }}'
          kind: ClusterIssuer
        dnsNames:
        - pmm.{{ domain }}
  register: _r_create_tls_certificate_for_pmm
  retries: 3
  delay: 10
  until: _r_create_tls_certificate_for_pmm is not failed
- name: Create VMServiceScrape for PostgreSQL exporter
  kubernetes.core.k8s:
    state: '{{ "present" if (platform_postgresql_enabled | default(true) | bool) else "absent" }}'
    definition:
      apiVersion: operator.victoriametrics.com/v1beta1
      kind: VMServiceScrape
      metadata:
        name: percona-pg-exporter
        namespace: '{{ monitoring_namespace }}'
      spec:
        namespaceSelector:
          matchNames:
          - databases
        selector:
          matchLabels:
            postgres-operator.crunchydata.com/crunchy-postgres-exporter: 'true'
        endpoints:
        - port: exporter
          path: /metrics
          interval: 30s
  register: _r_create_vmservicescrape_for_postgresql_ex
  retries: 3
  delay: 10
  until: _r_create_vmservicescrape_for_postgresql_ex is not failed
- name: Create VMServiceScrape for MongoDB exporter
  kubernetes.core.k8s:
    state: '{{ "present" if (platform_mongodb_enabled | default(false) | bool) else "absent" }}'
    definition:
      apiVersion: operator.victoriametrics.com/v1beta1
      kind: VMServiceScrape
      metadata:
        name: percona-mongodb-exporter
        namespace: '{{ monitoring_namespace }}'
      spec:
        namespaceSelector:
          matchNames:
          - databases
        selector:
          matchLabels:
            app.kubernetes.io/name: percona-server-mongodb
        endpoints:
        - port: metrics
          path: /metrics
          interval: 30s
  register: _r_create_vmservicescrape_for_mongodb_expor
  retries: 3
  delay: 10
  until: _r_create_vmservicescrape_for_mongodb_expor is not failed
- name: Create VMServiceScrape for PMM Server
  when: pmm_enabled | bool
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: operator.victoriametrics.com/v1beta1
      kind: VMServiceScrape
      metadata:
        name: pmm-server
        namespace: '{{ monitoring_namespace }}'
      spec:
        selector:
          matchLabels:
            app: pmm-server
        endpoints:
        - port: http
          path: /prometheus/metrics
          interval: 30s
  register: _r_create_vmservicescrape_for_pmm_server
  retries: 3
  delay: 10
  until: _r_create_vmservicescrape_for_pmm_server is not failed
- name: Deploy VMRule for alerting
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: operator.victoriametrics.com/v1beta1
      kind: VMRule
      metadata:
        name: platform-alerts
        namespace: '{{ monitoring_namespace }}'
      spec:
        groups:
        - name: kubernetes
          rules:
          - alert: KubePodCrashLooping
            expr: >-
              max by (namespace, pod, container)
              (kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"} == 1)
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: Pod {{ '{{ $labels.namespace }}' }}/{{ '{{ $labels.pod }}' }} is crash looping
          - alert: KubeNodeNotReady
            expr: kube_node_status_condition{condition="Ready",status="true"} == 0
            for: 15m
            labels:
              severity: critical
            annotations:
              summary: Node {{ '{{ $labels.node }}' }} is not ready
          - alert: KubePersistentVolumeFillingUp
            expr: kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes < 0.15
            for: 1h
            labels:
              severity: warning
            annotations:
              summary: PV {{ '{{ $labels.persistentvolumeclaim }}' }} filling up (< 15% free)
          - alert: HighMemoryUsage
            expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 0.9
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: High memory usage on {{ '{{ $labels.instance }}' }}
        - name: egress
          rules:
          - alert: HAEgressGatewayNotReady
            expr: count(platform_egress_ready == 1) < 2
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: Fewer than two HA egress gateways are ready
          - alert: HAEgressActiveGatewayCountInvalid
            expr: sum(platform_egress_active) != 1
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: HA egress must have exactly one active Floating-IP owner
        - name: databases
          rules:
          - alert: PostgreSQLDown
            expr: pg_up == 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: PostgreSQL instance {{ '{{ $labels.instance }}' }} is down
          - alert: PostgreSQLReplicationLag
            expr: pg_replication_lag > 30
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: PostgreSQL replication lag is {{ '{{ $value }}' }}s on {{ '{{ $labels.instance }}' }}
          - alert: PostgreSQLTooManyConnections
            expr: sum by (instance) (pg_stat_activity_count) > pg_settings_max_connections * 0.8
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: PostgreSQL connections above 80% on {{ '{{ $labels.instance }}' }}
          - alert: PostgreSQLDeadlocks
            expr: rate(pg_stat_database_deadlocks[5m]) > 0
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: PostgreSQL deadlocks detected on {{ '{{ $labels.datname }}' }}
          - alert: MongoDBDown
            expr: mongodb_up == 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: MongoDB instance {{ '{{ $labels.instance }}' }} is down
          - alert: MongoDBReplicationLag
            expr: mongodb_mongod_replset_member_replication_lag > 30
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: MongoDB replication lag is {{ '{{ $value }}' }}s on {{ '{{ $labels.instance }}' }}
          - alert: MongoDBCursorsOpen
            expr: mongodb_mongod_metrics_cursor_open{state="total"} > 10000
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: MongoDB has {{ '{{ $value }}' }} open cursors on {{ '{{ $labels.instance }}' }}
          - alert: PGBackrestBackupStale
            expr: time() - pg_backrest_backup_last_completed_time_epoch > 172800
            for: 1h
            labels:
              severity: warning
            annotations:
              summary: pgbackrest backup is older than 48h
  register: _r_deploy_vmrule_for_alerting
  retries: 3
  delay: 10
  until: _r_deploy_vmrule_for_alerting is not failed

# CI/build nodes fill root filesystems fast (docker-in-docker, buildkit layers).
# Early warning at 80% gives headroom before kubelet image GC / DiskPressure.
- name: Deploy node disk usage VMRule for CI/build nodes
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: operator.victoriametrics.com/v1beta1
      kind: VMRule
      metadata:
        name: node-disk-80-warning
        namespace: '{{ monitoring_namespace }}'
        labels:
          app.kubernetes.io/part-of: gitlab-runner-hygiene
      spec:
        groups:
          - name: node-disk-ci
            rules:
              - alert: NodeDiskUsageAbove80
                expr: 100 - ((node_filesystem_avail_bytes{fstype!~"tmpfs|overlay",mountpoint="/"} / node_filesystem_size_bytes) * 100) > 80
                for: 10m
                labels:
                  severity: warning
                  owner: platform
                  environment_tier: platform
                annotations:
                  summary: Node {{ "{{ $labels.instance }}" }} root fs >80% used
                  description: CI nodes running docker-in-docker/buildkit fill disks fast. Investigate before kubelet image GC / DiskPressure kicks in.
  register: _r_deploy_node_disk_vmrule
  retries: 3
  delay: 10
  until: _r_deploy_node_disk_vmrule is not failed
- name: Display observability deployment info
  debug:
    msg: >-
      {{
        ['==========================================',
         '  Observability Stack Deployed',
         '==========================================',
         '  Grafana: https://' ~ grafana_domain,
         '    User: ' ~ grafana_admin_user ~ ' / ****',
         '  VictoriaMetrics: ' ~ ('Cluster' if tier in ['medium', 'production'] else 'Single') ~ ' mode',
         '  Logs: ' ~ ('Loki' if log_stack == 'loki' else 'Elasticsearch'),
         '  Retention: metrics=' ~ vm_retention ~ ', logs=' ~ logging_retention]
        + (['  PMM Server: https://pmm.' ~ domain,
             '    User: admin / ****'] if (pmm_enabled | bool) else ['  PMM Server: DISABLED'])
        + ['==========================================']
      }}
- name: Add Elastic Helm repository
  kubernetes.core.helm_repository:
    name: elastic
    repo_url: https://helm.elastic.co
  register: _r_add_elastic_helm_repository
  retries: 3
  delay: 10
  until: _r_add_elastic_helm_repository is not failed
  when: log_stack == "elk"
- name: Remove legacy Filebeat release from Elasticsearch namespace
  kubernetes.core.helm:
    name: filebeat
    release_namespace: elasticsearch
    release_state: absent
    wait: true
  when: log_stack in ["loki", "elk", "efk"]
- name: Remove Filebeat node agents when ELK is not the selected log backend
  kubernetes.core.helm:
    name: filebeat
    release_namespace: '{{ logging_agent_namespace }}'
    release_state: absent
    wait: true
  when: log_stack != "elk"
- name: Remove the legacy replicated Elasticsearch superuser secret
  no_log: true
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Secret
    namespace: '{{ logging_agent_namespace }}'
    name: es-credentials
- name: Remove replicated logging credentials when Elasticsearch logging is deselected
  no_log: true
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Secret
    namespace: '{{ logging_agent_namespace }}'
    name: '{{ item }}'
  loop:
  - es-tls-certs
  - logging-ingest-credentials
  when: log_stack not in ["elk", "efk"]
- name: Read Elasticsearch secrets for the selected isolated logging agent
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    namespace: elasticsearch
    name: '{{ item }}'
  loop:
  - es-tls-certs
  - logging-ingest-credentials
  register: _r_filebeat_source_secrets
  no_log: true
  when: log_stack in ["elk", "efk"]
- name: Replicate the minimum Elasticsearch credentials into the agent namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: '{{ item.name }}'
        namespace: '{{ logging_agent_namespace }}'
      type: Opaque
      data: '{{ item.data }}'
  loop:
  - name: es-tls-certs
    data:
      ca.crt: '{{ _r_filebeat_source_secrets.results[0].resources[0].data["ca.crt"] }}'
  - name: logging-ingest-credentials
    data:
      username: '{{ _r_filebeat_source_secrets.results[1].resources[0].data.username }}'
      password: '{{ _r_filebeat_source_secrets.results[1].resources[0].data.password }}'
  no_log: true
  when: log_stack in ["elk", "efk"]
- name: Detect the Helm major version for the Filebeat post-renderer
  ansible.builtin.command:
    argv:
    - helm
    - version
    - --short
  register: _r_filebeat_helm_version
  changed_when: false
  when: log_stack == "elk"
- name: Resolve the Helm-compatible Filebeat post-renderer
  ansible.builtin.set_fact:
    _filebeat_helm_major: >-
      {{ (_r_filebeat_helm_version.stdout | trim).split('.') | first
         | regex_replace('[^0-9]', '')
         | int }}
  when: log_stack == "elk"
- name: Discover the Helm 4 plugin root
  ansible.builtin.command:
    argv:
    - helm
    - env
    - HELM_PLUGINS
  register: _r_filebeat_helm_plugins_root
  changed_when: false
  when:
  - log_stack == "elk"
  - _filebeat_helm_major | int >= 4
- name: Resolve the Helm 4 plugin root
  ansible.builtin.set_fact:
    _filebeat_helm_plugins_root: >-
      {{ (_r_filebeat_helm_plugins_root.stdout | trim).split(':') | first }}
  when:
  - log_stack == "elk"
  - _filebeat_helm_major | int >= 4
- name: Inspect installed Helm 4 post-renderer plugins
  ansible.builtin.command:
    argv:
    - helm
    - plugin
    - list
    - --type
    - postrenderer/v1
  register: _r_filebeat_helm_plugins
  changed_when: false
  when:
  - log_stack == "elk"
  - _filebeat_helm_major | int >= 4
- name: Install the bundled Helm 4 Filebeat post-renderer plugin
  ansible.builtin.command:
    argv:
    - helm
    - plugin
    - install
    - '{{ playbook_dir }}/../helm-plugins/filebeat-containerd'
  when:
  - log_stack == "elk"
  - _filebeat_helm_major | int >= 4
  - _r_filebeat_helm_plugins.stdout is not regex('(?m)^filebeat-containerd\\s')
- name: Resolve the installed and bundled Helm 4 post-renderer paths
  ansible.builtin.command:
    argv:
    - '{{ ansible_playbook_python }}'
    - -c
    - 'import os,sys; print(os.path.realpath(sys.argv[1])); print(os.path.realpath(sys.argv[2]))'
    - '{{ _filebeat_helm_plugins_root }}/filebeat-containerd'
    - '{{ playbook_dir }}/../helm-plugins/filebeat-containerd'
  register: _r_filebeat_helm_plugin_paths
  changed_when: false
  when:
  - log_stack == "elk"
  - _filebeat_helm_major | int >= 4
- name: Reject a conflicting Helm 4 Filebeat post-renderer plugin
  ansible.builtin.assert:
    that:
    - _r_filebeat_helm_plugin_paths.stdout_lines | length == 2
    - _r_filebeat_helm_plugin_paths.stdout_lines[0] == _r_filebeat_helm_plugin_paths.stdout_lines[1]
    fail_msg: >-
      Helm plugin filebeat-containerd exists but is not the bundled platform
      post-renderer. Remove the conflicting plugin and rerun deployment.
  when:
  - log_stack == "elk"
  - _filebeat_helm_major | int >= 4
- name: Install Filebeat for log collection (ELK)
  kubernetes.core.helm:
    name: filebeat
    chart_ref: elastic/filebeat
    chart_version: 8.5.1
    release_namespace: '{{ logging_agent_namespace }}'
    create_namespace: false
    release_state: present
    wait: false
    post_renderer: >-
      {{ 'filebeat-containerd'
         if (_filebeat_helm_major | int) >= 4
         else playbook_dir ~ '/../scripts/filebeat-containerd-post-renderer.sh' }}
    values:
      imageTag: 9.4.3
      podAnnotations:
        platform.platform.example.com/logging-credentials-checksum: >-
          {{ _r_filebeat_source_secrets.results[1].resources[0].data.password
             | hash('sha256') }}
      daemonset:
        enabled: true
        securityContext:
          runAsUser: 0
          privileged: false
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
          seccompProfile:
            type: RuntimeDefault
        tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
        filebeatConfig:
          filebeat.yml: |
            filebeat.inputs:
              - type: filestream
                id: kubernetes-container-logs
                prospector.scanner.symlinks: true
                parsers:
                  - container: ~
                paths:
                  - /var/log/containers/*.log
            processors:
              - add_kubernetes_metadata:
                  host: ${NODE_NAME}
                  matchers:
                    - logs_path:
                        logs_path: /var/log/containers/
            {% if log_redaction_enabled | bool %}
              - script:
                  lang: javascript
                  id: regulated-data-redaction
                  source: >-
                    function process(event) {
                      var msg = event.Get("message");
                      if (!msg) return;
                      msg = msg.replace(/\b\d{3}-\d{2}-\d{4}\b/g, "XXX-XX-XXXX");
                      msg = msg.replace(/\(\d{3}\)\s*\d{3}-\d{4}/g, "(XXX) XXX-XXXX");
                      msg = msg.replace(/\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}\b/g, "[REDACTED_EMAIL]");
                      event.Put("message", msg);
                    }
            {% endif %}
            output.elasticsearch:
              hosts: ["https://elasticsearch.elasticsearch.svc.cluster.local:9200"]
              username: ${ELASTICSEARCH_USERNAME}
              password: ${ELASTICSEARCH_PASSWORD}
              ssl.certificate_authorities: ["/usr/share/filebeat/config/certs/ca.crt"]
              index: "filebeat-%{[agent.version]}-%{+yyyy.MM.dd}"
            setup.ilm.enabled: true
            setup.ilm.rollover_alias: filebeat
            setup.ilm.pattern: "{now/d}-000001"
            setup.template.name: filebeat
            setup.template.pattern: "filebeat-*"
            logging.level: info
        secretMounts:
        - name: elasticsearch-ca
          secretName: es-tls-certs
          path: /usr/share/filebeat/config/certs
        extraEnvs:
        - name: ELASTICSEARCH_USERNAME
          valueFrom:
            secretKeyRef:
              name: logging-ingest-credentials
              key: username
        - name: ELASTICSEARCH_PASSWORD
          valueFrom:
            secretKeyRef:
              name: logging-ingest-credentials
              key: password
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
  register: _r_install_filebeat_elk
  no_log: true
  retries: 3
  delay: 10
  until: _r_install_filebeat_elk is not failed
  when: log_stack == "elk"
- name: Add Fluent Helm repository
  kubernetes.core.helm_repository:
    name: fluent
    repo_url: https://fluent.github.io/helm-charts
  register: _r_add_fluent_helm_repository
  retries: 3
  delay: 10
  until: _r_add_fluent_helm_repository is not failed
  when: log_stack == "efk"
- name: Remove legacy Fluentd release from the baseline monitoring namespace
  kubernetes.core.helm:
    name: fluentd
    release_namespace: '{{ monitoring_namespace }}'
    release_state: absent
    wait: true
  when: log_stack in ["loki", "elk", "efk"]
- name: Remove Fluentd node agents when EFK is not the selected log backend
  kubernetes.core.helm:
    name: fluentd
    release_namespace: '{{ logging_agent_namespace }}'
    release_state: absent
    wait: true
  when: log_stack != "efk"
- name: Install Fluentd for log collection (EFK)
  kubernetes.core.helm:
    name: fluentd
    chart_ref: fluent/fluentd
    chart_version: 0.5.2
    release_namespace: '{{ logging_agent_namespace }}'
    create_namespace: false
    release_state: present
    wait: false
    values:
      kind: DaemonSet
      fileConfigs:
        01_sources.conf: "<source>\n  @type tail\n  @id in_tail_container_logs\n  path /var/log/containers/*.log\n  pos_file /fluentd/state/fluentd-containers.log.pos\n  tag kubernetes.*\n  read_from_head true\n\
          \  <parse>\n    @type regexp\n    expression /^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]*) (?<log>.*)$/\n    time_format %Y-%m-%dT%H:%M:%S.%N%:z\n    keep_time_key true\n  </parse>\n</source>\n"
        02_filters.conf: |
          <filter kubernetes.**>
            @type kubernetes_metadata
            @id filter_kube_metadata
          </filter>
          {% if log_redaction_enabled | bool %}
          <filter kubernetes.**>
            @type record_transformer
            enable_ruby true
            <record>
              log ${record["log"]&.gsub(/\b\d{3}-\d{2}-\d{4}\b/, "XXX-XX-XXXX")&.gsub(/\(\d{3}\)\s*\d{3}-\d{4}/, "(XXX) XXX-XXXX")&.gsub(/\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}\b/, "[REDACTED_EMAIL]")}
            </record>
          </filter>
          {% endif %}
        04_outputs.conf: "<match **>\n  @type elasticsearch\n  @id out_es\n  host elasticsearch.elasticsearch.svc.cluster.local\n  port 9200\n  scheme https\n  ssl_verify true\n  ca_file /fluentd/certs/ca.crt\n\
          \  user \"#{ENV['ELASTICSEARCH_USERNAME']}\"\n  password \"#{ENV['ELASTICSEARCH_PASSWORD']}\"\n  write_operation create\n  logstash_format true\n  logstash_prefix fluentd\n  <buffer>\n    @type file\n    path /fluentd/state/buffers/kubernetes.system.buffer\n\
          \    flush_mode interval\n    retry_type exponential_backoff\n    flush_interval 5s\n    retry_forever false\n    retry_max_interval 30\n    chunk_limit_size 2M\n    queue_limit_length 8\n   \
          \ overflow_action block\n  </buffer>\n</match>\n"
      # Avoid the chart's Docker-era automatic mounts. The host logs stay
      # read-only and collector state is isolated under /var/lib.
      mountVarLogDirectory: false
      mountDockerContainersDirectory: false
      volumes:
      - name: elasticsearch-ca
        secret:
          secretName: es-tls-certs
      - name: host-logs
        hostPath:
          path: /var/log
      - name: fluentd-state
        hostPath:
          path: /var/lib/fluentd-logging-agents-data
          type: DirectoryOrCreate
      volumeMounts:
      - name: elasticsearch-ca
        mountPath: /fluentd/certs
        readOnly: true
      - name: host-logs
        mountPath: /var/log
        readOnly: true
      - name: fluentd-state
        mountPath: /fluentd/state
      securityContext:
        runAsUser: 0
        privileged: false
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
        readOnlyRootFilesystem: true
        seccompProfile:
          type: RuntimeDefault
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule
      env:
      - name: ELASTICSEARCH_USERNAME
        valueFrom:
          secretKeyRef:
            name: logging-ingest-credentials
            key: username
      - name: ELASTICSEARCH_PASSWORD
        valueFrom:
          secretKeyRef:
            name: logging-ingest-credentials
            key: password
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
  register: _r_install_fluentd_efk
  retries: 3
  delay: 10
  until: _r_install_fluentd_efk is not failed
  when: log_stack == "efk"
- name: Create Hetzner Cloud token secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: hetzner-cloud-token
        namespace: '{{ monitoring_namespace }}'
      type: Opaque
      stringData:
        token: '{{ lookup(''env'', ''HCLOUD_TOKEN'') }}'
  when: hetzner_metrics_enabled | default(true) | bool
  no_log: true
  register: _r_create_hetzner_token_secret
  retries: 3
  delay: 10
  until: _r_create_hetzner_token_secret is not failed
- name: Deploy Hetzner Cloud Exporter
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: hetzner-cloud-exporter
        namespace: '{{ monitoring_namespace }}'
        labels:
          app: hetzner-cloud-exporter
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: hetzner-cloud-exporter
        template:
          metadata:
            labels:
              app: hetzner-cloud-exporter
          spec:
            automountServiceAccountToken: false
            securityContext:
              runAsNonRoot: true
              runAsUser: 1337
              runAsGroup: 1337
              seccompProfile:
                type: RuntimeDefault
            containers:
            - name: exporter
              image: promhippie/hcloud-exporter:{{ hcloud_exporter_version }}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
              env:
              - name: HCLOUD_EXPORTER_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: hetzner-cloud-token
                    key: token
              - name: HCLOUD_EXPORTER_COLLECTOR_SERVER_METRICS
                value: 'true'
              ports:
              - containerPort: 9501
                name: metrics
              readinessProbe:
                httpGet:
                  # /metrics performs live cloud API collection. Probing it
                  # multiplies API traffic and can exhaust Hetzner quotas.
                  path: /healthz
                  port: metrics
                initialDelaySeconds: 5
                periodSeconds: 10
              livenessProbe:
                httpGet:
                  path: /healthz
                  port: metrics
                initialDelaySeconds: 15
                periodSeconds: 30
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
  when: hetzner_metrics_enabled | default(true) | bool
  register: _r_deploy_hetzner_exporter
  retries: 3
  delay: 10
  until: _r_deploy_hetzner_exporter is not failed
- name: Create Hetzner Exporter Service
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: hetzner-cloud-exporter
        namespace: '{{ monitoring_namespace }}'
        labels:
          app: hetzner-cloud-exporter
      spec:
        selector:
          app: hetzner-cloud-exporter
        ports:
        - port: 9501
          targetPort: 9501
          name: metrics
  when: hetzner_metrics_enabled | default(true) | bool
  register: _r_create_hetzner_exporter_svc
  retries: 3
  delay: 10
  until: _r_create_hetzner_exporter_svc is not failed
- name: Create VMServiceScrape for Hetzner Cloud Exporter
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: operator.victoriametrics.com/v1beta1
      kind: VMServiceScrape
      metadata:
        name: hetzner-cloud-exporter
        namespace: '{{ monitoring_namespace }}'
      spec:
        selector:
          matchLabels:
            app: hetzner-cloud-exporter
        endpoints:
        - port: metrics
          # Cloud inventory changes slowly and each scrape fans out across
          # multiple provider API endpoints. Keep generous quota headroom for
          # provisioning, backup, and autoscaling control-plane operations.
          interval: 5m
  when: hetzner_metrics_enabled | default(true) | bool
  register: _r_create_hetzner_vmservicescrape
  retries: 3
  delay: 10
  until: _r_create_hetzner_vmservicescrape is not failed
- name: Deploy VMServiceScrapes for platform services (VictoriaMetrics)
  kubernetes.core.k8s:
    state: present
    definition: >-
      {{ lookup('ansible.builtin.template',
         playbook_dir + '/../roles/k8s-observability/templates/vmservicescrapes.yml')
         | from_yaml_all | list }}
  when:
  - platform_object_storage_enabled | default(false) | bool
    or platform_secrets_enabled | default(false) | bool
    or platform_elasticsearch_enabled | default(false) | bool
- name: Deploy cert-manager alert (cert expiry warning)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: operator.victoriametrics.com/v1beta1
      kind: VMRule
      metadata:
        name: cert-expiry-alerts
        namespace: '{{ monitoring_namespace | default(''monitoring'') }}'
      spec:
        groups:
        - name: cert-manager
          rules:
          - alert: CertificateExpiringSoon
            expr: certmanager_certificate_expiration_timestamp_seconds - time() < 7 * 24 * 3600
            for: 1h
            labels:
                severity: warning
            annotations:
                summary: Certificate {{ '{{ $labels.name }}' }} expires in < 7 days
                description: Namespace {{ '{{ $labels.namespace }}' }}, cert {{ '{{ $labels.name }}' }}
          - alert: CertificateExpiryCritical
            expr: certmanager_certificate_expiration_timestamp_seconds - time() < 24 * 3600
            for: 10m
            labels:
                severity: critical
            annotations:
                summary: Certificate {{ '{{ $labels.name }}' }} expires in < 24 hours!
                description: Immediate action needed. Namespace {{ '{{ $labels.namespace }}' }}
          - alert: CertificateRenewalFailed
            expr: certmanager_certificate_ready_status{condition="False"} == 1
            for: 30m
            labels:
                severity: critical
            annotations:
                summary: Certificate {{ '{{ $labels.name }}' }} renewal FAILED
                description: cert-manager cannot renew {{ '{{ $labels.name }}' }} in {{ '{{ $labels.namespace }}' }}
- name: Remove legacy invalid Cilium default-deny for monitoring namespace
  kubernetes.core.k8s:
    state: absent
    definition:
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: default-deny
        namespace: '{{ monitoring_namespace | default(''monitoring'') }}'
- name: Create default-deny NetworkPolicy for monitoring namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: default-deny
        namespace: '{{ monitoring_namespace | default(''monitoring'') }}'
      spec:
        podSelector: {}
        policyTypes:
        - Ingress
        - Egress
        ingress: []
        egress: []
- name: Allow Grafana ingress from gateway
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: allow-grafana-ingress
        namespace: '{{ monitoring_namespace | default(''monitoring'') }}'
      spec:
        endpointSelector:
          matchLabels:
            app.kubernetes.io/name: grafana
        ingress:
        - fromEntities:
          - cluster
          toPorts:
          - ports:
            - port: '3000'
              protocol: TCP
- name: Allow monitoring scrape (VMAgent/Promtail collect from all namespaces)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: allow-monitoring-egress
        namespace: '{{ monitoring_namespace | default(''monitoring'') }}'
      spec:
        endpointSelector: {}
        egress:
        - toEntities:
          - cluster
          - kube-apiserver
        - toFQDNs:
          - matchName: '{{ postal_submission_hostname }}'
          toPorts:
          - ports:
            - port: '587'
              protocol: TCP
        ingress:
        - fromEntities:
          - cluster

- name: Include alerting (VMAlertmanager + VMAlert + VMRules + routing)
  ansible.builtin.import_tasks: alerting.yml
  tags: [alerting]

- name: Include Coroot (auto-discovering application observability)
  ansible.builtin.import_tasks: coroot.yml
  when: coroot_enabled | bool
  tags: [coroot]

- name: Include distributed tracing collector and selected backend
  ansible.builtin.import_tasks: tracing.yml

- name: Include observability health checks
  ansible.builtin.import_tasks: health_checks.yml
