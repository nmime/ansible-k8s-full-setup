- name: Set observability tier-specific variables
  set_fact:
    monitoring_namespace: monitoring
    vm_operator_version: 0.59.3
    loki_chart_version: 6.55.0
    grafana_chart_version: 10.5.15
    grafana_domain: grafana.{{ domain }}
    vm_retention: '{{ metrics_retention | default(''30d'') }}'
    vm_storage_size: '{{ metrics_storage | default(''50Gi'') }}'
    loki_retention: '{{ logging_retention | default(''14d'') }}'
    vm_replicas: '{{ (2 if tier in [''medium'', ''production''] else 1) | int }}'
    grafana_replicas: '{{ 2 if tier == ''production'' else 1 }}'
- name: Create monitoring namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: monitoring
        labels:
          app.kubernetes.io/part-of: observability
          pod-security.kubernetes.io/enforce: baseline
          pod-security.kubernetes.io/warn: restricted
  register: _r_create_monitoring_namespace
  retries: 3
  delay: 10
  until: _r_create_monitoring_namespace is not failed
- name: Add VictoriaMetrics Helm repository
  kubernetes.core.helm_repository:
    name: vm
    repo_url: https://victoriametrics.github.io/helm-charts/
  register: _r_add_victoriametrics_helm_repository
  retries: 3
  delay: 10
  until: _r_add_victoriametrics_helm_repository is not failed
- name: Install VictoriaMetrics Operator
  kubernetes.core.helm:
    name: vm-operator
    chart_ref: vm/victoria-metrics-operator
    chart_version: '{{ vm_operator_version }}'
    release_namespace: '{{ monitoring_namespace }}'
    create_namespace: true
    release_state: present
    wait: true
    timeout: 2m0s
    values:
      operator:
        enable_converter_ownership: true
  register: _r_install_victoriametrics_operator
  retries: 3
  delay: 10
  until: _r_install_victoriametrics_operator is not failed
- name: Wait for VictoriaMetrics Operator webhook to be ready
  kubernetes.core.k8s_info:
    api_version: admissionregistration.k8s.io/v1
    kind: ValidatingWebhookConfiguration
    name: vm-operator-victoria-metrics-operator-admission
  register: _r_vm_webhook
  retries: 30
  delay: 10
  failed_when: false
  until:
  - _r_vm_webhook.resources | length > 0
  - _r_vm_webhook.resources[0].webhooks | default([]) | length > 0
- name: Wait for VictoriaMetrics Operator pod to be fully ready
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: '{{ monitoring_namespace }}'
    label_selectors:
    - app.kubernetes.io/name=victoria-metrics-operator
  register: _r_vm_operator_pod
  retries: 30
  delay: 10
  until:
  - _r_vm_operator_pod.resources | length > 0
  - _r_vm_operator_pod.resources[0].status.containerStatuses is defined
  - _r_vm_operator_pod.resources[0].status.containerStatuses | selectattr('ready', 'equalto', true) | list | length == _r_vm_operator_pod.resources[0].status.containerStatuses | length
- name: Wait for operator webhook endpoint to be serving
  ansible.builtin.pause:
    seconds: 15
- name: Deploy VMCluster (distributed mode)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: operator.victoriametrics.com/v1beta1
      kind: VMCluster
      metadata:
        name: vmcluster
        namespace: '{{ monitoring_namespace }}'
      spec:
        retentionPeriod: '{{ vm_retention }}'
        replicationFactor: '{{ (2 if tier in [''medium'', ''production''] else 1) | int }}'
        vmstorage:
          replicaCount: '{{ vm_replicas | int }}'
          storage:
            volumeClaimTemplate:
              spec:
                storageClassName: '{{ storage_class | default(''hcloud-volumes'') }}'
                resources:
                  requests:
                    storage: '{{ vm_storage_size }}'
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 2Gi
        vmselect:
          replicaCount: '{{ vm_replicas | int }}'
          cacheMountPath: /cache
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 1Gi
        vminsert:
          replicaCount: '{{ vm_replicas | int }}'
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
  when: tier in ['medium', 'production']
  register: _r_deploy_vmcluster_distributed_mode
  retries: 10
  delay: 30
  until: _r_deploy_vmcluster_distributed_mode is not failed
- name: Deploy VMSingle (standalone mode for minimal/small)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: operator.victoriametrics.com/v1beta1
      kind: VMSingle
      metadata:
        name: vmsingle
        namespace: '{{ monitoring_namespace }}'
      spec:
        retentionPeriod: '{{ vm_retention }}'
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: '{{ storage_class | default(''hcloud-volumes'') }}'
              resources:
                requests:
                  storage: '{{ vm_storage_size }}'
        resources:
          requests:
            cpu: '{{ ''50m'' if tier in [''minimal'', ''small''] else ''100m'' }}'
            memory: '{{ ''128Mi'' if tier in [''minimal'', ''small''] else ''256Mi'' }}'
          limits:
            cpu: 1000m
            memory: 2Gi
  when: tier in ['minimal', 'small']
  register: _r_deploy_vmsingle_standalone_mode_for_mini
  retries: 10
  delay: 30
  until: _r_deploy_vmsingle_standalone_mode_for_mini is not failed
- name: Deploy VMAgent for scraping
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: operator.victoriametrics.com/v1beta1
      kind: VMAgent
      metadata:
        name: vmagent
        namespace: '{{ monitoring_namespace }}'
      spec:
        replicaCount: '{{ vm_replicas | int }}'
        selectAllByDefault: true
        remoteWrite:
        - url: '{{ ''http://vminsert-vmcluster.'' + monitoring_namespace + ''.svc:8480/insert/0/prometheus/api/v1/write'' if tier in [''medium'', ''production''] else ''http://vmsingle-vmsingle.'' + monitoring_namespace
            + ''.svc:8429/api/v1/write'' }}'
        resources:
          requests:
            cpu: '{{ ''25m'' if tier in [''minimal'', ''small''] else ''50m'' }}'
            memory: '{{ ''64Mi'' if tier in [''minimal'', ''small''] else ''128Mi'' }}'
          limits:
            cpu: 500m
            memory: 512Mi
  register: _r_deploy_vmagent_for_scraping
  retries: 3
  delay: 10
  until: _r_deploy_vmagent_for_scraping is not failed
- name: Add Grafana Helm repository
  kubernetes.core.helm_repository:
    name: grafana
    repo_url: https://grafana.github.io/helm-charts
  register: _r_add_grafana_helm_repository
  retries: 3
  delay: 10
  until: _r_add_grafana_helm_repository is not failed
  when: log_stack == "loki"
- name: Create Loki S3 credentials secret
  no_log: true
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: loki-s3-credentials
        namespace: '{{ monitoring_namespace }}'
      type: Opaque
      stringData:
        S3_ACCESS_KEY: '{{ object_storage_access_key }}'
        S3_SECRET_KEY: '{{ object_storage_secret_key }}'
  register: _r_create_loki_s3_credentials_secret
  retries: 3
  delay: 10
  until: _r_create_loki_s3_credentials_secret is not failed
  when: log_stack == "loki"
- name: Install Loki with Helm
  kubernetes.core.helm:
    name: loki
    chart_ref: grafana/loki
    chart_version: '{{ loki_chart_version }}'
    release_namespace: '{{ monitoring_namespace }}'
    create_namespace: true
    release_state: present
    wait: false
    timeout: 10m0s
    values:
      deploymentMode: '{{ ''SingleBinary'' if tier in [''minimal'', ''small''] else ''SimpleScalable'' }}'
      loki:
        auth_enabled: false
        commonConfig:
          replication_factor: '{{ 2 if tier in [''medium'', ''production''] else 1 }}'
        storage:
          type: s3
          s3:
            endpoint: "{{ object_storage_endpoint | default('http://seaweedfs-filer.storage.svc.cluster.local:8333') }}"
            bucketnames: loki-chunks
            access_key_id: '{{ object_storage_access_key }}'
            secret_access_key: '{{ object_storage_secret_key }}'
            s3ForcePathStyle: true
            insecure: true
          bucketNames:
            chunks: loki-chunks
            ruler: loki-ruler
            admin: loki-admin
        schemaConfig:
          configs:
          - from: '2024-01-01'
            store: tsdb
            object_store: s3
            schema: v13
            index:
              prefix: loki_index_
              period: 24h
        limits_config:
          retention_period: '{{ loki_retention }}'
          max_query_length: 721h
          max_query_parallelism: 32
      read:
        replicas: '{{ 0 if tier in [''minimal'', ''small''] else vm_replicas | int }}'
        resources:
          requests:
            cpu: '{{ ''25m'' if tier == ''minimal'' else ''50m'' }}'
            memory: '{{ ''64Mi'' if tier == ''minimal'' else ''128Mi'' }}'
          limits:
            cpu: 500m
            memory: 512Mi
      write:
        replicas: '{{ 0 if tier in [''minimal'', ''small''] else vm_replicas | int }}'
        resources:
          requests:
            cpu: '{{ ''25m'' if tier == ''minimal'' else ''50m'' }}'
            memory: '{{ ''64Mi'' if tier == ''minimal'' else ''128Mi'' }}'
          limits:
            cpu: 500m
            memory: 512Mi
        persistence:
          enabled: true
          size: '{{ ''5Gi'' if tier == ''minimal'' else ''10Gi'' }}'
          storageClass: '{{ storage_class | default(''hcloud-volumes'') }}'
      backend:
        replicas: '{{ 0 if tier in [''minimal'', ''small''] else vm_replicas | int }}'
        resources:
          requests:
            cpu: '{{ ''25m'' if tier == ''minimal'' else ''50m'' }}'
            memory: '{{ ''64Mi'' if tier == ''minimal'' else ''128Mi'' }}'
          limits:
            cpu: 500m
            memory: 512Mi
        persistence:
          enabled: true
          size: '{{ ''5Gi'' if tier == ''minimal'' else ''10Gi'' }}'
          storageClass: '{{ storage_class | default(''hcloud-volumes'') }}'
      singleBinary:
        replicas: '{{ 1 if tier in [''minimal'', ''small''] else 0 | int }}'
        resources:
          requests:
            cpu: '{{ ''25m'' if tier == ''minimal'' else ''50m'' }}'
            memory: '{{ ''64Mi'' if tier == ''minimal'' else ''128Mi'' }}'
          limits:
            cpu: 500m
            memory: 512Mi
        persistence:
          enabled: true
          size: '{{ ''5Gi'' if tier == ''minimal'' else ''10Gi'' }}'
          storageClass: '{{ storage_class | default(''hcloud-volumes'') }}'
      gateway:
        enabled: true
        replicas: 1
        nginxConfig:
          resolver: coredns.kube-system.svc.cluster.local.
      chunksCache:
        enabled: false
      resultsCache:
        enabled: false
      test:
        enabled: false
  register: _r_install_loki_with_helm
  retries: 3
  delay: 10
  until: _r_install_loki_with_helm is not failed
  when: log_stack == "loki"
- name: Install Promtail for log collection
  kubernetes.core.helm:
    name: promtail
    chart_ref: grafana/promtail
    chart_version: 6.17.1
    release_namespace: '{{ monitoring_namespace }}'
    create_namespace: true
    release_state: present
    wait: false
    values:
      config:
        clients:
        - url: http://loki-gateway.{{ monitoring_namespace }}.svc.cluster.local/loki/api/v1/push
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 200m
          memory: 256Mi
  register: _r_install_promtail_for_log_collection
  retries: 3
  delay: 10
  until: _r_install_promtail_for_log_collection is not failed
  when: log_stack == "loki"
- name: Fetch Elasticsearch credentials for Grafana datasource
  kubernetes.core.k8s_info:
    kind: Secret
    namespace: elasticsearch
    name: es-credentials
  register: _r_grafana_es_credentials
  when: log_stack != "loki"
  no_log: true
- name: Set Grafana Elasticsearch password fact
  set_fact:
    grafana_es_password: '{{ _r_grafana_es_credentials.resources[0].data.ELASTIC_PASSWORD | b64decode }}'
  when: log_stack != "loki" and _r_grafana_es_credentials.resources | default([]) | length > 0
  no_log: true
- name: Install Grafana with Helm
  kubernetes.core.helm:
    name: grafana
    chart_ref: grafana/grafana
    chart_version: '{{ grafana_chart_version }}'
    release_namespace: '{{ monitoring_namespace }}'
    create_namespace: true
    release_state: present
    wait: false
    values:
      replicas: '{{ grafana_replicas | int }}'
      adminUser: '{{ grafana_admin_user | default(''admin'') }}'
      adminPassword: '{{ grafana_admin_password }}'
      persistence:
        enabled: true
        size: 5Gi
        storageClass: '{{ storage_class | default(''hcloud-volumes'') }}'
      datasources:
        datasources.yaml:
          apiVersion: 1
          datasources:
          - name: VictoriaMetrics
            type: prometheus
            uid: victoria-metrics
            url: '{{ ''http://vmselect-vmcluster.'' + monitoring_namespace + ''.svc:8481/select/0/prometheus'' if tier in [''medium'', ''production''] else ''http://vmsingle-vmsingle.'' + monitoring_namespace
              + ''.svc:8429'' }}'
            access: proxy
            isDefault: true
            jsonData:
              timeInterval: 15s
          - name: '{{ ''Loki'' if log_stack == ''loki'' else ''Elasticsearch'' }}'
            type: '{{ ''loki'' if log_stack == ''loki'' else ''elasticsearch'' }}'
            uid: '{{ ''loki'' if log_stack == ''loki'' else ''elasticsearch'' }}'
            url: '{{ ''http://loki-gateway.'' + monitoring_namespace + ''.svc.cluster.local'' if log_stack == ''loki'' else ''https://elasticsearch.elasticsearch.svc.cluster.local:9200'' }}'
            access: proxy
            basicAuth: '{{ false if log_stack == ''loki'' else true }}'
            basicAuthUser: '{{ '''' if log_stack == ''loki'' else ''elastic'' }}'
            jsonData:
              maxLines: '{{ 1000 if log_stack == ''loki'' else omit }}'
              timeField: '{{ omit if log_stack == ''loki'' else ''@timestamp'' }}'
              esVersion: '{{ omit if log_stack == ''loki'' else ''8.0.0'' }}'
              tlsSkipVerify: '{{ omit if log_stack == ''loki'' else true }}'
            secureJsonData: '{{ omit if log_stack == ''loki'' else {''basicAuthPassword'': grafana_es_password} }}'
          - name: PMM
            type: prometheus
            uid: pmm
            url: http://pmm-server.{{ monitoring_namespace }}.svc.cluster.local/prometheus
            access: proxy
            jsonData:
              timeInterval: 5s
      dashboardProviders:
        dashboardproviders.yaml:
          apiVersion: 1
          providers:
          - name: default
            orgId: 1
            folder: ''
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/default
      dashboards:
        default:
          node-exporter:
            gnetId: 1860
            revision: 37
            datasource: VictoriaMetrics
          kubernetes-cluster:
            gnetId: 7249
            revision: 1
            datasource: VictoriaMetrics
          victoriametrics-cluster:
            gnetId: 11176
            revision: 18
            datasource: VictoriaMetrics
          loki-dashboard:
            gnetId: 13639
            revision: 2
            datasource: Loki
          cilium-dashboard:
            gnetId: 16611
            revision: 1
            datasource: VictoriaMetrics
          postgresql-dashboard:
            gnetId: 9628
            revision: 7
            datasource: VictoriaMetrics
          mongodb-dashboard:
            gnetId: 2583
            revision: 2
            datasource: VictoriaMetrics
          percona-pg-overview:
            gnetId: 12273
            revision: 5
            datasource: VictoriaMetrics
          percona-mongodb-overview:
            gnetId: 7353
            revision: 5
            datasource: VictoriaMetrics
          percona-pg-replication:
            gnetId: 12280
            revision: 2
            datasource: VictoriaMetrics
          argocd-dashboard:
            gnetId: 14584
            revision: 1
            datasource: VictoriaMetrics
      resources:
        requests:
          cpu: '{{ ''25m'' if tier in [''minimal'', ''small''] else ''50m'' }}'
          memory: '{{ ''64Mi'' if tier in [''minimal'', ''small''] else ''128Mi'' }}'
        limits:
          cpu: 500m
          memory: 512Mi
      sidecar:
        dashboards:
          enabled: true
        datasources:
          enabled: true
  register: _r_install_grafana_with_helm
  retries: 3
  delay: 10
  until: _r_install_grafana_with_helm is not failed
- name: Create Grafana Gateway API HTTPRoute (VPN-only via admin-gateway)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: grafana
        namespace: '{{ monitoring_namespace }}'
      spec:
        parentRefs:
        - name: admin-gateway
          namespace: cilium-system
          sectionName: https
        hostnames:
        - '{{ grafana_domain }}'
        rules:
        - matches:
          - path:
              type: PathPrefix
              value: /
          backendRefs:
          - name: grafana
            port: 80
  register: _r_create_grafana_gateway_api_httproute_vpn
  retries: 3
  delay: 10
  until: _r_create_grafana_gateway_api_httproute_vpn is not failed
- name: Create TLS Certificate for Grafana
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cert-manager.io/v1
      kind: Certificate
      metadata:
        name: grafana-tls
        namespace: cilium-secrets
      spec:
        secretName: grafana-tls
        issuerRef:
          name: letsencrypt-prod
          kind: ClusterIssuer
        dnsNames:
        - '{{ grafana_domain }}'
  register: _r_create_tls_certificate_for_grafana
  retries: 3
  delay: 10
  until: _r_create_tls_certificate_for_grafana is not failed
- name: Create PMM admin password secret
  no_log: true
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: pmm-secret
        namespace: '{{ monitoring_namespace }}'
      type: Opaque
      stringData:
        PMM_ADMIN_PASSWORD: '{{ grafana_admin_password }}'
  register: _r_create_pmm_admin_password_secret
  retries: 3
  delay: 10
  until: _r_create_pmm_admin_password_secret is not failed
- name: Create PMM ServiceAccount
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: pmm-server
        namespace: '{{ monitoring_namespace }}'
        labels:
          app: pmm-server
      automountServiceAccountToken: false
  register: _r_create_pmm_sa
  retries: 3
  delay: 10
  until: _r_create_pmm_sa is not failed
- name: Create PMM Server PVC
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: pmm-server-data
        namespace: '{{ monitoring_namespace }}'
      spec:
        accessModes:
        - ReadWriteOnce
        storageClassName: '{{ storage_class | default(''hcloud-volumes'') }}'
        resources:
          requests:
            storage: '{{ ''10Gi'' if tier in [''minimal'', ''small''] else ''20Gi'' }}'
  register: _r_create_pmm_server_pvc
  retries: 3
  delay: 10
  until: _r_create_pmm_server_pvc is not failed
- name: Deploy PMM Server
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: pmm-server
        namespace: '{{ monitoring_namespace }}'
        labels:
          app: pmm-server
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: pmm-server
        template:
          metadata:
            labels:
              app: pmm-server
          spec:
            securityContext:
              runAsNonRoot: false
              seccompProfile:
                type: RuntimeDefault
            serviceAccountName: pmm-server
            enableServiceLinks: false
            initContainers:
            - name: fix-perms
              image: busybox:1.36
              command:
              - sh
              - -c
              - chown -R 1000:0 /srv
              volumeMounts:
              - name: pmm-data
                mountPath: /srv
              securityContext:
                runAsUser: 0
            containers:
            - name: pmm-server
              image: percona/pmm-server:3
              ports:
              - containerPort: 8443
                name: https
              - containerPort: 8080
                name: http
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                  - ALL
              env:
              - name: DISABLE_UPDATES
                value: '1'
              - name: METRICS_RESOLUTION
                value: 5s
              - name: DISABLE_TELEMETRY
                value: '1'
              - name: PMM_ADMIN_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: pmm-secret
                    key: PMM_ADMIN_PASSWORD
              volumeMounts:
              - name: pmm-data
                mountPath: /srv
              resources:
                requests:
                  cpu: '{{ ''50m'' if tier in [''minimal'', ''small''] else ''200m'' }}'
                  memory: '{{ ''256Mi'' if tier in [''minimal'', ''small''] else ''512Mi'' }}'
                limits:
                  cpu: '2'
                  memory: 4Gi
              readinessProbe:
                httpGet:
                  path: /v1/readyz
                  port: 8080
                initialDelaySeconds: 60
                periodSeconds: 10
                timeoutSeconds: 5
              livenessProbe:
                httpGet:
                  path: /v1/readyz
                  port: 8080
                initialDelaySeconds: 300
                periodSeconds: 30
                timeoutSeconds: 5
                failureThreshold: 10
            volumes:
            - name: pmm-data
              persistentVolumeClaim:
                claimName: pmm-server-data
  register: _r_deploy_pmm_server
  retries: 3
  delay: 10
  until: _r_deploy_pmm_server is not failed
- name: Create PMM Server Service
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: pmm-server
        namespace: '{{ monitoring_namespace }}'
        labels:
          app: pmm-server
      spec:
        selector:
          app: pmm-server
        ports:
        - name: http
          port: 8080
          targetPort: 8080
        - name: https
          port: 8443
          targetPort: 8443
        - name: https-compat
          port: 443
          targetPort: 8443
  register: _r_create_pmm_server_service
  retries: 3
  delay: 10
  until: _r_create_pmm_server_service is not failed
- name: Wait for PMM Server to be ready
  kubernetes.core.k8s_info:
    kind: Deployment
    namespace: '{{ monitoring_namespace }}'
    name: pmm-server
  register: pmm_deploy
  until: 'pmm_deploy.resources | length > 0 and (pmm_deploy.resources[0].status.readyReplicas | default(0)) >= 1

    '
  retries: 30
  delay: 15
  failed_when: false
- name: Get PMM Server pod name
  shell: kubectl get pod -n {{ monitoring_namespace }} -l app=pmm-server -o jsonpath='{.items[0].metadata.name}'
  register: pmm_pod_name
  changed_when: false
  failed_when: false
- name: Generate PMM API key for database monitoring
  shell: "kubectl exec -n {{ monitoring_namespace }} {{ pmm_pod_name.stdout }} -- bash -c '\n  supervisorctl stop pmm-managed 2>/dev/null; sleep 3;\n  SA_ID=$(curl -sf -X POST -H \"Content-Type: application/json\"\
    \ \\\n    -u \"admin:{{ grafana_admin_password }}\" \\\n    http://127.0.0.1:8080/graph/api/serviceaccounts \\\n    -d \"{\\\"name\\\":\\\"percona-db-sa\\\",\\\"role\\\":\\\"Admin\\\"}\" 2>/dev/null\
    \ | python3 -c \"import sys,json;print(json.load(sys.stdin).get(\\\"id\\\",\\\"\\\"))\" 2>/dev/null);\n  if [ -z \"$SA_ID\" ]; then\n    SA_ID=$(curl -sf -u \"admin:{{ grafana_admin_password }}\" \\\
    \n      \"http://127.0.0.1:8080/graph/api/serviceaccounts/search?query=percona-db-sa\" 2>/dev/null | python3 -c \"import sys,json;sa=json.load(sys.stdin).get(\\\"serviceAccounts\\\",[]);print(sa[0][\\\
    \"id\\\"] if sa else \\\"\\\")\" 2>/dev/null);\n  fi;\n  KEY=$(curl -sf -X POST -H \"Content-Type: application/json\" \\\n    -u \"admin:{{ grafana_admin_password }}\" \\\n    \"http://127.0.0.1:8080/graph/api/serviceaccounts/${SA_ID}/tokens\"\
    \ \\\n    -d \"{\\\"name\\\":\\\"percona-db-key-{{ ansible_date_time.epoch }}\\\"}\" 2>/dev/null | python3 -c \"import sys,json;print(json.load(sys.stdin).get(\\\"key\\\",\\\"\\\"))\" 2>/dev/null);\n\
    \  supervisorctl start pmm-managed 2>/dev/null;\n  echo \"$KEY\"'\n"
  register: pmm_api_key_result
  failed_when: false
  changed_when: false
  no_log: true
  when: pmm_pod_name.stdout | default('') | length > 0
- name: Set PMM API key fact
  set_fact:
    pmm_api_key: '{{ pmm_api_key_result.stdout_lines | default([]) | last | default('''') }}'
  when: pmm_api_key_result.rc | default(1) == 0
  failed_when: false
