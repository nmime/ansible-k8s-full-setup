- name: Create VMServiceScrape for PMM Server
  when: pmm_enabled | bool
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: operator.victoriametrics.com/v1beta1
      kind: VMServiceScrape
      metadata:
        name: pmm-server
        namespace: '{{ monitoring_namespace }}'
