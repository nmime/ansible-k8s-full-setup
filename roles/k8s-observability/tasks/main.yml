  delay: 10
  until: _r_create_hetzner_token_secret is not failed
- name: Deploy Hetzner Cloud Exporter
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: hetzner-cloud-exporter
        namespace: '{{ monitoring_namespace }}'
        labels:
          app: hetzner-cloud-exporter
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: hetzner-cloud-exporter
        template:
          metadata:
            labels:
              app: hetzner-cloud-exporter
          spec:
            containers:
            - name: exporter
              image: ghcr.io/promhetznercloud/prometheus-hetzner-sd:v0.5.0
              args:
              - --hcloud.token=$(HCLOUD_TOKEN)
              - --output.format=prometheus
              env:
              - name: HCLOUD_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: hetzner-cloud-token
                    key: token
              ports:
              - containerPort: 9090
                name: metrics
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
  when: hetzner_metrics_enabled | default(true) | bool
  register: _r_deploy_hetzner_exporter
  retries: 3
  delay: 10
  until: _r_deploy_hetzner_exporter is not failed
- name: Create Hetzner Exporter Service
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: hetzner-cloud-exporter
        namespace: '{{ monitoring_namespace }}'
        labels:
          app: hetzner-cloud-exporter
      spec:
        selector:
          app: hetzner-cloud-exporter
        ports:
        - port: 9090
          targetPort: 9090
          name: metrics
  when: hetzner_metrics_enabled | default(true) | bool
  register: _r_create_hetzner_exporter_svc
  retries: 3
  delay: 10
  until: _r_create_hetzner_exporter_svc is not failed
- name: Create VMServiceScrape for Hetzner Cloud Exporter
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: operator.victoriametrics.com/v1beta1
      kind: VMServiceScrape
      metadata:
        name: hetzner-cloud-exporter
        namespace: '{{ monitoring_namespace }}'
      spec:
        selector:
          matchLabels:
            app: hetzner-cloud-exporter
        endpoints:
        - port: metrics
          interval: 60s
