- name: Deploy VMRule for alerting
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: operator.victoriametrics.com/v1beta1
      kind: VMRule
      metadata:
        name: platform-alerts
        namespace: '{{ monitoring_namespace }}'
      spec:
        groups:
        - name: kubernetes
          rules:
          - alert: KubePodCrashLooping
            expr: rate(kube_pod_container_status_restarts_total[15m]) * 60 * 5 > 0
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: Pod {{ '{{ $labels.namespace }}' }}/{{ '{{ $labels.pod }}' }} is crash looping
          - alert: KubeNodeNotReady
            expr: kube_node_status_condition{condition="Ready",status="true"} == 0
            for: 15m
            labels:
              severity: critical
            annotations:
              summary: Node {{ '{{ $labels.node }}' }} is not ready
          - alert: KubePersistentVolumeFillingUp
            expr: kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes < 0.15
            for: 1h
            labels:
              severity: warning
            annotations:
              summary: PV {{ '{{ $labels.persistentvolumeclaim }}' }} filling up (< 15% free)
          - alert: HighMemoryUsage
            expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 0.9
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: High memory usage on {{ '{{ $labels.instance }}' }}
        - name: databases
          rules:
          - alert: PostgreSQLDown
            expr: pg_up == 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: PostgreSQL instance {{ '{{ $labels.instance }}' }} is down
          - alert: PostgreSQLReplicationLag
            expr: pg_replication_lag > 30
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: PostgreSQL replication lag is {{ '{{ $value }}' }}s on {{ '{{ $labels.instance }}' }}
          - alert: PostgreSQLTooManyConnections
            expr: sum by (instance) (pg_stat_activity_count) > pg_settings_max_connections * 0.8
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: PostgreSQL connections above 80% on {{ '{{ $labels.instance }}' }}
          - alert: PostgreSQLDeadlocks
            expr: rate(pg_stat_database_deadlocks[5m]) > 0
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: PostgreSQL deadlocks detected on {{ '{{ $labels.datname }}' }}
          - alert: MongoDBDown
            expr: mongodb_up == 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: MongoDB instance {{ '{{ $labels.instance }}' }} is down
          - alert: MongoDBReplicationLag
            expr: mongodb_mongod_replset_member_replication_lag > 30
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: MongoDB replication lag is {{ '{{ $value }}' }}s on {{ '{{ $labels.instance }}' }}
          - alert: MongoDBCursorsOpen
            expr: mongodb_mongod_metrics_cursor_open{state="total"} > 10000
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: MongoDB has {{ '{{ $value }}' }} open cursors on {{ '{{ $labels.instance }}' }}
          - alert: PGBackrestBackupStale
            expr: time() - pg_backrest_backup_last_completed_time_epoch > 172800
            for: 1h
            labels:
              severity: warning
            annotations:
              summary: pgbackrest backup is older than 48h
  register: _r_deploy_vmrule_for_alerting
  retries: 3
  delay: 10
  until: _r_deploy_vmrule_for_alerting is not failed
