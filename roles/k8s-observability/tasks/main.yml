- name: Add Elastic Helm repository
  kubernetes.core.helm_repository:
    name: elastic
    repo_url: https://helm.elastic.co
  register: _r_add_elastic_helm_repository
  retries: 3
  delay: 10
  until: _r_add_elastic_helm_repository is not failed
  when: log_stack == "elk"
- name: Install Filebeat for log collection (ELK)
  kubernetes.core.helm:
    name: filebeat
    chart_ref: elastic/filebeat
    chart_version: 8.5.1
    release_namespace: '{{ monitoring_namespace }}'
    create_namespace: true
    release_state: present
    wait: false
    values:
      daemonset:
        enabled: true
        filebeatConfig:
          filebeat.yml: "filebeat.inputs:\n- type: container\n  paths:\n    - /var/log/containers/*.log\n  processors:\n  - add_kubernetes_metadata:\n      host: ${NODE_NAME}\n      matchers:\n      - logs_path:\n\
            \          logs_path: \"/var/log/containers/\"\noutput.elasticsearch:\n  hosts: [\"https://elasticsearch.elasticsearch.svc.cluster.local:9200\"]\n  username: \"elastic\"\n  password: \"${ELASTICSEARCH_PASSWORD}\"\
            \n  ssl.certificate_authorities: [\"/usr/share/filebeat/config/certs/ca.crt\"]\n  index: \"filebeat-%{[agent.version]}-%{+yyyy.MM.dd}\"\nsetup.ilm.enabled: true\nsetup.ilm.rollover_alias: \"\
            filebeat\"\nsetup.ilm.pattern: \"{now/d}-000001\"\nsetup.template.name: \"filebeat\"\nsetup.template.pattern: \"filebeat-*\"\nlogging.level: info\n"
        secretMounts:
        - name: elasticsearch-ca
          secretName: es-tls-certs
          path: /usr/share/filebeat/config/certs
        extraEnvs:
        - name: ELASTICSEARCH_PASSWORD
          valueFrom:
            secretKeyRef:
              name: es-credentials
              key: ELASTIC_PASSWORD
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
  register: _r_install_filebeat_elk
  retries: 3
  delay: 10
  until: _r_install_filebeat_elk is not failed
  when: log_stack == "elk"
- name: Add Fluent Helm repository
  kubernetes.core.helm_repository:
    name: fluent
    repo_url: https://fluent.github.io/helm-charts
  register: _r_add_fluent_helm_repository
  retries: 3
  delay: 10
  until: _r_add_fluent_helm_repository is not failed
