- name: Set observability tier-specific variables
  set_fact:
    monitoring_namespace: monitoring
    logging_agent_namespace: logging-agents
    vm_operator_version: "{{ vm_operator_version | default('0.66.2') }}"
    loki_chart_version: 6.55.0
    grafana_chart_version: 10.5.15
    grafana_domain: grafana.{{ domain }}
    vm_retention: '{{ metrics_retention | default(''30d'') }}'
    vm_storage_size: '{{ metrics_storage | default(''100Gi'') }}'
    loki_retention: '{{ logging_retention | default(''14d'') }}'
    vm_replicas: '{{ observability.metrics.replicas | default(2 if resource_tier in [''medium'', ''production''] else 1) | int }}'
    grafana_replicas: '{{ observability.grafana.replicas | default(2 if resource_tier == ''production'' else 1) }}'
    bastion_metrics_ip: >-
      {{ bastion_private_ip | default(bastion_public_ip | default('')) }}
- name: Require a persisted bastion address for host metrics
  ansible.builtin.assert:
    that:
    - bastion_metrics_ip | length > 0
    fail_msg: >-
      Bastion address is unavailable. Deploy infrastructure first so
      playbooks/{{ project_name }}-infra-facts.yml can be loaded.
- name: Create monitoring namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: monitoring
        labels:
          app.kubernetes.io/part-of: observability
          pod-security.kubernetes.io/enforce: baseline
          pod-security.kubernetes.io/warn: restricted
  register: _r_create_monitoring_namespace
  retries: 3
  delay: 10
  until: _r_create_monitoring_namespace is not failed
- name: Add VictoriaMetrics Helm repository
  kubernetes.core.helm_repository:
    name: vm
    repo_url: https://victoriametrics.github.io/helm-charts/
  register: _r_add_victoriametrics_helm_repository
  retries: 3
  delay: 10
  until: _r_add_victoriametrics_helm_repository is not failed
- name: Install VictoriaMetrics Operator
  kubernetes.core.helm:
    name: vm-operator
    chart_ref: vm/victoria-metrics-operator
    chart_version: '{{ vm_operator_version }}'
    release_namespace: '{{ monitoring_namespace }}'
    create_namespace: true
    release_state: present
    wait: true
    timeout: 2m0s
    values:
      operator:
        enable_converter_ownership: true
  register: _r_install_victoriametrics_operator
  retries: 3
  delay: 10
  until: _r_install_victoriametrics_operator is not failed
- name: Wait for VictoriaMetrics Operator webhook to be ready
  kubernetes.core.k8s_info:
    api_version: admissionregistration.k8s.io/v1
    kind: ValidatingWebhookConfiguration
    name: vm-operator-victoria-metrics-operator-admission
  register: _r_vm_webhook
  retries: 30
  delay: 10
  failed_when: false
  until:
  - _r_vm_webhook.resources | length > 0
  - _r_vm_webhook.resources[0].webhooks | default([]) | length > 0
- name: Wait for VictoriaMetrics Operator pod to be fully ready
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: '{{ monitoring_namespace }}'
    label_selectors:
    - app.kubernetes.io/name=victoria-metrics-operator
  register: _r_vm_operator_pod
  retries: 30
  delay: 10
  until:
  - _r_vm_operator_pod.resources | length > 0
  - _r_vm_operator_pod.resources[0].status.containerStatuses is defined
  - _r_vm_operator_pod.resources[0].status.containerStatuses | selectattr('ready', 'equalto', true) | list | length == _r_vm_operator_pod.resources[0].status.containerStatuses | length
- name: Wait for operator webhook endpoint to be serving
  ansible.builtin.pause:
    seconds: 15
- name: Remove legacy bastion node-exporter Endpoints object
  kubernetes.core.k8s:
    api_version: v1
    kind: Endpoints
    namespace: '{{ monitoring_namespace }}'
    name: bastion-node-exporter
    state: absent
- name: Add bastion node-exporter EndpointSlice after the Kubernetes API is ready
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: discovery.k8s.io/v1
      kind: EndpointSlice
      metadata:
        name: bastion-node-exporter
        namespace: '{{ monitoring_namespace }}'
        labels:
          app: bastion-node-exporter
          kubernetes.io/service-name: bastion-node-exporter
      addressType: IPv4
      endpoints:
      - addresses: ['{{ bastion_metrics_ip }}']
      ports:
      - name: metrics
        port: 9100
        protocol: TCP
- name: Add bastion node-exporter headless Service
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: bastion-node-exporter
        namespace: '{{ monitoring_namespace }}'
        labels:
          app: bastion-node-exporter
      spec:
        clusterIP: None
        ports:
        - name: metrics
          port: 9100
          protocol: TCP
- name: Add VMServiceScrape for bastion node-exporter
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: operator.victoriametrics.com/v1beta1
      kind: VMServiceScrape
      metadata:
        name: bastion-node-exporter
        namespace: '{{ monitoring_namespace }}'
      spec:
        selector:
          matchLabels:
            app: bastion-node-exporter
        endpoints:
        - port: metrics
          interval: 30s
- name: Deploy VMCluster (distributed mode)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: operator.victoriametrics.com/v1beta1
      kind: VMCluster
      metadata:
        name: vmcluster
        namespace: '{{ monitoring_namespace }}'
      spec:
        retentionPeriod: '{{ vm_retention }}'
        replicationFactor: '{{ (2 if resource_tier in [''medium'', ''production''] else 1) | int }}'
        vmstorage:
          replicaCount: '{{ vm_replicas | int }}'
          storage:
            volumeClaimTemplate:
              spec:
                storageClassName: '{{ storage_class | default(''hcloud-volumes'') }}'
                resources:
                  requests:
                    storage: '{{ vm_storage_size }}'
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
        vmselect:
          replicaCount: '{{ vm_replicas | int }}'
          cacheMountPath: /cache
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
        vminsert:
          replicaCount: '{{ vm_replicas | int }}'
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
  when: tier in ['medium', 'production']
  register: _r_deploy_vmcluster_distributed_mode
  retries: 10
  delay: 30
  until: _r_deploy_vmcluster_distributed_mode is not failed
- name: Deploy VMSingle (standalone mode for minimal/small)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: operator.victoriametrics.com/v1beta1
      kind: VMSingle
      metadata:
        name: vmsingle
        namespace: '{{ monitoring_namespace }}'
      spec:
        retentionPeriod: '{{ vm_retention }}'
        storage:
          storageClassName: '{{ storage_class | default(''hcloud-volumes'') }}'
          resources:
            requests:
              storage: '{{ vm_storage_size }}'
        resources:
          requests:
            cpu: '{{ ''100m'' if resource_tier in [''minimal'', ''small''] else ''200m'' }}'
            memory: '{{ ''256Mi'' if resource_tier in [''minimal'', ''small''] else ''512Mi'' }}'
          limits:
            cpu: 1000m
            memory: 2Gi
  when: tier in ['minimal', 'small']
  register: _r_deploy_vmsingle_standalone_mode_for_mini
  retries: 10
  delay: 30
  until: _r_deploy_vmsingle_standalone_mode_for_mini is not failed
- name: Deploy VMAgent for scraping
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: operator.victoriametrics.com/v1beta1
      kind: VMAgent
      metadata:
        name: vmagent
        namespace: '{{ monitoring_namespace }}'
      spec:
        replicaCount: '{{ vm_replicas | int }}'
        selectAllByDefault: true
        remoteWrite:
        - url: '{{ ''http://vminsert-vmcluster.'' + monitoring_namespace + ''.svc:8480/insert/0/prometheus/api/v1/write'' if tier in [''medium'', ''production''] else ''http://vmsingle-vmsingle.'' + monitoring_namespace
            + ''.svc:8429/api/v1/write'' }}'
        resources:
          requests:
            cpu: '{{ ''50m'' if resource_tier in [''minimal'', ''small''] else ''100m'' }}'
            memory: '{{ ''128Mi'' if resource_tier in [''minimal'', ''small''] else ''256Mi'' }}'
          limits:
            cpu: 500m
            memory: 512Mi
  register: _r_deploy_vmagent_for_scraping
  retries: 3
  delay: 10
  until: _r_deploy_vmagent_for_scraping is not failed
- name: Add Grafana Helm repository
  kubernetes.core.helm_repository:
    name: grafana
    repo_url: https://grafana.github.io/helm-charts
  register: _r_add_grafana_helm_repository
  retries: 3
  delay: 10
  until: _r_add_grafana_helm_repository is not failed
  when: log_stack in ["loki", "elk"]
- name: Create Loki S3 credentials secret
  no_log: true
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: loki-s3-credentials
        namespace: '{{ monitoring_namespace }}'
      type: Opaque
      stringData:
        S3_ACCESS_KEY: '{{ object_storage_access_key }}'
        S3_SECRET_KEY: '{{ object_storage_secret_key }}'
  register: _r_create_loki_s3_credentials_secret
  retries: 3
  delay: 10
  until: _r_create_loki_s3_credentials_secret is not failed
  when: log_stack == "loki"
- name: Install Loki with Helm
  kubernetes.core.helm:
    name: loki
    chart_ref: grafana/loki
    chart_version: '{{ loki_chart_version }}'
    release_namespace: '{{ monitoring_namespace }}'
    create_namespace: true
    release_state: present
    wait: false
    timeout: 10m0s
    values:
      deploymentMode: '{{ ''SingleBinary'' if tier in [''minimal'', ''small''] else ''SimpleScalable'' }}'
      loki:
        auth_enabled: false
        podSecurityContext:
          seccompProfile:
            type: RuntimeDefault
        commonConfig:
          replication_factor: '{{ 2 if resource_tier in [''medium'', ''production''] else 1 }}'
        storage:
          type: s3
          s3:
            endpoint: "{{ object_storage_endpoint | default('http://seaweedfs-filer.storage.svc.cluster.local:8333') }}"
            bucketnames: loki-chunks
            access_key_id: '{{ object_storage_access_key }}'
            secret_access_key: '{{ object_storage_secret_key }}'
            s3ForcePathStyle: true
            insecure: true
          bucketNames:
            chunks: loki-chunks
            ruler: loki-ruler
            admin: loki-admin
        schemaConfig:
          configs:
          - from: '2024-01-01'
            store: tsdb
            object_store: s3
            schema: v13
            index:
              prefix: loki_index_
              period: 24h
        limits_config:
          retention_period: '{{ loki_retention }}'
          max_query_length: 721h
          max_query_parallelism: 32
      read:
        replicas: '{{ 0 if tier in [''minimal'', ''small''] else vm_replicas | int }}'
        resources:
          requests:
            cpu: '{{ ''50m'' if resource_tier == ''minimal'' else ''100m'' }}'
            memory: '{{ ''128Mi'' if resource_tier == ''minimal'' else ''256Mi'' }}'
          limits:
            cpu: 500m
            memory: 512Mi
      write:
        replicas: '{{ 0 if tier in [''minimal'', ''small''] else vm_replicas | int }}'
        resources:
          requests:
            cpu: '{{ ''25m'' if resource_tier == ''minimal'' else ''50m'' }}'
            memory: '{{ ''64Mi'' if resource_tier == ''minimal'' else ''128Mi'' }}'
          limits:
            cpu: 500m
            memory: 512Mi
        persistence:
          enabled: true
          enableStatefulSetAutoDeletePVC: false
          whenDeleted: Retain
          whenScaled: Retain
          size: '{{ ''10Gi'' if resource_tier in [''minimal'', ''small''] else ''20Gi'' }}'
          storageClass: '{{ storage_class | default(''hcloud-volumes'') }}'
      backend:
        replicas: '{{ 0 if tier in [''minimal'', ''small''] else vm_replicas | int }}'
        resources:
          requests:
            cpu: '{{ ''25m'' if resource_tier == ''minimal'' else ''50m'' }}'
            memory: '{{ ''64Mi'' if resource_tier == ''minimal'' else ''128Mi'' }}'
          limits:
            cpu: 500m
            memory: 512Mi
        persistence:
          enabled: true
          enableStatefulSetAutoDeletePVC: false
          whenDeleted: Retain
          whenScaled: Retain
          size: '{{ ''10Gi'' if resource_tier in [''minimal'', ''small''] else ''20Gi'' }}'
          storageClass: '{{ storage_class | default(''hcloud-volumes'') }}'
      singleBinary:
        replicas: '{{ 1 if tier in [''minimal'', ''small''] else 0 | int }}'
        resources:
          requests:
            cpu: '{{ ''25m'' if resource_tier == ''minimal'' else ''50m'' }}'
            memory: '{{ ''64Mi'' if resource_tier == ''minimal'' else ''128Mi'' }}'
          limits:
            cpu: 500m
            memory: 512Mi
        persistence:
          enabled: true
          enableStatefulSetAutoDeletePVC: false
          whenDeleted: Retain
          whenScaled: Retain
          size: '{{ ''10Gi'' if resource_tier in [''minimal'', ''small''] else ''20Gi'' }}'
          storageClass: '{{ storage_class | default(''hcloud-volumes'') }}'
      gateway:
        enabled: true
        replicas: 1
        podSecurityContext:
          seccompProfile:
            type: RuntimeDefault
        nginxConfig:
          resolver: coredns.kube-system.svc.cluster.local.
      lokiCanary:
        podSecurityContext:
          seccompProfile:
            type: RuntimeDefault
      chunksCache:
        enabled: false
      resultsCache:
        enabled: false
      test:
        enabled: false
  register: _r_install_loki_with_helm
  retries: 3
  delay: 10
  until: _r_install_loki_with_helm is not failed
  when: log_stack == "loki"
- name: Remove legacy Promtail release from the baseline monitoring namespace
  kubernetes.core.helm:
    name: promtail
    release_namespace: '{{ monitoring_namespace }}'
    release_state: absent
    wait: true
  when: log_stack in ["loki", "elk"]
- name: Remove Promtail node agents when Loki is not the selected log backend
  kubernetes.core.helm:
    name: promtail
    release_namespace: '{{ logging_agent_namespace }}'
    release_state: absent
    wait: true
  when: log_stack != "loki"
- name: Create isolated privileged namespace for node log agents
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: '{{ logging_agent_namespace }}'
        labels:
          app.kubernetes.io/part-of: observability
          pod-security.kubernetes.io/enforce: privileged
          pod-security.kubernetes.io/audit: restricted
          pod-security.kubernetes.io/warn: restricted
  when: log_stack in ["loki", "elk"]
- name: Install Promtail for log collection
  kubernetes.core.helm:
    name: promtail
    chart_ref: grafana/promtail
    chart_version: 6.17.1
    release_namespace: '{{ logging_agent_namespace }}'
    create_namespace: true
    release_state: present
    wait: false
    values:
      config:
        clients:
        - url: http://loki-gateway.{{ monitoring_namespace }}.svc.cluster.local/loki/api/v1/push
        snippets:
          pipelineStages: >-
            {{
              [
                {'cri': {}},
                {'replace': {'expression': '\\b\\d{3}-\\d{2}-\\d{4}\\b', 'replace': 'XXX-XX-XXXX'}},
                {'replace': {'expression': '\\(\\d{3}\\)\\s*\\d{3}-\\d{4}', 'replace': '(XXX) XXX-XXXX'}},
                {'replace': {'expression': '\\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}\\b', 'replace': '[REDACTED_EMAIL]'}}
              ]
              if log_redaction_enabled | bool else [{'cri': {}}]
            }}
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 256Mi
  register: _r_install_promtail_for_log_collection
  retries: 3
  delay: 10
  until: _r_install_promtail_for_log_collection is not failed
  when: log_stack == "loki"
- name: Remove legacy invalid Cilium default-deny for logging agents
  kubernetes.core.k8s:
    state: absent
    definition:
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: default-deny
        namespace: '{{ logging_agent_namespace }}'
  when: log_stack in ["loki", "elk"]
- name: Create default-deny NetworkPolicy for logging agents
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: default-deny
        namespace: '{{ logging_agent_namespace }}'
      spec:
        podSelector: {}
        policyTypes:
        - Ingress
        - Egress
        ingress: []
        egress: []
  when: log_stack in ["loki", "elk"]
- name: Allow logging agents to reach the selected backend and Kubernetes discovery
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: allow-logging-egress
        namespace: '{{ logging_agent_namespace }}'
      spec:
        endpointSelector: {}
        egress:
        - toEntities:
          - cluster
          - kube-apiserver
  when: log_stack in ["loki", "elk"]
- name: Fetch Elasticsearch credentials for Grafana datasource
  kubernetes.core.k8s_info:
    kind: Secret
    namespace: elasticsearch
    name: es-credentials
  register: _r_grafana_es_credentials
  when: log_stack != "loki"
  no_log: true
- name: Set Grafana Elasticsearch password fact
  set_fact:
    grafana_es_password: '{{ _r_grafana_es_credentials.resources[0].data.ELASTIC_PASSWORD | b64decode }}'
  when: log_stack != "loki" and _r_grafana_es_credentials.resources | default([]) | length > 0
  no_log: true
- name: Install Grafana with Helm
  kubernetes.core.helm:
    name: grafana
    chart_ref: grafana/grafana
    chart_version: '{{ grafana_chart_version }}'
    release_namespace: '{{ monitoring_namespace }}'
    create_namespace: true
    release_state: present
    wait: false
    values:
      replicas: '{{ grafana_replicas | int }}'
      # The bundled persistence is a single RWO volume backed by SQLite. A
      # surge rollout deadlocks on multi-attach; replace the singleton cleanly.
      deploymentStrategy:
        type: Recreate
      adminUser: '{{ grafana_admin_user | default(''admin'') }}'
      adminPassword: '{{ grafana_admin_password }}'
      persistence:
        enabled: true
        size: 10Gi
        storageClass: '{{ storage_class | default(''hcloud-volumes'') }}'
      datasources:
        datasources.yaml:
          apiVersion: 1
          deleteDatasources: '{{ [] if (pmm_enabled | bool) else [{"name": "PMM", "orgId": 1}] }}'
          datasources: >-
            {{
              [{
                'name': 'VictoriaMetrics',
                'type': 'prometheus',
                'uid': 'victoria-metrics',
                'url': ('http://vmselect-vmcluster.' ~ monitoring_namespace ~ '.svc:8481/select/0/prometheus')
                  if tier in ['medium', 'production']
                  else ('http://vmsingle-vmsingle.' ~ monitoring_namespace ~ '.svc:8429'),
                'access': 'proxy',
                'isDefault': true,
                'jsonData': {'timeInterval': '15s'}
              }]
              + ([{
                'name': 'Loki',
                'type': 'loki',
                'uid': 'loki',
                'url': 'http://loki-gateway.' ~ monitoring_namespace ~ '.svc.cluster.local',
                'access': 'proxy',
                'basicAuth': false,
                'jsonData': {'maxLines': 1000}
              }] if log_stack == 'loki' else [{
                'name': 'Elasticsearch',
                'type': 'elasticsearch',
                'uid': 'elasticsearch',
                'url': 'https://elasticsearch.elasticsearch.svc.cluster.local:9200',
                'access': 'proxy',
                'basicAuth': true,
                'basicAuthUser': 'elastic',
                'jsonData': {'timeField': '@timestamp', 'esVersion': '8.0.0', 'tlsSkipVerify': true},
                'secureJsonData': {'basicAuthPassword': grafana_es_password}
              }])
              + ([{
                'name': 'PMM',
                'type': 'prometheus',
                'uid': 'pmm',
                'url': 'http://pmm-server.' ~ monitoring_namespace ~ '.svc.cluster.local/prometheus',
                'access': 'proxy',
                'jsonData': {'timeInterval': '5s'}
              }] if (pmm_enabled | bool) else [])
            }}
      dashboardProviders:
        dashboardproviders.yaml:
          apiVersion: 1
          providers:
          - name: default
            orgId: 1
            folder: ''
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/default
      dashboards:
        default:
          node-exporter:
            gnetId: 1860
            revision: 37
            datasource: VictoriaMetrics
          kubernetes-cluster:
            gnetId: 7249
            revision: 1
            datasource: VictoriaMetrics
          victoriametrics-cluster:
            gnetId: 11176
            revision: 18
            datasource: VictoriaMetrics
          loki-dashboard:
            gnetId: 13639
            revision: 2
            datasource: Loki
          cilium-dashboard:
            gnetId: 16611
            revision: 1
            datasource: VictoriaMetrics
          postgresql-dashboard:
            gnetId: 9628
            revision: 7
            datasource: VictoriaMetrics
          mongodb-dashboard:
            gnetId: 2583
            revision: 2
            datasource: VictoriaMetrics
          percona-pg-overview:
            gnetId: 12273
            revision: 5
            datasource: VictoriaMetrics
          percona-mongodb-overview:
            gnetId: 7353
            revision: 5
            datasource: VictoriaMetrics
          percona-pg-replication:
            gnetId: 12280
            revision: 2
            datasource: VictoriaMetrics
          argocd-dashboard:
            gnetId: 14584
            revision: 1
            datasource: VictoriaMetrics
      resources:
        requests:
          cpu: '{{ ''25m'' if resource_tier in [''minimal'', ''small''] else ''50m'' }}'
          memory: '{{ ''64Mi'' if resource_tier in [''minimal'', ''small''] else ''128Mi'' }}'
        limits:
          cpu: 500m
          memory: 512Mi
      sidecar:
        dashboards:
          enabled: true
        datasources:
          enabled: true
  register: _r_install_grafana_with_helm
  retries: 3
  delay: 10
  until: _r_install_grafana_with_helm is not failed
- name: Create Grafana Gateway API HTTPRoute (VPN-only via admin-gateway)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: grafana
        namespace: '{{ monitoring_namespace }}'
      spec:
        parentRefs:
        - name: admin-gateway
          namespace: cilium-system
          sectionName: https
        hostnames:
        - '{{ grafana_domain }}'
        rules:
        - matches:
          - path:
              type: PathPrefix
              value: /
          backendRefs:
          - name: grafana
            port: 80
  register: _r_create_grafana_gateway_api_httproute_vpn
  retries: 3
  delay: 10
  until: _r_create_grafana_gateway_api_httproute_vpn is not failed
- name: Create TLS Certificate for Grafana
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cert-manager.io/v1
      kind: Certificate
      metadata:
        name: grafana-tls
        namespace: cilium-secrets
      spec:
        secretName: grafana-tls
        issuerRef:
          name: '{{ cert_manager_cluster_issuer }}'
          kind: ClusterIssuer
        dnsNames:
        - '{{ grafana_domain }}'
  register: _r_create_tls_certificate_for_grafana
  retries: 3
  delay: 10
  until: _r_create_tls_certificate_for_grafana is not failed
- name: Create PMM admin password secret
  when: pmm_enabled | bool
  no_log: true
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: pmm-secret
        namespace: '{{ monitoring_namespace }}'
      type: Opaque
      stringData:
        PMM_ADMIN_PASSWORD: '{{ grafana_admin_password }}'
  register: _r_create_pmm_admin_password_secret
  retries: 3
  delay: 10
  until: _r_create_pmm_admin_password_secret is not failed
- name: Create PMM ServiceAccount
  when: pmm_enabled | bool
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: pmm-server
        namespace: '{{ monitoring_namespace }}'
        labels:
          app: pmm-server
      automountServiceAccountToken: false
  register: _r_create_pmm_sa
  retries: 3
  delay: 10
  until: _r_create_pmm_sa is not failed
- name: Create PMM Server PVC
  when: pmm_enabled | bool
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: pmm-server-data
        namespace: '{{ monitoring_namespace }}'
      spec:
        accessModes:
        - ReadWriteOnce
        storageClassName: '{{ storage_class | default(''hcloud-volumes'') }}'
        resources:
          requests:
            storage: '{{ pmm_storage_size }}'
  register: _r_create_pmm_server_pvc
  retries: 3
  delay: 10
  until: _r_create_pmm_server_pvc is not failed
- name: Read existing PMM Deployment before security-context reconciliation
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    namespace: '{{ monitoring_namespace }}'
    name: pmm-server
  register: _pmm_existing_deployment
  when: pmm_enabled | bool
- name: Remove the legacy privileged PMM permission init container
  kubernetes.core.k8s_json_patch:
    api_version: apps/v1
    kind: Deployment
    namespace: '{{ monitoring_namespace }}'
    name: pmm-server
    patch:
      - op: remove
        path: /spec/template/spec/initContainers
  when:
    - pmm_enabled | bool
    - (_pmm_existing_deployment.resources | default([])) | length == 1
    - _pmm_existing_deployment.resources[0].spec.template.spec.initContainers | default([]) | length > 0
- name: Deploy PMM Server
  when: pmm_enabled | bool
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: pmm-server
        namespace: '{{ monitoring_namespace }}'
        labels:
          app: pmm-server
      spec:
        replicas: 1
        # The single PMM instance mounts a ReadWriteOnce Hetzner volume. A
        # rolling update deadlocks on multi-attach, so release the old pod first.
        strategy:
          type: Recreate
        selector:
          matchLabels:
            app: pmm-server
        template:
          metadata:
            labels:
              app: pmm-server
          spec:
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
              fsGroup: 1000
              fsGroupChangePolicy: OnRootMismatch
              seccompProfile:
                type: RuntimeDefault
            serviceAccountName: pmm-server
            enableServiceLinks: false
            containers:
            - name: pmm-server
              image: percona/pmm-server:{{ pmm_server_version }}
              ports:
              - containerPort: 8443
                name: https
              - containerPort: 8080
                name: http
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                  - ALL
              env:
              - name: PMM_ENABLE_UPDATES
                value: 'false'
              - name: PMM_METRICS_RESOLUTION
                value: 5s
              - name: PMM_ENABLE_TELEMETRY
                value: 'false'
              - name: PMM_ADMIN_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: pmm-secret
                    key: PMM_ADMIN_PASSWORD
              volumeMounts:
              - name: pmm-data
                mountPath: /srv
              resources:
                requests:
                  cpu: '{{ ''50m'' if resource_tier in [''minimal'', ''small''] else ''200m'' }}'
                  memory: '{{ ''256Mi'' if resource_tier in [''minimal'', ''small''] else ''512Mi'' }}'
                limits:
                  cpu: '2'
                  memory: 4Gi
              readinessProbe:
                httpGet:
                  path: /v1/readyz
                  port: 8080
                initialDelaySeconds: 60
                periodSeconds: 10
                timeoutSeconds: 5
              livenessProbe:
                httpGet:
                  path: /v1/readyz
                  port: 8080
                initialDelaySeconds: 300
                periodSeconds: 30
                timeoutSeconds: 5
                failureThreshold: 10
            volumes:
            - name: pmm-data
              persistentVolumeClaim:
                claimName: pmm-server-data
  register: _r_deploy_pmm_server
  retries: 3
  delay: 10
  until: _r_deploy_pmm_server is not failed
- name: Create PMM Server Service
  when: pmm_enabled | bool
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: pmm-server
        namespace: '{{ monitoring_namespace }}'
        labels:
          app: pmm-server
      spec:
        selector:
          app: pmm-server
        ports:
        - name: http
          port: 8080
          targetPort: 8080
        - name: https
          port: 8443
          targetPort: 8443
        - name: https-compat
          port: 443
          targetPort: 8443
  register: _r_create_pmm_server_service
  retries: 3
  delay: 10
  until: _r_create_pmm_server_service is not failed
- name: Wait for PMM Server to be ready
  when: pmm_enabled | bool
  kubernetes.core.k8s_info:
    kind: Deployment
    namespace: '{{ monitoring_namespace }}'
    name: pmm-server
  register: pmm_deploy
  until: '(pmm_deploy.resources | default([])) | length > 0 and (pmm_deploy.resources[0].status.readyReplicas | default(0)) >= 1

    '
  retries: 30
  delay: 15
- name: Get PMM Server pod name
  when: pmm_enabled | bool
  shell: kubectl get pod -n {{ monitoring_namespace }} -l app=pmm-server -o jsonpath='{.items[0].metadata.name}'
  register: pmm_pod_name
  changed_when: false
  retries: 30
  delay: 5
  until: pmm_pod_name.stdout | default('') | length > 0
- name: Issue a validated PMM 3 service-account token
  shell: |
    kubectl exec -i -n {{ monitoring_namespace }} {{ pmm_pod_name.stdout }} -- bash <<'PMM_TOKEN_SCRIPT'
    set -euo pipefail
    COOKIE_FILE=$(mktemp)
    trap 'rm -f "$COOKIE_FILE"' EXIT

    # PMM only applies PMM_ADMIN_PASSWORD on first boot. Reconcile the
    # persisted Grafana database before using its authenticated API.
    grafana cli --homepath /usr/share/grafana \
      --config /etc/grafana/grafana.ini \
      admin reset-admin-password "$PMM_ADMIN_PASSWORD" >/dev/null 2>&1

    LOGIN_JSON=$(python3 -c 'import json,os; print(json.dumps({"user":"admin","password":os.environ["PMM_ADMIN_PASSWORD"]}))')
    curl -sf -c "$COOKIE_FILE" -H 'Content-Type: application/json' \
      --data-binary "$LOGIN_JSON" \
      http://127.0.0.1:3000/graph/login >/dev/null

    SA_ID=$(curl -sf -b "$COOKIE_FILE" \
      'http://127.0.0.1:3000/graph/api/serviceaccounts/search?query=percona-db-sa' \
      | python3 -c 'import json,sys; accounts=json.load(sys.stdin).get("serviceAccounts",[]); print(accounts[0]["id"] if accounts else "")')
    if [ -z "$SA_ID" ]; then
      SA_ID=$(curl -sf -X POST -b "$COOKIE_FILE" \
        -H 'Content-Type: application/json' \
        -d '{"name":"percona-db-sa","role":"Admin"}' \
        http://127.0.0.1:3000/graph/api/serviceaccounts \
        | python3 -c 'import json,sys; print(json.load(sys.stdin).get("id",""))')
    fi

    KEY=$(curl -sf -X POST -b "$COOKIE_FILE" \
      -H 'Content-Type: application/json' \
      -d "{\"name\":\"percona-db-key-$(date +%s%N)\"}" \
      "http://127.0.0.1:3000/graph/api/serviceaccounts/${SA_ID}/tokens" \
      | python3 -c 'import json,sys; print(json.load(sys.stdin).get("key",""))')
    case "$KEY" in
      glsa_*) ;;
      *) exit 1 ;;
    esac
    printf '%s\n' "$KEY"
    PMM_TOKEN_SCRIPT
  register: pmm_server_token_result
  retries: 12
  delay: 10
  until: >-
    pmm_server_token_result.rc == 0 and
    (pmm_server_token_result.stdout_lines | default([]) | last | default('')).startswith('glsa_')
  failed_when: >-
    pmm_server_token_result.rc != 0 or
    not (pmm_server_token_result.stdout_lines | default([]) | last | default('')).startswith('glsa_')
  changed_when: false
  no_log: true
  when:
    - pmm_enabled | bool
    - pmm_pod_name.stdout | default('') | length > 0
- name: Set PMM service-account token fact
  set_fact:
    pmm_server_token: '{{ pmm_server_token_result.stdout_lines | default([]) | last | default('''') }}'
  no_log: true
  when:
    - pmm_enabled | bool
    - pmm_server_token_result.rc | default(1) == 0
- name: Require a non-empty PMM service-account token for database monitoring
  ansible.builtin.assert:
    that:
      - pmm_server_token | default('') | length > 0
    fail_msg: PMM did not issue a database-monitoring service-account token.
  no_log: true
  when: pmm_enabled | bool
- name: Persist the PMM service-account token for component-only reconciliations
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: pmm-client-credentials
        namespace: '{{ monitoring_namespace }}'
      type: Opaque
      stringData:
        PMM_SERVER_TOKEN: '{{ pmm_server_token }}'
  no_log: true
  when: pmm_enabled | bool
- name: Create PMM HTTPRoute (VPN-only via admin-gateway)
  when: pmm_enabled | bool
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: pmm
        namespace: '{{ monitoring_namespace }}'
      spec:
        parentRefs:
        - name: admin-gateway
          namespace: cilium-system
          sectionName: https
        hostnames:
        - pmm.{{ domain }}
        rules:
        - matches:
          - path:
              type: PathPrefix
              value: /
          backendRefs:
          - name: pmm-server
            port: 8080
  register: _r_create_pmm_httproute_vpn_only_via_admin_
  retries: 3
  delay: 10
  until: _r_create_pmm_httproute_vpn_only_via_admin_ is not failed
- name: Create TLS Certificate for PMM
  when: pmm_enabled | bool
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cert-manager.io/v1
      kind: Certificate
      metadata:
        name: pmm-tls
        namespace: cilium-secrets
      spec:
        secretName: pmm-tls
        issuerRef:
          name: '{{ cert_manager_cluster_issuer }}'
          kind: ClusterIssuer
        dnsNames:
        - pmm.{{ domain }}
  register: _r_create_tls_certificate_for_pmm
  retries: 3
  delay: 10
  until: _r_create_tls_certificate_for_pmm is not failed
- name: Create VMServiceScrape for PostgreSQL exporter
  kubernetes.core.k8s:
    state: '{{ "present" if (platform_postgresql_enabled | default(true) | bool) else "absent" }}'
    definition:
      apiVersion: operator.victoriametrics.com/v1beta1
      kind: VMServiceScrape
