    chart_ref: open-telemetry/opentelemetry-collector
    chart_version: 0.83.0
    release_namespace: '{{ monitoring_namespace }}'
    create_namespace: true
    release_state: present
    wait: false
    values:
      mode: daemonset
      config:
        receivers:
          otlp:
            protocols:
              grpc:
                endpoint: 0.0.0.0:4317
              http:
                endpoint: 0.0.0.0:4318
          jaeger:
            protocols:
              grpc:
                endpoint: 0.0.0.0:14250
              thrift_http:
                endpoint: 0.0.0.0:14268
        processors:
          batch:
            timeout: 5s
          memory_limiter:
            check_interval: 1s
            limit_mib: 256
        exporters:
          otlp:
            endpoint: tempo-distributor.{{ monitoring_namespace }}.svc.cluster.local:4317
            tls:
              insecure: true
        service:
          pipelines:
            traces:
              receivers:
              - otlp
              - jaeger
              processors:
              - memory_limiter
              - batch
              exporters:
              - otlp
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 250m
          memory: 256Mi
  when: otel_collector_enabled | default(false) | bool
  register: _r_install_otel_collector
  retries: 3
  delay: 10
  until: _r_install_otel_collector is not failed
- name: Add Tempo datasource to Grafana
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: grafana-tempo-datasource
        namespace: '{{ monitoring_namespace }}'
        labels:
          grafana_datasource: '1'
      data:
        tempo-datasource.yaml: "apiVersion: 1\ndatasources:\n  - name: Tempo\n    type: tempo\n    uid: tempo\n    url: http://tempo-query-frontend.{{ monitoring_namespace }}.svc.cluster.local:3100\n  \
          \  access: proxy\n    editable: false\n    jsonData:\n      httpMethod: GET\n      serviceMap:\n        datasourceUid: prometheus\n      nodeGraph:\n        enabled: true\n      search:\n    \
          \    hide: false\n      lokiSearch:\n        datasourceUid: \"{{ 'loki' if log_stack == 'loki' else 'elasticsearch' }}\"\n"
  when: tracing_enabled | default(false) | bool
  register: _r_add_tempo_grafana_datasource
  retries: 3
  delay: 10
  until: _r_add_tempo_grafana_datasource is not failed
- name: Deploy ServiceMonitors for platform services
  kubernetes.core.k8s:
    state: present
    src: '{{ playbook_dir }}/../roles/k8s-observability/templates/servicemonitors.yml'
  ignore_errors: true
- name: Deploy cert-manager alert (cert expiry warning)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: monitoring.coreos.com/v1
      kind: PrometheusRule
      metadata:
        name: cert-expiry-alerts
        namespace: '{{ monitoring_namespace | default(''monitoring'') }}'
      spec:
        groups:
        - name: cert-manager
          rules:
          - alert: CertificateExpiringSoon
            expr: certmanager_certificate_expiration_timestamp_seconds - time() < 7 * 24 * 3600
            for: 1h
            labels:
                severity: warning
            annotations:
                summary: Certificate {{ $labels.name }} expires in < 7 days
                description: Namespace {{ $labels.namespace }}, cert {{ $labels.name }}
          - alert: CertificateExpiryCritical
            expr: certmanager_certificate_expiration_timestamp_seconds - time() < 24 * 3600
            for: 10m
            labels:
                severity: critical
            annotations:
                summary: Certificate {{ $labels.name }} expires in < 24 hours!
                description: Immediate action needed. Namespace {{ $labels.namespace }}
          - alert: CertificateRenewalFailed
            expr: certmanager_certificate_ready_status{condition="False"} == 1
            for: 30m
            labels:
                severity: critical
            annotations:
                summary: Certificate {{ $labels.name }} renewal FAILED
                description: cert-manager cannot renew {{ $labels.name }} in {{ $labels.namespace }}
- name: Create default-deny for monitoring namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: default-deny
        namespace: '{{ monitoring_namespace | default(''monitoring'') }}'
      spec:
        endpointSelector: {}
- name: Allow Grafana ingress from gateway
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: allow-grafana-ingress
        namespace: '{{ monitoring_namespace | default(''monitoring'') }}'
      spec:
        endpointSelector:
          matchLabels:
            app.kubernetes.io/name: grafana
        ingress:
        - fromEntities:
          - cluster
          toPorts:
          - ports:
            - port: '3000'
              protocol: TCP
- name: Allow monitoring scrape (VMAgent/Promtail collect from all namespaces)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: allow-monitoring-egress
        namespace: '{{ monitoring_namespace | default(''monitoring'') }}'
      spec:
        endpointSelector: {}
        egress:
        - toEntities:
          - cluster
          - kube-apiserver
        ingress:
        - fromEntities:
          - cluster

- name: Include alerting (VMAlertmanager + VMAlert + VMRules + routing)
  ansible.builtin.import_tasks: alerting.yml
