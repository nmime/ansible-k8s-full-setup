---
# Tempo + OpenTelemetry Collector deployment
# Gated by tracing_enabled (default true for medium/production)

- name: Set tracing tier-specific variables
  set_fact:
    tempo_namespace: '{{ monitoring_namespace }}'
    tempo_chart_version: '1.6.1'
    tempo_image_tag: '2.6.1'
    otel_collector_chart_version: '0.102.1'
    otel_collector_image_tag: '0.112.0'

- name: Add Grafana Helm repository for Tempo
  kubernetes.core.helm_repository:
    name: grafana
    repo_url: 'https://grafana.github.io/helm-charts'
  register: _r_add_grafana_helm_repo_for_tempo
  retries: 3
  delay: 10
  until: _r_add_grafana_helm_repo_for_tempo is not failed
  when: tracing_enabled | bool

- name: Add OpenTelemetry Helm repository
  kubernetes.core.helm_repository:
    name: open-telemetry
    repo_url: 'https://open-telemetry.github.io/opentelemetry-helm-charts'
  register: _r_add_otel_helm_repo
  retries: 3
  delay: 10
  until: _r_add_otel_helm_repo is not failed
  when: tracing_enabled | bool

- name: Create Tempo S3 credentials secret
  no_log: true
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: tempo-s3-credentials
        namespace: '{{ tempo_namespace }}'
      type: Opaque
      stringData:
        S3_ACCESS_KEY: '{{ object_storage_access_key }}'
        S3_SECRET_KEY: '{{ object_storage_secret_key }}'
  register: _r_create_tempo_s3_credentials_secret
  retries: 3
  delay: 10
  until: _r_create_tempo_s3_credentials_secret is not failed
  when: tracing_enabled | bool

- name: Ensure the Tempo object-storage bucket exists
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: create-tempo-bucket
        namespace: storage
      spec:
        ttlSecondsAfterFinished: 300
        template:
          spec:
            restartPolicy: OnFailure
            containers:
              - name: aws-cli
                image: "{{ object_storage_aws_cli_image | default('amazon/aws-cli:2.34.48') }}"
                command:
                  - sh
                  - -c
                  - >-
                    if ! aws --endpoint-url {{ object_storage_endpoint }}
                    s3api head-bucket --bucket tempo-traces >/dev/null 2>&1;
                    then aws --endpoint-url {{ object_storage_endpoint }}
                    s3api create-bucket --bucket tempo-traces; fi
                env:
                  - name: AWS_ACCESS_KEY_ID
                    valueFrom:
                      secretKeyRef:
                        name: seaweedfs-s3-config
                        key: AWS_ACCESS_KEY_ID
                  - name: AWS_SECRET_ACCESS_KEY
                    valueFrom:
                      secretKeyRef:
                        name: seaweedfs-s3-config
                        key: AWS_SECRET_ACCESS_KEY
                  - name: AWS_DEFAULT_REGION
                    value: us-east-1
                  - name: AWS_EC2_METADATA_DISABLED
                    value: "true"
  register: _r_ensure_tempo_bucket
  retries: 3
  delay: 10
  until: _r_ensure_tempo_bucket is not failed
  when: tracing_enabled | bool

- name: Reconcile Tempo StatefulSet storage growth without replacing claims
  ansible.builtin.include_tasks: ../../../playbooks/tasks/reconcile_statefulset_storage.yml
  vars:
    storage_reconcile_namespace: '{{ tempo_namespace }}'
    storage_reconcile_statefulset: tempo
    storage_reconcile_claim: storage
    storage_reconcile_desired: '{{ tempo_storage_size }}'
  when: tracing_enabled | bool

- name: Deploy Tempo with Helm
  kubernetes.core.helm:
    name: tempo
    chart_ref: grafana/tempo
    chart_version: '{{ tempo_chart_version }}'
    release_namespace: '{{ tempo_namespace }}'
    create_namespace: true
    release_state: present
    wait: true
    timeout: 10m0s
    values:
      replicas: 1
      tempo:
        tag: '{{ tempo_image_tag }}'
        multitenancyEnabled: false
        reportingEnabled: false
        retention: '{{ tempo_retention | default("24h") }}'
        extraArgs:
          config.expand-env: 'true'
        extraEnvFrom:
          - secretRef:
              name: tempo-s3-credentials
        server:
          http_listen_port: 3200
        ingester:
          trace_idle_period: 10s
          max_block_bytes: 1073741824
          max_block_duration: 5m
        storage:
          trace:
            backend: s3
            s3:
              bucket: tempo-traces
              endpoint: '{{ object_storage_endpoint | default("http://seaweedfs-filer.storage.svc.cluster.local:8333") | regex_replace("^https?://", "") }}'
              access_key: '${S3_ACCESS_KEY}'
              secret_key: '${S3_SECRET_KEY}'
              insecure: true
            wal:
              path: /var/tempo/wal
        metricsGenerator:
          enabled: true
          remoteWriteUrl: '{{ "http://vminsert-vmcluster." + monitoring_namespace + ".svc:8480/insert/0/prometheus/api/v1/write" if tier in ["medium", "production"] else "http://vmsingle-vmsingle." + monitoring_namespace + ".svc:8429/api/v1/write" }}'
        resources:
          requests:
            cpu: '{{ "100m" if resource_tier in ["minimal", "small"] else "200m" }}'
            memory: '{{ "256Mi" if resource_tier in ["minimal", "small"] else "512Mi" }}'
          limits:
            cpu: '{{ "500m" if resource_tier in ["minimal", "small"] else "1000m" }}'
            memory: '{{ "512Mi" if resource_tier in ["minimal", "small"] else "1Gi" }}'
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop: [ALL]
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      persistence:
        enabled: true
        size: '{{ tempo_storage_size | default("20Gi") }}'
        storageClassName: '{{ storage_class | default("hcloud-volumes") }}'
  register: _r_install_tempo_with_helm
  retries: 3
  delay: 10
  until: _r_install_tempo_with_helm is not failed
  when: tracing_enabled | bool

- name: Deploy OpenTelemetry Collector with Helm
  kubernetes.core.helm:
    name: otel-collector
    chart_ref: open-telemetry/opentelemetry-collector
    chart_version: '{{ otel_collector_chart_version }}'
    release_namespace: '{{ tempo_namespace }}'
    create_namespace: true
    release_state: present
    wait: true
    timeout: 10m0s
    values:
      image:
        repository: otel/opentelemetry-collector-k8s
        tag: '{{ otel_collector_image_tag }}'
      mode: deployment
      config:
        receivers:
          otlp:
            protocols:
              grpc:
                endpoint: '0.0.0.0:4317'
              http:
                endpoint: '0.0.0.0:4318'
          zipkin:
            endpoint: '0.0.0.0:9411'
          jaeger:
            protocols:
              grpc:
                endpoint: '0.0.0.0:14250'
              thrift_http:
                endpoint: '0.0.0.0:14268'
        processors:
          batch:
            timeout: 10s
            send_batch_size: 1024
          memory_limiter:
            check_interval: 5s
            limit_mib: 256
        exporters:
          otlp:
            endpoint: 'tempo.{{ tempo_namespace }}.svc.cluster.local:4317'
            tls:
              insecure: true
        service:
          pipelines:
            traces:
              receivers: [otlp, jaeger, zipkin]
              processors: [memory_limiter, batch]
              exporters: [otlp]
            metrics: null
            logs: null
          telemetry:
            metrics:
              address: '0.0.0.0:8888'
      ports:
        metrics:
          enabled: true
          containerPort: 8888
          servicePort: 8888
          protocol: TCP
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
      replicaCount: '{{ tracing.collector_replicas | default(2 if resource_tier in ["medium", "production"] else 1) | int }}'
      podSecurityContext:
        runAsNonRoot: true
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
  register: _r_install_otel_collector_with_helm
  retries: 3
  delay: 10
  until: _r_install_otel_collector_with_helm is not failed
  when: tracing_enabled | bool

- name: Provision the Tempo datasource in Grafana
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: grafana-tempo-datasource
        namespace: '{{ tempo_namespace }}'
        labels:
          grafana_datasource: '1'
      data:
        tempo-datasource.yaml: |
          apiVersion: 1
          datasources:
            - name: Tempo
              type: tempo
              uid: tempo
              url: http://tempo.{{ tempo_namespace }}.svc.cluster.local:3200
              access: proxy
              editable: false
              jsonData:
                httpMethod: GET
                serviceMap:
                  datasourceUid: prometheus
                nodeGraph:
                  enabled: true
                lokiSearch:
                  datasourceUid: {{ 'loki' if log_stack == 'loki' else 'elasticsearch' }}
  register: _r_provision_tempo_datasource
  retries: 3
  delay: 10
  until: _r_provision_tempo_datasource is not failed
  when: tracing_enabled | bool

- name: Create VMServiceScrape for Tempo
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: operator.victoriametrics.com/v1beta1
      kind: VMServiceScrape
      metadata:
        name: tempo
        namespace: '{{ tempo_namespace }}'
      spec:
        selector:
          matchLabels:
            app.kubernetes.io/name: tempo
        endpoints:
          - port: http
            interval: 30s
  register: _r_create_vmservicescrape_for_tempo
  retries: 3
  delay: 10
  until: _r_create_vmservicescrape_for_tempo is not failed
  when: tracing_enabled | bool

- name: Create VMServiceScrape for OTel Collector
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: operator.victoriametrics.com/v1beta1
      kind: VMServiceScrape
      metadata:
        name: otel-collector
        namespace: '{{ tempo_namespace }}'
      spec:
        selector:
          matchLabels:
            app.kubernetes.io/name: opentelemetry-collector
        endpoints:
          - port: metrics
            interval: 30s
  register: _r_create_vmservicescrape_for_otel_collector
  retries: 3
  delay: 10
  until: _r_create_vmservicescrape_for_otel_collector is not failed
  when: tracing_enabled | bool

- name: Display Tempo + OTel deployment info
  debug:
    msg:
      - "  Tempo: chart {{ tempo_chart_version }} / image {{ tempo_image_tag }}"
      - "  OTel Collector: chart {{ otel_collector_chart_version }} / image {{ otel_collector_image_tag }}"
      - "  Retention: {{ tempo_retention }}"
      - "  Protocols: OTLP, Jaeger, Zipkin, OpenCensus"
  when: tracing_enabled | bool

- name: Display tracing disabled notice
  debug:
    msg:
      - "Distributed tracing DISABLED for tier {{ tier }}. Enable with: -e tracing_enabled=true"
  when: not (tracing_enabled | bool)
