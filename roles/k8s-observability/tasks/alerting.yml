---
# Alerting tasks - included from k8s-observability/tasks/main.yml at the end
# Provides: VMAlertmanager + VMAlert + default VMRules + Postal SMTP + Telegram webhook

- name: Resolve configured alert delivery channels
  ansible.builtin.set_fact:
    # Component-only --tags alerting runs skip the role-wide sizing fact task.
    # Resolve the stable namespace locally so alert reconciliation is a safe,
    # independently runnable operation.
    monitoring_namespace: '{{ monitoring_namespace | default("monitoring") }}'
    alert_runbook_url_resolved: >-
      {{
        alert_runbook_url |
        default('https://github.com/nmime/ansible-k8s-full-setup/blob/main/docs/RUNBOOK.md')
      }}
    alert_telegram_configured: >-
      {{
        alert_telegram_enabled | default(false) | bool
        and alert_telegram_bot_token | default('') | length > 0
        and alert_telegram_chat_id | default(0) | int != 0
      }}
    alert_email_configured: '{{ alert_email_enabled | default(false) | bool }}'

- name: Create alert secrets (Telegram + SMTP)
  no_log: true
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: alert-secrets
        namespace: '{{ monitoring_namespace }}'
      type: Opaque
      stringData:
        telegram-bot-token: '{{ alert_telegram_bot_token | default("") }}'
        telegram-chat-id: '{{ alert_telegram_chat_id | default("") }}'
        smtp-username: '{{ postal_smtp_auth_username }}'
        smtp-password: "{{ postal_smtp_credentials['alertmanager'] if platform_postal_enabled | default(false) | bool else '' }}"
  register: _r_alert_secrets
  retries: 3
  delay: 10
  until: _r_alert_secrets is not failed

- name: Create VMAlertmanager config secret
  no_log: true
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: platform-alertmanager-config
        namespace: '{{ monitoring_namespace }}'
      type: Opaque
      stringData:
        alertmanager.yaml: |
          global:
            resolve_timeout: 5m
          {% if alert_email_configured | bool %}
            smtp_from: 'alerts@{{ domain }}'
            smtp_smarthost: '{{ postal_submission_hostname }}:587'
            smtp_auth_username: '{{ postal_smtp_auth_username }}'
            smtp_auth_password_file: '/etc/vm/secrets/alert-secrets/smtp-password'
            smtp_require_tls: true
            smtp_hello: '{{ domain }}'
          {% endif %}

          route:
            receiver: default
            group_by: ['cluster', 'environment_tier', 'namespace', 'service', 'alertname', 'severity']
            group_wait: 30s
            group_interval: 5m
            repeat_interval: 4h
            routes:
          {% if not alert_telegram_configured | bool and not alert_email_configured | bool %}
              []
          {% endif %}
          {% if alert_telegram_configured | bool %}
              - receiver: telegram-critical
                matchers:
                  - severity="critical"
                continue: true
                group_wait: 10s
                group_interval: 2m
                repeat_interval: 30m
              - receiver: telegram-warning
                matchers:
                  - severity="warning"
                continue: true
                group_wait: 1m
                group_interval: 10m
                repeat_interval: 4h
          {% endif %}
          {% if alert_email_configured | bool %}
              - receiver: email-warning
                matchers:
                  - severity=~"warning|critical"
          {% endif %}

          receivers:
            - name: default
              # silent – Grafana/UI only
          {% if alert_telegram_configured | bool %}
            - name: telegram-critical
              telegram_configs:
                - send_resolved: true
                  bot_token_file: /etc/vm/secrets/alert-secrets/telegram-bot-token
                  chat_id: {{ alert_telegram_chat_id | default(0) | int }}
                  parse_mode: HTML
                  message: |-
                    {% raw %}<b>🚨 {{ .Status | toUpper }}</b>{{ if eq .Status "firing" }} · {{ .Alerts.Firing | len }} firing{{ end }}
                    {{ range $index, $alert := .Alerts -}}
                    {{ if lt $index 6 }}<b>{{ .Labels.alertname }}</b> · <code>{{ .Labels.severity }}</code>
                    <i>{{ .Annotations.summary }}</i>
                    {{ .Annotations.description }}
                    <b>Context:</b> <code>{{ if .Labels.namespace }}{{ .Labels.namespace }}{{ else }}cluster{{ end }}{{ with .Labels.pod }}/{{ . }}{{ end }}</code>{{ with .Labels.deployment }} · deployment <code>{{ . }}</code>{{ end }}{{ with .Labels.runner_name }} · runner <code>{{ . }}</code>{{ end }}{{ with .Labels.runner }} · id <code>{{ . }}</code>{{ end }}{{ with .Labels.status }} · HTTP <code>{{ . }}</code>{{ end }}{{ with .Labels.level }} · level <code>{{ . }}</code>{{ end }}
                    {{ if .Annotations.runbook_url }}📘 <a href="{{ .Annotations.runbook_url }}">Runbook</a>{{ end }}
                    {{ end }}
                    {{ end -}}
                    {{ if gt (len .Alerts) 6 }}Additional alerts are grouped; open Alertmanager for the complete set.{{ end }}{% endraw %}

            - name: telegram-warning
              telegram_configs:
                - send_resolved: true
                  bot_token_file: /etc/vm/secrets/alert-secrets/telegram-bot-token
                  chat_id: {{ alert_telegram_chat_id | default(0) | int }}
                  parse_mode: HTML
                  message: |-
                    {% raw %}<b>⚠️ {{ .Status | toUpper }}</b>{{ if eq .Status "firing" }} · {{ .Alerts.Firing | len }} firing{{ end }}
                    {{ range $index, $alert := .Alerts -}}
                    {{ if lt $index 6 }}<b>{{ .Labels.alertname }}</b> · <code>{{ .Labels.severity }}</code>
                    <i>{{ .Annotations.summary }}</i>
                    {{ .Annotations.description }}
                    <b>Context:</b> <code>{{ if .Labels.namespace }}{{ .Labels.namespace }}{{ else }}cluster{{ end }}{{ with .Labels.pod }}/{{ . }}{{ end }}</code>{{ with .Labels.deployment }} · deployment <code>{{ . }}</code>{{ end }}{{ with .Labels.runner_name }} · runner <code>{{ . }}</code>{{ end }}{{ with .Labels.runner }} · id <code>{{ . }}</code>{{ end }}{{ with .Labels.status }} · HTTP <code>{{ . }}</code>{{ end }}{{ with .Labels.level }} · level <code>{{ . }}</code>{{ end }}
                    {{ if .Annotations.runbook_url }}📘 <a href="{{ .Annotations.runbook_url }}">Runbook</a>{{ end }}
                    {{ end }}
                    {{ end -}}
                    {{ if gt (len .Alerts) 6 }}Additional alerts are grouped; open Alertmanager for the complete set.{{ end }}{% endraw %}

          {% endif %}
          {% if alert_email_configured | bool %}
            - name: email-warning
              email_configs:
                - to: '{{ alert_email_to | default("alerts@" + domain) }}'
                  send_resolved: true
                  headers:
                    Subject: '[{{ "{{ .Status | toUpper }}" }}] {{ "{{ .GroupLabels.alertname }}" }}'
          {% endif %}

          inhibit_rules:
            - source_matchers: [severity="critical"]
              target_matchers: [severity="warning"]
              equal: [alertname, namespace, service]
  register: _r_am_cfg
  retries: 3
  delay: 10
  until: _r_am_cfg is not failed

- name: Read the authoritative Alertmanager config Secret revision
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    namespace: '{{ monitoring_namespace }}'
    name: platform-alertmanager-config
  register: _alertmanager_config_secret_revision
  no_log: true

- name: Require the authoritative Alertmanager config Secret revision
  ansible.builtin.assert:
    that:
      - _alertmanager_config_secret_revision.resources | length == 1
      - >-
        (_alertmanager_config_secret_revision.resources[0].metadata.resourceVersion |
         default('') | length) > 0
    fail_msg: Alertmanager source config Secret has no stable resource revision.
  no_log: true

- name: Deploy VMAlertmanager CR
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: operator.victoriametrics.com/v1beta1
      kind: VMAlertmanager
      metadata:
        name: platform
        namespace: '{{ monitoring_namespace }}'
        annotations:
          # VMAlertmanager does not project an updated source config Secret
          # until its CR reconciles. Track the exact source revision so config
          # edits regenerate the operator-owned Secret without manual restarts.
          platform.example.com/config-secret-resource-version: >-
            {{ _alertmanager_config_secret_revision.resources[0].metadata.resourceVersion }}
      spec:
        replicaCount: "{{ alerting.replicas | default(2 if resource_tier in ['medium', 'production'] else 1) }}"
        configSecret: platform-alertmanager-config
        podDisruptionBudget:
          minAvailable: 1
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: vmalertmanager
                    app.kubernetes.io/instance: platform
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          runAsGroup: 65534
          fsGroup: 65534
          fsGroupChangePolicy: OnRootMismatch
          containerSecurityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
        configReloaderResources:
          requests: { cpu: 10m, memory: 25Mi }
          limits:
            cpu: "{{ '100m' if resource_tier in ['minimal', 'small'] else '200m' }}"
            memory: "{{ '64Mi' if resource_tier in ['minimal', 'small'] else '128Mi' }}"
        secrets:
          - alert-secrets
        resources:
          requests: { cpu: 50m, memory: 128Mi }
          limits:   { cpu: 200m, memory: 256Mi }
        storage:
          volumeClaimTemplate:
            spec:
              accessModes: [ReadWriteOnce]
              resources:
                requests:
                  storage: "{{ alerting.storage_size | default('5Gi') }}"
  register: _r_am
  retries: 3
  delay: 10
  until: _r_am is not failed

- name: Deploy VMAlert CR
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: operator.victoriametrics.com/v1beta1
      kind: VMAlert
      metadata:
        name: platform
        namespace: '{{ monitoring_namespace }}'
      spec:
        replicaCount: "{{ alerting.vmalert_replicas | default(2 if tier == 'production' else 1) }}"
        configReloaderResources:
          requests: { cpu: 10m, memory: 25Mi }
          limits:
            cpu: "{{ '100m' if resource_tier in ['minimal', 'small'] else '200m' }}"
            memory: "{{ '64Mi' if resource_tier in ['minimal', 'small'] else '128Mi' }}"
        datasource:
          url: >-
            {{ 'http://vmselect-vmcluster.' + monitoring_namespace + '.svc.cluster.local:8481/select/0/prometheus'
               if tier in ['medium', 'production']
               else 'http://vmsingle-vmsingle.' + monitoring_namespace + '.svc.cluster.local:8429' }}
        notifier:
          url: 'http://vmalertmanager-platform.{{ monitoring_namespace }}.svc.cluster.local:9093'
        evaluationInterval: 30s
        selectAllByDefault: true
        resources:
          requests: { cpu: 50m, memory: 128Mi }
          limits:   { cpu: 300m, memory: 512Mi }
  register: _r_vmalert
  retries: 3
  delay: 10
  until: _r_vmalert is not failed

- name: Deploy default VMRules (platform alerts)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: operator.victoriametrics.com/v1beta1
      kind: VMRule
      metadata:
        name: platform-default
        namespace: '{{ monitoring_namespace }}'
      spec:
        groups:
          - name: node
            rules:
              - alert: NodeNotReady
                expr: kube_node_status_condition{condition="Ready",status="true"} == 0
                for: 5m
                labels: { severity: critical }
                annotations:
                  summary: Node {{ "{{ $labels.node }}" }} NotReady
                  description: Kubernetes node has been NotReady for 5+ minutes
              - alert: NodeMemoryPressure
                expr: kube_node_status_condition{condition="MemoryPressure",status="true"} == 1
                for: 10m
                labels: { severity: warning }
                annotations:
                  summary: Node {{ "{{ $labels.node }}" }} under memory pressure
              - alert: NodeDiskPressure
                expr: kube_node_status_condition{condition="DiskPressure",status="true"} == 1
                for: 10m
                labels: { severity: critical }
                annotations:
                  summary: Node {{ "{{ $labels.node }}" }} disk pressure
              - alert: NodeDiskUsageHigh
                expr: 100 - ((node_filesystem_avail_bytes{fstype!~"tmpfs|overlay",mountpoint="/"} / node_filesystem_size_bytes) * 100) > 85
                for: 15m
                labels: { severity: warning }
                annotations:
                  summary: Disk >85% on {{ "{{ $labels.instance }}" }}

          - name: workload
            rules:
              - alert: PodOOMKilled
                expr: increase(kube_pod_container_status_last_terminated_reason{reason="OOMKilled",namespace!~"agents|production|.*-production"}[10m]) > 0
                for: 1m
                labels: { severity: warning }
                annotations:
                  summary: OOMKill {{ "{{ $labels.namespace }}/{{ $labels.pod }}" }}
              - alert: DeploymentReplicasUnavailable
                expr: kube_deployment_status_replicas_unavailable{namespace!~"agents|production|.*-production"} > 0
                for: 15m
                labels: { severity: warning }
                annotations:
                  summary: Deployment {{ "{{ $labels.namespace }}/{{ $labels.deployment }}" }} has unavailable replicas

          - name: databases
            rules:
              - alert: PostgresDown
                expr: up{job=~".*postgres.*|.*pg.*"} == 0
                for: 2m
                labels: { severity: critical }
                annotations:
                  summary: PostgreSQL instance down
                  description: Target {{ "{{ $labels.instance }}" }} is down
              - alert: ElasticsearchClusterRed
                expr: elasticsearch_cluster_health_status{color="red"} == 1
                for: 5m
                labels: { severity: critical }
                annotations:
                  summary: Elasticsearch cluster RED
              - alert: ElasticsearchClusterYellow
                expr: elasticsearch_cluster_health_status{color="yellow"} == 1
                for: 30m
                labels: { severity: warning }
                annotations:
                  summary: Elasticsearch cluster YELLOW for 30m
              - alert: RedisDown
                expr: up{job=~".*dragonfly.*|.*redis.*"} == 0
                for: 2m
                labels: { severity: critical }
                annotations:
                  summary: Redis/Dragonfly down

          - name: probes
            rules:
              - alert: BlackboxProbeFailed
                expr: probe_success == 0
                for: 5m
                labels: { severity: critical }
                annotations:
                  summary: Probe failing for {{ "{{ $labels.instance }}" }}
                  description: HTTPS/TCP probe has failed for 5+ minutes
              - alert: BlackboxSSLCertExpiringSoon
                expr: (probe_ssl_earliest_cert_expiry - time()) / 86400 < 14
                for: 1h
                labels: { severity: warning }
                annotations:
                  summary: TLS cert expires in <14 days for {{ "{{ $labels.instance }}" }}
              - alert: BlackboxSSLCertExpiringCritical
                expr: (probe_ssl_earliest_cert_expiry - time()) / 86400 < 3
                for: 15m
                labels: { severity: critical }
                annotations:
                  summary: TLS cert expires in <3 days for {{ "{{ $labels.instance }}" }}
              - alert: BlackboxHttpSlow
                expr: probe_duration_seconds > 10
                for: 10m
                labels: { severity: warning }
                annotations:
                  summary: Probe slow (>10s) for {{ "{{ $labels.instance }}" }}

          - name: certificates
            rules:
              - alert: CertManagerCertNotReady
                expr: certmanager_certificate_ready_status{condition="False"} == 1
                for: 30m
                labels: { severity: critical }
                annotations:
                  summary: cert-manager cert {{ "{{ $labels.name }}" }} NOT ready

          - name: observability
            rules:
              - alert: VMAgentScrapeDrop
                expr: rate(vmagent_remotewrite_requests_total{status_code=~"4..|5.."}[5m]) > 0
                for: 10m
                labels: { severity: warning }
                annotations:
                  summary: VMAgent remote-write errors
              - alert: LokiIngestErrors
                expr: rate(loki_request_duration_seconds_count{status_code=~"5.."}[5m]) > 0
                for: 10m
                labels: { severity: warning }
                annotations:
                  summary: Loki returning 5xx errors
  register: _r_vmrules
  retries: 3
  delay: 10
  until: _r_vmrules is not failed

- name: Deploy service SLO and operational VMRules
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: operator.victoriametrics.com/v1beta1
      kind: VMRule
      metadata:
        name: platform-slo
        namespace: '{{ monitoring_namespace }}'
        labels:
          app.kubernetes.io/managed-by: ansible
      spec:
        groups:
          - name: http-slo
            interval: 30s
            rules:
              - alert: ServiceHttp5xxRatioHigh
                expr: >-
                  100 * sum by (app_id) (rate(container_http_inbound_requests_total{status="5xx",app_id!=""}[5m]))
                  / clamp_min(sum by (app_id) (rate(container_http_inbound_requests_total{app_id!=""}[5m])), 0.001) > 2
                  and sum by (app_id) (increase(container_http_inbound_requests_total{app_id!=""}[5m])) >= 20
                for: 10m
                labels:
                  severity: warning
                  owner: platform
                  service: '{{ "{{ $labels.app_id }}" }}'
                annotations:
                  summary: 'HTTP 5xx ratio above 2% for {{ "{{ $labels.app_id }}" }}'
                  description: 'At least 20 requests were observed; the 5xx ratio has remained elevated for 10 minutes.'
                  runbook_url: '{{ alert_runbook_url_resolved }}'
              - alert: ServiceHttp5xxRatioCritical
                expr: >-
                  100 * sum by (app_id) (rate(container_http_inbound_requests_total{status="5xx",app_id!=""}[5m]))
                  / clamp_min(sum by (app_id) (rate(container_http_inbound_requests_total{app_id!=""}[5m])), 0.001) > 10
                  and sum by (app_id) (increase(container_http_inbound_requests_total{status="5xx",app_id!=""}[5m])) >= 10
                for: 5m
                labels:
                  severity: critical
                  owner: platform
                  service: '{{ "{{ $labels.app_id }}" }}'
                annotations:
                  summary: 'HTTP 5xx ratio above 10% for {{ "{{ $labels.app_id }}" }}'
                  description: 'The service is returning a sustained high rate of server errors.'
                  runbook_url: '{{ alert_runbook_url_resolved }}'
              - alert: GitLabHttp5xxRatioHigh
                expr: >-
                  100 * sum(rate(http_requests_total{namespace="gitlab",status="5xx"}[5m]))
                  / clamp_min(sum(rate(http_requests_total{namespace="gitlab"}[5m])), 0.001) > 2
                  and sum(increase(http_requests_total{namespace="gitlab"}[5m])) >= 20
                for: 10m
                labels: {severity: warning, owner: platform, service: gitlab, environment_tier: platform}
                annotations:
                  summary: GitLab HTTP 5xx ratio is elevated
                  description: GitLab has returned more than 2% server errors for 10 minutes.
                  runbook_url: '{{ alert_runbook_url_resolved }}'

          - name: kubernetes-workloads
            interval: 30s
            rules:
              - alert: PodUnexpectedRestart
                expr: >-
                  increase(kube_pod_container_status_restarts_total{namespace!~"kube-system|gitlab-ci-general|gitlab-image-builds|gitlab-docker-builds"}[10m]) > 0
                labels: {severity: warning, owner: platform}
                annotations:
                  summary: 'Pod restarted: {{ "{{ $labels.namespace }}/{{ $labels.pod }}" }}'
                  description: 'Container {{ "{{ $labels.container }}" }} restarted during the last 10 minutes.'
                  runbook_url: '{{ alert_runbook_url_resolved }}'
              - alert: PodRestartStorm
                expr: increase(kube_pod_container_status_restarts_total[15m]) >= 3
                labels: {severity: critical, owner: platform}
                annotations:
                  summary: 'Restart storm: {{ "{{ $labels.namespace }}/{{ $labels.pod }}" }}'
                  description: 'Container {{ "{{ $labels.container }}" }} restarted at least three times in 15 minutes.'
                  runbook_url: '{{ alert_runbook_url_resolved }}'
              - alert: PodCrashLoopBackOffPersistent
                expr: kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"} == 1
                for: 5m
                labels: {severity: critical, owner: platform}
                annotations:
                  summary: 'CrashLoopBackOff: {{ "{{ $labels.namespace }}/{{ $labels.pod }}" }}'
                  description: 'Container {{ "{{ $labels.container }}" }} has been crash-looping for five minutes.'
                  runbook_url: '{{ alert_runbook_url_resolved }}'
              - alert: PodOOMKilledProduction
                expr: >-
                  increase(kube_pod_container_status_last_terminated_reason{reason="OOMKilled",namespace=~"agents|production|.*-production"}[10m]) > 0
                labels: {severity: critical, owner: platform, environment_tier: production}
                annotations:
                  summary: 'Production OOMKill: {{ "{{ $labels.namespace }}/{{ $labels.pod }}" }}'
                  description: 'Container {{ "{{ $labels.container }}" }} exceeded its memory boundary.'
                  runbook_url: '{{ alert_runbook_url_resolved }}'
              - alert: PodPendingTooLong
                expr: >-
                  kube_pod_status_phase{phase="Pending",namespace!~"gitlab-ci-general|gitlab-image-builds|gitlab-docker-builds"} == 1
                for: 10m
                labels: {severity: warning, owner: platform}
                annotations:
                  summary: 'Pod pending for 10 minutes: {{ "{{ $labels.namespace }}/{{ $labels.pod }}" }}'
                  description: Inspect scheduling events, resource quota, PVC binding, and image pulls.
                  runbook_url: '{{ alert_runbook_url_resolved }}'
              - alert: ProductionDeploymentUnavailable
                expr: kube_deployment_status_replicas_unavailable{namespace=~"agents|production|.*-production"} > 0
                for: 5m
                labels: {severity: critical, owner: platform, environment_tier: production}
                annotations:
                  summary: 'Production deployment unavailable: {{ "{{ $labels.namespace }}/{{ $labels.deployment }}" }}'
                  description: One or more desired production replicas have been unavailable for five minutes.
                  runbook_url: '{{ alert_runbook_url_resolved }}'
              - alert: StatefulSetReplicaMismatch
                expr: kube_statefulset_status_replicas_ready < kube_statefulset_replicas
                for: 10m
                labels: {severity: warning, owner: platform}
                annotations:
                  summary: 'StatefulSet replica mismatch: {{ "{{ $labels.namespace }}/{{ $labels.statefulset }}" }}'
                  description: Ready replicas have remained below desired replicas for 10 minutes.
                  runbook_url: '{{ alert_runbook_url_resolved }}'
              - alert: KubernetesJobFailed
                # A Job can replace a failed Pod and still complete successfully.
                # Alert only when it has not recovered, rather than paging on a
                # transient image pull or a single retry retained by kube-state-
                # metrics after the successful completion.
                expr: >-
                  max by (namespace, job_name) (kube_job_status_failed > 0)
                  unless on (namespace, job_name)
                  max by (namespace, job_name) (kube_job_status_succeeded > 0)
                for: 5m
                labels: {severity: warning, owner: platform}
                annotations:
                  summary: 'Job failed: {{ "{{ $labels.namespace }}/{{ $labels.job_name }}" }}'
                  description: A Kubernetes Job has failed Pods and has not completed successfully for five minutes.
                  runbook_url: '{{ alert_runbook_url_resolved }}'

          - name: node-capacity
            interval: 30s
            rules:
              - alert: NodeCpuSaturation
                expr: 100 * (1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m]))) > 90
                for: 15m
                labels: {severity: warning, owner: platform, service: kubernetes}
                annotations:
                  summary: 'Node CPU above 90%: {{ "{{ $labels.instance }}" }}'
                  description: Sustained CPU saturation may delay services and CI jobs.
              - alert: NodeMemoryAvailableLow
                expr: 100 * node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 10
                for: 10m
                labels: {severity: critical, owner: platform, service: kubernetes}
                annotations:
                  summary: 'Node memory below 10%: {{ "{{ $labels.instance }}" }}'
                  description: Available node memory is critically low.
              - alert: NodeFilesystemInodesLow
                expr: >-
                  100 * node_filesystem_files_free{fstype!~"tmpfs|overlay"}
                  / node_filesystem_files{fstype!~"tmpfs|overlay"} < 10
                for: 15m
                labels: {severity: warning, owner: platform, service: kubernetes}
                annotations:
                  summary: 'Filesystem inodes below 10%: {{ "{{ $labels.instance }} {{ $labels.mountpoint }}" }}'
                  description: Free inodes are nearly exhausted even if byte capacity remains.

          - name: gitlab-ci
            interval: 30s
            rules:
              - alert: GitLabRunnerMetricsDown
                expr: >-
                  (
                    kube_deployment_spec_replicas{
                      namespace=~"gitlab|gitlab-ci-general|gitlab-image-builds|gitlab-docker-builds",
                      deployment=~".*gitlab.*runner.*|gitlab-runner"
                    }
                    - on (namespace, deployment)
                    kube_deployment_status_replicas_available{
                      namespace=~"gitlab|gitlab-ci-general|gitlab-image-builds|gitlab-docker-builds",
                      deployment=~".*gitlab.*runner.*|gitlab-runner"
                    }
                  ) > 0
                for: 10m
                labels: {severity: critical, owner: platform, service: gitlab-runner}
                annotations:
                  summary: 'Runner managers unavailable: {{ "{{ $labels.namespace }}/{{ $labels.deployment }}" }}'
                  description: >-
                    {{ '{{ printf "%.0f" $value }}' }} desired manager replica(s) are unavailable for 10 minutes. Intentional scale-to-zero is excluded.
                  runbook_url: '{{ alert_runbook_url_resolved }}'
              - alert: GitLabRunnerSystemErrors
                expr: >-
                  sum by (namespace, pod, job, level) (
                    increase(gitlab_runner_errors_total{level=~"error|fatal|panic"}[15m])
                  ) >= 3
                for: 2m
                labels: {severity: warning, owner: platform, service: gitlab-runner}
                annotations:
                  summary: 'Runner system errors: {{ "{{ $labels.namespace }}/{{ $labels.pod }}" }}'
                  description: >-
                    {{ '{{ printf "%.0f" $value }}' }} {{ "{{ $labels.level }}" }} manager errors in 15 minutes for scrape job {{ "{{ $labels.job }}" }}. Inspect this manager log and its Kubernetes executor events.
                  runbook_url: '{{ alert_runbook_url_resolved }}'
              - alert: GitLabRunnerApiErrors
                expr: >-
                  sum by (namespace, pod, job, status) (
                    increase(gitlab_runner_api_request_statuses_total{status=~"4..|5.."}[15m])
                  ) >= 5
                for: 2m
                labels: {severity: critical, owner: platform, service: gitlab-runner}
                annotations:
                  summary: 'Runner API errors: {{ "{{ $labels.namespace }}/{{ $labels.pod }}" }}'
                  description: >-
                    {{ '{{ printf "%.0f" $value }}' }} HTTP {{ "{{ $labels.status }}" }} responses in 15 minutes for scrape job {{ "{{ $labels.job }}" }}. Check runner identity, token validity, DNS, and GitLab availability.
                  runbook_url: '{{ alert_runbook_url_resolved }}'
              - alert: GitLabRunnerQueueSlow
                expr: >-
                  histogram_quantile(
                    0.95,
                    sum by (namespace, runner, runner_name, le) (
                      rate(gitlab_runner_job_queue_duration_seconds_bucket[15m])
                    )
                  ) > 300
                for: 15m
                labels: {severity: warning, owner: platform, service: gitlab-runner}
                annotations:
                  summary: 'Runner queue slow: {{ "{{ $labels.namespace }}/{{ $labels.runner }}" }}'
                  description: 'Queue p95 is {{ "{{ humanizeDuration $value }}" }} over 15 minutes on manager {{ "{{ $labels.runner_name }}" }}. Check pending jobs, quota, node headroom, and runner concurrency.'
                  runbook_url: '{{ alert_runbook_url_resolved }}'

          - name: storage-and-alert-delivery
            interval: 30s
            rules:
              - alert: ObjectStorageS35xx
                expr: sum(rate(SeaweedFS_s3_request_total{code=~"5.."}[5m])) > 0
                for: 5m
                labels: {severity: critical, owner: platform, service: seaweedfs, environment_tier: platform}
                annotations:
                  summary: SeaweedFS S3 is returning 5xx responses
                  description: Registry, CI cache, and backup object operations may be failing.
              - alert: ObjectStorageNoMasterLeader
                expr: >-
                  sum(SeaweedFS_master_is_leader) < 1
                  or absent(SeaweedFS_master_is_leader)
                for: 2m
                labels: {severity: critical, owner: platform, service: seaweedfs, environment_tier: platform}
                annotations:
                  summary: SeaweedFS has no elected master leader
                  description: Object storage writes cannot be trusted until leadership is restored.
              - alert: ObjectStorageWritePlacementErrors
                expr: sum(increase(SeaweedFS_master_pick_for_write_error[10m])) > 0
                labels: {severity: warning, owner: platform, service: seaweedfs, environment_tier: platform}
                annotations:
                  summary: SeaweedFS failed to place a write
                  description: Check writable volume count, replication placement, and disk capacity.
              - alert: AlertDeliveryFailed
                expr: sum by (integration, reason) (increase(alertmanager_notifications_failed_total[10m])) > 0
                labels: {severity: critical, owner: platform, service: alertmanager, environment_tier: platform}
                annotations:
                  summary: 'Alert delivery failed via {{ "{{ $labels.integration }}" }}'
                  description: 'Alertmanager reports notification failure reason {{ "{{ $labels.reason }}" }}.'
              - alert: AlertmanagerConfigReloadFailed
                expr: alertmanager_config_last_reload_successful == 0
                for: 2m
                labels: {severity: critical, owner: platform, service: alertmanager, environment_tier: platform}
                annotations:
                  summary: Alertmanager rejected its configuration
                  description: The running configuration did not reload successfully.
              - alert: VMAlertRuleEvaluationErrors
                expr: increase(vmalert_execution_errors_total[5m]) > 0
                labels: {severity: critical, owner: platform, service: vmalert, environment_tier: platform}
                annotations:
                  summary: VMAlert rule evaluation failed
                  description: One or more alert expressions could not be evaluated.
  register: _r_platform_slo_rules
  retries: 3
  delay: 10
  until: _r_platform_slo_rules is not failed

- name: Create Alertmanager HTTPRoute (VPN-only via admin-gateway)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: alertmanager
        namespace: '{{ monitoring_namespace }}'
      spec:
        parentRefs:
          - name: admin-gateway
            namespace: cilium-system
            sectionName: https
        hostnames:
          - 'alertmanager.{{ domain }}'
        rules:
          - matches:
              - path: { type: PathPrefix, value: / }
            backendRefs:
              - name: vmalertmanager-platform
                port: 9093
  register: _r_am_route
  retries: 3
  delay: 10
  until: _r_am_route is not failed

- name: Print Alerting info
  debug:
    msg:
      - 'VMAlertmanager ready at vmalertmanager-platform.{{ monitoring_namespace }}.svc.cluster.local:9093'
      - 'VMAlert evaluating rules every 30s'
      - 'Telegram: {{ "enabled" if alert_telegram_configured | bool else "disabled or credentials missing" }}'
      - 'SMTP via Postal: {{ "alerts@" + domain + " -> " + alert_email_to if alert_email_configured | bool else "disabled" }}'
      - 'UI (VPN-only): https://alertmanager.{{ domain }}'
