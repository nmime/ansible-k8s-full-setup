apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "opwerf.name" . }}-credential-proxy
  labels:
    {{- include "opwerf.labels" . | nindent 4 }}
    app.kubernetes.io/component: credential-proxy
spec:
  replicas: {{ .Values.replicas.credentialProxy }}
  selector:
    matchLabels:
      app: {{ include "opwerf.name" . }}-credential-proxy
  template:
    metadata:
      labels:
        app: {{ include "opwerf.name" . }}-credential-proxy
        {{- include "opwerf.labels" . | nindent 8 }}
    spec:
      containers:
        - name: credential-proxy
          image: "{{ .Values.image.registry }}/opwerf/credential-proxy:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 4000
              name: http
          envFrom:
            - configMapRef:
                name: {{ include "opwerf.name" . }}-config
            - secretRef:
                name: {{ include "opwerf.name" . }}-secrets
          resources:
            {{- toYaml .Values.resources.credentialProxy | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "opwerf.name" . }}-credential-proxy
  labels:
    {{- include "opwerf.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 4000
      targetPort: 4000
      protocol: TCP
      name: http
  selector:
    app: {{ include "opwerf.name" . }}-credential-proxy
