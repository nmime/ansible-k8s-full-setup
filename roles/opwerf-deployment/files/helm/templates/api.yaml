apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "opwerf.name" . }}-api
  labels:
    {{- include "opwerf.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.replicas.api }}
  selector:
    matchLabels:
      app: {{ include "opwerf.name" . }}-api
  template:
    metadata:
      labels:
        app: {{ include "opwerf.name" . }}-api
        {{- include "opwerf.labels" . | nindent 8 }}
    spec:
      containers:
        - name: api
          image: "{{ .Values.image.registry }}/opwerf/api:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: {{ include "opwerf.name" . }}-config
            - secretRef:
                name: {{ include "opwerf.name" . }}-secrets
          resources:
            {{- toYaml .Values.resources.api | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "opwerf.name" . }}-api
  labels:
    {{- include "opwerf.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: {{ include "opwerf.name" . }}-api
