apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "opwerf.name" . }}-worker
  labels:
    {{- include "opwerf.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.replicas.worker }}
  selector:
    matchLabels:
      app: {{ include "opwerf.name" . }}-worker
  template:
    metadata:
      labels:
        app: {{ include "opwerf.name" . }}-worker
        {{- include "opwerf.labels" . | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: worker
          image: "{{ .Values.image.registry }}/worker:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "opwerf.name" . }}-config
            - secretRef:
                name: {{ include "opwerf.name" . }}-secrets
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources.worker | nindent 12 }}
