apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "opwerf.name" . }}-dashboard
  labels:
    {{- include "opwerf.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  replicas: {{ .Values.replicas.dashboard }}
  selector:
    matchLabels:
      app: {{ include "opwerf.name" . }}-dashboard
  template:
    metadata:
      labels:
        app: {{ include "opwerf.name" . }}-dashboard
        {{- include "opwerf.labels" . | nindent 8 }}
    spec:
      containers:
        - name: dashboard
          image: "{{ .Values.image.registry }}/opwerf/dashboard:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 80
              name: http
          resources:
            {{- toYaml .Values.resources.dashboard | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "opwerf.name" . }}-dashboard
  labels:
    {{- include "opwerf.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
  selector:
    app: {{ include "opwerf.name" . }}-dashboard
