apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "opwerf.name" . }}-config
  labels:
    {{- include "opwerf.labels" . | nindent 4 }}
data:
  DATABASE_HOST: {{ .Values.database.host | quote }}
  DATABASE_PORT: {{ .Values.database.port | quote }}
  DATABASE_NAME: {{ .Values.database.name | quote }}
  DATABASE_USER: {{ .Values.database.user | quote }}
  TEMPORAL_ADDRESS: {{ .Values.temporal.address | quote }}
  TEMPORAL_NAMESPACE: {{ .Values.temporal.namespace | quote }}
  REDIS_URL: {{ include "opwerf.redisUrl" . | quote }}
  MINIO_ENDPOINT: {{ .Values.minio.endpoint | quote }}
  MINIO_PORT: {{ .Values.minio.port | quote }}
  MINIO_BUCKET: {{ .Values.minio.bucket | quote }}
  MINIO_USE_SSL: {{ .Values.minio.useSSL | quote }}
  NODE_ENV: {{ .Values.app.nodeEnv | quote }}
  ALLOW_DEV_AUTH_BYPASS: {{ .Values.app.allowDevAuthBypass | quote }}
  API_PORT: "3000"
  CREDENTIAL_PROXY_PORT: "4000"
  CREDENTIAL_PROXY_URL: {{ include "opwerf.credentialProxyUrl" . | quote }}
  WORKER_LOG_LEVEL: "info"
  APP_ROOT: "/app"
  {{- if .Values.elasticsearch.enabled }}
  ELASTICSEARCH_URL: {{ include "opwerf.elasticsearchUrl" . | quote }}
  ELASTICSEARCH_HOST: {{ .Values.elasticsearch.host | quote }}
  ELASTICSEARCH_PORT: {{ .Values.elasticsearch.port | quote }}
  ELASTICSEARCH_SCHEME: {{ .Values.elasticsearch.scheme | quote }}
  {{- end }}
