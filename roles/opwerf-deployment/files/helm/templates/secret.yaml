apiVersion: v1
kind: Secret
metadata:
  name: {{ include "opwerf.name" . }}-secrets
  labels:
    {{- include "opwerf.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_PASSWORD: {{ .Values.database.password | default "" | quote }}
  REDIS_PASSWORD: {{ .Values.security.redisPassword | default "" | quote }}
  MINIO_ACCESS_KEY: {{ .Values.minio.accessKey | default "" | quote }}
  MINIO_SECRET_KEY: {{ .Values.minio.secretKey | default "" | quote }}
  CREDENTIAL_PROXY_INTERNAL_TOKEN: {{ .Values.security.credentialProxyToken | default "" | quote }}
  ENCRYPTION_KEY: {{ .Values.security.encryptionKey | default "" | quote }}
  ENCRYPTION_SALT: {{ .Values.security.encryptionSalt | default "" | quote }}
  SESSION_SIGNING_KEY: {{ .Values.security.sessionSigningKey | default "" | quote }}
  E2B_API_KEY: {{ .Values.externalAPIs.e2bApiKey | default "" | quote }}
  ANTHROPIC_API_KEY: {{ .Values.externalAPIs.anthropicApiKey | default "" | quote }}
  {{- if .Values.elasticsearch.enabled }}
  ELASTICSEARCH_USERNAME: {{ .Values.elasticsearch.user | default "elastic" | quote }}
  ELASTICSEARCH_PASSWORD: {{ .Values.elasticsearch.password | default "" | quote }}
  {{- end }}
