global:
  domain: example.com
  tier: small
  environment: production

image:
  registry: registry.example.com
  tag: latest
  pullPolicy: IfNotPresent

app:
  name: opwerf
  nodeEnv: production
  allowDevAuthBypass: "false"

replicas:
  api: 1
  worker: 1
  dashboard: 1
  credentialProxy: 1

resources:
  api:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  worker:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  dashboard:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  credentialProxy:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

database:
  host: k8s-pg-pgbouncer.databases.svc.cluster.local
  port: 5432
  name: opwerf
  user: opwerf

dragonfly:
  host: dragonfly.dragonfly.svc.cluster.local
  port: 6379

elasticsearch:
  enabled: true
  external: true
  scheme: https
  host: elasticsearch.elasticsearch.svc.cluster.local
  port: 9200
  user: elastic

elasticsearchCA:
  enabled: true
  caSecretName: elasticsearch-ca
  caSecretNamespace: elasticsearch

temporal:
  address: temporal-frontend.temporal.svc.cluster.local:7233
  namespace: opwerf

minio:
  endpoint: minio.storage.svc.cluster.local
  port: 9000
  bucket: opwerf-artifacts
  useSSL: false

security:
  encryptionKey: ""
  encryptionSalt: ""
  sessionSigningKey: ""
  credentialProxyToken: ""

externalAPIs:
  e2bApiKey: ""
  anthropicApiKey: ""

ingress:
  enabled: true
  gatewayName: main-gateway
  gatewayNamespace: gateway
  dashboardHost: app.example.com
  apiHost: api.example.com

autoscaling:
  api:
    enabled: true
    minReplicas: 1
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  worker:
    enabled: true
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
