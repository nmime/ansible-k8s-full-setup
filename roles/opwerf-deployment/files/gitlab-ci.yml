stages:
  - test
  - build

variables:
  DOCKER_BUILDKIT: "1"

.test_base:
  stage: test
  image: node:24-slim
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - node_modules/
      - .nx/cache
  before_script:
    - corepack enable
    - pnpm install --frozen-lockfile
  script:
    - npx nx affected -t lint --base=origin/${CI_DEFAULT_BRANCH} --parallel=3
    - npx nx affected -t typecheck --base=origin/${CI_DEFAULT_BRANCH} --parallel=3
    - npx nx affected -t test --base=origin/${CI_DEFAULT_BRANCH} --parallel=3

.build_base:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
  tags:
    - docker
  script:
    - |-
      case "$CI_COMMIT_REF_NAME" in
        main) TAG="latest" ;;
        st)   TAG="st-latest" ;;
        pp)   TAG="pp-latest" ;;
        *)    TAG="$CI_COMMIT_REF_SLUG" ;;
      esac
    - echo "Building images with tag ${TAG}"
    - |-
      docker build -f docker/Dockerfile.api -t "${CI_REGISTRY_IMAGE}/api:${TAG}" -t "${CI_REGISTRY_IMAGE}/api:${CI_COMMIT_SHORT_SHA}" .
      docker push "${CI_REGISTRY_IMAGE}/api:${TAG}"
      docker push "${CI_REGISTRY_IMAGE}/api:${CI_COMMIT_SHORT_SHA}"
    - |-
      docker build -f docker/Dockerfile.worker -t "${CI_REGISTRY_IMAGE}/worker:${TAG}" -t "${CI_REGISTRY_IMAGE}/worker:${CI_COMMIT_SHORT_SHA}" .
      docker push "${CI_REGISTRY_IMAGE}/worker:${TAG}"
      docker push "${CI_REGISTRY_IMAGE}/worker:${CI_COMMIT_SHORT_SHA}"
    - |-
      docker build -f docker/Dockerfile.frontend -t "${CI_REGISTRY_IMAGE}/dashboard:${TAG}" -t "${CI_REGISTRY_IMAGE}/dashboard:${CI_COMMIT_SHORT_SHA}" .
      docker push "${CI_REGISTRY_IMAGE}/dashboard:${TAG}"
      docker push "${CI_REGISTRY_IMAGE}/dashboard:${CI_COMMIT_SHORT_SHA}"
    - |-
      docker build -f docker/Dockerfile.credential-proxy -t "${CI_REGISTRY_IMAGE}/credential-proxy:${TAG}" -t "${CI_REGISTRY_IMAGE}/credential-proxy:${CI_COMMIT_SHORT_SHA}" .
      docker push "${CI_REGISTRY_IMAGE}/credential-proxy:${TAG}"
      docker push "${CI_REGISTRY_IMAGE}/credential-proxy:${CI_COMMIT_SHORT_SHA}"

# ─── st: test on MR, build on merge ───

test:st:
  extends: .test_base
  rules:
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "st"

build:st:
  extends: .build_base
  rules:
    - if: $CI_COMMIT_BRANCH == "st"

# ─── pp: test on MR, build on merge ───

test:pp:
  extends: .test_base
  rules:
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "pp"

build:pp:
  extends: .build_base
  rules:
    - if: $CI_COMMIT_BRANCH == "pp"

# ─── main: build on push ───

build:production:
  extends: .build_base
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
