---
opwerf_namespace: opwerf
opwerf_app_name: opwerf
opwerf_argocd_ns: argocd
opwerf_gitlab_ns: gitlab

opwerf_github_repo: nmime/opwerf
opwerf_github_token: ""
opwerf_mirror_mode: push

opwerf_environments:
  - name: st
    branch: st
    namespace: opwerf-st
    subdomain_prefix: st-
    image_tag: "st-latest"
    api_replicas: 1
    worker_replicas: 1
    dashboard_replicas: 1
    node_env: development
    allow_dev_auth_bypass: "true"
    api_cpu_request: 100m
    api_memory_request: 256Mi
    api_cpu_limit: 500m
    api_memory_limit: 512Mi
    worker_cpu_request: 100m
    worker_memory_request: 256Mi
    worker_cpu_limit: 500m
    worker_memory_limit: 512Mi
    hpa_api_min: 1
    hpa_api_max: 3
    hpa_worker_min: 1
    hpa_worker_max: 3
  - name: pp
    branch: pp
    namespace: opwerf-pp
    subdomain_prefix: pp-
    image_tag: "pp-latest"
    api_replicas: 1
    worker_replicas: 1
    dashboard_replicas: 1
    node_env: production
    allow_dev_auth_bypass: "false"
    api_cpu_request: 200m
    api_memory_request: 512Mi
    api_cpu_limit: 1000m
    api_memory_limit: 1Gi
    worker_cpu_request: 200m
    worker_memory_request: 512Mi
    worker_cpu_limit: 1000m
    worker_memory_limit: 1Gi
    hpa_api_min: 1
    hpa_api_max: 5
    hpa_worker_min: 1
    hpa_worker_max: 5
  - name: production
    branch: main
    namespace: opwerf
    subdomain_prefix: ""
    image_tag: "latest"
    api_replicas: "{{ 2 if tier in ['medium', 'production'] else 1 }}"
    worker_replicas: "{{ 2 if tier in ['medium', 'production'] else 1 }}"
    dashboard_replicas: "{{ 2 if tier in ['medium', 'production'] else 1 }}"
    node_env: production
    allow_dev_auth_bypass: "false"
    api_cpu_request: "{{ '200m' if tier in ['medium', 'production'] else '100m' }}"
    api_memory_request: "{{ '512Mi' if tier in ['medium', 'production'] else '256Mi' }}"
    api_cpu_limit: "{{ '1000m' if tier in ['medium', 'production'] else '500m' }}"
    api_memory_limit: "{{ '1Gi' if tier in ['medium', 'production'] else '512Mi' }}"
    worker_cpu_request: "{{ '200m' if tier in ['medium', 'production'] else '100m' }}"
    worker_memory_request: "{{ '512Mi' if tier in ['medium', 'production'] else '256Mi' }}"
    worker_cpu_limit: "{{ '1000m' if tier in ['medium', 'production'] else '500m' }}"
    worker_memory_limit: "{{ '1Gi' if tier in ['medium', 'production'] else '512Mi' }}"
    hpa_api_min: 2
    hpa_api_max: 20
    hpa_worker_min: 2
    hpa_worker_max: 10

opwerf_domain: "app.{{ domain }}"
opwerf_api_domain: "api.{{ domain }}"
opwerf_credential_proxy_replicas: 1

opwerf_db_name: "{{ opwerf_app_name }}"
opwerf_db_user: "{{ opwerf_app_name }}"
opwerf_pg_host: "{{ project_name | default('k8s') }}-pg-pgbouncer.databases.svc.cluster.local"
opwerf_pg_port: 5432

opwerf_dragonfly_host: dragonfly.dragonfly.svc.cluster.local
opwerf_dragonfly_port: 6379

opwerf_temporal_address: "temporal-frontend.temporal.svc.cluster.local:7233"
opwerf_temporal_namespace: "opwerf"

opwerf_minio_endpoint: "minio.storage.svc.cluster.local"
opwerf_minio_port: 9000
nopwerf_minio_bucket: "{{ opwerf_app_name }}-artifacts"
opwerf_minio_use_ssl: false

opwerf_elasticsearch_host: "elasticsearch.elasticsearch.svc.cluster.local"
opwerf_elasticsearch_port: 9200
opwerf_elasticsearch_scheme: https
opwerf_elasticsearch_user: elastic

opwerf_e2b_api_key: ""
opwerf_anthropic_api_key: ""

opwerf_credential_proxy_internal_token: ""
opwerf_encryption_key: ""
opwerf_encryption_salt: ""
opwerf_session_signing_key: ""

opwerf_image_registry: "registry.{{ domain }}/platform/opwerf"

opwerf_dashboard_cpu_request: 50m
opwerf_dashboard_memory_request: 64Mi
opwerf_dashboard_cpu_limit: 200m
opwerf_dashboard_memory_limit: 256Mi
