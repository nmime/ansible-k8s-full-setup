- name: Set OpenWerf base variables
  set_fact:
    opwerf_argocd_ns: argocd
    opwerf_gitlab_ns: gitlab
    pg_host: '{{ project_name | default("k8s") }}-pg-pgbouncer.databases.svc.cluster.local'
    opwerf_helm_repo_name: opwerf
    opwerf_helm_project: platform/opwerf
    opwerf_helm_repo_url: https://gitlab.{{ domain }}/platform/opwerf.git

- name: Generate OpenWerf secrets
  set_fact:
    opwerf_db_password_resolved: '{{ opwerf_db_password }}'
    opwerf_redis_password_resolved: '{{ opwerf_redis_password }}'
    opwerf_credential_proxy_token_resolved: '{{ opwerf_credential_proxy_token }}'
    opwerf_enc_key_resolved: '{{ opwerf_encryption_key }}'
    opwerf_enc_salt_resolved: '{{ opwerf_encryption_salt }}'
    opwerf_session_key_resolved: '{{ opwerf_session_signing_key }}'
  no_log: true

- name: Retrieve Percona-generated OpenWerf PG password
  kubernetes.core.k8s_info:
    kind: Secret
    namespace: databases
    name: '{{ project_name | default("k8s") }}-pg-pguser-{{ opwerf_db_user }}'
  register: opwerf_pg_secret
  until: opwerf_pg_secret.resources | length > 0
  retries: 30
  delay: 10
  failed_when: false

- name: Set resolved PG password
  set_fact:
    opwerf_pg_password_final: '{{ (opwerf_pg_secret.resources[0].data.password | b64decode) if opwerf_pg_secret.resources | length > 0 else opwerf_db_password_resolved }}'
  no_log: true

- name: Retrieve Elasticsearch credentials from cluster
  kubernetes.core.k8s_info:
    kind: Secret
    namespace: elasticsearch
    name: es-credentials
  register: es_elastic_secret
  failed_when: false
  retries: 10
  delay: 10
  until: es_elastic_secret.resources | length > 0

- name: Set Elasticsearch password fact
  set_fact:
    opwerf_elasticsearch_password: '{{ es_elastic_secret.resources[0].data.ELASTIC_PASSWORD | b64decode }}'
  when: es_elastic_secret.resources | length > 0
  no_log: true

- name: Wait for GitLab webservice to be ready
  kubernetes.core.k8s_info:
    kind: Deployment
    namespace: '{{ opwerf_gitlab_ns }}'
    label_selectors:
    - app=webservice
  register: gitlab_webservice
  until: 'gitlab_webservice.resources | length > 0 and (gitlab_webservice.resources[0].status.readyReplicas | default(0)) >= 1'
  retries: 60
  delay: 15
  failed_when: false

- name: Get GitLab root password
  kubernetes.core.k8s_info:
    kind: Secret
    namespace: '{{ opwerf_gitlab_ns }}'
    name: gitlab-gitlab-initial-root-password
  register: gitlab_root_secret
  retries: 5
  delay: 10
  until: gitlab_root_secret.resources | length > 0
  failed_when: false

- name: Set GitLab root password fact
  set_fact:
    gitlab_root_password: '{{ gitlab_root_secret.resources[0].data.password | b64decode }}'
  when: gitlab_root_secret.resources | length > 0
  no_log: true

- name: Ensure 'platform' group exists in GitLab
  ansible.builtin.uri:
    url: http://gitlab-webservice-default.{{ opwerf_gitlab_ns }}.svc.cluster.local:8181/api/v4/groups
    method: POST
    headers:
      Content-Type: application/json
      PRIVATE-TOKEN: '{{ gitlab_root_token | default("") }}'
    body_format: json
    body:
      name: platform
      path: platform
      visibility: private
    status_code:
    - 200
    - 201
    - 400
  register: gitlab_group_result
  when: gitlab_root_token is defined
  failed_when: 'gitlab_group_result.status not in [200, 201, 400]'

- name: Get 'platform' group ID
  ansible.builtin.uri:
    url: http://gitlab-webservice-default.{{ opwerf_gitlab_ns }}.svc.cluster.local:8181/api/v4/groups/platform
    method: GET
    headers:
      PRIVATE-TOKEN: '{{ gitlab_root_token | default("") }}'
    status_code:
    - 200
    - 404
  register: gitlab_group_info
  when: gitlab_root_token is defined
  failed_when: false

- name: Set platform group ID
  set_fact:
    platform_group_id: '{{ gitlab_group_info.json.id | default("") }}'
  when: gitlab_root_token is defined and gitlab_group_info.status == 200

- name: Create 'opwerf' project in platform group
  ansible.builtin.uri:
    url: http://gitlab-webservice-default.{{ opwerf_gitlab_ns }}.svc.cluster.local:8181/api/v4/projects
    method: POST
    headers:
      Content-Type: application/json
      PRIVATE-TOKEN: '{{ gitlab_root_token | default("") }}'
    body_format: json
    body:
      name: opwerf
      path: opwerf
      namespace_id: '{{ platform_group_id }}'
      visibility: private
      initialize_with_readme: true
    status_code:
    - 200
    - 201
    - 400
  register: gitlab_project_result
  when: gitlab_root_token is defined and platform_group_id is defined
  failed_when: 'gitlab_project_result.status not in [200, 201, 400]'

- name: Push Helm chart and CI config to GitLab repository
  ansible.builtin.shell: |
    set -e
    TMPDIR=$(mktemp -d)
    trap "rm -rf $TMPDIR" EXIT
    cp -r {{ role_path }}/files/helm/* "$TMPDIR/"
    cp {{ role_path }}/files/gitlab-ci.yml "$TMPDIR/.gitlab-ci.yml"
    cp -r {{ role_path }}/files/docker "$TMPDIR/docker"
    cp {{ role_path }}/files/README.md "$TMPDIR/README.md"
    cd "$TMPDIR"
    git config --global user.email "{{ email }}"
    git config --global user.name "Platform Bot"
    git init
    git checkout -b main
    git add .
    git commit -m "feat: OpenWerf Helm chart + CI/CD + Dockerfiles v1.1.0" --allow-empty
    git remote add origin https://root:{{ gitlab_root_password }}@gitlab.{{ domain }}/platform/opwerf.git
    git push --force origin main
    {% for env in opwerf_environments %}
    git checkout -b {{ env.branch }}
    git push --force origin {{ env.branch }}
    {% endfor %}
  when: gitlab_root_password is defined
  no_log: true
  register: helm_push_result
  failed_when: helm_push_result.rc != 0

- name: Configure GitLab branch protection for st and pp
  ansible.builtin.uri:
    url: "http://gitlab-webservice-default.{{ opwerf_gitlab_ns }}.svc.cluster.local:8181/api/v4/projects/{{ gitlab_project_result.json.id }}/protected_branches"
    method: POST
    headers:
      Content-Type: application/json
      PRIVATE-TOKEN: '{{ gitlab_root_token | default("") }}'
    body_format: json
    body:
      name: "{{ item }}"
      push_access_level: 0
      merge_access_level: 30
      allow_force_push: false
    status_code:
    - 200
    - 201
    - 409
  loop:
    - st
    - pp
  when: gitlab_root_token is defined and gitlab_project_result.json.id is defined
  failed_when: branch_protect_result.status not in [200, 201, 409]
  register: branch_protect_result

- name: Set CI_REGISTRY_IMAGE variable in GitLab project
  ansible.builtin.uri:
    url: "http://gitlab-webservice-default.{{ opwerf_gitlab_ns }}.svc.cluster.local:8181/api/v4/projects/{{ gitlab_project_result.json.id }}/variables"
    method: POST
    headers:
      Content-Type: application/json
      PRIVATE-TOKEN: '{{ gitlab_root_token | default("") }}'
    body_format: json
    body:
      key: "CI_REGISTRY_IMAGE"
      value: "{{ opwerf_image_registry }}/opwerf"
      environment_scope: "*"
    status_code:
    - 200
    - 201
    - 400
  when: gitlab_root_token is defined and gitlab_project_result.json.id is defined
  failed_when: ci_var_result.status not in [200, 201, 400]
  register: ci_var_result

- name: Deploy OpenWerf environments
  include_tasks: deploy_environment.yml
  loop: '{{ opwerf_environments }}'
  loop_control:
    loop_var: opwerf_env
    label: '{{ opwerf_env.name }}'

- name: Display OpenWerf deployment summary
  debug:
    msg: |
      ==========================================
        OpenWerf Multi-Environment Deployment Complete
      ==========================================
        Helm repo: {{ opwerf_helm_repo_url }}
      {% for env in opwerf_environments %}
        [{{ env.name }}] branch={{ env.branch }} ns={{ env.namespace }}
          Dashboard: https://{{ env.subdomain_prefix }}app.{{ domain }}
          API:       https://{{ env.subdomain_prefix }}api.{{ domain }}
      {% endfor %}
        Elasticsearch: {{ opwerf_elasticsearch_scheme }}://{{ opwerf_elasticsearch_host }}:{{ opwerf_elasticsearch_port }} (cluster)
        Monitor in ArgoCD: https://argocd.{{ domain }}/applications
      ==========================================

- name: Create OpenWerf API ServiceMonitor
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: monitoring.coreos.com/v1
      kind: ServiceMonitor
      metadata:
        name: opwerf-api
        namespace: '{{ item.namespace }}'
        labels:
          release: prometheus
      spec:
        selector:
          matchLabels:
            app.kubernetes.io/component: api
        endpoints:
        - port: http
          interval: 30s
          path: /metrics
  loop: '{{ opwerf_environments }}'
  loop_control:
    label: '{{ item.name }}'
