---
# MinIO S3-Compatible Storage Role - Official MinIO Helm Chart 5.4.0
# S3-compatible object storage on Kubernetes using official MinIO chart from charts.min.io
# Supports standalone (minimal/small) and distributed (medium/production) modes

- name: Set MinIO tier-specific variables
  set_fact:
    minio_ns: "storage"
    minio_chart_ver: "5.4.0"
    minio_mode: "{{ 'distributed' if tier in ['medium', 'production'] else 'standalone' }}"
    minio_replicas_count: "{{ minio_replicas | default(4) if tier in ['medium', 'production'] else 1 }}"
    minio_storage: "{{ minio_storage_size | default('50Gi') }}"
    minio_console_domain: "minio.{{ domain }}"
    minio_api_domain: "s3.{{ domain }}"

# ============================================
# MinIO Installation via Bitnami Helm
# ============================================

- name: Create storage namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ minio_ns }}"
        labels:
          app.kubernetes.io/part-of: minio
          pod-security.kubernetes.io/enforce: baseline
          pod-security.kubernetes.io/warn: restricted
  register: _r_create_storage_namespace
  retries: 3
  delay: 10
  until: _r_create_storage_namespace is not failed

- name: Add official MinIO Helm repository
  kubernetes.core.helm_repository:
    name: minio-charts
    repo_url: "https://charts.min.io/"
  register: _r_add_official_minio_helm_repository
  retries: 3
  delay: 10
  until: _r_add_official_minio_helm_repository is not failed

- name: Install MinIO via official Helm chart
  kubernetes.core.helm:
    name: minio
    chart_ref: minio-charts/minio
    chart_version: "{{ minio_chart_ver }}"
    release_namespace: "{{ minio_ns }}"
    create_namespace: true
    release_state: present
    wait: true
    timeout: 10m0s
    values:
      mode: "{{ minio_mode }}"
      replicas: "{{ minio_replicas_count }}"
      rootUser: "{{ minio_root_user }}"
      rootPassword: "{{ minio_root_password }}"
      persistence:
        enabled: true
        size: "{{ minio_storage }}"
        storageClass: "{{ storage_class | default('hcloud-volumes') }}"
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: false
      resources:
        requests:
          memory: "512Mi"
          cpu: "250m"
      service:
        type: ClusterIP
      consoleService:
        type: ClusterIP
      serviceAccount:
        create: true
      buckets:
          - name: gitlab-artifacts
            policy: none
          - name: gitlab-uploads
            policy: none
          - name: gitlab-packages
            policy: none
          - name: gitlab-registry
            policy: none
          - name: gitlab-lfs
            policy: none
          - name: gitlab-terraform-state
            policy: none
          - name: gitlab-ci-secure-files
            policy: none
          - name: gitlab-dependency-proxy
            policy: none
          - name: gitlab-pages
            policy: none
          - name: gitlab-backups
            policy: none
          - name: gitlab-tmp
            policy: none
          - name: loki-chunks
            policy: none
          - name: loki-ruler
            policy: none
          - name: loki-admin
            policy: none
          - name: backups
            policy: none
          - name: velero
            policy: none
          - name: "{{ app_name | default('myapp') }}-uploads"
            policy: none
  register: _r_install_minio_via_official_helm_chart
  retries: 3
  delay: 10
  until: _r_install_minio_via_official_helm_chart is not failed

- name: Wait for MinIO to be ready
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: "{{ minio_ns }}"
    label_selectors:
      - app=minio
  register: minio_pods
  until: >
    minio_pods.resources | length > 0
    and (minio_pods.resources | selectattr('status.phase', 'equalto', 'Running') | list | length) >= 1
  retries: 30
  delay: 10

# ============================================
# Gateway API Routes
# ============================================

- name: Create MinIO Console TLS certificate
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cert-manager.io/v1
      kind: Certificate
      metadata:
        name: minio-console-tls
        namespace: "{{ minio_ns }}"
      spec:
        secretName: minio-console-tls
        issuerRef:
          name: letsencrypt-prod
          kind: ClusterIssuer
        dnsNames:
          - "{{ minio_console_domain }}"
  register: _r_create_minio_console_tls_certificate
  retries: 3
  delay: 10
  until: _r_create_minio_console_tls_certificate is not failed

- name: Create MinIO API TLS certificate
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cert-manager.io/v1
      kind: Certificate
      metadata:
        name: minio-api-tls
        namespace: "{{ minio_ns }}"
      spec:
        secretName: minio-api-tls
        issuerRef:
          name: letsencrypt-prod
          kind: ClusterIssuer
        dnsNames:
          - "{{ minio_api_domain }}"
  register: _r_create_minio_api_tls_certificate
  retries: 3
  delay: 10
  until: _r_create_minio_api_tls_certificate is not failed

- name: Create MinIO Console HTTPRoute (VPN-only via admin-gateway)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: minio-console
        namespace: "{{ minio_ns }}"
      spec:
        parentRefs:
          - name: admin-gateway
            namespace: cilium-system
            sectionName: https
        hostnames:
          - "{{ minio_console_domain }}"
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - name: minio
                port: 9001
  register: _r_create_minio_console_httproute_vpn_only_
  retries: 3
  delay: 10
  until: _r_create_minio_console_httproute_vpn_only_ is not failed

- name: Create MinIO API HTTPRoute (public S3)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: minio-api
        namespace: "{{ minio_ns }}"
      spec:
        parentRefs:
          - name: main-gateway
            namespace: cilium-system
            sectionName: https
        hostnames:
          - "{{ minio_api_domain }}"
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - name: minio
                port: 9000

# ============================================
# Cross-namespace access secrets
# ============================================
  register: _r_create_minio_api_httproute_public_s3
  retries: 3
  delay: 10
  until: _r_create_minio_api_httproute_public_s3 is not failed

- name: Create MinIO credentials in GitLab namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: minio-credentials
        namespace: gitlab
      stringData:
        accesskey: "{{ minio_root_user }}"
        secretkey: "{{ minio_root_password }}"
        connection: |
          provider: AWS
          region: us-east-1
          aws_access_key_id: {{ minio_root_user }}
          aws_secret_access_key: {{ minio_root_password }}
          aws_signature_version: 4
          host: minio.{{ minio_ns }}.svc.cluster.local
          endpoint: http://minio.{{ minio_ns }}.svc.cluster.local:9000
          path_style: true
  register: _r_create_minio_credentials_in_gitlab_names
  retries: 3
  delay: 10
  until: _r_create_minio_credentials_in_gitlab_names is not failed
  no_log: true

- name: Create MinIO credentials in monitoring namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: minio-credentials
        namespace: monitoring
      stringData:
        accesskey: "{{ minio_root_user }}"
        secretkey: "{{ minio_root_password }}"
        endpoint: "http://minio.{{ minio_ns }}.svc.cluster.local:9000"
  register: _r_create_minio_credentials_in_monitoring_n
  retries: 3
  delay: 10
  until: _r_create_minio_credentials_in_monitoring_n is not failed
  no_log: true

- name: Display MinIO storage summary
  debug:
    msg:
      - "=========================================="
      - "  MinIO S3 Storage Deployed"
      - "=========================================="
      - "  Chart: minio-charts/minio {{ minio_chart_ver }}"
      - "  Image: quay.io/minio/minio (official chart)"
      - "  Mode: {{ minio_mode }}"
      - "  Replicas: {{ minio_replicas_count }}"
      - "  Storage: {{ minio_storage }} per node"
      - "  Console: {{ minio_console_domain }}"
      - "  S3 API: {{ minio_api_domain }}"
      - "  Buckets: gitlab-*, loki-*, backups, velero"
      - "=========================================="
