- name: Discover the in-cluster GitLab Shell service for component-only runs
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Service
    namespace: '{{ gitlab_namespace | default("gitlab") }}'
    name: gitlab-gitlab-shell
  register: argocd_gitlab_shell_service
  retries: 30
  delay: 5
  until:
    - argocd_gitlab_shell_service.resources | default([]) | length == 1
    - >-
      argocd_gitlab_shell_service.resources[0].spec.clusterIP |
      default('') | length > 0

- name: Record the in-cluster GitLab Shell address for Argo CD
  ansible.builtin.set_fact:
    gitlab_shell_cluster_ip: >-
      {{ argocd_gitlab_shell_service.resources[0].spec.clusterIP }}

- name: Set ArgoCD tier-specific variables
  set_fact:
    argocd_namespace: argocd
    argocd_chart_version: 9.5.14
    argocd_version: v3.4.2
    argocd_domain: "{{ gitops.domain | default('argocd.' ~ domain, true) }}"
    argocd_ha: '{{ gitops.ha_enabled | default(argocd_ha_enabled | default(true if resource_tier in [''medium'', ''production''] else false)) }}'
    argocd_server_replicas: '{{ gitops.server_replicas | default(2 if resource_tier in [''medium'', ''production''] else 1) }}'
    argocd_repo_replicas: '{{ gitops.repo_replicas | default(2 if resource_tier in [''medium'', ''production''] else 1) }}'
    argocd_controller_replicas: '{{ gitops.controller_replicas | default(2 if resource_tier in [''medium'', ''production''] else 1) }}'
    argocd_insecure_mode_effective: >-
      {{ gitops.insecure_mode |
         default(argocd_insecure_mode | default(false)) | bool }}
    argocd_repo_host_aliases: >-
      {{ [{'ip': gitlab_shell_cluster_ip,
           'hostnames': ([gitlab.domain | default('git.' ~ domain, true)] +
                         (gitlab.domain_aliases |
                          default([], true)) |
                         unique | list)}]
         if gitlab_shell_cluster_ip is defined else [] }}
- name: Set ArgoCD compatibility domains
  ansible.builtin.set_fact:
    argocd_domain_aliases: >-
      {{ gitops.domain_aliases | default([], true) |
         reject('equalto', argocd_domain) | unique | list }}
- name: Create ArgoCD namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: argocd
        labels:
          app.kubernetes.io/part-of: argocd
          gateway.n0xeid.xyz/n0xeid-route: 'true'
          pod-security.kubernetes.io/enforce: baseline
          pod-security.kubernetes.io/warn: restricted
  register: _r_create_argocd_namespace
  retries: 3
  delay: 10
  until: _r_create_argocd_namespace is not failed
- name: Read GitLab Shell public host keys for Argo CD
  no_log: true
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    namespace: '{{ gitlab_namespace | default("gitlab") }}'
    name: gitlab-gitlab-shell-host-keys
  register: _argocd_gitlab_shell_host_keys
  when: gitlab_shell_cluster_ip is defined
- name: Build GitLab Shell known-host entries
  no_log: true
  ansible.builtin.set_fact:
    argocd_gitlab_ssh_known_hosts: |
      {% set hostnames = [gitlab.domain | default('git.' ~ domain, true)] +
                         (gitlab.domain_aliases | default([], true)) %}
      {% set key_names = ['ssh_host_ecdsa_key.pub',
                          'ssh_host_ed25519_key.pub',
                          'ssh_host_rsa_key.pub'] %}
      {% for hostname in hostnames | unique %}
      {% for key_name in key_names %}
      {{ hostname }} {{ _argocd_gitlab_shell_host_keys.resources[0].data[key_name] | b64decode | trim }}
      {% endfor %}
      {% endfor %}
  when:
    - gitlab_shell_cluster_ip is defined
    - _argocd_gitlab_shell_host_keys.resources | default([]) | length == 1
- name: Allow Argo CD repository egress to GitLab Shell
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: allow-repo-server-to-gitlab-shell
        namespace: '{{ argocd_namespace }}'
      spec:
        podSelector:
          matchLabels:
            app.kubernetes.io/name: argocd-repo-server
        policyTypes:
          - Egress
        egress:
          - to:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: '{{ gitlab_namespace | default("gitlab") }}'
                podSelector:
                  matchLabels:
                    app: gitlab-shell
            ports:
              - port: 2222
                protocol: TCP
  when: gitlab_shell_cluster_ip is defined
- name: Allow Argo CD repository egress in the Cilium policy plane
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: allow-repo-server-to-gitlab-shell
        namespace: '{{ argocd_namespace }}'
      spec:
        endpointSelector:
          matchLabels:
            app.kubernetes.io/name: argocd-repo-server
        egress:
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: '{{ gitlab_namespace | default("gitlab") }}'
                  k8s:app: gitlab-shell
            toPorts:
              - ports:
                  - port: '2222'
                    protocol: TCP
  when: gitlab_shell_cluster_ip is defined
- name: Add Argo Helm repository
  kubernetes.core.helm_repository:
    name: argo
    repo_url: https://argoproj.github.io/argo-helm
  register: _r_add_argo_helm_repository
  retries: 3
  delay: 10
  until: _r_add_argo_helm_repository is not failed
- name: Install ArgoCD with Helm
  kubernetes.core.helm:
    name: argocd
    chart_ref: argo/argo-cd
    chart_version: '{{ argocd_chart_version }}'
    release_namespace: '{{ argocd_namespace }}'
    create_namespace: true
    release_state: present
    # Helm 4 uses server-side apply. Reclaim fields written by the legacy
    # kubectl bootstrap before reconciling chart-owned ConfigMaps and Secrets.
    force_conflicts: true
    wait: true
    timeout: 10m0s
    values:
      global:
        domain: '{{ argocd_domain }}'
        hostAliases: '{{ argocd_repo_host_aliases }}'
        securityContext:
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
      server:
        replicas: '{{ argocd_server_replicas | int }}'
        ingress:
          enabled: false
        extraArgs: '{{ ["--insecure"] if argocd_insecure_mode_effective | bool else [] }}'
        resources:
          requests:
            cpu: '{{ "25m" if resource_tier in ["minimal", "small"] else "100m" }}'
            memory: '{{ "96Mi" if resource_tier in ["minimal", "small"] else "256Mi" }}'
          limits:
            cpu: 500m
            memory: 512Mi
      controller:
        replicas: '{{ argocd_controller_replicas | int }}'
        resources:
          requests:
            cpu: '{{ "50m" if resource_tier in ["minimal", "small"] else "100m" }}'
            memory: '{{ "192Mi" if resource_tier in ["minimal", "small"] else "512Mi" }}'
          limits:
            cpu: 1000m
            memory: 1Gi
      repoServer:
        replicas: '{{ argocd_repo_replicas | int }}'
        resources:
          requests:
            cpu: '{{ "25m" if resource_tier in ["minimal", "small"] else "100m" }}'
            memory: '{{ "128Mi" if resource_tier in ["minimal", "small"] else "256Mi" }}'
          limits:
            cpu: 500m
            memory: 512Mi
      applicationSet:
        replicas: '{{ (2 if (argocd_ha | bool) else 1) | int }}'
        resources:
          requests:
            cpu: '{{ "25m" if resource_tier in ["minimal", "small"] else "100m" }}'
            memory: '{{ "64Mi" if resource_tier in ["minimal", "small"] else "128Mi" }}'
          limits:
            cpu: 200m
            memory: 256Mi
      redis:
        # The bundled single Redis is safe only for the non-HA profile. Argo
        # CD's HA mode must switch the client endpoint to the chart's
        # Redis/Sentinel/HAProxy subchart instead of merely scaling the API and
        # reconciliation pods around a single cache process.
        enabled: '{{ not (argocd_ha | bool) }}'
        resources:
          requests:
            cpu: '{{ "25m" if resource_tier in ["minimal", "small"] else "50m" }}'
            memory: '{{ "64Mi" if resource_tier in ["minimal", "small"] else "128Mi" }}'
          limits:
            cpu: 200m
            memory: 256Mi
      redis-ha:
        enabled: '{{ argocd_ha | bool }}'
        replicas: 3
        hardAntiAffinity: true
        podDisruptionBudget:
          maxUnavailable: 1
        redis:
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
        sentinel:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
        haproxy:
          enabled: true
          replicas: 3
          hardAntiAffinity: true
          podDisruptionBudget:
            maxUnavailable: 1
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
      notifications:
        enabled: true
        secret:
          create: true
          name: argocd-notifications-secret
          items: >-
            {{
              {
                'email-username': postal_smtp_auth_username,
                'email-password': postal_smtp_credentials['argocd']
              }
              if platform_postal_enabled | default(false) | bool
              else {}
            }}
        notifiers:
          service.email.postal: |
            username: $email-username
            password: $email-password
            host: '{{ postal_submission_hostname }}'
            port: 587
            from: argocd@{{ domain }}
            html: true
            insecure_skip_verify: false
        subscriptions: >-
          {{
            [{
              'recipients': ['postal:' ~ (alert_email_to | default('alerts@' ~ domain))],
              'triggers': ['on-health-degraded', 'on-sync-failed']
            }]
            if platform_postal_enabled | default(false) | bool
            else []
          }}
        templates:
          template.app-health-degraded: |
            {% raw %}
            email:
              subject: Application {{.app.metadata.name}} has degraded
            message: |
              Application {{.app.metadata.name}} is degraded.
              Details: {{.context.argocdUrl}}/applications/{{.app.metadata.name}}
            {% endraw %}
          template.app-sync-failed: |
            {% raw %}
            email:
              subject: Failed to sync application {{.app.metadata.name}}
            message: |
              Sync of {{.app.metadata.name}} failed: {{.app.status.operationState.message}}
              Details: {{.context.argocdUrl}}/applications/{{.app.metadata.name}}?operation=true
            {% endraw %}
        triggers:
          trigger.on-health-degraded: |
            - description: Application has degraded
              oncePer: app.status.operationState?.syncResult?.revision
              send: [app-health-degraded]
              when: app.status.health.status == 'Degraded'
          trigger.on-sync-failed: |
            - description: Application syncing has failed
              oncePer: app.status.operationState?.syncResult?.revision
              send: [app-sync-failed]
              when: app.status.operationState != nil and app.status.operationState.phase in ['Error', 'Failed']
        resources:
          requests:
            cpu: '{{ "10m" if resource_tier in ["minimal", "small"] else "50m" }}'
            memory: '{{ "64Mi" if resource_tier in ["minimal", "small"] else "128Mi" }}'
          limits:
            cpu: 100m
            memory: 128Mi
      dex:
        enabled: false
      configs:
        ssh:
          extraHosts: '{{ argocd_gitlab_ssh_known_hosts | default("") }}'
        cm:
          url: https://{{ argocd_domain }}
          admin.enabled: 'true'
          exec.enabled: 'false'
          application.resourceTrackingMethod: annotation
        params:
          server.insecure: '{{ argocd_insecure_mode_effective | lower }}'
        rbac:
          policy.default: role:readonly
          policy.csv: 'g, admin, role:admin

            '
  register: _r_install_argocd_with_helm
  retries: 3
  delay: 10
  until: _r_install_argocd_with_helm is not failed
- name: Create ArgoCD Gateway API HTTPRoute (VPN-only via admin-gateway)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: argocd-server
        namespace: '{{ argocd_namespace }}'
      spec:
        parentRefs:
        - name: admin-gateway
          namespace: cilium-system
          sectionName: https
        - name: admin-gateway
          namespace: cilium-system
          sectionName: cluster-https
        hostnames: '{{ [argocd_domain] + argocd_domain_aliases }}'
        rules:
        - matches:
          - path:
              type: PathPrefix
              value: /
          backendRefs:
          - name: argocd-server
            port: 80
  register: _r_create_argocd_gateway_api_httproute_vpn_
  retries: 3
  delay: 10
  until: _r_create_argocd_gateway_api_httproute_vpn_ is not failed
- name: Create ArgoCD public HTTPRoute on main-gateway (reachable without VPN)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: argocd-server-public
        namespace: '{{ argocd_namespace }}'
        labels:
          app.kubernetes.io/name: argocd-server-public
          app.kubernetes.io/part-of: argocd
      spec:
        parentRefs:
        - name: main-gateway
          namespace: cilium-system
          sectionName: https
        hostnames: '{{ [argocd_domain] }}'
        rules:
        - matches:
          - path:
              type: PathPrefix
              value: /
          backendRefs:
          - name: argocd-server
            port: 80
  when: argocd_public_route_enabled | default(true) | bool
  register: _r_create_argocd_public_httproute
  retries: 3
  delay: 10
  until: _r_create_argocd_public_httproute is not failed
- name: Create TLS Certificate for ArgoCD
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cert-manager.io/v1
      kind: Certificate
      metadata:
        name: argocd-tls
        namespace: cilium-secrets
      spec:
        secretName: argocd-tls
        issuerRef:
          name: '{{ cert_manager_cluster_issuer }}'
          kind: ClusterIssuer
        dnsNames: '{{ [argocd_domain] + argocd_domain_aliases }}'
  register: _r_create_tls_certificate_for_argocd
  retries: 3
  delay: 10
  until: _r_create_tls_certificate_for_argocd is not failed
- name: Create default ArgoCD AppProject (locked down with explicit allowlists)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: argoproj.io/v1alpha1
      kind: AppProject
      metadata:
        name: platform
        namespace: '{{ argocd_namespace }}'
      spec:
        description: 'Platform applications (security-hardened: explicit source, destination, and resource allowlists)'
        sourceRepos: '{{ argocd_allowed_source_repos }}'
        destinations: >-
          {{ argocd_allowed_namespaces
             | map('community.general.dict_kv', 'namespace')
             | map('combine', {'server': 'https://kubernetes.default.svc'})
             | list }}
        clusterResourceWhitelist: '{{ argocd_allowed_cluster_resources }}'
        namespaceResourceWhitelist: '{{ argocd_allowed_namespace_resources }}'
  register: _r_create_default_argocd_appproject
  retries: 3
  delay: 10
  until: _r_create_default_argocd_appproject is not failed
- name: Create ApplicationSet for environments
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: argoproj.io/v1alpha1
      kind: ApplicationSet
      metadata:
        name: platform-apps
        namespace: '{{ argocd_namespace }}'
      spec:
        goTemplate: true
        goTemplateOptions:
        - missingkey=error
        generators:
        - git:
            repoURL: https://{{ gitlab.domain | default('gitlab.' ~ domain, true) }}/platform/deployments.git
            revision: HEAD
            directories:
            - path: envs/*/apps/*
        template:
          metadata:
            name: '{{ ''{{.path.basename}}'' }}-{{ ''{{index .path.segments 1}}'' }}'
            namespace: '{{ argocd_namespace }}'
          spec:
            project: platform
            source:
              repoURL: https://{{ gitlab.domain | default('gitlab.' ~ domain, true) }}/platform/deployments.git
              targetRevision: HEAD
              path: '{{ ''{{.path.path}}'' }}'
            destination:
              server: https://kubernetes.default.svc
              namespace: '{{ ''{{index .path.segments 1}}'' }}'
            syncPolicy:
              automated:
                prune: true
                selfHeal: true
              syncOptions:
              - CreateNamespace=true
  when: tier in ['medium', 'production']
  register: _r_create_applicationset_for_environments
  retries: 3
  delay: 10
  until: _r_create_applicationset_for_environments is not failed
- name: Display ArgoCD deployment info
  debug:
    msg:
    - ==========================================
    - '  ArgoCD Deployed Successfully'
    - '  HA Mode: {{ argocd_ha }}'
    - ==========================================
    - '  ArgoCD URL: https://{{ argocd_domain }}'
    - ''
    - '  Get admin password:'
    - '  kubectl get secret argocd-initial-admin-secret -n argocd -o jsonpath=''{.data.password}'' | base64 -d'
    - ==========================================
- name: Create ArgoCD admin password rotation CronJob
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: batch/v1
      kind: CronJob
      metadata:
        name: argocd-password-rotation
        namespace: '{{ argocd_namespace }}'
      spec:
        schedule: 0 0 1 * *
        jobTemplate:
          spec:
            template:
              spec:
                serviceAccountName: argocd-server
                containers:
                - name: rotate
                  image: "argoproj/argocd:{{ argocd_version }}"
                  command:
                  - sh
                  - -c
                  args:
                  - NEW_PASS=$(openssl rand -base64 32) && argocd account update-password --account admin --current-password $ARGOCD_ADMIN_PASSWORD --new-password $NEW_PASS && kubectl create secret generic
                    argocd-admin-password-$(date +%Y%m%d) -n argocd --from-literal=password=$NEW_PASS
                  env:
                  - name: ARGOCD_ADMIN_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: argocd-initial-admin-secret
                        key: password
                restartPolicy: OnFailure
  when: rotate_argocd_password | default(false) | bool
- name: Remove legacy invalid Cilium default-deny for ArgoCD namespace
  kubernetes.core.k8s:
    state: absent
    definition:
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: default-deny
        namespace: '{{ argocd_namespace }}'
- name: Create default-deny NetworkPolicy for ArgoCD namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: default-deny
        namespace: '{{ argocd_namespace }}'
      spec:
        podSelector: {}
        policyTypes:
        - Ingress
        - Egress
        ingress: []
        egress: []
- name: Allow ArgoCD server ingress from gateway (VPN)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: allow-argocd-ingress
        namespace: '{{ argocd_namespace }}'
      spec:
        endpointSelector:
          matchLabels:
            app.kubernetes.io/name: argocd-server
        ingress:
        - fromEntities:
          - cluster
          toPorts:
          - ports:
            - port: '8080'
              protocol: TCP
- name: Allow ArgoCD egress to Git repos and K8s API
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: allow-argocd-egress
        namespace: '{{ argocd_namespace }}'
      spec:
        endpointSelector: {}
        egress:
        - toEntities:
          - kube-apiserver
        - toFQDNs:
          - matchPattern: '*'
          toPorts:
          - ports:
            - port: '443'
              protocol: TCP
            - port: '22'
              protocol: TCP
            - port: '53'
              protocol: UDP
            - port: '587'
              protocol: TCP
- name: Create ArgoCD VMServiceScrape
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: operator.victoriametrics.com/v1beta1
      kind: VMServiceScrape
      metadata:
        name: argocd
        namespace: '{{ argocd_namespace }}'
        labels:
          release: prometheus
      spec:
        selector:
          matchLabels:
            app.kubernetes.io/name: argocd-server
        endpoints:
        - port: metrics
          interval: 30s
  when: platform_observability_enabled | default(false) | bool
