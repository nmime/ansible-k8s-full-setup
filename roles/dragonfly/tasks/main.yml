---
# Dragonfly Role - Redis-compatible in-memory store via Dragonfly Operator

- name: Set Dragonfly variables
  set_fact:
    df_ns: "{{ dragonfly_namespace }}"
    df_operator_ns: "dragonfly-operator-system"
    df_operator_ver: "{{ dragonfly_operator_version }}"
    df_image_ver: "{{ dragonfly_image_version }}"
    df_replicas: "{{ dragonfly_replicas }}"
    df_password: "{{ dragonfly_password }}"
    df_tls_mode: "{{ dragonfly_tls_mode }}"
    df_tls_port: "{{ dragonfly_tls_port | int }}"
    df_tls_proxy_revision: "{{ dragonfly_tls_proxy_revision | string }}"
    df_allow_plaintext_clients: "{{ dragonfly_allow_plaintext_clients | bool }}"
    storage_class: "{{ storage_class | default('hcloud-volumes') }}"
  no_log: true

- name: Validate the staged Dragonfly TLS mode
  ansible.builtin.assert:
    that:
      - df_tls_mode in ['disabled', 'proxy']
      - df_tls_port | int >= 1024
      - df_tls_port | int <= 65535
      - df_tls_port | int != 6379
      - dragonfly_tls_client_namespaces is sequence
      - dragonfly_tls_client_namespaces is not string
      - df_allow_plaintext_clients or df_tls_mode == 'proxy'
    fail_msg: >-
      Dragonfly TLS must be disabled or exposed through the parallel verified
      proxy listener on a distinct non-privileged port.

- name: Resolve Dragonfly client listener ports
  ansible.builtin.set_fact:
    df_client_ports: >-
      {{
        (
          ([6379] if df_allow_plaintext_clients else []) +
          ([df_tls_port | int] if df_tls_mode == 'proxy' else [])
        ) | unique | list
      }}

- name: Build Dragonfly NetworkPolicy listener ports
  ansible.builtin.set_fact:
    df_network_policy_ports: >-
      {{ (df_network_policy_ports | default([])) + [{'protocol': 'TCP', 'port': item | int}] }}
  loop: "{{ df_client_ports }}"

- name: Create Dragonfly namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ df_ns }}"
        labels:
          app.kubernetes.io/part-of: dragonfly
          pod-security.kubernetes.io/enforce: restricted
          pod-security.kubernetes.io/audit: restricted
          pod-security.kubernetes.io/warn: restricted
  register: _r_create_dragonfly_ns
  retries: 3
  delay: 10
  until: _r_create_dragonfly_ns is not failed

- name: Create Dragonfly TLS bootstrap issuer
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cert-manager.io/v1
      kind: Issuer
      metadata:
        name: dragonfly-tls-bootstrap
        namespace: "{{ df_ns }}"
      spec:
        selfSigned: {}
  when: df_tls_mode == 'proxy'

- name: Create Dragonfly client CA
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cert-manager.io/v1
      kind: Certificate
      metadata:
        name: dragonfly-client-ca
        namespace: "{{ df_ns }}"
      spec:
        isCA: true
        commonName: Dragonfly internal client CA
        secretName: dragonfly-client-ca
        duration: 87600h
        renewBefore: 8760h
        privateKey:
          algorithm: ECDSA
          size: 256
          rotationPolicy: Always
        issuerRef:
          name: dragonfly-tls-bootstrap
          kind: Issuer
  when: df_tls_mode == 'proxy'

- name: Wait for the Dragonfly client CA
  kubernetes.core.k8s_info:
    api_version: cert-manager.io/v1
    kind: Certificate
    namespace: "{{ df_ns }}"
    name: dragonfly-client-ca
  register: _dragonfly_client_ca_certificate
  retries: 30
  delay: 5
  until:
    - _dragonfly_client_ca_certificate.resources | length == 1
    - >-
      (_dragonfly_client_ca_certificate.resources[0].status.conditions | default([]) |
      selectattr('type', 'equalto', 'Ready') |
      selectattr('status', 'equalto', 'True') | list | length) == 1
  when: df_tls_mode == 'proxy'

- name: Create Dragonfly client CA issuer
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cert-manager.io/v1
      kind: Issuer
      metadata:
        name: dragonfly-client-ca
        namespace: "{{ df_ns }}"
      spec:
        ca:
          secretName: dragonfly-client-ca
  when: df_tls_mode == 'proxy'

- name: Issue the hostname-verifying Dragonfly server certificate
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cert-manager.io/v1
      kind: Certificate
      metadata:
        name: dragonfly-tls
        namespace: "{{ df_ns }}"
      spec:
        secretName: dragonfly-tls
        duration: 2160h
        renewBefore: 360h
        privateKey:
          algorithm: ECDSA
          size: 256
          rotationPolicy: Always
        usages:
          - digital signature
          - server auth
        dnsNames:
          - dragonfly-tls
          - dragonfly-tls.{{ df_ns }}
          - dragonfly-tls.{{ df_ns }}.svc
          - dragonfly-tls.{{ df_ns }}.svc.cluster.local
        issuerRef:
          name: dragonfly-client-ca
          kind: Issuer
  when: df_tls_mode == 'proxy'

- name: Wait for the Dragonfly server certificate
  kubernetes.core.k8s_info:
    api_version: cert-manager.io/v1
    kind: Certificate
    namespace: "{{ df_ns }}"
    name: dragonfly-tls
  register: _dragonfly_tls_certificate
  retries: 30
  delay: 5
  until:
    - _dragonfly_tls_certificate.resources | length == 1
    - >-
      (_dragonfly_tls_certificate.resources[0].status.conditions | default([]) |
      selectattr('type', 'equalto', 'Ready') |
      selectattr('status', 'equalto', 'True') | list | length) == 1
  when: df_tls_mode == 'proxy'

- name: Create Dragonfly TLS proxy configuration
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: dragonfly-tls-proxy
        namespace: "{{ df_ns }}"
      data:
        haproxy.cfg: |
          global
            log stdout format raw local0

          defaults
            log global
            mode tcp
            option tcplog
            timeout connect 5s
            timeout client 1h
            timeout server 1h

          frontend redis_tls
            bind :{{ df_tls_port }} ssl crt /run/dragonfly-tls/server.pem ssl-min-ver TLSv1.2
            default_backend redis_plaintext_loopback

          backend redis_plaintext_loopback
            server dragonfly 127.0.0.1:6379 check
  when: df_tls_mode == 'proxy'

- name: Build the parallel Dragonfly TLS proxy pod template
  ansible.builtin.set_fact:
    _dragonfly_tls_proxy_containers:
      - name: tls-proxy
        image: "{{ dragonfly_tls_proxy_image }}"
        imagePullPolicy: IfNotPresent
        command: [/bin/sh, -ec]
        args:
          - |
            umask 077
            proxy_pid=''
            terminate() {
              test -z "$proxy_pid" || kill -TERM "$proxy_pid" 2>/dev/null || true
              test -z "$proxy_pid" || wait "$proxy_pid" 2>/dev/null || true
              exit 0
            }
            trap terminate TERM INT
            while true; do
              certificate_hash="$(sha256sum /etc/dragonfly-tls/tls.crt /etc/dragonfly-tls/tls.key)"
              cat /etc/dragonfly-tls/tls.crt /etc/dragonfly-tls/tls.key > /run/dragonfly-tls/server.pem
              haproxy -W -db -f /etc/haproxy/haproxy.cfg &
              proxy_pid=$!
              while kill -0 "$proxy_pid" 2>/dev/null; do
                sleep 60 &
                wait $!
                next_hash="$(sha256sum /etc/dragonfly-tls/tls.crt /etc/dragonfly-tls/tls.key)"
                test "$next_hash" = "$certificate_hash" || break
              done
              if kill -0 "$proxy_pid" 2>/dev/null; then
                kill -TERM "$proxy_pid"
                wait "$proxy_pid" || true
              else
                wait "$proxy_pid"
                exit $?
              fi
              proxy_pid=''
            done
        ports:
          - name: redis-tls
            containerPort: "{{ df_tls_port | int }}"
            protocol: TCP
        readinessProbe:
          exec:
            command:
              - /bin/sh
              - -ec
              - pidof haproxy >/dev/null && nc -z 127.0.0.1 6379
          initialDelaySeconds: 2
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 6
        livenessProbe:
          exec:
            command:
              - /bin/sh
              - -ec
              - pidof haproxy >/dev/null && nc -z 127.0.0.1 6379
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 6
        resources:
          requests:
            cpu: 10m
            memory: 24Mi
          limits:
            cpu: 100m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        volumeMounts:
          - name: dragonfly-tls-certificate
            mountPath: /etc/dragonfly-tls
            readOnly: true
          - name: dragonfly-tls-proxy-config
            mountPath: /etc/haproxy
            readOnly: true
          - name: dragonfly-tls-work
            mountPath: /run/dragonfly-tls
    _dragonfly_tls_proxy_volumes:
      - name: dragonfly-tls-certificate
        secret:
          secretName: dragonfly-tls
      - name: dragonfly-tls-proxy-config
        configMap:
          name: dragonfly-tls-proxy
      - name: dragonfly-tls-work
        emptyDir: {}
    _dragonfly_tls_proxy_pod_metadata:
      annotations:
        platform.n0xeid.xyz/dragonfly-tls-proxy-revision: '{{ df_tls_proxy_revision }}'
  when: df_tls_mode == 'proxy'

- name: Download pinned Dragonfly Operator manifest
  ansible.builtin.get_url:
    url: "https://raw.githubusercontent.com/dragonflydb/dragonfly-operator/{{ df_operator_ver }}/manifests/dragonfly-operator.yaml"
    dest: "/tmp/dragonfly-operator-{{ df_operator_ver }}.yaml"
    checksum: "sha256:{{ dragonfly_operator_manifest_sha256 }}"
    mode: '0600'

- name: Install Dragonfly Operator via verified manifest
  kubernetes.core.k8s:
    state: present
    src: "/tmp/dragonfly-operator-{{ df_operator_ver }}.yaml"
  register: _r_install_dragonfly_operator
  retries: 3
  delay: 15
  until: _r_install_dragonfly_operator is not failed

- name: Wait for Dragonfly Operator to be ready
  kubernetes.core.k8s_info:
    kind: Deployment
    namespace: "{{ df_operator_ns }}"
    label_selectors:
      - control-plane=controller-manager
  register: df_operator_deploy
  until: >
    (df_operator_deploy.resources | default([])) | length > 0 and
    (df_operator_deploy.resources[0].status.readyReplicas | default(0) | int) >= 1
  retries: 30
  delay: 10

- name: Read the existing Dragonfly auth secret revision
  no_log: true
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    namespace: '{{ df_ns }}'
    name: dragonfly-auth
  register: _dragonfly_existing_auth

- name: Resolve desired and applied Dragonfly credential revisions
  no_log: true
  ansible.builtin.set_fact:
    _dragonfly_desired_credentials_hash: '{{ df_password | hash("sha256") }}'
    _dragonfly_applied_credentials_hash: >-
      {{
        _dragonfly_existing_auth.resources[0].metadata.annotations['platform.example.com/dragonfly-applied-credentials-hash']
        if _dragonfly_existing_auth.resources | length > 0 and
           'platform.example.com/dragonfly-applied-credentials-hash' in
             (_dragonfly_existing_auth.resources[0].metadata.annotations | default({}))
        else (df_password | hash('sha256') if _dragonfly_existing_auth.resources | length == 0 else '')
      }}

- name: Create Dragonfly auth secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: dragonfly-auth
        namespace: "{{ df_ns }}"
        labels:
          app.kubernetes.io/part-of: dragonfly
        annotations:
          platform.example.com/dragonfly-desired-credentials-hash: '{{ _dragonfly_desired_credentials_hash }}'
          platform.example.com/dragonfly-applied-credentials-hash: '{{ _dragonfly_applied_credentials_hash }}'
      type: Opaque
      stringData:
        password: "{{ df_password }}"
  no_log: true
  register: _r_create_dragonfly_auth_secret
  retries: 3
  delay: 10
  until: _r_create_dragonfly_auth_secret is not failed

- name: Reconcile Dragonfly snapshot storage growth without replacing claims
  ansible.builtin.include_tasks: ../../../playbooks/tasks/reconcile_statefulset_storage.yml
  vars:
    storage_reconcile_namespace: '{{ df_ns }}'
    storage_reconcile_statefulset: dragonfly
    storage_reconcile_claim: df
    storage_reconcile_desired: '{{ dragonfly_snapshot_storage }}'
    storage_reconcile_orphan: false

- name: Create Dragonfly instance
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: dragonflydb.io/v1alpha1
      kind: Dragonfly
      metadata:
        name: dragonfly
        namespace: "{{ df_ns }}"
        labels:
          app.kubernetes.io/part-of: dragonfly
      spec:
        image: "docker.dragonflydb.io/dragonflydb/dragonfly:{{ df_image_ver }}"
        replicas: "{{ df_replicas | int }}"
        additionalContainers: "{{ _dragonfly_tls_proxy_containers | default(omit) }}"
        additionalVolumes: "{{ _dragonfly_tls_proxy_volumes | default(omit) }}"
        podMetadata: "{{ _dragonfly_tls_proxy_pod_metadata | default(omit) }}"
        priorityClassName: "{{ dragonfly_priority_class_name }}"
        enableReplicationReadinessGate: "{{ (df_replicas | int) > 1 }}"
        nodeSelector: "{{ dragonfly_node_selector }}"
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchLabels:
                    app: dragonfly
                topologyKey: kubernetes.io/hostname
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: DoNotSchedule
            labelSelector:
              matchLabels:
                app: dragonfly
        authentication:
          passwordFromSecret:
            name: dragonfly-auth
            key: password
        resources:
          requests:
            cpu: "{{ dragonfly_cpu_request }}"
            memory: "{{ dragonfly_memory_request }}"
          limits:
            cpu: "{{ dragonfly_cpu_limit }}"
            memory: "{{ dragonfly_memory_limit }}"
        podSecurityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile:
            type: RuntimeDefault
        containerSecurityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
          readOnlyRootFilesystem: false
        snapshot:
          cron: "{{ dragonfly_snapshot_cron }}"
          persistentVolumeClaimSpec:
            accessModes: [ReadWriteOnce]
            storageClassName: "{{ storage_class }}"
            resources:
              requests:
                storage: "{{ dragonfly_snapshot_storage }}"
        args:
          - "--maxmemory={{ dragonfly_memory_limit }}"
          - "--proactor_threads=2"
        serviceSpec:
          type: ClusterIP
        pdb:
          minAvailable: "{{ 2 if (df_replicas | int) >= 3 else 1 }}"
  register: _r_create_dragonfly_instance
  retries: 3
  delay: 15
  until: _r_create_dragonfly_instance is not failed

- name: Restart Dragonfly OnDelete pods one at a time after credential changes
  ansible.builtin.shell: |
    set -euo pipefail
    for ordinal in $(seq 0 $(({{ df_replicas | int }} - 1))); do
      pod="dragonfly-${ordinal}"
      old_uid=$(kubectl get pod "$pod" -n {{ df_ns | quote }} -o jsonpath='{.metadata.uid}')
      kubectl delete pod "$pod" -n {{ df_ns | quote }} --wait=false
      replacement_ready=false
      for attempt in $(seq 1 60); do
        new_uid=$(kubectl get pod "$pod" -n {{ df_ns | quote }} \
          -o jsonpath='{.metadata.uid}' 2>/dev/null || true)
        ready=$(kubectl get pod "$pod" -n {{ df_ns | quote }} \
          -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null || true)
        if [[ -n "$new_uid" && "$new_uid" != "$old_uid" && "$ready" == True ]]; then
          replacement_ready=true
          break
        fi
        sleep 5
      done
      [[ "$replacement_ready" == true ]] || {
        echo "replacement pod $pod did not become Ready within 5 minutes" >&2
        exit 1
      }
    done
  args:
    executable: /bin/bash
  register: _dragonfly_credentials_rollout
  changed_when: true
  retries: 3
  delay: 15
  until: _dragonfly_credentials_rollout.rc == 0
  no_log: true
  when: _dragonfly_applied_credentials_hash != _dragonfly_desired_credentials_hash

- name: Mark the Dragonfly credential revision as applied
  no_log: true
  kubernetes.core.k8s:
    state: patched
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: dragonfly-auth
        namespace: '{{ df_ns }}'
        annotations:
          platform.example.com/dragonfly-applied-credentials-hash: '{{ _dragonfly_desired_credentials_hash }}'
  when: _dragonfly_applied_credentials_hash != _dragonfly_desired_credentials_hash

- name: Recreate Dragonfly controller after its desired storage update
  ansible.builtin.include_tasks: ../../../playbooks/tasks/reconcile_statefulset_storage.yml
  vars:
    storage_reconcile_namespace: '{{ df_ns }}'
    storage_reconcile_statefulset: dragonfly
    storage_reconcile_claim: df
    storage_reconcile_desired: '{{ dragonfly_snapshot_storage }}'
    storage_reconcile_wait: false

- name: Wait for Dragonfly to adopt the expanded claim template
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: StatefulSet
    namespace: '{{ df_ns }}'
    name: dragonfly
  register: _dragonfly_expanded_statefulset
  retries: 60
  delay: 5
  until:
    - _dragonfly_expanded_statefulset.resources | length == 1
    - _dragonfly_expanded_statefulset.resources[0].spec.volumeClaimTemplates[0].spec.resources.requests.storage == dragonfly_snapshot_storage
    - _dragonfly_expanded_statefulset.resources[0].status.readyReplicas | default(0) | int >= (df_replicas | int)

- name: Reconcile bound Dragonfly claims after operator adoption
  ansible.builtin.include_tasks: ../../../playbooks/tasks/reconcile_statefulset_storage.yml
  vars:
    storage_reconcile_namespace: '{{ df_ns }}'
    storage_reconcile_statefulset: dragonfly
    storage_reconcile_claim: df
    storage_reconcile_desired: '{{ dragonfly_snapshot_storage }}'
    storage_reconcile_orphan: false

- name: Roll Dragonfly pods one at a time onto the TLS proxy template
  ansible.builtin.shell: |
    set -euo pipefail
    for ordinal in $(seq 0 $(({{ df_replicas | int }} - 1))); do
      pod="dragonfly-${ordinal}"
      current_revision="$(kubectl get pod "$pod" -n {{ df_ns | quote }} \
        -o jsonpath='{.metadata.annotations.platform\.n0xeid\.xyz/dragonfly-tls-proxy-revision}' \
        2>/dev/null || true)"
      has_proxy="$(kubectl get pod "$pod" -n {{ df_ns | quote }} -o json \
        | jq -r 'any(.spec.containers[]; .name == "tls-proxy")')"
      if [[ "$current_revision" == {{ df_tls_proxy_revision | quote }} && "$has_proxy" == true ]]; then
        continue
      fi
      old_uid="$(kubectl get pod "$pod" -n {{ df_ns | quote }} -o jsonpath='{.metadata.uid}')"
      echo "rolling $pod onto Dragonfly TLS proxy revision {{ df_tls_proxy_revision }}"
      kubectl delete pod "$pod" -n {{ df_ns | quote }} --wait=false
      replacement_ready=false
      for attempt in $(seq 1 120); do
        pod_json="$(kubectl get pod "$pod" -n {{ df_ns | quote }} -o json 2>/dev/null || true)"
        if [[ -n "$pod_json" ]] && jq -e \
          --arg old_uid "$old_uid" \
          '.metadata.uid != $old_uid and
           .metadata.annotations["platform.n0xeid.xyz/dragonfly-tls-proxy-revision"] == {{ df_tls_proxy_revision | to_json }} and
           any(.status.containerStatuses[]?; .name == "tls-proxy" and .ready == true) and
           any(.status.conditions[]?; .type == "Ready" and .status == "True")' \
          <<<"$pod_json" >/dev/null; then
          replacement_ready=true
          break
        fi
        sleep 5
      done
      [[ "$replacement_ready" == true ]] || {
        echo "replacement pod $pod did not expose a Ready TLS proxy within 10 minutes" >&2
        exit 1
      }
    done
  args:
    executable: /bin/bash
  register: _dragonfly_tls_proxy_rollout
  changed_when: _dragonfly_tls_proxy_rollout.stdout | length > 0
  when: df_tls_mode == 'proxy'

- name: Create the hostname-verified Dragonfly TLS service
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: dragonfly-tls
        namespace: "{{ df_ns }}"
        labels:
          app.kubernetes.io/part-of: dragonfly
      spec:
        type: ClusterIP
        selector:
          app: dragonfly
          role: master
        ports:
          - name: redis-tls
            protocol: TCP
            port: "{{ df_tls_port | int }}"
            targetPort: redis-tls
  when: df_tls_mode == 'proxy'

- name: Discover existing Dragonfly consumer namespaces
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Namespace
  register: _df_cluster_namespaces

- name: Resolve existing Dragonfly consumer namespaces
  ansible.builtin.set_fact:
    df_existing_consumers: >-
      {{
        (
          ['production', 'postal', 'glitchtip', 'daytona', 'gitlab'] +
          (dragonfly_tls_client_namespaces if df_tls_mode == 'proxy' else [])
        ) | unique |
        intersect(_df_cluster_namespaces.resources |
        map(attribute='metadata.name') | list)
      }}

- name: Create allow-from-platform NetworkPolicies for Dragonfly
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: "allow-from-{{ item }}"
        namespace: "{{ df_ns }}"
      spec:
        podSelector: {}
        policyTypes: [Ingress]
        ingress:
          - from:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: "{{ item }}"
            ports: "{{ df_network_policy_ports }}"
  loop: "{{ df_existing_consumers }}"
  register: _r_create_df_netpols
  retries: 3
  delay: 10
  until: _r_create_df_netpols is not failed

- name: Resolve existing verified Dragonfly TLS consumers
  ansible.builtin.set_fact:
    df_existing_tls_consumers: >-
      {{ dragonfly_tls_client_namespaces |
      intersect(_df_cluster_namespaces.resources |
      map(attribute='metadata.name') | list) }}
  when: df_tls_mode == 'proxy'

- name: Retrieve the PostgreSQL endpoint, MongoDB, and Dragonfly client CAs
  no_log: true
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    namespace: "{{ item.namespace }}"
    name: "{{ item.name }}"
  loop:
    - namespace: databases
      name: "{{ databases.postgresql.service_alias }}-tls"
    - namespace: databases
      name: "{{ project_name | default('k8s') }}-pg-cluster-ca-cert"
    - namespace: databases
      name: "{{ databases.mongodb.service_alias }}-tls"
    - namespace: "{{ df_ns }}"
      name: dragonfly-client-ca
  register: _dragonfly_datastore_client_cas
  when:
    - df_tls_mode == 'proxy'
    - df_existing_tls_consumers | length > 0

- name: Build the combined verified datastore CA bundle
  no_log: true
  ansible.builtin.set_fact:
    _dragonfly_datastore_client_ca_bundle: |
      {{ _dragonfly_datastore_client_cas.results[0].resources[0].data['ca.crt'] | b64decode | trim }}
      {{ _dragonfly_datastore_client_cas.results[1].resources[0].data['ca.crt'] | b64decode | trim }}
      {{ _dragonfly_datastore_client_cas.results[2].resources[0].data['ca.crt'] | b64decode | trim }}
      {{ _dragonfly_datastore_client_cas.results[3].resources[0].data['tls.crt'] | b64decode | trim }}
  when:
    - df_tls_mode == 'proxy'
    - df_existing_tls_consumers | length > 0

- name: Publish the verified PostgreSQL endpoint, MongoDB, and Dragonfly client CA bundle
  no_log: true
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: datastore-client-ca
        namespace: "{{ item }}"
        labels:
          app.kubernetes.io/part-of: platform-datastores
      type: Opaque
      stringData:
        ca.crt: "{{ _dragonfly_datastore_client_ca_bundle }}"
  loop: "{{ df_existing_tls_consumers }}"
  when:
    - df_tls_mode == 'proxy'
    - df_existing_tls_consumers | length > 0

- name: Remove partial namespace-wide Dragonfly egress policies
  kubernetes.core.k8s:
    state: absent
    api_version: networking.k8s.io/v1
    kind: NetworkPolicy
    name: allow-egress-to-dragonfly
    namespace: "{{ item }}"
  loop: "{{ df_existing_consumers }}"
  register: _r_remove_df_consumer_netpols
  retries: 3
  delay: 10
  until: _r_remove_df_consumer_netpols is not failed

- name: Allow the blackbox exporter to probe verified Dragonfly TCP health
- name: Allow agents workloads to resolve DNS and reach Dragonfly
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: allow-agents-dragonfly
        namespace: agents
      spec:
        endpointSelector:
          matchExpressions:
            - key: k8s:app.kubernetes.io/name
              operator: In
              values: [steel-browser, social-agents]
        egress:
          - toEntities: [host]
            toPorts:
              - ports:
                  - { port: '53', protocol: UDP }
                  - { port: '53', protocol: TCP }
          - toCIDR: [169.254.25.10/32]
            toPorts:
              - ports:
                  - { port: '53', protocol: UDP }
                  - { port: '53', protocol: TCP }
          - toServices:
              - k8sService:
                  serviceName: dragonfly
                  namespace: "{{ df_ns }}"
            toPorts:
              - ports:
                  - { port: '6379', protocol: TCP }
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: "{{ df_ns }}"
                  k8s:app: dragonfly
            toPorts:
              - ports:
                  - { port: '6379', protocol: TCP }
  when: >-
    'agents' in (_df_cluster_namespaces.resources |
    map(attribute='metadata.name') | list)

- name: Allow consumers to egress to Dragonfly
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: allow-from-monitoring-blackbox
        namespace: "{{ df_ns }}"
      spec:
        podSelector:
          matchLabels:
            app: dragonfly
        policyTypes: [Ingress]
        ingress:
          - from:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: "{{ monitoring_namespace | default('monitoring') }}"
            ports:
              - protocol: TCP
                port: "{{ df_tls_port if df_tls_mode == 'proxy' else 6379 }}"

- name: Wait for Dragonfly pods to be ready
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: "{{ df_ns }}"
    label_selectors:
      - app=dragonfly
  register: df_pods
  until: >
    (df_pods.resources | default([])) | length == (df_replicas | int) and
    (df_pods.resources |
      selectattr('status.containerStatuses', 'defined') |
      map(attribute='status.containerStatuses') |
      flatten |
      selectattr('ready', 'equalto', true) |
      list | length) >= (df_replicas | int)
  retries: 60
  delay: 10

- name: Verify Dragonfly replicas occupy distinct nodes
  ansible.builtin.assert:
    that:
      - >-
        (df_pods.resources |
          map(attribute='spec.nodeName') |
          unique |
          list |
          length) == (df_replicas | int)
    fail_msg: >-
      Dragonfly replicas are not distributed one-per-node; refusing to accept
      a cache topology with a correlated node-failure boundary.
  when: df_replicas | int > 1

- name: Remove verified Dragonfly Operator manifest
  ansible.builtin.file:
    path: "/tmp/dragonfly-operator-{{ df_operator_ver }}.yaml"
    state: absent

- name: Remove legacy duplicate Dragonfly PodDisruptionBudget
  kubernetes.core.k8s:
    state: absent
    definition:
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata:
        name: dragonfly-pdb
        namespace: "{{ df_ns }}"

- name: Verify the operator-managed Dragonfly PodDisruptionBudget
  kubernetes.core.k8s_info:
    api_version: policy/v1
    kind: PodDisruptionBudget
    namespace: "{{ df_ns }}"
    name: dragonfly
  register: df_operator_pdb
  until: (df_operator_pdb.resources | default([])) | length == 1
  retries: 10
  delay: 5
  when: df_replicas | int > 1

- name: Display Dragonfly deployment summary
  debug:
    msg:
      - "=========================================="
      - "  Dragonfly Deployed (Redis-compatible)"
      - "=========================================="
      - "  Operator: {{ df_operator_ver }}"
      - "  Dragonfly: {{ df_image_ver }}"
      - "  Namespace: {{ df_ns }}"
      - "  Replicas: {{ df_replicas }}"
      - >-
        {{
          '  Plaintext compatibility endpoint: dragonfly.' ~ df_ns ~ '.svc.cluster.local:6379'
          if df_allow_plaintext_clients
          else '  Plaintext compatibility endpoint: blocked by NetworkPolicy'
        }}
      - >-
        {{
          '  Verified TLS endpoint: dragonfly-tls.' ~ df_ns ~ '.svc.cluster.local:' ~ (df_tls_port | string)
          if df_tls_mode == 'proxy'
          else '  Verified TLS endpoint: disabled'
        }}
      - "  Auth: password from dragonfly-auth secret"
      - "=========================================="
