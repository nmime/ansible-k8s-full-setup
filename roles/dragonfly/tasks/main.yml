---
# Dragonfly Role - Redis-compatible in-memory store via Dragonfly Operator
# Deploys Dragonfly Operator v1.5.0 + Dragonfly instance v1.37.2
# Drop-in Redis replacement with 25x better throughput

- name: Set Dragonfly variables
  set_fact:
    df_ns: "{{ dragonfly_namespace }}"
    df_operator_ns: "dragonfly-operator-system"
    df_operator_ver: "{{ dragonfly_operator_version }}"
    df_image_ver: "{{ dragonfly_image_version }}"
    df_replicas: "{{ dragonfly_replicas }}"
    df_password: "{{ opwerf_redis_password }}"
    storage_class: "{{ storage_class | default('hcloud-volumes') }}"

# ============================================
# Install Dragonfly Operator via manifest
# ============================================

- name: Install Dragonfly Operator via manifest
  kubernetes.core.k8s:
    state: present
    src: "https://raw.githubusercontent.com/dragonflydb/dragonfly-operator/{{ df_operator_ver }}/manifests/dragonfly-operator.yaml"
  register: _r_install_dragonfly_operator
  retries: 3
  delay: 15
  until: _r_install_dragonfly_operator is not failed

- name: Wait for Dragonfly Operator to be ready
  kubernetes.core.k8s_info:
    kind: Deployment
    namespace: "{{ df_operator_ns }}"
    label_selectors:
      - control-plane=controller-manager
  register: df_operator_deploy
  until: >
    df_operator_deploy.resources | length > 0 and
    (df_operator_deploy.resources[0].status.readyReplicas | default(0) | int) >= 1
  retries: 30
  delay: 10
  failed_when: false

# ============================================
# Create Dragonfly auth secret
# ============================================

- name: Create Dragonfly auth secret
  no_log: true
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: dragonfly-auth
        namespace: "{{ df_ns }}"
        labels:
          app.kubernetes.io/part-of: dragonfly
      type: Opaque
      stringData:
        password: "{{ df_password }}"
  no_log: true
  register: _r_create_dragonfly_auth_secret
  retries: 3
  delay: 10
  until: _r_create_dragonfly_auth_secret is not failed

# ============================================
# Deploy Dragonfly instance
# ============================================

- name: Create Dragonfly instance
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: dragonflydb.io/v1alpha1
      kind: Dragonfly
      metadata:
        name: dragonfly
        namespace: "{{ df_ns }}"
        labels:
          app.kubernetes.io/part-of: dragonfly
      spec:
        image: "docker.dragonflydb.io/dragonflydb/dragonfly:{{ df_image_ver }}"
        replicas: "{{ df_replicas | int }}"
        authentication:
          passwordFromSecret:
            name: dragonfly-auth
            key: password
        resources:
          requests:
            cpu: "{{ dragonfly_cpu_request }}"
            memory: "{{ dragonfly_memory_request }}"
          limits:
            cpu: "{{ dragonfly_cpu_limit }}"
            memory: "{{ dragonfly_memory_limit }}"
        snapshot:
          cron: "{{ dragonfly_snapshot_cron }}"
          persistentVolumeClaimSpec:
            accessModes:
              - ReadWriteOnce
            storageClassName: "{{ storage_class }}"
            resources:
              requests:
                storage: "{{ dragonfly_snapshot_storage }}"
        args:
          - "--maxmemory={{ dragonfly_memory_limit }}"
          - "--proactor_threads=2"
          - "--cluster_mode=emulated"
        serviceSpec:
          type: ClusterIP
        pdb:
          minAvailable: 1
  register: _r_create_dragonfly_instance
  retries: 3
  delay: 15
  until: _r_create_dragonfly_instance is not failed

# ============================================
# NetworkPolicies for Dragonfly
# ============================================

- name: Create allow-from-opwerf NetworkPolicy for Dragonfly
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: allow-from-opwerf
        namespace: "{{ df_ns }}"
      spec:
        podSelector: {}
        policyTypes:
          - Ingress
        ingress:
          - from:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: opwerf
            ports:
              - protocol: TCP
                port: 6379
  register: _r_create_df_opwerf_netpol
  retries: 3
  delay: 10
  until: _r_create_df_opwerf_netpol is not failed

- name: Create allow-from-production NetworkPolicy for Dragonfly
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: allow-from-production
        namespace: "{{ df_ns }}"
      spec:
        podSelector: {}
        policyTypes:
          - Ingress
        ingress:
          - from:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: production
            ports:
              - protocol: TCP
                port: 6379
  register: _r_create_df_production_netpol
  retries: 3
  delay: 10
  until: _r_create_df_production_netpol is not failed

- name: Create allow-from-postal NetworkPolicy for Dragonfly
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: allow-from-postal
        namespace: "{{ df_ns }}"
      spec:
        podSelector: {}
        policyTypes:
          - Ingress
        ingress:
          - from:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: postal
            ports:
              - protocol: TCP
                port: 6379
  register: _r_create_df_postal_netpol
  retries: 3
  delay: 10
  until: _r_create_df_postal_netpol is not failed

- name: Create allow-egress-to-dragonfly CiliumNetworkPolicy for opwerf
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: allow-egress-to-dragonfly
        namespace: opwerf
      spec:
        endpointSelector: {}
        egress:
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: dragonfly
            toPorts:
              - ports:
                  - port: "6379"
                    protocol: TCP
  register: _r_create_opwerf_dragonfly_cnp
  retries: 3
  delay: 10
  until: _r_create_opwerf_dragonfly_cnp is not failed
  failed_when: false

# ============================================
# Wait for Dragonfly to be ready
# ============================================

- name: Wait for Dragonfly pods to be ready
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: "{{ df_ns }}"
    label_selectors:
      - app=dragonfly
      - role=master
  register: df_pods
  until: >
    df_pods.resources | length > 0 and
    (df_pods.resources | selectattr('status.phase', 'equalto', 'Running') | list | length) >= 1
  retries: 30
  delay: 10
  failed_when: false

- name: Create PodDisruptionBudget for Dragonfly
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata:
        name: dragonfly-pdb
        namespace: "{{ df_ns }}"
      spec:
        minAvailable: 1
        selector:
          matchLabels:
            app: dragonfly
            app.kubernetes.io/part-of: dragonfly
  when: df_replicas | int > 1
  register: _r_create_dragonfly_pdb
  retries: 3
  delay: 10
  until: _r_create_dragonfly_pdb is not failed

- name: Display Dragonfly deployment summary
  debug:
    msg:
      - "=========================================="
      - "  Dragonfly Deployed (Redis-compatible)"
      - "=========================================="
      - "  Operator: {{ df_operator_ver }}"
      - "  Dragonfly: {{ df_image_ver }}"
      - "  Namespace: {{ df_ns }}"
      - "  Replicas: {{ df_replicas }}"
      - "  Endpoint: dragonfly.{{ df_ns }}.svc.cluster.local:6379"
      - "  Auth: password from dragonfly-auth secret"
      - "=========================================="

# ============================================
# PMM Monitoring for Dragonfly (Redis exporter)
# ============================================

- name: Deploy Redis Exporter for Dragonfly monitoring
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: dragonfly-redis-exporter
        namespace: "{{ df_ns }}"
        labels:
          app: dragonfly-redis-exporter
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: dragonfly-redis-exporter
        template:
          metadata:
            labels:
              app: dragonfly-redis-exporter
            annotations:
              prometheus.io/scrape: "true"
              prometheus.io/port: "9121"
              prometheus.io/path: "/metrics"
          spec:
            securityContext:
              runAsNonRoot: true
              runAsUser: 59000
              fsGroup: 59000
              seccompProfile:
                type: RuntimeDefault
            containers:
              - name: redis-exporter
                image: oliver006/redis_exporter:v1.68.0
                ports:
                  - containerPort: 9121
                    name: metrics
                env:
                  - name: REDIS_ADDR
                    value: "dragonfly.{{ df_ns }}.svc.cluster.local:6379"
                  - name: REDIS_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: dragonfly-auth
                        key: password
                  - name: REDIS_EXPORTER_SKIP_TLS_VERIFICATION
                    value: "true"
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                      - ALL
                  readOnlyRootFilesystem: true
                resources:
                  requests:
                    cpu: 10m
                    memory: 32Mi
                  limits:
                    cpu: 50m
                    memory: 64Mi
                readinessProbe:
                  httpGet:
                    path: /metrics
                    port: 9121
                  initialDelaySeconds: 10
                  periodSeconds: 10
  register: _r_deploy_dragonfly_redis_exporter
  retries: 3
  delay: 10
  until: _r_deploy_dragonfly_redis_exporter is not failed

- name: Create Service for Redis Exporter
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: dragonfly-redis-exporter
        namespace: "{{ df_ns }}"
        labels:
          app: dragonfly-redis-exporter
      spec:
        selector:
          app: dragonfly-redis-exporter
        ports:
          - name: metrics
            port: 9121
            targetPort: 9121
  register: _r_create_dragonfly_redis_exporter_service
  retries: 3
  delay: 10
  until: _r_create_dragonfly_redis_exporter_service is not failed

- name: Create VMServiceScrape for Dragonfly (VictoriaMetrics)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: operator.victoriametrics.com/v1beta1
      kind: VMServiceScrape
      metadata:
        name: dragonfly-redis-exporter
        namespace: "{{ df_ns }}"
      spec:
        selector:
          matchLabels:
            app: dragonfly-redis-exporter
        endpoints:
          - port: metrics
            interval: 30s
            path: /metrics
  register: _r_create_dragonfly_vmservicescrape
  retries: 3
  delay: 10
  until: _r_create_dragonfly_vmservicescrape is not failed
  failed_when: false
