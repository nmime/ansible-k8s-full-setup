---
dragonfly_namespace: dragonfly
dragonfly_operator_version: "v1.6.1"
dragonfly_operator_manifest_sha256: "5a7d65e8d0e1925a4a7a895fd2d6d2cbbb1d7adab5756d80c82f2210bb2434c5"
dragonfly_image_version: "v1.39.0"
dragonfly_replicas: "{{ dragonfly.replicas | default(2 if resource_tier in ['medium', 'production'] else 1) }}"
dragonfly_memory_request: "{{ dragonfly.memory_request | default('1Gi' if resource_tier in ['medium', 'production'] else '256Mi') }}"
dragonfly_memory_limit: "{{ dragonfly.memory_limit | default('2Gi' if resource_tier in ['medium', 'production'] else '512Mi') }}"
dragonfly_cpu_request: "{{ dragonfly.cpu_request | default('750m' if resource_tier in ['medium', 'production'] else '100m') }}"
dragonfly_cpu_limit: "{{ dragonfly.cpu_limit | default('1500m' if resource_tier in ['medium', 'production'] else '500m') }}"
dragonfly_snapshot_storage: "{{ dragonfly.snapshot_storage | default('20Gi' if resource_tier in ['medium', 'production'] else '10Gi') }}"
dragonfly_snapshot_cron: "*/30 * * * *"
dragonfly_priority_class_name: n0xeid-platform-critical
dragonfly_tls_mode: "{{ dragonfly.tls_mode | default('disabled') }}"
dragonfly_tls_port: "{{ dragonfly.tls_port | default(6380) }}"
dragonfly_tls_proxy_image: "{{ dragonfly.tls_proxy_image | default('haproxy:3.2.5-alpine') }}"
dragonfly_tls_proxy_revision: "{{ dragonfly.tls_proxy_revision | default('3') }}"
dragonfly_tls_client_namespaces: "{{ dragonfly.tls_client_namespaces | default([]) }}"
dragonfly_allow_plaintext_clients: "{{ dragonfly.allow_plaintext_clients | default(true) }}"
dragonfly_node_selector: >-
  {{
    dragonfly.node_selector |
    default({'node-role.kubernetes.io/worker': 'true'})
  }}
