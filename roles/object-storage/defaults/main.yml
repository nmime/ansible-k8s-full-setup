---
# SeaweedFS-backed S3-compatible object storage.
object_storage_enabled: true
object_storage_namespace: storage
object_storage_release_name: seaweedfs
object_storage_chart_repo_name: seaweedfs
object_storage_chart_repo_url: https://seaweedfs.github.io/seaweedfs/helm
object_storage_chart_ref: seaweedfs/seaweedfs
object_storage_chart_version: "4.25.1"

object_storage_storage_class: "{{ storage_class | default('hcloud-volumes') }}"
object_storage_master_storage_class: "{{ object_storage_storage_class }}"
object_storage_volume_storage_class: "{{ object_storage_storage_class }}"
object_storage_index_storage_class: "{{ object_storage_volume_storage_class }}"
object_storage_filer_storage_class: "{{ object_storage_storage_class }}"
object_storage_master_size: 4Gi
object_storage_volume_size: "{{ '20Gi' if resource_tier | default(tier) == 'minimal' else '40Gi' if resource_tier | default(tier) == 'small' else '100Gi' if resource_tier | default(tier) == 'medium' else '150Gi' }}"
object_storage_volume_min_free_space_percent: 8
object_storage_idx_size: 4Gi
object_storage_filer_size: 10Gi
object_storage_filer_node_selector: {}
object_storage_volume_cpu_request: 100m
object_storage_volume_cpu_limit: "1"
object_storage_volume_memory_request: 256Mi
object_storage_volume_memory_limit: 1Gi
object_storage_filer_cpu_request: 100m
object_storage_filer_cpu_limit: "1"
object_storage_filer_memory_request: 256Mi
object_storage_filer_memory_limit: 1Gi
# Keep enough logical-volume slots for the platform's S3 collections even on
# the 10Gi compact-storage profile. SeaweedFS auto-calculates the slot count
# from this limit and the physical filesystem capacity.
object_storage_volume_size_limit_mb: 256
object_storage_replicas: "{{ 3 if resource_tier | default(tier) in ['medium', 'production'] else 1 }}"
object_storage_volume_replicas: "{{ 3 if resource_tier | default(tier) in ['medium', 'production'] else 1 }}"
object_storage_filer_replicas: "{{ 2 if resource_tier | default(tier) in ['medium', 'production'] else 1 }}"
# Keep one additional copy on another volume server whenever the topology has
# enough servers. SeaweedFS otherwise defaults to 000 even with three pods.
object_storage_replication_placement: "{{ '001' if (object_storage_volume_replicas | int) > 1 else '000' }}"

object_storage_endpoint_hostport: "seaweedfs-filer.{{ object_storage_namespace | default('storage') }}.svc.cluster.local:8333"
object_storage_endpoint: "http://{{ object_storage_endpoint_hostport | default('seaweedfs-filer.storage.svc.cluster.local:8333') }}"
object_storage_console_domain: "{{ ('seaweedfs.' ~ (domain | default('', true))) if (domain | default('', true) | length > 0) else 'seaweedfs.local' }}"
object_storage_api_domain: "{{ ('s3.' ~ (domain | default('', true))) if (domain | default('', true) | length > 0) else 's3.local' }}"
object_storage_region: us-east-1
# Official AWS CLI v2 container used for neutral S3 bootstrap/smoke jobs.
# The docker.io amazon/aws-cli repository publishes latest/versioned tags; tag "2" is not published.
object_storage_aws_cli_image: amazon/aws-cli:2.34.48
# Matches the chart app version and supplies cp/cmp for offline index migration.
object_storage_index_migration_image: chrislusf/seaweedfs:4.25
# The quota enforcer uses SeaweedFS 4.25's native s3.bucket.quota commands.
# Pin the multi-architecture index so this privileged storage-control job cannot
# drift independently from the audited server release.
object_storage_policy_image: chrislusf/seaweedfs@sha256:c42a5268ca13fcb65e0fae925886b107f4bf294d8db15e1be5509d55104eb509
object_storage_managed_bucket_policies_enabled: true
object_storage_managed_bucket_policy_supported_chart_versions:
  - "4.25.1"
object_storage_quota_enforcement_schedule: "*/5 * * * *"
# Cache churn is bursty during protected image releases. Reconcile expiry every
# hour so the bounded runner-cache quota cannot remain read-only for a full
# six-hour maintenance interval after a normal release burst.
object_storage_retention_prune_schedule: "23 * * * *"
object_storage_stale_multipart_cleanup_schedule: "17 */6 * * *"
object_storage_volume_reclaim_schedule: "{{ object_storage_volume_vacuum_schedule | default('43 1 * * *') }}"
# GitLab keeps one current backup archive, but S3 metadata deletion can leave
# old replicated needles behind in the dedicated SeaweedFS collection. Reclaim
# only chunks that have been unreachable for three days, then compact only that
# collection at SeaweedFS' conservative default 30% garbage threshold.
object_storage_gitlab_backup_orphan_reclaim_schedule: "43 5 * * 0"
object_storage_gitlab_backup_orphan_cutoff: "72h"
# SeaweedFS path TTL is stamped on new writes. The chart hook therefore applies
# these policies before Nx cache GitOps is enabled. Native bucket quotas provide
# a bounded logical-size target; the periodic enforcer switches an over-quota
# bucket read-only within one schedule interval.
object_storage_managed_bucket_policies:
  - name: nx-cache-protected
    ttl: 3d
    quota_mib: >-
      {{
        4096
        if resource_tier | default(tier | default('minimal')) == 'minimal'
        else 10240
        if resource_tier | default(tier | default('minimal')) == 'small'
        else 40960
        if resource_tier | default(tier | default('minimal')) == 'medium'
        else 61440
      }}
  - name: nx-cache-development
    ttl: 1d
    quota_mib: >-
      {{
        2048
        if resource_tier | default(tier | default('minimal')) == 'minimal'
        else 5120
        if resource_tier | default(tier | default('minimal')) == 'small'
        else 20480
        if resource_tier | default(tier | default('minimal')) == 'medium'
        else 30720
      }}
  - name: gitlab-runner-cache
    ttl: 2h
    quota_mib: >-
      {{
        24576
        if platform_profile | default('') == 'medium-optimized'
        else 8192
        if resource_tier | default(tier | default('minimal')) == 'minimal'
        else 16384
        if resource_tier | default(tier | default('minimal')) == 'small'
        else 32768
        if resource_tier | default(tier | default('minimal')) == 'medium'
        else 65536
      }}

# Quota-only buckets are deliberately separate from createBuckets/TTL policy.
# GitLab backup archives must never acquire an implicit expiry policy, while a
# bounded logical-size ceiling prevents replication 001 from filling all three
# local SeaweedFS volume hosts. The enforcer switches an over-quota bucket
# read-only; it never deletes an archive. medium-optimized keeps enough room
# for the retained 40 GiB archive and one complete replacement before the
# backup utility atomically removes the superseded archive.
object_storage_additional_bucket_quotas:
  - name: gitlab-backups
    quota_mib: >-
      {{
        92160
        if platform_profile | default('') == 'medium-optimized'
        else 4096
        if resource_tier | default(tier | default('minimal')) == 'minimal'
        else 16384
        if resource_tier | default(tier | default('minimal')) == 'small'
        else 40960
        if resource_tier | default(tier | default('minimal')) == 'medium'
        else 61440
      }}

# Credentials are generated and persisted by generate-secrets. The storage role
# fails closed when they are absent; repository-known fallback credentials are
# never accepted, including in non-production profiles.
object_storage_access_key: "{{ generated_object_storage_access_key | default('', true) }}"
object_storage_secret_key: "{{ generated_object_storage_secret_key | default('', true) }}"
object_storage_bootstrap_access_key: "{{ generated_object_storage_bootstrap_access_key | default('', true) }}"
object_storage_bootstrap_secret_key: "{{ generated_object_storage_bootstrap_secret_key | default('', true) }}"
object_storage_gitlab_access_key: "{{ generated_object_storage_gitlab_access_key | default('', true) }}"
object_storage_gitlab_secret_key: "{{ generated_object_storage_gitlab_secret_key | default('', true) }}"
object_storage_backup_access_key: "{{ generated_object_storage_backup_access_key | default('', true) }}"
object_storage_backup_secret_key: "{{ generated_object_storage_backup_secret_key | default('', true) }}"
object_storage_observability_access_key: "{{ generated_object_storage_observability_access_key | default('', true) }}"
object_storage_observability_secret_key: "{{ generated_object_storage_observability_secret_key | default('', true) }}"
object_storage_ci_cache_access_key: "{{ generated_object_storage_ci_cache_access_key | default('', true) }}"
object_storage_ci_cache_secret_key: "{{ generated_object_storage_ci_cache_secret_key | default('', true) }}"
object_storage_nx_cache_protected_access_key: "{{ generated_object_storage_nx_cache_protected_access_key | default('', true) }}"
object_storage_nx_cache_protected_secret_key: "{{ generated_object_storage_nx_cache_protected_secret_key | default('', true) }}"
object_storage_nx_cache_development_access_key: "{{ generated_object_storage_nx_cache_development_access_key | default('', true) }}"
object_storage_nx_cache_development_secret_key: "{{ generated_object_storage_nx_cache_development_secret_key | default('', true) }}"


object_storage_create_external_routes: true
object_storage_network_policy_enabled: true
# The backup verification CronJob uses the scoped backup S3 identity from this
# namespace. It needs only the filer S3 port, not access to SeaweedFS internals.
object_storage_backup_verification_namespace: backups

# Optional object storage credentials for consumer namespaces. Secrets are only
# created in namespaces that already exist so the role can be validated or used
# independently before GitLab/monitoring are installed.
object_storage_consumer_credential_secrets:
  - name: object-storage-credentials
    namespace: gitlab
    credential_group: gitlab
  - name: object-storage-credentials
    namespace: monitoring
    credential_group: observability

# Buckets are representative defaults for current S3-compatible consumers. String
# entries and dict entries with `name` are both supported by the bootstrap job.
object_storage_buckets:
  - gitlab-artifacts
  - gitlab-uploads
  - gitlab-packages
  - gitlab-registry
  - gitlab-lfs
  - gitlab-terraform-state
  - gitlab-ci-secure-files
  - gitlab-dependency-proxy
  - gitlab-mr-diffs
  - gitlab-agent-plan-content
  - gitlab-pages
  - gitlab-backups
  - gitlab-tmp
  - gitlab-runner-cache
  - loki-chunks
  - loki-ruler
  - loki-admin
  - backups
  - velero
  - tempo-traces
  - nx-cache-protected
  - nx-cache-development
  - name: "{{ app_name | default('myapp') }}-uploads"

# Static SeaweedFS IAM uses Action:bucket scoping. The bootstrap identity may
# create and verify only this declared bucket inventory; runtime identities
# never receive a global Admin action.
object_storage_gitlab_buckets:
  - gitlab-artifacts
  - gitlab-uploads
  - gitlab-packages
  - gitlab-registry
  - gitlab-lfs
  - gitlab-terraform-state
  - gitlab-ci-secure-files
  - gitlab-dependency-proxy
  - gitlab-mr-diffs
  - gitlab-agent-plan-content
  - gitlab-pages
  - gitlab-backups
  - gitlab-tmp
object_storage_observability_buckets:
  - loki-chunks
  - loki-ruler
  - loki-admin
  - tempo-traces
object_storage_backup_buckets:
  - backups
  - velero
object_storage_ci_cache_buckets:
  - gitlab-runner-cache
