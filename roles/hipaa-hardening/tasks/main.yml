---
- name: Explain compliance hardening scope
  ansible.builtin.debug:
    msg: >-
      HIPAA-oriented technical controls are enabled. This automation does not
      by itself establish HIPAA compliance; policies, agreements, access review,
      incident response, and a formal risk assessment remain required.
  when: hipaa_compliance | bool

- name: Verify Vault is configured for internal TLS
  ansible.builtin.assert:
    that:
      - not (vault_tls_disabled | bool)
      - vault_verify_tls | bool
    fail_msg: HIPAA mode requires Vault TLS and certificate verification.
  when: hipaa_compliance | bool

- name: Verify encrypted pod networking and active log-redaction selection
  ansible.builtin.assert:
    that:
      - kubernetes.features.encryption | default(true) | bool
      - not deploy_observability | bool or log_redaction_enabled | bool
    fail_msg: >-
      HIPAA-oriented mode requires Cilium transparent encryption and active
      log-collector redaction whenever observability is selected.
  when: hipaa_compliance | bool

- name: Display HIPAA-oriented control summary
  ansible.builtin.debug:
    msg:
      - 'HIPAA-oriented technical controls applied:'
      - '  - Vault TLS certificate verification enforced'
      - '  - Cilium transparent pod-network encryption required'
      - '  - Active Promtail/Filebeat/Fluentd redaction pipelines reconciled'
      - '  - auditd host rules reconciled by the network-security role'
      - 'Formal compliance validation is still required before regulated use.'
  when: hipaa_compliance | bool
