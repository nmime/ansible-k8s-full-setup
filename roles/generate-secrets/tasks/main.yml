---
# Generate Secrets Role - Centralized credential generation
# Generates all credentials ONCE and persists them to a local secrets file.
# On subsequent runs, existing credentials are loaded (never regenerated).

- name: Set secrets file path
  set_fact:
    secrets_file: "{{ playbook_dir }}/.platform-secrets.yml"

- name: Check for existing secrets file
  stat:
    path: "{{ secrets_file }}"
  register: secrets_file_stat
  delegate_to: localhost
  become: false

- name: Load existing secrets
  include_vars:
    file: "{{ secrets_file }}"
    name: saved_secrets
  when: secrets_file_stat.stat.exists

- name: Ensure saved_secrets is defined for first run
  set_fact:
    saved_secrets: "{{ saved_secrets | default({}) }}"

- name: Generate object storage credentials
  set_fact:
    generated_object_storage_access_key: "{{ lookup('env', 'OBJECT_STORAGE_ACCESS_KEY') | default(saved_secrets.object_storage_access_key | default(lookup('password', '/dev/null chars=ascii_lowercase,digits length=16')), true) }}"
    generated_object_storage_secret_key: "{{ lookup('env', 'OBJECT_STORAGE_SECRET_KEY') | default(saved_secrets.object_storage_secret_key | default(lookup('password', '/dev/null chars=ascii_letters,digits length=32')), true) }}"

- name: Generate platform credentials
  set_fact:
    generated_grafana_admin_user: "{{ saved_secrets.grafana_admin_user | default('admin') }}"
    generated_grafana_admin_password: "{{ saved_secrets.grafana_admin_password | default(lookup('password', '/dev/null chars=ascii_letters,digits length=24')) }}"
    generated_app_db_password: "{{ saved_secrets.app_db_password | default(lookup('password', '/dev/null chars=ascii_letters,digits length=32')) }}"
    generated_jwt_secret: "{{ saved_secrets.jwt_secret | default(lookup('password', '/dev/null chars=ascii_letters,digits length=64')) }}"
    generated_jwt_refresh_secret: "{{ saved_secrets.jwt_refresh_secret | default(lookup('password', '/dev/null chars=ascii_letters,digits length=64')) }}"
    generated_argocd_admin_password: "{{ saved_secrets.argocd_admin_password | default(lookup('password', '/dev/null chars=ascii_letters,digits length=24')) }}"
    generated_headscale_api_key: "{{ saved_secrets.headscale_api_key | default(lookup('password', '/dev/null chars=ascii_letters,digits length=48')) }}"
    generated_dragonfly_password: "{{ saved_secrets.dragonfly_password | default(lookup('password', '/dev/null chars=ascii_letters,digits length=32')) }}"
    generated_daytona_api_key: "{{ lookup('env', 'DAYTONA_API_KEY') | default(saved_secrets.daytona_api_key | default(lookup('password', '/dev/null chars=ascii_letters,digits length=48')), true) }}"
    generated_daytona_encryption_key: "{{ saved_secrets.daytona_encryption_key | default(lookup('password', '/dev/null chars=hex_digits length=64') | lower) }}"
    generated_es_superuser_password: "{{ saved_secrets.es_superuser_password | default(lookup('password', '/dev/null chars=ascii_letters,digits length=24')) }}"
    generated_postal_db_password: "{{ saved_secrets.postal_db_password | default(lookup('password', '/dev/null chars=ascii_letters,digits length=24')) }}"
    generated_postal_rails_secret: "{{ saved_secrets.postal_rails_secret | default(lookup('password', '/dev/null chars=hex_digits length=64') | lower) }}"
    generated_postal_admin_password: "{{ saved_secrets.postal_admin_password | default(lookup('password', '/dev/null chars=ascii_letters,digits length=16')) }}"

- name: Resolve alert notification credentials (Telegram + email)
  set_fact:
    generated_alert_telegram_bot_token: "{{ lookup('env', 'ALERT_TELEGRAM_BOT_TOKEN') | default(saved_secrets.alert_telegram_bot_token | default(''), true) }}"
    generated_alert_telegram_chat_id: "{{ lookup('env', 'ALERT_TELEGRAM_CHAT_ID') | default(saved_secrets.alert_telegram_chat_id | default(''), true) }}"
    generated_alert_email_to: "{{ lookup('env', 'ALERT_EMAIL_TO') | default(saved_secrets.alert_email_to | default('alerts@' + domain), true) }}"

- name: Set unified secret variables for all roles
  set_fact:
    object_storage_access_key: "{{ generated_object_storage_access_key }}"
    object_storage_secret_key: "{{ generated_object_storage_secret_key }}"
    grafana_admin_user: "{{ generated_grafana_admin_user }}"
    grafana_admin_password: "{{ generated_grafana_admin_password }}"
    app_db_password: "{{ generated_app_db_password }}"
    app_jwt_secret: "{{ generated_jwt_secret }}"
    app_refresh_secret: "{{ generated_jwt_refresh_secret }}"
    argocd_admin_password: "{{ generated_argocd_admin_password }}"
    headscale_api_key: "{{ generated_headscale_api_key }}"
    dragonfly_password: "{{ generated_dragonfly_password }}"
    daytona_api_key: "{{ generated_daytona_api_key }}"
    daytona_encryption_key: "{{ generated_daytona_encryption_key }}"
    es_superuser_password: "{{ generated_es_superuser_password }}"
    postal_db_password: "{{ generated_postal_db_password }}"
    postal_rails_secret: "{{ generated_postal_rails_secret }}"
    postal_admin_password: "{{ generated_postal_admin_password }}"
    alert_telegram_bot_token: "{{ generated_alert_telegram_bot_token }}"
    alert_telegram_chat_id: "{{ generated_alert_telegram_chat_id }}"
    alert_email_to: "{{ generated_alert_email_to }}"

- name: Save all generated secrets to file
  copy:
    content: |
      ---
      # Auto-generated platform secrets - DO NOT COMMIT TO GIT
      # Generated: {{ ansible_date_time.iso8601 | default('unknown') }}
      object_storage_access_key: "{{ object_storage_access_key }}"
      object_storage_secret_key: "{{ object_storage_secret_key }}"
      grafana_admin_user: "{{ grafana_admin_user }}"
      grafana_admin_password: "{{ grafana_admin_password }}"
      app_db_password: "{{ app_db_password }}"
      jwt_secret: "{{ app_jwt_secret }}"
      jwt_refresh_secret: "{{ app_refresh_secret }}"
      argocd_admin_password: "{{ argocd_admin_password }}"
      headscale_api_key: "{{ headscale_api_key }}"
      dragonfly_password: "{{ dragonfly_password }}"
      daytona_api_key: "{{ daytona_api_key }}"
      daytona_encryption_key: "{{ daytona_encryption_key }}"
      es_superuser_password: "{{ es_superuser_password }}"
      postal_db_password: "{{ postal_db_password }}"
      postal_rails_secret: "{{ postal_rails_secret }}"
      postal_admin_password: "{{ postal_admin_password }}"
      alert_telegram_bot_token: "{{ alert_telegram_bot_token }}"
      alert_telegram_chat_id: "{{ alert_telegram_chat_id }}"
      alert_email_to: "{{ alert_email_to }}"
    dest: "{{ secrets_file }}"
    mode: '0600'
  delegate_to: localhost
  become: false
  no_log: true

- name: Ensure secrets file is in .gitignore
  ansible.builtin.lineinfile:
    path: "{{ playbook_dir }}/../.gitignore"
    line: ".platform-secrets.yml"
    create: true
    mode: '0644'
  delegate_to: localhost
  become: false

- name: Display generated credentials summary
  debug:
    msg:
      - "============================================"
      - "  Platform Secrets Generated"
      - "============================================"
      - "  Secrets file: {{ secrets_file }}"
      - "  Object storage user: {{ object_storage_access_key }}"
      - "  Object storage password: ****"
      - "  Grafana user: {{ grafana_admin_user }}"
      - "  Grafana password: ****"
      - "  Dragonfly password: ****"
      - "  Daytona API key: {{ 'configured' if daytona_api_key | length > 0 else 'NOT SET' }}"
      - "  ES password: ****"
      - "  Postal admin: ****"
      - "  Alert Telegram: {{ 'configured' if alert_telegram_bot_token | length > 0 else 'NOT SET (silent)' }}"
      - "  Alert email to: {{ alert_email_to }}"
      - "============================================"
      - "  IMPORTANT: Back up {{ secrets_file }} securely!"
      - "============================================"
