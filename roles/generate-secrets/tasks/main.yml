- name: Save all generated secrets to file (Ansible Vault encrypted)
  block:
    - name: Write secrets to temporary unencrypted file
      copy:
        content: |
          ---
          # Auto-generated platform secrets - DO NOT COMMIT TO GIT
          # Generated: {{ ansible_facts.date_time.iso8601 | default('unknown') }}
          object_storage_access_key: "{{ object_storage_access_key }}"
          object_storage_secret_key: "{{ object_storage_secret_key }}"
          object_storage_bootstrap_access_key: "{{ object_storage_bootstrap_access_key }}"
          object_storage_bootstrap_secret_key: "{{ object_storage_bootstrap_secret_key }}"
          object_storage_gitlab_access_key: "{{ object_storage_gitlab_access_key }}"
          object_storage_gitlab_secret_key: "{{ object_storage_gitlab_secret_key }}"
          object_storage_backup_access_key: "{{ object_storage_backup_access_key }}"
          object_storage_backup_secret_key: "{{ object_storage_backup_secret_key }}"
          object_storage_observability_access_key: "{{ object_storage_observability_access_key }}"
          object_storage_observability_secret_key: "{{ object_storage_observability_secret_key }}"
          object_storage_ci_cache_access_key: "{{ object_storage_ci_cache_access_key }}"
          object_storage_ci_cache_secret_key: "{{ object_storage_ci_cache_secret_key }}"
          object_storage_nx_cache_protected_access_key: "{{ object_storage_nx_cache_protected_access_key }}"
          object_storage_nx_cache_protected_secret_key: "{{ object_storage_nx_cache_protected_secret_key }}"
          object_storage_nx_cache_development_access_key: "{{ object_storage_nx_cache_development_access_key }}"
          object_storage_nx_cache_development_secret_key: "{{ object_storage_nx_cache_development_secret_key }}"
          grafana_admin_user: "{{ grafana_admin_user }}"
          grafana_admin_password: "{{ grafana_admin_password }}"
          app_db_password: "{{ app_db_password }}"
          jwt_secret: "{{ app_jwt_secret }}"
          jwt_refresh_secret: "{{ app_refresh_secret }}"
          argocd_admin_password: "{{ argocd_admin_password }}"
          headscale_api_key: "{{ headscale_api_key }}"
          dragonfly_password: "{{ dragonfly_password }}"
          daytona_api_key: "{{ daytona_api_key }}"
          daytona_encryption_key: "{{ daytona_encryption_key }}"
          es_superuser_password: "{{ es_superuser_password }}"
          es_logging_ingest_password: "{{ es_logging_ingest_password }}"
          postal_db_password: "{{ postal_db_password }}"
          postal_rails_secret: "{{ postal_rails_secret }}"
          postal_admin_password: "{{ postal_admin_password }}"
          postal_smtp_credential: "{{ postal_smtp_credential }}"
          postal_smtp_credentials: {{ postal_smtp_credentials | to_json }}
          postal_signing_key: {{ postal_signing_key | to_json }}
          gitlab_runner_token: "{{ gitlab_runner_token }}"
          gitlab_image_builder_runner_token: "{{ gitlab_image_builder_runner_token }}"
          gitlab_docker_host_runner_token: "{{ gitlab_docker_host_runner_token }}"
          alert_telegram_bot_token: "{{ alert_telegram_bot_token }}"
          alert_telegram_chat_id: "{{ alert_telegram_chat_id }}"
          alert_email_to: "{{ alert_email_to }}"
          backup_dr_access_key: "{{ backup_dr_storage_access_key }}"
          backup_dr_secret_key: "{{ backup_dr_storage_secret_key }}"
          backup_dr_endpoint: "{{ backup_dr_storage_endpoint }}"
          backup_dr_region: "{{ backup_dr_storage_region }}"
          backup_dr_bucket: "{{ backup_dr_storage_bucket }}"
        dest: "{{ secrets_file }}.tmp"
        mode: '0600'
      delegate_to: localhost
      become: false
      no_log: true

    - name: Encrypt secrets file with Ansible Vault into a staged output
      ansible.builtin.command:
        argv:
          - ansible-vault
          - encrypt
          - --encrypt-vault-id
          - default
          - --vault-password-file
          - "{{ resolved_vault_password_file }}"
          - --output
          - "{{ secrets_file }}.encrypted"
          - "{{ secrets_file }}.tmp"
      delegate_to: localhost
      become: false
      no_log: true
      register: vault_encrypt_result
      changed_when: true

    - name: Load staged encrypted recovery state for integrity verification
      ansible.builtin.include_vars:
        file: "{{ secrets_file }}.encrypted"
        name: staged_platform_secrets
      delegate_to: localhost
      become: false
      no_log: true

    - name: Verify staged encrypted recovery state before atomic replacement
      ansible.builtin.assert:
        that:
          - staged_platform_secrets.backup_dr_access_key | default('') == backup_dr_storage_access_key
          - staged_platform_secrets.backup_dr_secret_key | default('') == backup_dr_storage_secret_key
          - staged_platform_secrets.backup_dr_endpoint | default('') == backup_dr_storage_endpoint
          - staged_platform_secrets.backup_dr_region | default('') == backup_dr_storage_region
          - staged_platform_secrets.backup_dr_bucket | default('') == backup_dr_storage_bucket
        fail_msg: >-
          Staged encrypted recovery state failed DR integrity verification;
          the current encrypted state was preserved.
      delegate_to: localhost
      become: false
      no_log: true
      when: backup_dr_enabled | default(false) | bool

    - name: Atomically replace secrets file with encrypted output
      ansible.builtin.command:
        argv:
          - mv
          - "{{ secrets_file }}.encrypted"
          - "{{ secrets_file }}"
      delegate_to: localhost
      become: false
      changed_when: true
  always:
    - name: Remove temporary secret files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ secrets_file }}.tmp"
        - "{{ secrets_file }}.encrypted"
      delegate_to: localhost
      become: false
      no_log: true
  when: vault_encrypt_secrets | default(true) | bool

- name: Ensure secrets file is in .gitignore
  ansible.builtin.lineinfile:
    path: "{{ playbook_dir }}/../.gitignore"
    line: ".platform-secrets.yml"
    create: true
    mode: '0644'
  delegate_to: localhost
  become: false

