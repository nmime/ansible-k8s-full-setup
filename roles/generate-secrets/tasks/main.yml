---
# Generate Secrets Role - Centralized credential generation
# Generates all credentials ONCE and persists them to a local secrets file.
# On subsequent runs, existing credentials are loaded (never regenerated).
# SECRETS are encrypted with Ansible Vault to prevent plaintext persistence.
# See SECURITY_HARDENING.md section 2 for migration from plaintext .platform-secrets.yml

- name: Set secrets file path
  set_fact:
    secrets_file: >-
      {{ platform_secrets_file
         | default(playbook_dir ~ '/.platform-secrets.yml', true) }}
    resolved_vault_password_file: >-
      {{ (lookup('env', 'ANSIBLE_VAULT_PASSWORD_FILE')
          | default(vault_password_file | default('~/.vault_pass'), true)) | expanduser }}

- name: Check Ansible Vault password file
  ansible.builtin.stat:
    path: "{{ resolved_vault_password_file }}"
  register: vault_password_file_stat
  delegate_to: localhost
  become: false
  when: vault_encrypt_secrets | default(true) | bool

- name: Require Ansible Vault password file when encryption is enabled
  ansible.builtin.assert:
    that:
      - vault_password_file_stat.stat.exists
      - vault_password_file_stat.stat.isreg
    fail_msg: >-
      Secret encryption is enabled but {{ resolved_vault_password_file }} does not exist.
      Create it with mode 0600 or set ANSIBLE_VAULT_PASSWORD_FILE.
      Plaintext fallback is intentionally disabled.
  when: vault_encrypt_secrets | default(true) | bool

- name: Check for existing secrets file
  stat:
    path: "{{ secrets_file }}"
  register: secrets_file_stat
  delegate_to: localhost
  become: false

- name: Load existing secrets (Ansible Vault encrypted)
  include_vars:
    file: "{{ secrets_file }}"
    name: saved_secrets
  no_log: true
  when:
    - secrets_file_stat.stat.exists
    - vault_encrypt_secrets | default(true) | bool

- name: Load existing secrets (plaintext fallback for migration)
  include_vars:
    file: "{{ secrets_file }}"
    name: saved_secrets
  no_log: true
  when:
    - secrets_file_stat.stat.exists
    - not (vault_encrypt_secrets | default(true) | bool)

- name: Ensure saved_secrets is defined for first run
  set_fact:
    saved_secrets: "{{ saved_secrets | default({}) }}"
  no_log: true

- name: Preserve the persisted Postal SMTP credential map
  ansible.builtin.set_fact:
    persisted_postal_smtp_credentials: >-
      {{ saved_secrets.get('postal_smtp_credentials', {}) }}
  no_log: true

- name: Refuse a malformed persisted Postal SMTP credential map
  ansible.builtin.assert:
    that:
      - persisted_postal_smtp_credentials is mapping
      - >-
        persisted_postal_smtp_credentials.values() |
        reject('match', '^.{24,}$') | list | length == 0
    fail_msg: >-
      Existing Postal SMTP credentials must remain a mapping of credentials
      with at least 24 characters. Refusing implicit regeneration.
    quiet: true
  when: persisted_postal_smtp_credentials | length > 0
  no_log: true

- name: Generate object storage credentials
  set_fact:
    generated_object_storage_access_key: "{{ lookup('env', 'OBJECT_STORAGE_ACCESS_KEY') | default(saved_secrets.object_storage_access_key | default(lookup('password', '/dev/null chars=ascii_lowercase,digits length=16')), true) }}"
    generated_object_storage_secret_key: "{{ lookup('env', 'OBJECT_STORAGE_SECRET_KEY') | default(saved_secrets.object_storage_secret_key | default(lookup('password', '/dev/null chars=ascii_letters,digits length=32')), true) }}"
    generated_object_storage_bootstrap_access_key: "{{ lookup('env', 'OBJECT_STORAGE_BOOTSTRAP_ACCESS_KEY') | default(saved_secrets.object_storage_bootstrap_access_key | default(lookup('password', '/dev/null chars=ascii_lowercase,digits length=16')), true) }}"
    generated_object_storage_bootstrap_secret_key: "{{ lookup('env', 'OBJECT_STORAGE_BOOTSTRAP_SECRET_KEY') | default(saved_secrets.object_storage_bootstrap_secret_key | default(lookup('password', '/dev/null chars=ascii_letters,digits length=32')), true) }}"
    generated_object_storage_gitlab_access_key: "{{ lookup('env', 'OBJECT_STORAGE_GITLAB_ACCESS_KEY') | default(saved_secrets.object_storage_gitlab_access_key | default(lookup('password', '/dev/null chars=ascii_lowercase,digits length=16')), true) }}"
    generated_object_storage_gitlab_secret_key: "{{ lookup('env', 'OBJECT_STORAGE_GITLAB_SECRET_KEY') | default(saved_secrets.object_storage_gitlab_secret_key | default(lookup('password', '/dev/null chars=ascii_letters,digits length=32')), true) }}"
    generated_object_storage_backup_access_key: "{{ lookup('env', 'OBJECT_STORAGE_BACKUP_ACCESS_KEY') | default(saved_secrets.object_storage_backup_access_key | default(lookup('password', '/dev/null chars=ascii_lowercase,digits length=16')), true) }}"
    generated_object_storage_backup_secret_key: "{{ lookup('env', 'OBJECT_STORAGE_BACKUP_SECRET_KEY') | default(saved_secrets.object_storage_backup_secret_key | default(lookup('password', '/dev/null chars=ascii_letters,digits length=32')), true) }}"
    generated_object_storage_observability_access_key: "{{ lookup('env', 'OBJECT_STORAGE_OBSERVABILITY_ACCESS_KEY') | default(saved_secrets.object_storage_observability_access_key | default(lookup('password', '/dev/null chars=ascii_lowercase,digits length=16')), true) }}"
    generated_object_storage_observability_secret_key: "{{ lookup('env', 'OBJECT_STORAGE_OBSERVABILITY_SECRET_KEY') | default(saved_secrets.object_storage_observability_secret_key | default(lookup('password', '/dev/null chars=ascii_letters,digits length=32')), true) }}"
    generated_object_storage_ci_cache_access_key: "{{ lookup('env', 'OBJECT_STORAGE_CI_CACHE_ACCESS_KEY') | default(saved_secrets.object_storage_ci_cache_access_key | default(lookup('password', '/dev/null chars=ascii_lowercase,digits length=16')), true) }}"
    generated_object_storage_ci_cache_secret_key: "{{ lookup('env', 'OBJECT_STORAGE_CI_CACHE_SECRET_KEY') | default(saved_secrets.object_storage_ci_cache_secret_key | default(lookup('password', '/dev/null chars=ascii_letters,digits length=32')), true) }}"
    generated_object_storage_nx_cache_protected_access_key: "{{ lookup('env', 'OBJECT_STORAGE_NX_CACHE_PROTECTED_ACCESS_KEY') | default(saved_secrets.object_storage_nx_cache_protected_access_key | default(lookup('password', '/dev/null chars=ascii_lowercase,digits length=16')), true) }}"
    generated_object_storage_nx_cache_protected_secret_key: "{{ lookup('env', 'OBJECT_STORAGE_NX_CACHE_PROTECTED_SECRET_KEY') | default(saved_secrets.object_storage_nx_cache_protected_secret_key | default(lookup('password', '/dev/null chars=ascii_letters,digits length=32')), true) }}"
    generated_object_storage_nx_cache_development_access_key: "{{ lookup('env', 'OBJECT_STORAGE_NX_CACHE_DEVELOPMENT_ACCESS_KEY') | default(saved_secrets.object_storage_nx_cache_development_access_key | default(lookup('password', '/dev/null chars=ascii_lowercase,digits length=16')), true) }}"
    generated_object_storage_nx_cache_development_secret_key: "{{ lookup('env', 'OBJECT_STORAGE_NX_CACHE_DEVELOPMENT_SECRET_KEY') | default(saved_secrets.object_storage_nx_cache_development_secret_key | default(lookup('password', '/dev/null chars=ascii_letters,digits length=32')), true) }}"
  no_log: true

- name: Resolve external disaster-recovery credentials
  ansible.builtin.set_fact:
    generated_backup_dr_access_key: >-
      {{ lookup('env', 'BACKUP_DR_ACCESS_KEY') |
         default(saved_secrets.backup_dr_access_key | default(''), true) }}
    generated_backup_dr_secret_key: >-
      {{ lookup('env', 'BACKUP_DR_SECRET_KEY') |
         default(saved_secrets.backup_dr_secret_key | default(''), true) }}
  no_log: true

- name: Require external disaster-recovery credentials before persistence
  ansible.builtin.assert:
    that:
      - generated_backup_dr_access_key | length >= 8
      - generated_backup_dr_secret_key | length >= 16
      - backup_dr_storage_endpoint | length > 0
      - backup_dr_storage_region | length > 0
      - backup_dr_storage_bucket | length > 0
    fail_msg: >-
      External disaster-recovery credentials and location must be complete
      before the encrypted recovery state can be replaced.
  no_log: true
  when: backup_dr_enabled | default(false) | bool

- name: Generate platform credentials
  set_fact:
    generated_grafana_admin_user: "{{ saved_secrets.grafana_admin_user | default('admin') }}"
    generated_grafana_admin_password: "{{ saved_secrets.grafana_admin_password | default(lookup('password', '/dev/null chars=ascii_letters,digits length=24')) }}"
    generated_app_db_password: "{{ saved_secrets.app_db_password | default(lookup('password', '/dev/null chars=ascii_letters,digits length=32')) }}"
    generated_jwt_secret: "{{ saved_secrets.jwt_secret | default(lookup('password', '/dev/null chars=ascii_letters,digits length=64')) }}"
    generated_jwt_refresh_secret: "{{ saved_secrets.jwt_refresh_secret | default(lookup('password', '/dev/null chars=ascii_letters,digits length=64')) }}"
    generated_argocd_admin_password: "{{ saved_secrets.argocd_admin_password | default(lookup('password', '/dev/null chars=ascii_letters,digits length=24')) }}"
    generated_headscale_api_key: "{{ saved_secrets.headscale_api_key | default(lookup('password', '/dev/null chars=ascii_letters,digits length=48')) }}"
    generated_dragonfly_password: "{{ saved_secrets.dragonfly_password | default(lookup('password', '/dev/null chars=ascii_letters,digits length=32')) }}"
    generated_daytona_api_key: "{{ lookup('env', 'DAYTONA_API_KEY') | default(saved_secrets.daytona_api_key | default(lookup('password', '/dev/null chars=ascii_letters,digits length=48')), true) }}"
    generated_daytona_encryption_key: "{{ saved_secrets.daytona_encryption_key | default(lookup('password', '/dev/null chars=hex_digits length=64') | lower) }}"
    generated_es_superuser_password: "{{ saved_secrets.es_superuser_password | default(lookup('password', '/dev/null chars=ascii_letters,digits length=24')) }}"
    generated_es_logging_ingest_password: "{{ saved_secrets.es_logging_ingest_password | default(lookup('password', '/dev/null chars=ascii_letters,digits length=32')) }}"
    generated_postal_db_password: "{{ saved_secrets.postal_db_password | default(lookup('password', '/dev/null chars=ascii_letters,digits length=24')) }}"
    generated_postal_rails_secret: "{{ saved_secrets.postal_rails_secret | default(lookup('password', '/dev/null chars=hex_digits length=64') | lower) }}"
    generated_postal_admin_password: "{{ saved_secrets.postal_admin_password | default(lookup('password', '/dev/null chars=ascii_letters,digits length=24')) }}"
    generated_postal_smtp_credential: "{{ saved_secrets.postal_smtp_credential | default(lookup('password', '/dev/null chars=ascii_letters,digits length=24')) }}"
    generated_postal_signing_key: "{{ (saved_secrets.postal_signing_key | default(lookup('pipe', 'openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 2>/dev/null'))) | regex_replace('(?m)^[ \\t]+', '') | regex_replace('(?m)[ \\t]+$', '') }}"
  no_log: true

- name: Resolve alert notification credentials (Telegram + email)
  set_fact:
    generated_alert_telegram_bot_token: >-
      {{ lookup('env', 'ALERTS_TELEGRAM_BOT_TOKEN') |
         default(lookup('env', 'ALERT_TELEGRAM_BOT_TOKEN') |
         default(saved_secrets.alert_telegram_bot_token | default(''), true), true) }}
    generated_alert_telegram_chat_id: >-
      {{ lookup('env', 'ALERTS_TELEGRAM_CHAT_ID') |
         default(lookup('env', 'ALERT_TELEGRAM_CHAT_ID') |
         default(saved_secrets.alert_telegram_chat_id | default(''), true), true) }}
    generated_alert_email_to: "{{ lookup('env', 'ALERT_EMAIL_TO') | default(saved_secrets.alert_email_to | default('alerts@' + domain), true) }}"
  no_log: true

- name: Initialize persisted Postal SMTP client credentials
  ansible.builtin.set_fact:
    generated_postal_smtp_credentials: >-
      {{
        persisted_postal_smtp_credentials
        if persisted_postal_smtp_credentials | length > 0
        else {'platform-applications': generated_postal_smtp_credential}
      }}
  no_log: true

- name: Generate missing Postal SMTP client credentials
  ansible.builtin.set_fact:
    generated_postal_smtp_credentials: >-
      {{
        generated_postal_smtp_credentials | combine({
          item: (
            generated_postal_smtp_credentials[item]
            if item in generated_postal_smtp_credentials
            else lookup('password', '/dev/null chars=ascii_letters,digits length=32')
          )
        })
      }}
  loop: "{{ postal_smtp_client_names | default(['platform-applications']) }}"
  no_log: true

- name: Refuse implicit replacement of persisted Postal SMTP credentials
  ansible.builtin.assert:
    that:
      - >-
        generated_postal_smtp_credentials |
        combine(persisted_postal_smtp_credentials) ==
        generated_postal_smtp_credentials
    fail_msg: >-
      Persisted Postal SMTP credentials changed without an explicit rotation.
      Refusing to write secret state.
    quiet: true
  when: persisted_postal_smtp_credentials | length > 0
  no_log: true

- name: Validate an explicitly requested Postal SMTP credential rotation
  ansible.builtin.assert:
    that:
      - lookup('env', 'POSTAL_SMTP_ROTATE_CLIENT') | length > 0
      - lookup('env', 'POSTAL_SMTP_ROTATE_CREDENTIAL') | length >= 24
      - lookup('env', 'POSTAL_SMTP_ROTATE_CLIENT') in postal_smtp_client_names
    fail_msg: >-
      POSTAL_SMTP_ROTATE_CLIENT and a credential of at least 24 characters
      must be supplied together, and the client must be managed by this
      profile.
    quiet: true
  when: >-
    lookup('env', 'POSTAL_SMTP_ROTATE_CLIENT') | length > 0 or
    lookup('env', 'POSTAL_SMTP_ROTATE_CREDENTIAL') | length > 0
  no_log: true

- name: Apply an explicitly requested Postal SMTP credential rotation
  ansible.builtin.set_fact:
    generated_postal_smtp_credentials: >-
      {{
        generated_postal_smtp_credentials | combine({
          lookup('env', 'POSTAL_SMTP_ROTATE_CLIENT'):
            lookup('env', 'POSTAL_SMTP_ROTATE_CREDENTIAL')
        })
      }}
  when: lookup('env', 'POSTAL_SMTP_ROTATE_CLIENT') | length > 0
  no_log: true

- name: Resolve GitLab Runner authentication token
  ansible.builtin.set_fact:
    generated_gitlab_runner_token: >-
      {{ gitlab_runner_token_override | default(
           lookup('env', 'GITLAB_RUNNER_TOKEN') |
           default(saved_secrets.gitlab_runner_token | default(''), true),
           true
         ) }}
    generated_gitlab_image_builder_runner_token: >-
      {{ lookup('env', 'GITLAB_IMAGE_BUILDER_RUNNER_TOKEN') |
         default(
           saved_secrets.gitlab_image_builder_runner_token | default(''),
           true
         ) }}
    generated_gitlab_docker_host_runner_token: >-
      {{ lookup('env', 'GITLAB_DOCKER_HOST_RUNNER_TOKEN') |
         default(
           saved_secrets.gitlab_docker_host_runner_token | default(''),
           true
         ) }}
  no_log: true

- name: Refuse an undeclared GitLab Runner authentication-token rotation
  ansible.builtin.assert:
    that:
      - gitlab_runner_token_rotation_enabled | default(false) | bool
      - generated_gitlab_runner_token | string | trim !=
        saved_secrets.gitlab_runner_token | default('') | string | trim
    fail_msg: >-
      gitlab_runner_token_override is accepted only by the explicit rotation
      workflow and must differ from the persisted credential.
    quiet: true
  when: gitlab_runner_token_override | default('') | string | trim | length > 0
  no_log: true

- name: Require encrypted persistence for the GitLab Runner token
  ansible.builtin.assert:
    that:
      - not (platform_gitlab_runner_enabled | default(false) | bool) or
        (vault_encrypt_secrets | default(true) | bool)
      - not (platform_gitlab_image_builder_runner_enabled |
             default(false) | bool) or
        (vault_encrypt_secrets | default(true) | bool)
      - not (platform_gitlab_docker_host_runner_enabled |
             default(false) | bool) or
        (vault_encrypt_secrets | default(true) | bool)
    fail_msg: >-
      gitlab.runner.enabled=true requires vault_encrypt_secrets=true so the
      GitLab Runner authentication token is never persisted as plaintext.
    quiet: true

- name: Require a modern authentication token when GitLab Runner is selected
  ansible.builtin.assert:
    that:
      - not (platform_gitlab_runner_enabled | default(false) | bool) or
        (generated_gitlab_runner_token | string | trim | length > 20 and
         generated_gitlab_runner_token | string is match(
           '^glrt-[A-Za-z0-9_-]+(\.[A-Za-z0-9_-]+)*$'))
    fail_msg: >-
      gitlab.runner.enabled=true requires GITLAB_RUNNER_TOKEN with a GitLab-issued
      runner authentication token (glrt-...). Create an instance runner under
      GitLab Admin > CI/CD > Runners and rerun. Legacy registration tokens are
      intentionally unsupported; the Runner will not be silently omitted.
    quiet: true

- name: Require a modern authentication token for the protected image builder
  ansible.builtin.assert:
    that:
      - not (platform_gitlab_image_builder_runner_enabled |
             default(false) | bool) or
        (generated_gitlab_image_builder_runner_token |
         string | trim | length > 20 and
         generated_gitlab_image_builder_runner_token | string is match(
           '^glrt-[A-Za-z0-9_-]+(\.[A-Za-z0-9_-]+)*$'))
    fail_msg: >-
      gitlab.runner.image_builder.enabled=true requires
      GITLAB_IMAGE_BUILDER_RUNNER_TOKEN from a protected instance runner tagged
      only image-build with run_untagged=false. Legacy registration tokens and
      reuse of the general-purpose Runner identity are forbidden.
    quiet: true

- name: Require a modern authentication token for protected Docker smoke jobs
  ansible.builtin.assert:
    that:
      - not (platform_gitlab_docker_host_runner_enabled |
             default(false) | bool) or
        (generated_gitlab_docker_host_runner_token |
         string | trim | length > 20 and
         generated_gitlab_docker_host_runner_token | string is match(
           '^glrt-[A-Za-z0-9_-]+(\.[A-Za-z0-9_-]+)*$'))
    fail_msg: >-
      gitlab.runner.docker_host.enabled=true requires
      GITLAB_DOCKER_HOST_RUNNER_TOKEN from a protected instance runner tagged
      only docker-host with run_untagged=false.
    quiet: true

- name: Set unified secret variables for all roles
  set_fact:
    object_storage_access_key: "{{ generated_object_storage_access_key }}"
    object_storage_secret_key: "{{ generated_object_storage_secret_key }}"
    object_storage_bootstrap_access_key: "{{ generated_object_storage_bootstrap_access_key }}"
    object_storage_bootstrap_secret_key: "{{ generated_object_storage_bootstrap_secret_key }}"
    object_storage_gitlab_access_key: "{{ generated_object_storage_gitlab_access_key }}"
    object_storage_gitlab_secret_key: "{{ generated_object_storage_gitlab_secret_key }}"
    object_storage_backup_access_key: "{{ generated_object_storage_backup_access_key }}"
    object_storage_backup_secret_key: "{{ generated_object_storage_backup_secret_key }}"
    object_storage_observability_access_key: "{{ generated_object_storage_observability_access_key }}"
    object_storage_observability_secret_key: "{{ generated_object_storage_observability_secret_key }}"
    object_storage_ci_cache_access_key: "{{ generated_object_storage_ci_cache_access_key }}"
    object_storage_ci_cache_secret_key: "{{ generated_object_storage_ci_cache_secret_key }}"
    object_storage_nx_cache_protected_access_key: "{{ generated_object_storage_nx_cache_protected_access_key }}"
    object_storage_nx_cache_protected_secret_key: "{{ generated_object_storage_nx_cache_protected_secret_key }}"
    object_storage_nx_cache_development_access_key: "{{ generated_object_storage_nx_cache_development_access_key }}"
    object_storage_nx_cache_development_secret_key: "{{ generated_object_storage_nx_cache_development_secret_key }}"
    grafana_admin_user: "{{ generated_grafana_admin_user }}"
    grafana_admin_password: "{{ generated_grafana_admin_password }}"
    app_db_password: "{{ generated_app_db_password }}"
    app_jwt_secret: "{{ generated_jwt_secret }}"
    app_refresh_secret: "{{ generated_jwt_refresh_secret }}"
    argocd_admin_password: "{{ generated_argocd_admin_password }}"
    headscale_api_key: "{{ generated_headscale_api_key }}"
    dragonfly_password: "{{ generated_dragonfly_password }}"
    daytona_api_key: "{{ generated_daytona_api_key }}"
    daytona_encryption_key: "{{ generated_daytona_encryption_key }}"
    es_superuser_password: "{{ generated_es_superuser_password }}"
    es_logging_ingest_password: "{{ generated_es_logging_ingest_password }}"
    postal_db_password: "{{ generated_postal_db_password }}"
    postal_rails_secret: "{{ generated_postal_rails_secret }}"
    postal_admin_password: "{{ generated_postal_admin_password }}"
    postal_smtp_credential: >-
      {{ generated_postal_smtp_credentials['platform-applications'] }}
    postal_smtp_credentials: "{{ generated_postal_smtp_credentials }}"
    postal_smtp_auth_username: >-
      {{
        (postal.organization_permalink | default(project_name | default('platform')))
        ~ '/'
        ~ (postal.server_permalink | default('transactional'))
      }}
    postal_signing_key: "{{ generated_postal_signing_key }}"
    gitlab_runner_token: "{{ generated_gitlab_runner_token }}"
    gitlab_image_builder_runner_token: >-
      {{ generated_gitlab_image_builder_runner_token }}
    gitlab_docker_host_runner_token: >-
      {{ generated_gitlab_docker_host_runner_token }}
    alert_telegram_bot_token: "{{ generated_alert_telegram_bot_token }}"
    alert_telegram_chat_id: "{{ generated_alert_telegram_chat_id }}"
    alert_email_to: "{{ generated_alert_email_to }}"
    backup_dr_storage_access_key: "{{ generated_backup_dr_access_key }}"
    backup_dr_storage_secret_key: "{{ generated_backup_dr_secret_key }}"
  no_log: true

- name: Build the generated platform credential recovery bundle
  ansible.builtin.set_fact:
    platform_generated_secret_bundle:
      object_storage_access_key: "{{ object_storage_access_key }}"
      object_storage_secret_key: "{{ object_storage_secret_key }}"
      object_storage_bootstrap_access_key: "{{ object_storage_bootstrap_access_key }}"
      object_storage_bootstrap_secret_key: "{{ object_storage_bootstrap_secret_key }}"
      object_storage_gitlab_access_key: "{{ object_storage_gitlab_access_key }}"
      object_storage_gitlab_secret_key: "{{ object_storage_gitlab_secret_key }}"
      object_storage_backup_access_key: "{{ object_storage_backup_access_key }}"
      object_storage_backup_secret_key: "{{ object_storage_backup_secret_key }}"
      object_storage_observability_access_key: "{{ object_storage_observability_access_key }}"
      object_storage_observability_secret_key: "{{ object_storage_observability_secret_key }}"
      object_storage_ci_cache_access_key: "{{ object_storage_ci_cache_access_key }}"
      object_storage_ci_cache_secret_key: "{{ object_storage_ci_cache_secret_key }}"
      object_storage_nx_cache_protected_access_key: "{{ object_storage_nx_cache_protected_access_key }}"
      object_storage_nx_cache_protected_secret_key: "{{ object_storage_nx_cache_protected_secret_key }}"
      object_storage_nx_cache_development_access_key: "{{ object_storage_nx_cache_development_access_key }}"
      object_storage_nx_cache_development_secret_key: "{{ object_storage_nx_cache_development_secret_key }}"
      grafana_admin_user: "{{ grafana_admin_user }}"
      grafana_admin_password: "{{ grafana_admin_password }}"
      app_db_password: "{{ app_db_password }}"
      jwt_secret: "{{ app_jwt_secret }}"
      jwt_refresh_secret: "{{ app_refresh_secret }}"
      argocd_admin_password: "{{ argocd_admin_password }}"
      headscale_api_key: "{{ headscale_api_key }}"
      dragonfly_password: "{{ dragonfly_password }}"
      daytona_api_key: "{{ daytona_api_key }}"
      daytona_encryption_key: "{{ daytona_encryption_key }}"
      es_superuser_password: "{{ es_superuser_password }}"
      es_logging_ingest_password: "{{ es_logging_ingest_password }}"
      postal_db_password: "{{ postal_db_password }}"
      postal_rails_secret: "{{ postal_rails_secret }}"
      postal_admin_password: "{{ postal_admin_password }}"
      gitlab_runner_token: "{{ gitlab_runner_token }}"
      gitlab_image_builder_runner_token: "{{ gitlab_image_builder_runner_token }}"
      gitlab_docker_host_runner_token: "{{ gitlab_docker_host_runner_token }}"
      alert_telegram_bot_token: "{{ alert_telegram_bot_token }}"
