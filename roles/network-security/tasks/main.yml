- name: Set network security variables
  set_fact:
    project: '{{ project_name | default(''k8s'') }}'
    vpn_domain: '{{ network.vpn.domain | default("vpn." + domain, true) }}'
    headscale_version: '{{ headscale_version | default("0.28.0") }}'
    bastion_host: '{{ bastion_public_ip | default(bastion_ip | default('''')) }}'
    network_control_plane_ips: '{{ master_ips | default({}) | dict2items | map(attribute=''value'') | list }}'
    network_worker_ips: '{{ worker_ips | default({}) | dict2items | map(attribute=''value'') | list }}'
    network_node_ips: >-
      {{ (master_ips | default({}) | dict2items | map(attribute='value') | list)
         + (worker_ips | default({}) | dict2items | map(attribute='value') | list) }}
    controller_known_hosts_file: >-
      {{ lookup('env', 'HOME') }}/.ssh/known_hosts-{{ project_name | default('k8s') }}
- name: Create controller SSH directory
  ansible.builtin.file:
    path: '{{ controller_known_hosts_file | dirname }}'
    state: directory
    mode: '0700'
  delegate_to: localhost
  become: false
- name: Create project-scoped SSH trust storage on the controller
  ansible.builtin.file:
    path: '{{ controller_known_hosts_file }}'
    state: touch
    mode: '0600'
    access_time: preserve
    modification_time: preserve
  delegate_to: localhost
  become: false
- name: Validate bastion IP is available
  assert:
    that:
    - bastion_host | length > 0
    fail_msg: Bastion IP not set. Run hetzner-infra role first.
- name: Wait for bastion SSH to be ready
  wait_for:
    host: '{{ bastion_host }}'
    port: 22
    delay: 5
    timeout: 120
  delegate_to: localhost
  become: false
- name: Update and install required packages on bastion
  ansible.builtin.shell: 'ssh -o StrictHostKeyChecking=accept-new root@{{ bastion_host }} ''bash -s'' << ''REMOTECMD''

    apt-get -o DPkg::Lock::Timeout=300 update -q

    apt-get -o DPkg::Lock::Timeout=300 install -y curl wget unzip jq ufw fail2ban apt-transport-https ca-certificates gnupg

    REMOTECMD

    '
  register: bastion_pkg_result
  retries: 3
  delay: 10
  until: bastion_pkg_result is success
- name: Install tools directly on bastion
  ansible.builtin.shell: |
    ssh -o StrictHostKeyChecking=accept-new root@{{ bastion_host }} 'bash -s' << 'REMOTECMD'
    set -euo pipefail
    K8S_VER={{ k8s_version }}
    HELM_VER={{ helm_cli_version }}
    HCLOUD_VER={{ hcloud_cli_version }}
    YQ_VER={{ yq_version }}
    if ! command -v kubectl >/dev/null; then
      curl --retry 5 --retry-all-errors -fsSL "https://dl.k8s.io/release/${K8S_VER}/bin/linux/amd64/kubectl" -o /tmp/kubectl
      echo "{{ kubectl_linux_amd64_sha256 }}  /tmp/kubectl" | sha256sum -c -
      install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
    fi
    if ! command -v helm >/dev/null; then
      curl --retry 5 --retry-all-errors -fsSL "https://get.helm.sh/helm-${HELM_VER}-linux-amd64.tar.gz" -o /tmp/helm.tar.gz
      echo "{{ helm_linux_amd64_sha256 }}  /tmp/helm.tar.gz" | sha256sum -c -
      tar xzf /tmp/helm.tar.gz -C /tmp
      install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm
    fi
    if ! command -v hcloud >/dev/null || [ "$(hcloud version 2>/dev/null | awk 'NR == 1 {print $2}')" != "${HCLOUD_VER}" ]; then
      curl --retry 5 --retry-all-errors -fsSL "https://github.com/hetznercloud/cli/releases/download/${HCLOUD_VER}/hcloud-linux-amd64.tar.gz" -o /tmp/hcloud.tar.gz
      echo "{{ hcloud_linux_amd64_sha256 }}  /tmp/hcloud.tar.gz" | sha256sum -c -
      tar xzf /tmp/hcloud.tar.gz -C /tmp hcloud
      install -m 0755 /tmp/hcloud /usr/local/bin/hcloud
    fi
    if ! command -v yq >/dev/null; then
      curl --retry 5 --retry-all-errors -fsSL "https://github.com/mikefarah/yq/releases/download/${YQ_VER}/yq_linux_amd64" -o /tmp/yq
      echo "{{ yq_linux_amd64_sha256 }}  /tmp/yq" | sha256sum -c -
      install -m 0755 /tmp/yq /usr/local/bin/yq
    fi
    kubectl version --client
    helm version --short
    hcloud version
    yq --version
    REMOTECMD
  register: tools_result
  retries: 3
  delay: 30
  until: tools_result is success
- name: Configure fail2ban on bastion
  ansible.builtin.shell: 'ssh -o StrictHostKeyChecking=accept-new root@{{ bastion_host }} ''bash -s'' << ''REMOTECMD''

    cat > /etc/fail2ban/jail.local << ''EOF''

    [sshd]

    enabled = true

    port = 22

    maxretry = 5

    bantime = 3600

    findtime = 600

    EOF

    systemctl enable fail2ban

    systemctl restart fail2ban

    REMOTECMD

    '
- name: Configure UFW firewall on bastion
  ansible.builtin.shell: "ssh -o StrictHostKeyChecking=accept-new root@{{ bastion_host }} 'bash -s' << 'REMOTECMD'\nDEFAULT_IF=$(ip route show default | awk '/default/ {print $5}'\
    \ | head -1)\nDEFAULT_IF=\"${DEFAULT_IF:-eth0}\"\nPRIV_IF=$(ip -o link show | awk -F': ' '/enp7s0|ens10/{print $2}' | head -1)\nPRIV_IF=\"${PRIV_IF:-enp7s0}\"\nsed -i 's/^DEFAULT_FORWARD_POLICY=.*/DEFAULT_FORWARD_POLICY=\"\
    ACCEPT\"/' /etc/default/ufw\nsed -i 's/^#net\\/ipv4\\/ip_forward=1/net\\/ipv4\\/ip_forward=1/' /etc/ufw/sysctl.conf\nsed -i 's/^net\\/ipv4\\/ip_forward=0/net\\/ipv4\\/ip_forward=1/' /etc/ufw/sysctl.conf\n\
    sysctl -w net.ipv4.ip_forward=1\ngrep -q '^net.ipv4.ip_forward' /etc/sysctl.conf && sed -i 's/^net.ipv4.ip_forward.*/net.ipv4.ip_forward=1/' /etc/sysctl.conf || echo 'net.ipv4.ip_forward=1' >> /etc/sysctl.conf\n\
    if ! grep -q '^\\*nat' /etc/ufw/before.rules; then\n  printf \"*nat\\n:POSTROUTING ACCEPT [0:0]\\n-A POSTROUTING -s 10.0.0.0/16 -o $DEFAULT_IF -j MASQUERADE\\nCOMMIT\\n\" > /tmp/ufw-nat.tmp\n  cat /etc/ufw/before.rules\
    \ >> /tmp/ufw-nat.tmp\n  mv /tmp/ufw-nat.tmp /etc/ufw/before.rules\nfi\nufw default deny incoming\nufw default allow outgoing\nufw allow 22/tcp\nufw allow 80/tcp\nufw allow 443/tcp\nufw allow 3478/udp\n\
    ufw allow 41641/udp\nufw allow from 10.0.0.0/16\nufw route allow in on \"$PRIV_IF\" out on \"$DEFAULT_IF\"\nufw --force enable\nufw reload\niptables -t nat -C POSTROUTING -s 10.0.0.0/16 -o \"$DEFAULT_IF\"\
    \ -j MASQUERADE 2>/dev/null || iptables -t nat -A POSTROUTING -s 10.0.0.0/16 -o \"$DEFAULT_IF\" -j MASQUERADE\niptables -C FORWARD -i \"$PRIV_IF\" -o \"$DEFAULT_IF\" -j ACCEPT 2>/dev/null || iptables\
    \ -A FORWARD -i \"$PRIV_IF\" -o \"$DEFAULT_IF\" -j ACCEPT\niptables -C FORWARD -i \"$DEFAULT_IF\" -o \"$PRIV_IF\" -m state --state RELATED,ESTABLISHED -j ACCEPT 2>/dev/null || iptables -A FORWARD -i\
    \ \"$DEFAULT_IF\" -o \"$PRIV_IF\" -m state --state RELATED,ESTABLISHED -j ACCEPT\nREMOTECMD\n"
- name: Harden SSH on bastion
  ansible.builtin.shell: "ssh -o StrictHostKeyChecking=accept-new root@{{ bastion_host }} 'bash -s' << 'REMOTECMD'\nfor setting in \\\n  'PasswordAuthentication no' \\\n  'PermitRootLogin\
    \ prohibit-password' \\\n  'MaxAuthTries 5' \\\n  'MaxStartups 100:30:200' \\\n  'MaxSessions 50' \\\n  'AllowTcpForwarding yes' \\\n  'AllowStreamLocalForwarding no' \\\n; do\n  key=$(echo \"$setting\"\
    \ | cut -d' ' -f1)\n  grep -q \"^$key\" /etc/ssh/sshd_config \\\n    && sed -i \"s/^.*$key.*/$setting/\" /etc/ssh/sshd_config \\\n    || echo \"$setting\" >> /etc/ssh/sshd_config\ndone\nsystemctl restart\
    \ ssh 2>/dev/null || systemctl restart sshd\nREMOTECMD\n"
- name: Wait for bastion SSH after restart
  wait_for:
    host: '{{ bastion_host }}'
    port: 22
    delay: 3
    timeout: 30
  delegate_to: localhost
  become: false
- name: Flush SSH control sockets after bastion SSH restart
  ansible.builtin.shell: 'rm -rf {{ (lookup(''env'', ''HOME'') + ''/.ansible/cp'') | quote }} 2>/dev/null

    true

    '
  delegate_to: localhost
  become: false
  changed_when: false
- name: Enable IP forwarding and NAT on bastion
  ansible.builtin.shell: "ssh -o StrictHostKeyChecking=accept-new root@{{ bastion_host }} 'bash -s' << 'REMOTECMD'\nsysctl -w net.ipv4.ip_forward=1\necho 'net.ipv4.ip_forward = 1'\
    \ > /etc/sysctl.d/99-nat.conf\nDEFAULT_IF=$(ip route show default | awk '/default/ {print $5}' | head -1)\nDEFAULT_IF=\"${DEFAULT_IF:-eth0}\"\nPRIV_IF=$(ip -o link show | awk -F': ' '/enp7s0|ens10/{print\
    \ $2}' | head -1)\nPRIV_IF=\"${PRIV_IF:-enp7s0}\"\niptables -t nat -C POSTROUTING -s 10.0.0.0/16 -o \"$DEFAULT_IF\" -j MASQUERADE 2>/dev/null || \\\n  iptables -t nat -A POSTROUTING -s 10.0.0.0/16 -o\
    \ \"$DEFAULT_IF\" -j MASQUERADE\niptables -C FORWARD -i \"$PRIV_IF\" -o \"$DEFAULT_IF\" -j ACCEPT 2>/dev/null || \\\n  iptables -A FORWARD -i \"$PRIV_IF\" -o \"$DEFAULT_IF\" -j ACCEPT\niptables -C FORWARD\
    \ -i \"$DEFAULT_IF\" -o \"$PRIV_IF\" -m state --state RELATED,ESTABLISHED -j ACCEPT 2>/dev/null || \\\n  iptables -A FORWARD -i \"$DEFAULT_IF\" -o \"$PRIV_IF\" -m state --state RELATED,ESTABLISHED -j\
    \ ACCEPT\nmkdir -p /etc/iptables\niptables-save > /etc/iptables/rules.v4\nmkdir -p /etc/network/if-pre-up.d\nprintf '#!/bin/sh\\niptables-restore < /etc/iptables/rules.v4\\n' > /etc/network/if-pre-up.d/iptables\n\
    chmod +x /etc/network/if-pre-up.d/iptables\nREMOTECMD\n"
- name: Add bastion as default route on private network
  ansible.builtin.command:
    cmd: 'hcloud network add-route {{ project }}-network --destination 0.0.0.0/0 --gateway {{ bastion_private_ip | default(''10.0.2.1'') }}

      '
  delegate_to: localhost
  become: false
  register: nat_route
  changed_when: nat_route.rc == 0
  failed_when: nat_route.rc != 0 and 'already' not in (nat_route.stderr | default('')) and 'exists' not in (nat_route.stderr | default('')) and 'route' not in (nat_route.stderr | default(''))
- name: Remove stale host keys only for nodes provisioned in this run
  ansible.builtin.command:
    argv:
      - ssh-keygen
      - -R
      - "{{ item }}"
      - -f
      - "{{ controller_known_hosts_file }}"
  loop: "{{ newly_created_node_ips | default([]) }}"
  delegate_to: localhost
  become: false
  register: recycled_node_host_keys
  changed_when: "'not found in' not in (recycled_node_host_keys.stdout | default(''))"
- name: Wait for private nodes to be SSH-reachable via bastion
   \ -W %h:%p root@{{ bastion_host }}' \\\n  root@{{ item }} 'echo ok'\n"
  ansible.builtin.shell: |
    ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 \
      -o UserKnownHostsFile={{ controller_known_hosts_file | quote }} \
      -o ProxyCommand='ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 -o UserKnownHostsFile={{ controller_known_hosts_file }} -W %h:%p root@{{ bastion_host }}' \
      root@{{ item }} 'echo ok'
  loop: '{{ (master_ips | default({}) | dict2items | map(attribute=''value'') | list) + (worker_ips | default({}) | dict2items | map(attribute=''value'') | list) }}'
  when: item is defined and item | length > 0
  register: ssh_check
  retries: 10
  delay: 15
  until: ssh_check.rc == 0
- name: Configure DNS on private-only nodes
  ansible.builtin.shell: |
    ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 \
      -o UserKnownHostsFile={{ controller_known_hosts_file | quote }} \
      -o ProxyCommand='ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 -o UserKnownHostsFile={{ controller_known_hosts_file }} -W %h:%p root@{{ bastion_host }}' \
      root@{{ item }} 'bash -s' << 'REMOTECMD'
    mkdir -p /etc/systemd/resolved.conf.d
    printf '[Resolve]\nDNS=185.12.64.1 185.12.64.2\n' > /etc/systemd/resolved.conf.d/dns.conf
    systemctl restart systemd-resolved 2>/dev/null || true
    if [ -L /etc/resolv.conf ] && readlink /etc/resolv.conf | grep -q stub; then
      true
    else
      printf 'nameserver 185.12.64.1\nnameserver 185.12.64.2\n' > /etc/resolv.conf
    fi
    mkdir -p /etc/cloud/cloud.cfg.d
    echo "manage_resolv_conf: false" > /etc/cloud/cloud.cfg.d/99-disable-resolv.cfg
    REMOTECMD
  loop: '{{ (groups.get(''k8s_nodes'', []) | default([])) + (master_ips | default({}) | dict2items | map(attribute=''value'') | list) + (worker_ips | default({}) | dict2items | map(attribute=''value'')
    | list) }}'
  when: item is defined and item | length > 0
  register: dns_result
  retries: 5
  delay: 30
  until: dns_result.rc == 0
- name: Add default route on private-only nodes
  ansible.builtin.shell: |
    ssh -o StrictHostKeyChecking=accept-new \
      -o UserKnownHostsFile={{ controller_known_hosts_file | quote }} \
      -o ProxyCommand='ssh -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile={{ controller_known_hosts_file }} -W %h:%p root@{{ bastion_host }}' \
      root@{{ item }} 'bash -s' << 'REMOTECMD'
    PRIV_IF=$(ip -o link show | awk -F': ' '/enp7s0|ens10/{print $2}' | head -1)
    PRIV_IF="${PRIV_IF:-enp7s0}"
    ip route del default 2>/dev/null
    ip route add default via 10.0.0.1 dev "$PRIV_IF" mtu 1450
    if [ -d /etc/netplan ]; then
      cat > /etc/netplan/60-private-routes.yaml << NPEOF
    network:
      version: 2
      ethernets:
        ${PRIV_IF}:
          dhcp4: true
          routes:
            - to: default
              via: 10.0.0.1
              metric: 100
              mtu: 1450
    NPEOF
    fi
    REMOTECMD
  loop: '{{ (master_ips | default({}) | dict2items | map(attribute=''value'') | list) + (worker_ips | default({}) | dict2items | map(attribute=''value'') | list) }}'
  when: item is defined and item | length > 0
  register: route_result
  retries: 3
  delay: 15
  until: route_result.rc == 0
- name: Install Docker on bastion
  ansible.builtin.shell: "ssh -o StrictHostKeyChecking=accept-new root@{{ bastion_host }} 'bash -s' << 'REMOTECMD'\nif ! command -v docker &>/dev/null; then\n  apt-get -o DPkg::Lock::Timeout=300 update\n  apt-get -o DPkg::Lock::Timeout=300 install -y docker.io docker-compose-v2\n  systemctl enable docker\n  systemctl start docker\nfi\nREMOTECMD\n"
- name: Re-apply NAT after Docker install
  ansible.builtin.shell: "ssh -o StrictHostKeyChecking=accept-new root@{{ bastion_host }} 'bash -s' << 'REMOTECMD'\nsysctl -w net.ipv4.ip_forward=1\nDEFAULT_IF=$(ip route show default\
    \ | awk '/default/ {print $5}' | head -1)\nDEFAULT_IF=\"${DEFAULT_IF:-eth0}\"\nPRIV_IF=$(ip -o link show | awk -F': ' '/enp7s0|ens10/{print $2}' | head -1)\nPRIV_IF=\"${PRIV_IF:-enp7s0}\"\niptables\
    \ -t nat -C POSTROUTING -s 10.0.0.0/16 -o \"$DEFAULT_IF\" -j MASQUERADE 2>/dev/null || \\\n  iptables -t nat -A POSTROUTING -s 10.0.0.0/16 -o \"$DEFAULT_IF\" -j MASQUERADE\niptables -C FORWARD -i \"\
    $PRIV_IF\" -o \"$DEFAULT_IF\" -j ACCEPT 2>/dev/null || \\\n  iptables -A FORWARD -i \"$PRIV_IF\" -o \"$DEFAULT_IF\" -j ACCEPT\niptables -C FORWARD -i \"$DEFAULT_IF\" -o \"$PRIV_IF\" -m state --state\
    \ RELATED,ESTABLISHED -j ACCEPT 2>/dev/null || \\\n  iptables -A FORWARD -i \"$DEFAULT_IF\" -o \"$PRIV_IF\" -m state --state RELATED,ESTABLISHED -j ACCEPT\niptables-save > /etc/iptables/rules.v4\nREMOTECMD\n"
- name: Create Headscale directories
  ansible.builtin.shell: "ssh -o StrictHostKeyChecking=accept-new root@{{ bastion_host }} \\\n  'mkdir -p /etc/headscale /var/lib/headscale /opt/headscale'\n"
- name: Deploy Headscale configuration
  ansible.builtin.shell: "ssh -o StrictHostKeyChecking=accept-new root@{{ bastion_host }} 'bash -s' << REMOTECMD\ncat > /etc/headscale/config.yaml << 'EOF'\nserver_url: https://{{\
    \ vpn_domain }}\nlisten_addr: 0.0.0.0:8080\nmetrics_listen_addr: 0.0.0.0:9090\nnoise:\n  private_key_path: /var/lib/headscale/noise_private.key\nprefixes:\n  v4: 100.64.0.0/10\n  v6: fd7a:115c:a1e0::/48\n\
    derp:\n  server:\n    enabled: true\n    region_id: 999\n    stun_listen_addr: 0.0.0.0:3478\n    private_key_path: /var/lib/headscale/derp_server_private.key\n  urls:\n      - https://controlplane.tailscale.com/derpmap/default\n\
    \  auto_update_enabled: true\n  update_frequency: 24h\ndatabase:\n  type: sqlite\n  sqlite:\n    path: /var/lib/headscale/db.sqlite\ndns:\n  magic_dns: true\n  base_domain: vpn.internal\n  nameservers:\n\
    \    global:\n      - 1.1.1.1\n      - 8.8.8.8\nlog:\n  level: info\nEOF\nREMOTECMD\n"
- name: Create Caddyfile for Headscale TLS termination
  ansible.builtin.shell: "ssh -o StrictHostKeyChecking=accept-new root@{{ bastion_host }} 'bash -s' << REMOTECMD\ncat > /opt/headscale/Caddyfile << 'EOF'\n{{ vpn_domain }} {\n  reverse_proxy\
    \ headscale:8080\n}\nEOF\nREMOTECMD\n"
- name: Deploy Headscale Docker Compose
  ansible.builtin.shell: "ssh -o StrictHostKeyChecking=accept-new root@{{ bastion_host }} 'bash -s' << REMOTECMD\ncat > /opt/headscale/docker-compose.yml << 'EOF'\nservices:\n  headscale:\n\
    \    container_name: headscale\n    image: headscale/headscale:{{ headscale_version }}\n    restart: always\n    command: serve\n    ports:\n      - \"9090:9090\"\n      - \"3478:3478/udp\"\n    volumes:\n\
    \      - /var/lib/headscale:/var/lib/headscale\n      - /etc/headscale:/etc/headscale:ro\n    environment:\n      - TZ=UTC\n    security_opt:\n      - no-new-privileges:true\n    read_only: true\n \
    \   tmpfs:\n      - /tmp\n      - /run\n      - /var/run/headscale\n    cap_drop:\n      - ALL\n    cap_add:\n      - NET_BIND_SERVICE\n  caddy:\n    container_name: caddy\n    image: caddy:{{ caddy_image_tag }}\n\
    \    restart: always\n    ports:\n      - \"443:443\"\n      - \"80:80\"\n    volumes:\n      - /opt/headscale/Caddyfile:/etc/caddy/Caddyfile:ro\n      - caddy_data:/data\n      - caddy_config:/config\n\
    \    depends_on:\n      - headscale\n    security_opt:\n      - no-new-privileges:true\n    cap_drop:\n      - ALL\n    cap_add:\n      - NET_BIND_SERVICE\nvolumes:\n  caddy_data:\n  caddy_config:\n\
    EOF\nREMOTECMD\n"
- name: Start Headscale container
  ansible.builtin.shell: "ssh -o StrictHostKeyChecking=accept-new root@{{ bastion_host }} \\\n  'cd /opt/headscale && docker compose up -d'\n"
- name: Wait for Headscale to be ready
  ansible.builtin.shell: "ssh -o StrictHostKeyChecking=accept-new root@{{ bastion_host }} 'bash -s' << 'REMOTECMD'\nfor i in $(seq 1 30); do\n  docker exec headscale headscale version\
    \ 2>/dev/null && break\n  sleep 2\ndone\nREMOTECMD\n"
- name: Create Headscale admin user
  ansible.builtin.shell: "ssh -o StrictHostKeyChecking=accept-new root@{{ bastion_host }} \\\n  'docker exec headscale headscale users create admin 2>/dev/null || true'\n"
- name: Create Headscale dev user
  ansible.builtin.shell: "ssh -o StrictHostKeyChecking=accept-new root@{{ bastion_host }} \\\n  'docker exec headscale headscale users create dev 2>/dev/null || true'\n"
- name: Create pre-auth key for admin
  ansible.builtin.shell: "ssh -o StrictHostKeyChecking=accept-new root@{{ bastion_host }} \\\n  'docker exec headscale headscale preauthkeys create --user admin --reusable --expiration\
    \ 720h 2>/dev/null | tail -1'\n"
  register: admin_preauth_key
- name: Install Tailscale client on bastion
  ansible.builtin.shell: "ssh -o StrictHostKeyChecking=accept-new root@{{ bastion_host }} 'bash -s' << 'REMOTECMD'\nif ! command -v tailscale &>/dev/null; then\n  curl -fsSL https://pkgs.tailscale.com/stable/ubuntu/noble.noarmor.gpg -o /usr/share/keyrings/tailscale-archive-keyring.gpg\n  curl -fsSL https://pkgs.tailscale.com/stable/ubuntu/noble.tailscale-keyring.list -o /etc/apt/sources.list.d/tailscale.list\n  apt-get -o DPkg::Lock::Timeout=300 update\n  apt-get -o DPkg::Lock::Timeout=300 install -y tailscale\nfi\nREMOTECMD\n"
- name: Connect bastion to Headscale VPN
  ansible.builtin.shell: "ssh -o StrictHostKeyChecking=accept-new root@{{ bastion_host }} \\\n  \"tailscale up --login-server https://{{ vpn_domain }} --authkey {{ admin_preauth_key.stdout\
    \ | trim }} --hostname {{ project }}-bastion --advertise-routes=10.0.0.0/16 2>/dev/null || true\"\n"
  when: admin_preauth_key.stdout is defined and admin_preauth_key.stdout | trim | length > 0
- name: Display network security summary
  debug:
    msg:
    - ==========================================
    - '  Network Security Configured'
    - ==========================================
    - '  Headscale VPN: https://{{ vpn_domain }}'
    - '  Version: {{ headscale_version }}'
    - '  Bastion: {{ bastion_host }}'
    - '  Users: admin, dev'
    - ''
    - '  Connect client:'
    - '  Install Tailscale from the signed packages.tailscale.com apt repository'
    - '  tailscale up --login-server https://{{ vpn_domain }} --authkey <KEY>'
    - ''
    - '  Firewall: SSH(22), HTTP(80), HTTPS(443), STUN(3478), WG(41641)'
    - '  Hardening: fail2ban, password-auth disabled'
    - ==========================================
- name: Require an explicit bastion log ingestion endpoint
  ansible.builtin.assert:
    that:
      - bastion_log_ingest_host is defined
      - bastion_log_ingest_host | length > 0
    fail_msg: >-
      bastion_log_shipping requires a private ingestion endpoint and a
      certificate valid for bastion_log_ingest_host.
  when: bastion_log_shipping | default(false) | bool
- name: Install and configure Promtail on bastion (for Loki)
  ansible.builtin.shell: "ssh -o StrictHostKeyChecking=accept-new root@{{ bastion_host }} 'bash -s' << 'REMOTECMD'\nset -e\n\nif [ -f /usr/bin/promtail ]; then\n  echo \"Promtail\
    \ already installed\"\n  exit 0\nfi\n\nPROMTAIL_VERSION=\"{{ promtail_version }}\"\ncd /tmp\ncurl -fsSL -o promtail.zip \"https://github.com/grafana/loki/releases/download/v${PROMTAIL_VERSION}/promtail-linux-amd64.zip\"\
    \necho '{{ promtail_linux_amd64_sha256 }}  promtail.zip' | sha256sum -c -\nunzip -o promtail.zip\nchmod +x promtail-linux-amd64\nmv promtail-linux-amd64 /usr/bin/promtail\nrm -f promtail.zip\n\nmkdir -p /etc/promtail /var/lib/promtail\nREMOTECMD\n"
  when: bastion_log_shipping | default(false) | bool and log_stack | default('loki') == 'loki'
  register: _r_install_promtail_bastion
  retries: 2
  delay: 5
  until: _r_install_promtail_bastion is not failed
- name: Configure Promtail on bastion
  ansible.builtin.shell: "ssh -o StrictHostKeyChecking=accept-new root@{{ bastion_host }} 'bash -s' << REMOTECMD\ncat > /etc/promtail/config.yml << 'EOF'\nserver:\n  http_listen_port:\
    \ 9080\n  grpc_listen_port: 0\n\npositions:\n  filename: /var/lib/promtail/positions.yaml\n\nclients:\n  - url: {{ bastion_log_ingest_scheme | default('https') }}://{{ bastion_log_ingest_host }}:{{ bastion_log_ingest_port | default(443) }}/loki/api/v1/push\n    tenant_id: bastion\n\nscrape_configs:\n\
    \  - job_name: bastion-system\n    static_configs:\n      - targets:\n          - localhost\n        labels:\n          job: bastion\n          host: {{ project }}-bastion\n          __path__: /var/log/*.log\n\
    \n  - job_name: bastion-journal\n    journal:\n      max_age: 12h\n      labels:\n        job: bastion-journal\n        host: {{ project }}-bastion\n    relabel_configs:\n      - source_labels: ['__journal__systemd_unit']\n\
    \        target_label: 'unit'\n      - source_labels: ['__journal__hostname']\n        target_label: 'hostname'\nEOF\nREMOTECMD\n"
  when: bastion_log_shipping | default(false) | bool and log_stack | default('loki') == 'loki'
- name: Create Promtail systemd service on bastion
  ansible.builtin.shell: 'ssh -o StrictHostKeyChecking=accept-new root@{{ bastion_host }} ''bash -s'' << ''REMOTECMD''

    cat > /etc/systemd/system/promtail.service << ''EOF''

    [Unit]

    Description=Promtail Log Shipper

    After=network.target


    [Service]

    Type=simple

    ExecStart=/usr/bin/promtail -config.file=/etc/promtail/config.yml

    Restart=always

    RestartSec=5


    [Install]

    WantedBy=multi-user.target

    EOF


    systemctl daemon-reload

    systemctl enable promtail

    systemctl restart promtail

    REMOTECMD

    '
  when: bastion_log_shipping | default(false) | bool and log_stack | default('loki') == 'loki'
- name: Install and configure Filebeat on bastion (for ELK)
  ansible.builtin.shell: "ssh -o StrictHostKeyChecking=accept-new root@{{ bastion_host }} 'bash -s' << 'REMOTECMD'\nset -e\n\nif [ -f /usr/bin/filebeat ]; then\n  echo \"Filebeat\
    \ already installed\"\nelse\n  curl -fsSL https://artifacts.elastic.co/GPG-KEY-elasticsearch | gpg --dearmor -o /usr/share/keyrings/elasticsearch-keyring.gpg\n  echo \"deb [signed-by=/usr/share/keyrings/elasticsearch-keyring.gpg]\
    \ https://artifacts.elastic.co/packages/9.x/apt stable main\" > /etc/apt/sources.list.d/elastic-9.x.list\n  apt-get -o DPkg::Lock::Timeout=300 update && apt-get -o DPkg::Lock::Timeout=300 install -y filebeat={{ es_version }}\nfi\nREMOTECMD\n"
  when: bastion_log_shipping | default(false) | bool and log_stack | default('loki') in ['elk', 'efk']
  register: _r_install_filebeat_bastion
  retries: 2
  delay: 5
  until: _r_install_filebeat_bastion is not failed
- name: Configure Filebeat on bastion
  ansible.builtin.shell: "ssh -o StrictHostKeyChecking=accept-new root@{{ bastion_host }} 'bash -s' << REMOTECMD\ncat > /etc/filebeat/filebeat.yml << 'EOF'\nfilebeat.inputs:\n  -\
    \ type: log\n    enabled: true\n    paths:\n      - /var/log/*.log\n      - /var/log/syslog\n      - /var/log/auth.log\n    fields:\n      host: {{ project }}-bastion\n      job: bastion\n    fields_under_root:\
    \ true\n\n  - type: journald\n    enabled: true\n    id: bastion-journal\n\noutput.elasticsearch:\n  hosts: [\"https://{{ network_control_plane_ips | first }}:31443\"]\n  username: \"elastic\"\n  password: \"{{\
    \ es_superuser_password }}\"\n  ssl.verification_mode: full\n  ssl.certificate_authorities: [\"/etc/filebeat/es-ca.crt\"]\n  index: \"bastion-%{+yyyy.MM.dd}\"\n\nsetup.ilm.enabled: false\nsetup.template.name: \"bastion\"\nsetup.template.pattern: \"\
    bastion-*\"\nEOF\n\nsystemctl enable filebeat\nsystemctl restart filebeat\nREMOTECMD\n"
  when: bastion_log_shipping | default(false) | bool and log_stack | default('loki') in ['elk', 'efk'] and es_tls_secret_available | default(false) | bool
  no_log: true
- name: Ship K8s audit logs to Loki (control plane nodes)
  ansible.builtin.shell: "for CP_IP in {{ network_control_plane_ips | join(' ') }}; do\n  ssh -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile={{ controller_known_hosts_file }} -J root@{{ bastion_host }} root@${CP_IP} 'bash -s' <<'RCMD'\nset -e\n[ -f /usr/bin/promtail\
    \ ] || { curl -fsSL -o /tmp/p.zip https://github.com/grafana/loki/releases/download/v{{ promtail_version }}/promtail-linux-amd64.zip && echo '{{ promtail_linux_amd64_sha256 }}  /tmp/p.zip' | sha256sum -c - && cd /tmp && unzip -o p.zip && mv promtail-linux-amd64 /usr/bin/promtail && chmod\
    \ +x /usr/bin/promtail; }\nmkdir -p /etc/promtail /var/lib/promtail\nprintf 'server:\n  http_listen_port: 9080\npositions:\n  filename: /var/lib/promtail/positions.yaml\nclients:\n  - url: http://127.0.0.1:31000/loki/api/v1/push\n\
    \    tenant_id: k8s-audit\nscrape_configs:\n  - job_name: k8s-audit\n    static_configs:\n      - targets: [localhost]\n        labels:\n          job: k8s-audit\n          __path__: /var/log/kube-apiserver-audit.log\n\
    ' > /etc/promtail/config.yml\nprintf '[Unit]\nDescription=Promtail K8s Audit\nAfter=network.target\n[Service]\nType=simple\nExecStart=/usr/bin/promtail -config.file=/etc/promtail/config.yml\nRestart=always\n\
    [Install]\nWantedBy=multi-user.target\n' > /etc/systemd/system/promtail.service\nsystemctl daemon-reload && systemctl enable promtail && systemctl restart promtail\nRCMD\ndone\n"
  when: control_plane_log_shipping | default(false) | bool and log_stack | default('loki') == 'loki'
- name: Ship K8s audit logs to ELK (control plane nodes)
  ansible.builtin.shell: "for CP_IP in {{ network_control_plane_ips | join(' ') }}; do\n  ssh -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile={{ controller_known_hosts_file }} -J root@{{ bastion_host }} root@${CP_IP} 'bash -s' <<'RCMD'\ncommand -v filebeat >/dev/null\
    \ || { curl -fsSL https://artifacts.elastic.co/GPG-KEY-elasticsearch | gpg --dearmor -o /usr/share/keyrings/elasticsearch-keyring.gpg 2>/dev/null; echo 'deb [signed-by=/usr/share/keyrings/elasticsearch-keyring.gpg]\
    \ https://artifacts.elastic.co/packages/9.x/apt stable main' > /etc/apt/sources.list.d/elastic-9.x.list; apt-get -o DPkg::Lock::Timeout=300 update && apt-get -o DPkg::Lock::Timeout=300 install -y filebeat={{ es_version }}; }\nprintf 'filebeat.inputs:\n  - type: log\n \
    \   paths: [\"/var/log/kube-apiserver-audit.log\"]\n    json.keys_under_root: true\n    fields: {log_type: k8s-audit}\noutput.elasticsearch:\n  hosts: [\"https://127.0.0.1:31443\"]\n  username: elastic\n\
    \  password: \"{{ es_superuser_password }}\"\n  ssl.verification_mode: full\n  ssl.certificate_authorities: [\"/etc/filebeat/es-ca.crt\"]\n  index: k8s-audit\nsetup.ilm.enabled: false\n' > /etc/filebeat/filebeat.yml\nsystemctl enable filebeat &&\
    \ systemctl restart filebeat\nRCMD\ndone\n"
  when: control_plane_log_shipping | default(false) | bool and log_stack | default('loki') in ['elk', 'efk'] and es_tls_secret_available | default(false) | bool
  no_log: true
- name: Install SSH MFA (Google Authenticator) on bastion
  ansible.builtin.shell: ssh -o StrictHostKeyChecking=accept-new root@{{ bastion_host }} "apt-get -o DPkg::Lock::Timeout=300 update && apt-get -o DPkg::Lock::Timeout=300 install -y libpam-google-authenticator && (grep -q pam_google_authenticator /etc/pam.d/sshd ||
    sed -i "/@include common-auth/i auth required pam_google_authenticator.so nullok" /etc/pam.d/sshd) && sed -i "s/^#.*KbdInteractiveAuthentication.*/KbdInteractiveAuthentication yes/" /etc/ssh/sshd_config
    && (grep -q "AuthenticationMethods publickey,keyboard-interactive" /etc/ssh/sshd_config || echo "AuthenticationMethods publickey,keyboard-interactive" >> /etc/ssh/sshd_config) && systemctl restart sshd"
  when: ssh_mfa_enabled | default(false) | bool
- name: Display MFA setup instructions
  debug:
    msg:
    - 'SSH MFA enabled on bastion. Run: google-authenticator -t -d -f -r 3 -R 30 -w 3'
    - 'Scan QR code with authenticator app. Future logins: SSH key + TOTP code.'
  when: ssh_mfa_enabled | default(false) | bool
- name: Install auditd and unattended-upgrades on bastion
  ansible.builtin.shell: |
    ssh -o StrictHostKeyChecking=accept-new root@{{ bastion_host }} 'bash -s' <<'REMOTECMD'
    set -euo pipefail
    # A freshly configured host can still have cloud-init or apt-daily holding
    # dpkg's locks.  Stop scheduled package jobs, let an active transaction
    # finish, and also use apt's native lock timeout to close the race between
    # the explicit check and apt-get.
    systemctl stop apt-daily.timer apt-daily-upgrade.timer >/dev/null 2>&1 || true
    systemctl stop unattended-upgrades.service >/dev/null 2>&1 || true
    for attempt in $(seq 1 150); do
      if ! fuser /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock \
          /var/lib/apt/lists/lock /var/cache/apt/archives/lock >/dev/null 2>&1; then
        break
      fi
      if [ "$attempt" -eq 150 ]; then
        echo "Timed out waiting for apt/dpkg locks" >&2
        exit 1
      fi
      sleep 2
    done
    export DEBIAN_FRONTEND=noninteractive
    apt-get -o DPkg::Lock::Timeout=300 update -q
    apt-get -o DPkg::Lock::Timeout=300 install -y auditd unattended-upgrades
    systemctl enable --now auditd
    dpkg-reconfigure -f noninteractive -plow unattended-upgrades
    systemctl enable --now apt-daily.timer apt-daily-upgrade.timer
    REMOTECMD
  register: bastion_audit_packages
  retries: 3
  delay: 10
  until: bastion_audit_packages is success
- name: 'Configure auditd rules on bastion (HIPAA: syscall logging)'
  ansible.builtin.shell: 'ssh -o StrictHostKeyChecking=accept-new root@{{ bastion_host }} ''bash -s'' << ''RULES''

    cat > /etc/audit/rules.d/hipaa.rules << ''EOF''

    # HIPAA audit rules: file access, user actions, network

    -w /etc/passwd -p wa -k identity

    -w /etc/group -p wa -k identity

    -w /etc/shadow -p wa -k identity

    -w /etc/sudoers -p wa -k actions

    -w /var/log/auth.log -p wa -k logins

    -a always,exit -F arch=b64 -S execve -k exec

    -a always,exit -F arch=b64 -S socket -S connect -k network

    EOF

    augenrules --load

    RULES

    '
  when: hipaa_compliance | default(false) | bool
- name: Install node-exporter on bastion for Prometheus metrics
  ansible.builtin.shell: "ssh -o StrictHostKeyChecking=accept-new root@{{ bastion_host }} 'bash -s' << 'EXPORTER'\nif [ ! -f /usr/local/bin/node_exporter ]; then\n  cd /tmp\n  curl -fsSL https://github.com/prometheus/node_exporter/releases/download/v1.7.0/node_exporter-1.7.0.linux-amd64.tar.gz\
    \ -o node_exporter.tar.gz\n  echo '{{ node_exporter_linux_amd64_sha256 }}  node_exporter.tar.gz' | sha256sum -c -\n  tar xzf node_exporter.tar.gz\n  mv node_exporter-*/node_exporter /usr/local/bin/\n  rm -rf node_exporter*\nfi\ncat > /etc/systemd/system/node_exporter.service << 'SVC'\n\
    [Unit]\nDescription=Node Exporter\nAfter=network.target\n[Service]\nType=simple\nExecStart=/usr/local/bin/node_exporter\nRestart=always\n[Install]\nWantedBy=multi-user.target\nSVC\nsystemctl daemon-reload\n\
    systemctl enable node_exporter\nsystemctl restart node_exporter\nEXPORTER\n"
- name: Install auditd and unattended-upgrades on K8s nodes
  ansible.builtin.shell: |
    set -euo pipefail
    for NODE_IP in {{ network_node_ips | join(' ') }}; do
      ssh -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile={{ controller_known_hosts_file }} -J root@{{ bastion_host }} root@${NODE_IP} 'bash -s' <<'REMOTECMD'
    set -euo pipefail
    systemctl stop apt-daily.timer apt-daily-upgrade.timer >/dev/null 2>&1 || true
    systemctl stop unattended-upgrades.service >/dev/null 2>&1 || true
    for attempt in $(seq 1 150); do
      if ! fuser /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock \
          /var/lib/apt/lists/lock /var/cache/apt/archives/lock >/dev/null 2>&1; then
        break
      fi
      if [ "$attempt" -eq 150 ]; then
        echo "Timed out waiting for apt/dpkg locks" >&2
        exit 1
      fi
      sleep 2
    done
    export DEBIAN_FRONTEND=noninteractive
    apt-get -o DPkg::Lock::Timeout=300 update -qq
    apt-get -o DPkg::Lock::Timeout=300 install -y -qq auditd unattended-upgrades
    systemctl enable --now auditd
    dpkg-reconfigure -f noninteractive -plow unattended-upgrades
    systemctl enable --now apt-daily.timer apt-daily-upgrade.timer
    REMOTECMD
    done
  register: node_audit_packages
  retries: 3
  delay: 10
  until: node_audit_packages is success
- name: Configure auditd rules on K8s nodes (HIPAA)
  ansible.builtin.shell: "for NODE_IP in {{ network_node_ips | join(' ') }}; do\n  ssh -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile={{ controller_known_hosts_file }} -J root@{{ bastion_host }} root@${NODE_IP} 'bash -s' <<'ARULES'\ncat >\
    \ /etc/audit/rules.d/hipaa.rules << 'EOF'\n-w /etc/passwd -p wa -k identity\n-w /etc/shadow -p wa -k identity\n-w /etc/sudoers -p wa -k actions\n-w /var/log/auth.log -p wa -k logins\n-a always,exit\
    \ -F arch=b64 -S execve -k exec\nEOF\naugenrules --load\nARULES\ndone\n"
  when: hipaa_compliance | default(false) | bool
