---
# Network Security Role - Headscale VPN v0.28.0 + Bastion Hardening
# Installs Headscale VPN on bastion for secure admin access
# Architecture: Public (LB) -> app, api, s3, registry
#               Admin (VPN) -> gitlab, argocd, grafana, vault, k8s

- name: Set network security variables
  set_fact:
    project: "{{ project_name | default('k8s') }}"
    vpn_domain: "vpn.{{ domain | default('example.com') }}"
    headscale_version: "0.28.0"
    bastion_host: "{{ bastion_public_ip | default(bastion_ip | default('')) }}"

- name: Validate bastion IP is available
  assert:
    that:
      - bastion_host | length > 0
    fail_msg: "Bastion IP not set. Run hetzner-infra role first."

- name: Wait for bastion SSH to be ready
  wait_for:
    host: "{{ bastion_host }}"
    port: 22
    delay: 5
    timeout: 120
  delegate_to: localhost
  become: false

# ============================================
# Bastion Hardening
# ============================================

- name: Update and install required packages on bastion
  ansible.builtin.raw: |
    apt-get update -q
    apt-get install -y curl wget unzip jq ufw fail2ban apt-transport-https ca-certificates gnupg
  delegate_to: "{{ bastion_host }}"
  become: true

- name: Configure fail2ban on bastion
  ansible.builtin.raw: |
    cat > /etc/fail2ban/jail.local << 'EOF'
    [sshd]
    enabled = true
    port = 22
    maxretry = 5
    bantime = 3600
    findtime = 600
    EOF
    systemctl enable fail2ban
    systemctl restart fail2ban
  delegate_to: "{{ bastion_host }}"
  become: true

- name: Configure UFW firewall on bastion
  ansible.builtin.raw: |
    ufw default deny incoming
    ufw default allow outgoing
    ufw allow 22/tcp comment "SSH"
    ufw allow 443/tcp comment "Headscale HTTPS"
    ufw allow 3478/udp comment "STUN/DERP"
    ufw allow from 10.0.0.0/16 comment "Private network"
    echo "y" | ufw enable
  delegate_to: "{{ bastion_host }}"
  become: true

- name: Harden SSH on bastion
  ansible.builtin.raw: |
    sed -i 's/#PasswordAuthentication yes/PasswordAuthentication no/' /etc/ssh/sshd_config
    sed -i 's/PasswordAuthentication yes/PasswordAuthentication no/' /etc/ssh/sshd_config
    sed -i 's/#PermitRootLogin prohibit-password/PermitRootLogin prohibit-password/' /etc/ssh/sshd_config
    sed -i 's/#MaxAuthTries 6/MaxAuthTries 3/' /etc/ssh/sshd_config
    systemctl restart sshd
  delegate_to: "{{ bastion_host }}"
  become: true

# ============================================
# NAT Gateway (bastion routes outbound for private nodes)
# ============================================

- name: Enable IP forwarding and NAT on bastion
  ansible.builtin.raw: |
    # Enable IP forwarding
    echo 'net.ipv4.ip_forward = 1' > /etc/sysctl.d/99-nat.conf
    sysctl -p /etc/sysctl.d/99-nat.conf
    # NAT masquerade for private network traffic
    iptables -t nat -C POSTROUTING -s 10.0.0.0/16 -o eth0 -j MASQUERADE 2>/dev/null || \
      iptables -t nat -A POSTROUTING -s 10.0.0.0/16 -o eth0 -j MASQUERADE
    # Persist iptables rules
    apt-get install -y iptables-persistent
    netfilter-persistent save
  delegate_to: "{{ bastion_host }}"
  become: true

- name: Add bastion as default route on private network
  ansible.builtin.command:
    cmd: >
      hcloud network add-route {{ project }}-network
      --destination 0.0.0.0/0
      --gateway {{ bastion_private_ip | default('10.0.0.2') }}
  delegate_to: localhost
  become: false
  register: nat_route
  changed_when: nat_route.rc == 0
  failed_when: nat_route.rc != 0 and 'already' not in (nat_route.stderr | default('')) and 'exists' not in (nat_route.stderr | default('')) and 'route' not in (nat_route.stderr | default(''))

# ============================================
# Docker Installation (for Headscale)
# ============================================

- name: Install Docker on bastion
  ansible.builtin.raw: |
    if ! command -v docker &>/dev/null; then
      curl -fsSL https://get.docker.com | sh
      systemctl enable docker
      systemctl start docker
    fi
  delegate_to: "{{ bastion_host }}"
  become: true

# ============================================
# Headscale VPN v0.28.0
# ============================================

- name: Create Headscale directories
  ansible.builtin.raw: mkdir -p /etc/headscale /var/lib/headscale /opt/headscale
  delegate_to: "{{ bastion_host }}"
  become: true

- name: Deploy Headscale configuration
  ansible.builtin.raw: |
    cat > /etc/headscale/config.yaml << 'EOF'
    server_url: https://{{ vpn_domain }}
    listen_addr: 0.0.0.0:443
    metrics_listen_addr: 0.0.0.0:9090
    private_key_path: /var/lib/headscale/private.key
    noise:
      private_key_path: /var/lib/headscale/noise_private.key
    prefixes:
      v4: 100.64.0.0/10
      v6: fd7a:115c:a1e0::/48
    derp:
      server:
        enabled: true
        region_id: 999
        region_code: custom
        region_name: Headscale
        stun_listen_addr: 0.0.0.0:3478
      urls: []
      auto_update_enabled: true
      update_frequency: 24h
    database:
      type: sqlite
      sqlite:
        path: /var/lib/headscale/db.sqlite
    dns:
      magic_dns: true
      base_domain: vpn.internal
      nameservers:
        global:
          - 1.1.1.1
          - 8.8.8.8
    log:
      level: info
    EOF
  delegate_to: "{{ bastion_host }}"
  become: true

- name: Deploy Headscale Docker Compose
  ansible.builtin.raw: |
    cat > /opt/headscale/docker-compose.yml << 'EOF'
    services:
      headscale:
        container_name: headscale
        image: headscale/headscale:{{ headscale_version }}
        restart: always
        command: serve
        ports:
          - "443:443"
          - "9090:9090"
          - "3478:3478/udp"
        volumes:
          - /var/lib/headscale:/var/lib/headscale
          - /etc/headscale:/etc/headscale:ro
        environment:
          - TZ=UTC
    EOF
  delegate_to: "{{ bastion_host }}"
  become: true

- name: Start Headscale container
  ansible.builtin.raw: cd /opt/headscale && docker compose up -d
  delegate_to: "{{ bastion_host }}"
  become: true

- name: Wait for Headscale to be ready
  ansible.builtin.raw: |
    for i in $(seq 1 30); do
      docker exec headscale headscale version 2>/dev/null && break
      sleep 2
    done
  delegate_to: "{{ bastion_host }}"
  become: true

# ============================================
# Headscale User/Namespace Setup
# ============================================

- name: Create Headscale admin user
  ansible.builtin.raw: docker exec headscale headscale users create admin 2>/dev/null || true
  delegate_to: "{{ bastion_host }}"
  become: true

- name: Create Headscale dev user
  ansible.builtin.raw: docker exec headscale headscale users create dev 2>/dev/null || true
  delegate_to: "{{ bastion_host }}"
  become: true

- name: Create pre-auth key for admin
  ansible.builtin.raw: |
    docker exec headscale headscale preauthkeys create --user admin --reusable --expiration 720h 2>/dev/null | tail -1
  delegate_to: "{{ bastion_host }}"
  become: true
  register: admin_preauth_key

# ============================================
# Install Tailscale on bastion (self-connect)
# ============================================

- name: Install Tailscale client on bastion
  ansible.builtin.raw: |
    if ! command -v tailscale &>/dev/null; then
      curl -fsSL https://tailscale.com/install.sh | sh
    fi
  delegate_to: "{{ bastion_host }}"
  become: true

- name: Connect bastion to Headscale VPN
  ansible.builtin.raw: |
    tailscale up --login-server https://{{ vpn_domain }} --authkey {{ admin_preauth_key.stdout | trim }} --hostname {{ project }}-bastion 2>/dev/null || true
  delegate_to: "{{ bastion_host }}"
  become: true
  when: admin_preauth_key.stdout is defined and admin_preauth_key.stdout | trim | length > 0

# ============================================
# Install tools on bastion
# ============================================

- name: Install kubectl on bastion
  ansible.builtin.raw: |
    if ! command -v kubectl &>/dev/null; then
      curl -fsSL "https://dl.k8s.io/release/v1.34.3/bin/linux/amd64/kubectl" -o /usr/local/bin/kubectl
      chmod +x /usr/local/bin/kubectl
    fi
  delegate_to: "{{ bastion_host }}"
  become: true

- name: Install Helm on bastion
  ansible.builtin.raw: |
    if ! command -v helm &>/dev/null; then
      curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
    fi
  delegate_to: "{{ bastion_host }}"
  become: true

- name: Install hcloud CLI on bastion
  ansible.builtin.raw: |
    if ! command -v hcloud &>/dev/null; then
      curl -sL https://github.com/hetznercloud/cli/releases/latest/download/hcloud-linux-amd64.tar.gz | tar xz -C /usr/local/bin/
    fi
  delegate_to: "{{ bastion_host }}"
  become: true

- name: Install yq on bastion
  ansible.builtin.raw: |
    if ! command -v yq &>/dev/null; then
      curl -fsSL "https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64" -o /usr/local/bin/yq
      chmod +x /usr/local/bin/yq
    fi
  delegate_to: "{{ bastion_host }}"
  become: true

- name: Display network security summary
  debug:
    msg:
      - "=========================================="
      - "  Network Security Configured"
      - "=========================================="
      - "  Headscale VPN: https://{{ vpn_domain }}"
      - "  Version: {{ headscale_version }}"
      - "  Bastion: {{ bastion_host }}"
      - "  Users: admin, dev"
      - ""
      - "  Connect client:"
      - "  curl -fsSL https://tailscale.com/install.sh | sh"
      - "  tailscale up --login-server https://{{ vpn_domain }} --authkey <KEY>"
      - ""
      - "  Firewall: SSH(22), HTTPS(443), STUN(3478)"
      - "  Hardening: fail2ban, password-auth disabled"
      - "=========================================="
