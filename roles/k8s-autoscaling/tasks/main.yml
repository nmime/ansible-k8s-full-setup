- name: Set KEDA tier-specific variables
  set_fact:
    keda_namespace: keda
    keda_chart_version: "{{ keda_chart_version | default('2.20.1') }}"
    keda_replicas: '{{ autoscaling.replicas | default(2 if resource_tier in [''medium'', ''production''] else 1) }}'
    keda_min_replicas_default: '{{ autoscaling.defaults.min_replicas | default(2 if resource_tier == ''production'' else 1) }}'
    keda_max_replicas_default: '{{ autoscaling.defaults.max_replicas | default(20 if resource_tier == ''production'' else 10) }}'
- name: Create KEDA namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: '{{ keda_namespace }}'
        labels:
          app.kubernetes.io/part-of: keda
          pod-security.kubernetes.io/enforce: baseline
          pod-security.kubernetes.io/warn: restricted
  register: _r_create_keda_namespace
  retries: 3
  delay: 10
  until: _r_create_keda_namespace is not failed
- name: Add KEDA Helm repository
  kubernetes.core.helm_repository:
    name: kedacore
    repo_url: https://kedacore.github.io/charts
  register: _r_add_keda_helm_repository
  retries: 3
  delay: 10
  until: _r_add_keda_helm_repository is not failed
- name: Install KEDA with Helm
  kubernetes.core.helm:
    name: keda
    chart_ref: kedacore/keda
    chart_version: '{{ keda_chart_version }}'
    release_namespace: '{{ keda_namespace }}'
    create_namespace: true
    release_state: present
    wait: true
    timeout: 10m0s
    values:
      operator:
        replicaCount: '{{ keda_replicas | int }}'
      metricsServer:
        replicaCount: '{{ keda_replicas | int }}'
      webhooks:
        replicaCount: '{{ keda_replicas | int }}'
      podSecurityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
        readOnlyRootFilesystem: true
      resources:
        operator:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        metricServer:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
        webhooks:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 128Mi
      prometheus:
        metricServer:
          enabled: true
          port: 9022
        operator:
          enabled: true
          port: 8080
      serviceAccount:
        create: true
  register: _r_install_keda_with_helm
  retries: 3
  delay: 10
  until: _r_install_keda_with_helm is not failed
- name: Create example CPU ScaledObject
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: keda.sh/v1alpha1
      kind: ScaledObject
      metadata:
        name: example-cpu-scaledobject
        namespace: default
        labels:
          app: example
      spec:
        scaleTargetRef:
          apiVersion: apps/v1
          kind: Deployment
          name: example-app
        pollingInterval: 15
        cooldownPeriod: 300
        minReplicaCount: '{{ keda_min_replicas_default }}'
        maxReplicaCount: '{{ keda_max_replicas_default }}'
        triggers:
        - type: cpu
          metricType: Utilization
          metadata:
            value: '70'
  when: false
  register: _r_create_example_cpu_scaledobject
  retries: 3
  delay: 10
  until: _r_create_example_cpu_scaledobject is not failed
- name: Create example Prometheus ScaledObject
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: keda.sh/v1alpha1
      kind: ScaledObject
      metadata:
        name: example-prometheus-scaledobject
        namespace: default
        labels:
          app: example
      spec:
        scaleTargetRef:
          apiVersion: apps/v1
          kind: Deployment
          name: example-app
        pollingInterval: 5
        cooldownPeriod: 30
        minReplicaCount: 0
        maxReplicaCount: 50
        triggers:
        - type: prometheus
          metadata:
            serverAddress: http://vmselect-vmcluster.monitoring.svc:8481/select/0/prometheus
            query: sum(rate(http_requests_total{namespace="default",deployment="example-app"}[2m]))
            threshold: '100'
            activationThreshold: '5'
  when: false
  register: _r_create_example_prometheus_scaledobject
  retries: 3
  delay: 10
  until: _r_create_example_prometheus_scaledobject is not failed
- name: Create KEDA TriggerAuthentication for VictoriaMetrics
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: keda.sh/v1alpha1
      kind: ClusterTriggerAuthentication
      metadata:
        name: victoria-metrics-auth
      spec:
        podIdentity:
          provider: none
  register: _r_create_keda_triggerauthentication_for_vi
  retries: 3
  delay: 10
  until: _r_create_keda_triggerauthentication_for_vi is not failed
- name: Check if VMServiceScrape CRD exists
  kubernetes.core.k8s_info:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: vmservicescrapes.operator.victoriametrics.com
  register: vmscrape_crd
  retries: 3
  delay: 10
  until: vmscrape_crd is not failed
  failed_when: false
- name: Create VMServiceScrape for KEDA metrics
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: operator.victoriametrics.com/v1beta1
      kind: VMServiceScrape
      metadata:
        name: keda-metrics
        namespace: '{{ keda_namespace }}'
      spec:
        selector:
          matchLabels:
            app.kubernetes.io/name: keda-operator
        endpoints:
        - port: metrics
          interval: 30s
  when: vmscrape_crd.resources | default([]) | length > 0
  register: _r_create_vmservicescrape_for_keda_metrics
  retries: 3
  delay: 10
  until: _r_create_vmservicescrape_for_keda_metrics is not failed
- name: Display KEDA deployment info
  debug:
    msg:
    - ==========================================
    - '  KEDA Autoscaling Deployed'
    - ==========================================
    - '  Version: {{ keda_chart_version }}'
    - '  Replicas: {{ keda_replicas }}'
    - '  Default min/max: {{ keda_min_replicas_default }}/{{ keda_max_replicas_default }}'
    - ''
    - '  Available scalers: 70+'
    - '  Supported: CPU, Memory, Prometheus, Cron,'
    - '    RabbitMQ, Kafka, PostgreSQL, Redis, etc.'
    - ''
    - '  Create ScaledObject resources to enable'
    - '  autoscaling for your deployments.'
    - ==========================================
- name: Create default-deny for KEDA namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: default-deny
        namespace: keda
      spec:
        endpointSelector: {}
- name: Allow KEDA egress to metrics sources and K8s API
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: allow-keda-egress
        namespace: keda
      spec:
        endpointSelector: {}
        egress:
        - toEntities:
          - cluster
          - kube-apiserver
- name: Create KEDA VMServiceScrape for VictoriaMetrics metrics collection
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: operator.victoriametrics.com/v1beta1
      kind: VMServiceScrape
      metadata:
        name: keda
        namespace: '{{ keda_namespace }}'
      spec:
        selector:
          matchLabels:
            app.kubernetes.io/name: keda-operator
        endpoints:
          - port: metrics
            interval: 30s
  when: vmscrape_crd.resources | default([]) | length > 0
  register: _r_create_vmservicescrape_for_keda
  retries: 3
  delay: 10
  until: _r_create_vmservicescrape_for_keda is not failed

- name: Create optional Prometheus ServiceMonitor for KEDA (when prometheus_enabled=true)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: monitoring.coreos.com/v1
      kind: ServiceMonitor
      metadata:
        name: keda
        namespace: '{{ keda_namespace }}'
        labels:
          release: prometheus
      spec:
        selector:
          matchLabels:
            app: keda-operator
        endpoints:
          - port: http
            interval: 30s
            path: /metrics
  when: prometheus_enabled | default(false) | bool
