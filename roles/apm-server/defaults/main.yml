---
apm_namespace: elasticsearch
apm_version: "9.4.1"
apm_image: "docker.elastic.co/apm/apm-server"
apm_replicas: "{{ 2 if tier in ['medium', 'production'] else 1 }}"

apm_memory_req: "{{ '768Mi' if tier in ['medium', 'production'] else '384Mi' }}"
apm_memory_lim: "{{ '1536Mi' if tier in ['medium', 'production'] else '768Mi' }}"
apm_cpu_req:    "{{ '500m' if tier in ['medium', 'production'] else '100m' }}"
apm_cpu_lim:    "{{ '1500m' if tier in ['medium', 'production'] else '750m' }}"

apm_es_host: "elasticsearch.elasticsearch.svc.cluster.local"
apm_es_port: 9200
apm_es_scheme: "https"
apm_es_user: "elastic"

# ILM retention (auto-delete old traces)
apm_ilm_hot_max_size: "30gb"
apm_ilm_hot_max_age: "7d"
apm_ilm_delete_after: "14d"

apm_otlp_grpc_port: 8200
apm_otlp_http_port: 8200
