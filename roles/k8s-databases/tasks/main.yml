- name: Set database tier-specific variables
  set_fact:
    db_ns: databases
    pg_operator_ver: '{{ pg_operator_version | default("3.0.0") }}'
    psmdb_operator_ver: '{{ databases.mongodb.operator_version | default("1.23.0") }}'
    pg_version: '{{ postgresql_version | default(18) }}'
    pg_replicas: '{{ databases.postgresql.replicas | default(postgresql_replicas | default(3 if resource_tier in [''medium'', ''production''] else 1)) }}'
    pg_storage: '{{ postgresql_storage | default(''20Gi'') }}'
    pg_data_storage_class: '{{ postgresql_data_storage_class | default(storage_class | default(''hcloud-volumes'')) }}'
    pg_repo_storage_class: '{{ postgresql_repo_storage_class | default(storage_class | default(''hcloud-volumes'')) }}'
    pg_repo_storage: '{{ postgresql_repo_storage | default(''10Gi'') }}'
    pg_proxy_replicas: '{{ databases.postgresql.proxy_replicas | default(postgresql_proxy_replicas | default(2 if resource_tier in [''medium'', ''production''] else 1)) }}'
    pg_service_alias: '{{ databases.postgresql.service_alias | default('''') }}'
    pg_tls_mode: '{{ databases.postgresql.tls_mode | default(''preferTLS'') }}'
    pg_tls_cutover_confirmed: '{{ databases.postgresql.tls_cutover_confirmed | default(false) | bool }}'
    mongo_replicas: '{{ databases.mongodb.replicas | default(mongodb_replicas | default(3 if resource_tier in [''medium'', ''production''] else 1)) }}'
    mongo_storage: '{{ mongodb_storage | default(''20Gi'') }}'
    mongo_data_storage_class: '{{ mongodb_data_storage_class | default(storage_class | default(''hcloud-volumes'')) }}'
    mongo_service_alias: '{{ databases.mongodb.service_alias | default('''') }}'
    mongo_tls_mode: '{{ databases.mongodb.tls_mode | default(''preferTLS'') }}'
    mongo_alias_tls_cutover_enabled: '{{ databases.mongodb.alias_tls_cutover_enabled | default(false) | bool }}'
    mongo_tls_cutover_confirmed: '{{ databases.mongodb.tls_cutover_confirmed | default(false) | bool }}'
- name: Set stable database endpoint variables
  set_fact:
    database_alias_ca_name: database-client-ca
    database_alias_ca_enabled: '{{ pg_service_alias | length > 0 }}'
    pg_connection_host: >-
      {{
        (pg_service_alias ~ '.databases.svc.cluster.local')
        if (pg_service_alias | length > 0)
        else
        ((project_name | default('k8s')) ~ '-pg-pgbouncer.databases.svc.cluster.local')
      }}
    pg_alias_tls_secret: >-
      {{
        (pg_service_alias ~ '-tls')
        if (pg_service_alias | length > 0)
        else ''
      }}
    mongo_alias_tls_secret: >-
      {{
        (mongo_service_alias ~ '-tls')
        if (mongo_service_alias | length > 0)
        else ''
      }}
- name: Validate the staged MongoDB TLS cutover gate
  ansible.builtin.assert:
    that:
    - mongo_tls_mode in ['preferTLS', 'requireTLS']
    - not mongo_alias_tls_cutover_enabled | bool or mongo_tls_cutover_confirmed | bool
    - mongo_tls_mode != 'requireTLS' or (mongo_alias_tls_cutover_enabled | bool and mongo_tls_cutover_confirmed | bool)
    fail_msg: >-
      MongoDB tls_mode=requireTLS is a final cutover, not a bootstrap setting.
      First deploy the short Service and alias certificate without changing the
      operator-managed MongoDB TLS Secrets. Mount mongodb-client-ca in every
      consumer, prove every client against the operator-CA-signed alias
      certificate, then set alias_tls_cutover_enabled=true and
      tls_cutover_confirmed=true. requireTLS additionally requires both gates.
  when: mongo_service_alias | length > 0
- name: Validate the staged PostgreSQL TLS cutover gate
  ansible.builtin.assert:
    that:
    - pg_tls_mode in ['preferTLS', 'requireTLS']
    - pg_tls_mode != 'requireTLS' or pg_tls_cutover_confirmed | bool
    fail_msg: >-
      PostgreSQL tls_mode=requireTLS is a final cutover, not a bootstrap
      setting. First deploy the PgBouncer alias certificate with preferTLS,
      mount the CA and enable verify-full in every direct and pooled consumer,
      prove no plaintext sessions remain, then set tls_cutover_confirmed=true
      together with requireTLS.
  when: pg_service_alias | length > 0
- name: Validate extra PostgreSQL consumer declarations
  ansible.builtin.assert:
    that:
    - item.operator is mapping
    - item.operator.name is match('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
    - item.operator.databases is sequence
    - item.operator.databases | length > 0
    - item.target_namespace is match('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
    fail_msg: >-
      Each databases.postgresql.extra_users entry must separate the
      operator-supported user spec under operator from delivery metadata.
      Required fields are operator.name, operator.databases, and
      target_namespace.
  loop: '{{ databases.postgresql.extra_users | default([]) }}'
  when: platform_postgresql_enabled | default(true) | bool
- name: Validate MongoDB TLS client consumer declarations
  ansible.builtin.assert:
    that:
    - item.name is match('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
    - item.namespace is match('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
    - item.secret_name is match('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
    - item.namespace in (databases.mongodb.tls_consumer_namespaces | default([]))
    fail_msg: >-
      Each databases.mongodb.tls_client_consumers entry requires DNS-safe
      name, namespace, and secret_name fields. Its namespace must also be in
      tls_consumer_namespaces so the server CA and client identity are
      published together.
  loop: '{{ databases.mongodb.tls_client_consumers | default([]) }}'
  when: platform_mongodb_enabled | default(true) | bool
- name: Create databases namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: databases
        labels:
          app.kubernetes.io/part-of: databases
          pod-security.kubernetes.io/enforce: baseline
          pod-security.kubernetes.io/warn: restricted
  register: _r_create_databases_namespace
  retries: 3
  delay: 10
  until: _r_create_databases_namespace is not failed
  when: >-
    (platform_postgresql_enabled | default(true) | bool)
    or (platform_mongodb_enabled | default(true) | bool)
- name: Read the active SeaweedFS backup identity before reconciling database clients
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: seaweedfs-backup-credentials
    namespace: storage
  register: _active_seaweedfs_backup_identity
  no_log: true
  when:
  - platform_backup_enabled | default(backup_enabled) | bool
  - >-
    (platform_postgresql_enabled | default(true) | bool)
    or (platform_mongodb_enabled | default(true) | bool)
- name: Reject unilateral database backup credential rotation
  ansible.builtin.assert:
    that:
    - (_active_seaweedfs_backup_identity.resources | default([])) | length == 1
    - >-
      _active_seaweedfs_backup_identity.resources[0].data.AWS_ACCESS_KEY_ID
      | b64decode
      == object_storage_backup_access_key
    - >-
      _active_seaweedfs_backup_identity.resources[0].data.AWS_SECRET_ACCESS_KEY
      | b64decode
      == object_storage_backup_secret_key
    fail_msg: >-
      The persisted database backup identity differs from the active SeaweedFS
      backup identity. Refusing to rotate only PostgreSQL/MongoDB because that
      would make every backup and restore fail. Reconcile the encrypted
      project-scoped platform secret with storage/seaweedfs-backup-credentials,
      then rerun the database component.
  no_log: true
  when:
  - platform_backup_enabled | default(backup_enabled) | bool
  - >-
    (platform_postgresql_enabled | default(true) | bool)
    or (platform_mongodb_enabled | default(true) | bool)
- name: Create database alias bootstrap issuer
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cert-manager.io/v1
      kind: Issuer
      metadata:
        name: database-client-selfsigned
        namespace: '{{ db_ns }}'
        labels:
          app.kubernetes.io/managed-by: ansible
          app.kubernetes.io/part-of: databases
      spec:
        selfSigned: {}
  when: database_alias_ca_enabled | bool
- name: Create database alias client CA
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cert-manager.io/v1
      kind: Certificate
      metadata:
        name: '{{ database_alias_ca_name }}'
        namespace: '{{ db_ns }}'
        labels:
          app.kubernetes.io/managed-by: ansible
          app.kubernetes.io/part-of: databases
      spec:
        commonName: database-client-ca
        secretName: '{{ database_alias_ca_name }}'
        isCA: true
        duration: 43800h
        renewBefore: 720h
        privateKey:
          algorithm: ECDSA
          size: 256
          rotationPolicy: Always
        issuerRef:
          name: database-client-selfsigned
          kind: Issuer
          group: cert-manager.io
  when: database_alias_ca_enabled | bool
- name: Wait for database alias client CA
  kubernetes.core.k8s_info:
    api_version: cert-manager.io/v1
    kind: Certificate
    namespace: '{{ db_ns }}'
    name: '{{ database_alias_ca_name }}'
  register: _database_alias_ca_certificate
  until: >-
    (_database_alias_ca_certificate.resources | default([])) | length == 1
    and
    (
      _database_alias_ca_certificate.resources[0].status.conditions
      | default([])
      | selectattr('type', 'equalto', 'Ready')
      | selectattr('status', 'equalto', 'True')
      | list
      | length
    ) == 1
  retries: 60
  delay: 5
  when: database_alias_ca_enabled | bool
- name: Create database alias CA issuer
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cert-manager.io/v1
      kind: Issuer
      metadata:
        name: database-client-ca
        namespace: '{{ db_ns }}'
        labels:
          app.kubernetes.io/managed-by: ansible
          app.kubernetes.io/part-of: databases
      spec:
        ca:
          secretName: '{{ database_alias_ca_name }}'
  when: database_alias_ca_enabled | bool
- name: Issue hostname-verified PostgreSQL alias certificate
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cert-manager.io/v1
      kind: Certificate
      metadata:
        name: '{{ pg_alias_tls_secret }}'
        namespace: '{{ db_ns }}'
        labels:
          app.kubernetes.io/managed-by: ansible
          app.kubernetes.io/part-of: databases
      spec:
        secretName: '{{ pg_alias_tls_secret }}'
        commonName: '{{ project_name | default(''k8s'') }}-pg-pgbouncer'
        duration: 2160h
        renewBefore: 360h
        privateKey:
          algorithm: ECDSA
          size: 256
          rotationPolicy: Always
        usages:
        - server auth
        - client auth
        dnsNames:
        - '{{ pg_service_alias }}'
        - '{{ pg_service_alias }}.{{ db_ns }}'
        - '{{ pg_service_alias }}.{{ db_ns }}.svc'
        - '{{ pg_service_alias }}.{{ db_ns }}.svc.cluster.local'
        - '{{ project_name | default(''k8s'') }}-pg-pgbouncer'
        - '{{ project_name | default(''k8s'') }}-pg-pgbouncer.{{ db_ns }}'
        - '{{ project_name | default(''k8s'') }}-pg-pgbouncer.{{ db_ns }}.svc'
        - '{{ project_name | default(''k8s'') }}-pg-pgbouncer.{{ db_ns }}.svc.cluster.local'
        issuerRef:
          name: database-client-ca
          kind: Issuer
          group: cert-manager.io
  when:
  - platform_postgresql_enabled | default(true) | bool
  - pg_service_alias | length > 0
- name: Wait for PostgreSQL alias certificate
  kubernetes.core.k8s_info:
    api_version: cert-manager.io/v1
    kind: Certificate
    namespace: '{{ db_ns }}'
    name: '{{ item }}'
  loop: '{{ [pg_alias_tls_secret] }}'
  register: _database_alias_leaf_certificates
  until: >-
    (_database_alias_leaf_certificates.resources | default([])) | length == 1
    and
    (
      _database_alias_leaf_certificates.resources[0].status.conditions
      | default([])
      | selectattr('type', 'equalto', 'Ready')
      | selectattr('status', 'equalto', 'True')
      | list
      | length
    ) == 1
  retries: 60
  delay: 5
  when:
  - platform_postgresql_enabled | default(true) | bool
  - pg_service_alias | length > 0
- name: Bound operator-created database helper containers at admission
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: LimitRange
      metadata:
        name: database-container-defaults
        namespace: '{{ db_ns }}'
        labels:
          app.kubernetes.io/part-of: databases
      spec:
        limits:
        - type: Container
          default: '{{ database_container_default_resources.limits }}'
          defaultRequest: '{{ database_container_default_resources.requests }}'
  register: _r_bound_operator_created_database_helpers
  retries: 3
  delay: 10
  until: _r_bound_operator_created_database_helpers is not failed
  when: >-
    (platform_postgresql_enabled | default(true) | bool)
    or (platform_mongodb_enabled | default(true) | bool)
- name: Add Percona Helm repository
  kubernetes.core.helm_repository:
    name: percona
    repo_url: https://percona.github.io/percona-helm-charts
  register: _r_add_percona_helm_repository
  retries: 3
  delay: 10
  until: _r_add_percona_helm_repository is not failed
  when: >-
    (platform_postgresql_enabled | default(true) | bool)
    or (platform_mongodb_enabled | default(true) | bool)
- name: Check PG Operator Helm release status
  ansible.builtin.command: helm status percona-pg-operator -n {{ db_ns }} -o json
  register: _pg_operator_helm_status
  failed_when: false
  changed_when: false
  when: platform_postgresql_enabled | default(true) | bool
- name: Remove failed PG Operator Helm release before reinstall
  kubernetes.core.helm:
    name: percona-pg-operator
    release_namespace: '{{ db_ns }}'
    release_state: absent
    wait: true
  when:
  - platform_postgresql_enabled | default(true) | bool
  - _pg_operator_helm_status.rc == 0
  - (_pg_operator_helm_status.stdout | from_json).info.status | default('') == 'failed'
- name: Install Percona PG Operator
  kubernetes.core.helm:
    name: percona-pg-operator
    chart_ref: percona/pg-operator
    chart_version: '{{ pg_operator_ver }}'
    release_namespace: '{{ db_ns }}'
    create_namespace: true
    release_state: present
    wait: false
    timeout: 10m0s
  register: _r_install_percona_pg_operator
  retries: 3
  delay: 30
  until: _r_install_percona_pg_operator is not failed
  when: platform_postgresql_enabled | default(true) | bool
- name: Harden PG Operator pod security and allow slow image pulls
  shell: |
    DEPLOY=$(kubectl get deployment -n {{ db_ns }} -l app.kubernetes.io/name=pg-operator -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
    if [ -z "$DEPLOY" ]; then DEPLOY="percona-pg-operator"; fi
    kubectl patch deployment "$DEPLOY" -n {{ db_ns }} \
      -p '{"spec":{"progressDeadlineSeconds":1800,"template":{"spec":{"securityContext":{"seccompProfile":{"type":"RuntimeDefault"}}}}}}' \
      --type=merge
  register: _r_patch_pg_operator_progress_deadline
  retries: 10
  delay: 15
  until: _r_patch_pg_operator_progress_deadline.rc == 0
  changed_when: _r_patch_pg_operator_progress_deadline.rc == 0
  when: platform_postgresql_enabled | default(true) | bool
- name: Wait for PG Operator to be ready
  kubernetes.core.k8s_info:
    kind: Deployment
    namespace: '{{ db_ns }}'
    label_selectors:
    - app.kubernetes.io/name=pg-operator
  register: pg_operator_deploy
  until: >-
    (pg_operator_deploy.resources | default([])) | length > 0 and (pg_operator_deploy.resources[0].status.readyReplicas | default(0)) >= 1
  retries: 120
  delay: 15
  when: platform_postgresql_enabled | default(true) | bool
- name: Create pgbackrest S3 credentials secret
  no_log: true
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: pgbackrest-s3-creds
        namespace: '{{ db_ns }}'
      type: Opaque
      stringData:
        s3.conf: |
          [global]
          repo2-s3-key={{ object_storage_backup_access_key }}
          repo2-s3-key-secret={{ object_storage_backup_secret_key }}
  register: _r_create_pgbackrest_s3_credentials_secret
  retries: 3
  delay: 10
  until: _r_create_pgbackrest_s3_credentials_secret is not failed
  when: platform_postgresql_enabled | default(true) | bool
- name: Read the persisted PMM 3 token for component-only reconciliations
  kubernetes.core.k8s_info:
    kind: Secret
    namespace: monitoring
    name: pmm-client-credentials
  register: _persisted_pmm_credentials
  no_log: true
  when:
  - pmm_enabled | default(false) | bool
  - pmm_server_token | default('') | length == 0
- name: Restore the persisted PMM 3 token fact
  ansible.builtin.set_fact:
    pmm_server_token: '{{ _persisted_pmm_credentials.resources[0].data.PMM_SERVER_TOKEN | b64decode }}'
  no_log: true
  when:
  - pmm_enabled | default(false) | bool
  - pmm_server_token | default('') | length == 0
  - (_persisted_pmm_credentials.resources | default([])) | length == 1
- name: Require PMM 3 credentials before enabling database clients
  ansible.builtin.assert:
    that:
    - pmm_server_token | default('') | length > 0
    fail_msg: >-
      PMM is enabled, but monitoring/pmm-client-credentials does not contain
      a PMM_SERVER_TOKEN. Reconcile the observability role first.
  no_log: true
  when: pmm_enabled | default(false) | bool
- name: Allow database PMM clients to reach the monitoring namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: allow-pmm-egress
        namespace: '{{ db_ns }}'
      spec:
        endpointSelector: {}
        egress:
        - toEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: monitoring
              k8s:app: pmm-server
          toPorts:
          - ports:
            - port: '443'
              protocol: TCP
            - port: '8443'
              protocol: TCP
  when: pmm_enabled | default(false) | bool
- name: Allow PMM Server ingress from database clients
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: allow-pmm-database-ingress
        namespace: monitoring
      spec:
        endpointSelector:
          matchLabels:
            k8s:app: pmm-server
        ingress:
        - fromEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: databases
          toPorts:
          - ports:
            - port: '8443'
              protocol: TCP
  when: pmm_enabled | default(false) | bool
- name: Remove obsolete PMM 2 keys from database client credentials
  kubernetes.core.k8s:
    state: patched
    kind: Secret
    namespace: '{{ db_ns }}'
    name: pmm-secret
    definition:
      data:
        PMM_SERVER_API_KEY: null
        PMM_SERVER_USER: null
        PMM_SERVER_PASSWORD: null
  no_log: true
  when: pmm_enabled | default(false) | bool
- name: Create PMM credentials secret for databases namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: pmm-secret
        namespace: '{{ db_ns }}'
      type: Opaque
      stringData:
        PMM_SERVER_TOKEN: '{{ pmm_server_token }}'
  register: _r_create_pmm_credentials_secret_for_databa
  retries: 3
  delay: 10
  until: _r_create_pmm_credentials_secret_for_databa is not failed
  no_log: true
  when: >-
    (pmm_enabled | default(false) | bool)
    and ((platform_postgresql_enabled | default(true) | bool)
    or (platform_mongodb_enabled | default(true) | bool))
- name: Create PostgreSQL cluster (PG Operator 3.x — v2 API)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: pgv2.percona.com/v2
      kind: PerconaPGCluster
      metadata:
        name: '{{ project_name | default(''k8s'') }}-pg'
        namespace: '{{ db_ns }}'
        labels:
          app.kubernetes.io/managed-by: percona-pg-operator
          app.kubernetes.io/version: '{{ pg_operator_ver }}'
      spec:
        crVersion: '{{ pg_operator_ver }}'
        image: percona/percona-distribution-postgresql:18.4-1
        postgresVersion: '{{ pg_version }}'
        port: 5432
        tlsOnly: '{{ pg_tls_mode == ''requireTLS'' }}'
        instances:
        - name: instance1
          replicas: '{{ pg_replicas | int }}'
          # Local-PV replicas can be physically pinned to a control-plane node.
          # Preserve only that case when a grown compact cluster dedicates its
          # control plane; ordinary workloads remain blocked by NoSchedule.
          tolerations: >-
            {{
              [{
                'key': 'node-role.kubernetes.io/control-plane',
                'operator': 'Exists',
                'effect': 'NoSchedule'
              }]
              if (
                tier == 'production'
                or (
                  local_storage_enabled | default(false) | bool
                  and pg_data_storage_class == local_storage_class
                  and not (cp_schedulable | default(false) | bool)
                )
              )
              else []
            }}
          dataVolumeClaimSpec:
            accessModes:
            - ReadWriteOnce
            storageClassName: '{{ pg_data_storage_class }}'
            resources:
              requests:
                storage: '{{ pg_storage }}'
          resources:
            requests:
              cpu: '{{ ''100m'' if resource_tier in [''minimal'', ''small''] else ''250m'' }}'
              memory: '{{ ''256Mi'' if resource_tier in [''minimal'', ''small''] else ''512Mi'' }}'
            limits:
              cpu: '{{ ''500m'' if resource_tier in [''minimal'', ''small''] else ''1'' }}'
              memory: '{{ ''1Gi'' if resource_tier in [''minimal'', ''small''] else ''2Gi'' }}'
          containers:
            replicaCertCopy:
              resources: '{{ postgresql_replica_cert_copy_resources }}'
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchLabels:
                    postgres-operator.crunchydata.com/cluster: '{{ project_name | default(''k8s'') }}-pg'
                    postgres-operator.crunchydata.com/data: postgres
                topologyKey: kubernetes.io/hostname
        proxy:
          pgBouncer:
            replicas: '{{ pg_proxy_replicas | int }}'
            image: percona/percona-pgbouncer:1.25.2-1
            customTLSSecret: >-
              {{
                {'name': pg_alias_tls_secret}
                if (pg_service_alias | length > 0)
                else omit
              }}
            config:
              global:
                pool_mode: transaction
                max_client_conn: '1000'
                default_pool_size: '25'
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 512Mi
            affinity:
              podAntiAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      postgres-operator.crunchydata.com/role: pgbouncer
                  topologyKey: kubernetes.io/hostname
        backups:
          pgbackrest:
            image: percona/percona-pgbackrest:2.58.0-2
            containers:
              pgbackrest:
                resources: '{{ postgresql_pgbackrest_resources }}'
              pgbackrestConfig:
                resources: '{{ postgresql_pgbackrest_config_resources }}'
            initContainer:
              image: docker.io/percona/percona-postgresql-operator:{{ pg_operator_ver }}
              resources: '{{ postgresql_pgbackrest_init_resources }}'
            jobs:
              resources: '{{ postgresql_pgbackrest_job_resources }}'
              ttlSecondsAfterFinished: '{{ postgresql_pgbackrest_job_ttl_seconds | int }}'
            repoHost:
              resources: '{{ postgresql_pgbackrest_repo_host_resources }}'
            configuration:
            - secret:
                name: pgbackrest-s3-creds
            global:
              repo1-retention-full: '7'
              repo1-retention-diff: '4'
              repo2-s3-uri-style: path
              repo2-path: /pgbackrest/{{ project_name | default('k8s') }}-pg/repo2
              repo2-retention-full: '4'
              repo2-retention-full-type: count
            repos:
            - name: repo1
              schedules: "{{ {'full': (backup_schedule | default('0 2 * * *')), 'differential': '0 */6 * * *'} if (platform_backup_enabled | default(backup_enabled) | bool) else {} }}"
              volume:
                volumeClaimSpec:
                  accessModes:
                  - ReadWriteOnce
                  storageClassName: '{{ pg_repo_storage_class }}'
                  resources:
                    requests:
                      storage: '{{ pg_repo_storage }}'
            - name: repo2
              schedules: "{{ {'full': '0 3 * * 0'} if (platform_backup_enabled | default(backup_enabled) | bool) else {} }}"
              s3:
                bucket: backups
                endpoint: "{{ object_storage_endpoint | default('http://seaweedfs-filer.storage.svc.cluster.local:8333') }}"
                region: us-east-1
        pmm:
          enabled: '{{ pmm_enabled | default(false) | bool }}'
          image: percona/pmm-client:3.8.1
          serverHost: pmm-server.monitoring.svc.cluster.local
          secret: pmm-secret
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
        extensions:
          builtin:
            pg_stat_statements: true
        patroni:
          dynamicConfiguration:
            postgresql:
              parameters:
                shared_preload_libraries: pg_stat_statements
                pg_stat_statements.track: all
                track_activity_query_size: '2048'
                track_io_timing: 'on'
                log_checkpoints: 'on'
                log_lock_waits: 'on'
                log_temp_files: '0'
              pg_hba:
              - local all all scram-sha-256
              - local all "postgres" peer
              - hostssl replication "_crunchyrepl" all cert
              - hostssl "postgres" "_crunchyrepl" all cert
              - host all "_crunchyrepl" all reject
              - host all "monitor" "127.0.0.0/8" scram-sha-256
              - host all "monitor" "::1/128" scram-sha-256
              - host all "monitor" all reject
              - hostssl all "_crunchypgbouncer" all scram-sha-256
              - host all "_crunchypgbouncer" all reject
              - hostssl all all all scram-sha-256
              - "{{ 'host all all all reject' if pg_tls_mode == 'requireTLS' else 'host all all all scram-sha-256' }}"
        users: >-
          {{
            [
              {'name': project_name | default('k8s'),
               'databases': [project_name | default('k8s')]},
              {'name': 'gitlab', 'databases': ['gitlabhq_production']},
              {'name': app_name | default('myapp'),
               'databases': [app_name | default('myapp')]},
              {'name': 'temporal',
               'databases': ['temporal', 'temporal_visibility']},
              {'name': 'glitchtip', 'databases': ['glitchtip']}
            ] + (
              [
                {
                  'name': 'umami',
                  'databases': ['umami'],
                  'grantPublicSchemaAccess': true
                }
              ]
              if platform_umami_enabled | default(false) | bool
              else []
            ) + (
              databases.postgresql.extra_users | default([]) |
              map(attribute='operator') | list
            )
          }}
  register: _r_create_postgresql_cluster
  retries: 3
  delay: 10
  until: _r_create_postgresql_cluster is not failed
  when: platform_postgresql_enabled | default(true) | bool
- name: Create stable short PostgreSQL service alias
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: '{{ pg_service_alias }}'
        namespace: '{{ db_ns }}'
        labels:
          app.kubernetes.io/name: pgbouncer
          app.kubernetes.io/instance: '{{ project_name | default(''k8s'') }}-pg'
          app.kubernetes.io/managed-by: ansible
      spec:
        ports:
        - appProtocol: postgresql
          name: pgbouncer
          port: 5432
          protocol: TCP
          targetPort: 5432
        selector:
          postgres-operator.crunchydata.com/cluster: '{{ project_name | default(''k8s'') }}-pg'
          postgres-operator.crunchydata.com/role: pgbouncer
  register: _r_create_postgresql_service_alias
  retries: 3
  delay: 10
  until: _r_create_postgresql_service_alias is not failed
  when:
  - platform_postgresql_enabled | default(true) | bool
  - pg_service_alias | length > 0
- name: Discover unscheduled PostgreSQL pods left from an obsolete template
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: '{{ db_ns }}'
    label_selectors:
    - postgres-operator.crunchydata.com/cluster={{ project_name | default('k8s') }}-pg
    - postgres-operator.crunchydata.com/data=postgres
    field_selectors:
    - status.phase=Pending
  register: _pending_postgresql_pods
  when: platform_postgresql_enabled | default(true) | bool
- name: Re-read unscheduled PostgreSQL pod candidates before replacement
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: '{{ db_ns }}'
    name: '{{ item.metadata.name }}'
  loop: '{{ _pending_postgresql_pods.resources | default([]) }}'
  register: _current_pending_postgresql_pods
  when: platform_postgresql_enabled | default(true) | bool
- name: Recreate unscheduled PostgreSQL pods from the current operator template
  kubernetes.core.k8s:
    state: absent
    kind: Pod
    namespace: '{{ db_ns }}'
    name: '{{ item.resources[0].metadata.name }}'
    wait: false
  loop: '{{ _current_pending_postgresql_pods.results | default([]) }}'
  when:
  - platform_postgresql_enabled | default(true) | bool
  - item.resources | default([]) | length == 1
  - item.resources[0].metadata.uid == item.item.metadata.uid
  - item.resources[0].status.phase | default('') == 'Pending'
  - item.resources[0].spec.nodeName | default('') | length == 0
- name: Wait for PostgreSQL cluster to be ready
  kubernetes.core.k8s_info:
    api_version: pgv2.percona.com/v2
    kind: PerconaPGCluster
    namespace: '{{ db_ns }}'
    name: '{{ project_name | default(''k8s'') }}-pg'
  register: pg_cluster
  until: >-
    (pg_cluster.resources | default([])) | length > 0 and
    (pg_cluster.resources[0].status.state | default('')) == 'ready' and
    (pg_cluster.resources[0].status.postgres.ready | default(0) | int) == (pg_replicas | int) and
    (pg_cluster.resources[0].status.pgbouncer.ready | default(0) | int) == (pg_proxy_replicas | int)
  retries: 60
  delay: 15
  when: platform_postgresql_enabled | default(true) | bool
- name: Build PostgreSQL role search path settings
  ansible.builtin.set_fact:
    _pg_role_search_paths: >-
      {{
        (
          databases.postgresql.extra_users | default([]) |
          selectattr('search_path', 'defined') | list
        ) + (
          [
            {
              'operator': {'name': 'umami'},
              'search_path': 'public'
            }
          ]
          if platform_umami_enabled | default(false) | bool
          else []
        )
      }}
  when: platform_postgresql_enabled | default(true) | bool
- name: Validate PostgreSQL role search paths
  ansible.builtin.assert:
    that:
    - item.operator.name is match('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
    - item.search_path is match('^[a-z_][a-z0-9_]*$')
    fail_msg: >-
      PostgreSQL extra-user names must be DNS-compatible operator identities,
      and search_path values must be lowercase SQL identifiers.
  loop: '{{ _pg_role_search_paths | default([]) }}'
  when: platform_postgresql_enabled | default(true) | bool
- name: Discover the PostgreSQL primary for role settings
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: '{{ db_ns }}'
    label_selectors:
    - postgres-operator.crunchydata.com/cluster={{ project_name | default('k8s') }}-pg
    - postgres-operator.crunchydata.com/role=primary
  register: _pg_role_primary
  until: (_pg_role_primary.resources | default([])) | length == 1
  retries: 30
  delay: 5
  when:
  - platform_postgresql_enabled | default(true) | bool
  - (_pg_role_search_paths | default([]) | length) > 0
- name: Configure PostgreSQL role search paths
  kubernetes.core.k8s_exec:
    namespace: '{{ db_ns }}'
    pod: '{{ _pg_role_primary.resources[0].metadata.name }}'
    container: database
    command: >-
      psql -v ON_ERROR_STOP=1 -d postgres
      -c 'ALTER ROLE "{{ item.operator.name }}" SET search_path TO
      "{{ item.search_path }}", pg_catalog;'
  loop: '{{ _pg_role_search_paths | default([]) }}'
  when: platform_postgresql_enabled | default(true) | bool
- name: Check MongoDB Operator Helm release status
  ansible.builtin.command: helm status percona-server-mongodb-operator -n {{ db_ns }} -o json
  register: _mongo_operator_helm_status
  failed_when: false
  changed_when: false
  when: platform_mongodb_enabled | default(true) | bool
- name: Remove failed MongoDB Operator Helm release before reinstall
  kubernetes.core.helm:
    name: percona-server-mongodb-operator
    release_namespace: '{{ db_ns }}'
    release_state: absent
    wait: true
  when:
  - platform_mongodb_enabled | default(true) | bool
  - _mongo_operator_helm_status.rc == 0
  - (_mongo_operator_helm_status.stdout | from_json).info.status | default('') == 'failed'
- name: Reconcile MongoDB Operator CRDs for the selected version
  ansible.builtin.shell: |
    set -o pipefail
    helm show crds percona/psmdb-operator --version {{ psmdb_operator_ver }} |
      kubectl apply --server-side \
        --force-conflicts \
        --field-manager=ansible-psmdb-crds \
        -f -
  args:
    executable: /bin/bash
  register: _psmdb_crd_reconcile
  retries: 3
  delay: 15
  until: _psmdb_crd_reconcile.rc == 0
  changed_when: >-
    (' created' in _psmdb_crd_reconcile.stdout)
    or (' configured' in _psmdb_crd_reconcile.stdout)
    or (' serverside-applied' in _psmdb_crd_reconcile.stdout)
  when: platform_mongodb_enabled | default(true) | bool
- name: Install Percona MongoDB Operator
  kubernetes.core.helm:
    name: percona-server-mongodb-operator
    chart_ref: percona/psmdb-operator
    chart_version: '{{ psmdb_operator_ver }}'
    release_namespace: '{{ db_ns }}'
    create_namespace: true
    release_state: present
    wait: false
    timeout: 10m0s
    values:
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 2
        runAsGroup: 2
        fsGroup: 2
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
        readOnlyRootFilesystem: true
        seccompProfile:
          type: RuntimeDefault
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 250m
          memory: 256Mi
  register: _r_install_percona_mongodb_operator
  retries: 3
  delay: 30
  until: _r_install_percona_mongodb_operator is not failed
  when: platform_mongodb_enabled | default(true) | bool
- name: Increase MongoDB Operator progressDeadlineSeconds for slow image pulls
  shell: |
    DEPLOY=$(kubectl get deployment -n {{ db_ns }} -l app.kubernetes.io/name=psmdb-operator -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
    if [ -z "$DEPLOY" ]; then DEPLOY="percona-server-mongodb-operator"; fi
    kubectl patch deployment "$DEPLOY" -n {{ db_ns }} -p '{"spec":{"progressDeadlineSeconds":1800}}' --type=merge
  register: _r_patch_mongo_operator_progress_deadline
  retries: 10
  delay: 15
  until: _r_patch_mongo_operator_progress_deadline.rc == 0
  changed_when: _r_patch_mongo_operator_progress_deadline.rc == 0
  when: platform_mongodb_enabled | default(true) | bool
- name: Wait for MongoDB Operator to be ready
  kubernetes.core.k8s_info:
    kind: Deployment
    namespace: '{{ db_ns }}'
    label_selectors:
    - app.kubernetes.io/name=psmdb-operator
  register: mongo_operator_deploy
  until: >-
    (mongo_operator_deploy.resources | default([])) | length > 0 and (mongo_operator_deploy.resources[0].status.readyReplicas | default(0)) >= 1
  retries: 120
  delay: 15
  when: platform_mongodb_enabled | default(true) | bool
- name: Create MongoDB backup credentials for object storage
  no_log: true
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: object-storage-backup-credentials
        namespace: '{{ db_ns }}'
      stringData:
        AWS_ACCESS_KEY_ID: '{{ object_storage_backup_access_key }}'
        AWS_SECRET_ACCESS_KEY: '{{ object_storage_backup_secret_key }}'
  register: _r_create_mongodb_backup_credentials_for_mi
  retries: 3
  delay: 10
  until: _r_create_mongodb_backup_credentials_for_mi is not failed
  when: platform_mongodb_enabled | default(true) | bool
- name: Read the staged MongoDB alias certificate before cutover
  kubernetes.core.k8s_info:
    kind: Secret
    namespace: '{{ db_ns }}'
    name: '{{ mongo_alias_tls_secret }}'
  register: _mongo_cutover_alias_tls_secret
  no_log: true
  when:
  - platform_mongodb_enabled | default(true) | bool
  - mongo_alias_tls_cutover_enabled | bool
- name: Read the active MongoDB operator CA before cutover
  kubernetes.core.k8s_info:
    kind: Secret
    namespace: '{{ db_ns }}'
    name: '{{ project_name | default(''k8s'') }}-mongo-ca-cert'
  register: _mongo_cutover_operator_ca_secret
  no_log: true
  when:
  - platform_mongodb_enabled | default(true) | bool
  - mongo_alias_tls_cutover_enabled | bool
- name: Reject a MongoDB alias certificate signed by a different CA
  ansible.builtin.assert:
    that:
    - (_mongo_cutover_alias_tls_secret.resources | default([])) | length == 1
    - (_mongo_cutover_operator_ca_secret.resources | default([])) | length == 1
    - >-
      _mongo_cutover_alias_tls_secret.resources[0].data["ca.crt"]
      == _mongo_cutover_operator_ca_secret.resources[0].data["ca.crt"]
    fail_msg: >-
      Refusing the MongoDB TLS cutover: the staged short-alias certificate is
      missing or is not signed by the active Percona operator CA. Reconcile
      once with alias_tls_cutover_enabled=false, wait for the alias certificate
      to become Ready, prove clients with mongodb-client-ca, then confirm the
      cutover explicitly.
  no_log: true
  when:
  - platform_mongodb_enabled | default(true) | bool
  - mongo_alias_tls_cutover_enabled | bool
- name: Create MongoDB cluster
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: psmdb.percona.com/v1
      kind: PerconaServerMongoDB
      metadata:
        name: '{{ project_name | default(''k8s'') }}-mongo'
        namespace: '{{ db_ns }}'
      spec:
        crVersion: '{{ psmdb_operator_ver }}'
        image: percona/percona-server-mongodb:8.0.8-3
        imagePullPolicy: IfNotPresent
        secrets:
          users: percona-server-mongodb-users
          ssl: >-
            {{
              mongo_alias_tls_secret
              if (mongo_alias_tls_cutover_enabled | bool)
              else omit
            }}
          sslInternal: >-
            {{
              mongo_alias_tls_secret
              if (mongo_alias_tls_cutover_enabled | bool)
              else omit
            }}
        tls: >-
          {{
            {
              'mode': mongo_tls_mode,
              'allowInvalidCertificates': false,
              'certManagementPolicy': 'userProvidedOnly'
            }
            if (mongo_alias_tls_cutover_enabled | bool)
            else omit
          }}
        unsafeFlags:
          replsetSize: '{{ true if tier in [''minimal'', ''small''] else false }}'
          mongosSize: '{{ true if tier in [''minimal'', ''small''] else false }}'
        replsets:
        - name: rs0
          size: '{{ mongo_replicas }}'
          priorityClassName: '{{ mongodb_priority_class_name }}'
          tolerations: '{{ [{"key": "node-role.kubernetes.io/control-plane", "operator": "Exists", "effect": "NoSchedule"}] if tier == "production" else [] }}'
          storage:
            engine: wiredTiger
            wiredTiger:
              engineConfig:
                cacheSizeRatio: '{{ mongodb_wiredtiger_cache_size_ratio }}'
          volumeSpec:
            persistentVolumeClaim:
              storageClassName: '{{ mongo_data_storage_class }}'
              accessModes:
              - ReadWriteOnce
              resources:
                requests:
                  storage: '{{ mongo_storage }}'
          resources: '{{ mongodb_replset_resources }}'
          affinity:
            antiAffinityTopologyKey: kubernetes.io/hostname
        sharding:
          enabled: false
        backup:
          enabled: '{{ platform_backup_enabled | default(backup_enabled) | bool }}'
          # Allow scheduled backups to survive a brief operator or control-plane
          # interruption instead of permanently missing the daily window.
          startingDeadlineSeconds: '{{ mongodb_backup_starting_deadline_seconds | int }}'
          image: '{{ mongodb_backup_image }}'
          resources: '{{ mongodb_backup_resources }}'
          storages:
            s3-object-storage:
              type: s3
              s3:
                bucket: backups
                endpointUrl: "{{ object_storage_endpoint | default('http://seaweedfs-filer.storage.svc.cluster.local:8333') }}"
                region: us-east-1
                credentialsSecret: object-storage-backup-credentials
                prefix: mongodb/{{ project_name | default('k8s') }}-mongo
          pitr:
            enabled: '{{ platform_backup_enabled | default(backup_enabled) | bool }}'
            oplogOnly: true
            compressionType: gzip
          tasks:
          - name: daily-backup
            enabled: '{{ platform_backup_enabled | default(backup_enabled) | bool }}'
            schedule: '{{ backup_schedule | default(''0 2 * * *'') }}'
            keep: '{{ backup_retention_days | default(30) }}'
            storageName: s3-object-storage
            compressionType: gzip
          - name: weekly-full-backup
            enabled: '{{ platform_backup_enabled | default(backup_enabled) | bool }}'
            schedule: 0 3 * * 0
            keep: 8
            storageName: s3-object-storage
            compressionType: gzip
            type: physical
        pmm:
          enabled: '{{ pmm_enabled | default(false) | bool }}'
          image: percona/pmm-client:3.8.1
          serverHost: pmm-server.monitoring.svc.cluster.local
          resources: '{{ mongodb_pmm_resources }}'
  register: _r_create_mongodb_cluster
  retries: 3
  delay: 10
  until: _r_create_mongodb_cluster is not failed
  when: platform_mongodb_enabled | default(true) | bool
- name: Create stable short MongoDB service alias
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: '{{ mongo_service_alias }}'
        namespace: '{{ db_ns }}'
        labels:
          app.kubernetes.io/name: percona-server-mongodb
          app.kubernetes.io/instance: '{{ project_name | default(''k8s'') }}-mongo'
          app.kubernetes.io/managed-by: ansible
      spec:
        clusterIP: None
        publishNotReadyAddresses: false
        ports:
        - appProtocol: mongo
          name: mongodb
          port: 27017
          protocol: TCP
          targetPort: 27017
        selector:
          app.kubernetes.io/instance: '{{ project_name | default(''k8s'') }}-mongo'
          app.kubernetes.io/managed-by: percona-server-mongodb-operator
          app.kubernetes.io/name: percona-server-mongodb
          app.kubernetes.io/part-of: percona-server-mongodb
          app.kubernetes.io/replset: rs0
  register: _r_create_mongodb_service_alias
  retries: 3
  delay: 10
  until: _r_create_mongodb_service_alias is not failed
  when:
  - platform_mongodb_enabled | default(true) | bool
  - mongo_service_alias | length > 0
- name: Wait for the operator-managed MongoDB users source secret
  no_log: true
  kubernetes.core.k8s_info:
    kind: Secret
    namespace: '{{ db_ns }}'
    name: percona-server-mongodb-users
  register: mongo_users_secret
  until: (mongo_users_secret.resources | default([])) | length > 0
  retries: 30
  delay: 10
  when: platform_mongodb_enabled | default(true) | bool
- name: Remove obsolete PMM 2 keys from the MongoDB users source secret
  kubernetes.core.k8s:
    state: patched
    kind: Secret
    namespace: '{{ db_ns }}'
    name: percona-server-mongodb-users
    definition:
      data:
        PMM_SERVER_API_KEY: null
        PMM_SERVER_USER: null
        PMM_SERVER_PASSWORD: null
  no_log: true
  when:
  - platform_mongodb_enabled | default(true) | bool
  - pmm_enabled | default(false) | bool
- name: Patch MongoDB users source secret with PMM_SERVER_TOKEN
  no_log: true
  kubernetes.core.k8s:
    state: patched
    kind: Secret
    namespace: '{{ db_ns }}'
    name: percona-server-mongodb-users
    definition:
      stringData:
        PMM_SERVER_TOKEN: '{{ pmm_server_token }}'
  register: _r_patch_mongo_pmm_secret
  retries: 3
  delay: 10
  until: _r_patch_mongo_pmm_secret is not failed
  when:
    - platform_mongodb_enabled | default(true) | bool
    - pmm_enabled | default(false) | bool
- name: Wait for MongoDB cluster to be ready
  kubernetes.core.k8s_info:
    api_version: psmdb.percona.com/v1
    kind: PerconaServerMongoDB
    namespace: '{{ db_ns }}'
    name: '{{ project_name | default(''k8s'') }}-mongo'
  register: mongo_cluster
  until: >-
    (mongo_cluster.resources | default([])) | length > 0 and (mongo_cluster.resources[0].status.state | default('')) == 'ready'
  retries: 60
  delay: 15
  when: platform_mongodb_enabled | default(true) | bool
- name: Wait for the MongoDB operator CA issuer
  kubernetes.core.k8s_info:
    api_version: cert-manager.io/v1
    kind: Issuer
    namespace: '{{ db_ns }}'
    name: '{{ project_name | default(''k8s'') }}-mongo-psmdb-issuer'
  register: _mongo_operator_ca_issuer
  until: >-
    (_mongo_operator_ca_issuer.resources | default([])) | length == 1
    and
    (
      _mongo_operator_ca_issuer.resources[0].status.conditions
      | default([])
      | selectattr('type', 'equalto', 'Ready')
      | selectattr('status', 'equalto', 'True')
      | list
      | length
    ) == 1
  retries: 60
  delay: 5
  when:
  - platform_mongodb_enabled | default(true) | bool
  - mongo_service_alias | length > 0
- name: Issue hostname-verified MongoDB alias certificate
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cert-manager.io/v1
      kind: Certificate
      metadata:
        name: '{{ mongo_alias_tls_secret }}'
        namespace: '{{ db_ns }}'
        labels:
          app.kubernetes.io/managed-by: ansible
          app.kubernetes.io/part-of: databases
      spec:
        secretName: '{{ mongo_alias_tls_secret }}'
        commonName: '{{ project_name | default(''k8s'') }}-mongo'
        subject:
          organizations:
          - PSMDB
        duration: 2160h
        renewBefore: 360h
        privateKey:
          algorithm: ECDSA
          size: 256
          rotationPolicy: Always
        usages:
        - server auth
        - client auth
        dnsNames:
        - localhost
        - '{{ mongo_service_alias }}'
        - '{{ mongo_service_alias }}.{{ db_ns }}'
        - '{{ mongo_service_alias }}.{{ db_ns }}.svc'
        - '{{ mongo_service_alias }}.{{ db_ns }}.svc.cluster.local'
        - '*.{{ mongo_service_alias }}.{{ db_ns }}.svc.cluster.local'
        - '{{ project_name | default(''k8s'') }}-mongo-rs0'
        - '{{ project_name | default(''k8s'') }}-mongo-rs0.{{ db_ns }}'
        - '{{ project_name | default(''k8s'') }}-mongo-rs0.{{ db_ns }}.svc'
        - '{{ project_name | default(''k8s'') }}-mongo-rs0.{{ db_ns }}.svc.cluster.local'
        - '*.{{ project_name | default(''k8s'') }}-mongo-rs0'
        - '*.{{ project_name | default(''k8s'') }}-mongo-rs0.{{ db_ns }}'
        - '*.{{ project_name | default(''k8s'') }}-mongo-rs0.{{ db_ns }}.svc'
        - '*.{{ project_name | default(''k8s'') }}-mongo-rs0.{{ db_ns }}.svc.cluster.local'
        issuerRef:
          name: '{{ project_name | default(''k8s'') }}-mongo-psmdb-issuer'
          kind: Issuer
          group: cert-manager.io
  when:
  - platform_mongodb_enabled | default(true) | bool
  - mongo_service_alias | length > 0
- name: Wait for the MongoDB alias certificate
  kubernetes.core.k8s_info:
    api_version: cert-manager.io/v1
    kind: Certificate
    namespace: '{{ db_ns }}'
    name: '{{ mongo_alias_tls_secret }}'
  register: _mongo_alias_certificate
  until: >-
    (_mongo_alias_certificate.resources | default([])) | length == 1
    and
    (
      _mongo_alias_certificate.resources[0].status.conditions
      | default([])
      | selectattr('type', 'equalto', 'Ready')
      | selectattr('status', 'equalto', 'True')
      | list
      | length
    ) == 1
  retries: 60
  delay: 5
  when:
  - platform_mongodb_enabled | default(true) | bool
  - mongo_service_alias | length > 0
- name: Retrieve the active MongoDB operator CA
  kubernetes.core.k8s_info:
    kind: Secret
    namespace: '{{ db_ns }}'
    name: '{{ project_name | default(''k8s'') }}-mongo-ca-cert'
  register: _mongo_cluster_ca_secret
  no_log: true
  until: >-
    (_mongo_cluster_ca_secret.resources | default([])) | length == 1
    and
    (_mongo_cluster_ca_secret.resources[0].data["ca.crt"] | default('') | length) > 0
  retries: 30
  delay: 5
  when:
  - platform_mongodb_enabled | default(true) | bool
  - mongo_service_alias | length > 0
- name: Issue dedicated MongoDB client certificates
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cert-manager.io/v1
      kind: Certificate
      metadata:
        name: 'mongodb-client-{{ item.name }}'
        namespace: '{{ db_ns }}'
        labels:
          app.kubernetes.io/managed-by: ansible
          app.kubernetes.io/part-of: databases
      spec:
        secretName: 'mongodb-client-{{ item.name }}'
        commonName: '{{ item.common_name | default(item.name) }}'
        duration: 2160h
        renewBefore: 360h
        privateKey:
          algorithm: RSA
          encoding: PKCS8
          size: 2048
          rotationPolicy: Always
        usages:
        - client auth
        issuerRef:
          name: '{{ project_name | default(''k8s'') }}-mongo-psmdb-issuer'
          kind: Issuer
          group: cert-manager.io
  loop: '{{ databases.mongodb.tls_client_consumers | default([]) }}'
  when:
  - platform_mongodb_enabled | default(true) | bool
  - mongo_service_alias | length > 0
- name: Wait for dedicated MongoDB client certificates
  no_log: true
  kubernetes.core.k8s_info:
    api_version: cert-manager.io/v1
    kind: Certificate
    namespace: '{{ db_ns }}'
    name: 'mongodb-client-{{ item.name }}'
  register: _mongo_client_certificates
  until: >-
    (_mongo_client_certificates.resources | default([])) | length == 1
    and
    (
      _mongo_client_certificates.resources[0].status.conditions
      | default([])
      | selectattr('type', 'equalto', 'Ready')
      | selectattr('status', 'equalto', 'True')
      | list
      | length
    ) == 1
  retries: 60
  delay: 5
  loop: '{{ databases.mongodb.tls_client_consumers | default([]) }}'
  when:
  - platform_mongodb_enabled | default(true) | bool
  - mongo_service_alias | length > 0
- name: Retrieve dedicated MongoDB client identities
  no_log: true
  kubernetes.core.k8s_info:
    kind: Secret
    namespace: '{{ db_ns }}'
    name: 'mongodb-client-{{ item.name }}'
  register: _mongo_client_tls_secret_results
  until: >-
    (_mongo_client_tls_secret_results.resources | default([])) | length == 1
    and
    (_mongo_client_tls_secret_results.resources[0].data["ca.crt"] | default('') | length) > 0
    and
    (_mongo_client_tls_secret_results.resources[0].data["tls.crt"] | default('') | length) > 0
    and
    (_mongo_client_tls_secret_results.resources[0].data["tls.key"] | default('') | length) > 0
  retries: 30
  delay: 5
  loop: '{{ databases.mongodb.tls_client_consumers | default([]) }}'
  when:
  - platform_mongodb_enabled | default(true) | bool
  - mongo_service_alias | length > 0
- name: Wait for the MongoDB alias certificate to use the active operator CA
  kubernetes.core.k8s_info:
    kind: Secret
    namespace: '{{ db_ns }}'
    name: '{{ mongo_alias_tls_secret }}'
  register: _mongo_alias_tls_secret
  no_log: true
  until: >-
    (_mongo_alias_tls_secret.resources | default([])) | length == 1
    and
    _mongo_alias_tls_secret.resources[0].data["ca.crt"]
    == _mongo_cluster_ca_secret.resources[0].data["ca.crt"]
  retries: 60
  delay: 5
  when:
  - platform_mongodb_enabled | default(true) | bool
  - mongo_service_alias | length > 0
- name: Retrieve the database alias client CA
  no_log: true
  kubernetes.core.k8s_info:
    kind: Secret
    namespace: '{{ db_ns }}'
    name: '{{ database_alias_ca_name }}'
  register: _database_alias_ca_secret
  until: >-
    (_database_alias_ca_secret.resources | default([])) | length == 1
    and
    (_database_alias_ca_secret.resources[0].data["ca.crt"] | default('') | length) > 0
  retries: 30
  delay: 5
  when:
  - platform_postgresql_enabled | default(true) | bool
  - pg_service_alias | length > 0
- name: Retrieve the operator PostgreSQL client CA
  no_log: true
  kubernetes.core.k8s_info:
    kind: Secret
    namespace: '{{ db_ns }}'
    name: '{{ project_name | default(''k8s'') }}-pg-cluster-ca-cert'
  register: _pg_cluster_ca_secret
  until: >-
    (_pg_cluster_ca_secret.resources | default([])) | length == 1
    and
    (_pg_cluster_ca_secret.resources[0].data["ca.crt"] | default('') | length) > 0
  retries: 30
  delay: 5
  when:
  - platform_postgresql_enabled | default(true) | bool
  - pg_service_alias | length == 0
- name: Ensure MongoDB TLS consumer namespaces exist
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: '{{ item }}'
        labels:
          pod-security.kubernetes.io/enforce: restricted
          pod-security.kubernetes.io/audit: restricted
          pod-security.kubernetes.io/warn: restricted
  loop: '{{ databases.mongodb.tls_consumer_namespaces | default([]) }}'
  when:
  - platform_mongodb_enabled | default(true) | bool
  - mongo_service_alias | length > 0
- name: Publish the hostname-verifying MongoDB client CA
  no_log: true
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: mongodb-client-ca
        namespace: '{{ item }}'
        annotations:
          argocd.argoproj.io/compare-options: IgnoreExtraneous
      stringData:
        ca.crt: '{{ _mongo_cluster_ca_secret.resources[0].data["ca.crt"] | b64decode }}'
  loop: '{{ databases.mongodb.tls_consumer_namespaces | default([]) }}'
  when:
  - platform_mongodb_enabled | default(true) | bool
  - mongo_service_alias | length > 0
- name: Publish dedicated MongoDB client identities
  no_log: true
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: '{{ item.item.secret_name }}'
        namespace: '{{ item.item.namespace }}'
        annotations:
          argocd.argoproj.io/compare-options: IgnoreExtraneous
        labels:
          app.kubernetes.io/managed-by: ansible
          app.kubernetes.io/part-of: databases
      type: kubernetes.io/tls
      data:
        ca.crt: '{{ item.resources[0].data["ca.crt"] }}'
        tls.crt: '{{ item.resources[0].data["tls.crt"] }}'
        tls.key: '{{ item.resources[0].data["tls.key"] }}'
  loop: '{{ _mongo_client_tls_secret_results.results | default([]) }}'
  when:
  - platform_mongodb_enabled | default(true) | bool
  - mongo_service_alias | length > 0
- name: Retrieve Percona-generated GitLab PG password
  no_log: true
  kubernetes.core.k8s_info:
    kind: Secret
    namespace: '{{ db_ns }}'
    name: '{{ project_name | default(''k8s'') }}-pg-pguser-gitlab'
  register: gitlab_pg_secret
  until: (gitlab_pg_secret.resources | default([])) | length > 0
  retries: 30
  delay: 10
  when: platform_postgresql_enabled | default(true) | bool
- name: Set GitLab PG password fact
  set_fact:
    gitlab_pg_password: '{{ (gitlab_pg_secret.resources[0].data.password | b64decode) if gitlab_pg_secret.resources | length > 0 else '''' }}'
  no_log: true
  when: platform_postgresql_enabled | default(true) | bool
- name: Ensure GitLab namespace exists for cross-namespace secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: gitlab
        labels:
          pod-security.kubernetes.io/enforce: baseline
          pod-security.kubernetes.io/warn: restricted
  register: _r_ensure_gitlab_namespace_exists_for_cross
  retries: 3
  delay: 10
  until: _r_ensure_gitlab_namespace_exists_for_cross is not failed
  when:
  - platform_postgresql_enabled | default(true) | bool
  - platform_gitlab_enabled | default(true) | bool
- name: Create PostgreSQL connection secret for GitLab
  no_log: true
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: gitlab-postgresql-password
        namespace: gitlab
      type: Opaque
      stringData:
        postgresql-password: '{{ gitlab_pg_password }}'
        host: '{{ pg_connection_host }}'
        port: '5432'
        database: gitlabhq_production
        username: gitlab
        sslmode: verify-full
        sslrootcert: /etc/gitlab/postgresql/ca.crt
        ca.crt: >-
          {{
            _database_alias_ca_secret.resources[0].data["ca.crt"] | b64decode
            if (pg_service_alias | length > 0)
            else
            _pg_cluster_ca_secret.resources[0].data["ca.crt"] | b64decode
          }}
  register: _r_create_postgresql_connection_secret_for_
  retries: 3
  delay: 10
  until: _r_create_postgresql_connection_secret_for_ is not failed
  when:
  - platform_postgresql_enabled | default(true) | bool
  - platform_gitlab_enabled | default(true) | bool
- name: Retrieve Percona-generated app PG password
  no_log: true
  kubernetes.core.k8s_info:
    kind: Secret
    namespace: '{{ db_ns }}'
    name: '{{ project_name | default(''k8s'') }}-pg-pguser-{{ app_name | default(''myapp'') }}'
  register: app_pg_secret
  until: (app_pg_secret.resources | default([])) | length > 0
  retries: 30
  delay: 10
  when: platform_postgresql_enabled | default(true) | bool
- name: Set app PG password fact
  set_fact:
    app_pg_password: '{{ (app_pg_secret.resources[0].data.password | b64decode) if app_pg_secret.resources | length > 0 else '''' }}'
  no_log: true
  when: platform_postgresql_enabled | default(true) | bool
- name: Create PostgreSQL connection secret for application
  no_log: true
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: '{{ app_name | default(''myapp'') }}-postgresql-password'
        namespace: '{{ app_namespace | default(''production'') }}'
      type: Opaque
      stringData:
        postgresql-password: '{{ app_pg_password }}'
        host: '{{ pg_connection_host }}'
        port: '5432'
        database: '{{ app_name | default(''myapp'') }}'
        username: '{{ app_name | default(''myapp'') }}'
        sslmode: verify-full
        ca.crt: >-
          {{
            _database_alias_ca_secret.resources[0].data["ca.crt"] | b64decode
            if (pg_service_alias | length > 0)
            else
            _pg_cluster_ca_secret.resources[0].data["ca.crt"] | b64decode
          }}
  when:
  - platform_postgresql_enabled | default(true) | bool
  - app_pg_password | length > 0
  register: _r_create_postgresql_connection_secret_for_app
  retries: 3
  delay: 10
  until: _r_create_postgresql_connection_secret_for_app is not failed
- name: Ensure extra PostgreSQL consumer namespaces exist
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: '{{ item.target_namespace }}'
        labels:
          pod-security.kubernetes.io/enforce: restricted
          pod-security.kubernetes.io/audit: restricted
          pod-security.kubernetes.io/warn: restricted
  loop: '{{ databases.postgresql.extra_users | default([]) }}'
  when:
  - platform_postgresql_enabled | default(true) | bool
  - item.target_namespace | default('') | length > 0
  register: _extra_pg_namespaces
  retries: 3
  delay: 10
  until: _extra_pg_namespaces is not failed
- name: Retrieve Percona-generated extra PostgreSQL credentials
  no_log: true
  kubernetes.core.k8s_info:
    kind: Secret
    namespace: '{{ db_ns }}'
    name: >-
      {{ project_name | default('k8s') }}-pg-pguser-{{
         item.operator.name }}
  loop: '{{ databases.postgresql.extra_users | default([]) }}'
  register: _extra_pg_credentials
  until: >-
    (_extra_pg_credentials.resources | default([])) | length > 0
  retries: 30
  delay: 10
  when:
  - platform_postgresql_enabled | default(true) | bool
  - item.target_namespace | default('') | length > 0
- name: Publish extra PostgreSQL connection secrets
  no_log: true
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: >-
          {{ item.item.secret_name |
             default(item.item.operator.name ~ '-postgresql') }}
        namespace: '{{ item.item.target_namespace }}'
        annotations:
          argocd.argoproj.io/compare-options: IgnoreExtraneous
      type: Opaque
      stringData:
        username: '{{ item.item.operator.name }}'
        password: '{{ item.resources[0].data.password | b64decode }}'
        host: '{{ pg_connection_host }}'
        port: '5432'
        database: '{{ item.item.operator.databases | first }}'
        sslmode: verify-full
        ca.crt: >-
          {{
            _database_alias_ca_secret.resources[0].data["ca.crt"] | b64decode
            if (pg_service_alias | length > 0)
            else
            _pg_cluster_ca_secret.resources[0].data["ca.crt"] | b64decode
          }}
  loop: '{{ _extra_pg_credentials.results | default([]) }}'
  when:
  - platform_postgresql_enabled | default(true) | bool
  - item.resources | default([]) | length == 1
  register: _extra_pg_connection_secrets
  retries: 3
  delay: 10
  until: _extra_pg_connection_secrets is not failed
- name: Display databases summary
  debug:
    msg: >-
      {{
        ['==========================================', '  Databases Deployed', '==========================================']
        + (
          ['  PostgreSQL:',
           '    Percona PG Operator: v' ~ pg_operator_ver,
           '    PostgreSQL: ' ~ pg_version,
           '    Replicas: ' ~ pg_replicas,
           '    PgBouncer: ' ~ pg_proxy_replicas ~ ' replicas',
           '    Cluster: ' ~ (project_name | default('k8s')) ~ '-pg.' ~ db_ns,
           '    Client endpoint: ' ~ pg_connection_host,
           '    Client TLS: verify-full; server mode=' ~ pg_tls_mode,
           '    Backup: pgBackRest (daily full + 6h differential + S3 weekly)']
          if (platform_postgresql_enabled | default(true) | bool)
          else ['  PostgreSQL: DISABLED']
        )
        + (
          ['  MongoDB:',
           '    Percona PSMDB Operator: v' ~ psmdb_operator_ver,
           '    MongoDB: 8.0.x',
           '    Replicas: ' ~ mongo_replicas,
           '    Cluster: ' ~ (project_name | default('k8s')) ~ '-mongo.' ~ db_ns,
           '    Client endpoint: ' ~ (
             (mongo_service_alias ~ '.' ~ db_ns ~ '.svc.cluster.local')
             if (mongo_service_alias | length > 0)
             else ((project_name | default('k8s')) ~ '-mongo-rs0.' ~ db_ns ~ '.svc.cluster.local')
           ),
           '    Client TLS: ' ~ (
             mongo_tls_mode ~ ' + hostname verification'
             if (mongo_service_alias | length > 0)
             else 'operator default'
           ),
           '    Backup: PBM (daily logical + weekly physical + PITR/oplog)',
           '    Retention: ' ~ (backup_retention_days | default(30)) ~ ' days']
          if (platform_mongodb_enabled | default(true) | bool)
          else ['  MongoDB: DISABLED']
        )
        + ['==========================================']
      }}
  when: >-
    (platform_postgresql_enabled | default(true) | bool)
    or (platform_mongodb_enabled | default(true) | bool)
- name: Remove legacy invalid Cilium default-deny for databases namespace
  kubernetes.core.k8s:
    state: absent
    definition:
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: default-deny
        namespace: databases
  when: >-
    (platform_postgresql_enabled | default(true) | bool)
    or (platform_mongodb_enabled | default(true) | bool)
- name: Create default-deny NetworkPolicy for databases namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: default-deny
        namespace: databases
      spec:
        podSelector: {}
        policyTypes:
        - Ingress
        - Egress
        ingress: []
        egress: []
  when: >-
    (platform_postgresql_enabled | default(true) | bool)
    or (platform_mongodb_enabled | default(true) | bool)
- name: Allow PostgreSQL ingress from app/system namespaces
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: allow-postgres-ingress
        namespace: databases
      spec:
        endpointSelector: {}
        ingress:
        - fromEntities:
          - cluster
          toPorts:
          - ports:
            - port: '5432'
              protocol: TCP
            - port: '6379'
              protocol: TCP
            - port: '27017'
              protocol: TCP
  when: >-
    (platform_postgresql_enabled | default(true) | bool)
    or (platform_mongodb_enabled | default(true) | bool)
- name: Allow configured agents workloads to reach PostgreSQL
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: allow-agents-postgres
        namespace: agents
      spec:
        endpointSelector:
          matchLabels:
            k8s:app.kubernetes.io/name: "{{ databases.postgresql.agents_app_name | default('application-runtime') }}"
        egress:
        - toServices:
          - k8sService:
              serviceName: '{{ project_name | default(''k8s'') }}-pg-primary'
              namespace: databases
          toPorts:
          - ports:
            - port: '5432'
              protocol: TCP
        - toServices:
          - k8sService:
              serviceName: '{{ project_name | default(''k8s'') }}-pg-pgbouncer'
              namespace: databases
          toPorts:
          - ports:
            - port: '5432'
              protocol: TCP
        - toEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: databases
              k8s:postgres-operator.crunchydata.com/cluster: '{{ project_name | default(''k8s'') }}-pg'
              k8s:app.kubernetes.io/component: pg
          toPorts:
          - ports:
            - port: '5432'
              protocol: TCP
        - toEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: databases
              k8s:postgres-operator.crunchydata.com/cluster: '{{ project_name | default(''k8s'') }}-pg'
              k8s:postgres-operator.crunchydata.com/role: pgbouncer
          toPorts:
          - ports:
            - port: '5432'
              protocol: TCP
  when:
  - platform_postgresql_enabled | default(true) | bool
  - >-
    'agents' in (
      databases.postgresql.extra_users | default([]) |
      map(attribute='target_namespace') | list
    )
- name: Allow database egress (replication + backups)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: cilium.io/v2
      kind: CiliumNetworkPolicy
      metadata:
        name: allow-db-egress
        namespace: databases
      spec:
        endpointSelector: {}
        egress:
        - toEndpoints:
          - matchLabels: {}
        - toEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: storage
          toPorts:
          - ports:
            - port: '8333'
              protocol: TCP
        - toEntities:
          - kube-apiserver
  when: >-
    (platform_postgresql_enabled | default(true) | bool)
    or (platform_mongodb_enabled | default(true) | bool)
- name: Allow analytics (metabase) to reach postgres/pgbouncer/mongo
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: allow-from-analytics
        namespace: databases
      spec:
        podSelector: {}
        policyTypes:
          - Ingress
        ingress:
          - from:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: analytics
            ports:
              - port: 5432
                protocol: TCP
              - port: 6432
                protocol: TCP
              - port: 27017
                protocol: TCP
  when: >-
    (platform_postgresql_enabled | default(true) | bool)
    or (platform_mongodb_enabled | default(true) | bool)
- name: Create PostgreSQL VMServiceScrape
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: operator.victoriametrics.com/v1beta1
      kind: VMServiceScrape
      metadata:
        name: postgresql
        namespace: databases
        labels:
          release: prometheus
      spec:
        selector:
          matchLabels:
            cnpg.io/cluster: '{{ pg_cluster_name | default(''pg-main'') }}'
        endpoints:
        - port: metrics
          interval: 30s
  when:
  - platform_postgresql_enabled | default(true) | bool
  - platform_observability_enabled | default(false) | bool
