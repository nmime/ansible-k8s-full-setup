---
# Postal mail server deployment.
# Uses the neutral Dragonfly password generated by generate-secrets.

- name: Set Postal variables
  set_fact:
    p_ns: "{{ postal_namespace }}"
    p_img: "{{ postal_image }}:{{ postal_version }}"
    p_web_host: "{{ postal_web_hostname }}"
    p_smtp_host: "{{ postal_smtp_hostname }}"
    p_db_password: "{{ postal_db_password }}"
    p_rails_secret: "{{ postal_rails_secret }}"
    p_queue_password: "{{ dragonfly_password }}"

- name: Create Postal namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ p_ns }}"
        labels:
          pod-security.kubernetes.io/enforce: baseline
          pod-security.kubernetes.io/warn: restricted
  register: _r_postal_ns
  retries: 3
  delay: 10
  until: _r_postal_ns is not failed

- name: Create MariaDB credentials secret
  no_log: true
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: postal-mariadb-credentials
        namespace: "{{ p_ns }}"
      type: Opaque
      stringData:
        MARIADB_ROOT_PASSWORD: "{{ p_db_password }}"
        MARIADB_PASSWORD: "{{ p_db_password }}"
        MARIADB_DATABASE: postal
        MARIADB_USER: postal

- name: Deploy MariaDB StatefulSet
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: postal-mariadb
        namespace: "{{ p_ns }}"
        labels:
          app: postal-mariadb
      spec:
        serviceName: postal-mariadb
        replicas: 1
        selector:
          matchLabels:
            app: postal-mariadb
        template:
          metadata:
            labels:
              app: postal-mariadb
          spec:
            securityContext:
              fsGroup: 999
            containers:
              - name: mariadb
                image: mariadb:11.7
                ports:
                  - containerPort: 3306
                envFrom:
                  - secretRef:
                      name: postal-mariadb-credentials
                volumeMounts:
                  - name: data
                    mountPath: /var/lib/mysql
                resources:
                  requests:
                    cpu: "{{ '100m' if tier in ['minimal', 'small'] else '250m' }}"
                    memory: "{{ '256Mi' if tier in ['minimal', 'small'] else postal_mariadb_memory }}"
                  limits:
                    cpu: "{{ '500m' if tier in ['minimal', 'small'] else '1' }}"
                    memory: "{{ postal_mariadb_memory }}"
        volumeClaimTemplates:
          - metadata:
              name: data
            spec:
              accessModes: [ReadWriteOnce]
              storageClassName: "{{ storage_class | default('hcloud-volumes') }}"
              resources:
                requests:
                  storage: "{{ postal_mariadb_storage | default('10Gi') }}"

- name: Create MariaDB service
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: postal-mariadb
        namespace: "{{ p_ns }}"
      spec:
        clusterIP: None
        selector:
          app: postal-mariadb
        ports:
          - port: 3306
            targetPort: 3306

- name: Create Postal config secret
  no_log: true
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: postal-config
        namespace: "{{ p_ns }}"
      type: Opaque
      stringData:
        postal.yml: |
          version: 2
          postal:
            web_hostname: {{ p_web_host }}
            web_protocol: https
            smtp_hostname: {{ p_smtp_host }}
            default_maximum_delivery_attempts: 18
          web_server:
            default_port: 5000
            default_bind_address: 0.0.0.0
          worker:
            threads: 2
            default_health_server_port: 9090
            default_health_server_bind_address: 0.0.0.0
          main_db:
            host: postal-mariadb.{{ p_ns }}.svc.cluster.local
            port: 3306
            username: postal
            password: {{ p_db_password }}
            database: postal
            pool_size: 5
          message_db:
            host: postal-mariadb.{{ p_ns }}.svc.cluster.local
            port: 3306
            username: postal
            password: {{ p_db_password }}
            database_name_prefix: postal
          smtp_server:
            default_port: 25
            default_bind_address: "::"
            max_message_size: {{ postal_max_message_size }}
            default_health_server_port: 9091
            default_health_server_bind_address: 0.0.0.0
          dns:
            mx_records:
              - {{ p_smtp_host }}
            spf_include: {{ postal_spf_domain }}
            return_path_domain: {{ postal_return_path_domain }}
            route_domain: {{ postal_route_domain }}
            track_domain: {{ postal_track_domain }}
            helo_hostname: {{ p_smtp_host }}
          rails:
            environment: production
            secret_key: {{ p_rails_secret }}
          message_queue:
            host: dragonfly.dragonfly.svc.cluster.local
            port: 6379
            database: 0
            password: {{ p_queue_password }}
          logging:
            enabled: true

- name: Deploy Postal components
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: "postal-{{ item.name }}"
        namespace: "{{ p_ns }}"
        labels:
          app: postal
          component: "{{ item.name }}"
      spec:
        replicas: "{{ item.replicas | int }}"
        selector:
          matchLabels:
            app: postal
            component: "{{ item.name }}"
        template:
          metadata:
            labels:
              app: postal
              component: "{{ item.name }}"
          spec:
            containers:
              - name: "{{ item.name }}"
                image: "{{ p_img }}"
                command: "{{ item.command }}"
                env:
                  - name: POSTAL_CONFIG_FILE_PATH
                    value: /config/postal.yml
                ports: "{{ item.ports }}"
                volumeMounts:
                  - name: config
                    mountPath: /config/postal.yml
                    subPath: postal.yml
                resources:
                  requests:
                    cpu: "{{ item.cpu_req }}"
                    memory: "{{ item.mem_req }}"
                  limits:
                    cpu: "{{ item.cpu_lim }}"
                    memory: "{{ item.mem_lim }}"
            volumes:
              - name: config
                secret:
                  secretName: postal-config
  loop:
    - name: web
      command: [postal, web-server]
      replicas: "{{ postal_web_replicas }}"
      ports:
        - containerPort: 5000
          name: http
      cpu_req: "{{ postal_web_cpu_req }}"
      mem_req: "{{ postal_web_memory_req }}"
      cpu_lim: "{{ postal_web_cpu_lim }}"
      mem_lim: "{{ postal_web_memory_lim }}"
    - name: smtp
      command: [postal, smtp-server]
      replicas: "{{ postal_smtp_replicas }}"
      ports:
        - containerPort: 25
          name: smtp
        - containerPort: 9091
          name: health
      cpu_req: "{{ postal_smtp_cpu_req }}"
      mem_req: "{{ postal_smtp_memory_req }}"
      cpu_lim: "{{ postal_smtp_cpu_lim }}"
      mem_lim: "{{ postal_smtp_memory_lim }}"
    - name: worker
      command: [postal, worker]
      replicas: "{{ postal_worker_replicas }}"
      ports:
        - containerPort: 9090
          name: health
      cpu_req: "{{ postal_worker_cpu_req }}"
      mem_req: "{{ postal_worker_memory_req }}"
      cpu_lim: "{{ postal_worker_cpu_lim }}"
      mem_lim: "{{ postal_worker_memory_lim }}"

- name: Create Postal web service
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: postal-web
        namespace: "{{ p_ns }}"
      spec:
        type: ClusterIP
        selector:
          app: postal
          component: web
        ports:
          - name: http
            port: 5000
            targetPort: 5000

- name: Create Postal SMTP service
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: postal-smtp
        namespace: "{{ p_ns }}"
        annotations:
          load-balancer.hetzner.cloud/location: "{{ hetzner_region | default('hel1') }}"
          load-balancer.hetzner.cloud/name: "{{ project_name | default('k8s') }}-postal-smtp"
      spec:
        type: LoadBalancer
        externalTrafficPolicy: Local
        selector:
          app: postal
          component: smtp
        ports:
          - name: smtp
            port: 25
            targetPort: 25
            protocol: TCP
          - name: submission
            port: 587
            targetPort: 25
            protocol: TCP

- name: Create Postal web HTTPRoute
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: postal-web
        namespace: "{{ p_ns }}"
      spec:
        parentRefs:
          - name: admin-gateway
            namespace: cilium-system
            sectionName: https
        hostnames:
          - "{{ p_web_host }}"
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - name: postal-web
                port: 5000

- name: Display Postal deployment summary
  debug:
    msg:
      - "=========================================="
      - "  Postal {{ postal_version }} Mail Server Deployed"
      - "=========================================="
      - "  Web UI: https://{{ p_web_host }}"
      - "  SMTP: {{ p_smtp_host }}:25"
      - "  Queue: Dragonfly using dragonfly-auth secret"
      - "  Admin: admin@{{ domain }}"
      - "=========================================="
