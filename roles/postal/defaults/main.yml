---
postal_namespace: postal
postal_version: "3.3.7"
postal_image: "ghcr.io/postalserver/postal"
postal_web_hostname: "mail.{{ domain }}"
postal_smtp_hostname: "smtp.{{ domain }}"
postal_helo_hostname: "mailout.{{ domain }}"
postal_track_domain: "track.{{ domain }}"
postal_spf_domain: "spf.{{ domain }}"
postal_return_path_domain: "rp.{{ domain }}"
postal_route_domain: "routes.{{ domain }}"
postal_domains: "{{ postal.domains | default([domain]) }}"
postal_inbound_accept_local_parts: "{{ postal.inbound_accept_local_parts | default(['postmaster', 'abuse', 'dmarc-reports']) }}"
postal_admin_email: "{{ postal.admin_email | default(email) }}"
postal_admin_first_name: "{{ postal.admin_first_name | default('Platform') }}"
postal_admin_last_name: "{{ postal.admin_last_name | default('Administrator') }}"
postal_organization_name: "{{ postal.organization_name | default(project_name | default('Platform')) }}"
postal_organization_permalink: "{{ postal.organization_permalink | default(project_name | default('platform')) }}"
postal_server_name: "{{ postal.server_name | default('Transactional Mail') }}"
postal_server_permalink: "{{ postal.server_permalink | default('transactional') }}"
postal_send_limit_per_minute: "{{ postal.send_limit_per_minute | default(60) }}"
postal_message_retention_days: "{{ postal.message_retention_days | default(30) }}"
postal_raw_message_retention_days: "{{ postal.raw_message_retention_days | default(7) }}"
postal_raw_message_retention_size: "{{ postal.raw_message_retention_size | default(2048) }}"
postal_direct_delivery_enabled: "{{ postal.direct_delivery_enabled | default(true) }}"
postal_outbound_ipv4: "{{ postal.outbound_ipv4 | default(bastion_public_ip | default('')) }}"
postal_require_ptr_alignment: "{{ postal.require_ptr_alignment | default(true) }}"
postal_port25_probe_host: "{{ postal.port25_probe_host | default('gmail-smtp-in.l.google.com') }}"
postal_port25_probe_timeout_seconds: "{{ postal.port25_probe_timeout_seconds | default(10) }}"
postal_dkim_identifier: "{{ postal.dkim_identifier | default('postal') }}"
postal_custom_return_path_prefix: "{{ postal.custom_return_path_prefix | default('psrp') }}"
postal_smtp_tls_secret: "{{ postal.smtp_tls_secret | default('postal-smtp-tls') }}"
postal_smtp_tls_issuer: "{{ postal.smtp_tls_issuer | default(cert_manager_cluster_issuer | default('letsencrypt-prod')) }}"
postal_smtp_tls_use_platform_wildcard: "{{ postal.smtp_tls_use_platform_wildcard | default(true) }}"
postal_smtp_tls_source_namespace: "{{ postal.smtp_tls_source_namespace | default('gateway-secrets') }}"
postal_smtp_tls_source_secret: "{{ postal.smtp_tls_source_secret | default('wildcard-tls') }}"
postal_smtp_tls_sync_image: "{{ postal.smtp_tls_sync_image | default('docker.io/alpine/k8s:1.35.4') }}"
postal_smtp_load_balancer_name: "{{ postal.smtp_load_balancer_name | default((project_name | default('k8s')) + '-postal-smtp') }}"
postal_shared_load_balancer_name: "{{ postal.shared_load_balancer_name | default((project | default(project_name | default('k8s'))) + '-lb') }}"
postal_smtp_public_ipv4: "{{ postal.smtp_public_ipv4 | default(lb_ip | default('')) }}"
postal_smtp_credential_enabled: "{{ postal.smtp_credential_enabled | default(false) }}"
postal_worker_index: "{{ postal.worker_index | default(0) | int }}"
postal_mail_node_label: "workload.n0xeid.xyz/mail"

postal_web_replicas: "{{ postal.web_replicas | default(1) }}"
postal_smtp_replicas: "{{ postal.smtp_replicas | default(2 if resource_tier in ['medium', 'production'] else 1) }}"
postal_worker_replicas: "{{ postal.worker_replicas | default(2 if resource_tier == 'production' else 1) }}"

postal_web_memory_req: "{{ postal.web_memory_request | default('768Mi' if resource_tier in ['medium', 'production'] else '384Mi') }}"
postal_web_memory_lim: "{{ postal.web_memory_limit | default('1536Mi' if resource_tier in ['medium', 'production'] else '768Mi') }}"
postal_web_cpu_req: "{{ postal.web_cpu_request | default('500m' if resource_tier in ['medium', 'production'] else '100m') }}"
postal_web_cpu_lim: "{{ postal.web_cpu_limit | default('1000m' if resource_tier in ['medium', 'production'] else '500m') }}"

postal_smtp_memory_req: "{{ postal.smtp_memory_request | default('768Mi' if resource_tier in ['medium', 'production'] else '384Mi') }}"
postal_smtp_memory_lim: "{{ postal.smtp_memory_limit | default('1536Mi' if resource_tier in ['medium', 'production'] else '768Mi') }}"
postal_smtp_cpu_req: "{{ postal.smtp_cpu_request | default('500m' if resource_tier in ['medium', 'production'] else '100m') }}"
postal_smtp_cpu_lim: "{{ postal.smtp_cpu_limit | default('1000m' if resource_tier in ['medium', 'production'] else '500m') }}"

postal_worker_memory_req: "{{ postal.worker_memory_request | default('768Mi' if resource_tier in ['medium', 'production'] else '384Mi') }}"
postal_worker_memory_lim: "{{ postal.worker_memory_limit | default('1536Mi' if resource_tier in ['medium', 'production'] else '768Mi') }}"
postal_worker_cpu_req: "{{ postal.worker_cpu_request | default('500m' if resource_tier in ['medium', 'production'] else '100m') }}"
postal_worker_cpu_lim: "{{ postal.worker_cpu_limit | default('1000m' if resource_tier in ['medium', 'production'] else '500m') }}"

postal_mariadb_storage: "{{ postal.mariadb_storage | default('50Gi' if resource_tier in ['medium', 'production'] else '20Gi') }}"
postal_mariadb_memory: "{{ postal.mariadb_memory | default('2Gi' if resource_tier in ['medium', 'production'] else '1Gi') }}"

postal_smtp_tls_enabled: true
postal_max_message_size: 14
postal_default_spam_threshold: 5
postal_default_spam_failure_threshold: 20
postal_batch_queued_messages: true
