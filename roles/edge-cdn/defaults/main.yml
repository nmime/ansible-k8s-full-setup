---
# Gcore API Configuration
gcore_api_url: "https://api.gcore.com"
gcore_api_key: "{{ lookup('env', 'GCORE_API_KEY') }}"

# Domain configuration
edge_domain: "{{ domain }}"

# ============================================
# CDN DOMAIN ROUTING
# ============================================
# List the FULL domains (app.example.com, NOT just "app") that should go through CDN.
# These domains get GeoDNS A records in Gcore that route to nearest edge.
#
# Examples:
#   edge_cdn_domains: ["app.example.com", "dash.example.com", "www.example.com"]
#   edge_cdn_domains: []  # Empty = no CDN routing, all traffic direct to K8s
#
# IMPORTANT: You must set this explicitly in your playbook/inventory.
# The defaults here are placeholders only — replace with your actual domains.
edge_cdn_domains:
  - "app.{{ domain }}"      # Main app
  - "dash.{{ domain }}"     # Dashboard
  - "www.{{ domain }}"      # Marketing site
# Remove or comment out domains you DON'T want cached (e.g., API, admin panels)

# Edge proxy configuration
edge_proxy_port: 443
edge_cache_size: "10g"
edge_cache_path: "/var/cache/nginx"
edge_upstream_host: "origin.{{ domain }}"
edge_upstream_port: 443

# GeoDNS regions - edge servers in each region
edge_regions:
  eu:
    name: "Europe"
    continents: ["EU"]
    countries: []
    hetzner_location: "fsn1"  # Falkenstein, Germany
    server_type: "cx21"
  us:
    name: "North America"
    continents: ["NA"]
    countries: []
    hetzner_location: "ash"  # Ashburn, US
    server_type: "cx21"
  apac:
    name: "Asia Pacific"
    continents: ["AS", "OC"]
    countries: []
    hetzner_location: "sin"  # Singapore
    server_type: "cx21"

# Default/fallback goes to origin
edge_default_target: "origin"

# Health check configuration
edge_health_check_path: "/health"
edge_health_check_interval: 30
edge_health_check_timeout: 10
edge_health_check_unhealthy_threshold: 3

# TLS configuration
edge_tls_enabled: true
edge_tls_cert_email: "{{ admin_email | default('admin@' + domain) }}"

# Cache rules
edge_cache_rules:
  - match: "~* \\.(jpg|jpeg|png|gif|ico|css|js|woff2?)$"
    ttl: "30d"
  - match: "~* \\.(html|htm)$"
    ttl: "1h"
  - match: "default"
    ttl: "10m"
