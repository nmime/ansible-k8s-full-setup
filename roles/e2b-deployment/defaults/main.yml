---
# E2B Sandbox Infrastructure Role - Defaults
# Self-hosted e2b code execution sandboxes on Hetzner bare metal
# Architecture:
#   - Orchestrator: bare metal (KVM/Firecracker), systemd
#   - API/Client-Proxy: Kubernetes Deployments with HPA
#   - PostgreSQL/Redis: reuse existing Kubernetes services
#   - ClickHouse: dedicated for e2b analytics

# Namespace
e2b_namespace: "e2b"

# E2B version (from infra repo)
e2b_version: "0.1.4"
e2b_infra_repo: "https://github.com/e2b-dev/infra.git"

# === Container Images ===
# Built from source and pushed to registry
## e2b_image_registry: "registry.{{ domain }}"
## e2b_image_tag: "{{ e2b_version }}"

# === Hetzner Bare Metal Provisioning ===
e2b_hetzner_provision: true
e2b_hetzner_server_type: "ax42"
e2b_hetzner_location: "fsn1"
e2b_hetzner_image: "ubuntu-24.04"

# Auto-selected server types per tier
e2b_tier_specs:
  minimal:
    server_type: "ax42"
    worker_count: 1
  small:
    server_type: "ax42"
    worker_count: 1
  medium:
    server_type: "ax52"
    worker_count: 2
  production:
    server_type: "ax52"
    worker_count: 3

e2b_worker_count: "{{ e2b_tier_specs[tier | default('small')].worker_count }}"

# === Host Configuration ===
e2b_hugepages_count: 2048
e2b_nbd_max_devices: 64
e2b_orchestrator_base_dir: "/opt/e2b/orchestrator"
e2b_sandbox_dir: "/opt/e2b/fc-vm"
e2b_kernels_dir: "/opt/e2b/fc-kernels"
e2b_firecracker_dir: "/opt/e2b/fc-versions"
e2b_busybox_dir: "/opt/e2b/fc-busybox"
e2b_envd_dir: "/opt/e2b/fc-envd"
e2b_templates_dir: "/opt/e2b/templates"
e2b_template_cache_dir: "/opt/e2b/template-cache"
e2b_sandbox_cache_dir: "/opt/e2b/sandbox-cache"
e2b_snapshot_cache_dir: "/opt/e2b/snapshot-cache"
e2b_shared_chunk_cache_dir: "/opt/e2b/chunk-cache"

# === Go Build ===
e2b_go_version: "1.25.4"

# === Storage ===
e2b_storage_provider: "Local"

# === Database (reuses existing Percona PG) ===
e2b_db_name: "e2b"
e2b_db_user: "e2b"
e2b_pg_host: "{{ project_name | default('k8s') }}-pg-pgbouncer.databases.svc.cluster.local"
e2b_pg_port: 5432

# === Redis (reuses existing Dragonfly) ===
e2b_redis_host: "dragonfly.dragonfly.svc.cluster.local"
e2b_redis_port: 6379

# === ClickHouse ===
e2b_clickhouse_external: false
e2b_clickhouse_replicas: 1
e2b_clickhouse_storage_size: "10Gi"
e2b_clickhouse_db: "default"
e2b_clickhouse_user: "e2b"
e2b_clickhouse_password: ""
e2b_clickhouse_host: ""
e2b_clickhouse_port: 9000

# === API Service ===
e2b_api_replicas: "{{ 2 if tier in ['medium', 'production'] else 1 }}"
e2b_api_port: 3000
e2b_api_grpc_port: 5009
e2b_api_cpu_request: "200m"
e2b_api_memory_request: "256Mi"
e2b_api_cpu_limit: "1000m"
e2b_api_memory_limit: "1Gi"

# === Client-Proxy Service ===
e2b_client_proxy_replicas: "{{ 2 if tier in ['medium', 'production'] else 1 }}"
e2b_client_proxy_port: 3002
e2b_client_proxy_health_port: 3003
e2b_client_proxy_cpu_request: "100m"
e2b_client_proxy_memory_request: "128Mi"
e2b_client_proxy_cpu_limit: "500m"
e2b_client_proxy_memory_limit: "512Mi"

# === Orchestrator (bare metal, systemd) ===
e2b_orchestrator_grpc_port: 5008
e2b_orchestrator_proxy_port: 5007
e2b_max_concurrent_sandboxes: 20

# === Networking ===
e2b_domain: "sandbox.{{ domain }}"
e2b_api_domain: "e2b-api.{{ domain }}"

# === Auth ===
e2b_admin_token: ""
e2b_supabase_jwt_secrets: ""
