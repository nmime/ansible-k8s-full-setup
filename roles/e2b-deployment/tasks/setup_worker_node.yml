---
# E2B Worker Node Host Setup
# Configures bare metal server for Firecracker: KVM, hugepages, NBD, Go, build e2b binaries

- name: Verify KVM support
  ansible.builtin.shell: |
    set -e
    if [ ! -e /dev/kvm ]; then
      echo "FATAL: /dev/kvm not found - bare metal server required"
      exit 1
    fi
    ls -l /dev/kvm
  args:
    executable: /bin/bash
  changed_when: false

- name: Install required packages
  ansible.builtin.apt:
    name:
      - build-essential
      - git
      - curl
      - wget
      - qemu-utils
      - kmod
      - sysfsutils
      - acl
    state: present
    update_cache: true

- name: Load NBD kernel module
  community.general.modprobe:
    name: nbd
    params: "nbds_max={{ e2b_nbd_max_devices | default(64) }}"
    state: present

- name: Detect CPU vendor for KVM module
  ansible.builtin.shell: grep -q 'vmx' /proc/cpuinfo && echo 'kvm_intel' || echo 'kvm_amd'
  register: kvm_module
  changed_when: false

- name: Load KVM kernel module
  community.general.modprobe:
    name: "{{ kvm_module.stdout }}"
    state: present

- name: Persist kernel modules
  ansible.builtin.copy:
    dest: /etc/modules-load.d/e2b.conf
    content: |
      nbd
      {{ kvm_module.stdout }}
    mode: "0644"

- name: Configure hugepages
  ansible.posix.sysctl:
    name: vm.nr_hugepages
    value: "{{ e2b_hugepages_count | default(2048) }}"
    state: present
    reload: true
    sysctl_file: /etc/sysctl.d/99-e2b-hugepages.conf

- name: Verify hugepages
  ansible.builtin.command: grep HugePages_Total /proc/meminfo
  register: hugepages_check
  changed_when: false
  failed_when: >-
    not ('HugePages_Total:    ' ~ (e2b_hugepages_count | default(2048) | string)) in hugepages_check.stdout

- name: Create directory structure
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ e2b_orchestrator_base_dir | default('/opt/e2b/orchestrator') }}"
    - "{{ e2b_sandbox_dir | default('/opt/e2b/fc-vm') }}"
    - "{{ e2b_kernels_dir | default('/opt/e2b/fc-kernels') }}"
    - "{{ e2b_firecracker_dir | default('/opt/e2b/fc-versions') }}"
    - "{{ e2b_firecracker_dir | default('/opt/e2b/fc-versions') }}/builds"
    - "{{ e2b_busybox_dir | default('/opt/e2b/fc-busybox') }}"
    - "{{ e2b_envd_dir | default('/opt/e2b/fc-envd') }}"
    - "{{ e2b_templates_dir | default('/opt/e2b/templates') }}"
    - "{{ e2b_template_cache_dir | default('/opt/e2b/template-cache') }}"
    - "{{ e2b_sandbox_cache_dir | default('/opt/e2b/sandbox-cache') }}"
    - "{{ e2b_snapshot_cache_dir | default('/opt/e2b/snapshot-cache') }}"
    - "{{ e2b_shared_chunk_cache_dir | default('/opt/e2b/chunk-cache') }}"
    - "/opt/e2b/bin"
    - "/opt/e2b/src"

- name: Install Go
  ansible.builtin.shell: |
    set -e
    GO_VERSION="{{ e2b_go_version | default('1.25.4') }}"
    GO_ARCH="$(dpkg --print-architecture)"
    if command -v go &>/dev/null && go version | grep -q "go${GO_VERSION}"; then
      echo "Go ${GO_VERSION} already installed"
      exit 0
    fi
    curl -fsSL "https://go.dev/dl/go${GO_VERSION}.linux-${GO_ARCH}.tar.gz" -o /tmp/go.tar.gz
    rm -rf /usr/local/go
    tar -C /usr/local -xzf /tmp/go.tar.gz
    rm -f /tmp/go.tar.gz
    echo 'export PATH=$PATH:/usr/local/go/bin' > /etc/profile.d/go.sh
  args:
    executable: /bin/bash
  environment:
    PATH: "/usr/local/go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
  changed_when: true

- name: Clone e2b infra repository
  ansible.builtin.git:
    repo: "{{ e2b_infra_repo | default('https://github.com/e2b-dev/infra.git') }}"
    dest: /opt/e2b/src/infra
    version: "{{ e2b_version | default('main') }}"
    depth: 1
    force: true
  environment:
    PATH: "/usr/local/go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"

- name: Build e2b orchestrator binary
  ansible.builtin.shell: |
    set -e
    export PATH=$PATH:/usr/local/go/bin
    cd /opt/e2b/src/infra
    go build -o /opt/e2b/bin/orchestrator ./packages/orchestrator
    go build -o /opt/e2b/bin/api ./packages/api
    go build -o /opt/e2b/bin/client-proxy ./packages/client-proxy
    go build -o /opt/e2b/bin/envd ./packages/envd
    go build -o /opt/e2b/bin/migrator ./packages/db/scripts/migrator.go
    chmod +x /opt/e2b/bin/*
  args:
    executable: /bin/bash
  environment:
    PATH: "/usr/local/go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
  changed_when: true

- name: Download prebuilt Firecracker kernels
  ansible.builtin.shell: |
    set -e
    if ls {{ e2b_kernels_dir | default('/opt/e2b/fc-kernels') }}/* 2>/dev/null; then
      echo "Kernels already downloaded"
      exit 0
    fi
    if ! command -v gsutil &>/dev/null; then
      echo "Installing gsutil..."
      curl -fsSL https://dl.google.com/dl/cloudsdk/channels/rapid/google-cloud-sdk.tar.gz | tar -C /opt -xz
      export PATH=$PATH:/opt/google-cloud-sdk/bin
      gcloud components install gsutil -q
    fi
    export PATH=$PATH:/opt/google-cloud-sdk/bin
    gsutil cp -r gs://e2b-prod-public-builds/kernels/* {{ e2b_kernels_dir | default('/opt/e2b/fc-kernels') }}/
  args:
    executable: /bin/bash
  changed_when: true

- name: Download prebuilt Firecracker binaries
  ansible.builtin.shell: |
    set -e
    DEST="{{ e2b_firecracker_dir | default('/opt/e2b/fc-versions') }}/builds"
    if ls ${DEST}/*/firecracker 2>/dev/null; then
      echo "Firecracker already downloaded"
      exit 0
    fi
    export PATH=$PATH:/opt/google-cloud-sdk/bin
    gsutil -m cp -r gs://e2b-prod-public-builds/firecrackers/* ${DEST}/
    find ${DEST}/ -name firecracker -exec chmod +x {} \;
  args:
    executable: /bin/bash
  changed_when: true
