---
# E2B Infrastructure: ClickHouse, PostgreSQL database/user
# Reuses existing Percona PostgreSQL cluster, adds e2b-specific database and user

- name: Set e2b infrastructure facts
  set_fact:
    e2b_ns: "{{ e2b_namespace | default('e2b') }}"
    e2b_pg_host_val: "{{ e2b_pg_host | default(project_name | default('k8s') + '-pg-pgbouncer.databases.svc.cluster.local') }}"
    e2b_redis_host_val: "{{ e2b_redis_host | default('dragonfly.dragonfly.svc.cluster.local') }}"

- name: Create e2b namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ e2b_ns }}"
        labels:
          app.kubernetes.io/part-of: e2b
          pod-security.kubernetes.io/enforce: baseline

- name: Create e2b database in PostgreSQL
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: pgv2.percona.com/v2
      kind: PerconaPGDatabase
      metadata:
        name: e2b-db
        namespace: databases
      spec:
        databaseName: "{{ e2b_db_name | default('e2b') }}"
        databaseOwner: "{{ e2b_db_user | default('e2b') }}"
        cluster:
          name: "{{ project_name | default('k8s') }}-pg"
  register: e2b_db_create
  retries: 3
  delay: 10
  until: e2b_db_create is not failed

- name: Wait for e2b PostgreSQL user secret
  kubernetes.core.k8s_info:
    kind: Secret
    namespace: databases
    name: "{{ project_name | default('k8s') }}-pg-pguser-{{ e2b_db_user | default('e2b') }}"
  register: e2b_pg_secret
  until: e2b_pg_secret.resources | length > 0
  retries: 60
  delay: 10
  failed_when: false

- name: Set e2b PostgreSQL connection facts
  set_fact:
    e2b_pg_password: "{{ (e2b_pg_secret.resources[0].data.password | b64decode) if e2b_pg_secret.resources | length > 0 else '' }}"
    e2b_pg_user: "{{ (e2b_pg_secret.resources[0].data.user | b64decode) if e2b_pg_secret.resources | length > 0 else (e2b_db_user | default('e2b')) }}"
    e2b_pg_host_resolved: "{{ (e2b_pg_secret.resources[0].data.pgbouncer-host | b64decode) if e2b_pg_secret.resources | length > 0 else e2b_pg_host_val }}"
  no_log: true

- name: Deploy ClickHouse for e2b analytics
  block:
    - name: Add Bitnami Helm repository
      kubernetes.core.helm_repository:
        name: bitnami
        repo_url: "https://charts.bitnami.com/bitnami"

    - name: Deploy ClickHouse via Helm
      kubernetes.core.helm:
        name: e2b-clickhouse
        chart_ref: bitnami/clickhouse
        release_namespace: "{{ e2b_ns }}"
        create_namespace: false
        release_state: present
        wait: true
        timeout: 10m
        values:
          auth:
            username: "{{ e2b_clickhouse_user | default('e2b') }}"
            password: "{{ e2b_clickhouse_password | default(lookup('password', '/dev/null chars=ascii_letters,digits length=32')) }}"
            database: "{{ e2b_clickhouse_db | default('default') }}"
          persistence:
            size: "{{ e2b_clickhouse_storage_size | default('10Gi') }}"
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
  when: e2b_clickhouse_external | default(false) | bool == false

- name: Wait for ClickHouse to be ready
  kubernetes.core.k8s_info:
    kind: StatefulSet
    namespace: "{{ e2b_ns }}"
    label_selectors:
      - app.kubernetes.io/name=clickhouse
  register: e2b_clickhouse_sts
  until: >
    e2b_clickhouse_sts.resources | length > 0 and
    (e2b_clickhouse_sts.resources[0].status.readyReplicas | default(0)) >= 1
  retries: 60
  delay: 10
  when: e2b_clickhouse_external | default(false) | bool == false

- name: Set ClickHouse connection facts
  set_fact:
    e2b_clickhouse_host_val: "{{ e2b_clickhouse_host | default('e2b-clickhouse.' + e2b_ns + '.svc.cluster.local') }}"
    e2b_clickhouse_port_val: "{{ e2b_clickhouse_port | default(9000) }}"
    e2b_clickhouse_user_val: "{{ e2b_clickhouse_user | default('e2b') }}"

- name: Create e2b secrets in namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: e2b-config
        namespace: "{{ e2b_ns }}"
        labels:
          app.kubernetes.io/part-of: e2b
      type: Opaque
      stringData:
        POSTGRES_CONNECTION_STRING: "postgres://{{ e2b_pg_user }}:{{ e2b_pg_password }}@{{ e2b_pg_host_resolved }}:{{ e2b_pg_port | default(5432) }}/{{ e2b_db_name | default('e2b') }}?sslmode=disable"
        REDIS_URL: "redis://{{ e2b_redis_host_val }}:{{ e2b_redis_port | default(6379) }}"
        CLICKHOUSE_CONNECTION_STRING: "clickhouse://{{ e2b_clickhouse_user_val }}:{{ e2b_clickhouse_password | default('') }}@{{ e2b_clickhouse_host_val }}:{{ e2b_clickhouse_port_val }}/{{ e2b_clickhouse_db | default('default') }}"
        ADMIN_TOKEN: "{{ e2b_admin_token | default(lookup('password', '/dev/null chars=ascii_letters,digits length=48')) }}"
        STORAGE_PROVIDER: "{{ e2b_storage_provider | default('Local') }}"
  no_log: true
  register: e2b_secrets_result
  retries: 3
  delay: 10
  until: e2b_secrets_result is not failed

- name: Run e2b database migrations
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: e2b-db-migrate
        namespace: "{{ e2b_ns }}"
        labels:
          app.kubernetes.io/part-of: e2b
      spec:
        ttlSecondsAfterFinished: 300
        template:
          spec:
            restartPolicy: OnFailure
            containers:
              - name: migrate
                image: "{{ e2b_image_registry | default('registry.' + domain) }}/e2b/api:{{ e2b_image_tag | default(e2b_version | default('0.1.4')) }}"
                command: ["/api"]
                args:
                  - "--migrate-only"
                envFrom:
                  - secretRef:
                      name: e2b-config
            imagePullSecrets:
              - name: registry-credentials
