---
# E2B Networking: DNS records, K8s Service for orchestrator discovery, Gateway API routes

- name: Set networking facts
  set_fact:
    e2b_ns: "{{ e2b_namespace | default('e2b') }}"
    e2b_api_domain_val: "{{ e2b_api_domain | default('e2b-api.' + domain) }}"
    e2b_domain_val: "{{ e2b_domain | default('sandbox.' + domain) }}"

- name: Create headless service for orchestrator discovery
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: e2b-orchestrator
        namespace: "{{ e2b_ns }}"
        labels:
          app.kubernetes.io/name: e2b-orchestrator
          app.kubernetes.io/part-of: e2b
      spec:
        type: ClusterIP
        clusterIP: None
        ports:
          - name: grpc
            port: "{{ e2b_orchestrator_grpc_port | default(5008) }}"
            targetPort: "{{ e2b_orchestrator_grpc_port | default(5008) }}"
            protocol: TCP
          - name: proxy
            port: "{{ e2b_orchestrator_proxy_port | default(5007) }}"
            targetPort: "{{ e2b_orchestrator_proxy_port | default(5007) }}"
            protocol: TCP

- name: Create API service
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: e2b-api
        namespace: "{{ e2b_ns }}"
        labels:
          app.kubernetes.io/name: e2b-api
          app.kubernetes.io/part-of: e2b
      spec:
        type: ClusterIP
        ports:
          - name: http
            port: 80
            targetPort: "{{ e2b_api_port | default(3000) }}"
            protocol: TCP
        selector:
          app.kubernetes.io/name: e2b-api

- name: Create Client-Proxy service
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: e2b-client-proxy
        namespace: "{{ e2b_ns }}"
        labels:
          app.kubernetes.io/name: e2b-client-proxy
          app.kubernetes.io/part-of: e2b
      spec:
        type: ClusterIP
        ports:
          - name: proxy
            port: "{{ e2b_client_proxy_port | default(3002) }}"
            targetPort: "{{ e2b_client_proxy_port | default(3002) }}"
            protocol: TCP
          - name: health
            port: "{{ e2b_client_proxy_health_port | default(3003) }}"
            targetPort: "{{ e2b_client_proxy_health_port | default(3003) }}"
            protocol: TCP
        selector:
          app.kubernetes.io/name: e2b-client-proxy

- name: Create Gateway API HTTPRoute for e2b API
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: e2b-api
        namespace: "{{ e2b_ns }}"
      spec:
        parentRefs:
          - name: platform-gateway
            namespace: gateway
        hostnames:
          - "{{ e2b_api_domain_val }}"
        rules:
          - backendRefs:
              - name: e2b-api
                port: 80

- name: Generate DNS records for e2b
  set_fact:
    e2b_dns_records: |
      e2b-api IN 3600 A {{ e2b_public_ip | default(loadbalancer_ip | default(bastion_ip | default(''))) }}
      sandbox IN 3600 A {{ e2b_public_ip | default(loadbalancer_ip | default(bastion_ip | default(''))) }}
