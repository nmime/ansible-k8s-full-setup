name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install system validation tools
        run: sudo apt-get update && sudo apt-get install --yes shellcheck

      - name: Install Python validation tools
        run: python -m pip install --requirement requirements.txt

      - name: Install pinned Ansible collections
        run: ansible-galaxy collection install --requirements-file requirements.yml

      - name: Validate Ansible playbook syntax
        run: |
          ansible-playbook playbooks/deploy_platform.yml --syntax-check
          ansible-playbook playbooks/continue_post_kubespray.yml --syntax-check
          ansible-playbook playbooks/edge-cdn.yml --syntax-check

      - name: Run mandatory validation suite
        run: bash scripts/validate-local.sh
