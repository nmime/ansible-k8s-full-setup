# ============================================
# Global Default Variables
# ============================================
# Tier-specific configuration for all roles

# Tier definitions
tier: medium

# Global settings
project_name: k8s
domain: example.com
email: admin@example.com

# Tier configuration
minimal:
  nodes: 2
  ha: false
  cost: "~€18-20/mo"
  control_plane_count: 1
  control_plane_type: cx32
  control_plane_schedulable: true
  worker_count: 1
  worker_type: cx22

small:
  nodes: 3
  ha: false
  cost: "~€28-35/mo"
  control_plane_count: 1
  control_plane_type: cx22
  control_plane_schedulable: false
  worker_count: 2
  worker_type: cx32

medium:
  nodes: 5
  ha: true
  cost: "~€48-55/mo"
  control_plane_count: 3
  control_plane_type: cx22
  control_plane_schedulable: false
  worker_count: 2
  worker_type: cx32

production:
  nodes: 6
  ha: true
  cost: "~€74-100/mo"
  control_plane_count: 3
  control_plane_type: cx32
  control_plane_schedulable: false
  worker_count: 3
  worker_type: cx32

# Infrastructure configuration
bastion_server_type: cx22
hetzner_region: hel1

# Kubernetes
k8s_version: v1.34.3
k8s_cni: cilium
cilium_version: v1.18.6
k8s_pod_cidr: 10.233.64.0/18
k8s_service_cidr: 10.233.0.0/18

# Network
private_network_cidr: 10.0.0.0/16
infrastructure_subnet: 10.0.0.0/24
control_plane_subnet: 10.0.1.0/24
workers_subnet: 10.0.2.0/24
services_subnet: 10.0.10.0/24

# Storage (MinIO)
minio_replicas: 4
minio_storage_size: 50Gi

# Secrets (Vault)
vault_replicas: 3
vault_storage_size: 10Gi
eso_enabled: true

# Databases
postgresql_replicas: 2
postgresql_storage: 20Gi
postgresql_version: 18

# GitLab
gitlab_chart_version: "9.7.1"
gitlab_runner_concurrent_jobs: 10

# GitOps (ArgoCD)
argocd_chart_version: "7.8.5"

# Observability
metrics_retention: 30d
metrics_storage: 50Gi
logging_retention: 14d

# Autoscaling
keda_enabled: true
keda_chart_version: "2.18.2"

# Backup
backup_schedule: "0 2 * * *"
backup_retention_days: 30
