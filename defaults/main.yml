# ============================================
# Global Default Variables
# ============================================
# Tier-specific configuration for all roles

# Tier selects platform capabilities. `resource_tier` selects default pod
# requests/limits and replica counts, so a profile can keep the medium toolset
# while using the small-footprint resource envelope.
tier: medium
platform_profile: "{{ tier }}"
resource_tier: "{{ tier }}"

# Global settings
project_name: k8s
# domain: REQUIRED - must be provided via -e domain=yourdomain.com
# email: REQUIRED - must be provided via -e email=you@yourdomain.com

# Tier configuration (node counts for reference — actual server types auto-selected at runtime)
minimal:
  nodes: 2
  ha: false
  control_plane_count: 1
  control_plane_schedulable: true
  worker_count: 1

small:
  nodes: 3
  ha: false
  control_plane_count: 1
  control_plane_schedulable: true
  worker_count: 2

medium:
  nodes: 5
  ha: true
  control_plane_count: 3
  control_plane_schedulable: true
  worker_count: 2

production:
  nodes: 6
  ha: true
  control_plane_count: 3
  control_plane_schedulable: true
  worker_count: 3

# Infrastructure configuration
# Server types auto-selected from Hetzner API (cheapest meeting tier requirements)
# Override with: hetzner_bastion_type, hetzner_cp_type, hetzner_worker_type
hetzner_region: hel1
hetzner_image: ubuntu-24.04
ssh_key_path: ~/.ssh/id_ed25519
storage_class: hcloud-volumes
ansible_ssh_strict_host_key_checking: true

# Kubernetes
# renovate: datasource=github-releases depName=kubernetes/kubernetes
k8s_version: v1.35.6
k8s_cni: cilium
# renovate: datasource=github-releases depName=cilium/cilium
cilium_version: v1.19.5
# renovate: datasource=github-releases depName=kubernetes-sigs/gateway-api
gateway_api_version: v1.6.0
k8s_pod_cidr: 10.233.64.0/18
k8s_service_cidr: 10.233.0.0/18

# Cluster addons (patch/minor-safe upgrades)
cert_manager_version: v1.21.0
metallb_version: v0.16.1
hetzner_ccm_version: v1.33.0
hetzner_csi_version: v2.22.0
kubespray_version: v2.31.0
hetzner_ccm_manifest_sha256: bcf91ad8e67d2f1ad5f57d5dd39ced40bebbb1946768392cf2ada5bc2f671816
hetzner_csi_manifest_sha256: 464098a4a060d9824281e40fc99bde7998aa79e2164c870dd41161f65028b1fe
gateway_api_standard_sha256: a557172e8348f758479e9ee4000bbbb4b4aa48302a6b73461823ea5349bad56d
gateway_api_experimental_sha256: f0d5c2b0bef2b9d80ba6ba909e5e5dbde0800638437608353f41a6ebd3afcd9f

# CLI tool versions (pinned for reproducibility)
kubectl_version: "{{ k8s_version }}"
hcloud_cli_version: v1.65.0
yq_version: v4.44.6
helm_cli_version: v3.20.1
kubectl_linux_amd64_sha256: 5d11e2ba01ea68ffd053f56e27738e2b4330013ee67f7e46c6da6c585d3c99260
helm_linux_amd64_sha256: 165ee4a2db012cc657381001e593e981f42aa5707acdd50658326790c9d0dc3
hcloud_linux_amd64_sha256: f78d2db65b7ab58603d343739cb4397e13acef23182e41692a06e147a8d4c011
yq_linux_amd64_sha256: 0c2b24e645b57d8e7c0566d18643a6d4f5580feeea3878127354a46f2a1e4598
node_exporter_linux_amd64_sha256: a550cd5c05f760b7934a2d0afad66d2e92e681482f5f57a917465b1fba3b02a6
promtail_version: "3.0.0"
promtail_linux_amd64_sha256: 3a5120422a2a8aa26659a188d63f1425707ed42a1af274acc0a7797d851acf48

# Bastion service images
headscale_version: "0.28.0"
caddy_image_tag: "2.11.4-alpine"

# Network
private_network_cidr: 10.0.0.0/16
infrastructure_subnet: 10.0.0.0/24
control_plane_subnet: 10.0.1.0/24
workers_subnet: 10.0.2.0/24
services_subnet: 10.0.10.0/24

# Live-test safety gates (disable external/dns side effects in disposable validation)
hetzner_manage_dns: true
k8s_create_external_tls: true
object_storage_create_external_routes: true
object_storage_enabled: true

# Storage (SeaweedFS-backed S3-compatible object storage)
# renovate: datasource=helm depName=seaweedfs
object_storage_chart_version: "4.25.1"
object_storage_namespace: storage
object_storage_release_name: seaweedfs
object_storage_endpoint_hostport: "seaweedfs-filer.{{ object_storage_namespace | default('storage') }}.svc.cluster.local:8333"
object_storage_endpoint: "http://{{ object_storage_endpoint_hostport | default('seaweedfs-filer.storage.svc.cluster.local:8333') }}"
object_storage_console_domain: "{{ ('seaweedfs.' ~ (domain | default('', true))) if (domain | default('', true) | length > 0) else 'seaweedfs.local' }}"
object_storage_api_domain: "{{ ('s3.' ~ (domain | default('', true))) if (domain | default('', true) | length > 0) else 's3.local' }}"
object_storage_master_size: 4Gi
object_storage_volume_size: "{{ '20Gi' if resource_tier == 'minimal' else '40Gi' if resource_tier == 'small' else '100Gi' if resource_tier == 'medium' else '150Gi' }}"
object_storage_idx_size: 4Gi
object_storage_filer_size: 10Gi

# Secrets (Vault) - tier-specific
# renovate: datasource=github-releases depName=hashicorp/vault
vault_version: "2.0.3"
# renovate: datasource=helm depName=vault
vault_chart_version: "0.34.0"
vault_replicas: "{{ 3 if resource_tier in ['medium', 'production'] else 1 }}"
vault_storage_size: 20Gi
eso_enabled: true
vault_tls_disabled: false
vault_verify_tls: true
vault_encrypt_secrets: true
vault_password_file: ~/.vault_pass
vault_init_output_file: "{{ playbook_dir }}/.vault-init.json"

# Databases - tier-specific
# renovate: datasource=github-releases depName=percona/percona-postgresql-operator
pg_operator_version: "3.0.0"
postgresql_replicas: "{{ 2 if resource_tier in ['medium', 'production'] else 1 }}"
postgresql_storage: "{{ '20Gi' if resource_tier == 'minimal' else '30Gi' if resource_tier == 'small' else '50Gi' if resource_tier == 'medium' else '100Gi' }}"
postgresql_version: 18
mongodb_storage: "{{ '20Gi' if resource_tier == 'minimal' else '30Gi' if resource_tier == 'small' else '50Gi' if resource_tier == 'medium' else '100Gi' }}"

# GitLab
# renovate: datasource=helm depName=gitlab
gitlab_chart_version: "10.1.2"
gitlab_runner_concurrent_jobs: 10

# GitOps (ArgoCD)
# renovate: datasource=helm depName=argo-cd
argocd_chart_version: "9.5.14"
# renovate: datasource=github-releases depName=argoproj/argo-cd
argocd_version: "v3.4.2"
argocd_insecure_mode: false
argocd_allowed_source_repos:
  - "https://gitlab.{{ domain }}/platform/*"
argocd_allowed_namespaces:
  - default
  - applications
argocd_allowed_cluster_resources:
  - group: ""
    kind: Namespace
argocd_allowed_namespace_resources:
  - group: "apps"
    kind: Deployment
  - group: "apps"
    kind: StatefulSet
  - group: "apps"
    kind: DaemonSet
  - group: "batch"
    kind: Job
  - group: "batch"
    kind: CronJob
  - group: ""
    kind: Service
  - group: ""
    kind: ConfigMap
  - group: ""
    kind: Secret
  - group: "networking.k8s.io"
    kind: NetworkPolicy
  - group: "gateway.networking.k8s.io"
    kind: HTTPRoute

# Observability - tier-specific
log_stack: "{{ 'loki' if tier in ['minimal', 'small'] else 'elk' }}"  # Options: loki, elk, efk
metrics_retention: "{{ '7d' if resource_tier == 'minimal' else '14d' if resource_tier == 'small' else '30d' }}"
metrics_storage: "{{ '20Gi' if resource_tier == 'minimal' else '40Gi' if resource_tier == 'small' else '100Gi' if resource_tier == 'medium' else '150Gi' }}"
logging_retention: "{{ '3d' if resource_tier == 'minimal' else '7d' if resource_tier == 'small' else '14d' }}"

# Autoscaling
keda_enabled: true
# renovate: datasource=helm depName=keda
keda_chart_version: "2.20.1"

# Temporal
# renovate: datasource=helm depName=temporal
temporal_chart_version: "1.2.0"
temporal_num_history_shards: 512

# Elasticsearch
# renovate: datasource=docker depName=elasticsearch
es_version: "9.4.3"
# renovate: datasource=docker depName=kibana
kibana_version: "9.4.3"
apm_server_version: "9.4.3"
es_cluster_name: "platform-es"

# Postal
# renovate: datasource=github-releases depName=postalserver/postal
postal_version: "3.3.7"

# Blackbox exporter
blackbox_chart_version: "11.15.1"

# Dragonfly (Redis-compatible cache)
dragonfly_operator_version: "v1.6.1"
dragonfly_image_version: "v1.39.0"

# VictoriaMetrics Operator
vm_operator_version: "0.66.2"
pmm_server_version: "3.8.1"

# Coroot application observability. The operator and every image are pinned so
# an idempotent rerun cannot silently upgrade production workloads.
# renovate: datasource=helm depName=coroot-operator registryUrl=https://coroot.github.io/helm-charts
coroot_operator_chart_version: "0.9.7"
# renovate: datasource=helm depName=coroot-ce registryUrl=https://coroot.github.io/helm-charts
coroot_chart_version: "0.3.3"
# renovate: datasource=docker depName=ghcr.io/coroot/coroot
coroot_image_tag: "1.23.3"
# renovate: datasource=docker depName=ghcr.io/coroot/coroot-node-agent
coroot_node_agent_image_tag: "1.34.2"
# renovate: datasource=docker depName=ghcr.io/coroot/coroot-cluster-agent
coroot_cluster_agent_image_tag: "1.7.1"
# These dependency images are the versions embedded in coroot-operator v1.9.5.
coroot_clickhouse_image_tag: "25.11.2-ubi9-0"
coroot_enabled: "{{ tier in ['medium', 'production'] }}"
coroot_storage_size: "{{ '10Gi' if resource_tier in ['minimal', 'small'] else '20Gi' if resource_tier == 'medium' else '40Gi' }}"
coroot_clickhouse_storage_size: "{{ '20Gi' if resource_tier in ['minimal', 'small'] else '50Gi' if resource_tier == 'medium' else '100Gi' }}"
coroot_clickhouse_cpu_request: "{{ '250m' if resource_tier in ['minimal', 'small'] else '500m' }}"
coroot_clickhouse_cpu_limit: "{{ '1' if resource_tier in ['minimal', 'small'] else '2' }}"
coroot_clickhouse_memory_request: "{{ '512Mi' if resource_tier in ['minimal', 'small'] else '1Gi' }}"
coroot_clickhouse_memory_limit: "{{ '2Gi' if resource_tier in ['minimal', 'small'] else '4Gi' }}"
coroot_metrics_refresh_interval: 15s
coroot_cache_ttl: "{{ '14d' if resource_tier in ['minimal', 'small'] else '30d' }}"
coroot_logs_ttl: "{{ '3d' if resource_tier == 'minimal' else '7d' if resource_tier == 'small' else '14d' }}"
coroot_traces_ttl: "{{ '12h' if resource_tier in ['minimal', 'small'] else '24h' if resource_tier == 'medium' else '72h' }}"
coroot_profiles_ttl: "{{ '12h' if resource_tier in ['minimal', 'small'] else '24h' if resource_tier == 'medium' else '72h' }}"
coroot_cpu_request: "{{ '100m' if resource_tier in ['minimal', 'small'] else '250m' if resource_tier == 'medium' else '500m' }}"
coroot_cpu_limit: "{{ '500m' if resource_tier in ['minimal', 'small'] else '1' if resource_tier == 'medium' else '2' }}"
coroot_memory_request: "{{ '512Mi' if resource_tier in ['minimal', 'small'] else '1Gi' if resource_tier == 'medium' else '2Gi' }}"
coroot_memory_limit: "{{ '1Gi' if resource_tier in ['minimal', 'small'] else '2Gi' if resource_tier == 'medium' else '4Gi' }}"
coroot_node_agent_cpu_request: 100m
coroot_node_agent_cpu_limit: 500m
coroot_node_agent_memory_request: 200Mi
coroot_node_agent_memory_limit: 1Gi
coroot_cluster_agent_cpu_request: 100m
coroot_cluster_agent_cpu_limit: 500m
coroot_cluster_agent_memory_request: 200Mi
coroot_cluster_agent_memory_limit: 1Gi

# External Secrets Operator
eso_chart_version: "2.7.0"

# Backup and Restore
backup_schedule: "0 2 * * *"
backup_retention_days: 30
backup_storage_type: s3
backup_storage_bucket: backups
backup_storage_region: "{{ object_storage_region | default('us-east-1') }}"
backup_storage_path_style: true
backup_dr_enabled: false
backup_dr_storage_endpoint: ""
backup_dr_storage_region: us-east-1
backup_dr_storage_bucket: ""
backup_dr_storage_prefix: "{{ project_name | default('k8s') }}/velero"
backup_dr_storage_access_key: "{{ lookup('env', 'BACKUP_DR_ACCESS_KEY') | default('', true) }}"
backup_dr_storage_secret_key: "{{ lookup('env', 'BACKUP_DR_SECRET_KEY') | default('', true) }}"
backup_dr_schedule: "30 2 * * *"
backup_dr_retention_hours: 720
backup_dr_velero_chart_version: "12.1.0"
backup_dr_velero_image_tag: "v1.18.1"
backup_dr_velero_aws_plugin_tag: "v1.14.2"
backup_verify_all: true
backup_verification_timeout: 3600
backup_alert_enabled: false
backup_alert_webhook_url: ""
backup_alert_channel: "#alerts"
backup_alert_on_failure_only: false
backup_cron_timezone: UTC
backup_cron_concurrency_policy: Forbid
backup_cron_successful_jobs_history: 3
backup_cron_failed_jobs_history: 1
backup_job_cpu_request: 100m
backup_job_cpu_limit: 500m
backup_job_memory_request: 128Mi
backup_job_memory_limit: 512Mi
restore_drill_namespace: restore-drill
restore_drill_auto_cleanup: true
restore_drill_cleanup_after_hours: 24
restore_safety_gate_skip_verification: false
restore_safety_gate_confirm_required: true
backup_enabled: "{{ tier in ['medium', 'production'] }}"

# Daytona workspace platform (optional; disabled by default)
deploy_daytona: false
daytona_enabled: "{{ deploy_daytona | default(false) }}"
daytona_namespace: daytona
daytona_release_name: daytona
daytona_chart_repo_name: daytonaio
daytona_chart_repo_url: https://charts.daytona.io
daytona_chart_ref: daytonaio/daytona
# renovate: datasource=helm depName=daytona
daytona_chart_version: "0.0.23"
daytona_base_domain: "daytona.{{ domain }}"
daytona_values_override: {}

# Neutral shared Dragonfly credential; generated once by generate-secrets.
dragonfly_password: ""

# Observability enhancements
bastion_log_shipping: false  # Requires an explicitly designed private ingestion endpoint.
control_plane_log_shipping: false
hetzner_metrics_enabled: true

# Distributed Tracing (Tempo)
tracing_enabled: "{{ tier in ['medium', 'production'] }}"
tempo_retention: "{{ '12h' if resource_tier in ['minimal', 'small'] else '24h' if resource_tier == 'medium' else '72h' }}"
tempo_storage_size: "{{ '10Gi' if resource_tier in ['minimal', 'small'] else '20Gi' if resource_tier == 'medium' else '40Gi' }}"
otel_collector_enabled: "{{ tracing_enabled }}"

# Legacy direct-Ansible compatibility. Profiles use compliance.hipaa.enabled;
# the mode remains opt-in and still requires an organization-specific review.
hipaa_compliance: false
log_redaction_enabled: "{{ hipaa_compliance }}"

# Optional component defaults. Profiles can override these through their nested
# `<component>.enabled` setting; the playbook normalizes both forms.
deploy_elasticsearch: "{{ tier in ['medium', 'production'] }}"
deploy_gitlab: "{{ tier != 'minimal' }}"
deploy_gitops: true
deploy_observability: true
deploy_databases: true
deploy_postgresql: true
deploy_mongodb: "{{ tier in ['medium', 'production'] }}"
deploy_autoscaling: true
deploy_dragonfly: "{{ tier in ['medium', 'production'] }}"
deploy_temporal: "{{ tier in ['medium', 'production'] }}"
deploy_postal: "{{ tier in ['medium', 'production'] }}"
edge_cdn_confirm: false
