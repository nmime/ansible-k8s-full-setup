coroot_cluster_agent_memory_request: 200Mi
coroot_cluster_agent_memory_limit: 2Gi

# External Secrets Operator
eso_chart_version: "2.7.0"

# Backup and Restore
backup_schedule: "0 2 * * *"
backup_retention_days: 3
backup_retention_count: 3
backup_s3_retention_full_count: 1
backup_mongodb_weekly_keep: 1
backup_storage_type: s3
backup_storage_bucket: backups
backup_storage_region: "{{ object_storage_region | default('us-east-1') }}"
backup_storage_path_style: true
backup_dr_enabled: false
# The operational entrypoints load the gitignored project .env before Ansible
# starts. Non-secret location metadata may therefore be supplied there without
# duplicating it into platform.yaml; explicit profile values still win during
# normalization. Credentials remain process-environment-only.
backup_dr_storage_endpoint: "{{ lookup('env', 'BACKUP_DR_ENDPOINT') | default('', true) }}"
backup_dr_allow_literal_ip_endpoint: >-
  {{ lookup('env', 'BACKUP_DR_ALLOW_LITERAL_IP') |
     default('false', true) | bool }}
backup_dr_storage_region: "{{ lookup('env', 'BACKUP_DR_REGION') | default('us-east-1', true) }}"
backup_dr_storage_bucket: "{{ lookup('env', 'BACKUP_DR_BUCKET') | default('', true) }}"
backup_dr_storage_prefix: >-
  {{ lookup('env', 'BACKUP_DR_PREFIX') |
     default((project_name | default('k8s')) ~ '/velero', true) }}
backup_dr_storage_access_key: "{{ lookup('env', 'BACKUP_DR_ACCESS_KEY') | default('', true) }}"
backup_dr_storage_secret_key: "{{ lookup('env', 'BACKUP_DR_SECRET_KEY') | default('', true) }}"
backup_dr_schedule: "30 2 * * *"
backup_dr_retention_hours: 72
backup_dr_velero_chart_version: "12.1.0"
backup_dr_velero_image_tag: "v1.18.1"
backup_dr_velero_aws_plugin_tag: "v1.14.2"
backup_verify_all: true
backup_verification_timeout: 3600
backup_alert_enabled: false
backup_alert_webhook_url: ""
backup_alert_channel: "#alerts"
backup_alert_on_failure_only: false
backup_cron_timezone: UTC
backup_cron_concurrency_policy: Forbid
backup_cron_successful_jobs_history: 1
backup_cron_failed_jobs_history: 1
backup_job_cpu_request: 100m
backup_job_cpu_limit: 500m
backup_job_memory_request: 128Mi
backup_job_memory_limit: 512Mi
restore_drill_namespace: restore-drill
restore_drill_auto_cleanup: true
restore_drill_cleanup_after_hours: 24
restore_safety_gate_skip_verification: false
restore_safety_gate_confirm_required: true
backup_enabled: "{{ tier in ['medium', 'production'] }}"

# Daytona workspace platform (optional; disabled by default)
deploy_daytona: false
daytona_enabled: "{{ deploy_daytona | default(false) }}"
daytona_namespace: daytona
daytona_release_name: daytona
daytona_chart_repo_name: daytonaio
daytona_chart_repo_url: https://charts.daytona.io
daytona_chart_ref: daytonaio/daytona
# renovate: datasource=helm depName=daytona
daytona_chart_version: "0.0.23"
daytona_base_domain: "daytona.{{ domain }}"
daytona_values_override: {}

# Neutral shared Dragonfly credential; generated once by generate-secrets.
dragonfly_password: ""

# Observability enhancements
bastion_log_shipping: false  # Requires an explicitly designed private ingestion endpoint.
control_plane_log_shipping: false
hetzner_metrics_enabled: true

# Distributed tracing. OpenTelemetry collection is independent from the
# selected storage backend so compact profiles can route OTLP directly to
# Coroot without also running Tempo.
tracing_enabled: "{{ tier in ['medium', 'production'] }}"
tracing_backend: tempo  # Options: tempo, coroot
tempo_enabled: "{{ tracing_enabled and tracing_backend == 'tempo' }}"
tempo_retention: "{{ '12h' if resource_tier in ['minimal', 'small'] else '24h' if resource_tier == 'medium' else '72h' }}"
tempo_storage_size: "{{ '10Gi' if resource_tier in ['minimal', 'small'] else '20Gi' if resource_tier == 'medium' else '40Gi' }}"
otel_collector_enabled: "{{ tracing_enabled }}"

# Legacy direct-Ansible compatibility. Profiles use compliance.hipaa.enabled;
# the mode remains opt-in and still requires an organization-specific review.
hipaa_compliance: false
log_redaction_enabled: "{{ hipaa_compliance }}"

# Optional component defaults. Profiles can override these through their nested
# `<component>.enabled` setting; the playbook normalizes both forms.
deploy_elasticsearch: "{{ tier in ['medium', 'production'] }}"
deploy_gitlab: "{{ tier != 'minimal' }}"
deploy_gitops: true
deploy_observability: true
deploy_databases: true
deploy_postgresql: true
deploy_mongodb: false
deploy_autoscaling: true
deploy_dragonfly: "{{ tier in ['medium', 'production'] }}"
# Optional application services are never inferred from the capability tier.
# Select them explicitly through the nested profile selectors or legacy flags.
deploy_temporal: false
deploy_postal: false
deploy_glitchtip: false
deploy_umami: false
edge_cdn_confirm: false
