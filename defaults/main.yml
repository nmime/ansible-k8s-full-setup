# ============================================
# Global Default Variables
# ============================================
# Tier-specific configuration for all roles

# Tier selects platform capabilities. `resource_tier` selects default pod
# requests/limits and replica counts, so a profile can keep the medium toolset
# while using the small-footprint resource envelope.
tier: medium
platform_profile: "{{ tier }}"
resource_tier: "{{ tier }}"
# Certificate resources use the production issuer by default.  Disposable
# integration campaigns can select letsencrypt-staging without rewriting every
# component manifest or consuming the registered-domain production rate limit.
cert_manager_cluster_issuer: letsencrypt-prod

# Global settings
project_name: k8s
# domain: REQUIRED - must be provided via -e domain=yourdomain.com
# email: REQUIRED - must be provided via -e email=you@yourdomain.com

# Tier configuration (node counts for reference — actual server types auto-selected at runtime)
minimal:
  nodes: 2
  ha: false
  control_plane_count: 1
  control_plane_schedulable: true
  worker_count: 1

small:
  nodes: 3
  ha: false
  control_plane_count: 1
  control_plane_schedulable: true
  worker_count: 2

medium:
  nodes: 5
  ha: true
  control_plane_count: 3
  control_plane_schedulable: true
  worker_count: 2

production:
  nodes: 6
  ha: true
  control_plane_count: 3
  control_plane_schedulable: true
  worker_count: 3

# Infrastructure configuration
# Server types auto-selected from Hetzner API (cheapest meeting tier requirements)
# Override with: hetzner_bastion_type, hetzner_cp_type, hetzner_worker_type
hetzner_region: hel1
hetzner_image: ubuntu-24.04
ssh_key_path: ~/.ssh/id_ed25519
storage_class: hcloud-volumes
local_storage_enabled: false
local_storage_class: platform-local
local_storage_path: /var/lib/platform-local-storage
local_storage_min_free_gib_per_node: 40
local_storage_cache_priority_class: platform-ci
ansible_ssh_strict_host_key_checking: true
# Controller-local state must be unique when several clusters are reconciled
# concurrently. Override the port per cluster and run each controller with an
# isolated HOME; project-specific SSH state is created below that HOME.
k8s_api_local_port: 16443
kubespray_execution_playbook: cluster.yml
kubespray_execution_limit: ""

# Kubernetes
# renovate: datasource=github-releases depName=kubernetes/kubernetes
k8s_version: v1.35.4
k8s_cni: cilium
# renovate: datasource=github-releases depName=cilium/cilium
cilium_version: v1.19.5
# renovate: datasource=github-releases depName=kubernetes-sigs/gateway-api
gateway_api_version: v1.6.0
k8s_pod_cidr: 10.233.64.0/18
k8s_service_cidr: 10.233.0.0/18
# Bound completed/failed Pod API objects well below Kubespray's upstream
# default (12,500). This does not delete running workloads or their storage.
# Keep at most one terminal Pod because Succeeded Deployment Pods still match
# HPA selectors and are treated as missing metrics, which suppresses scale-up.
kube_controller_terminated_pod_gc_threshold: >-
  {{ (kubernetes | default({})).terminated_pod_gc_threshold | default(1) }}

# Cluster addons (patch/minor-safe upgrades)
cert_manager_version: v1.21.0
metallb_version: v0.16.1
hetzner_ccm_version: v1.33.0
hetzner_csi_version: v2.22.0
kubespray_version: v2.31.0
hetzner_ccm_manifest_sha256: bcf91ad8e67d2f1ad5f57d5dd39ced40bebbb1946768392cf2ada5bc2f671816
hetzner_csi_manifest_sha256: 464098a4a060d9824281e40fc99bde7998aa79e2164c870dd41161f65028b1fe
gateway_api_standard_sha256: a557172e8348f758479e9ee4000bbbb4b4aa48302a6b73461823ea5349bad56d
gateway_api_experimental_sha256: f0d5c2b0bef2b9d80ba6ba909e5e5dbde0800638437608353f41a6ebd3afcd9f

# CLI tool versions (pinned for reproducibility)
kubectl_version: "{{ k8s_version }}"
hcloud_cli_version: v1.65.0
yq_version: v4.44.6
helm_cli_version: v3.20.1
kubectl_linux_amd64_sha256: b529430df69a688fd61b64ad2299edb5fd71cb58be2a4779dba624c7d3510efd
helm_linux_amd64_sha256: 0165ee4a2db012cc657381001e593e981f42aa5707acdd50658326790c9d0dc3
hcloud_linux_amd64_sha256: f78d2db65b7ab58603d343739cb4397e13acef23182e41692a06e147a8d4c011
yq_linux_amd64_sha256: 0c2b24e645b57d8e7c0566d18643a6d4f5580feeea3878127354a46f2a1e4598
node_exporter_linux_amd64_sha256: a550cd5c05f760b7934a2d0afad66d2e92e681482f5f57a917465b1fba3b02a6
promtail_version: "3.0.0"
promtail_linux_amd64_sha256: 3a5120422a2a8aa26659a188d63f1425707ed42a1af274acc0a7797d851acf48

# Bastion service images
headscale_version: "0.28.0"
tailscale_version: "1.98.10"
caddy_image_tag: "2.11.4-alpine"
headscale_admin_user: admin
headscale_developer_user: dev
headscale_subnet_router_tag: "tag:subnet-router"
headscale_dns_base_domain: "{{ 'tail.' + domain }}"
headscale_preauth_key_expiration: 1h
headscale_admin_private_tcp_ports:
  - 22
  - 80
  - 443
  - 6443
headscale_admin_private_icmp_enabled: true
headscale_developer_https_enabled: false

# Network
private_network_cidr: 10.0.0.0/16
infrastructure_subnet: 10.0.0.0/24
control_plane_subnet: 10.0.1.0/24
workers_subnet: 10.0.2.0/24
services_subnet: 10.0.10.0/24

# Live-test safety gates (disable external/dns side effects in disposable validation)
hetzner_manage_dns: true
# May be a parent of `domain` (for example domain=small.lab.example.com and
# hetzner_dns_zone=example.com). Records are then written relative to this zone.
hetzner_dns_zone: "{{ domain | default('', true) }}"
k8s_create_external_tls: true
gateway_extra_certificate_refs: []
gateway_extra_certificates: []
gateway_https_hostname: ""
gateway_extra_https_listeners: []
gateway_http_allowed_routes:
  namespaces:
    from: Selector
    selector:
      matchLabels:
        gateway.platform.example.com/http-route: 'true'
gateway_https_allowed_routes: {namespaces: {from: All}}
object_storage_create_external_routes: true
object_storage_enabled: true

# Storage (SeaweedFS-backed S3-compatible object storage)
# renovate: datasource=helm depName=seaweedfs
object_storage_chart_version: "4.25.1"
object_storage_namespace: storage
object_storage_release_name: seaweedfs
object_storage_endpoint_hostport: "seaweedfs-filer.{{ object_storage_namespace | default('storage') }}.svc.cluster.local:8333"
object_storage_endpoint: "http://{{ object_storage_endpoint_hostport | default('seaweedfs-filer.storage.svc.cluster.local:8333') }}"
object_storage_console_domain: "{{ ('seaweedfs.' ~ (domain | default('', true))) if (domain | default('', true) | length > 0) else 'seaweedfs.local' }}"
object_storage_api_domain: "{{ ('s3.' ~ (domain | default('', true))) if (domain | default('', true) | length > 0) else 's3.local' }}"
object_storage_master_size: 4Gi
object_storage_volume_size: "{{ '20Gi' if resource_tier == 'minimal' else '40Gi' if resource_tier == 'small' else '100Gi' if resource_tier == 'medium' else '150Gi' }}"
object_storage_volume_min_free_space_percent: 8
object_storage_idx_size: 4Gi
object_storage_filer_size: 10Gi

# Secrets (Vault) - tier-specific
# renovate: datasource=github-releases depName=hashicorp/vault
vault_version: "2.0.3"
# renovate: datasource=helm depName=vault
vault_chart_version: "0.34.0"
vault_replicas: "{{ 3 if resource_tier in ['medium', 'production'] else 1 }}"
vault_storage_size: 20Gi
eso_enabled: true
# The `default/example-secret` ExternalSecret is only a demonstration fixture.
# Production reconciliation removes it unless an operator explicitly enables
# the fixture and points it at an existing Vault KV-v2 key/property.
eso_example_secret_enabled: false
eso_example_secret_remote_key: ""
eso_example_secret_remote_property: password
vault_tls_disabled: false
vault_verify_tls: true
vault_encrypt_secrets: true
vault_password_file: ~/.vault_pass
vault_init_output_file: "{{ playbook_dir }}/.vault-init-{{ project_name | default('k8s') }}.json"

# Databases - tier-specific
# renovate: datasource=github-releases depName=percona/percona-postgresql-operator
pg_operator_version: "3.0.0"
postgresql_replicas: "{{ 2 if resource_tier in ['medium', 'production'] else 1 }}"
postgresql_storage: "{{ '20Gi' if resource_tier == 'minimal' else '30Gi' if resource_tier == 'small' else '50Gi' if resource_tier == 'medium' else '100Gi' }}"
postgresql_version: 18
mongodb_storage: "{{ '20Gi' if resource_tier == 'minimal' else '30Gi' if resource_tier == 'small' else '50Gi' if resource_tier == 'medium' else '100Gi' }}"
mongodb_priority_class_name: platform-platform-critical

# Operator-injected database containers need explicit reservations as well as
# the primary database containers. The constrained envelope is deliberately
# selected by resource_tier (including medium-optimized and production, which
# both map to small) while every dictionary remains profile-overridable.
database_container_default_resources:
  requests:
    cpu: "{{ '5m' if resource_tier in ['minimal', 'small'] else '10m' }}"
    memory: "{{ '16Mi' if resource_tier in ['minimal', 'small'] else '32Mi' }}"
  limits:
    cpu: "{{ '500m' if resource_tier in ['minimal', 'small'] else '1' }}"
    memory: "{{ '512Mi' if resource_tier in ['minimal', 'small'] else '1Gi' }}"
postgresql_replica_cert_copy_resources:
  requests:
    cpu: "{{ '5m' if resource_tier in ['minimal', 'small'] else '10m' }}"
    memory: "{{ '16Mi' if resource_tier in ['minimal', 'small'] else '32Mi' }}"
  limits:
    cpu: "{{ '50m' if resource_tier in ['minimal', 'small'] else '100m' }}"
    memory: "{{ '64Mi' if resource_tier in ['minimal', 'small'] else '128Mi' }}"
postgresql_pgbackrest_resources:
  requests:
    cpu: "{{ '25m' if resource_tier in ['minimal', 'small'] else '50m' }}"
    memory: "{{ '64Mi' if resource_tier in ['minimal', 'small'] else '128Mi' }}"
  limits:
    cpu: "{{ '500m' if resource_tier in ['minimal', 'small'] else '1' }}"
    memory: "{{ '512Mi' if resource_tier in ['minimal', 'small'] else '1Gi' }}"
postgresql_pgbackrest_config_resources:
  requests:
    cpu: "{{ '5m' if resource_tier in ['minimal', 'small'] else '10m' }}"
    memory: "{{ '16Mi' if resource_tier in ['minimal', 'small'] else '32Mi' }}"
  limits:
    cpu: "{{ '100m' if resource_tier in ['minimal', 'small'] else '200m' }}"
    memory: "{{ '64Mi' if resource_tier in ['minimal', 'small'] else '128Mi' }}"
postgresql_pgbackrest_init_resources:
  requests:
    cpu: "{{ '10m' if resource_tier in ['minimal', 'small'] else '25m' }}"
    memory: "{{ '32Mi' if resource_tier in ['minimal', 'small'] else '64Mi' }}"
  limits:
    cpu: "{{ '250m' if resource_tier in ['minimal', 'small'] else '500m' }}"
    memory: "{{ '128Mi' if resource_tier in ['minimal', 'small'] else '256Mi' }}"
postgresql_pgbackrest_repo_host_resources:
  requests:
    cpu: "{{ '25m' if resource_tier in ['minimal', 'small'] else '50m' }}"
    memory: "{{ '64Mi' if resource_tier in ['minimal', 'small'] else '128Mi' }}"
  limits:
    cpu: "{{ '500m' if resource_tier in ['minimal', 'small'] else '1' }}"
    memory: "{{ '512Mi' if resource_tier in ['minimal', 'small'] else '1Gi' }}"
postgresql_pgbackrest_job_resources:
  requests:
    cpu: "{{ '50m' if resource_tier in ['minimal', 'small'] else '100m' }}"
    memory: "{{ '96Mi' if resource_tier in ['minimal', 'small'] else '256Mi' }}"
  limits:
    cpu: "{{ '1' if resource_tier in ['minimal', 'small'] else '2' }}"
    memory: "{{ '1Gi' if resource_tier in ['minimal', 'small'] else '2Gi' }}"
postgresql_pgbackrest_job_ttl_seconds: 86400
mongodb_backup_resources:
  requests:
    cpu: "{{ '50m' if resource_tier in ['minimal', 'small'] else '100m' }}"
    memory: "{{ '96Mi' if resource_tier in ['minimal', 'small'] else '256Mi' }}"
  limits:
    cpu: "{{ '500m' if resource_tier in ['minimal', 'small'] else '1' }}"
    memory: "{{ '512Mi' if resource_tier in ['minimal', 'small'] else '1Gi' }}"
mongodb_backup_starting_deadline_seconds: 1800
mongodb_backup_image: percona/percona-backup-mongodb:2.15.0
mongodb_replset_resources:
  requests:
    cpu: "{{ '100m' if resource_tier in ['minimal', 'small'] else '250m' }}"
    memory: "{{ '256Mi' if resource_tier in ['minimal', 'small'] else '512Mi' }}"
  limits:
    cpu: "{{ '500m' if resource_tier in ['minimal', 'small'] else '1' }}"
    memory: "{{ '1Gi' if resource_tier in ['minimal', 'small'] else '2Gi' }}"
mongodb_wiredtiger_cache_size_ratio: 0.35
mongodb_pmm_resources:
  requests:
    cpu: "{{ '50m' if resource_tier in ['minimal', 'small'] else '100m' }}"
    memory: "{{ '64Mi' if resource_tier in ['minimal', 'small'] else '128Mi' }}"
  limits:
    cpu: "{{ '200m' if resource_tier in ['minimal', 'small'] else '500m' }}"
    memory: "{{ '256Mi' if resource_tier in ['minimal', 'small'] else '512Mi' }}"

# GitLab
# renovate: datasource=helm depName=gitlab
gitlab_chart_version: "10.1.2"
# Registry pull-through cache for docker.io (cuts external egress; 20TB/server/month budget)
gitlab_registry_pullthrough_enabled: true
gitlab_registry_pullthrough_remote_url: "https://registry-1.docker.io"
gitlab_registry_pullthrough_ttl: "720h"
gitlab_runner_concurrent_jobs: 10
gitlab_runner_worker_index: 0
# Scheduler requests are independently configurable from container limits so
# two distinct Runner classes can deliberately serialize on one compact CI
# node. Defaults preserve the existing general-purpose envelope.
gitlab_runner_cpu_request: 500m
gitlab_runner_cpu_limit: 2000m
gitlab_runner_memory_request: 1Gi
gitlab_runner_memory_limit: 4Gi
gitlab_runner_ephemeral_storage_request: 1Gi
gitlab_runner_ephemeral_storage_limit: 8Gi
gitlab_runner_service_cpu_request: 200m
gitlab_runner_service_cpu_limit: 1000m
gitlab_runner_service_memory_request: 512Mi
gitlab_runner_service_memory_limit: 2Gi
gitlab_runner_service_ephemeral_storage_request: 256Mi
gitlab_runner_service_ephemeral_storage_limit: 4Gi
gitlab_runner_helper_cpu_request: 100m
gitlab_runner_helper_cpu_limit: 500m
gitlab_runner_helper_memory_request: 256Mi
gitlab_runner_helper_memory_limit: 512Mi
gitlab_runner_helper_ephemeral_storage_request: 256Mi
gitlab_runner_helper_ephemeral_storage_limit: 4Gi
gitlab_image_builder_runner_enabled: false
gitlab_image_builder_runner_replicas: 1
gitlab_image_builder_runner_concurrent_jobs: 1
gitlab_image_builder_runner_namespace: gitlab-image-builds
gitlab_image_builder_cpu_request: 1000m
gitlab_image_builder_cpu_limit: 4000m
gitlab_image_builder_memory_request: 2Gi
gitlab_image_builder_memory_limit: 8Gi
gitlab_image_builder_helper_cpu_request: 100m
gitlab_image_builder_helper_cpu_limit: 500m
gitlab_image_builder_helper_memory_request: 256Mi
gitlab_image_builder_helper_memory_limit: 512Mi
gitlab_docker_host_runner_enabled: false
gitlab_docker_host_runner_replicas: 1
gitlab_docker_host_runner_concurrent_jobs: 1
gitlab_docker_host_runner_namespace: gitlab-docker-builds
gitlab_docker_host_runner_worker_index: 0

# Shared-cluster scheduling policy (USER-SPECIFIED MODEL, exact).
# System PriorityClasses remain above these values; every CI/batch class is
# negative and non-preempting so services always reclaim capacity without CI
# evicting other workloads. The 5 managed classes are created by the
# k8s-cluster-management role BEFORE any workload chart references them.
workload_priority_enabled: true
workload_priority_classes:
  - {name: platform-platform-critical, value: 1000000, preemption_policy: PreemptLowerPriority}
  - {name: platform-production, value: 100000, preemption_policy: PreemptLowerPriority}
  - {name: platform-preproduction, value: 10000, preemption_policy: PreemptLowerPriority}
  - {name: platform-ci, value: -100, preemption_policy: Never}
  - {name: platform-batch, value: -200, preemption_policy: Never}
workload_priority_platform_namespaces:
  - argocd
  - backups
  - cert-manager
  - cilium-secrets
  - cilium-system
  - coroot
  - databases
  - dragonfly
  - dragonfly-operator-system
  - elasticsearch
  - external-secrets
  - gateway-secrets
  - gitlab
  - glitchtip
  - keda
  - kube-system
  - logging-agents
  - metallb-system
  - monitoring
  - postal
  - storage
  - temporal
  - vault
  - velero
workload_priority_production_namespaces:
  - agents
  - production
workload_priority_environment_namespaces:
  - analytics
  - umami
workload_priority_review_namespaces: []
workload_priority_controller_overrides:
  gitlab-ci-general/Deployment/gitlab-runner: platform-ci

# Public SSH is fail-closed. Supply operator/VPN CIDRs through a profile,
# extra-vars, or comma-separated HETZNER_SSH_SOURCE_IPS in the ignored .env.
hetzner_ssh_source_ips: []

# GitOps (ArgoCD)
# renovate: datasource=helm depName=argo-cd
argocd_chart_version: "9.5.14"
# renovate: datasource=github-releases depName=argoproj/argo-cd
argocd_version: "v3.4.2"
argocd_insecure_mode: false
argocd_public_route_enabled: true
argocd_allowed_source_repos:
  - "https://gitlab.{{ domain }}/platform/*"
argocd_allowed_namespaces:
  - default
  - applications
argocd_allowed_cluster_resources:
  - group: ""
    kind: Namespace
argocd_allowed_namespace_resources:
  - group: "apps"
    kind: Deployment
  - group: "apps"
    kind: StatefulSet
  - group: "apps"
    kind: DaemonSet
  - group: "batch"
    kind: Job
  - group: "batch"
    kind: CronJob
  - group: ""
    kind: Service
  - group: ""
    kind: ConfigMap
  - group: ""
    kind: Secret
  - group: "networking.k8s.io"
    kind: NetworkPolicy
  - group: "gateway.networking.k8s.io"
    kind: HTTPRoute

# Observability - tier-specific
log_stack: "{{ 'loki' if tier in ['minimal', 'small'] else 'elk' }}"  # Options: loki, elk, efk
metrics_retention: "{{ '7d' if resource_tier == 'minimal' else '14d' if resource_tier == 'small' else '30d' }}"
metrics_storage: "{{ '20Gi' if resource_tier == 'minimal' else '40Gi' if resource_tier == 'small' else '100Gi' if resource_tier == 'medium' else '150Gi' }}"
pmm_storage_size: "{{ '20Gi' if resource_tier in ['minimal', 'small'] else '50Gi' }}"
pmm_enabled: "{{ tier in ['medium', 'production'] }}"
logging_retention: "{{ '3d' if resource_tier == 'minimal' else '7d' if resource_tier == 'small' else '14d' }}"

# Autoscaling
keda_enabled: true
# renovate: datasource=helm depName=keda
keda_chart_version: "2.20.1"

# Temporal
# renovate: datasource=helm depName=temporal
temporal_chart_version: "1.2.0"
temporal_num_history_shards: 512

# Elasticsearch
# renovate: datasource=docker depName=elasticsearch
es_version: "9.4.3"
# renovate: datasource=docker depName=kibana
kibana_version: "9.4.3"
apm_server_version: "9.4.3"
es_cluster_name: "platform-es"

# Postal
