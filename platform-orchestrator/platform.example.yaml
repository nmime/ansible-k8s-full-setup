# ============================================
# Platform Configuration
# ============================================
# Complete self-hosted Kubernetes platform
# ============================================

# ---------------------------------------------
# Global Settings
# ---------------------------------------------
global:
  domain: example.com
  email: admin@example.com
  timezone: UTC
  environment: production
  project: k8s

tier: small

# ---------------------------------------------
# Network Architecture
# ---------------------------------------------
network:
  private_network:
    cidr: 10.0.0.0/16
    infrastructure: 10.0.0.0/24
    control_plane: 10.0.1.0/24
    workers: 10.0.2.0/24
    services: 10.0.10.0/24

  bastion:
    enabled: true
    server_type: cx22
    private_ip: 10.0.0.2

  load_balancer:
    enabled: true
    type: lb11

  vpn:
    enabled: true
    provider: headscale
    domain: vpn.example.com

  tls:
    enabled: true
    issuer: letsencrypt
    dns_provider: cloudflare
    wildcard: true

# ---------------------------------------------
# Service Exposure
# ---------------------------------------------
services:
  public:
    - domain: app.example.com
      service: frontend
      namespace: production
      port: 80

    - domain: api.example.com
      service: backend
      namespace: production
      port: 8080

    - domain: s3.example.com
      service: minio
      namespace: storage
      port: 9000

    - domain: registry.example.com
      service: gitlab-registry
      namespace: gitlab
      port: 5000

  private:
    - domain: gitlab.example.com
      service: gitlab-webservice-default
      namespace: gitlab
      port: 8181

    - domain: argocd.example.com
      service: argocd-server
      namespace: argocd
      port: 443

    - domain: grafana.example.com
      service: grafana
      namespace: monitoring
      port: 80

    - domain: minio.example.com
      service: minio-console
      namespace: storage
      port: 9001

    - domain: vault.example.com
      service: vault
      namespace: vault
      port: 8200

# ---------------------------------------------
# Infrastructure (Hetzner)
# ---------------------------------------------
infrastructure:
  provider: hetzner
  region: hel1
  ssh_key_path: ~/.ssh/id_ed25519
  ssh_user: root

  control_plane:
    count: 1
    type: cx22
    public_ip: false

  workers:
    count: 2
    type: cx32
    public_ip: false

# ---------------------------------------------
# Kubernetes Cluster
# ---------------------------------------------
kubernetes:
  version: v1.34.3
  cni: cilium
  cilium_version: v1.18.5
  pod_cidr: 10.233.64.0/18
  service_cidr: 10.233.0.0/18
  features:
    gateway_api: true
    gateway_api_version: v1.4.0
    hubble: true
    encryption: true
    network_policies: true

# ---------------------------------------------
# Storage (MinIO)
# ---------------------------------------------
storage:
  enabled: true
  replicas: 1
  storage_class: hcloud-volumes
  size: 100Gi

# ---------------------------------------------
# Secrets Management (Vault)
# ---------------------------------------------
secrets:
  enabled: true
  vault:
    replicas: 1
    storage_size: 10Gi
  eso:
    enabled: true

# ---------------------------------------------
# Databases
# ---------------------------------------------
databases:
  postgresql:
    enabled: true
    version: 17
    replicas: 1
    storage_size: 20Gi

  mongodb:
    enabled: false
    version: "8.0"
    replicas: 1
    storage_size: 20Gi

# ---------------------------------------------
# GitLab
# ---------------------------------------------
gitlab:
  enabled: true
  domain: gitlab.example.com
  registry_domain: registry.example.com
  registry_public: true
  webservice_replicas: 1
  sidekiq_replicas: 1
  runner:
    enabled: true
    concurrent_jobs: 5

# ---------------------------------------------
# GitOps (ArgoCD)
# ---------------------------------------------
gitops:
  enabled: true
  domain: argocd.example.com
  ha_enabled: false

# ---------------------------------------------
# Observability
# ---------------------------------------------
observability:
  metrics:
    enabled: true
    retention: 14d
    storage_size: 20Gi

  logging:
    enabled: true
    retention: 7d

  grafana:
    enabled: true
    domain: grafana.example.com

# ---------------------------------------------
# Autoscaling (KEDA)
# ---------------------------------------------
autoscaling:
  enabled: true

# ---------------------------------------------
# Backup
# ---------------------------------------------
backup:
  enabled: true
  schedule: "0 2 * * *"
  retention_days: 30
