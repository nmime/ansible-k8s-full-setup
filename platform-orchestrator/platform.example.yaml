# ============================================
# Platform Configuration
# ============================================
# Complete self-hosted Kubernetes platform
# ============================================

global:
  domain: ""          # REQUIRED: set your domain
  email: ""           # REQUIRED: set your email
  timezone: UTC
  environment: production
  project: k8s

platform_profile: custom
tier: small
resource_tier: small

network:
  # Leave empty only in the template; deployment then requires the ignored
  # HETZNER_SSH_SOURCE_IPS environment variable and rejects public CIDRs.
  ssh_source_ips: []
  private_network:
    cidr: 10.0.0.0/16
    infrastructure: 10.0.0.0/24
    control_plane: 10.0.1.0/24
    workers: 10.0.2.0/24
  bastion:
    enabled: true
    server_type: cpx22
  # Active/passive egress uses a second billable server and Floating IPv4.
  # Stage with activate=false; publish forward/PTR/SPF, then activate=true.
  egress:
    enabled: false
    activate: false
    standby_server_type: cpx22
    standby_location: fsn1
    standby_private_ip: 10.0.2.12
    floating_ip_home_location: hel1
    ptr: ""                 # Defaults to mailout.<global.domain>
    failure_threshold: 3
    watchdog_interval_seconds: 10
    health_timeout_seconds: 4
    promotion_timeout_seconds: 90
    manage_mail_dns: false
    mail_dns_zone: ""       # Defaults to hetzner_dns_zone/global.domain
    mail_spf_name: spf
    mail_legacy_ipv4: ""
    mail_include_legacy_ipv4: false
  load_balancer:
    enabled: true
    type: lb11
  vpn:
    enabled: true
    provider: headscale
    domain: ""             # Defaults to vpn.<global.domain>

infrastructure:
  # Optional short Hetzner server display prefix. Kubernetes node names and
  # project labels remain stable when this differs from project_name.
  server_name_prefix: ""
  provider: hetzner
  region: hel1
  ssh_key_path: ~/.ssh/id_ed25519
  ssh_user: root
  control_plane:
    count: 1
    type: cpx22
    public_ip: false
  workers:
    count: 2
    type: cpx32
    public_ip: false

# Use a distinct port and HOME for every concurrently managed cluster.
k8s_api_local_port: 16443

# Optional parent Hetzner DNS zone. When omitted, global.domain is the zone.
# Example: global.domain=small.lab.example.com, hetzner_dns_zone=example.com.
hetzner_dns_zone: ""

kubernetes:
  version: v1.35.4
  cni: cilium
  cilium_version: v1.19.5
  pod_cidr: 10.233.64.0/18
  service_cidr: 10.233.0.0/18
  features:
    gateway_api: true
    gateway_api_version: v1.6.0
    hubble: true
    encryption: true
    network_policies: true

local_storage:
  # Opt in only for application-replicated claims. Local PVs are node-affine
  # and require external recovery backups.
  enabled: false
  storage_class: platform-local
  path: /var/lib/platform-local-storage
  min_free_gib_per_node: 40

storage:
  enabled: true
  replicas: 1
  storage_class: hcloud-volumes
  # Per-component overrides can select platform-local after local_storage is
  # enabled. See profiles/medium-optimized.yaml for the audited hybrid map.
  size: 100Gi
  # Normal deployments keep a separate durable index claim per volume replica.
  # Only disposable --minimum-storage campaigns colocate indexes with data.
  index_size: 4Gi
  index_persistent: true

secrets:
  enabled: true
  # Set this explicitly for long-lived/component-only environments so every
  # reconciliation reads and rewrites the same encrypted campaign state.
  file: ""
  vault:
    replicas: 1
    storage_size: 20Gi
  eso:
    enabled: true
    # Disabled by default. To opt into the demo fixture, first create the
    # source value (for example `vault kv put secret/demo/app password=...`),
    # then set all three fields below. Reconciliation verifies the key and
    # property before creating `default/example-secret`.
    example_secret:
      enabled: false
      remote_key: ""       # KV-v2 path below `secret/`, e.g. demo/app
      remote_property: password

databases:
  enabled: true
  # Admission defaults cover operator-generated init containers whose CRDs do
  # not expose a resource field. Explicit component resources below win.
  # container_defaults:
  #   requests: {cpu: 5m, memory: 16Mi}
  #   limits: {cpu: 500m, memory: 512Mi}
  postgresql:
    enabled: true
    version: 18
    replicas: 1
    storage_size: 30Gi
    # Optional stable PgBouncer DNS. When set, the role issues a private
    # cert-manager certificate containing both the alias and the operator
    # service SANs and publishes verify-full connection secrets with the
    # matching CA. Start with preferTLS. Only after every direct and pooled
    # consumer is proven may requireTLS be paired with cutover confirmation.
    service_alias: ""
    tls_mode: preferTLS
    tls_cutover_confirmed: false
    # Operator-created helper containers use tier-aware defaults. Any helper
    # can be tuned independently with the same requests/limits dictionary:
    # resources:
    #   pgbackrest_job:
    #     requests: {cpu: 50m, memory: 96Mi}
    #     limits: {cpu: "1", memory: 1Gi}
    # Supported keys: replica_cert_copy, pgbackrest, pgbackrest_config,
    # pgbackrest_init, pgbackrest_repo_host, and pgbackrest_job.
  mongodb:
    enabled: false
    # Optional stable seed DNS. This requires PSMDB Operator >=1.23 because
    # v1.22 overwrites externally-added SANs. The role uses
    # certManagementPolicy=userProvidedOnly and
    # allowInvalidCertificates=false. Roll out with preferTLS first; consumers
    # must mount mongodb-client-ca and add
    # tls=true&tlsCAFile=/etc/mongodb-tls/ca.crt to their URI. Only after all
    # clients are proven may requireTLS be paired with cutover confirmation.
    service_alias: ""
    operator_version: "1.23.0"
    tls_mode: preferTLS
    tls_cutover_confirmed: false
    tls_consumer_namespaces: []
    # Optional mTLS identities issued by the MongoDB operator CA and copied to
    # consumer namespaces. Each namespace must also be listed above.
    tls_client_consumers: []
    version: "8.0"
    replicas: 1
    storage_size: 30Gi
    # resources:
    #   backup:
    #     requests: {cpu: 50m, memory: 96Mi}
    #     limits: {cpu: 500m, memory: 512Mi}
    #   pmm:
    #     requests: {cpu: 50m, memory: 64Mi}
    #     limits: {cpu: 200m, memory: 256Mi}

gitlab:
  enabled: true
  # Keep the UI/API VPN-only unless a public developer endpoint is intentional.
  public_webservice_enabled: false
  registry_public: true
  webservice_replicas: 1
  sidekiq_replicas: 1
  runner:
    enabled: true
    namespace: gitlab-ci-general  # keep untrusted jobs outside the GitLab namespace
    concurrent_jobs: 5
    # Optional scheduler envelope for each general CI job. Raising the memory
    # request can intentionally prevent two different Runner classes from
    # overlapping on the same compact, tainted worker.
    # job_resources:
    #   memory_request: 3Gi
    #   memory_limit: 4Gi
    image_builder:
      enabled: false
      replicas: 1
      concurrent_jobs: 1
      # job_resources:
      #   memory_request: 4Gi
      #   memory_limit: 6Gi
    docker_host:
      enabled: false
      replicas: 1
      concurrent_jobs: 1
      # When enabled, reserve this worker exclusively for the digest-pinned
      # privileged DinD service. Increase infrastructure.workers.count first.
      dedicated_worker_index: 0

gitops:
  enabled: true
  ha_enabled: false

observability:
  # Metrics, logging, and Grafana are one production-tested core bundle.
  enabled: true
  # PMM is independently selectable; leave it off on constrained clusters.
  pmm:
    enabled: false
  metrics:
    enabled: true
    retention: 14d
    storage_size: 40Gi
  logging:
    enabled: true
    retention: 7d
  grafana:
    enabled: true

autoscaling:
  enabled: true

elasticsearch:
  enabled: false

dragonfly:
  enabled: true       # Generic cache; also required by GitLab, GlitchTip, and Postal
  replicas: 1

temporal:
  enabled: false      # Requires PostgreSQL

postal:
  enabled: false      # Requires Dragonfly
  # Postal is a transactional mail transport, not an IMAP mailbox service.
  # domains: [example.com, example.net]
  # outbound_ipv4: 203.0.113.10
  # The HELO A record and IPv4 PTR must both use mailout.<global.domain>.
  # Direct delivery also fails closed when cluster egress cannot reach TCP/25.
  # smtp_credential_enabled: false  # enable only after SPF/DKIM/DMARC verify
  # manage_sender_dns: false        # manage MX/SPF/DKIM/return-path/DMARC in every sender zone
  # sender_dns_providers:           # authoritative provider for each sender zone
  #   example.com: hetzner
  #   example.net: gcore            # requires a scoped GCORE_API_KEY
  # dmarc_policy: none              # progress to quarantine/reject after aggregate reports are clean
  # worker_index: 0  # dedicate and taint one non-CI worker for mail when > 0

coroot:
  enabled: false      # Requires observability; eBPF node agent is privileged

tracing:
  enabled: false      # One OTel Collector and one selected trace backend
  backend: tempo      # tempo or coroot
  tempo:
    enabled: false    # Requires object storage; Coroot does not
  retention: 24h
  storage_size: 10Gi

backup:
  enabled: true
  schedule: "0 2 * * *"
  retention_days: 30
  disaster_recovery:
    enabled: false
    endpoint: ""
    region: us-east-1
    bucket: ""
    prefix: k8s/velero
    schedule: "30 2 * * *"
    retention_hours: 720

compliance:
  hipaa:
    enabled: false
    log_redaction_enabled: true

applications:
  daytona:
    enabled: false
    namespace: daytona
    base_domain: ""      # Defaults to daytona.<global.domain>
    values_override: {}

glitchtip:
  enabled: false

umami:
  enabled: false
  # Dashboard is attached to the VPN/admin gateway. The ingest hostname is
  # public, but only exact /script.js and /api/send paths are routed.
  dashboard_domain: umami.example.com
  ingest_domain: analytics.example.com
  replicas: 2
  hpa_min_replicas: 2
  hpa_max_replicas: 4
  websites: []
  # - id: 00000000-0000-4000-8000-000000000001
  #   name: Example
  #   domain: app.example.com

apm:
  enabled: false

blackbox:
  enabled: true

alerting:
  telegram:
    enabled: false
  email:
    enabled: false      # Requires Postal because SMTP is in-cluster
    to: ""
