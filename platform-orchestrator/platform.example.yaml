# ============================================
# Platform Configuration
# ============================================
# Complete self-hosted Kubernetes platform
# ============================================

global:
  domain: ""          # REQUIRED: set your domain
  email: ""           # REQUIRED: set your email
  timezone: UTC
  environment: production
  project: k8s

platform_profile: custom
tier: small
resource_tier: small

network:
  private_network:
    cidr: 10.0.0.0/16
    infrastructure: 10.0.0.0/24
    control_plane: 10.0.1.0/24
    workers: 10.0.2.0/24
  bastion:
    enabled: true
    server_type: cx23
  load_balancer:
    enabled: true
    type: lb11
  vpn:
    enabled: true
    provider: headscale
    domain: ""             # Defaults to vpn.<global.domain>

infrastructure:
  provider: hetzner
  region: hel1
  ssh_key_path: ~/.ssh/id_ed25519
  ssh_user: root
  control_plane:
    count: 1
    type: cx23
    public_ip: false
  workers:
    count: 2
    type: cx33
    public_ip: false

kubernetes:
  version: v1.35.6
  cni: cilium
  cilium_version: v1.19.5
  pod_cidr: 10.233.64.0/18
  service_cidr: 10.233.0.0/18
  features:
    gateway_api: true
    gateway_api_version: v1.6.0
    hubble: true
    encryption: true
    network_policies: true

storage:
  enabled: true
  replicas: 1
  storage_class: hcloud-volumes
  size: 100Gi

secrets:
  enabled: true
  vault:
    replicas: 1
    storage_size: 20Gi
  eso:
    enabled: true

databases:
  enabled: true
  postgresql:
    enabled: true
    version: 18
    replicas: 1
    storage_size: 30Gi
  mongodb:
    enabled: false
    version: "8.0"
    replicas: 1
    storage_size: 30Gi

gitlab:
  enabled: true
  registry_public: true
  webservice_replicas: 1
  sidekiq_replicas: 1
  runner:
    enabled: true
    concurrent_jobs: 5

gitops:
  enabled: true
  ha_enabled: false

observability:
  # Metrics, logging, and Grafana are one production-tested core bundle.
  enabled: true
  metrics:
    enabled: true
    retention: 14d
    storage_size: 40Gi
  logging:
    enabled: true
    retention: 7d
  grafana:
    enabled: true

autoscaling:
  enabled: true

elasticsearch:
  enabled: false

dragonfly:
  enabled: true       # Required by GitLab, GlitchTip, and Postal
  replicas: 1

temporal:
  enabled: false      # Requires PostgreSQL and Elasticsearch

postal:
  enabled: false      # Requires Dragonfly

coroot:
  enabled: false      # Requires observability; eBPF node agent is privileged

tracing:
  enabled: false      # Tempo; requires observability and object storage
  retention: 24h
  storage_size: 10Gi

backup:
  enabled: true
  schedule: "0 2 * * *"
  retention_days: 30

compliance:
  hipaa:
    enabled: false
    log_redaction_enabled: true

applications:
  daytona:
    enabled: false
    namespace: daytona
    base_domain: ""      # Defaults to daytona.<global.domain>
    values_override: {}

glitchtip:
  enabled: false

apm:
  enabled: false

blackbox:
  enabled: true

alerting:
  telegram:
    enabled: false
  email:
    enabled: false      # Requires Postal because SMTP is in-cluster
    to: ""
