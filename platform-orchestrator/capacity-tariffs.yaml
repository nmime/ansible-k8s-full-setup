schema_version: 1

families:
  cx:
    label: CX cost-optimized x86
    architecture: x86
    live_deployment: true
    availability: intermittent
  cax:
    label: CAX economy ARM64
    architecture: arm
    live_deployment: false
    availability: limited
    blocked_reason: The complete selected image set has no ARM64 production attestation.
  cpx:
    label: CPX balanced x86
    architecture: x86
    live_deployment: true
    availability: current
  ccx:
    label: CCX dedicated x86
    architecture: x86
    live_deployment: true
    availability: current

# Mappings preserve each profile's tested or declared role capacity floor.
# Dedicated vCPU mappings use fewer vCPUs only where that floor permits it.
profiles:
  minimal:
    cx: {bastion: cx23, control_plane: cx33, worker: cx33}
    cax: {bastion: cax11, control_plane: cax21, worker: cax21}
    cpx: {bastion: cpx22, control_plane: cpx32, worker: cpx32}
    ccx: {bastion: ccx13, control_plane: ccx23, worker: ccx23}
  small:
    cx: {bastion: cx23, control_plane: cx23, worker: cx33}
    cax: {bastion: cax11, control_plane: cax11, worker: cax21}
    cpx: {bastion: cpx22, control_plane: cpx22, worker: cpx32}
    ccx: {bastion: ccx13, control_plane: ccx13, worker: ccx23}
  medium:
    cx: {bastion: cx23, control_plane: cx43, worker: cx43}
    cax: {bastion: cax11, control_plane: cax31, worker: cax31}
    cpx: {bastion: cpx22, control_plane: cpx42, worker: cpx42}
    ccx: {bastion: ccx13, control_plane: ccx23, worker: ccx23}
  medium-optimized:
    # Keep quorum nodes economical while three larger workload nodes provide
    # the reviewed 3+3 failure-domain layout and local-PV capacity.
    cx: {bastion: cx23, control_plane: cx33, worker: cx43}
    cax: {bastion: cax11, control_plane: cax21, worker: cax21}
    cpx: {bastion: cpx22, control_plane: cpx32, worker: cpx32}
    ccx: {bastion: ccx13, control_plane: ccx23, worker: ccx23}
  production:
    cx: {bastion: cx23, control_plane: cx43, worker: cx43}
    cax: {bastion: cax11, control_plane: cax31, worker: cax31}
    cpx: {bastion: cpx22, control_plane: cpx42, worker: cpx42}
    ccx: {bastion: ccx13, control_plane: ccx23, worker: ccx23}

# Workers beyond the application-worker floor that belong to an isolated
# operational lane. They are priced separately because their disk and memory
# floors differ from the ordinary worker mapping.
additional_workers:
  medium-optimized:
    cx:
      - {role: ci-docker, type: cx43}
      - {role: ci-build, type: cx53}
    cax:
      - {role: ci-docker, type: cax31}
      - {role: ci-build, type: cax41}
    cpx:
      - {role: ci-docker, type: cpx32}
      - {role: ci-build, type: cpx42}
    ccx:
      - {role: ci-docker, type: ccx23}
      - {role: ci-build, type: ccx43}
