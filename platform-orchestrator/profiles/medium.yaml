# ============================================
# MEDIUM TIER - standard full-platform footprint
# ============================================
# Best for: Small-medium traffic, teams
# Nodes: 5 x cpx42 16Gi-class nodes (3 schedulable masters HA, 2 workers) + cpx22 bastion + lb11
# HA: Yes (control plane)
# Storage: 3x100Gi object storage, 50Gi PostgreSQL, 100Gi metrics
# Costs vary with current Hetzner pricing, region, traffic, and backups/snapshots.
# ============================================

platform_profile: medium
tier: medium
resource_tier: medium
cost_estimate: "Current balanced tariff: 3 x cpx42 control plane, 2 x cpx42 workers, cpx22 bastion, lb11"

global:
  project: k8s
  domain: ""          # REQUIRED: set your domain
  email: ""           # REQUIRED: set your email
  environment: production

# ---------------------------------------------
# Infrastructure
# ---------------------------------------------
infrastructure:
  provider: hetzner
  region: hel1

  control_plane:
    count: 3
    type: cpx42
    # The full medium stack does not fit safely on only two 16Gi workers and
    # can also exceed per-node volume attachment limits. Keep the three HA
    # control-plane nodes schedulable; production is the dedicated-CP tier.
    schedulable: true

  workers:
    count: 2
    type: cpx42

# ---------------------------------------------
# Network
# ---------------------------------------------
network:
  bastion:
    enabled: true
    server_type: cpx22

  load_balancer:
    enabled: true
    type: lb11

  vpn:
    enabled: true

# ---------------------------------------------
# Kubernetes
# ---------------------------------------------
kubernetes:
  version: v1.35.4
  cni: cilium
  ha_control_plane: true

# ---------------------------------------------
# Storage
# ---------------------------------------------
storage:
  enabled: true
  mode: distributed
  master_replicas: 3
  # Three volume servers are enough for the 001 two-copy placement and avoid
  # wasting 110Gi (data + index) under Hetzner's common 1.5TiB quota.
  volume_replicas: 3
  filer_replicas: 2
  replication_placement: "001"
  size_per_replica: 100Gi

# ---------------------------------------------
# Secrets
# ---------------------------------------------
secrets:
  enabled: true
  vault:
    replicas: 3
    storage_size: 20Gi
  eso:
    enabled: true

# ---------------------------------------------
# Databases
# ---------------------------------------------
databases:
  enabled: true
  postgresql:
    enabled: true
    replicas: 2
    storage_size: 50Gi
  mongodb:
    enabled: true
    replicas: 3
    # Resource-efficient HA baseline; increase online when workload data needs it.
    storage_size: 20Gi

# ---------------------------------------------
# GitLab
# ---------------------------------------------
gitlab:
  enabled: true
  webservice_replicas: 2
  sidekiq_replicas: 2
  # The live production campaign observed ~1.96Gi per Webservice pod. Keep
  # equivalent headroom on medium, whose node envelope is larger.
  webservice_memory_request: 2Gi
  webservice_memory_limit: 3Gi
  runner:
    enabled: true
    concurrent_jobs: 10

# ---------------------------------------------
# GitOps
# ---------------------------------------------
gitops:
  enabled: true
  ha_enabled: true

# ---------------------------------------------
# Observability
# ---------------------------------------------
observability:
  enabled: true
  pmm:
    enabled: true
  metrics:
    enabled: true
    retention: 30d
    storage_size: 100Gi

  logging:
    enabled: true
    stack: elk
    retention: 14d

  grafana:
    enabled: true

# ---------------------------------------------
# Autoscaling
# ---------------------------------------------
autoscaling:
  enabled: true

elasticsearch:
  enabled: true
  data:
    replicas: 2

dragonfly:
  enabled: true

temporal:
  enabled: true

coroot:
  enabled: true

tracing:
  enabled: true
  retention: 24h
  storage_size: 20Gi

postal:
  enabled: true

# ---------------------------------------------
# Backup
# ---------------------------------------------
backup:
  enabled: true
  schedule: "0 2 * * *"
  retention_days: 30
  disaster_recovery:
    enabled: true
    endpoint: ""      # REQUIRED external S3-compatible endpoint
    region: us-east-1
    bucket: ""        # REQUIRED external bucket
    prefix: k8s/velero
    schedule: "30 2 * * *"
    retention_hours: 720

# ---------------------------------------------
# GlitchTip (Sentry-compatible error tracking)
# ---------------------------------------------
glitchtip:
  enabled: true

# ---------------------------------------------
# APM Server (distributed tracing via Elasticsearch)
# ---------------------------------------------
apm:
  enabled: true    # Elastic APM; traces written to existing ES, 14d ILM retention

# ---------------------------------------------
# Blackbox Exporter (uptime/synthetic probes)
# ---------------------------------------------
blackbox:
  enabled: true    # Probes all public URLs + internal TCP every 60s

alerting:
  telegram:
    enabled: false
  email:
    enabled: true

compliance:
  hipaa:
    enabled: false
    log_redaction_enabled: true

applications:
  daytona:
    enabled: false
