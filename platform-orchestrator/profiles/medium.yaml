# ============================================
# MEDIUM TIER - standard full-platform footprint
# ============================================
# Best for: Small-medium traffic, teams
# Nodes: 5 x cx43 16Gi-class nodes (3 masters HA, 2 workers) + cx23 bastion + lb11
# HA: Yes (control plane)
# Storage: 4x100Gi object storage, 50Gi PostgreSQL, 100Gi metrics
# Costs vary with current Hetzner pricing, region, traffic, and backups/snapshots.
# ============================================

platform_profile: medium
tier: medium
resource_tier: medium
cost_estimate: "Provider-price dependent: 3 x cx43 control plane, 2 x cx43 worker, cx23 bastion, lb11"

global:
  project: k8s
  domain: ""          # REQUIRED: set your domain
  email: ""           # REQUIRED: set your email
  environment: production

# ---------------------------------------------
# Infrastructure
# ---------------------------------------------
infrastructure:
  provider: hetzner
  region: hel1

  control_plane:
    count: 3
    type: cx43
    schedulable: false

  workers:
    count: 2
    type: cx43

# ---------------------------------------------
# Network
# ---------------------------------------------
network:
  bastion:
    enabled: true
    server_type: cx23

  load_balancer:
    enabled: true
    type: lb11

  vpn:
    enabled: true

# ---------------------------------------------
# Kubernetes
# ---------------------------------------------
kubernetes:
  version: v1.35.6
  cni: cilium
  ha_control_plane: true

# ---------------------------------------------
# Storage
# ---------------------------------------------
storage:
  enabled: true
  mode: distributed
  replicas: 4
  size_per_replica: 100Gi

# ---------------------------------------------
# Secrets
# ---------------------------------------------
secrets:
  enabled: true
  vault:
    replicas: 3
    storage_size: 20Gi
  eso:
    enabled: true

# ---------------------------------------------
# Databases
# ---------------------------------------------
databases:
  enabled: true
  postgresql:
    enabled: true
    replicas: 2
    storage_size: 50Gi
  mongodb:
    enabled: true
    replicas: 3
    storage_size: 50Gi

# ---------------------------------------------
# GitLab
# ---------------------------------------------
gitlab:
  enabled: true
  webservice_replicas: 2
  sidekiq_replicas: 2
  runner:
    enabled: true
    concurrent_jobs: 10

# ---------------------------------------------
# GitOps
# ---------------------------------------------
gitops:
  enabled: true
  ha_enabled: true

# ---------------------------------------------
# Observability
# ---------------------------------------------
observability:
  enabled: true
  metrics:
    enabled: true
    retention: 30d
    storage_size: 100Gi

  logging:
    enabled: true
    stack: elk
    retention: 14d

  grafana:
    enabled: true

# ---------------------------------------------
# Autoscaling
# ---------------------------------------------
autoscaling:
  enabled: true

elasticsearch:
  enabled: true

dragonfly:
  enabled: true

temporal:
  enabled: true

coroot:
  enabled: true

tracing:
  enabled: true
  retention: 24h
  storage_size: 20Gi

postal:
  enabled: true

# ---------------------------------------------
# Backup
# ---------------------------------------------
backup:
  enabled: true
  schedule: "0 2 * * *"
  retention_days: 30

# ---------------------------------------------
# GlitchTip (Sentry-compatible error tracking)
# ---------------------------------------------
glitchtip:
  enabled: true

# ---------------------------------------------
# APM Server (distributed tracing via Elasticsearch)
# ---------------------------------------------
apm:
  enabled: true    # Elastic APM; traces written to existing ES, 14d ILM retention

# ---------------------------------------------
# Blackbox Exporter (uptime/synthetic probes)
# ---------------------------------------------
blackbox:
  enabled: true    # Probes all public URLs + internal TCP every 60s

alerting:
  telegram:
    enabled: false
  email:
    enabled: true

compliance:
  hipaa:
    enabled: false
    log_redaction_enabled: true

applications:
  daytona:
    enabled: false
