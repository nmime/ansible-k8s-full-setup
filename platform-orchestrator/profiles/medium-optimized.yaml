# ============================================
# MEDIUM-OPTIMIZED PROFILE - full medium toolset, small resource envelope
# ============================================
# Best for: Full platform toolset on a constrained CX23/CX33 budget shape
# Nodes: 3 x cx23 control plane + 4 x cx33 workers + 1 x cx23 bastion + lb11
# HA: Critical quorum services remain replicated; recoverable stateless
# services use one replica and conservative autoscaling limits. Control planes
# are schedulable, so resource requests/limits are mandatory for every component.
# ============================================

platform_profile: medium-optimized
tier: medium
resource_tier: small
cost_estimate: "Provider-price dependent: 3 x cx23 control plane, 4 x cx33 worker, cx23 bastion, lb11"

global:
  project: k8s
  domain: ""          # REQUIRED: set your domain
  email: ""           # REQUIRED: set your email
  environment: production

# ---------------------------------------------
# Hetzner infrastructure overrides
# ---------------------------------------------
hetzner_tier_specs:
  medium:
    cp_count: 3
    cp_min_cores: 2
    cp_min_memory: 4
    cp_schedulable: true
    worker_count: 4
    worker_min_cores: 4
    worker_min_memory: 8
    lb_enabled: true

# Kept for readability and UI-oriented config consumers.
infrastructure:
  provider: hetzner
  region: hel1
  control_plane:
    count: 3
    type: cx23
    schedulable: true
  workers:
    count: 4
    type: cx33

# ---------------------------------------------
# Network
# ---------------------------------------------
network:
  bastion:
    enabled: true
    server_type: cx23

  load_balancer:
    enabled: true
    type: lb11

  vpn:
    enabled: true

# ---------------------------------------------
# Kubernetes
# ---------------------------------------------
kubernetes:
  version: v1.35.6
  cni: cilium
  ha_control_plane: true
  features:
    gateway_api: true
    hubble: true
    encryption: true
    network_policies: true

# ---------------------------------------------
# Storage
# ---------------------------------------------
storage:
  enabled: true
  mode: distributed
  master_replicas: 3
  volume_replicas: 3
  filer_replicas: 1
  master_size: 2Gi
  size_per_replica: 40Gi
  index_size: 2Gi
  filer_size: 5Gi

# ---------------------------------------------
# Secrets
# ---------------------------------------------
secrets:
  enabled: true
  vault:
    replicas: 3
    storage_size: 10Gi
  eso:
    enabled: true
    replicas: 1

# ---------------------------------------------
# Databases
# ---------------------------------------------
databases:
  enabled: true
  postgresql:
    enabled: true
    replicas: 3
    proxy_replicas: 1
    storage_size: 30Gi
  mongodb:
    enabled: true
    replicas: 3
    storage_size: 20Gi

# ---------------------------------------------
# GitLab
# ---------------------------------------------
gitlab:
  enabled: true
  mode: light
  webservice_replicas: 1
  webservice_max_replicas: 2
  worker_processes: 2
  sidekiq_replicas: 1
  sidekiq_max_replicas: 2
  registry_max_replicas: 2
  gitaly_storage_size: 30Gi
  backup_persistence_size: 20Gi
  runner:
    enabled: true
    concurrent_jobs: 4

# ---------------------------------------------
# GitOps
# ---------------------------------------------
gitops:
  enabled: true
  ha_enabled: false
  server_replicas: 1
  repo_replicas: 1
  controller_replicas: 1

# ---------------------------------------------
# Observability
# ---------------------------------------------
observability:
  enabled: true
  metrics:
    enabled: true
    retention: 14d
    storage_size: 40Gi
    replicas: 1

  logging:
    enabled: true
    stack: elk
    retention: 7d

  grafana:
    enabled: true
    replicas: 1

# ---------------------------------------------
# Search and analytics (three low-footprint masters retain quorum)
# ---------------------------------------------
elasticsearch:
  enabled: true
  master:
    replicas: 3
    cpu_request: 100m
    cpu_limit: 500m
    memory_request: 1Gi
    memory_limit: 2Gi
    heap: 512m
    storage_size: 10Gi
  data:
    replicas: 1
    cpu_request: 250m
    cpu_limit: 1000m
    memory_request: 1536Mi
    memory_limit: 2Gi
    heap: 1g
    storage_size: 40Gi
  kibana:
    replicas: 1
    cpu_request: 100m
    cpu_limit: 250m
    memory_request: 384Mi
    memory_limit: 768Mi

# ---------------------------------------------
# Autoscaling
# ---------------------------------------------
autoscaling:
  enabled: true
  replicas: 1
  defaults:
    min_replicas: 1
    max_replicas: 4

# ---------------------------------------------
# Backup
# ---------------------------------------------
backup:
  enabled: true
  schedule: "0 2 * * *"
  retention_days: 30
  disaster_recovery:
    enabled: true
    endpoint: ""      # REQUIRED external S3-compatible endpoint
    region: us-east-1
    bucket: ""        # REQUIRED external bucket
    prefix: k8s/velero
    schedule: "30 2 * * *"
    retention_hours: 720
  job_resources:
    cpu_request: 50m
    cpu_limit: 250m
    memory_request: 96Mi
    memory_limit: 256Mi
  include:
    - databases
    - gitlab
    - secrets
    - object-storage

# ---------------------------------------------
# Cache, workflows, mail, tracing, probes
# ---------------------------------------------
dragonfly:
  enabled: true
  replicas: 1
  cpu_request: 100m
  cpu_limit: 500m
  memory_request: 256Mi
  memory_limit: 512Mi
  snapshot_storage: 10Gi

temporal:
  enabled: true
  history_shards: 128
  frontend_replicas: 1
  history_replicas: 1
  matching_replicas: 1
  worker_replicas: 1
  web_replicas: 1

postal:
  enabled: true
  web_replicas: 1
  smtp_replicas: 1
  worker_replicas: 1
  mariadb_storage: 20Gi
  mariadb_memory: 1Gi

coroot:
  enabled: true
  storage_size: 10Gi
  metrics_refresh_interval: 15s
  cache_ttl: 14d
  logs_ttl: 7d
  traces_ttl: 24h
  profiles_ttl: 24h
  resources:
    cpu_request: 100m
    cpu_limit: 500m
    memory_request: 512Mi
    memory_limit: 1Gi
  clickhouse:
    storage_size: 20Gi
    resources:
      cpu_request: 250m
      cpu_limit: "1"
      memory_request: 512Mi
      memory_limit: 2Gi
  node_agent:
    resources:
      cpu_request: 100m
      cpu_limit: 500m
      memory_request: 200Mi
      memory_limit: 1Gi
  cluster_agent:
    resources:
      cpu_request: 100m
      cpu_limit: 500m
      memory_request: 200Mi
      memory_limit: 1Gi

tracing:
  enabled: true
  retention: 24h
  storage_size: 10Gi

glitchtip:
  enabled: true
  web_replicas: 1
  worker_enabled: false
  worker_replicas: 1
  events_retention_days: 30

apm:
  enabled: true
  replicas: 1
  cpu_request: 100m
  cpu_limit: 750m
  memory_request: 384Mi
  memory_limit: 768Mi
  ilm_hot_max_size: 10gb
  ilm_hot_max_age: 3d
  ilm_delete_after: 7d

blackbox:
  enabled: true
  replicas: 1
  cpu_request: 25m
  cpu_limit: 200m
  memory_request: 48Mi
  memory_limit: 128Mi

alerting:
  telegram:
    enabled: false
  email:
    enabled: true

compliance:
  hipaa:
    enabled: false
    log_redaction_enabled: true

applications:
  daytona:
    enabled: false
