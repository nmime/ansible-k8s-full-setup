# ============================================
# MEDIUM-OPTIMIZED TIER - €55.92/mo server compute, ~€61.92/mo with lb11
# ============================================
# Best for: Full platform tool set on the current CX23/CX33 budget shape
# Nodes: 3 x cx23 control plane + 4 x cx33 workers + 1 x cx23 bastion + lb11
# HA: Control plane HA, medium-tier platform behavior
# Tradeoff: control planes are schedulable to reuse CPU/RAM. For stricter
# production isolation, set cp_schedulable=false and worker_count=5 (+€8.49/mo).
# ============================================

tier: medium
cost_estimate: "€55.92/mo server compute; ~€61.92/mo with lb11"

global:
  project: k8s
  domain: ""          # REQUIRED: set your domain
  email: ""           # REQUIRED: set your email
  environment: production

# ---------------------------------------------
# Hetzner infrastructure overrides
# ---------------------------------------------
hetzner_region: hel1
hetzner_bastion_type: cx23
hetzner_cp_type: cx23
hetzner_worker_type: cx33

hetzner_tier_specs:
  medium:
    cp_count: 3
    cp_min_cores: 2
    cp_min_memory: 4
    cp_schedulable: true
    worker_count: 4
    worker_min_cores: 4
    worker_min_memory: 8
    lb_enabled: true

# Kept for readability and UI-oriented config consumers.
infrastructure:
  provider: hetzner
  region: hel1
  control_plane:
    count: 3
    type: cx23
    schedulable: true
  workers:
    count: 4
    type: cx33

# ---------------------------------------------
# Network
# ---------------------------------------------
network:
  bastion:
    enabled: true
    server_type: cx23

  load_balancer:
    enabled: true
    type: lb11

  vpn:
    enabled: true

# ---------------------------------------------
# Kubernetes
# ---------------------------------------------
kubernetes:
  version: v1.35.6
  cni: cilium
  ha_control_plane: true
  features:
    gateway_api: true
    hubble: true
    encryption: true
    network_policies: true

# ---------------------------------------------
# Storage
# ---------------------------------------------
object_storage_enabled: true
object_storage_replicas: 3
object_storage_volume_size: 80Gi

storage:
  enabled: true
  mode: distributed
  replicas: 3
  size_per_replica: 80Gi

# ---------------------------------------------
# Secrets
# ---------------------------------------------
vault_storage_size: 20Gi
eso_enabled: true

secrets:
  enabled: true
  vault:
    replicas: 3
    storage_size: 20Gi
  eso:
    enabled: true

# ---------------------------------------------
# Databases
# ---------------------------------------------
postgresql_storage: 50Gi
mongodb_storage: 30Gi

databases:
  postgresql:
    enabled: true
    replicas: 3
    storage_size: 50Gi
  mongodb:
    enabled: true
    replicas: 3
    storage_size: 30Gi

# ---------------------------------------------
# GitLab
# ---------------------------------------------
gitlab_runner_concurrent_jobs: 4

gitlab:
  enabled: true
  webservice_replicas: 1
  sidekiq_replicas: 1
  runner:
    enabled: true
    concurrent_jobs: 4

# ---------------------------------------------
# GitOps
# ---------------------------------------------
gitops:
  enabled: true
  ha_enabled: true

# ---------------------------------------------
# Observability
# ---------------------------------------------
log_stack: elk
metrics_retention: 14d
metrics_storage: 60Gi
logging_retention: 7d

observability:
  metrics:
    enabled: true
    retention: 14d
    storage_size: 60Gi

  logging:
    enabled: true
    retention: 7d

  grafana:
    enabled: true

# ---------------------------------------------
# Autoscaling
# ---------------------------------------------
autoscaling:
  enabled: true

# ---------------------------------------------
# Backup
# ---------------------------------------------
backup:
  enabled: true
  schedule: "0 2 * * *"
  retention_days: 30
  include:
    - databases
    - gitlab
    - secrets
    - object-storage

backup_schedule: "0 2 * * *"
backup_retention_days: 30

# ---------------------------------------------
# Cache, workflows, mail, tracing, probes
# ---------------------------------------------
dragonfly_replicas: 1
dragonfly_snapshot_storage: 10Gi
postal_smtp_replicas: 1
postal_worker_replicas: 1
apm_replicas: 1
glitchtip_web_replicas: 1
glitchtip_worker_replicas: 1

deploy_glitchtip: true
deploy_apm: true
deploy_blackbox: true

glitchtip:
  enabled: true

apm:
  enabled: true

blackbox:
  enabled: true
