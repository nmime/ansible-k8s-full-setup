# ============================================
# MEDIUM-OPTIMIZED PROFILE - medium foundation, small resource envelope
# ============================================
# Best for: Medium base platform on a constrained current-generation x86 shape
# Nodes: 3 x cx33 control plane + 3 x cx43 application workers
#        + 2 isolated CI workers + 1 x cx33 mail worker + 1 x cpx22 bastion + lb11
# HA: Critical quorum services remain replicated; recoverable stateless
# services use one replica and conservative autoscaling limits. Control planes
# are schedulable, so resource requests/limits are mandatory for every component.
# ============================================

platform_profile: medium-optimized
tier: medium
resource_tier: small
cost_estimate: >-
  Current balanced tariff: 3 x cx33 control plane, 3 x cx43 application
  workers, one isolated cpx32 Docker worker, one isolated cpx42 general/image
  worker, one cx33 mail worker, cpx22 bastion, lb11, one bastion IPv4, 300 GiB active
  replication-qualified local claims, and 250 GiB provider-billable persistent
  volumes. GitLab backup staging is transient node-local scratch. See
  docs/COST_MODEL.md.

global:
  project: k8s
  domain: ""          # REQUIRED: set your domain
  email: ""           # REQUIRED: set your email
  environment: production

# ---------------------------------------------
# Hetzner infrastructure overrides
# ---------------------------------------------
hetzner_tier_specs:
  medium:
    cp_count: 3
    cp_min_cores: 4
    cp_min_memory: 8
    cp_schedulable: true
    worker_count: 6
    worker_min_cores: 4
    worker_min_memory: 8
    lb_enabled: true

# Kept for readability and UI-oriented config consumers.
infrastructure:
  provider: hetzner
  region: hel1
  control_plane:
    count: 3
    type: cx33
    schedulable: true
  workers:
    count: 6
    type: cx43
    type_overrides:
      4: cpx32
      5: cpx42
      6: cx33

# ---------------------------------------------
# Network
# ---------------------------------------------
network:
  ssh_source_ips: []
  bastion:
    enabled: true
    server_type: cpx22

  load_balancer:
    enabled: true
    type: lb11

  vpn:
    enabled: true

# ---------------------------------------------
# Kubernetes
# ---------------------------------------------
kubernetes:
  version: v1.35.4
  cni: cilium
  ha_control_plane: true
  features:
    gateway_api: true
    hubble: true
    encryption: true
    network_policies: true

# ---------------------------------------------
# Storage
# ---------------------------------------------
local_storage:
  enabled: true
  storage_class: platform-local
  path: /var/lib/platform-local-storage
  # Every Kubernetes node must retain this much free root-disk capacity before
  # local provisioning is enabled. Monitoring and application replication
  # remain mandatory because local PVs cannot move with a failed node.
  min_free_gib_per_node: 40

storage:
  enabled: true
  mode: distributed
  storage_class: hcloud-volumes
  master_storage_class: platform-local
  volume_storage_class: platform-local
  index_storage_class: platform-local
  filer_storage_class: hcloud-volumes
  master_replicas: 3
  volume_replicas: 3
  replication_placement: "001"
  filer_replicas: 1
  master_size: 2Gi
  size_per_replica: 40Gi
  index_size: 2Gi
  index_persistent: true
  filer_size: 5Gi
  filer_resources:
    cpu_request: 100m
    cpu_limit: "1"
    memory_request: 512Mi
    memory_limit: 2Gi

# ---------------------------------------------
# Secrets
# ---------------------------------------------
secrets:
  enabled: true
  vault:
    replicas: 3
    storage_size: 10Gi
    data_storage_class: platform-local
    audit_storage_class: hcloud-volumes
  eso:
    enabled: true
    replicas: 1

# ---------------------------------------------
# Databases
# ---------------------------------------------
databases:
  enabled: true
  postgresql:
    enabled: true
    replicas: 3
    proxy_replicas: 2
    storage_size: 30Gi
    data_storage_class: platform-local
    repo_storage_class: hcloud-volumes
    repo_storage_size: 10Gi
    service_alias: n0xeid-pg
    extra_users:
      - operator:
          name: metabase
          databases: [metabase]
          grantPublicSchemaAccess: true
        target_namespace: analytics
        secret_name: metabase-postgresql
      - operator:
          name: dadya-prod
          databases: [dadya_prod]
          grantPublicSchemaAccess: true
        target_namespace: dadya-production
        secret_name: dadya-postgresql
      - operator:
          name: dadya-pp
          databases: [dadya_pp]
          grantPublicSchemaAccess: true
        target_namespace: dadya-preproduction
        secret_name: dadya-postgresql
      - operator:
          name: social-agents-owner
          databases: [social_agents]
          # Used only by the one-shot migration and role-bootstrap hooks. The
          # runtime API and worker use separate restricted login roles.
          options: BYPASSRLS CREATEROLE
          grantPublicSchemaAccess: true
        target_namespace: agents
        secret_name: social-agents-owner-postgresql
  mongodb:
    enabled: false
    service_alias: n0xeid-mongo
    replicas: 3
    storage_size: 20Gi
    data_storage_class: platform-local
    # A real 8M-document restore OOM-killed all three members at the generic
    # small-tier 1Gi limit. Keep a bounded 2Gi ceiling and reserve the majority
    # of it for index builders, connections, and non-WiredTiger allocations.
    wiredtiger_cache_size_ratio: 0.35
    resources:
      replset:
        requests: {cpu: 250m, memory: 512Mi}
        limits: {cpu: "1", memory: 2Gi}

# ---------------------------------------------
# GitLab
# ---------------------------------------------
gitlab:
  enabled: true
  mode: light
  # The canonical GitLab UI/API must be reachable at git.n0xeid.xyz for users,
  # webhooks, and external repository mirrors. Registration remains disabled,
  # while authentication and project/group ACLs enforce access.
  public_webservice_enabled: true
  webservice_replicas: 1
  webservice_max_replicas: 2
  worker_processes: 2
  # A live webservice reached about 1.96Gi. Reserve its measured working set and
  # allow bounded headroom without reverting the rest of this profile to the
  # normal medium resource envelope.
  webservice_memory_request: 2Gi
  webservice_memory_limit: 3Gi
  # Rails maintenance and backup commands exceeded the generic 1Gi toolbox
  # limit in a live cluster. Keep the steady reservation small while allowing
  # bounded burst memory for migrations and restores.
  toolbox_cpu_request: 100m
  toolbox_cpu_limit: "1.5"
  toolbox_memory_request: 512Mi
  toolbox_memory_limit: 3Gi
  sidekiq_replicas: 1
  sidekiq_max_replicas: 2
  registry_max_replicas: 2
  gitaly_storage_size: 30Gi
  # Registry compression and the final GitLab archive coexist temporarily.
  # Keep this off provider CSI: every backup is uploaded to object storage,
  # while the 40 GiB/node free-space gate protects local scratch headroom.
  backup_persistence_enabled: false
  backup_persistence_size: 30Gi
  runner:
    enabled: true
    replicas: 1
    # General and rootless image-build jobs share a private, tainted CI-build
    # worker. Two general jobs plus one protected image job fit the dedicated
    # cpx42 worker's 8 vCPU / 16 GiB envelope while keeping production-node
    # ephemeral storage isolated. Keep worker 5 at cpx42 or larger for
    # sustained production pipelines.
    concurrent_jobs: 2
    dedicated_worker_index: 5
    # Image builds need build-container-only Unconfined seccomp/AppArmor for
    # rootless BuildKit. Keep that narrow exception in a protected, tagged,
    # single-job runner rather than weakening the general CI runner.
    image_builder:
      enabled: true
      replicas: 1
      concurrent_jobs: 1
    # Backward-compatible docker-host tag without Docker access on bastion:
    # only the digest-pinned DinD service is privileged in its own namespace.
    docker_host:
      enabled: true
      replicas: 1
      concurrent_jobs: 1
      dedicated_worker_index: 4

# ---------------------------------------------
# GitOps
# ---------------------------------------------
gitops:
  enabled: true
  ha_enabled: false
  server_replicas: 1
  repo_replicas: 1
  controller_replicas: 1

# ---------------------------------------------
# Observability
# ---------------------------------------------
observability:
  enabled: true
  pmm:
    enabled: false
  metrics:
    enabled: true
    retention: 14d
    storage_size: 40Gi
    replicas: 1
    # A single vmstorage replica is intentional in this constrained profile.
    replication_factor: 1

  logging:
    enabled: true
    stack: loki
    deployment_mode: single-binary
    retention: 7d

  grafana:
    enabled: true
    replicas: 1

# ---------------------------------------------
# Search and analytics (three low-footprint masters retain quorum)
# ---------------------------------------------
elasticsearch:
  enabled: false
  master:
    replicas: 3
    storage_class: platform-local
    cpu_request: 100m
    cpu_limit: 500m
    memory_request: 1Gi
    memory_limit: 2Gi
    heap: 512m
    storage_size: 10Gi
  data:
    replicas: 2
    storage_class: platform-local
    cpu_request: 250m
    cpu_limit: 1000m
    memory_request: 1536Mi
    memory_limit: 2Gi
    heap: 1g
    storage_size: 40Gi
  kibana:
    replicas: 1
    cpu_request: 100m
    cpu_limit: 1000m
    memory_request: 512Mi
    memory_limit: 1Gi

# ---------------------------------------------
# Autoscaling
# ---------------------------------------------
autoscaling:
  enabled: true
  replicas: 1
  defaults:
    min_replicas: 1
    max_replicas: 4

# ---------------------------------------------
# Backup
# ---------------------------------------------
backup:
  enabled: true
  schedule: "0 2 * * *"
  retention_days: 30
  disaster_recovery:
    enabled: true
    endpoint: ""      # REQUIRED external S3-compatible endpoint
    region: us-east-1
    bucket: ""        # REQUIRED external bucket
    prefix: k8s/velero
    schedule: "30 2 * * *"
    retention_hours: 720
  job_resources:
    cpu_request: 50m
    cpu_limit: 250m
    memory_request: 96Mi
    memory_limit: 256Mi
  include:
    - databases
    - gitlab
    - secrets
    - object-storage

# ---------------------------------------------
# Cache, workflows, mail, tracing, probes
# ---------------------------------------------
dragonfly:
  enabled: true
  # GitLab and the games share this Redis-compatible control plane. Keep one
  # replica on each application worker so any single node can fail without
  # taking cache-backed sessions, queues, and CI orchestration down together.
  replicas: 3
  cpu_request: 100m
  cpu_limit: 500m
  memory_request: 256Mi
  memory_limit: 512Mi
  snapshot_storage: 10Gi

temporal:
  enabled: false
  history_shards: 128
  frontend_replicas: 1
  history_replicas: 1
  matching_replicas: 1
  worker_replicas: 1
  web_replicas: 1

postal:
  enabled: false
  # Keep inbound delivery explicit. These aliases are managed for every
  # configured Postal domain; arbitrary recipients remain rejected.
  inbound_accept_local_parts: [postmaster, abuse, admin, alerts, dmarc-reports]
  web_replicas: 1
  smtp_replicas: 1
  worker_replicas: 1
  mariadb_storage: 20Gi
  mariadb_memory: 1Gi

coroot:
  enabled: true
  storage_size: 10Gi
  metrics_refresh_interval: 15s
  cache_ttl: 3d
  logs_ttl: 24h
  traces_ttl: 24h
  profiles_ttl: 24h
  resources:
    cpu_request: 100m
    cpu_limit: 500m
    memory_request: 512Mi
    memory_limit: 1Gi
  clickhouse:
    storage_size: 20Gi
    resources:
      cpu_request: 250m
      cpu_limit: "1"
      memory_request: 512Mi
      memory_limit: 2Gi
  node_agent:
    resources:
      cpu_request: 100m
      cpu_limit: 500m
      memory_request: 384Mi
      memory_limit: 1Gi
  cluster_agent:
    resources:
      cpu_request: 100m
      cpu_limit: 500m
      memory_request: 200Mi
      memory_limit: 1Gi

tracing:
  enabled: true
  backend: coroot
  collector_replicas: 1
  tempo:
    enabled: false
  retention: 24h
  storage_size: 10Gi

glitchtip:
  enabled: false
  web_replicas: 1
  worker_enabled: false
  worker_replicas: 1
  events_retention_days: 30

umami:
  enabled: false
  replicas: 2
  hpa_min_replicas: 2
  hpa_max_replicas: 4

apm:
  enabled: false
  replicas: 1
  cpu_request: 100m
  cpu_limit: 750m
  memory_request: 384Mi
  memory_limit: 768Mi
  ilm_hot_max_size: 10gb
  ilm_hot_max_age: 3d
  ilm_delete_after: 7d

blackbox:
  enabled: true
  replicas: 1
  cpu_request: 25m
  cpu_limit: 200m
  memory_request: 48Mi
  memory_limit: 128Mi

alerting:
  replicas: 2
  telegram:
    enabled: false
  email:
    enabled: false

compliance:
  hipaa:
    enabled: false
    log_redaction_enabled: true

applications:
  daytona:
    enabled: false
