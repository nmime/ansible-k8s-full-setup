# ============================================
# PRODUCTION TIER - higher-availability platform footprint
# ============================================
# Best for: Full HA, medium-high traffic
# Nodes: 6+ x cx43 16Gi-class nodes (3 masters, 3+ workers) + cx23 bastion + lb11
# HA: Three-way control plane with higher stateless workload redundancy
# Storage: 4x150Gi object storage, 100Gi PostgreSQL, 150Gi metrics
# Costs vary with current Hetzner pricing, region, traffic, and backups/snapshots.
# ============================================

platform_profile: production
tier: production
resource_tier: production
cost_estimate: "Provider-price dependent: 3 x cx43 control plane, 3 x cx43 worker, cx23 bastion, lb11"

global:
  project: k8s
  domain: ""          # REQUIRED: set your domain
  email: ""           # REQUIRED: set your email
  environment: production

# ---------------------------------------------
# Infrastructure
# ---------------------------------------------
infrastructure:
  provider: hetzner
  region: hel1

  control_plane:
    count: 3
    type: cx43
    schedulable: false

  workers:
    count: 3
    type: cx43

# ---------------------------------------------
# Network
# ---------------------------------------------
network:
  bastion:
    enabled: true
    server_type: cx23

  load_balancer:
    enabled: true
    type: lb11

  vpn:
    enabled: true
    groups:
      admin: []
      dev: []
      readonly: []

# ---------------------------------------------
# Kubernetes
# ---------------------------------------------
kubernetes:
  version: v1.35.6
  cni: cilium
  ha_control_plane: true
  features:
    gateway_api: true
    hubble: true
    encryption: true
    network_policies: true

# ---------------------------------------------
# Storage
# ---------------------------------------------
storage:
  enabled: true
  mode: distributed
  replicas: 4
  size_per_replica: 150Gi

# ---------------------------------------------
# Secrets
# ---------------------------------------------
secrets:
  enabled: true
  vault:
    replicas: 3
    storage_size: 20Gi
  eso:
    enabled: true

# ---------------------------------------------
# Databases
# ---------------------------------------------
databases:
  enabled: true
  postgresql:
    enabled: true
    replicas: 3
    storage_size: 100Gi
  mongodb:
    enabled: true
    replicas: 3
    storage_size: 100Gi

# ---------------------------------------------
# GitLab
# ---------------------------------------------
gitlab:
  enabled: true
  webservice_replicas: 2
  sidekiq_replicas: 2
  gitaly_replicas: 1
  runner:
    enabled: true
    concurrent_jobs: 20

# ---------------------------------------------
# GitOps
# ---------------------------------------------
gitops:
  enabled: true
  ha_enabled: true

# ---------------------------------------------
# Observability
# ---------------------------------------------
observability:
  enabled: true
  metrics:
    enabled: true
    retention: 30d
    storage_size: 150Gi

  logging:
    enabled: true
    stack: elk
    retention: 14d

  grafana:
    enabled: true
    replicas: 2

# ---------------------------------------------
# Autoscaling
# ---------------------------------------------
autoscaling:
  enabled: true
  defaults:
    min_replicas: 2
    max_replicas: 20

elasticsearch:
  enabled: true

dragonfly:
  enabled: true

temporal:
  enabled: true

coroot:
  enabled: true

tracing:
  enabled: true
  retention: 72h
  storage_size: 40Gi

postal:
  enabled: true

# ---------------------------------------------
# Backup
# ---------------------------------------------
backup:
  enabled: true
  schedule: "0 2 * * *"
  retention_days: 30
  disaster_recovery:
    enabled: true
    endpoint: ""      # REQUIRED external S3-compatible endpoint; never in-cluster SeaweedFS
    region: us-east-1
    bucket: ""        # REQUIRED external bucket
    prefix: k8s/velero
    schedule: "30 2 * * *"
    retention_hours: 720
  include:
    - databases
    - gitlab
    - secrets
    - object-storage

# ---------------------------------------------
# GlitchTip (Sentry-compatible error tracking)
# ---------------------------------------------
glitchtip:
  enabled: true

# ---------------------------------------------
# APM Server (distributed tracing via Elasticsearch)
# ---------------------------------------------
apm:
  enabled: true    # Elastic APM; traces written to existing ES, 14d ILM retention

# ---------------------------------------------
# Blackbox Exporter (uptime/synthetic probes)
# ---------------------------------------------
blackbox:
  enabled: true    # Probes all public URLs + internal TCP every 60s

alerting:
  telegram:
    enabled: false
  email:
    enabled: true

compliance:
  hipaa:
    enabled: false
    log_redaction_enabled: true

applications:
  daytona:
    enabled: false
