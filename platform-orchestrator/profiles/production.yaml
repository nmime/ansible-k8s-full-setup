# ============================================
# PRODUCTION TIER - higher-availability platform footprint
# ============================================
# Best for: Selective critical HA with a small production resource envelope
# Nodes: 3 x cpx42 masters + 3 x cpx42 application workers
#        + 1 x cpx42 isolated CI worker + cpx22 bastion + lb11
# HA: Three-way control plane plus explicit quorum and selected workload replicas
# Recovery: Gitaly, Grafana, and Coroot retain intentional
# singleton boundaries and require backup-driven recovery. Elasticsearch data
# uses two replicas so one shard replica can remain assigned.
# Storage: resource-efficient HA defaults with online grow-only expansion
# Scheduling: application requests are deliberately sized to leave failover
# headroom on three 16Gi workers while the three control planes stay dedicated.
# Costs vary with current Hetzner pricing, region, traffic, and backups/snapshots.
# ============================================

platform_profile: production
tier: production
# Production capabilities and HA topology, with the same conservative request
# envelope used by medium-optimized. Critical replica counts are explicit below
# so reducing reservations never silently reduces availability.
resource_tier: small
cost_estimate: "Current balanced tariff: 3 x cpx42 control plane, 3 x cpx42 application workers, 1 x cpx42 isolated CI worker, cpx22 bastion, lb11"

global:
  project: k8s
  domain: ""          # REQUIRED: set your domain
  email: ""           # REQUIRED: set your email
  environment: production

# ---------------------------------------------
# Infrastructure
# ---------------------------------------------
infrastructure:
  provider: hetzner
  region: hel1

  control_plane:
    count: 3
    type: cpx42
    schedulable: false

  workers:
    count: 4
    type: cpx42

# ---------------------------------------------
# Network
# ---------------------------------------------
network:
  ssh_source_ips: []
  bastion:
    enabled: true
    server_type: cpx22

  load_balancer:
    enabled: true
    type: lb11

  vpn:
    enabled: true
    groups:
      admin: []
      dev: []
      readonly: []

# ---------------------------------------------
# Kubernetes
# ---------------------------------------------
kubernetes:
  version: v1.35.4
  cni: cilium
  ha_control_plane: true
  cert_manager_replicas: 3
  features:
    gateway_api: true
    hubble: true
    encryption: true
    network_policies: true

# ---------------------------------------------
# Storage
# ---------------------------------------------
storage:
  enabled: true
  mode: distributed
  master_replicas: 3
  # Three independent servers preserve the selected 001 replica placement;
  # capacity growth should increase size/quota before adding a fourth server.
  volume_replicas: 3
  filer_replicas: 2
  replication_placement: "001"
  size_per_replica: 100Gi

# ---------------------------------------------
# Secrets
# ---------------------------------------------
secrets:
  enabled: true
  vault:
    replicas: 3
    storage_size: 20Gi
  eso:
    enabled: true
    replicas: 2

# ---------------------------------------------
# Databases
# ---------------------------------------------
databases:
  enabled: true
  postgresql:
    enabled: true
    # Primary plus synchronous standby; Kubernetes control plane remains 3+3.
    replicas: 2
    proxy_replicas: 2
    storage_size: 50Gi
  mongodb:
    enabled: false
    replicas: 3
    storage_size: 20Gi

# ---------------------------------------------
# GitLab
# ---------------------------------------------
gitlab:
  enabled: true
  # Keep the full external-service architecture and redundant Rails pods. Live
  # testing observed about 1.96Gi per webservice pod, so reserve 2Gi and retain
  # a resource-efficient 3Gi safety ceiling on the 16Gi workers.
  mode: light
  webservice_replicas: 2
  webservice_max_replicas: 4
  sidekiq_replicas: 2
  sidekiq_max_replicas: 4
  registry_max_replicas: 3
  webservice_memory_request: 2Gi
  webservice_memory_limit: 3Gi
  sidekiq_memory_request: 768Mi
  kas_memory_request: 128Mi
  toolbox_memory_request: 192Mi
  gitaly_replicas: 1
  gitaly_storage_size: 50Gi
  runner:
    enabled: true
    # Four concurrent jobs preserve scheduling and burst headroom for the
    # platform control workloads on three 16Gi workers.
    concurrent_jobs: 4
    image_builder:
      enabled: true
      replicas: 1
      concurrent_jobs: 1
    docker_host:
      enabled: true
      replicas: 1
      concurrent_jobs: 1
      dedicated_worker_index: 4

# ---------------------------------------------
# GitOps
# ---------------------------------------------
gitops:
  enabled: true
  ha_enabled: true
  server_replicas: 2
  repo_replicas: 2
  controller_replicas: 2

# ---------------------------------------------
# Observability
# ---------------------------------------------
observability:
  enabled: true
  pmm:
    enabled: true
    storage_size: 50Gi
  metrics:
    enabled: true
    replicas: 2
    # vminsert writes every sample to both vmstorage replicas. This must remain
    # explicit because production deliberately uses the small request envelope.
    replication_factor: 2
    retention: 30d
    storage_size: 100Gi

  logging:
    enabled: true
    stack: elk
    retention: 14d

  grafana:
    enabled: true
    # One persistent instance is intentional: the bundled SQLite/RWO setup is
    # not safe for active-active replicas without an external Grafana database.
    replicas: 1

# ---------------------------------------------
# Autoscaling
# ---------------------------------------------
autoscaling:
  enabled: true
  replicas: 2
  defaults:
    min_replicas: 2
    max_replicas: 20

elasticsearch:
  enabled: true
  master:
    replicas: 3
    storage_size: 20Gi
    memory_request: 512Mi
    memory_limit: 1536Mi
    cpu_request: 250m
    cpu_limit: 1
    heap: 512m
  data:
    replicas: 2
    storage_size: 100Gi
    memory_request: 1Gi
    memory_limit: 2Gi
    cpu_request: 500m
    cpu_limit: 2
    heap: 1g
  kibana:
    replicas: 1
    memory_request: 256Mi
    memory_limit: 1Gi
    cpu_request: 100m

dragonfly:
  enabled: true
  replicas: 3
  snapshot_storage: 20Gi
  memory_request: 256Mi
  memory_limit: 768Mi
  cpu_request: 250m
  cpu_limit: 1

temporal:
  enabled: false
  history_replicas: 2
  matching_replicas: 2
  frontend_replicas: 2
  worker_replicas: 2
  frontend_memory_request: 256Mi
  frontend_memory_limit: 1Gi
  history_memory_request: 384Mi
  history_memory_limit: 1536Mi
  matching_memory_request: 192Mi
  matching_memory_limit: 768Mi
  worker_memory_request: 192Mi
  worker_memory_limit: 768Mi

coroot:
  enabled: true
  storage_size: 20Gi
  resources:
    cpu_request: 250m
    cpu_limit: 1
    memory_request: 512Mi
    memory_limit: 2Gi
  clickhouse:
    storage_size: 50Gi
    resources:
      cpu_request: 250m
      cpu_limit: 1
      memory_request: 384Mi
      memory_limit: 2Gi
  node_agent:
    resources:
      cpu_request: 50m
      cpu_limit: 500m
      memory_request: 256Mi
      memory_limit: 1Gi
  cluster_agent:
    resources:
      cpu_request: 50m
      cpu_limit: 500m
      memory_request: 128Mi
      memory_limit: 512Mi

tracing:
  enabled: true
  backend: tempo
  tempo:
    enabled: true
  collector_replicas: 2
  retention: 72h
  storage_size: 20Gi

postal:
  enabled: false
  web_replicas: 1
  smtp_replicas: 2
  worker_replicas: 2
  mariadb_storage: 20Gi
  mariadb_memory: 512Mi
  web_memory_request: 256Mi
  web_memory_limit: 1Gi
  web_cpu_request: 250m
  smtp_memory_request: 256Mi
  smtp_memory_limit: 1Gi
  smtp_cpu_request: 250m
  worker_memory_request: 256Mi
  worker_memory_limit: 1Gi
  worker_cpu_request: 250m

# ---------------------------------------------
# Backup
# ---------------------------------------------
backup:
  enabled: true
  schedule: "0 2 * * *"
  retention_days: 30
  disaster_recovery:
    enabled: true
    endpoint: ""      # REQUIRED external S3-compatible endpoint; never in-cluster SeaweedFS
    region: us-east-1
    bucket: ""        # REQUIRED external bucket
    prefix: k8s/velero
    schedule: "30 2 * * *"
    retention_hours: 720
  include:
    - databases
    - gitlab
    - secrets
    - object-storage

# ---------------------------------------------
# GlitchTip (Sentry-compatible error tracking)
# ---------------------------------------------
glitchtip:
  enabled: false
  web_replicas: 2
  web_memory_request: 256Mi
  web_memory_limit: 1Gi
  web_cpu_request: 150m
  worker_enabled: true
  worker_replicas: 2
  worker_memory_request: 192Mi
  worker_memory_limit: 768Mi
  worker_cpu_request: 100m

# ---------------------------------------------
# APM Server (distributed tracing via Elasticsearch)
# ---------------------------------------------
apm:
  enabled: true    # Elastic APM; traces written to existing ES, 14d ILM retention
  replicas: 2
  memory_request: 256Mi
  memory_limit: 1Gi
  cpu_request: 150m

# ---------------------------------------------
# Blackbox Exporter (uptime/synthetic probes)
# ---------------------------------------------
blackbox:
  enabled: true    # Probes all public URLs + internal TCP every 60s
  replicas: 2

alerting:
  replicas: 2
  vmalert_replicas: 2
  storage_size: 10Gi
  telegram:
    enabled: false
  email:
    enabled: false

compliance:
  hipaa:
    enabled: false
    log_redaction_enabled: true

applications:
  daytona:
    enabled: false
