# ============================================
# SMALL TIER - ~€21.96/mo server compute, ~€27.96/mo with lb11
# ============================================
# Best for: Startups, small teams, staging
# Kubernetes nodes: 3 (1 master, 2 workers)
# Extra servers: 1 cx23 bastion, 1 lb11 load balancer
# HA: No (single master)
# ============================================

tier: small
cost_estimate: "€21.96/mo server compute; ~€27.96/mo with lb11"

global:
  project: k8s
  domain: ""          # REQUIRED: set your domain
  email: ""           # REQUIRED: set your email
  environment: staging

# ---------------------------------------------
# Infrastructure
# ---------------------------------------------
infrastructure:
  provider: hetzner
  region: hel1

  control_plane:
    count: 1
    type: cx23
    schedulable: false

  workers:
    count: 2
    type: cx23

# ---------------------------------------------
# Network
# ---------------------------------------------
network:
  bastion:
    enabled: true
    server_type: cx23

  load_balancer:
    enabled: true
    type: lb11

  vpn:
    enabled: true

# ---------------------------------------------
# Kubernetes
# ---------------------------------------------
kubernetes:
  version: v1.35.4
  cni: cilium
  ha_control_plane: false

# ---------------------------------------------
# Storage
# ---------------------------------------------
storage:
  enabled: true
  mode: standalone
  replicas: 1
  size: 100Gi

# ---------------------------------------------
# Secrets
# ---------------------------------------------
secrets:
  enabled: true
  vault:
    replicas: 1
    storage_size: 20Gi

# ---------------------------------------------
# Databases
# ---------------------------------------------
databases:
  postgresql:
    enabled: true
    replicas: 1
    storage_size: 30Gi

# ---------------------------------------------
# GitLab
# ---------------------------------------------
gitlab:
  enabled: true
  webservice_replicas: 1
  sidekiq_replicas: 1
  runner:
    enabled: true
    concurrent_jobs: 5

# ---------------------------------------------
# GitOps
# ---------------------------------------------
gitops:
  enabled: true
  ha_enabled: false

# ---------------------------------------------
# Observability
# ---------------------------------------------
observability:
  metrics:
    enabled: true
    retention: 14d
    storage_size: 40Gi

  logging:
    enabled: true
    retention: 7d

  grafana:
    enabled: true

# ---------------------------------------------
# Autoscaling
# ---------------------------------------------
autoscaling:
  enabled: true

# ---------------------------------------------
# GlitchTip (Sentry-compatible error tracking)
# ---------------------------------------------
glitchtip:
  enabled: false

# ---------------------------------------------
# APM Server (distributed tracing via Elasticsearch)
# ---------------------------------------------
apm:
  enabled: false   # Requires Elasticsearch; off in small tiers for footprint

# ---------------------------------------------
# Blackbox Exporter (uptime/synthetic probes)
# ---------------------------------------------
blackbox:
  enabled: false   # Off by default in small tiers (saves ~50MB RAM)
