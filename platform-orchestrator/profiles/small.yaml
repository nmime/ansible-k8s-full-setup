# ============================================
# SMALL TIER - compact staging/startup footprint
# ============================================
# Best for: Startups, small teams, staging
# Kubernetes nodes: 3 (1 x cpx22 control plane, 2 x cpx32 workers)
# Extra servers: 1 cpx22 bastion, 1 lb11 load balancer
# HA: No (single master)
# ============================================

platform_profile: small
tier: small
resource_tier: small
cost_estimate: "Current balanced tariff: 1 x cpx22 control plane, 2 x cpx32 workers, cpx22 bastion, lb11"

global:
  project: k8s
  domain: ""          # REQUIRED: set your domain
  email: ""           # REQUIRED: set your email
  environment: staging

# ---------------------------------------------
# Infrastructure
# ---------------------------------------------
infrastructure:
  provider: hetzner
  region: hel1

  control_plane:
    count: 1
    type: cpx22
    schedulable: false

  workers:
    count: 2
    type: cpx32

# ---------------------------------------------
# Network
# ---------------------------------------------
network:
  ssh_source_ips: []
  bastion:
    enabled: true
    server_type: cpx22

  load_balancer:
    enabled: true
    type: lb11

  vpn:
    enabled: true

# ---------------------------------------------
# Kubernetes
# ---------------------------------------------
kubernetes:
  version: v1.35.4
  cni: cilium
  ha_control_plane: false

# ---------------------------------------------
# Storage
# ---------------------------------------------
storage:
  enabled: true
  mode: standalone
  replicas: 1
  replication_placement: "000"
  size: 100Gi

# ---------------------------------------------
# Secrets
# ---------------------------------------------
secrets:
  enabled: true
  vault:
    replicas: 1
    storage_size: 20Gi
  eso:
    enabled: false

# ---------------------------------------------
# Databases
# ---------------------------------------------
databases:
  enabled: true
  postgresql:
    enabled: true
    replicas: 1
    storage_size: 30Gi
  mongodb:
    enabled: false

# ---------------------------------------------
# GitLab
# ---------------------------------------------
gitlab:
  enabled: true
  webservice_replicas: 1
  sidekiq_replicas: 1
  runner:
    enabled: true
    concurrent_jobs: 5
    image_builder:
      enabled: false
      replicas: 1
      concurrent_jobs: 1
    docker_host:
      enabled: false
      replicas: 1
      concurrent_jobs: 1
      dedicated_worker_index: 0

# ---------------------------------------------
# GitOps
# ---------------------------------------------
gitops:
  enabled: true
  ha_enabled: false

# ---------------------------------------------
# Observability
# ---------------------------------------------
observability:
  enabled: true
  pmm:
    enabled: false
  metrics:
    enabled: true
    retention: 14d
    storage_size: 40Gi

  logging:
    enabled: true
    stack: loki
    retention: 7d

  grafana:
    enabled: true

# ---------------------------------------------
# Autoscaling
# ---------------------------------------------
autoscaling:
  enabled: true

# GitLab dependencies and medium-only platform services
elasticsearch:
  enabled: false

dragonfly:
  enabled: true
  replicas: 1

temporal:
  enabled: false

coroot:
  enabled: false

tracing:
  enabled: false
  backend: tempo
  tempo:
    enabled: false

postal:
  enabled: false

backup:
  enabled: false
  disaster_recovery:
    enabled: false
    endpoint: ""
    region: us-east-1
    bucket: ""
    prefix: k8s/velero
    schedule: "30 2 * * *"
    retention_hours: 720
  # Used by mandatory migration/DR gates even though scheduled backups are off.
  job_resources:
    cpu_request: 10m
    cpu_limit: 250m
    memory_request: 64Mi
    memory_limit: 256Mi

# ---------------------------------------------
# GlitchTip (Sentry-compatible error tracking)
# ---------------------------------------------
glitchtip:
  enabled: false

# ---------------------------------------------
# APM Server (distributed tracing via Elasticsearch)
# ---------------------------------------------
apm:
  enabled: false   # Requires Elasticsearch; off in small tiers for footprint

# ---------------------------------------------
# Blackbox Exporter (uptime/synthetic probes)
# ---------------------------------------------
blackbox:
  enabled: false   # Off by default in small tiers (saves ~50MB RAM)

alerting:
  telegram:
    enabled: false
  email:
    enabled: false

compliance:
  hipaa:
    enabled: false
    log_redaction_enabled: true

applications:
  daytona:
    enabled: false
