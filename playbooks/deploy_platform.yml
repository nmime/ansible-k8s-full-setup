---
- name: Deploy Kubernetes Platform
  hosts: localhost
  connection: local
  gather_facts: true
  any_errors_fatal: true
  environment:
    KUBECONFIG: "{{ lookup('env', 'HOME') }}/.kube/config"

  vars_files:
    - ../defaults/main.yml

  vars:
    tier: "{{ tier | default('medium') }}"
    project_name: "{{ project_name | default('k8s') }}"

  pre_tasks:
    - name: Check for persisted infrastructure facts
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/{{ project_name }}-infra-facts.yml"
      register: persisted_infra_facts
      tags: [always]

    - name: Load persisted infrastructure facts for component-only runs
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/{{ project_name }}-infra-facts.yml"
      when: persisted_infra_facts.stat.exists
      tags: [always]

    - name: Display deployment banner
      debug:
        msg:
          - "=========================================="
          - "  Ansible Kubernetes Platform Deployment"
          - "  Project: {{ project_name }}"
          - "  Profile: {{ platform_profile }}"
          - "  Capability tier: {{ tier }}"
          - "  Resource tier: {{ resource_tier }}"
          - "  Domain: {{ domain }}"
          - "=========================================="

    - name: Pre-flight check - domain is set
      assert:
        that:
          - domain is defined
          - domain | length > 0
          - domain != 'example.com'
        fail_msg: "domain is required. Set via -e domain=yourdomain.com or in inventory"

    - name: Pre-flight check - email is set
      assert:
        that:
          - email is defined
          - email | length > 0
          - email != 'admin@example.com'
        fail_msg: "email is required. Set via -e email=you@yourdomain.com or in inventory"

    - name: Pre-flight check - controller API tunnel port is isolated and valid
      ansible.builtin.assert:
        that:
          - (k8s_api_local_port | default(16443) | string) is match('^[0-9]+$')
          - k8s_api_local_port | default(16443) | int >= 1024
          - k8s_api_local_port | default(16443) | int <= 65535
        fail_msg: k8s_api_local_port must be an integer between 1024 and 65535.

    - name: Pre-flight check - platform domain belongs to managed DNS zone
      ansible.builtin.assert:
        that:
          - dns_preflight_zone | length > 0
          - >-
            dns_preflight_domain == dns_preflight_zone
            or dns_preflight_domain.endswith('.' + dns_preflight_zone)
        fail_msg: >-
          domain={{ domain }} must equal or be a subdomain of
          hetzner_dns_zone={{ dns_preflight_zone }}.
      vars:
        dns_preflight_domain: "{{ domain | lower | regex_replace('\\.$', '') }}"
        dns_preflight_zone: >-
          {{ hetzner_dns_zone | default(domain, true) | lower | regex_replace('\\.$', '') }}
      when: hetzner_manage_dns | default(true) | bool

    - name: Validate tier selection
      assert:
        that:
          - tier in ['minimal', 'small', 'medium', 'production']
        fail_msg: "Invalid tier '{{ tier }}'. Must be: minimal, small, medium, production"

    - name: Normalize the selected platform profile
      ansible.builtin.include_tasks:
        file: tasks/normalize_profile.yml
        apply:
          tags: [always]
      tags: [always]

    - name: Fail early when external disaster-recovery storage is incomplete
      ansible.builtin.assert:
        that:
          - backup_dr_storage_endpoint | length > 0
          - "'.svc' not in backup_dr_storage_endpoint"
          - "'seaweedfs' not in backup_dr_storage_endpoint"
          - backup_dr_storage_bucket | length > 2
          - backup_dr_storage_access_key | length >= 8
          - backup_dr_storage_secret_key | length >= 16
        fail_msg: >-
          This profile requires independent external disaster-recovery storage.
          Set backup.disaster_recovery endpoint/bucket and export
          BACKUP_DR_ACCESS_KEY/BACKUP_DR_SECRET_KEY before provisioning.
      when:
        - platform_backup_enabled | bool
        - backup_dr_enabled | bool
      tags: [always]

    - name: Pre-flight check - hcloud CLI installed
      ansible.builtin.command: hcloud version
      register: hcloud_check
      changed_when: false
      failed_when: false

    - name: Fail if hcloud CLI not found
      fail:
        msg: "hcloud CLI not found. Install: https://github.com/hetznercloud/cli/releases"
      when: hcloud_check.rc != 0

    - name: Pre-flight check - hcloud unified DNS commands are available
      ansible.builtin.command: hcloud zone --help
      register: hcloud_zone_check
      changed_when: false
      failed_when: false
      when: hetzner_manage_dns | default(true) | bool

    - name: Fail if hcloud CLI cannot manage unified DNS zones
      ansible.builtin.fail:
        msg: >-
          The installed hcloud CLI does not support `hcloud zone`, which is
          required for DNS reconciliation. Upgrade hcloud to v1.65.0 or newer,
          or explicitly set hetzner_manage_dns=false and manage DNS separately.
      when:
        - hetzner_manage_dns | default(true) | bool
        - hcloud_zone_check.rc | default(1) != 0

    - name: Pre-flight check - HCLOUD_TOKEN set
      assert:
        that:
          - lookup('env', 'HCLOUD_TOKEN') | length > 0
        fail_msg: "HCLOUD_TOKEN environment variable is required. Export it: export HCLOUD_TOKEN=your-token"

    - name: Pre-flight check - SSH key exists
      stat:
        path: "{{ ssh_key_path | default('~/.ssh/id_ed25519') }}"
      register: ssh_key_stat

    - name: Fail if SSH key not found
      fail:
        msg: "SSH key not found at {{ ssh_key_path | default('~/.ssh/id_ed25519') }}. Generate with: ssh-keygen -t ed25519"
      when: not ssh_key_stat.stat.exists

    - name: Pre-flight check - required Ansible collections
      ansible.builtin.command: ansible-galaxy collection list kubernetes.core
      register: k8s_collection_check
      changed_when: false
      failed_when: false

    - name: Fail if kubernetes.core collection missing
      fail:
        msg: "Required Ansible collection 'kubernetes.core' not found. Install: ansible-galaxy collection install -r requirements.yml"
      when: k8s_collection_check.rc != 0

  tasks:
    - name: Generate platform secrets
      ansible.builtin.import_role:
        name: generate-secrets
      tags: [always]

    - name: Deploy Hetzner Cloud Infrastructure
      ansible.builtin.import_role:
        name: hetzner-infra
      tags: [infrastructure, infra]

    - name: Deploy Network Security (VPN + Firewalls)
      ansible.builtin.import_role:
        name: network-security
      tags: [network, security]

    - name: Deploy Kubernetes Cluster
      ansible.builtin.import_role:
        name: k8s-cluster-management
      tags: [cluster, kubernetes]

    - name: Deploy Secrets Management (Vault + ESO)
      ansible.builtin.import_role:
        name: k8s-secrets
      when: platform_secrets_enabled | bool
      tags: [secrets, vault]

    - name: Deploy SeaweedFS Object Storage
      ansible.builtin.import_role:
        name: object-storage
      when: platform_object_storage_enabled | bool
      tags: [storage, object-storage, seaweedfs]

    - name: Deploy Elasticsearch with Basic license features
      ansible.builtin.import_role:
        name: elasticsearch
      when: platform_elasticsearch_enabled | bool
      tags: [elasticsearch, search]

    - name: Deploy Observability Stack (VictoriaMetrics + Loki + Grafana)
      ansible.builtin.import_role:
        name: k8s-observability
      when: platform_observability_enabled | bool
      tags: [observability, monitoring, coroot]

    - name: Configure bastion log shipping with Elasticsearch CA verification
      ansible.builtin.include_role:
        name: network-security
        tasks_from: filebeat
      when:
        - platform_elasticsearch_enabled | bool
        - bastion_log_shipping | bool
      tags: [elasticsearch, observability, filebeat]

    - name: Deploy Databases (PostgreSQL + MongoDB)
      ansible.builtin.import_role:
        name: k8s-databases
      when:
        - platform_databases_enabled | bool
        - platform_postgresql_enabled | bool or platform_mongodb_enabled | bool
      tags: [databases, postgresql, mongodb]

    - name: Deploy Dragonfly (external Redis-compatible service)
      ansible.builtin.import_role:
        name: dragonfly
      when: platform_dragonfly_enabled | bool
      tags: [dragonfly, cache]

    - name: Deploy GitLab CE Self-Hosted
      ansible.builtin.import_role:
        name: gitlab-selfhosted
      when: platform_gitlab_enabled | bool
      tags: [gitlab, cicd]

    - name: Deploy ArgoCD GitOps
      ansible.builtin.import_role:
        name: k8s-gitops
      when: platform_gitops_enabled | bool
      tags: [gitops, argocd]

    - name: Deploy KEDA Event-Driven Autoscaling
      ansible.builtin.import_role:
        name: k8s-autoscaling
      when: platform_autoscaling_enabled | bool
      tags: [autoscaling, keda]

    - name: Deploy Temporal Workflow Engine
      ansible.builtin.import_role:
        name: temporal
      when: platform_temporal_enabled | bool
      tags: [temporal, workflows]

    - name: Deploy Postal Mail Server
      ansible.builtin.import_role:
        name: postal
      when: platform_postal_enabled | bool
      tags: [postal, mail]

    - name: Deploy APM Server (Elastic APM / OTLP tracing backend)
      ansible.builtin.import_role:
        name: apm-server
      when: deploy_apm | default(false) | bool
      tags: [apm, tracing, observability]

    - name: Deploy Blackbox Exporter (uptime/synthetic probes)
      ansible.builtin.import_role:
        name: blackbox-exporter
      when: deploy_blackbox | default(true) | bool
      tags: [blackbox, uptime, observability]

    - name: Deploy GlitchTip Error Tracking
      ansible.builtin.import_role:
        name: glitchtip
      when: deploy_glitchtip | default(false) | bool
      tags: [glitchtip, monitoring, error-tracking]

    - name: Deploy Daytona workspace platform
      ansible.builtin.import_role:
        name: daytona-deployment
      when: deploy_daytona | default(daytona_enabled | default(false)) | bool
      tags: [daytona, workspaces, application]

  post_tasks:
    - name: Deploy backup and restore automation
      ansible.builtin.import_role:
        name: backup-restore
      when: platform_backup_enabled | bool
      tags: [backup, backup-setup]

    - name: Apply HIPAA-oriented hardening assertions and reporting
      ansible.builtin.import_role:
        name: hipaa-hardening
      when: platform_hipaa_enabled | bool
      tags: [hipaa, security, compliance]

    - name: Display deployment completion summary
      debug:
        msg:
          - "=========================================="
          - "  Platform Deployment Complete"
          - "  Profile: {{ platform_profile }}"
          - "  Capability tier: {{ tier }}"
          - "  Resource tier: {{ resource_tier }}"
          - "  Project: {{ project_name }}"
          - "  Domain: {{ domain }}"
          - "=========================================="
          - "Services deployed:"
          - "  - Kubernetes Cluster with Cilium CNI"
          - "{{ '  - GitLab CE: https://gitlab.' + domain if platform_gitlab_enabled | bool else '' }}"
          - "{{ '  - ArgoCD: https://argocd.' + domain if platform_gitops_enabled | bool else '' }}"
          - "{{ '  - Observability: VictoriaMetrics, Grafana, ' + (log_stack | upper) if platform_observability_enabled | bool else '' }}"
          - "{{ '  - Coroot (VPN-only): https://coroot.' + domain if platform_coroot_enabled | bool else '' }}"
          - "{{ '  - SeaweedFS S3: https://s3.' + domain if platform_object_storage_enabled | bool else '' }}"
          - "{{ '  - Vault: https://vault.' + domain if platform_secrets_enabled | bool else '' }}"
          - "{{ '  - PostgreSQL' if platform_postgresql_enabled | bool else '' }}"
          - "{{ '  - MongoDB' if platform_mongodb_enabled | bool else '' }}"
          - "{{ '  - KEDA (Event Autoscaling)' if platform_autoscaling_enabled | bool else '' }}"
          - "{{ '  - Dragonfly (external Redis-compatible service)' if platform_dragonfly_enabled | bool else '' }}"
          - "{{ '  - Temporal: https://temporal.' + domain if platform_temporal_enabled | bool else '' }}"
          - "{{ '  - Elasticsearch: https://kibana.' + domain if platform_elasticsearch_enabled | bool else '' }}"
          - "{{ '  - Postal: https://mail.' + domain if platform_postal_enabled | bool else '' }}"
          - "{{ '  - Daytona: https://' + daytona_base_domain if deploy_daytona | default(false) | bool else '' }}"
          - "{{ '  - APM Server (tracing): http://apm-server.elasticsearch.svc.cluster.local:8200' if deploy_apm | default(false) | bool else '' }}"
          - "{{ '  - Blackbox Probes: active on public URLs' if deploy_blackbox | default(true) | bool else '' }}"
          - "  - Alertmanager (VPN-only): https://alertmanager.{{ domain }}"
          - "  - Headscale VPN"
          - ""
          - "Get credentials:"
          - "  ./platform-orchestrator/platform.sh credentials"
          - "=========================================="
