---
- name: Adopt fail-closed live Postal SMTP credentials into encrypted state
  hosts: localhost
  connection: local
  gather_facts: false
  any_errors_fatal: true
  vars_files:
    - ../defaults/main.yml
  vars:
    postal_adoption_confirmed: false
    postal_adoption_secrets_file: "{{ platform_secrets_file }}"
  tasks:
    - name: Require explicit live-credential adoption confirmation
      ansible.builtin.assert:
        that:
          - postal_adoption_confirmed | bool
          - postal_adoption_secrets_file | length > 0
          - vault_password_file | length > 0
        fail_msg: >-
          Set postal_adoption_confirmed=true, platform_secrets_file, and
          vault_password_file. This recovery operation changes encrypted
          desired state to match the existing Postal database; it never
          rotates the database.

    - name: Load the existing encrypted platform secret state
      ansible.builtin.include_vars:
        file: "{{ postal_adoption_secrets_file }}"
        name: postal_adoption_saved_secrets
      no_log: true

    - name: Read SMTP credentials from the live Postal database
      ansible.builtin.command:
        argv:
          - kubectl
          - exec
          - -n
          - "{{ postal.namespace | default('postal') }}"
          - deployment/postal-web
          - --
          - bundle
          - exec
          - rails
          - runner
          - >-
            require "json";
            server = Server.find_by!(permalink: {{ postal.server_permalink | default('transactional') | to_json }});
            puts JSON.generate(server.credentials.where(type: "SMTP").pluck(:name, :key).to_h)
      register: postal_adoption_live_raw
      changed_when: false
      no_log: true

    - name: Normalize and validate the live SMTP credential set
      ansible.builtin.set_fact:
        postal_adoption_live_credentials: "{{ postal_adoption_live_raw.stdout | from_json }}"
        postal_adoption_expected_clients: >-
          {{
            postal.smtp_clients | default([
              'platform-applications', 'alertmanager', 'argocd', 'gitlab',
              'grafana', 'metabase'
            ])
          }}
      no_log: true

    - name: Refuse partial or malformed live credential adoption
      ansible.builtin.assert:
        that:
          - postal_adoption_live_credentials.keys() | list | sort == postal_adoption_expected_clients | sort
          - >-
            postal_adoption_live_credentials.values() |
            reject('match', '^.{24,}$') | list | length == 0
        fail_msg: >-
          The live Postal database credential set does not exactly match the
          profile client list or contains a short credential. Encrypted state
          was not changed.
      no_log: true

    - name: Create secure adoption staging directory
      ansible.builtin.tempfile:
        state: directory
        prefix: postal-live-adoption-
      register: postal_adoption_stage

    - name: Check for the original encrypted pre-adoption rollback state
      ansible.builtin.stat:
        path: "{{ postal_adoption_secrets_file }}.pre-postal-live-adoption"
      register: postal_adoption_rollback_state

    - name: Adopt live credentials with encrypted rollback copy
      block:
        - name: Build the adopted secret document in secure staging
          ansible.builtin.copy:
            dest: "{{ postal_adoption_stage.path }}/platform-secrets.yml"
            mode: '0600'
            content: >-
              {{
                postal_adoption_saved_secrets |
                combine({'postal_smtp_credentials': postal_adoption_live_credentials}) |
                to_nice_yaml
              }}
          no_log: true

        - name: Encrypt the adopted secret document
          ansible.builtin.command:
            argv:
              - ansible-vault
              - encrypt
              - --encrypt-vault-id
              - default
              - --vault-password-file
              - "{{ vault_password_file }}"
              - --output
              - "{{ postal_adoption_stage.path }}/platform-secrets.vault.yml"
              - "{{ postal_adoption_stage.path }}/platform-secrets.yml"
          changed_when: true
          no_log: true

        - name: Preserve encrypted pre-adoption rollback state
          ansible.builtin.copy:
            src: "{{ postal_adoption_secrets_file }}"
            dest: "{{ postal_adoption_secrets_file }}.pre-postal-live-adoption"
            remote_src: true
            mode: '0600'
          when: not postal_adoption_rollback_state.stat.exists
          no_log: true

        - name: Atomically install adopted encrypted state
          ansible.builtin.command:
            argv:
              - mv
              - "{{ postal_adoption_stage.path }}/platform-secrets.vault.yml"
              - "{{ postal_adoption_secrets_file }}"
          changed_when: true
          no_log: true

      always:
        - name: Remove all plaintext and staged adoption material
          ansible.builtin.file:
            path: "{{ postal_adoption_stage.path }}"
            state: absent
          no_log: true

    - name: Re-read adopted encrypted state
      ansible.builtin.include_vars:
        file: "{{ postal_adoption_secrets_file }}"
        name: postal_adoption_verified_secrets
      no_log: true

    - name: Verify encrypted state exactly matches the live database
      ansible.builtin.assert:
        that:
          - postal_adoption_verified_secrets.postal_smtp_credentials == postal_adoption_live_credentials
        fail_msg: Adopted encrypted Postal SMTP credentials failed round-trip verification.
      no_log: true

    - name: Report successful fail-closed adoption
      ansible.builtin.debug:
        msg:
          - "Adopted {{ postal_adoption_live_credentials | length }} live Postal SMTP credentials without database rotation."
          - "Encrypted rollback: {{ postal_adoption_secrets_file }}.pre-postal-live-adoption"
