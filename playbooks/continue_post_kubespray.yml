---
- name: Continue Platform Deployment (Post-Kubespray)
  hosts: localhost
  connection: local
  gather_facts: true
  any_errors_fatal: true
  environment:
    KUBECONFIG: "{{ lookup('env', 'HOME') }}/.kube/config"

  vars_files:
    - ../defaults/main.yml

  vars:
    tier: "{{ tier | default('minimal') }}"
    project_name: "{{ project_name | default('k8s') }}"

  pre_tasks:
    - name: Load infrastructure facts
      include_vars:
        file: "{{ playbook_dir }}/{{ project_name }}-infra-facts.yml"

    - name: Normalize the selected platform profile
      ansible.builtin.include_tasks: tasks/normalize_profile.yml

    - name: Generate platform secrets
      ansible.builtin.import_role:
        name: generate-secrets

    - name: Ensure SSH tunnel to k8s API is active
      ansible.builtin.shell: |
        if ! ss -tlnp | grep -q ':6443'; then
          nohup ssh -o StrictHostKeyChecking=accept-new -N -L 6443:{{ first_master_ip }}:6443 root@{{ bastion_public_ip }} > /dev/null 2>&1 &
          sleep 2
        fi
        sed -i 's|https://{{ first_master_ip }}:6443|https://127.0.0.1:6443|g' $HOME/.kube/config
        KUBECONFIG=$HOME/.kube/config kubectl get nodes
      args:
        executable: /bin/bash
      changed_when: false

  tasks:
    - name: Deploy Kubernetes Cluster (post-kubespray)
      ansible.builtin.import_role:
        name: k8s-cluster-management

    - name: Deploy Secrets Management (Vault + ESO)
      ansible.builtin.import_role:
        name: k8s-secrets
      when: platform_secrets_enabled | bool

    - name: Deploy SeaweedFS Object Storage
      ansible.builtin.import_role:
        name: object-storage
      when: platform_object_storage_enabled | bool

    - name: Deploy Elasticsearch with Basic license features
      ansible.builtin.import_role:
        name: elasticsearch
      when: platform_elasticsearch_enabled | bool

    - name: Deploy Observability Stack
      ansible.builtin.import_role:
        name: k8s-observability
      when: platform_observability_enabled | bool

    - name: Configure bastion log shipping with Elasticsearch CA verification
      ansible.builtin.include_role:
        name: network-security
        tasks_from: filebeat
      when:
        - platform_elasticsearch_enabled | bool
        - bastion_log_shipping | bool

    - name: Deploy Databases
      ansible.builtin.import_role:
        name: k8s-databases
      when:
        - platform_databases_enabled | bool
        - platform_postgresql_enabled | bool or platform_mongodb_enabled | bool

    - name: Deploy Dragonfly (external Redis-compatible service)
      ansible.builtin.import_role:
        name: dragonfly
      when: platform_dragonfly_enabled | bool

    - name: Deploy GitLab CE
      ansible.builtin.import_role:
        name: gitlab-selfhosted
      when: platform_gitlab_enabled | bool

    - name: Deploy ArgoCD
      ansible.builtin.import_role:
        name: k8s-gitops
      when: platform_gitops_enabled | bool

    - name: Deploy KEDA Autoscaling
      ansible.builtin.import_role:
        name: k8s-autoscaling
      when: platform_autoscaling_enabled | bool

    - name: Deploy backup and restore automation
      ansible.builtin.import_role:
        name: backup-restore
      when: platform_backup_enabled | bool

  post_tasks:
    - name: Display deployment completion
      debug:
        msg: "Platform deployment complete!"
