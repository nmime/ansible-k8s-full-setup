    coroot_cluster_agent_cpu_limit: >-
      {{ coroot.cluster_agent.resources.cpu_limit | default(coroot_cluster_agent_cpu_limit) }}
    coroot_cluster_agent_memory_request: >-
      {{ coroot.cluster_agent.resources.memory_request | default(coroot_cluster_agent_memory_request) }}
    coroot_cluster_agent_memory_limit: >-
      {{ coroot.cluster_agent.resources.memory_limit | default(coroot_cluster_agent_memory_limit) }}
