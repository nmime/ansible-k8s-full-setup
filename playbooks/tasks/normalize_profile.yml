    hipaa_compliance: '{{ platform_hipaa_enabled }}'
    log_redaction_enabled: >-
      {{ compliance.hipaa.log_redaction_enabled | default(platform_hipaa_enabled) | bool }}

- name: Validate the dedicated Docker-smoke worker boundary
  ansible.builtin.assert:
    that:
      - gitlab_docker_host_runner_worker_index | int > 0
      - gitlab_docker_host_runner_worker_index | int <= worker_count | int
      - worker_count | int >= 2
    fail_msg: >-
      gitlab.runner.docker_host.enabled=true requires
      dedicated_worker_index to identify one worker inside
      infrastructure.workers.count. That node is tainted, excluded from the
      public load balancer and local-PV pool, and reserved for the protected
      digest-pinned DinD service.
  when: platform_gitlab_docker_host_runner_enabled | bool

- name: Validate the dedicated CI-build worker boundary
  ansible.builtin.assert:
    that:
      - gitlab_runner_worker_index | int >= 0
      - gitlab_runner_worker_index | int <= worker_count | int
      - >-
        gitlab_runner_worker_index | int == 0
        or gitlab_runner_worker_index | int !=
           gitlab_docker_host_runner_worker_index | int
    fail_msg: >-
      gitlab.runner.dedicated_worker_index must be zero (shared scheduling) or
      identify a real worker reserved for general and rootless image-build
      jobs. A dedicated CI-build worker must differ from the protected
      Docker-smoke worker so concurrent CI classes cannot exhaust one node.
  when: platform_gitlab_runner_enabled | bool

- name: Validate the shared CI job namespace
  ansible.builtin.assert:
    that:
      - >-
        gitlab_runner_job_namespace is match(
          '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
      - gitlab_runner_job_namespace | length <= 63
      - gitlab_runner_job_namespace != 'gitlab'
    fail_msg: >-
      gitlab.runner.namespace must be a dedicated Kubernetes DNS-label
      namespace and must not be the GitLab application namespace.
  when: platform_gitlab_runner_enabled | bool

- name: Validate the protected image-builder worker boundary
  ansible.builtin.assert:
    that:
      - gitlab_image_builder_runner_worker_index | int > 0
      - gitlab_image_builder_runner_worker_index | int <= worker_count | int
      - >-
        gitlab_image_builder_runner_worker_index | int !=
        gitlab_docker_host_runner_worker_index | int
    fail_msg: >-
      The rootless image-builder security exception requires its own real,
      NoSchedule-tainted worker, separate from privileged Docker smoke.
  when: platform_gitlab_image_builder_runner_enabled | bool

- name: Validate local SSD storage policy
  ansible.builtin.assert:
    that:
      - local_storage_class is match('^[a-z0-9]([a-z0-9.-]*[a-z0-9])?$')
      - local_storage_path is match('^/[A-Za-z0-9._/-]+$')
      - "'..' not in local_storage_path.split('/')"
      - local_storage_min_free_gib_per_node | int >= 20
      - local_storage_min_free_gib_per_node | int <= 1024
      - >-
        local_storage_enabled | bool
        or local_storage_class not in local_claim_storage_classes
    fail_msg: >-
      Local storage selections require local_storage.enabled=true, an absolute
      traversal-free path, and a 20-1024 GiB per-node free-space gate.
  vars:
    local_claim_storage_classes:
      - '{{ object_storage_master_storage_class }}'
      - '{{ object_storage_volume_storage_class }}'
      - '{{ object_storage_index_storage_class }}'
      - '{{ object_storage_filer_storage_class }}'
      - '{{ vault_data_storage_class }}'
      - '{{ vault_audit_storage_class }}'
      - '{{ postgresql_data_storage_class }}'
      - '{{ postgresql_repo_storage_class }}'
      - '{{ mongodb_data_storage_class }}'
      - '{{ elasticsearch.master.storage_class | default(storage_class) }}'
      - '{{ elasticsearch.data.storage_class | default(storage_class) }}'

- name: Validate the selected logging stack
  ansible.builtin.assert:
    that:
      - log_stack in ['loki', 'elk', 'efk']
    fail_msg: >-
      Invalid observability.logging.stack={{ log_stack }}. Select exactly one
      supported logging stack: loki, elk, or efk.

- name: Validate the selected Loki deployment mode
  ansible.builtin.assert:
    that:
      - loki_deployment_mode in ['single-binary', 'simple-scalable']
    fail_msg: >-
      Invalid observability.logging.deployment_mode={{ loki_deployment_mode }}.
      Select single-binary or simple-scalable.
  when: log_stack == 'loki'

- name: Validate the Elasticsearch logging dependency
  ansible.builtin.assert:
    that:
      - log_stack not in ['elk', 'efk'] or platform_elasticsearch_enabled | bool
    fail_msg: >-
      observability.logging.stack={{ log_stack }} requires
      elasticsearch.enabled=true. Select Loki or enable Elasticsearch.

- name: Validate Elasticsearch data redundancy for Elasticsearch-backed logging
  ansible.builtin.assert:
    that:
      - >-
        log_stack not in ['elk', 'efk'] or
        (elasticsearch.data.replicas |
         default(2 if resource_tier == 'production' else 1) | int) >= 2
    fail_msg: >-
      observability.logging.stack={{ log_stack }} requires at least two
      Elasticsearch data replicas so the default shard replica remains
      assigned. Set elasticsearch.data.replicas=2 or select Loki.

- name: Validate required private-cluster foundation features
  ansible.builtin.assert:
    that:
      - network.bastion.enabled | default(true) | bool
      - network.vpn.enabled | default(true) | bool
      - (kubernetes.cni | default('cilium')) == 'cilium'
      - kubernetes.features.gateway_api | default(true) | bool
      - kubernetes.features.hubble | default(true) | bool
      - kubernetes.features.encryption | default(true) | bool
      - kubernetes.features.network_policies | default(true) | bool
    fail_msg: >-
      This private-cluster architecture requires the bastion, Headscale VPN,
      Cilium, Gateway API, Hubble, Kubernetes secret encryption, and network
      policies. These are foundations rather than optional platform services.

- name: Validate parent and bundled component selections
  ansible.builtin.assert:
    that:
      - not platform_eso_enabled | bool or platform_secrets_enabled | bool
      - not eso_example_secret_enabled | bool or platform_eso_enabled | bool
      - not platform_postgresql_enabled | bool or platform_databases_enabled | bool
      - not platform_mongodb_enabled | bool or platform_databases_enabled | bool
      - not platform_gitlab_runner_enabled | bool or platform_gitlab_enabled | bool
      - not platform_gitlab_image_builder_runner_enabled | bool or
        platform_gitlab_runner_enabled | bool
      - not platform_gitlab_docker_host_runner_enabled | bool or
        platform_gitlab_runner_enabled | bool
      - not platform_pmm_enabled | bool or platform_observability_enabled | bool
      - not platform_tracing_enabled | bool or platform_observability_enabled | bool
      - not platform_tempo_enabled | bool or platform_tracing_enabled | bool
      - not platform_blackbox_enabled | bool or platform_observability_enabled | bool
      - not platform_coroot_enabled | bool or platform_observability_enabled | bool
      - not platform_observability_enabled | bool or observability.metrics.enabled | default(true) | bool
      - not platform_observability_enabled | bool or observability.logging.enabled | default(true) | bool
      - not platform_observability_enabled | bool or observability.grafana.enabled | default(true) | bool
    fail_msg: >-
      Invalid parent/child selection. ESO requires secrets; the example
      ExternalSecret demo fixture requires ESO; PostgreSQL and
      MongoDB require databases; the GitLab Runner requires GitLab; the
      isolated image-builder and Docker-smoke Runners require the standard
      Runner; PMM,
      tracing, Blackbox, and Coroot require observability; Tempo requires the
      tracing collector. The core observability role is one
      production bundle, so metrics, logging, and Grafana must stay enabled
      whenever observability.enabled=true.

- name: Validate HIPAA-oriented control dependencies
  ansible.builtin.assert:
    that:
      - platform_secrets_enabled | bool
      - platform_observability_enabled | bool
      - log_redaction_enabled | bool
    fail_msg: >-
      HIPAA-oriented controls require secrets and observability so Vault TLS,
      Cilium encryption, host auditing, and log redaction can all be enforced.
  when: platform_hipaa_enabled | bool

- name: Validate required GitLab external service dependencies
  ansible.builtin.assert:
    that:
      - platform_postgresql_enabled | bool
      - platform_dragonfly_enabled | bool
      - platform_object_storage_enabled | bool
    fail_msg: >-
      GitLab chart 10 requires external PostgreSQL, Redis-compatible storage,
      and object storage. Enable databases.postgresql, dragonfly, and storage
      in the selected platform profile.
  when: platform_gitlab_enabled | bool

- name: Validate GlitchTip external service dependencies
  ansible.builtin.assert:
    that:
      - platform_postgresql_enabled | bool
      - platform_dragonfly_enabled | bool
    fail_msg: >-
      GlitchTip requires PostgreSQL and Dragonfly. Enable
      databases.postgresql and dragonfly in the selected platform profile.
  when: platform_glitchtip_enabled | bool

- name: Validate APM external service dependency
  ansible.builtin.assert:
    that:
      - platform_elasticsearch_enabled | bool
    fail_msg: >-
      APM Server requires Elasticsearch. Enable elasticsearch in the selected
      platform profile.
  when: platform_apm_enabled | bool

- name: Validate Temporal external service dependencies
  ansible.builtin.assert:
    that:
      - platform_postgresql_enabled | bool
    fail_msg: >-
      Temporal requires PostgreSQL. Enable databases.postgresql in the
      selected platform profile.
  when: platform_temporal_enabled | bool

- name: Validate Postal external service dependency
  ansible.builtin.assert:
    that:
      - platform_dragonfly_enabled | bool
    fail_msg: >-
      Postal requires Dragonfly for its queue. Enable dragonfly in the
      selected platform profile.
  when: platform_postal_enabled | bool

- name: Validate the tracing backend selection
  ansible.builtin.assert:
    that:
      - tracing_backend in ['tempo', 'coroot']
      - tracing_backend != 'tempo' or platform_tempo_enabled | bool
      - tracing_backend != 'coroot' or platform_coroot_enabled | bool
      - not platform_tempo_enabled | bool or tracing_backend == 'tempo'
    fail_msg: >-
      tracing.backend must select exactly one available backend. Tempo requires
      tracing.tempo.enabled=true; Coroot requires coroot.enabled=true.
  when: platform_tracing_enabled | bool

- name: Validate Tempo object storage dependency
  ansible.builtin.assert:
    that:
      - platform_object_storage_enabled | bool
    fail_msg: >-
      Tempo tracing requires object storage. Enable storage in the selected
      platform profile.
  when: platform_tempo_enabled | bool

- name: Validate backup object storage dependency
  ansible.builtin.assert:
    that:
      - platform_object_storage_enabled | bool
    fail_msg: >-
      Backup automation requires object storage. Enable storage in the
      selected platform profile.
  when: platform_backup_enabled | bool

- name: Validate disaster-recovery backup dependency
  ansible.builtin.assert:
    that:
      - platform_backup_enabled | bool
      - platform_object_storage_enabled | bool
    fail_msg: >-
      External disaster recovery requires native backup automation and object
      storage. Enable disaster-recovery through the platform selector so all
      required backup layers are selected together.
  when: backup_dr_enabled | bool

- name: Validate email alerting dependency
  ansible.builtin.assert:
    that:
      - platform_observability_enabled | bool
      - platform_postal_enabled | bool
    fail_msg: >-
      Email alerting requires observability and Postal because Alertmanager is
      configured to use the in-cluster Postal SMTP service.
  when: platform_alerting_email_enabled | bool

- name: Validate Telegram alerting parent dependency
  ansible.builtin.assert:
    that:
      - platform_observability_enabled | bool
    fail_msg: >-
      Telegram alerting requires observability. Enable observability in the
      selected platform profile.
  when: platform_alerting_telegram_enabled | bool
